l_english:
 ywc_je_v03_c08_protection_eligibility:0 "Who May Ask for Protection"
 ywc_je_v03_c08_protection_eligibility_reason:0 "Who may truly ask for protection in this coastal case is answered by identity and contact: the port's actual treatment of residents, ship registries and trade lanes are examined first, the overseas protection claim answers on its own budget, and partners with real lanes, markets or diplomacy record their own stance; cultural or religious similarity alone is never licence to intervene."
 ywc_je_v03_c08_court_consul_boundary:0 "The Boundary between Court and Consulate"
 ywc_je_v03_c08_court_consul_boundary_reason:0 "Jurisdiction and assistance each stay in their own place: the court answers independently with a public trial, a limited joint session or a refusal of external adjudication, both sides fund interpreters, witnesses and travel from their own budgets, and residence follows the law as it stands; if the external state ties aid to commercial terms, the jurisdiction accepts or refuses separately, and no one consents on another's behalf."
 ywc_je_v03_c08_protection_promise_settlement:0 "Where the Protection Promise Rests"
 ywc_je_v03_c08_protection_promise_settlement_reason:0 "Promises finally rest on paper and practice: the single-case or mutual-recognition arrangement is confirmed by each side, residents' choices to stay or leave are recorded as made, and verdict enforcement and aid delivery are counted as they actually stand; refusal, withdrawal and failed fulfillment enter the same ledger, and open questions continue through normal play."
 ywc_crisis.1700.t:0 "Two Proofs of Identity"
 ywc_crisis.1700.d:0 "The same coastal residents are recorded differently in the household register, the ship registry and the lane logs. The port jurisdiction must reconcile them line by line: who actually lives here, which flag each ship sails under, and whether the real contact with the outside runs through lanes, markets or diplomacy. Identity is settled before protection is discussed."
 ywc_crisis.1700.full_registry_review:0 "Reconcile the household, ship and lane registers line by line"
 ywc_crisis.1700.full_registry_review.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1700.full_registry_review.consequence_tooltip:0 "The scope of review is registered as the baseline for resettlement and adjudication."
 ywc_crisis.1700.ship_and_crew_focus:0 "Review only ship registries and crew rosters; the land question waits"
 ywc_crisis.1700.ship_and_crew_focus.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1700.ship_and_crew_focus.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1700.wait:0 "Wait and recheck the registers"
 ywc_crisis.1700.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1700.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1701.t:0 "More than One Protector"
 ywc_crisis.1701.d:0 "More than one voice asks for protection: residents of the port speak of naturalization and daily differential treatment, the overseas claimant speaks of consular notes and aid, merchants speak of lanes and warehouses. Register the three claims separately, and let no country write the whole community up as its proxy."
 ywc_crisis.1701.separate_local_claims:0 "Register resident claims as local civil matters; forward the consular claim separately"
 ywc_crisis.1701.separate_local_claims.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1701.separate_local_claims.consequence_tooltip:0 "The claim categories are registered; the note goes to the external claimant for its own answer."
 ywc_crisis.1701.route_through_note:0 "Route everything through the external note, local claims appended"
 ywc_crisis.1701.route_through_note.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1701.route_through_note.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1701.merchant_separate:0 "Keep merchant interests in a separate register, unbound from the protection claims"
 ywc_crisis.1701.merchant_separate.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1701.merchant_separate.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1701.wait:0 "Wait and sort the claims again"
 ywc_crisis.1701.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1701.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1702.t:0 "The Note from Across the Sea"
 ywc_crisis.1702.d:0 "The protection note from across the sea is on the table. The external state answers on its own budget and under its own statutes: fund legal aid and carry the exchange, send only limited representatives to observe, or declare non-intervention. The answer is its own, recorded under its own name; it does not answer for the port."
 ywc_crisis.1702.fund_legal_aid:0 "Fund legal aid (200); the note is formally served"
 ywc_crisis.1702.fund_legal_aid.cost_tooltip:0 "This country's treasury pays 200, sent directly to the port jurisdiction."
 ywc_crisis.1702.fund_legal_aid.consequence_tooltip:0 "The aid is recorded on the port; both sides enter their own funding procedure."
 ywc_crisis.1702.limited_representation:0 "Send limited representatives only; no funds committed"
 ywc_crisis.1702.limited_representation.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1702.limited_representation.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1702.declare_non_intervention:0 "Declare non-intervention and withdraw the protection claim"
 ywc_crisis.1702.declare_non_intervention.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1702.declare_non_intervention.consequence_tooltip:0 "The external state closes as withdrawn; the port's domestic procedure continues."
 ywc_crisis.1702.wait:0 "Wait before responding"
 ywc_crisis.1702.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1702.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1703.t:0 "The Local Court's Answer on Jurisdiction"
 ywc_crisis.1703.d:0 "The court answers the question of jurisdiction itself: a public trial under the law as it stands, a limited joint session for this one case, or a refusal of external adjudication that recognizes local procedure alone. The answer is the port's own; whether the external state accepts it is that state's separate decision, and the court defaults for no one."
 ywc_crisis.1703.public_trial:0 "Hold a public trial under the law as it stands"
 ywc_crisis.1703.public_trial.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1703.public_trial.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1703.limited_joint_session:0 "Convene a limited joint session for this case; external observers sit within bounds"
 ywc_crisis.1703.limited_joint_session.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1703.limited_joint_session.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1703.refuse_external:0 "Refuse external adjudication; local procedure alone is recognized"
 ywc_crisis.1703.refuse_external.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1703.refuse_external.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1703.wait:0 "Wait and deliberate jurisdiction again"
 ywc_crisis.1703.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1703.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1704.t:0 "Interpreters, Witnesses and Travel Money"
 ywc_crisis.1704.d:0 "Procedure costs money and the money can only come from each side's own budget: interpreters hired from the languages actually available locally, witnesses' travel reimbursed as incurred, and a small treasury starts with this one case. Each side keeps its own accounts; neither shifts procedural costs onto the other."
 ywc_crisis.1704.fund_full_program:0 "Fund the full procedural program (300)"
 ywc_crisis.1704.fund_full_program.cost_tooltip:0 "The holder's treasury pays 300."
 ywc_crisis.1704.fund_full_program.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1704.single_case_first:0 "Start with the single case; pay the minimal outlay (100)"
 ywc_crisis.1704.single_case_first.cost_tooltip:0 "The holder's treasury pays 100."
 ywc_crisis.1704.single_case_first.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1704.fund_full_share:0 "Fund the full external share (300)"
 ywc_crisis.1704.fund_full_share.cost_tooltip:0 "The holder's treasury pays 300."
 ywc_crisis.1704.fund_full_share.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1704.minimal_share:0 "Fund only the minimal external share (100)"
 ywc_crisis.1704.minimal_share.cost_tooltip:0 "The holder's treasury pays 100."
 ywc_crisis.1704.minimal_share.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1704.wait:0 "Wait and recheck the outlay"
 ywc_crisis.1704.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1704.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1705.t:0 "The People Who Live Here"
 ywc_crisis.1705.d:0 "The case lands on the people who live here: naturalization follows the law as it stands, residence gets bounded permits, differential treatment is kept as it actually is. The court writes its papers under the law; it does not fake equality beyond the law or legislate in the assembly's name."
 ywc_crisis.1705.lawful_naturalization:0 "Receive naturalization applications under the law as it stands"
 ywc_crisis.1705.lawful_naturalization.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1705.lawful_naturalization.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1705.bounded_residence:0 "Grant bounded residence permits only; citizenship stays out of reach"
 ywc_crisis.1705.bounded_residence.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1705.bounded_residence.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1705.keep_differential:0 "Keep differential treatment as the current law provides"
 ywc_crisis.1705.keep_differential.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1705.keep_differential.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1705.wait:0 "Wait and read the law again"
 ywc_crisis.1705.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1705.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1706.t:0 "The Protest outside the Consulate"
 ywc_crisis.1706.d:0 "A crowd gathers outside the consulate: some hand in petitions, some only ask to see the consul, some block the gate. The port disposes under its assembly rules as they stand: receive the lawful petitions, restrict assemblies for public order, or route the demands into the ongoing talks. What is read is the actual political rights and movements, not an imagined order."
 ywc_crisis.1706.receive_petitions:0 "Receive the lawful petitions and register them"
 ywc_crisis.1706.receive_petitions.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1706.receive_petitions.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1706.restrict_assemblies:0 "Restrict the assemblies under the public-order rules"
 ywc_crisis.1706.restrict_assemblies.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1706.restrict_assemblies.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1706.route_to_talks:0 "Route the demands into the ongoing talks"
 ywc_crisis.1706.route_to_talks.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1706.route_to_talks.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1706.wait:0 "Wait and read the rules again"
 ywc_crisis.1706.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1706.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1707.t:0 "Conditions Attached to Protection"
 ywc_crisis.1707.d:0 "The external state's aid reaches the gate of attached conditions: tie the aid to exclusive commercial rights, drop the conditions and aid as listed, or withdraw the note outright. The port jurisdiction answers the conditions separately - accept them, refuse what is attached, or hold. The two answers keep their own ledgers; neither signs for the other."
 ywc_crisis.1707.tie_aid_to_terms:0 "Tie the aid to exclusive commercial rights"
 ywc_crisis.1707.tie_aid_to_terms.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1707.tie_aid_to_terms.consequence_tooltip:0 "The conditions are registered; the port answers separately and the external state waits."
 ywc_crisis.1707.aid_without_conditions:0 "Drop the conditions; aid as listed"
 ywc_crisis.1707.aid_without_conditions.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1707.aid_without_conditions.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1707.withdraw_note:0 "Withdraw the note; the aid goes with it"
 ywc_crisis.1707.withdraw_note.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1707.withdraw_note.consequence_tooltip:0 "Relations with the port drop by 2; the external state closes as withdrawn."
 ywc_crisis.1707.accept_note_terms:0 "Accept the note's terms; the aid takes effect as listed"
 ywc_crisis.1707.accept_note_terms.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1707.accept_note_terms.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1707.refuse_conditions:0 "Refuse the attached conditions; the aid returns to negotiation"
 ywc_crisis.1707.refuse_conditions.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1707.refuse_conditions.consequence_tooltip:0 "Relations with the external state drop by 2; the refusal stays on record and the full arrangement is no longer available."
 ywc_crisis.1707.wait:0 "Wait before disposing"
 ywc_crisis.1707.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1707.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1708.t:0 "One Case First, Then General Rules"
 ywc_crisis.1708.d:0 "Time to set rules: single-case arbitration for this one dispute keeps sovereignty but moves slowly; mutual recognition of verdicts moves faster but needs registries, service and enforcement that actually exist; or the local forum alone is kept and no general rules are negotiated. The port proposes; the external state answers for itself."
 ywc_crisis.1708.propose_single_case:0 "Propose single-case arbitration for this case; general rules wait"
 ywc_crisis.1708.propose_single_case.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1708.propose_single_case.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1708.propose_mutual_recognition:0 "Propose mutual recognition of verdicts, on the registries and enforcement that exist"
 ywc_crisis.1708.propose_mutual_recognition.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1708.propose_mutual_recognition.consequence_tooltip:0 "The recognition proposal rests on the registries and enforcement actually built; without them only the single case stands."
 ywc_crisis.1708.keep_local_forum:0 "Keep the local forum alone; no general rules"
 ywc_crisis.1708.keep_local_forum.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1708.keep_local_forum.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1708.wait:0 "Wait and draft again"
 ywc_crisis.1708.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1708.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1709.t:0 "Let the Residents Choose"
 ywc_crisis.1709.d:0 "The last question is about people, not clauses: recognize the residents' choice of residence or naturalization and keep an exit from protection open; or recognize residence without the exit; or keep the current rules. Both sides vote separately, and each choice binds only its own side."
 ywc_crisis.1709.recognize_choice_and_exit:0 "Recognize residence and naturalization choices; keep an exit from protection open"
 ywc_crisis.1709.recognize_choice_and_exit.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1709.recognize_choice_and_exit.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1709.recognize_residence_only:0 "Recognize residence only; no exit from protection"
 ywc_crisis.1709.recognize_residence_only.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1709.recognize_residence_only.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1709.keep_current_rules:0 "Keep the current rules; residents' choices are handled case by case"
 ywc_crisis.1709.keep_current_rules.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1709.keep_current_rules.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1709.recognize_and_accept_forum:0 "Recognize the residents' choices and stand ready to accept the jurisdiction's arrangement"
 ywc_crisis.1709.recognize_and_accept_forum.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1709.recognize_and_accept_forum.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1709.nmg_residence_only:0 "Recognize residence only; accept single-case assistance only"
 ywc_crisis.1709.nmg_residence_only.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1709.nmg_residence_only.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1709.nmg_keep_current:0 "Keep the current rules; no external forum arrangement"
 ywc_crisis.1709.nmg_keep_current.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1709.nmg_keep_current.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1709.wait:0 "Wait before the vote"
 ywc_crisis.1709.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1709.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1710.t:0 "The Verdict Reaches Another Port"
 ywc_crisis.1710.d:0 "Verdicts and promises must land on the port across the water: the full arrangement needs both - court answer, funding, conditions and the residents' choice all in place; a limited arrangement signs first and lists what stays open; or the status quo is kept. The external state may accept on record or refuse and withdraw; open items stay honestly on file."
 ywc_crisis.1710.confirm_full:0 "Confirm the full arrangement: court, funding, conditions and the residents' choice all in place"
 ywc_crisis.1710.confirm_full.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1710.confirm_full.consequence_tooltip:0 "The full arrangement stands; the external state's acceptance is on record and the aftermath follows."
 ywc_crisis.1710.confirm_limited:0 "Sign the limited arrangement first; open items listed for later talks"
 ywc_crisis.1710.confirm_limited.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1710.confirm_limited.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1710.keep_status_quo:0 "Keep the status quo; the current usage stands"
 ywc_crisis.1710.keep_status_quo.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1710.keep_status_quo.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1710.accept_on_record:0 "The external state accepts on record and awaits the port's confirmation"
 ywc_crisis.1710.accept_on_record.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1710.accept_on_record.consequence_tooltip:0 "The acceptance is on record; once the port confirms, both sides share one ledger, and a port that never settles closes as status quo."
 ywc_crisis.1710.refuse_withdraw:0 "The external state refuses and leaves this round"
 ywc_crisis.1710.refuse_withdraw.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1710.refuse_withdraw.consequence_tooltip:0 "Relations with the port drop by 3; the external state closes as withdrawn."
 ywc_crisis.1710.wait:0 "Wait before confirming"
 ywc_crisis.1710.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1710.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1711.t:0 "The Next Hearing without a Consul"
 ywc_crisis.1711.d:0 "When the next hearing convenes, the consular seat may stand empty - the court proceeds on the law, administrative capability and fulfillment history that actually exist. The port records the aftermath honestly: rules land in registers and classrooms, aid is accounted as actually delivered, and open questions pass to normal play. Partners with real lanes record their own stance, speaking for no one else."
 ywc_crisis.1711.record_aftermath_kept:0 "Record the rules and the aid as actually practiced"
 ywc_crisis.1711.record_aftermath_kept.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1711.record_aftermath_kept.consequence_tooltip:0 "The aftermath record is shared with the external state and the real partners; the capacity slot is released."
 ywc_crisis.1711.record_fulfillment_failed:0 "Record the fulfillment failure honestly; open questions pass to normal play"
 ywc_crisis.1711.record_fulfillment_failed.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1711.record_fulfillment_failed.consequence_tooltip:0 "Fulfillment failure is recorded; the remaining questions continue through normal play."
 ywc_crisis.1711.continue_legal_line:0 "The partner continues the legal-aid channel"
 ywc_crisis.1711.continue_legal_line.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1711.continue_legal_line.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1711.case_records_only:0 "The partner keeps case records only; no follow-up"
 ywc_crisis.1711.case_records_only.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1711.case_records_only.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1711.normalize_relations:0 "The partner returns to ordinary relations and does not press the case"
 ywc_crisis.1711.normalize_relations.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1711.normalize_relations.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1711.wait:0 "Wait before recording"
 ywc_crisis.1711.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1711.wait.consequence_tooltip:0 "Records this decision."
