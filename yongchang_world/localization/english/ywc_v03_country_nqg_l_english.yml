l_english:
 ywc_je_v03_nqg_winter_court:0 "Winter Grain for One Court"
 ywc_je_v03_nqg_winter_court_reason:0 "Stipends, winter uniforms and household grain compete for one stock. Open the books before deciding who gets less."
 ywc_je_v03_nqg_winter_review:0 "The Midwinter Count"
 ywc_je_v03_nqg_winter_review_reason:0 "When the ledger and the granary disagree, count before you move grain."
 ywc_je_v03_nqg_winter_settlement:0 "Settling the Winter"
 ywc_je_v03_nqg_winter_settlement_reason:0 "By winter's end the court must say whether this grain arrangement survives to the next one."
 ywc_nqg.1000.t:0 "Winter Grain for One Court"
 ywc_nqg.1000.d:0 "Stipends, winter uniforms and household grain draw on one stock; the household office says the granary covers barely half."
 ywc_nqg.1000.cap_stipend:0 "Cap the Stipends"
 ywc_nqg.1000.cap_stipend.cost_tooltip:0 "If current finances allow, this deducts a one-time filing fee fixed at admission as annual gross income ÷ 52 (minimum 100, maximum 1,000,000,000). No second filing fee is charged; any later treasury deduction is stated with that choice."
 ywc_nqg.1000.cap_stipend.consequence_tooltip:0 "The clan grumbles, but the granary shows a real surplus for the first time."
 ywc_nqg.1000.local_share:0 "Let the Districts Carry Part"
 ywc_nqg.1000.local_share.cost_tooltip:0 "If current finances allow, this deducts a one-time filing fee fixed at admission as annual gross income ÷ 52 (minimum 100, maximum 1,000,000,000). No second filing fee is charged; any later treasury deduction is stated with that choice."
 ywc_nqg.1000.local_share.consequence_tooltip:0 "District finances tighten while the central granary breathes."
 ywc_nqg.1000.grain_loan:0 "Ask Shun for grain aid"
 ywc_nqg.1000.grain_loan.cost_tooltip:0 "If current finances allow, this deducts a one-time filing fee fixed at admission as annual gross income ÷ 52 (minimum 100, maximum 1,000,000,000). The inquiry itself is free: no grain, cash or debt moves until a real reply."
 ywc_nqg.1000.grain_loan.consequence_tooltip:0 "Only Shun receives this inquiry. After its separate answer, Northern Qing decides on captured terms against an actual grain flow; a local marker is never consent."
 ywc_nqg.1000.grain_loan_rus:0 "Ask Russia for grain aid"
 ywc_nqg.1000.grain_loan_rus.cost_tooltip:0 "If current finances allow, this deducts a one-time filing fee fixed at admission as annual gross income ÷ 52 (minimum 100, maximum 1,000,000,000). The inquiry itself is free: no grain, cash or debt moves until a real reply."
 ywc_nqg.1000.grain_loan_rus.consequence_tooltip:0 "Only Russia receives this inquiry. After its separate answer, Northern Qing decides on captured terms against an actual grain flow; a local marker is never consent."
 ywc_nqg.1000.grain_loan_jap:0 "Ask Japan for grain aid"
 ywc_nqg.1000.grain_loan_jap.cost_tooltip:0 "If current finances allow, this deducts a one-time filing fee fixed at admission as annual gross income ÷ 52 (minimum 100, maximum 1,000,000,000). The inquiry itself is free: no grain, cash or debt moves until a real reply."
 ywc_nqg.1000.grain_loan_jap.consequence_tooltip:0 "Only Japan receives this inquiry. After its separate answer, Northern Qing decides on captured terms against an actual grain flow; a local marker is never consent."
 ywc_nqg.1000.defer:0 "Defer: read the books first"
 ywc_nqg.1000.defer.cost_tooltip:0 "No new cost; this month's window is lost."
 ywc_nqg.1000.defer.consequence_tooltip:0 "Nothing changes; the offer returns later."
 ywc_nqg.1000.withdraw:0 "Withdraw: stop pushing this line"
 ywc_nqg.1000.withdraw.cost_tooltip:0 "Fees already paid and terms already signed are not refunded."
 ywc_nqg.1000.withdraw.consequence_tooltip:0 "The line is recorded as frustrated and the slot frees up; old debts stand."
 ywc_nqg.1001.t:0 "What the Ceiling Covers"
 ywc_nqg.1001.d:0 "Once the ceiling is set, the clan demands its exceptions in writing, and the inner court asks whether the cap applies to anyone but them."
 ywc_nqg.1001.cap_household:0 "Cap the Clan Too"
 ywc_nqg.1001.cap_household.cost_tooltip:0 "The clan and its branches draw the new rate with no exceptions."
 ywc_nqg.1001.cap_household.consequence_tooltip:0 "Legitimacy suffers briefly, but the apportionment gains one standard."
 ywc_nqg.1001.cap_exempt_clan:0 "Exempt the Clan"
 ywc_nqg.1001.cap_exempt_clan.cost_tooltip:0 "Keep the clan at the old rate and close the gap from the household quota."
 ywc_nqg.1001.cap_exempt_clan.consequence_tooltip:0 "Household burdens rise and district complaints accumulate."
 ywc_nqg.1001.defer:0 "Defer: read the books first"
 ywc_nqg.1001.defer.cost_tooltip:0 "No new cost; this month's window is lost."
 ywc_nqg.1001.defer.consequence_tooltip:0 "Nothing changes; the offer returns later."
 ywc_nqg.1001.withdraw:0 "Withdraw: stop pushing this line"
 ywc_nqg.1001.withdraw.cost_tooltip:0 "Fees already paid and terms already signed are not refunded."
 ywc_nqg.1001.withdraw.consequence_tooltip:0 "The line is recorded as frustrated and the slot frees up; old debts stand."
 ywc_nqg.1002.t:0 "The Registers the Districts Sent Up"
 ywc_nqg.1002.d:0 "District registers overstate the granary by a fifth. Pay by the book, or send clerks to count?"
 ywc_nqg.1002.audit_districts:0 "Count Before Paying"
 ywc_nqg.1002.audit_districts.cost_tooltip:0 "Send office clerks to count, delaying distribution a month."
 ywc_nqg.1002.audit_districts.consequence_tooltip:0 "The books become true; officials and grain merchants both resent it."
 ywc_nqg.1002.pay_by_register:0 "Pay by the Register"
 ywc_nqg.1002.pay_by_register.cost_tooltip:0 "No new cost."
 ywc_nqg.1002.pay_by_register.consequence_tooltip:0 "Distribution is fast and the shortfall waits for the next count."
 ywc_nqg.1002.defer:0 "Defer: read the books first"
 ywc_nqg.1002.defer.cost_tooltip:0 "No new cost; this month's window is lost."
 ywc_nqg.1002.defer.consequence_tooltip:0 "Nothing changes; the offer returns later."
 ywc_nqg.1002.withdraw:0 "Withdraw: stop pushing this line"
 ywc_nqg.1002.withdraw.cost_tooltip:0 "Fees already paid and terms already signed are not refunded."
 ywc_nqg.1002.withdraw.consequence_tooltip:0 "The line is recorded as frustrated and the slot frees up; old debts stand."
 ywc_nqg.1003.t:0 "Winter Uniforms for the Guard"
 ywc_nqg.1003.d:0 "The guard commander needs cloth or fewer men. Fewer men means a thinner watch."
 ywc_nqg.1003.cap_soldiers:0 "Trim the Ranks, Keep the Cloth"
 ywc_nqg.1003.cap_soldiers.cost_tooltip:0 "Set the muster to the cloth on hand and return the rest to the fields."
 ywc_nqg.1003.cap_soldiers.consequence_tooltip:0 "The watch thins; both the wage bill and the cloth pressure fall."
 ywc_nqg.1003.keep_full_guard:0 "Keep Full Strength and Buy Cloth"
 ywc_nqg.1003.keep_full_guard.cost_tooltip:0 "A successful choice deducts half the admission-snapshotted filing fee (annual gross income ÷ 104, minimum 50, maximum 500,000,000). This additional payment requires that amount in current reserves; on failure the current event stays available."
 ywc_nqg.1003.keep_full_guard.consequence_tooltip:0 "The watch stays whole; part of the surplus is eaten."
 ywc_nqg.1003.defer:0 "Defer: read the books first"
 ywc_nqg.1003.defer.cost_tooltip:0 "No new cost; this month's window is lost."
 ywc_nqg.1003.defer.consequence_tooltip:0 "Nothing changes; the offer returns later."
 ywc_nqg.1003.withdraw:0 "Withdraw: stop pushing this line"
 ywc_nqg.1003.withdraw.cost_tooltip:0 "Fees already paid and terms already signed are not refunded."
 ywc_nqg.1003.withdraw.consequence_tooltip:0 "The line is recorded as frustrated and the slot frees up; old debts stand."
 ywc_nqg.1004.t:0 "Grain Prices and the Island Market"
 ywc_nqg.1004.d:0 "Island grain prices exceed the outer harbour's, and merchants ship grain out. Restrict, subsidise, or open?"
 ywc_nqg.1004.cap_market:0 "Restrict Exports and Sell at Cost"
 ywc_nqg.1004.cap_market.cost_tooltip:0 "Ban grain leaving the island and sell from the official granary at cost."
 ywc_nqg.1004.cap_market.consequence_tooltip:0 "Prices steady; merchant margins fall and smuggling rises."
 ywc_nqg.1004.let_market_run:0 "Open It and Tax It"
 ywc_nqg.1004.let_market_run.cost_tooltip:0 "No new cost."
 ywc_nqg.1004.let_market_run.consequence_tooltip:0 "Prices follow the market; revenue rises but never settles."
 ywc_nqg.1004.defer:0 "Defer: read the books first"
 ywc_nqg.1004.defer.cost_tooltip:0 "No new cost; this month's window is lost."
 ywc_nqg.1004.defer.consequence_tooltip:0 "Nothing changes; the offer returns later."
 ywc_nqg.1004.withdraw:0 "Withdraw: stop pushing this line"
 ywc_nqg.1004.withdraw.cost_tooltip:0 "Fees already paid and terms already signed are not refunded."
 ywc_nqg.1004.withdraw.consequence_tooltip:0 "The line is recorded as frustrated and the slot frees up; old debts stand."
 ywc_nqg.1005.t:0 "No Reply Is Recorded"
 ywc_nqg.1005.d:0 "A reply may or may not be on the books. A pact and reserves show eligibility only; only the actual invited country answering on the captured terms can be signed. The court may accept, keep waiting, or take the domestic route."
 ywc_nqg.1005.take_loan_terms:0 "Accept the Captured Aid Terms"
 ywc_nqg.1005.take_loan_terms.cost_tooltip:0 "A new signature requires the partner’s acceptance and actual grain flow; an existing signed agreement is not charged twice here."
 ywc_nqg.1005.take_loan_terms.consequence_tooltip:0 "Continue under the current actual agreement; a domestic marker alone cannot invent partner consent or grain flow."
 ywc_nqg.1005.refuse_loan_terms:0 "Continue Without External Grain Aid"
 ywc_nqg.1005.refuse_loan_terms.cost_tooltip:0 "No additional fee; no loan or debt is created."
 ywc_nqg.1005.refuse_loan_terms.consequence_tooltip:0 "If you requested external grain aid, switch to the domestic stipend-cap route; existing domestic routes stay selected. Domestic staffing and finance requirements still apply. No outside grain is counted as received."
 ywc_nqg.1005.defer:0 "Defer: read the books first"
 ywc_nqg.1005.defer.cost_tooltip:0 "No new cost; this month's window is lost."
 ywc_nqg.1005.defer.consequence_tooltip:0 "Nothing changes; the offer returns later."
 ywc_nqg.1005.withdraw:0 "Withdraw: stop pushing this line"
 ywc_nqg.1005.withdraw.cost_tooltip:0 "Fees already paid and terms already signed are not refunded."
 ywc_nqg.1005.withdraw.consequence_tooltip:0 "The line is recorded as frustrated and the slot frees up; old debts stand."
 ywc_nqg.1006.t:0 "The Late-Winter Count"
 ywc_nqg.1006.d:0 "Halfway through winter, granary, register and household ration can be compared for the first time."
 ywc_nqg.1006.publish_count:0 "Publish the Count"
 ywc_nqg.1006.publish_count.cost_tooltip:0 "No new cost."
 ywc_nqg.1006.publish_count.consequence_tooltip:0 "Legitimacy rises, and every gap must be explained."
 ywc_nqg.1006.keep_count_quiet:0 "Keep the Count Quiet"
 ywc_nqg.1006.keep_count_quiet.cost_tooltip:0 "No new cost."
 ywc_nqg.1006.keep_count_quiet.consequence_tooltip:0 "Easier for now; district suspicion deepens."
 ywc_nqg.1006.defer:0 "Defer: read the books first"
 ywc_nqg.1006.defer.cost_tooltip:0 "No new cost; this month's window is lost."
 ywc_nqg.1006.defer.consequence_tooltip:0 "Nothing changes; the offer returns later."
 ywc_nqg.1006.withdraw:0 "Withdraw: stop pushing this line"
 ywc_nqg.1006.withdraw.cost_tooltip:0 "Fees already paid and terms already signed are not refunded."
 ywc_nqg.1006.withdraw.consequence_tooltip:0 "The line is recorded as frustrated and the slot frees up; old debts stand."
 ywc_nqg.1007.t:0 "The Granary Next Year"
 ywc_nqg.1007.d:0 "The year is over. Decide whether this grain arrangement was an emergency or a standing rule."
 ywc_nqg.1007.make_standing_rule:0 "Make It a Standing Rule"
 ywc_nqg.1007.make_standing_rule.cost_tooltip:0 "No new cost."
 ywc_nqg.1007.make_standing_rule.consequence_tooltip:0 "The same quota recurs each year, and the court loses room for emergency levies."
 ywc_nqg.1007.keep_emergency:0 "Keep It Provisional"
 ywc_nqg.1007.keep_emergency.cost_tooltip:0 "No new cost."
 ywc_nqg.1007.keep_emergency.consequence_tooltip:0 "Room for levies stays open, but every year is renegotiated."
 ywc_nqg.1007.defer:0 "Defer: read the books first"
 ywc_nqg.1007.defer.cost_tooltip:0 "No new cost; this month's window is lost."
 ywc_nqg.1007.defer.consequence_tooltip:0 "Nothing changes; the offer returns later."
 ywc_nqg.1007.withdraw:0 "Withdraw: stop pushing this line"
 ywc_nqg.1007.withdraw.cost_tooltip:0 "Fees already paid and terms already signed are not refunded."
 ywc_nqg.1007.withdraw.consequence_tooltip:0 "The line is recorded as frustrated and the slot frees up; old debts stand."
 ywc_nqg.1008.t:0 "Grain Left on the Island"
 ywc_nqg.1008.d:0 "A little grain is left. Hold it as next year's buffer, or sell it at the outer harbour?"
 ywc_nqg.1008.hold_buffer:0 "Hold the Buffer"
 ywc_nqg.1008.hold_buffer.cost_tooltip:0 "No new cost."
 ywc_nqg.1008.hold_buffer.consequence_tooltip:0 "Next year is safer; ready money stays short this year."
 ywc_nqg.1008.sell_surplus:0 "Sell for Silver"
 ywc_nqg.1008.sell_surplus.cost_tooltip:0 "No new cost."
 ywc_nqg.1008.sell_surplus.consequence_tooltip:0 "Ready money rises; the buffer is gone."
 ywc_nqg.1008.defer:0 "Defer: read the books first"
 ywc_nqg.1008.defer.cost_tooltip:0 "No new cost; this month's window is lost."
 ywc_nqg.1008.defer.consequence_tooltip:0 "Nothing changes; the offer returns later."
 ywc_nqg.1008.withdraw:0 "Withdraw: stop pushing this line"
 ywc_nqg.1008.withdraw.cost_tooltip:0 "Fees already paid and terms already signed are not refunded."
 ywc_nqg.1008.withdraw.consequence_tooltip:0 "The line is recorded as frustrated and the slot frees up; old debts stand."
 ywc_nqg.1009.t:0 "Settlement: Can This Court Survive Winter"
 ywc_nqg.1009.d:0 "Weigh the apportionment, the guard and the grain price together; the winter grain question needs an answer."
 ywc_nqg.1009.settle_full:0 "Settle It as a Workable Grain Policy"
 ywc_nqg.1009.settle_full.cost_tooltip:0 "No new cost; requires all three decisions and six continuous months in place."
 ywc_nqg.1009.settle_full.consequence_tooltip:0 "The apportionment becomes standing and obligations are written into the register."
 ywc_nqg.1009.settle_compromise:0 "Carry It One More Year As Is"
 ywc_nqg.1009.settle_compromise.cost_tooltip:0 "No new cost."
 ywc_nqg.1009.settle_compromise.consequence_tooltip:0 "The policy barely holds, but the apportionment standard stays unresolved."
 ywc_nqg.1009.withdraw:0 "Withdraw: stop pushing this line"
 ywc_nqg.1009.withdraw.cost_tooltip:0 "Fees already paid and terms already signed are not refunded."
 ywc_nqg.1009.withdraw.consequence_tooltip:0 "The line is recorded as frustrated and the slot frees up; old debts stand."
 ywc_nqg.1009.acknowledge_12_month_notice:0 "Acknowledge the 12-Month Notice"
 ywc_nqg.1009.acknowledge_12_month_notice.cost_tooltip:0 "No new fee; prior costs remain sunk."
 ywc_nqg.1009.acknowledge_12_month_notice.consequence_tooltip:0 "The arrangement remains unqualified; normal work stays queued while the 36-month remedy remains due."
 ywc_nqg.1009.withdraw_after_36_month_notice:0 "Withdraw After the 36-Month Notice"
 ywc_nqg.1009.withdraw_after_36_month_notice.cost_tooltip:0 "No additional fee; prior costs are not refunded."
 ywc_nqg.1009.withdraw_after_36_month_notice.consequence_tooltip:0 "End the unworkable arrangement and release its slot."
 ywc_nqg.1009.start_36_month_limited_remedy:0 "Begin a Fresh Six-Month Watch for the Lower Target"
 ywc_nqg.1009.start_36_month_limited_remedy.cost_tooltip:0 "No new fee; prior costs remain sunk."
 ywc_nqg.1009.start_36_month_limited_remedy.consequence_tooltip:0 "If the lower target qualifies now, begin a new 180-day watch. It does not settle automatically."
 ywc_nqg.1030.t:0 "The Grain Aid Answer"
 ywc_nqg.1030.d:0 "Northern Qing requests grain aid with a captured repayment total of @money![SCOPE.GetValue('ywc_nqg_aid_request_total')|0v], earned in monthly installments over three months while grain actually flows. Accepting the inquiry does not ship grain automatically; signature still requires real grain imports from this recipient. Only the invited country can answer."
 ywc_nqg.1030.accept:0 "Grant Grain on the Captured Terms"
 ywc_nqg.1030.accept.cost_tooltip:0 "The provider collects nothing here; after acceptance Northern Qing pays the captured total in three monthly installments."
 ywc_nqg.1030.accept.consequence_tooltip:0 "The answer fixes this generation and total; Northern Qing must still show an actual grain flow before signing."
 ywc_nqg.1030.refuse:0 "Refuse the Grain Request"
 ywc_nqg.1030.refuse.cost_tooltip:0 "Neither treasury is charged."
 ywc_nqg.1030.refuse.consequence_tooltip:0 "Northern Qing receives the refusal and may take the domestic stipend-cap route; the filing fee already paid is not refunded."
 ywc_nqg.1030.stale_dismiss:0 "Dismiss a Stale Inquiry"
 ywc_nqg.1030.stale_dismiss.cost_tooltip:0 "No payment."
 ywc_nqg.1030.stale_dismiss.consequence_tooltip:0 "A stale inquiry cannot rewrite a later aid offer."
 ywc_nqg.1031.t:0 "The Grain Aid Ledger"
 ywc_nqg.1031.d:0 "Northern Qing handles the aid’s status locally: inquiry, accepted terms, refusal, expiry, a lost partner, or an active contract’s three installments and arrears. Signing requires an actual grain flow; earned debt survives a domestic alternative. Once accepted, the three-month response period begins when this menu is delivered, not while it waits in the queue."
 ywc_nqg.1031.sign_terms:0 "Accept the Fixed Aid Terms"
 ywc_nqg.1031.sign_terms.cost_tooltip:0 "Signature collects nothing; each of three monthly inspections pays one third of the captured total."
 ywc_nqg.1031.sign_terms.consequence_tooltip:0 "Only the grain district and markets captured at signature count; a changed source needs a new inquiry."
 ywc_nqg.1031.decline:0 "Decline the Aid"
 ywc_nqg.1031.decline.cost_tooltip:0 "This choice charges nothing."
 ywc_nqg.1031.decline.consequence_tooltip:0 "Unsigned work ends; earned arrears remain."
 ywc_nqg.1031.wait_terms:0 "Keep the Inquiry and Wait"
 ywc_nqg.1031.wait_terms.cost_tooltip:0 "Waiting is free."
 ywc_nqg.1031.wait_terms.consequence_tooltip:0 "The three-month inquiry lifetime is not refreshed by redisplay; it lapses on schedule."
 ywc_nqg.1031.review_status:0 "Acknowledge This Status"
 ywc_nqg.1031.review_status.cost_tooltip:0 "This choice charges nothing."
 ywc_nqg.1031.review_status.consequence_tooltip:0 "Existing arrears and the monthly window remain."
 ywc_nqg.1031.domestic_route:0 "Take the Domestic Stipend Cap"
 ywc_nqg.1031.domestic_route.cost_tooltip:0 "This choice charges nothing; the domestic route keeps its existing costs."
 ywc_nqg.1031.domestic_route.consequence_tooltip:0 "Unsigned foreign work ends; signed contract debt remains payable."
 ywc_nqg.1031.retry_shu:0 "Retry with Great Shun"
 ywc_nqg.1031.retry_shu.cost_tooltip:0 "A new inquiry charges nothing; the previous balance must be settled and its window ended."
 ywc_nqg.1031.retry_shu.consequence_tooltip:0 "The retry has a new generation; old answers and terms cannot sign it."
 ywc_nqg.1031.retry_rus:0 "Retry with Russia"
 ywc_nqg.1031.retry_rus.cost_tooltip:0 "A new inquiry charges nothing; the previous balance must be settled and its window ended."
 ywc_nqg.1031.retry_rus.consequence_tooltip:0 "The retry has a new generation; old answers and terms cannot sign it."
 ywc_nqg.1031.retry_jap:0 "Retry with Japan"
 ywc_nqg.1031.retry_jap.cost_tooltip:0 "A new inquiry charges nothing; the previous balance must be settled and its window ended."
 ywc_nqg.1031.retry_jap.consequence_tooltip:0 "The retry has a new generation; old answers and terms cannot sign it."
 ywc_nqg.1031.stale_dismiss:0 "Dismiss a Stale Notice"
 ywc_nqg.1031.stale_dismiss.cost_tooltip:0 "No payment."
 ywc_nqg.1031.stale_dismiss.consequence_tooltip:0 "The stale notice leaves the current terms, debt and queues intact."
 ywc_nqg.1032.t:0 "The Aid Repayment Window Ends"
 ywc_nqg.1032.d:0 "The fixed three-month repayment window ends and only its own term marker is cleared; earned debt and paid records are untouched."
 ywc_je_v03_nqg_hunting_rights:0 "A Hunting Ground Is Not a Garden"
 ywc_je_v03_nqg_hunting_rights_reason:0 "Where the enclosure deed overlaps older community boundaries, settle whose line counts before cutting and grazing."
 ywc_nqg.1010.t:0 "A Hunting Ground Is Not a Garden"
 ywc_nqg.1010.d:0 "Royal enclosure cuts across slopes where island communities have cut wood and grazed for generations. The deed calls it a garden; they call it their forest."
 ywc_nqg.1010.co_manage:0 "Co-manage the Woods"
 ywc_nqg.1010.co_manage.cost_tooltip:0 "If current finances allow, this deducts a one-time filing fee fixed at admission as annual gross income ÷ 52 (minimum 100, maximum 1,000,000,000). No second filing fee is charged; any later treasury deduction is stated with that choice."
 ywc_nqg.1010.co_manage.consequence_tooltip:0 "Exclusive royal revenue falls and community resistance eases."
 ywc_nqg.1010.lease_dues:0 "Lease It for Dues"
 ywc_nqg.1010.lease_dues.cost_tooltip:0 "If current finances allow, this deducts a one-time filing fee fixed at admission as annual gross income ÷ 52 (minimum 100, maximum 1,000,000,000). No second filing fee is charged; any later treasury deduction is stated with that choice."
 ywc_nqg.1010.lease_dues.consequence_tooltip:0 "Revenue steadies, and every increase means renegotiation."
 ywc_nqg.1010.royal_close:0 "Close It and Pay Compensation"
 ywc_nqg.1010.royal_close.cost_tooltip:0 "If current finances allow, this deducts a one-time filing fee fixed at admission as annual gross income ÷ 52 (minimum 100, maximum 1,000,000,000). No second filing fee is charged; any later treasury deduction is stated with that choice."
 ywc_nqg.1010.royal_close.consequence_tooltip:0 "Each payment needs ready money, and communities will demand a say in assessing losses."
 ywc_nqg.1010.defer:0 "Defer: read the books first"
 ywc_nqg.1010.defer.cost_tooltip:0 "No new cost; this month's window is lost."
 ywc_nqg.1010.defer.consequence_tooltip:0 "Nothing changes; the offer returns later."
 ywc_nqg.1010.withdraw:0 "Withdraw: stop pushing this line"
 ywc_nqg.1010.withdraw.cost_tooltip:0 "Fees already paid and terms already signed are not refunded."
 ywc_nqg.1010.withdraw.consequence_tooltip:0 "The line is recorded as frustrated and the slot frees up; old debts stand."
 ywc_nqg.1011.t:0 "The Cutting Season"
 ywc_nqg.1011.d:0 "The charter exists, but cutting clashes hardest in spring. Fix a rotation, or let communities schedule themselves?"
 ywc_nqg.1011.rotation_rule:0 "Set the Rotation"
 ywc_nqg.1011.rotation_rule.cost_tooltip:0 "No new cost."
 ywc_nqg.1011.rotation_rule.consequence_tooltip:0 "Auditable and controlled, and communities feel governed one layer deeper."
 ywc_nqg.1011.community_calendar:0 "Let Communities Schedule"
 ywc_nqg.1011.community_calendar.cost_tooltip:0 "No new cost."
 ywc_nqg.1011.community_calendar.consequence_tooltip:0 "Conflicts settle locally, and trespass is hard to prosecute."
 ywc_nqg.1011.defer:0 "Defer: read the books first"
 ywc_nqg.1011.defer.cost_tooltip:0 "No new cost; this month's window is lost."
 ywc_nqg.1011.defer.consequence_tooltip:0 "Nothing changes; the offer returns later."
 ywc_nqg.1011.withdraw:0 "Withdraw: stop pushing this line"
 ywc_nqg.1011.withdraw.cost_tooltip:0 "Fees already paid and terms already signed are not refunded."
 ywc_nqg.1011.withdraw.consequence_tooltip:0 "The line is recorded as frustrated and the slot frees up; old debts stand."
 ywc_nqg.1012.t:0 "Assessing the Loss"
 ywc_nqg.1012.d:0 "The compensation route needs an assessor: the office alone, office with communities, or a flat customary rate?"
 ywc_nqg.1012.joint_assessment:0 "Assess Jointly"
 ywc_nqg.1012.joint_assessment.cost_tooltip:0 "No new cost."
