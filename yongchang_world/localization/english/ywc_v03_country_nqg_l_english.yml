 ywc_nqg.1028.refuse.cost_tooltip:0 "Neither treasury is charged."
 ywc_nqg.1028.refuse.consequence_tooltip:0 "Northern Qing receives the refusal and may keep the multi-berth or high-duty route; the filing fee already paid is not refunded."
