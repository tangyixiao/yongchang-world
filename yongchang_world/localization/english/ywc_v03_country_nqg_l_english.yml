 ywc_nqg.1028.t:0 "The Port Treaty Answer"
 ywc_nqg.1028.d:0 "Northern Qing’s inquiry is type [SCOPE.GetValue('ywc_nqg_port_treaty_request_kind')|0v] (1: lease; 2: escort; 3: renewal) for [SCOPE.sState('ywc_nqg_port_treaty_request_port').GetName]. Nominal berth share: [SCOPE.GetValue('ywc_nqg_port_treaty_request_berth')|2v]; duty code: [SCOPE.GetValue('ywc_nqg_port_treaty_request_duty')|0v]; term: [SCOPE.GetValue('ywc_nqg_port_treaty_request_term')|0v] months; cost: @money![SCOPE.GetValue('ywc_nqg_port_treaty_request_cost')|0v]. A zero escort term leaves the lease term unchanged. A current lease gives the captured state +20% trade capacity on standard terms or +30% on amended terms and lowers its maximum import tariff by 10 percentage points. This affects all trade centers in that state, does not enforce the nominal berth share or create a trade route, and is checked monthly. Only the actual recipient can answer."
 ywc_nqg.1028.accept:0 "Sign the Captured Terms"
 ywc_nqg.1028.accept.cost_tooltip:0 "Any quoted escort cost is transferred from Northern Qing to the recipient at signature; if funds are insufficient, the accepted offer waits until expiry."
 ywc_nqg.1028.accept.consequence_tooltip:0 "The lease remains bound to the port state and market captured at inquiry; changed objects suspend or prevent signature rather than silently retargeting it."
 ywc_nqg.1028.refuse:0 "Refuse the Treaty"
 ywc_nqg.1028.refuse.cost_tooltip:0 "Neither treasury is charged."
 ywc_nqg.1028.refuse.consequence_tooltip:0 "Northern Qing receives the refusal and may keep the multi-berth or high-duty route; the filing fee already paid is not refunded."
 ywc_nqg.1028.stale_dismiss:0 "Dismiss a Stale Inquiry"
 ywc_nqg.1028.stale_dismiss.cost_tooltip:0 "No payment."
 ywc_nqg.1028.stale_dismiss.consequence_tooltip:0 "A stale inquiry cannot rewrite a later port treaty."
 ywc_nqg.1029.t:0 "The Lease Term Ends"
 ywc_nqg.1029.d:0 "The captured term ends and only that generation’s lease authority is cleared; paid costs and port works are untouched."
