 ywc_nqg.1028.stale_dismiss.cost_tooltip:0 "No payment."
 ywc_nqg.1028.stale_dismiss.consequence_tooltip:0 "A stale inquiry cannot rewrite a later port treaty."
 ywc_nqg.1029.t:0 "The Lease Term Ends"
 ywc_nqg.1029.d:0 "The captured term ends and only that generation’s lease authority is cleared; paid costs and port works are untouched."
