 ywc_nqg.1028.t:0 "The Port Treaty Answer"
 ywc_nqg.1028.d:0 "Northern Qing’s inquiry is type [SCOPE.GetValue('ywc_nqg_port_treaty_request_kind')|0v] (1: lease; 2: escort; 3: renewal) for [SCOPE.sState('ywc_nqg_port_treaty_request_port').GetName]. Proposed berth share: [SCOPE.GetValue('ywc_nqg_port_treaty_request_berth')|2v]; duty code: [SCOPE.GetValue('ywc_nqg_port_treaty_request_duty')|0v]; term: [SCOPE.GetValue('ywc_nqg_port_treaty_request_term')|0v] months; cost: @money![SCOPE.GetValue('ywc_nqg_port_treaty_request_cost')|0v]. A zero escort term leaves the original lease term unchanged. Berth and duty terms are recorded; they do not automatically change port capacity or tariffs. Only the actual recipient can answer."
