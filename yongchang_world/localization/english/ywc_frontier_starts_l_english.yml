 ywc_frontier.9.a:0 "Seek a reciprocal regional guarantee."
 ywc_frontier.9.b:0 "Keep the agreement narrow and affordable."
 ywc_je_frontier_aks:0 "The Aksu Begdom Settlement"
 ywc_je_frontier_aks_reason:0 "Oasis towns depend on canals, bazaars, and caravan roads. Higher tolls can fund offices but divert merchants to another stop; an easy passage can turn a temporary concession into a lasting claim. Its future rests on the balance between local consent, reliable routes, and commitments it can afford."
