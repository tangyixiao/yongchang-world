l_english:
 ywc_frontier.1.t:0 "Alban Confederation: The Local Compact"
 ywc_frontier.1.d:0 "Clan delegates ask to renew seasonal pasture and common defence rules. The leader can establish a standing compact or leave arbitration with the chiefs. The debate in Alban Confederation turns on whether authority will be recorded in a common register or left with local brokers."
 ywc_frontier.1.a:0 "Record the obligations and boundaries."
 ywc_frontier.1.b:0 "Keep the settlement in local hands."
 ywc_frontier.2.t:0 "Alban Confederation: Roads and Dues"
 ywc_frontier.2.d:0 "Clans must share pasture and service while guarding against neighbours turning trade into control. Delegates now ask whether the state should fund the route or preserve local tolls and retainers."
 ywc_frontier.2.a:0 "Fund a shared route and inspection posts."
 ywc_frontier.2.b:0 "Keep the existing dues and obligations."
 ywc_frontier.3.t:0 "Alban Confederation: A Place Among Neighbours"
 ywc_frontier.3.d:0 "The opening compact has clarified who may speak for Alban Confederation, but not how far its commitments should reach. The final council weighs a regional guarantee against a narrower, self-reliant settlement."
 ywc_frontier.3.a:0 "Seek a reciprocal regional guarantee."
 ywc_frontier.3.b:0 "Keep the agreement narrow and affordable."
 ywc_je_frontier_abn:0 "The Alban Confederation Settlement"
 ywc_je_frontier_abn_reason:0 "Pasture, oaths, and common defence hold the steppe clans together. Excessive fixed service can drive them away; without coordination of winter camps and border markets, better-organized neighbours will steadily press in. Its future rests on the balance between local consent, reliable routes, and commitments it can afford."
 ywc_frontier.4.t:0 "Ahom Kingdom: The Local Compact"
 ywc_frontier.4.d:0 "Several ports propose joint patrols and a common anchorage fee. The compact may attract shipping, but each harbour must accept shared inspection and costs. The debate in Ahom Kingdom turns on whether authority will be recorded in a common register or left with local brokers."
 ywc_frontier.4.a:0 "Record the obligations and boundaries."
 ywc_frontier.4.b:0 "Keep the settlement in local hands."
 ywc_frontier.5.t:0 "Ahom Kingdom: Roads and Dues"
 ywc_frontier.5.d:0 "Sea-lane income depends on port cooperation under pressure from colonial claims and stronger navies. Delegates now ask whether the state should fund the route or preserve local tolls and retainers."
 ywc_frontier.5.a:0 "Fund a shared route and inspection posts."
 ywc_frontier.5.b:0 "Keep the existing dues and obligations."
 ywc_frontier.6.t:0 "Ahom Kingdom: A Place Among Neighbours"
 ywc_frontier.6.d:0 "The opening compact has clarified who may speak for Ahom Kingdom, but not how far its commitments should reach. The final council weighs a regional guarantee against a narrower, self-reliant settlement."
 ywc_frontier.6.a:0 "Seek a reciprocal regional guarantee."
 ywc_frontier.6.b:0 "Keep the agreement narrow and affordable."
 ywc_je_frontier_ahm:0 "The Ahom Kingdom Settlement"
 ywc_je_frontier_ahm_reason:0 "Coastal and island communities live by sea lanes, harbours, and mutual trust. Control of port dues, arbitration between islands, and protection of fisheries determines whether merchants keep calling. Its future rests on the balance between local consent, reliable routes, and commitments it can afford."
 ywc_frontier.7.t:0 "Aksu Begdom: The Local Compact"
 ywc_frontier.7.d:0 "Caravans ask for common tolls and travel papers. Merchants will help fund repairs if rates and enforcement are written into a public compact. The debate in Aksu Begdom turns on whether authority will be recorded in a common register or left with local brokers."
 ywc_frontier.7.a:0 "Record the obligations and boundaries."
 ywc_frontier.7.b:0 "Keep the settlement in local hands."
 ywc_frontier.8.t:0 "Aksu Begdom: Roads and Dues"
 ywc_frontier.8.d:0 "Toll rights, caravan passage, and the posts of nearby powers pull in different directions. Delegates now ask whether the state should fund the route or preserve local tolls and retainers."
 ywc_frontier.8.a:0 "Fund a shared route and inspection posts."
 ywc_frontier.8.b:0 "Keep the existing dues and obligations."
