l_english:
 ywc_je_v03_t04_order_wage_dispute:0 "One Order, Different Wage Sheets"
 ywc_je_v03_t04_order_wage_dispute_reason:0 "Lan Xang's mines and workshops have taken a verifiable export order while local wages, employment and current law contradict one another; the Jinghai buyer waits at the other end for a term and a wage answer."
 ywc_society.1150.t:0 "The Order Presses into the Workshops"
 ywc_society.1150.d:0 "The order from Jinghai carries its own delivery term and inspection rules. The mines and workshops either press extra shifts to fill it or accept it in batches at existing strength; wages and employment must be audited by Lan Xang itself."
 ywc_society.1150.accept_scale:0 "Scale production to the order and press the schedule"
 ywc_society.1150.accept_scale.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1150.accept_scale.consequence_tooltip:0 "Records this decision; the buyer sets the term."
 ywc_society.1150.accept_phased:0 "Accept the order in batches at existing strength"
 ywc_society.1150.accept_phased.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1150.accept_phased.consequence_tooltip:0 "Records this decision; the buyer sets the term."
 ywc_society.1150.local_only:0 "Withdraw the export order and sell only locally"
 ywc_society.1150.local_only.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1150.local_only.consequence_tooltip:0 "The order is withdrawn; the arc closes as a refusal."
 ywc_society.1150.wait:0 "Wait and audit wages and employment again"
 ywc_society.1150.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1150.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1151.t:0 "The Term the Buyer Demands"
 ywc_society.1151.d:0 "Jinghai's counting house proposes a term for the order: a short deadline with inspection, or a relaxed term with an advance. The order may also be withdrawn. An advance already paid is not collected twice on reconsideration."
 ywc_society.1151.strict:0 "A short term with inspection and penalty"
 ywc_society.1151.strict.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1151.strict.consequence_tooltip:0 "The term and inspection rules are filed; Lan Xang faces the wage dispute."
 ywc_society.1151.relax_advance:0 "Relax the term and pay 500 in advance"
 ywc_society.1151.relax_advance.cost_tooltip:0 "Jinghai pays 500 from its treasury."
 ywc_society.1151.relax_advance.consequence_tooltip:0 "The advance is filed, no transfer to Lan Xang; Lan Xang faces the wage dispute."
 ywc_society.1151.withdraw:0 "Withdraw the order for other arrangements"
 ywc_society.1151.withdraw.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1151.withdraw.consequence_tooltip:0 "The order is withdrawn; Lan Xang closes the arc as a refusal."
 ywc_society.1151.wait:0 "Wait before answering"
 ywc_society.1151.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1151.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1152.t:0 "The Trades' First Joint Petition"
 ywc_society.1152.d:0 "Employed miners and workshop hands submit their first joint petition over wages. The weaker the right of association, the more easily the petition disperses, and some propose substituting local corvée for the export order."
 ywc_society.1152.hear:0 "Hear the petition and promise a wage audit"
 ywc_society.1152.hear.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1152.hear.consequence_tooltip:0 "The petition is filed; the buyer will hear the outer-port wage rumors."
 ywc_society.1152.suppress:0 "Suppress the petition and work to the old rules"
 ywc_society.1152.suppress.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1152.suppress.consequence_tooltip:0 "The petition is suppressed and filed; the buyer will hear the outer-port wage rumors."
 ywc_society.1152.corvee:0 "Substitute local corvée for the order"
 ywc_society.1152.corvee.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1152.corvee.consequence_tooltip:0 "Available only without the right of association."
 ywc_society.1152.disperse:0 "Let the petition disperse and deliver in batches at the old wage"
 ywc_society.1152.disperse.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1152.disperse.consequence_tooltip:0 "Proceeds to local inspection and closure; does not depend on the buyer."
 ywc_society.1152.wait:0 "Wait and review the petition rules again"
 ywc_society.1152.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1152.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1153.t:0 "Rumors of Wages at the Outer Ports"
 ywc_society.1153.d:0 "News of the outer ports reaches Jinghai: mines and workshops elsewhere pay higher wages. The buyer may acknowledge the wage and raise the purchase price, hold the old price, or send an assessor to verify on site."
 ywc_society.1153.match_pay:0 "Pay 1,000 to acknowledge the outer-port wage"
 ywc_society.1153.match_pay.cost_tooltip:0 "Jinghai pays 1,000 from its treasury."
 ywc_society.1153.match_pay.consequence_tooltip:0 "The wage decision is filed; Lan Xang faces its delivery day."
 ywc_society.1153.hold_price:0 "Hold the old price and execute the original order"
 ywc_society.1153.hold_price.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1153.hold_price.consequence_tooltip:0 "The wage decision is filed; Lan Xang faces its delivery day."
 ywc_society.1153.assess:0 "Send an assessor to verify on site"
 ywc_society.1153.assess.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1153.assess.consequence_tooltip:0 "The assessment is filed; Lan Xang faces its delivery day."
 ywc_society.1153.wait:0 "Wait before answering"
 ywc_society.1153.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1153.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1154.t:0 "The Delivery Day After the Stoppage"
 ywc_society.1154.d:0 "After the stoppage the delivery day still comes. Settling the wage arrears and delivering on time takes treasury funds; shipping as-is without settling is also possible; if the buyer is still reachable, the goods may be held for talks."
 ywc_society.1154.settle_deliver:0 "Pay 800 to settle wage arrears and deliver on time"
 ywc_society.1154.settle_deliver.cost_tooltip:0 "Lan Xang pays 800 from its treasury."
 ywc_society.1154.settle_deliver.consequence_tooltip:0 "The arrears settlement is filed; Lan Xang will face the inspector."
 ywc_society.1154.ship_as_is:0 "Deliver as-is without settling wages"
 ywc_society.1154.ship_as_is.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1154.ship_as_is.consequence_tooltip:0 "The delivery record is filed; Lan Xang will face the inspector."
 ywc_society.1154.halt_hold:0 "Hold the goods and reopen the wage agenda"
 ywc_society.1154.halt_hold.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1154.halt_hold.consequence_tooltip:0 "The hold is filed; the buyer must answer where the order goes."
 ywc_society.1154.wait:0 "Wait and review the delivery rules again"
 ywc_society.1154.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1154.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1155.t:0 "The Inspector Enters the Workshop"
 ywc_society.1155.d:0 "After delivery the inspector enters the workshop to check workplace safety. The more complete the current law, the firmer the basis for rectification; if the buyer can no longer be reached, Lan Xang may close on the decisions it has already made. A paid rectification is not collected twice on reconsideration."
 ywc_society.1155.allow_rectify:0 "Pay 600 to allow inspection and rectify"
 ywc_society.1155.allow_rectify.cost_tooltip:0 "Lan Xang pays 600 from its treasury."
 ywc_society.1155.allow_rectify.consequence_tooltip:0 "The rectification is filed; the buyer must answer where the order goes."
 ywc_society.1155.reuse_rectify:0 "Reuse the paid rectification record"
 ywc_society.1155.reuse_rectify.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1155.reuse_rectify.consequence_tooltip:0 "Reuses the paid rectification; the buyer must answer where the order goes."
 ywc_society.1155.refuse_inspect:0 "Refuse the inspection and proceed privately"
 ywc_society.1155.refuse_inspect.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1155.refuse_inspect.consequence_tooltip:0 "The refusal is filed; the buyer must answer where the order goes."
 ywc_society.1155.law_partial:0 "Inspect only safety items under current law"
 ywc_society.1155.law_partial.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1155.law_partial.consequence_tooltip:0 "Requires current regulatory or worker protection law."
 ywc_society.1155.alone:0 "Close on local decisions because the buyer is unreachable"
 ywc_society.1155.alone.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1155.alone.consequence_tooltip:0 "Closes on decisions already made; does not depend on the buyer."
 ywc_society.1155.wait:0 "Wait and review the rectification scope again"
 ywc_society.1155.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1155.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1156.t:0 "Shrink, Renegotiate, or Find Another Supplier"
 ywc_society.1156.d:0 "Jinghai must decide where this order goes: renegotiate and keep it, shrink it, or order elsewhere where a real alternative supply exists."
 ywc_society.1156.renegotiate:0 "Renegotiate the contract and keep the order"
 ywc_society.1156.renegotiate.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1156.renegotiate.consequence_tooltip:0 "The renegotiation is filed; the buyer gives its final word on resuming production."
 ywc_society.1156.shrink:0 "Shrink the order and take batches at the new price"
 ywc_society.1156.shrink.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1156.shrink.consequence_tooltip:0 "The shrink decision is filed; the buyer gives its final word on resuming production."
 ywc_society.1156.switch:0 "Switch to another supplier"
 ywc_society.1156.switch.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1156.switch.consequence_tooltip:0 "Requires industry or mining elsewhere to reorder from."
 ywc_society.1156.wait:0 "Wait before answering"
 ywc_society.1156.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1156.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1157.t:0 "The Conditions for Resuming Production"
 ywc_society.1157.d:0 "The buyer gives its final answer on resuming production: resume under the new terms, resume in limited volume, or break the contract and order elsewhere. Lan Xang's ledger records the outcome."
 ywc_society.1157.resume_accorded:0 "Resume production under the new terms"
 ywc_society.1157.resume_accorded.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1157.resume_accorded.consequence_tooltip:0 "Jinghai gains 5 relations with Lan Xang."
 ywc_society.1157.resume_limited:0 "Resume in limited volume"
 ywc_society.1157.resume_limited.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1157.resume_limited.consequence_tooltip:0 "The limited resumption is filed; each side keeps its own wages and budget."
 ywc_society.1157.break_switch:0 "Break the contract and order elsewhere"
 ywc_society.1157.break_switch.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1157.break_switch.consequence_tooltip:0 "Jinghai loses 10 relations with Lan Xang."
 ywc_society.1157.wait:0 "Wait before answering"
 ywc_society.1157.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1157.wait.consequence_tooltip:0 "Records this decision."
