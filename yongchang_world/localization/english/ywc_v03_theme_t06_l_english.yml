l_english:
 ywc_je_v03_t06_one_textbook_many_readers:0 "One Textbook, Many Readers"
 ywc_je_v03_t06_one_textbook_many_readers_reason:0 "Ganden Phodrang's printing houses hold plates and translation examples to lend; Shu must audit its own literacy, offices and school institutions before borrowing plates, translating and compiling its own next volume."
 ywc_society.1250.t:0 "Who Reads the First Volume"
 ywc_society.1250.d:0 "Shu wants to print a first textbook for its schools. Its low-literacy subjects and office vacancies are already on file; whether to borrow plates from Ganden Phodrang is its own decision under school institutions and language arrangements."
 ywc_society.1250.borrow:0 "Request plates from Ganden Phodrang"
 ywc_society.1250.borrow.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1250.borrow.consequence_tooltip:0 "The request is filed; Ganden Phodrang will decide between lending whole plates, lending rubbings only, or refusing."
 ywc_society.1250.selfprint:0 "Carve local plates instead of borrowing"
 ywc_society.1250.selfprint.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1250.selfprint.consequence_tooltip:0 "The textbook closes as a local carving; the borrowing record ends as refused."
 ywc_society.1250.wait:0 "Wait and review again"
 ywc_society.1250.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1250.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1251.t:0 "The Borrowed Plates"
 ywc_society.1251.d:0 "Shu's borrowing request has reached Ganden Phodrang. The printing houses may lend whole plates, deliver rubbings while keeping the plates at the monastery, or refuse outside printing; monks and officials each hold their own position."
 ywc_society.1251.lend:0 "Lend the whole plates with a lending record"
 ywc_society.1251.lend.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1251.lend.consequence_tooltip:0 "The plates are lent on record; the monastery's printing monks gain loyalists; Shu audits its own roster next."
 ywc_society.1251.rubbings:0 "Deliver rubbings only and keep the plates at the monastery"
 ywc_society.1251.rubbings.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1251.rubbings.consequence_tooltip:0 "The rubbings are delivered on record; the officials keeping the plates gain loyalists; Shu must recarve from rubbings."
 ywc_society.1251.refuse:0 "Refuse outside printing"
 ywc_society.1251.refuse.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1251.refuse.consequence_tooltip:0 "The borrowing record closes as refused; Shu must find its own plates."
 ywc_society.1251.wait:0 "Wait before responding"
 ywc_society.1251.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1251.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1252.t:0 "The Roster Before the School Gate"
 ywc_society.1252.d:0 "Plates or rubbings are in place. Which classes receive the printed volume first, and how many copies, is decided by school institutions and school capacity; a full print run costs real treasury funds, and a paid print bill is not collected twice on reconsideration."
 ywc_society.1252.print:0 "Pay 500 for a full print run"
 ywc_society.1252.print.cost_tooltip:0 "Shu pays 500 from its treasury."
 ywc_society.1252.print.consequence_tooltip:0 "The print run is filed; the translation arrangement follows."
 ywc_society.1252.reuse:0 "Use the paid print record"
 ywc_society.1252.reuse.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1252.reuse.consequence_tooltip:0 "The print run is filed; the translation arrangement follows."
 ywc_society.1252.limited:0 "Print one trial class first"
 ywc_society.1252.limited.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1252.limited.consequence_tooltip:0 "The trial class is filed; the translation arrangement follows."
 ywc_society.1252.stop:0 "Suspend the printed volume plan"
 ywc_society.1252.stop.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1252.stop.consequence_tooltip:0 "The volume plan closes as refused; a paid print bill is not refunded."
 ywc_society.1252.wait:0 "Wait and review again"
 ywc_society.1252.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1252.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1253.t:0 "What Translation Decides"
 ywc_society.1253.d:0 "The plates' script and the schoolroom language do not match. Employing bilingual scholars to rewrite costs real treasury funds; a literal recarving keeps the original text. The language arrangement decides what students read, and a paid translation bill is not collected twice on reconsideration."
 ywc_society.1253.vernacular:0 "Pay 500 to employ bilingual scholars"
 ywc_society.1253.vernacular.cost_tooltip:0 "Shu pays 500 from its treasury."
 ywc_society.1253.vernacular.consequence_tooltip:0 "The translation is filed; graduate placements are audited next."
 ywc_society.1253.reuse:0 "Use the paid translation record"
 ywc_society.1253.reuse.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1253.reuse.consequence_tooltip:0 "The translation is filed; graduate placements are audited next."
 ywc_society.1253.literal:0 "Recarve literally without retranslation"
 ywc_society.1253.literal.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1253.literal.consequence_tooltip:0 "The literal recarving is filed; graduate placements are audited next."
 ywc_society.1253.stop:0 "Suspend the printed volume plan"
 ywc_society.1253.stop.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1253.stop.consequence_tooltip:0 "The volume plan closes as refused; expenses already paid are not refunded."
 ywc_society.1253.wait:0 "Wait and review again"
 ywc_society.1253.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1253.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1254.t:0 "No Post After Graduation"
 ywc_society.1254.d:0 "The first class taught from the printed volume has graduated. Vacant offices can appoint them and understaffed schools can keep them; the appointment arrangement decides whether the textbook becomes an administrative tool or a shelf piece."
 ywc_society.1254.office:0 "Appoint graduates to vacant offices"
 ywc_society.1254.office.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1254.office.consequence_tooltip:0 "The appointments are filed; once the volume reaches the markets, Ganden Phodrang rules on the ban itself."
 ywc_society.1254.school:0 "Keep graduates teaching at the schools"
 ywc_society.1254.school.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1254.school.consequence_tooltip:0 "The teaching posts are filed; once the volume reaches the markets, Ganden Phodrang rules on the ban itself."
 ywc_society.1254.stop:0 "Make no appointments and archive the textbook"
 ywc_society.1254.stop.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1254.stop.consequence_tooltip:0 "The textbook plan closes as refused; expenses already paid are not refunded."
 ywc_society.1254.wait:0 "Wait and review again"
 ywc_society.1254.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1254.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1255.t:0 "The Book Ban Crosses the Border"
 ywc_society.1255.d:0 "Shu's printed volume has reached Ganden Phodrang's markets and the monastery council has moved to ban it. Whether the ban is enforced everywhere or checked at the border only is Ganden Phodrang's own call; Shu's next volume will face it."
 ywc_society.1255.enforce:0 "Enforce the ban everywhere"
 ywc_society.1255.enforce.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1255.enforce.consequence_tooltip:0 "The full ban is filed; market shopkeepers grow radical; Shu decides whether to compile its own next volume."
 ywc_society.1255.border:0 "Check the ban at the border only"
 ywc_society.1255.border.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1255.border.consequence_tooltip:0 "The border-only ban is filed; monks who wanted the full ban grow radical; Shu decides whether to compile its own next volume."
 ywc_society.1255.wait:0 "Wait before ruling"
 ywc_society.1255.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1255.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1256.t:0 "The Next Volume Written Locally"
 ywc_society.1256.d:0 "Whatever the ban says, Shu decides whether to compile its own next volume: pay to have it written with new accounts, or keep the borrowed example. If the partner is unreachable, Shu closes on its own records; expenses already paid are not refunded."
 ywc_society.1256.compile:0 "Pay 1,000 to compile the next volume locally"
 ywc_society.1256.compile.cost_tooltip:0 "Shu pays 1,000 from its treasury."
 ywc_society.1256.compile.consequence_tooltip:0 "The local compilation is filed; the aftermath report returns to Ganden Phodrang."
 ywc_society.1256.reuse:0 "Use the paid compilation record"
 ywc_society.1256.reuse.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1256.reuse.consequence_tooltip:0 "The local compilation is filed; the aftermath report returns to Ganden Phodrang."
 ywc_society.1256.reconsider:0 "Reconsider the translation arrangement"
 ywc_society.1256.reconsider.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1256.reconsider.consequence_tooltip:0 "Records this decision."
 ywc_society.1256.alone:0 "Close on Shu's own record because the partner is unreachable"
 ywc_society.1256.alone.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1256.alone.consequence_tooltip:0 "The case closes on existing records; expenses already paid are not refunded."
 ywc_society.1256.wait:0 "Wait and review again"
 ywc_society.1256.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1256.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1257.t:0 "How the New Generation Keeps Accounts"
 ywc_society.1257.d:0 "Shu's locally compiled next volume is in print and the new generation keeps accounts and offices with it. Ganden Phodrang may accept the local textbook and file the correspondence, or file reservations; either way each side keeps its own printing houses and schools."
 ywc_society.1257.welcome:0 "Accept the local textbook and file the correspondence"
 ywc_society.1257.welcome.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1257.welcome.consequence_tooltip:0 "Ganden Phodrang gains 5 relations with Shu; its printing monks gain loyalists."
 ywc_society.1257.reserve:0 "File reservations and record the differences"
 ywc_society.1257.reserve.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1257.reserve.consequence_tooltip:0 "Ganden Phodrang loses 5 relations with Shu; its monastery clergy grow radical."
 ywc_society.1257.wait:0 "Wait before responding"
 ywc_society.1257.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1257.wait.consequence_tooltip:0 "Records this decision."
