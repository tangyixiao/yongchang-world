 ywc_kor.202.b:0 "Enroll after all: send apologies and back tribute"
 ywc_lan.200.t:0 "Tribute Across an Ocean"
 ywc_lan.200.d:0 "Shun's envoy reaches Pontianak asking Lanfang into the registry. The hall debates: tribute across an ocean is costly, but with the Dutch watching, a great-power name may be worth the price."
 ywc_lan.200.a:0 "Pay in gold sand, ask for the sea lanes"
 ywc_lan.200.b:0 "Sign a trade pact first; the registry can wait"
 ywc_lan.200.c:0 "The hall declines: a company pays no tribute"
