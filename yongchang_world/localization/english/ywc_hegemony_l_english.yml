 ywc_oir.200.t:0 "The Khaganate Chooses"
 ywc_oir.200.d:0 "Shun claims the mandate and asks the Oirat to enroll as tributaries. The court weighs it: the ancestors never bowed to Shun, yet half the Ili trade rides the southern road."
 ywc_oir.200.a:0 "Enroll: keep the trade flowing"
 ywc_oir.200.b:0 "Stall: the league has not met"
 ywc_oir.200.c:0 "The court refuses: trade yes, vassalage no"
