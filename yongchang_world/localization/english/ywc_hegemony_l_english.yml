 ywc_nqg.200.t:0 "Receiving the Edict on the Island"
 ywc_nqg.200.d:0 "The envoy crosses to the island asking Northern Qing to lay down its imperial style and enter the registry. The exile court splits: dignity is already gone, but livelihood cannot wait."
 ywc_nqg.200.a:0 "Lay down the style, pay in sea produce, buy peace and trade"
 ywc_nqg.200.b:0 "Stall: three generations without the calendar"
 ywc_nqg.200.c:0 "The court refuses: the Ming calendar still reigns here"
