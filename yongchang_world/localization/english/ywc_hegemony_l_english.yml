 ywc_tib.200.t:0 "The Edict on the Plateau"
 ywc_tib.200.d:0 "The envoy ascends to Tibet asking for the registry and a new tea-horse code. The assemblies agree the name can be granted, but the tea tax and residency must be bargained separately."
 ywc_tib.200.a:0 "Enroll, with the tea-horse code bargained separately"
 ywc_tib.200.b:0 "Stall: the religious and secular estates must confer"
 ywc_tib.200.c:0 "The assemblies refuse: the plateau governs itself"
