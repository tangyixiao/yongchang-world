l_english:
 ywc_hegemony.1.t:0 "Proclaiming the New Order"
 ywc_hegemony.1.d:0 "With the three chapters settled, Shun proclaims a tribute registry: those who join trade under its protection; those who stay out forgo the court's favour. Before the ink dries, every capital already has its spies on the road."
 ywc_hegemony.1.a:0 "Proclaim a lenient edict: lure with profit, not force"
 ywc_hegemony.1.b:0 "Proclaim a stern edict: reward obedience, interrogate defiance"
 ywc_hegemony.2.t:0 "The Realm Stirs"
 ywc_hegemony.2.d:0 "Reports stream back to the capital: some ask to join at once, some stall for time, some decline outright. The first answers will set the tone of the decade."
 ywc_hegemony.2.a:0 "Show grace to all: treat every envoy generously"
 ywc_hegemony.2.b:0 "Brandish the edict: reward the compliant, set deadlines for the hedging"
 ywc_hegemony.3.t:0 "Rewarding the Compliant"
 ywc_hegemony.3.d:0 "The missions of the enrolled states gather at court. Spend broadly on open trade and please them all, or reward only the closest and save the treasury."
 ywc_hegemony.3.a:0 "Open trade for every enrolled state"
 ywc_hegemony.3.b:0 "Reward the foremost contributors only"
 ywc_hegemony.4.t:0 "Censuring the Defiant"
 ywc_hegemony.4.d:0 "The defiant have returned the edict unanswered. The new order cannot be flouted with impunity, yet each instrument of censure carries its own cost."
 ywc_hegemony.4.a:0 "Seal their trade: embargo the defiant"
 ywc_hegemony.4.b:0 "Muster on the marches: overawe them"
 ywc_hegemony.5.t:0 "The Summit of the Mandate"
 ywc_hegemony.5.d:0 "The hedging states have sent envoys at last. Concentrate authority into standing custom, or share the order as a league of equals."
 ywc_hegemony.5.a:0 "Concentrate authority: the registry answers to the throne alone"
 ywc_hegemony.5.b:0 "Share the order: a league to keep the trade routes"
 ywc_hegemony.6.t:0 "Where the Mandate Rests"
 ywc_hegemony.6.d:0 "Years on, the balance of compliance and defiance is clear. Crown the order, accept a setback, or watch it crumble."
 ywc_hegemony.6.a:0 "Crown the order: the mandate is settled"
 ywc_hegemony.6.b:0 "Accept the setback: the order exists on paper"
 ywc_hegemony.6.c:0 "Admit the collapse: the authority is spent"
 ywc_jhg.200.t:0 "The Envoy Returns"
 ywc_jhg.200.d:0 "Shun's envoy is back at the palace: quotas, ship registries, and in exchange the open trade and the navy's covering hand. On top of the old covenant, the court and the council each count costs of their own."
 ywc_jhg.200.a:0 "Confirm the quota, register the fleet, claim the trade"
 ywc_jhg.200.b:0 "Cite the old covenant and watch the others first"
 ywc_jhg.200.c:0 "The council refuses: registries breach the old autonomy"
 ywc_jhg.201.t:0 "The Compliant Prosper"
 ywc_jhg.201.d:0 "Enrolled, the trade begins to open. Another mission asks: petition for greater favour at greater cost, or keep to your station?"
 ywc_jhg.201.a:0 "Double the tribute, ask for full trade rights"
 ywc_jhg.201.b:0 "Keep to your station: pay as customary"
 ywc_jhg.202.t:0 "The Defiant Falter"
 ywc_jhg.202.d:0 "Since the refusal the roads have narrowed and the markets thinned. Hold the line, or swallow pride and enroll after all?"
 ywc_jhg.202.a:0 "Hold the line: close the borders and brave the censure"
 ywc_jhg.202.b:0 "Enroll after all: send apologies and back tribute"
 ywc_kor.200.t:0 "The Investiture Envoy"
 ywc_kor.200.d:0 "Shun's envoy crosses the river asking Korea into the new registry and the new calendar. At court the old quarrel between serving the great and standing apart breaks out anew."
 ywc_kor.200.a:0 "Present the tables, adopt the calendar, pay as customary"
 ywc_kor.200.b:0 "Send courtesies first: etiquette takes time"
 ywc_kor.200.c:0 "The court declines: independence is not negotiable"
