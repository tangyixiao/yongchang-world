 ywc_mgl.200.t:0 "Envoy from the South, Letter from the North"
 ywc_mgl.200.d:0 "Shun's envoy and a Russian letter reach Khuree together. Enroll and the southern trade opens wide; refuse and perhaps the north offers protection. The steppe's old dilemma, laid before princes and monasteries."
 ywc_mgl.200.a:0 "Enroll: the southern trade comes first"
 ywc_mgl.200.b:0 "The banners disagree: answer with horses, not words"
 ywc_mgl.200.c:0 "The banners swear: steppe lords bow to no registry"
