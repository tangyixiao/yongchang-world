 ywc_dmg.200.t:0 "The Edict Across the Sea"
 ywc_dmg.200.d:0 "Shun's envoy comes through the South Seas asking Dongming into the registry. Luzon hesitates: Spanish guns ride at Manila Bay — will a tribute name guard these waters?"
 ywc_dmg.200.a:0 "Enroll and arm, just in case"
 ywc_dmg.200.b:0 "Stall on the unsettled sea-lane dispute"
 ywc_dmg.200.c:0 "The court refuses: do not provoke Spain"
