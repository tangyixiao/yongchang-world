 ywc_nmg.200.t:0 "The Edict Across the Pacific"
 ywc_nmg.200.d:0 "Shun's envoy crosses the Pacific asking New Ming into the registry. The bay council is trapped: the old country's name might help, but Mexico will certainly object — between two masters there is no room."
 ywc_nmg.200.a:0 "Enroll, and reassure Mexico at once"
 ywc_nmg.200.b:0 "Stall: Mexico must be consulted first"
 ywc_nmg.200.c:0 "The council refuses: one subject, one master"
