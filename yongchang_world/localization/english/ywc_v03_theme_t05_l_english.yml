l_english:
 ywc_je_v03_t05_land_development:0 "Rights Beyond the Survey Rope"
 ywc_je_v03_t05_land_development_reason:0 "Oirat territory holds real mining and agricultural development, herders on the old-used land remain its concrete right-holders, and Khalkha merchants have named their price. Survey, compensation, water and witness records must be written down item by item before the case is settled."
 ywc_society.1200.t:0 "A Survey Team's Boundary Rope"
 ywc_society.1200.d:0 "The worksite is laid out and the survey team has driven its boundary rope. Pay for a field survey that ties the rope to a register of existing uses, or line it straight from the office map."
 ywc_society.1200.survey_pay:0 "Pay 800 for a field survey registering existing uses"
 ywc_society.1200.survey_pay.cost_tooltip:0 "Oirat pays 800 from its treasury."
 ywc_society.1200.survey_pay.consequence_tooltip:0 "Records this decision."
 ywc_society.1200.reuse_survey:0 "Use the paid survey register"
 ywc_society.1200.reuse_survey.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1200.reuse_survey.consequence_tooltip:0 "Records this decision."
 ywc_society.1200.rough_map:0 "Line the rope from the office map only"
 ywc_society.1200.rough_map.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1200.rough_map.consequence_tooltip:0 "Records this decision."
 ywc_society.1200.decline:0 "Pull the rope back and suspend the development"
 ywc_society.1200.decline.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1200.decline.consequence_tooltip:0 "Records this decision."
 ywc_society.1200.wait:0 "Wait and review again"
 ywc_society.1200.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1200.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1201.t:0 "Land Already in Use"
 ywc_society.1201.d:0 "Inside the rope there is no empty land: herding tracks, winter camps and water points are claimed by named households. Decide before the merchants enter whether to fund compensation for these uses or only file the objections."
 ywc_society.1201.recognize:0 "Pay 500 for a compensation fund recognizing old uses"
 ywc_society.1201.recognize.cost_tooltip:0 "Oirat pays 500 from its treasury."
 ywc_society.1201.recognize.consequence_tooltip:0 "Records this decision."
 ywc_society.1201.reuse_compensation:0 "Use the standing compensation fund"
 ywc_society.1201.reuse_compensation.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1201.reuse_compensation.consequence_tooltip:0 "Records this decision."
 ywc_society.1201.proceed:0 "File objections only, no compensation"
 ywc_society.1201.proceed.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1201.proceed.consequence_tooltip:0 "Records this decision."
 ywc_society.1201.halt:0 "Suspend the development and keep the native arrangement"
 ywc_society.1201.halt.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1201.halt.consequence_tooltip:0 "Records this decision."
 ywc_society.1201.wait:0 "Wait and review again"
 ywc_society.1201.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1201.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1202.t:0 "The Price the Neighboring Merchants Name"
 ywc_society.1202.d:0 "The Oirat development boundary is drawn, and Khalkha caravans want in at their own price. The merchant house may bid for the whole site, bid only for the registered parcels, or withdraw from the development."
 ywc_society.1202.full_price:0 "Pay 600 to bid for the whole site"
 ywc_society.1202.full_price.cost_tooltip:0 "Khalkha pays 600; no transfer to Oirat."
 ywc_society.1202.full_price.consequence_tooltip:0 "Records this decision."
 ywc_society.1202.limited_price:0 "Pay 300 to bid for the registered parcels only"
 ywc_society.1202.limited_price.cost_tooltip:0 "Khalkha pays 300; no transfer to Oirat."
 ywc_society.1202.limited_price.consequence_tooltip:0 "Records this decision."
 ywc_society.1202.withdraw:0 "Withdraw the bid and stay out"
 ywc_society.1202.withdraw.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1202.withdraw.consequence_tooltip:0 "Records this decision."
 ywc_society.1202.wait:0 "Wait before responding"
 ywc_society.1202.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1202.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1203.t:0 "Water Reaches the New Worksite"
 ywc_society.1203.d:0 "The new worksite needs water, and so do the winter camps downstream of the old herding tracks. The site now executes: pay 800 for a channel serving both, or lay a pipe for the worksite alone."
 ywc_society.1203.shared_channel:0 "Pay 800 for a shared channel"
 ywc_society.1203.shared_channel.cost_tooltip:0 "Oirat pays 800 from its treasury."
 ywc_society.1203.shared_channel.consequence_tooltip:0 "Records this decision."
 ywc_society.1203.reuse_channel:0 "Use the completed shared channel"
 ywc_society.1203.reuse_channel.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1203.reuse_channel.consequence_tooltip:0 "Records this decision."
 ywc_society.1203.exclusive_pipe:0 "Pay 200 for a worksite-only pipe"
 ywc_society.1203.exclusive_pipe.cost_tooltip:0 "Oirat pays 200 from its treasury."
 ywc_society.1203.exclusive_pipe.consequence_tooltip:0 "Records this decision."
 ywc_society.1203.wait:0 "Wait and review again"
 ywc_society.1203.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1203.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1204.t:0 "Witnesses of the Old-Used Land"
 ywc_society.1204.d:0 "Witnesses from the old-used land have submitted a roll: which herding track, which well, which winter camp lies inside the rope. Pay 400 to hear them and enter the plots into the register, or dismiss the petition and proceed on the drawn boundary."
 ywc_society.1204.hear_witness:0 "Pay 400 to hear witnesses and register plots"
 ywc_society.1204.hear_witness.cost_tooltip:0 "Oirat pays 400 from its treasury."
 ywc_society.1204.hear_witness.consequence_tooltip:0 "Records this decision."
 ywc_society.1204.reuse_witness:0 "Use the completed witness roll"
 ywc_society.1204.reuse_witness.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1204.reuse_witness.consequence_tooltip:0 "Records this decision."
 ywc_society.1204.dismiss:0 "Dismiss the petition and proceed on the drawn boundary"
 ywc_society.1204.dismiss.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1204.dismiss.consequence_tooltip:0 "Records this decision."
 ywc_society.1204.wait:0 "Wait and review again"
 ywc_society.1204.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1204.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1205.t:0 "Narrowing the Permit"
 ywc_society.1205.d:0 "The register, the channel and the witness roll are all on the table. Propose full registered coexistence, reissue only a limited extraction permit, or, if the merchants have withdrawn or can no longer be reached, close on the record alone."
 ywc_society.1205.register_use:0 "Pay 700 to propose registered coexistence"
 ywc_society.1205.register_use.cost_tooltip:0 "Oirat pays 700 from its treasury."
 ywc_society.1205.register_use.consequence_tooltip:0 "Records this decision."
 ywc_society.1205.limit_permit:0 "Pay 300 to issue a limited extraction permit"
 ywc_society.1205.limit_permit.cost_tooltip:0 "Oirat pays 300 from its treasury."
 ywc_society.1205.limit_permit.consequence_tooltip:0 "Records this decision."
 ywc_society.1205.keep_native:0 "Keep the native arrangement, no expanded permit"
 ywc_society.1205.keep_native.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1205.keep_native.consequence_tooltip:0 "Records this decision."
 ywc_society.1205.close_alone:0 "The other side is unreachable; close on the record"
 ywc_society.1205.close_alone.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1205.close_alone.consequence_tooltip:0 "Records this decision."
 ywc_society.1205.wait:0 "Wait and review again"
 ywc_society.1205.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1205.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1206.t:0 "The Investor Accepts the New Boundary"
 ywc_society.1206.d:0 "Oirat has sent the amended boundary: registered coexistence, a limited permit, or the native arrangement kept. The Khalkha merchant house may accept the new boundary or record its reservations."
 ywc_society.1206.accept:0 "Accept the new boundary"
 ywc_society.1206.accept.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1206.accept.consequence_tooltip:0 "Khalkha gains 5 relations with Oirat."
 ywc_society.1206.reserve:0 "Record reservations"
 ywc_society.1206.reserve.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1206.reserve.consequence_tooltip:0 "Khalkha loses 5 relations with Oirat."
 ywc_society.1206.wait:0 "Wait before responding"
 ywc_society.1206.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1206.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1207.t:0 "New Voices at the Development Site"
 ywc_society.1207.d:0 "The merchant house has answered, and the register, compensation fund and witness roll remain on file. Settle on the record now: who enters, who keeps, who exits. The development site's new council takes its seats by that list."
 ywc_society.1207.formalize:0 "Settle on the record and publish"
 ywc_society.1207.formalize.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1207.formalize.consequence_tooltip:0 "Records this decision."
 ywc_society.1207.wait:0 "Hold the publication"
 ywc_society.1207.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1207.wait.consequence_tooltip:0 "Records this decision."
