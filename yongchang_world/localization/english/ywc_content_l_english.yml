 ywc_nqg.1.t:0 "A Court Without a Capital"
 ywc_nqg.1.d:0 "The banner retinue that reached Sakhalin outnumbers the fishing villages that received it. The court must decide what it still claims to be."
 ywc_nqg.1.a:0 "Reassert the Mandate."
 ywc_nqg.1.b:0 "Mourn and drift."
 ywc_nqg.2.t:0 "The Russian Offer"
 ywc_nqg.2.d:0 "Russian agents from the Amur mouth offer arms, grain and a trade post — in exchange for a flag and a voice in the island's harbors."
 ywc_nqg.2.a:0 "Take the Russian hand."
 ywc_nqg.2.b:0 "Keep the crown unpledged."
 ywc_nqg.3.t:0 "One Island, Many Banners"
 ywc_nqg.3.d:0 "Gilyak and Oroch villages, Manchu bannermen and Han exiles share a shore too small for four laws. Headmen ask for one code all can read."
 ywc_nqg.3.a:0 "Write one island code."
 ywc_nqg.3.b:0 "Let each folk keep its own law."
 ywc_nqg.4.t:0 "Restoration From the North"
 ywc_nqg.4.d:0 "Hardliners propose the restoration plan: stockade the harbors, court the mainland clans, and hold Sakhalin as the seed of a restored realm."
 ywc_nqg.4.a:0 "Commit to the restoration."
 ywc_nqg.4.b:0 "The plan overreaches."
 ywc_nqg.4.c:0 "Keep the island, renounce the dream."
 ywc_nqg.5.t:0 "A State of Many Peoples"
 ywc_nqg.5.d:0 "Another road imagines no restoration at all: a compact state where native clans, bannermen and exiles share harbors, salmon runs and law."
 ywc_nqg.5.a:0 "Found the compact state."
 ywc_nqg.5.b:0 "Old loyalties prevail."
 ywc_nqg.5.c:0 "Defer the founding."
