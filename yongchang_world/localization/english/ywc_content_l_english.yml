 ywc_je_who_inherits_china:0 "Who Inherits China?"
 ywc_je_who_inherits_china_reason:0 "Ten political traditions contest ritual legitimacy, maritime order, and local pluralism without receiving automatic territorial rewards."
 ywc_shared.1.t:0 "Who Inherits China?"
 ywc_shared.1.d:0 "A new century asks whether legitimacy will be carried by ritual, the sea, or local plurality."
 ywc_shared.1.a:0 "Choose ritual legitimacy."
 ywc_shared.1.b:0 "Choose maritime order."
 ywc_shared.1.c:0 "Choose local plurality."
 ywc_shared.2.t:0 "The Ocean Frontier"
 ywc_shared.2.d:0 "New hulls, new harbors and new faces at the docks press one question: whether these states look outward across the sea."
 ywc_shared.2.a:0 "Look to the sea."
 ywc_shared.2.b:0 "Mind the land."
 ywc_je_yongchang_century:0 "The Yongchang Century"
 ywc_je_yongchang_century_reason:0 "The Yongchang court must build a tax-and-frontier order between letters, banners, and gentry."
 ywc_je_shu_scholar_merchants:0 "Scholar-Merchants of Shun"
 ywc_je_shu_scholar_merchants_reason:0 "Gentry and sea merchants want a place in the state; Shun must decide whether market wealth buys political standing."
 ywc_je_shu_blackwater_frontier:0 "The Blackwater Frontier"
 ywc_je_shu_blackwater_frontier_reason:0 "The Blackwater frontier needs garrisons, trade, and local compacts, each with a different administrative cost."
 ywc_je_shu_opium_question:0 "The Opium Question"
 ywc_je_shu_opium_question_reason:0 "Coastal prohibition is both a fiscal and sovereignty question, caught between revenue, smuggling, and foreign pressure."
 ywc_route_shu_bureaucratic_integration:0 "Bureaucratic Integration"
 ywc_route_shu_bureaucratic_integration_reason:0 "Binding the gentry into the bureaucracy improves administration but displaces local intermediaries and military families."
 ywc_route_shu_customs_reform:0 "Customs Reform"
 ywc_route_shu_customs_reform_reason:0 "A unified customs board turns port commerce into court revenue while stripping old barriers and merchant houses of leverage."
 ywc_shu.1.t:0 "Between Gown and Ledger"
 ywc_shu.1.d:0 "The scholar-merchant houses of the lower Yangtze petition to stand formally between the bureaucracy and the market."
 ywc_shu.1.a:0 "Grant the scholar-merchant rank."
 ywc_shu.1.b:0 "Reaffirm the agrarian order."
 ywc_shu.2.t:0 "The Blackwater Marches"
 ywc_shu.2.d:0 "Commanders on the northeast frontier ask whether to garrison the blackwater marches or to open them to the clans' trade."
 ywc_shu.2.a:0 "Garrison the marches."
 ywc_shu.2.b:0 "Relax the marches, open the trade."
 ywc_shu.3.t:0 "The Opium Question"
 ywc_shu.3.d:0 "Opium houses spread along the coast. The court debates prohibition against a licensed tariff."
 ywc_shu.3.a:0 "Prohibit it outright."
 ywc_shu.3.b:0 "Tax and tolerate."
 ywc_shu.4.t:0 "The Gentry Question"
 ywc_shu.4.d:0 "Reformers propose binding the gentry into a reformed bureaucracy instead of the old examination road."
 ywc_shu.4.a:0 "Integrate the gentry."
 ywc_shu.4.b:0 "The old guard balks."
 ywc_shu.4.c:0 "Postpone it."
 ywc_shu.5.t:0 "A Customs Board"
 ywc_shu.5.d:0 "A unified customs board would standardize merchant rules and levy duties at the open ports."
 ywc_shu.5.a:0 "Charter the customs board."
 ywc_shu.5.b:0 "The old houses resist."
 ywc_shu.5.c:0 "Defer the board."
 ywc_shu.6.t:0 "The Yongchang Century"
 ywc_shu.6.d:0 "A new dynasty, an old empire's weight. The Yongchang court must set the tone of its century: rule by letter and law, or by the old balance of banners and gentry."
 ywc_shu.6.a:0 "Set the tone by reform."
 ywc_shu.6.b:0 "Drift on the old balance."
 ywc_shu.6.c:0 "Consolidate the reform."
 ywc_je_jinghai_maritime_network:0 "The Maritime Network"
 ywc_je_jinghai_maritime_network_reason:0 "Schedules, berths, and convoys decide whether Jinghai is a tributary shield or a South Sea port."
 ywc_je_jinghai_succession:0 "The Jinghai Succession"
 ywc_je_jinghai_succession_reason:0 "The Zheng succession decides not only the seal, but the fleet, merchant houses, and Shun's trust."
 ywc_je_jinghai_council:0 "The Jinghai Council"
 ywc_je_jinghai_council_reason:0 "A South Sea council can share dues, arbitration, and warehouses, but limits Jinghai's unilateral authority."
 ywc_route_jhg_naval_tributary_state:0 "A Naval Tributary State"
 ywc_route_jhg_naval_tributary_state_reason:0 "A naval tributary state gains sea power by serving Shun, at the cost of dockyards, debt, and suspicion."
 ywc_route_jhg_south_sea_council:0 "The South Sea Council"
 ywc_route_jhg_south_sea_council_reason:0 "A South Sea council shares routes and arbitration, but constrains Jinghai's independent tax and war choices."
 ywc_jhg.1.t:0 "One Convoy Rule"
 ywc_jhg.1.d:0 "The merchant houses ask for unified convoy schedules and berth rules from Fuzhou to Nagasaki."
 ywc_jhg.1.a:0 "Unify the convoys."
 ywc_jhg.1.b:0 "Let the houses fend."
 ywc_jhg.2.t:0 "The Succession Scroll"
 ywc_jhg.2.d:0 "The old prince is failing. The seal has not yet been promised to any of his heirs."
 ywc_jhg.2.a:0 "Confirm the heir."
 ywc_jhg.2.b:0 "Let the brothers quarrel."
 ywc_jhg.3.t:0 "A Council of Houses"
 ywc_jhg.3.d:0 "The great houses petition for a standing council to deliberate harbor dues and pilotage together."
 ywc_jhg.3.a:0 "Open the council."
 ywc_jhg.3.b:0 "Leave it a shell."
 ywc_jhg.4.t:0 "A Navy for the Tributary"
 ywc_jhg.4.d:0 "Expanding the fleet would raise Jinhai's standing — and just as surely Shun suspicion and the cost of its dockyards."
 ywc_jhg.4.a:0 "Build the fleets."
 ywc_jhg.4.b:0 "Shun pressure wins."
 ywc_jhg.4.c:0 "Postpone the fleets."
 ywc_jhg.5.t:0 "A Council of the South Sea"
 ywc_jhg.5.d:0 "Merchant circles of the southern ports propose a joint council for sea lanes, arbitration and shared warehouses."
 ywc_jhg.5.a:0 "Found the council."
 ywc_jhg.5.b:0 "The houses split."
 ywc_jhg.5.c:0 "Defer the compact."
 ywc_je_dongming_who_inherits_china:0 "Who Inherits China? (Dongming)"
 ywc_je_dongming_who_inherits_china_reason:0 "Dongming must prove its place between the Yongli claim, Luzon communities, and Spanish guns."
 ywc_je_dongming_spanish_frontier:0 "The Spanish Frontier"
 ywc_je_dongming_spanish_frontier_reason:0 "Holding northern Luzon requires forts, a truce, and military funds; the same peso cannot serve city and front."
 ywc_je_dongming_local_compact:0 "The Local Compact"
 ywc_je_dongming_local_compact_reason:0 "Without a written compact between Chinese settlers, Ilocano communities, and local notables, Dongming's crown has no social foundation."
 ywc_route_dmg_huafei_monarchy:0 "A Huafei Monarchy"
 ywc_route_dmg_huafei_monarchy_reason:0 "A Huafei crown can centralize defense and administration, but must be accepted across the islands."
 ywc_route_dmg_local_republic:0 "A Local Republic"
 ywc_route_dmg_local_republic_reason:0 "A local republic gives taxes and defense to an assembly, weakening the court's legitimacy and speed."
 ywc_dmg.1.t:0 "The Ming Succession"
 ywc_dmg.1.d:0 "Exiled scholars in the Parián argue over whether Dongming should proclaim the Yongli succession or stand apart from a falling dynasty."
 ywc_dmg.1.a:0 "Uphold the Ming claim."
 ywc_dmg.1.b:0 "Let the quarrel fester."
 ywc_dmg.2.t:0 "Muskets Across the River"
 ywc_dmg.2.d:0 "The Spanish garrison drills within sight of Dongming's walls. Envoys propose a fortified truce; hotheads urge a preemptive raid."
 ywc_dmg.2.a:0 "Fortify and negotiate."
 ywc_dmg.2.b:0 "Strike first."
 ywc_dmg.3.t:0 "A Compact in the Parián"
 ywc_dmg.3.d:0 "Chinese and native notables petition for codified rights and duties under Dongming's protection instead of ad-hoc rule."
 ywc_dmg.3.a:0 "Seal the compact."
 ywc_dmg.3.b:0 "Keep the old ways."
 ywc_dmg.4.t:0 "A Crown for the Isles"
 ywc_dmg.4.d:0 "Councilors propose crowning a Huafei monarch to bind the island notables to the dynasty — a bold step toward kingship across the sea."
 ywc_dmg.4.a:0 "Take the crown."
 ywc_dmg.4.b:0 "Let the plan collapse."
 ywc_dmg.4.c:0 "Set the issue aside."
 ywc_dmg.5.t:0 "Voices in the Cabildo"
 ywc_dmg.5.d:0 "Merchant elders ask for an elected council to share in governing the city, after the manner they observed under Spanish administration."
 ywc_dmg.5.a:0 "Convene the assembly."
 ywc_dmg.5.b:0 "Refuse the innovation."
 ywc_dmg.5.c:0 "Defer the experiment."
 ywc_je_northern_qing_exile:0 "The Northern Qing Exile"
 ywc_je_northern_qing_exile_reason:0 "The exile court reached Sakhalin under an old banner and must first win recognition from villages, clans, and ports."
 ywc_je_northern_qing_russian_choice:0 "The Russian Choice"
 ywc_je_northern_qing_russian_choice_reason:0 "Russia can provide grain, arms, and a trading post, but will claim part of Northern Qing's ports and diplomacy."
 ywc_je_northern_qing_island_society:0 "An Island Society"
 ywc_je_northern_qing_island_society_reason:0 "Sakhalin's future depends on exiles, northern peoples, and islanders sharing stores, fisheries, and law."
 ywc_route_nqg_sakhalin_restoration:0 "Sakhalin Restoration"
 ywc_route_nqg_sakhalin_restoration_reason:0 "A restoration expedition raises dynastic prestige but commits Northern Qing's limited people, ships, and stores beyond the Blackwater."
 ywc_route_nqg_multicultural_island:0 "A Multicultural Island"
 ywc_route_nqg_multicultural_island_reason:0 "A multicultural island state does not chase old frontiers; it uses ports, stores, and common law to survive."
 ywc_nqg.1.t:0 "A Court Without a Capital"
 ywc_nqg.1.d:0 "The banner retinue that reached Sakhalin outnumbers the fishing villages that received it. The court must decide what it still claims to be."
 ywc_nqg.1.a:0 "Reassert the Mandate."
 ywc_nqg.1.b:0 "Mourn and drift."
 ywc_nqg.2.t:0 "The Russian Offer"
 ywc_nqg.2.d:0 "Russian agents from the Amur mouth offer arms, grain and a trade post — in exchange for a flag and a voice in the island's harbors."
 ywc_nqg.2.a:0 "Take the Russian hand."
 ywc_nqg.2.b:0 "Keep the crown unpledged."
 ywc_nqg.3.t:0 "One Island, Many Banners"
 ywc_nqg.3.d:0 "Gilyak and Oroch villages, Manchu bannermen and Han exiles share a shore too small for four laws. Headmen ask for one code all can read."
 ywc_nqg.3.a:0 "Write one island code."
 ywc_nqg.3.b:0 "Let each folk keep its own law."
 ywc_nqg.4.t:0 "Restoration From the North"
 ywc_nqg.4.d:0 "Hardliners propose the restoration plan: stockade the harbors, court the mainland clans, and hold Sakhalin as the seed of a restored realm."
 ywc_nqg.4.a:0 "Commit to the restoration."
 ywc_nqg.4.b:0 "The plan overreaches."
 ywc_nqg.4.c:0 "Keep the island, renounce the dream."
 ywc_nqg.5.t:0 "A State of Many Peoples"
 ywc_nqg.5.d:0 "Another road imagines no restoration at all: a compact state where native clans, bannermen and exiles share harbors, salmon runs and law."
 ywc_nqg.5.a:0 "Found the compact state."
 ywc_nqg.5.b:0 "Old loyalties prevail."
 ywc_nqg.5.c:0 "Defer the founding."
 ywc_je_oir_dzungar_legacy:0 "The Dzungar Legacy"
 ywc_je_oir_dzungar_legacy_reason:0 "Oirat inherits Dzungar military law, Ili commerce, and banner fractures—not an empty steppe."
 ywc_je_oir_russian_pressure:0 "Russian Pressure"
 ywc_je_oir_russian_pressure_reason:0 "Russian posts demand passage and pasture; Oirat must answer with trade, closure, or arms."
 ywc_je_oir_ili_trade:0 "The Ili Trade"
 ywc_je_oir_ili_trade_reason:0 "The Ili road links Tarim and Russia; the tax contract decides whether merchants support the khanate or bypass it."
 ywc_je_oir_succession:0 "The Oirat Succession"
 ywc_je_oir_succession_reason:0 "Each claimant has banners and pasture, forcing Oirat to choose written law or banner bargaining."
 ywc_route_oir_bureaucratic_khanate:0 "A Bureaucratic Khanate"
 ywc_route_oir_bureaucratic_khanate_reason:0 "A bureaucratic khanate stabilizes Ili through law and offices, but narrows noyons' control of pasture and service."
 ywc_route_oir_pastoral_federation:0 "A Pastoral Federation"
 ywc_route_oir_pastoral_federation_reason:0 "A pastoral federation shares herds and defense among banners, at the cost of central taxation and speed."
 ywc_oir.1.t:0 "The Dzungar Legacy"
 ywc_oir.1.d:0 "Half a century after the khanate fell, the elders argue over what the Oirat should carry forward: its armies, its law, or only its grief."
 ywc_oir.1.a:0 "Reform and endure."
 ywc_oir.1.b:0 "Dream of the old horde."
 ywc_oir.2.t:0 "Cossacks at the Passes"
 ywc_oir.2.d:0 "Russian border posts creep toward the Ili passes, demanding trade privileges and grazing rights."
 ywc_oir.2.a:0 "Buy them off with trade."
 ywc_oir.2.b:0 "Close the passes."
 ywc_oir.3.t:0 "The Ili Caravan"
 ywc_oir.3.d:0 "Tarim caravans and Russian merchants bid for the taxes of the Ili bazaar."
 ywc_oir.3.a:0 "Set an official tariff."
 ywc_oir.3.b:0 "Let the merchants fight it out."
 ywc_oir.4.t:0 "The Empty Saddle"
 ywc_oir.4.d:0 "The old khan is dying, and every banner has its own candidate."
 ywc_oir.4.a:0 "Raise a common khan."
 ywc_oir.4.b:0 "Let the banners split."
 ywc_oir.5.t:0 "A Khanate of Scribes"
 ywc_oir.5.d:0 "Reformers propose governing by written code and appointed officials, after the manner of Shun and Russia."
 ywc_oir.5.a:0 "Rule by code."
 ywc_oir.5.b:0 "The noyons resist."
 ywc_oir.5.c:0 "Go slowly."
 ywc_oir.6.t:0 "A Federation of Pastures"
 ywc_oir.6.d:0 "The banners propose a federation of pastures: shared herds, shared defense, no khan above them all."
 ywc_oir.6.a:0 "Bind the federation."
 ywc_oir.6.b:0 "The pact collapses."
 ywc_oir.6.c:0 "Set the pact aside."
 ywc_je_mongol_south_north:0 "South and North of the Steppe"
 ywc_je_mongol_south_north_reason:0 "Khalkha stands between Shun tea-horse markets and Russia's northern road; every pact changes its room to act."
 ywc_je_mng_shun_trade:0 "Trade with the Shun"
 ywc_je_mng_shun_trade_reason:0 "A fixed tea-horse quota brings a stable market but deepens Khalkha's dependence on Shun frontier officials."
 ywc_je_mng_russian_protection:0 "Russian Protection"
 ywc_je_mng_russian_protection_reason:0 "Russian protection supplies arms but locks Khalkha's diplomacy to the northern road."
 ywc_je_mng_pan_mongol_council:0 "The Pan-Mongol Council"
 ywc_je_mng_pan_mongol_council_reason:0 "A pan-Mongol council gives banners a common voice, but cannot erase their different pasture and market interests."
 ywc_route_mng_southern_trade:0 "The Southern Trade"
 ywc_route_mng_southern_trade_reason:0 "The southern road trades tea and horses for revenue and administration, while binding Khalkha more closely to Shun's market."
 ywc_route_mng_russian_protection:0 "Under Russian Protection"
 ywc_route_mng_russian_protection_reason:0 "Northern protection trades military safety for diplomatic concessions, debt, supply costs, and sovereignty pressure."
 ywc_mng.1.t:0 "South of the Gobi, North of It"
 ywc_mng.1.d:0 "The southern banners trade with the Shun and dress in its fashion; the northern princes still exchange gifts with Russian agents. The khans must weigh one against the other."
 ywc_mng.1.a:0 "Lean toward the Shun."
 ywc_mng.1.b:0 "Lean toward the north."
 ywc_mng.2.t:0 "Tea for Horses"
 ywc_mng.2.d:0 "The border markets open and close at the will of Shun frontier officials. The banners ask for a fixed annual quota."
 ywc_mng.2.a:0 "Settle an annual market."
 ywc_mng.2.b:0 "Let the trade wither."
 ywc_mng.3.t:0 "The Protector's Shadow"
 ywc_mng.3.d:0 "Russian agents invite the banners to a gathering at Kyakhta, promising protection for a voice in the trade."
 ywc_mng.3.a:0 "Parley, but promise nothing."
 ywc_mng.3.b:0 "Send the agents away."
 ywc_mng.4.t:0 "A Council of All Mongols"
 ywc_mng.4.d:0 "Voices call for a pan-Mongol assembly to choose a common spokesman for steppe affairs."
 ywc_mng.4.a:0 "Attend and deliberate."
 ywc_mng.4.b:0 "Refuse the assembly."
 ywc_mng.5.t:0 "The Southern Caravan Road"
 ywc_mng.5.d:0 "Expanding the caravan trade southward promises wool profits — and deeper dependence on the Shun frontier."
 ywc_mng.5.a:0 "Expand the road."
 ywc_mng.5.b:0 "The road stays closed."
 ywc_mng.5.c:0 "Hold at today's trade."
 ywc_mng.6.t:0 "Under the Tsar's Wing"
 ywc_mng.6.d:0 "A formal protection treaty with Russia would arm the northern banners — and answer to a distant throne."
 ywc_mng.6.a:0 "Sign the protection."
 ywc_mng.6.b:0 "The treaty stalls."
 ywc_mng.6.c:0 "Watch and wait."
 ywc_je_tibet_highland_without_master:0 "A Highland Without a Master"
 ywc_je_tibet_highland_without_master_reason:0 "Lhasa must redefine who rules the plateau among monastic estates, local nobles, and outside powers."
 ywc_je_tib_monastery_estates:0 "The Monastery Estates"
 ywc_je_tib_monastery_estates_reason:0 "Monastic estates sustain administration and armies while hiding the real cost of land and service in old deeds."
 ywc_je_tib_kham_alliance:0 "The Kham Alliance"
 ywc_je_tib_kham_alliance_reason:0 "Kham chiefs will share defense only after Lhasa recognizes their local boundaries."
 ywc_je_tib_caravan_gate:0 "The Caravan Gate"
 ywc_je_tib_caravan_gate_reason:0 "The tea-horse road brings cash and information, but exposes the closed plateau to debt and intervention."
 ywc_route_tib_monastic_reform:0 "Monastic Reform"
 ywc_route_tib_monastic_reform_reason:0 "Turning monastic service into registration and salaries improves administration but touches every great monastery's estate interests."
 ywc_route_tib_kham_league:0 "The Kham League"
 ywc_route_tib_kham_league_reason:0 "A Kham league exchanges mutual aid and boundaries for stability, limiting Lhasa's unilateral levies."
 ywc_kor_small_china:0 "Small China Mandate"
 ywc_kor_national_foundation:0 "National Foundation"
 ywc_lan_company_republic:0 "Company Republic Charter"
 ywc_lan_mining_state:0 "Mining State Boom"
 ywc_nmg_catholic_autonomy:0 "Catholic Autonomy Compact"
 ywc_nmg_mexican_federalism:0 "Mexican Federal Compact"
 ywc_tib.1.t:0 "A Highland Without a Master"
 ywc_tib.1.d:0 "The Dalai's seat, the prince's castle and the shadow of the old Qing court all claim the plateau. Lhasa must decide where authority now rests."
 ywc_tib.1.a:0 "Settle the succession."
 ywc_tib.1.b:0 "Let the claims sit unsettled."
 ywc_tib.2.t:0 "The Monastery Estates"
 ywc_tib.2.d:0 "Monastic estates hold the best land and the corvée that works it. Inspectors ask to survey them at last."
 ywc_tib.2.a:0 "Survey the estates."
 ywc_tib.2.b:0 "Leave the old deeds alone."
 ywc_tib.3.t:0 "The Kham Question"
 ywc_tib.3.d:0 "Kham chieftains propose an oath of mutual aid between the highland and the marches."
 ywc_tib.3.a:0 "Swear the Kham accord."
 ywc_tib.3.b:0 "Watch the feuds run on."
 ywc_tib.4.t:0 "The Caravan Gate"
 ywc_tib.4.d:0 "Tea traders and muleteers ask for a fixed gate, a fixed toll and safe passage to the highland markets."
 ywc_tib.4.a:0 "Open the caravan gate."
 ywc_tib.4.b:0 "Keep the mountain closed."
 ywc_tib.5.t:0 "Reform of the Estates"
 ywc_tib.5.d:0 "Turning monastic estates into salaried endowments would free the corvée — and alarm every abbot on the plateau."
 ywc_tib.5.a:0 "Enact the salaried reform."
 ywc_tib.5.b:0 "The abbots revolt."
 ywc_tib.5.c:0 "Postpone the reform."
 ywc_tib.6.t:0 "A League of Kham"
 ywc_tib.6.d:0 "A standing league with the Kham chieftains would bind the marches to Lhasa without a single soldier."
 ywc_tib.6.a:0 "Conclude the league."
 ywc_tib.6.b:0 "The league breaks apart."
 ywc_tib.6.c:0 "Keep the envoys waiting."
 ywc_je_korea_who_inherits_china:0 "Who Inherits China? (Korea)"
 ywc_je_korea_who_inherits_china_reason:0 "Korea must choose its inheritance among small-China ritual, frontier security, and maritime learning."
 ywc_je_kor_bureaucratic_state:0 "A Bureaucratic State"
 ywc_je_kor_bureaucratic_state_reason:0 "The Three Offices and frontier commands know the old system is slowing; reform needs both to enforce it."
 ywc_je_kor_border_question:0 "The Border Question"
 ywc_je_kor_border_question_reason:0 "Settlers and garrisons along the Yalu demand a clear register, and every boundary choice affects Korean revenue and security."
 ywc_je_kor_maritime_learning:0 "Maritime Learning"
 ywc_je_kor_maritime_learning_reason:0 "Maritime learning brings instruments, routes, and outside knowledge to Seoul, forcing the court to reinterpret old order."
 ywc_route_kor_small_china:0 "A Small China"
 ywc_route_kor_small_china_reason:0 "The small-China path strengthens ritual legitimacy and bureaucracy, but confines Korea within an old identity."
 ywc_route_kor_national_foundation:0 "National Foundation"
 ywc_route_kor_national_foundation_reason:0 "Nation-building creates new law and armies at the cost of breaking with old rites and parts of the civil service."
 ywc_kor.1.t:0 "Serving the Fallen Court"
 ywc_kor.1.d:0 "The swept court of the old dynasty has fallen. The sarim scholars argue whether Joseon still owes the calendar and the mission."
 ywc_kor.1.a:0 "Keep the old calendar."
 ywc_kor.1.b:0 "Let the debate turn seditious."
 ywc_kor.2.t:0 "Reforming the Three Offices"
 ywc_kor.2.d:0 "Reformers want the border commanderies and the three offices reorganized under one accountable council."
 ywc_kor.2.a:0 "Reorganize the offices."
 ywc_kor.2.b:0 "Factional wrangling wins."
 ywc_kor.3.t:0 "The Yalu Question"
 ywc_kor.3.d:0 "Refugee farmers cross the river and clear land north of it. Generals demand the ban be made real or abolished."
 ywc_kor.3.a:0 "Settle and register them."
 ywc_kor.3.b:0 "Keep a ban nobody enforces."
 ywc_kor.4.t:0 "Books from the Southern Sea"
 ywc_kor.4.d:0 "Returned envoys bring western instruments and southern trade accounts. The techs ask for a bureau to translate them."
 ywc_kor.4.a:0 "Found a translation bureau."
 ywc_kor.4.b:0 "Dismiss them as curiosities."
 ywc_kor.5.t:0 "A Small China"
 ywc_kor.5.d:0 "One faction proposes Korea carry the ritual center of civilization itself — a small China by the Eastern Sea."
 ywc_kor.5.a:0 "Proclaim the small China."
 ywc_kor.5.b:0 "The literati split."
 ywc_kor.5.c:0 "Table the proclamation."
 ywc_kor.6.t:0 "Founding a Nation"
 ywc_kor.6.d:0 "Another road steps past the old tribute order entirely: laws, coin and army renewed as a nation of its own."
 ywc_kor.6.a:0 "Promulgate the new order."
 ywc_kor.6.b:0 "The restoration wins."
 ywc_kor.6.c:0 "Move gradually."
 ywc_je_lanfang_company_republic:0 "The Lanfang Company Republic"
 ywc_je_lanfang_company_republic_reason:0 "Lanfang's mines, company, and villages must answer who the charter actually protects."
 ywc_je_lan_company_shareholders:0 "The Company Shareholders"
 ywc_je_lan_company_shareholders_reason:0 "Shareholders want dividends and open books; miners and villages want profit to pay for roads and defense."
 ywc_je_lan_miner_frontier:0 "The Miner Frontier"
 ywc_je_lan_miner_frontier_reason:0 "New pits press against village land, forcing Lanfang to trade mineral growth against stable boundaries."
 ywc_je_lan_dutch_pressure:0 "Dutch Pressure"
 ywc_je_lan_dutch_pressure_reason:0 "The Dutch demand a lowered flag and protection; Lanfang can delay with trade but cannot erase the pressure."
 ywc_route_lan_company_republic:0 "The Company Republic"
 ywc_route_lan_company_republic_reason:0 "A company republic puts shareholders, miners, and villages under one charter, gaining authority through continuous bargaining."
 ywc_route_lan_mining_state:0 "A Mining State"
 ywc_route_lan_mining_state_reason:0 "A mining state turns tin revenue into army, roads, and administration, but makes security depend on the vein."
 ywc_lan.1.t:0 "The Company Charter"
 ywc_lan.1.d:0 "Lanfang's charter names a head elected by the pits and the warehouses. The charter has not been read aloud in years."
 ywc_lan.1.a:0 "Read and renew the charter."
 ywc_lan.1.b:0 "Let the charter lapse."
 ywc_lan.2.t:0 "The Shareholders"
 ywc_lan.2.d:0 "Miner shareholders demand the year's accounts opened and dividends paid before the harvest."
 ywc_lan.2.a:0 "Open the ledgers."
 ywc_lan.2.b:0 "Keep the books shut."
 ywc_lan.3.t:0 "The Miner Frontier"
 ywc_lan.3.d:0 "New pits push toward village land and Dayak longhouse groves. The elders ask for a boundary before the rains."
 ywc_lan.3.a:0 "Draw the pit boundary."
 ywc_lan.3.b:0 "Let the crews push on."
 ywc_lan.4.t:0 "A Dutch Ultimatum"
 ywc_lan.4.d:0 "The Indies company demands Lanfang accept its suzerainty and fly its flag at the ports."
 ywc_lan.4.a:0 "Parley and delay."
 ywc_lan.4.b:0 "Sign the submission."
 ywc_lan.5.t:0 "A Republic of Miners"
 ywc_lan.5.d:0 "The reform circle proposes a written republic: elected head, fixed terms, an assembly of pits and warehouses."
 ywc_lan.5.a:0 "Proclaim the republic."
 ywc_lan.5.b:0 "The chief gathers power."
 ywc_lan.5.c:0 "Draft, but wait."
 ywc_lan.6.t:0 "A State of Mines"
 ywc_lan.6.d:0 "Another road builds the state on the mines alone: duties on tin, coin from the pits, wages for the banners."
 ywc_lan.6.a:0 "Build on the mines."
 ywc_lan.6.b:0 "The veins run thin."
 ywc_lan.6.c:0 "Seek other revenue."
 ywc_je_new_ming_mexican_chain:0 "The New Ming-Mexico Chain"
 ywc_je_new_ming_mexican_chain_reason:0 "New Ming must explain its existence between Ming-descended identity, Huamo communities, and Mexico's federation."
 ywc_je_nmg_mexican_federation:0 "The Mexican Federation"
 ywc_je_nmg_mexican_federation_reason:0 "A federal seat can secure autonomy, but requires New Ming to make its local laws legible to Mexico."
 ywc_je_nmg_catholic_huamo:0 "The Catholic Huamo Community"
 ywc_je_nmg_catholic_huamo_reason:0 "A church compact can bind Huamo communities, but gives clergy and Mexico another voice in local affairs."
 ywc_je_nmg_baja_frontier:0 "The Baja Frontier"
 ywc_je_nmg_baja_frontier_reason:0 "The Baja frontier needs towns and defenses without turning a small Mexican subject into an unpayable military project."
 ywc_route_nmg_catholic_autonomy:0 "Catholic Autonomy"
 ywc_route_nmg_catholic_autonomy_reason:0 "Catholic autonomy trades a recognized church settlement for a narrower and more negotiated subject status."
 ywc_route_nmg_mexican_federalism:0 "Mexican Federalism"
 ywc_route_nmg_mexican_federalism_reason:0 "Mexican federalism trades legal security and investment for deeper integration into a federation that can still overrule Loreto."
 ywc_nmg.1.t:0 "The Baja Frontier"
 ywc_nmg.1.d:0 "Mission stations and settler parties ask to push the frontier up the peninsula, past the last royal grant."
 ywc_nmg.1.a:0 "Found the frontier towns."
 ywc_nmg.1.b:0 "Stop at the bay."
 ywc_nmg.2.t:0 "The Catholic Huamo Community"
 ywc_nmg.2.d:0 "Huamo families baptized under the missions petition for a church of their own and a priest who speaks their tongue."
 ywc_nmg.2.a:0 "Charter the church."
 ywc_nmg.2.b:0 "Forbid the parish."
 ywc_nmg.3.t:0 "One Nation, Two Capitals"
 ywc_nmg.3.d:0 "Mexico City's federalists offer New Ming seats in a union of states — if the peninsula accepts federal law."
 ywc_nmg.3.a:0 "Join the federal compact."
 ywc_nmg.3.b:0 "The compact stalls."
 ywc_nmg.4.t:0 "An Autonomous Church"
 ywc_nmg.4.d:0 "A diocese of its own would put New Ming's clergy under New Ming's bishops rather than distant ones."
 ywc_nmg.4.a:0 "Establish the diocese."
 ywc_nmg.4.b:0 "Rome refuses."
 ywc_nmg.4.c:0 "Lobby another year."
 ywc_nmg.5.t:0 "Federalists of the Peninsula"
 ywc_nmg.5.d:0 "A constitutional convention convenes without the peninsula. Delegates ask whether New Ming will take part."
 ywc_nmg.5.a:0 "Send the delegates."
 ywc_nmg.5.b:0 "The convention fails."
 ywc_nmg.5.c:0 "Stand aside."
