 ywc_jhg.1.t:0 "One Convoy Rule"
 ywc_jhg.1.d:0 "The merchant houses ask for unified convoy schedules and berth rules from Fuzhou to Nagasaki."
 ywc_jhg.1.a:0 "Unify the convoys."
 ywc_jhg.1.b:0 "Let the houses fend."
 ywc_jhg.2.t:0 "The Succession Scroll"
 ywc_jhg.2.d:0 "The old prince is failing. The seal has not yet been promised to any of his heirs."
 ywc_jhg.2.a:0 "Confirm the heir."
 ywc_jhg.2.b:0 "Let the brothers quarrel."
 ywc_jhg.3.t:0 "A Council of Houses"
 ywc_jhg.3.d:0 "The great houses petition for a standing council to deliberate harbor dues and pilotage together."
 ywc_jhg.3.a:0 "Open the council."
 ywc_jhg.3.b:0 "Leave it a shell."
 ywc_jhg.4.t:0 "A Navy for the Tributary"
 ywc_jhg.4.d:0 "Expanding the fleet would raise Jinhai's standing — and just as surely Shun suspicion and the cost of its dockyards."
 ywc_jhg.4.a:0 "Build the fleets."
 ywc_jhg.4.b:0 "Shun pressure wins."
 ywc_jhg.4.c:0 "Postpone the fleets."
 ywc_jhg.5.t:0 "A Council of the South Sea"
 ywc_jhg.5.d:0 "Merchant circles of the southern ports propose a joint council for sea lanes, arbitration and shared warehouses."
 ywc_jhg.5.a:0 "Found the council."
 ywc_jhg.5.b:0 "The houses split."
 ywc_jhg.5.c:0 "Defer the compact."
