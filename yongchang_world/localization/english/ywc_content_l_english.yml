 ywc_shared.1.t:0 "Who Inherits China?"
 ywc_shared.1.d:0 "A new century asks whether legitimacy will be carried by ritual, the sea, or local plurality."
 ywc_shared.1.a:0 "Choose ritual legitimacy."
 ywc_shared.1.b:0 "Choose maritime order."
 ywc_shared.1.c:0 "Choose local plurality."
 ywc_shared.2.t:0 "The Ocean Frontier"
 ywc_shared.2.d:0 "New hulls, new harbors and new faces at the docks press one question: whether these states look outward across the sea."
 ywc_shared.2.a:0 "Look to the sea."
 ywc_shared.2.b:0 "Mind the land."
