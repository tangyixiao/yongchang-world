 ywc_flavor_shu_court_balance:0 "Court Balance"
 ywc_flavor_shu_court_balance_desc:0 "The institutional struggle between gentry, banner officers, and bureaucrats over tax registers and levies."
 ywc_flavor_shu_high:0 "Bureaucratic Order"
 ywc_flavor_shu_high_desc:0 "Registers and offices begin to cover the provinces, giving the court administrative capacity."
 ywc_flavor_shu_low:0 "Divided Local Registers"
 ywc_flavor_shu_low_desc:0 "Local powers resist common rules, damaging legitimacy and authority."
 ywc_flavor_jhg_convoy_commitment:0 "Convoy Commitment"
 ywc_flavor_jhg_convoy_commitment_desc:0 "Jinghai's budgetary commitment between convoy schedules, dockyards, and tribute to Shun."
 ywc_flavor_jhg_high:0 "Route Reputation"
 ywc_flavor_jhg_high_desc:0 "Reliable convoys make the ports and trade routes more efficient."
 ywc_flavor_jhg_low:0 "Overdrawn Tribute Budget"
 ywc_flavor_jhg_low_desc:0 "Convoys and tribute squeeze each other, raising debt and autonomy pressure."
 ywc_je_flavor_shu_court_1:0 "The New Register"
 ywc_je_flavor_shu_court_1_reason:0 "The new court must decide whether the capital will measure the provinces itself or rely on gentry registers."
 ywc_je_flavor_shu_court_2:0 "Banners and Village Compacts"
 ywc_je_flavor_shu_court_2_reason:0 "Frontier garrisons and village compacts demand an answer to whom the levies actually obey."
 ywc_je_flavor_shu_court_3:0 "The Weight of the Court"
 ywc_je_flavor_shu_court_3_reason:0 "After repeated compromises, the Yongchang court must set the boundary between offices and local mobilization."
 ywc_shu.7.t:0 "The New Register"
 ywc_shu.7.d:0 "The new dynasty's tax books are neat in Beijing, but three older ledgers block them in the provinces: gentry land, military allotments, and official quotas."
 ywc_shu.7.a:0 "Commission inspection registers"
 ywc_shu.7.b:0 "Keep the village ledgers"
 ywc_shu.8.t:0 "Banners and Village Compacts"
 ywc_shu.8.d:0 "The frontier garrisons need grain and the village compacts need men. Bureaucrats demand one register; military families fear it will erase old service."
 ywc_shu.8.a:0 "Register everyone"
 ywc_shu.8.b:0 "Raise men through the compacts"
 ywc_shu.9.t:0 "The Weight of the Court"
 ywc_shu.9.d:0 "Bureaucrats, gentry, and military families spread their ledgers before the throne. The Yongchang court must decide which order will bear the state."
 ywc_shu.9.a:0 "Let the bureaucrats set the rules"
 ywc_shu.9.b:0 "Accept local imbalance"
 ywc_shu.9.c:0 "Make both sides yield"
 ywc_je_flavor_jhg_convoy_1:0 "Convoy Commitment"
 ywc_je_flavor_jhg_convoy_1_reason:0 "Every Jinghai flag carries a cost: convoy duty, dockyard work, or tribute delivered to Shun."
 ywc_je_flavor_jhg_convoy_2:0 "The Dockyard Ledger"
 ywc_je_flavor_jhg_convoy_2_reason:0 "The merchants want punctual convoys, while the court wants tribute and a dockyard that will not fail."
 ywc_je_flavor_jhg_convoy_3:0 "The Maritime Budget"
 ywc_je_flavor_jhg_convoy_3_reason:0 "Jinghai must decide whether to stake its reputation on longer routes or admit that a promise cannot be paid."
 ywc_jhg.6.t:0 "Convoy Commitment"
 ywc_jhg.6.d:0 "The merchants bring a schedule from Fuzhou to Nagasaki and ask the palace who will pay for late escorts—and who will pay Shun's tribute fleet."
 ywc_jhg.6.a:0 "Escort on schedule"
 ywc_jhg.6.b:0 "Pay the tribute first"
 ywc_jhg.7.t:0 "The Dockyard Ledger"
 ywc_jhg.7.d:0 "The dockyard can lay another keel, but every hull means timber, guns, and tribute postponed."
 ywc_jhg.7.a:0 "Open another slipway"
 ywc_jhg.7.b:0 "Cut back the convoys"
 ywc_jhg.8.t:0 "The Maritime Budget"
 ywc_jhg.8.d:0 "The council writes convoy schedules, port dues, and tribute into one budget. The numbers show that Jinghai cannot honor every promise at once."
 ywc_jhg.8.a:0 "Stake the ports on tomorrow"
 ywc_jhg.8.b:0 "Admit the routes are overdrawn"
 ywc_jhg.8.c:0 "Pay in stages"
 ywc_flavor_dmg_huafei_compact:0 "Huafei Compact"
 ywc_flavor_dmg_huafei_compact_desc:0 "The trust between Chinese settlers and Luzon communities in a shared political compact."
 ywc_flavor_dmg_high:0 "The Huafei Compact Holds"
 ywc_flavor_dmg_high_desc:0 "The court and local councils have found an enforceable boundary of power."
 ywc_flavor_dmg_low:0 "A Fractured Compact"
 ywc_flavor_dmg_low_desc:0 "Communities no longer trust Dongming's promises, making administration and law harder."
 ywc_flavor_nqg_island_supply:0 "Island Supply"
 ywc_flavor_nqg_island_supply_desc:0 "Northern Qing's remaining capacity divided between restoration, port stores, and island society."
 ywc_flavor_nqg_high:0 "Island Stores Full"
 ywc_flavor_nqg_high_desc:0 "Reliable port stores let the small country sustain its people and administration."
 ywc_flavor_nqg_low:0 "Broken Island Supply"
 ywc_flavor_nqg_low_desc:0 "Expedition and daily supply squeeze each other, pulling down both finances and legitimacy."
 ywc_je_flavor_dmg_compact_1:0 "The First Ink of a Huafei Compact"
 ywc_je_flavor_dmg_compact_1_reason:0 "Dongming must answer whether the old royal seal or a common Luzon compact will bind the new state."
 ywc_je_flavor_dmg_compact_2:0 "Inside and Outside the Walls"
 ywc_je_flavor_dmg_compact_2_reason:0 "Spanish guns and local towns both demand a clear boundary between protection and representation."
 ywc_je_flavor_dmg_compact_3:0 "One Compact Across the Islands"
 ywc_je_flavor_dmg_compact_3_reason:0 "If Huafei politics is to last, court, council, and local communities must accept one promise."
 ywc_dmg.6.t:0 "The First Ink of a Huafei Compact"
 ywc_dmg.6.d:0 "Vigan's old seal can summon exiled scholars, but it cannot speak for every Ilocano town. The new compact must decide who has a voice."
 ywc_dmg.6.a:0 "Let the court write the compact"
 ywc_dmg.6.b:0 "Let the local councils speak first"
 ywc_dmg.7.t:0 "Inside and Outside the Walls"
 ywc_dmg.7.d:0 "Spanish guns repair their breastworks across the river while local towns ask where the taxes for their defense are going."
 ywc_dmg.7.a:0 "Concentrate military authority"
 ywc_dmg.7.b:0 "Trade a route for representation"
 ywc_dmg.8.t:0 "One Compact Across the Islands"
 ywc_dmg.8.d:0 "Dongming can no longer rule by an old royal seal alone. The final bargain asks whether crown, council, and community will share war and taxes."
 ywc_dmg.8.a:0 "Set the boundary by royal charter"
 ywc_dmg.8.b:0 "Admit the compact has broken"
 ywc_dmg.8.c:0 "Make every side yield"
 ywc_je_flavor_nqg_supply_1:0 "The Island Provision Ledger"
 ywc_je_flavor_nqg_supply_1_reason:0 "Every Northern Qing shipment must choose between the exile court's expedition and the islanders' winter stores."
 ywc_je_flavor_nqg_supply_2:0 "Ports and Expeditionaries"
 ywc_je_flavor_nqg_supply_2_reason:0 "Restorationists demand ships and powder while the island council demands stores and stable port dues."
 ywc_je_flavor_nqg_supply_3:0 "Beyond the Blackwater"
 ywc_je_flavor_nqg_supply_3_reason:0 "Northern Qing must decide whether to stake scarce prestige on the old homeland or first build a country that can live on the islands."
 ywc_nqg.6.t:0 "The Island Provision Ledger"
 ywc_nqg.6.d:0 "Every shipment from Sakhalin enters the same ledger: the expedition, or the fishing villages, ports, and winter stores."
 ywc_nqg.6.a:0 "Supply the expedition first"
 ywc_nqg.6.b:0 "Protect the islanders' stores"
 ywc_nqg.7.t:0 "Ports and Expeditionaries"
 ywc_nqg.7.d:0 "Restorationists demand powder and ships, while Evenki, Ainu, and Manchu communities ask the court to prove that it belongs to the island too."
 ywc_nqg.7.a:0 "Give the stores to the expedition"
 ywc_nqg.7.b:0 "Build a many-peopled port"
 ywc_nqg.8.t:0 "Beyond the Blackwater"
 ywc_nqg.8.d:0 "The old dynasty's banner still commands loyalty, but it cannot fill the granary. Northern Qing must decide whether the island is a bridge to home or home itself."
 ywc_nqg.8.a:0 "Stake the stores on the homeland"
 ywc_nqg.8.b:0 "Admit the expedition is overdrawn"
 ywc_nqg.8.c:0 "Reserve half for each future"
 ywc_flavor_oir_banner_cohesion:0 "Banner Cohesion"
 ywc_flavor_oir_banner_cohesion_desc:0 "The cooperation among Oirat banners over pasture, service, and written law."
 ywc_flavor_oir_high:0 "A Written Banner Pact"
 ywc_flavor_oir_high_desc:0 "The banners accept a common code, giving the khanate administration and legitimacy."
 ywc_flavor_oir_low:0 "The Banners Drift Apart"
 ywc_flavor_oir_low_desc:0 "Pasture and service disputes make levies harder and weaken central authority."
 ywc_flavor_mng_south_north_balance:0 "Southern-Northern Balance"
 ywc_flavor_mng_south_north_balance_desc:0 "Khalkha's balance between Shun tea-horse trade and the northern Russian market."
 ywc_flavor_mng_high:0 "Both Roads Open"
 ywc_flavor_mng_high_desc:0 "Both routes receive attention, leaving the khanate trade and administrative room."
 ywc_flavor_mng_low:0 "A Lopsided Trade Road"
 ywc_flavor_mng_low_desc:0 "One-sided dependence raises military supply and borrowing costs."
 ywc_flavor_tib_estate_reform:0 "Monastic Estate Reform"
 ywc_flavor_tib_estate_reform_desc:0 "Tibet's institutional direction between monastic estates, local service, and Kham pacts."
 ywc_flavor_tib_high:0 "Registered Monastic Order"
 ywc_flavor_tib_high_desc:0 "Land and service have clear ledgers, improving Lhasa's administration."
 ywc_flavor_tib_low:0 "Unsettled Estate Disputes"
 ywc_flavor_tib_low_desc:0 "Monasteries and local chiefs distrust each other, damaging legitimacy and authority."
 ywc_je_flavor_oir_banner_1:0 "The Banners' Old Oath"
 ywc_je_flavor_oir_banner_1_reason:0 "Oirat cannot inherit only an old flag: every banner wants to know who judges pasture and service."
 ywc_je_flavor_oir_banner_2:0 "Code or Pasture Pact"
 ywc_je_flavor_oir_banner_2_reason:0 "Scribes bring written law while noyons want seasonal pasture bargains written into the state."
 ywc_je_flavor_oir_banner_3:0 "The Khanate's Common Boundary"
 ywc_je_flavor_oir_banner_3_reason:0 "The final step in inheriting Dzungaria is making every banner accept one boundary of power."
 ywc_oir.7.t:0 "The Banners' Old Oath"
 ywc_oir.7.d:0 "The old oath remains in Ili, but every banner brings its own pasture and service ledger. The khanate must decide what to unify first."
 ywc_oir.7.a:0 "Establish common offices first"
 ywc_oir.7.b:0 "Renew the banner pacts first"
 ywc_oir.8.t:0 "Code or Pasture Pact"
 ywc_oir.8.d:0 "Scribes spread a written code in the felt tent while noyons fear that law will leave no room for seasonal pasture bargains."
 ywc_oir.8.a:0 "Judge by the code"
 ywc_oir.8.b:0 "Negotiate by banner"
 ywc_oir.9.t:0 "The Khanate's Common Boundary"
 ywc_oir.9.d:0 "Russian posts draw closer while the banners argue how far the khan's seal may reach."
 ywc_oir.9.a:0 "Bind the banners to the code"
 ywc_oir.9.b:0 "Admit the banners have drifted"
 ywc_oir.9.c:0 "Write the boundary into the pact"
 ywc_je_flavor_mng_balance_1:0 "The Two Roads South and North"
 ywc_je_flavor_mng_balance_1_reason:0 "Khalkha's horses, tea, and promises of protection cannot lean without limit toward both south and north."
 ywc_je_flavor_mng_balance_2:0 "Two Letters in Khüree"
 ywc_je_flavor_mng_balance_2_reason:0 "Shun wants a fixed tea-horse quota, Russia a fixed northern promise, and the banners want neither future wagered away."
 ywc_je_flavor_mng_balance_3:0 "A Khanate Between Two Roads"
 ywc_je_flavor_mng_balance_3_reason:0 "Khalkha must decide whether one road will rule the state or institutions will preserve room on both sides."
 ywc_mng.7.t:0 "The Two Roads South and North"
 ywc_mng.7.d:0 "Tea bricks arrive from the southern market and a protection clause from the north. Every banner asks which road the khanate belongs to first."
 ywc_mng.7.a:0 "Draw closer to Shun's markets"
 ywc_mng.7.b:0 "Accept northern protection"
 ywc_mng.8.t:0 "Two Letters in Khüree"
 ywc_mng.8.d:0 "Shun demands a fixed tea-horse quota and Russia a fixed northern promise. Khüree lacks the camels to promise both."
 ywc_mng.8.a:0 "Expand the southern road"
 ywc_mng.8.b:0 "Secure northern protection"
 ywc_mng.9.t:0 "A Khanate Between Two Roads"
 ywc_mng.9.d:0 "Southern and northern envoys lay their seals before the khan's tent. Khalkha must admit both the gain and the cost of dependence."
 ywc_mng.9.a:0 "Make the southern road the foundation"
 ywc_mng.9.b:0 "Admit the trade has tilted"
 ywc_mng.9.c:0 "Leave room for both sides"
 ywc_je_flavor_tib_estate_1:0 "The First Monastic Estate Ledger"
 ywc_je_flavor_tib_estate_1_reason:0 "Monastic estates feed the highlands, while ancient deeds conceal who owes land and service."
 ywc_je_flavor_tib_estate_2:0 "Lhasa and Kham Service"
 ywc_je_flavor_tib_estate_2_reason:0 "Registration needs local cooperation, while Kham chiefs want a pact in exchange for a boundary."
 ywc_je_flavor_tib_estate_3:0 "Two Orders on the Plateau"
 ywc_je_flavor_tib_estate_3_reason:0 "Tibet must decide whether monastic land answers to clear ledgers or local pacts preserve the plateau's balance."
 ywc_tib.7.t:0 "The First Monastic Estate Ledger"
 ywc_tib.7.d:0 "Monastic estates hold the best fields and the oldest service deeds. Lhasa's clerks demand that they enter one ledger."
 ywc_tib.7.a:0 "Register the monastic estates"
 ywc_tib.7.b:0 "Renew the local pacts"
 ywc_tib.8.t:0 "Lhasa and Kham Service"
 ywc_tib.8.d:0 "Reformers want salaries in place of service, while Kham chiefs demand a pact that neither side will cross."
 ywc_tib.8.a:0 "Adopt salaried service"
 ywc_tib.8.b:0 "Expand the Kham pact"
 ywc_tib.9.t:0 "Two Orders on the Plateau"
 ywc_tib.9.d:0 "Monasteries, nobles, and Kham envoys all admit that the old order is thinning. The final choice decides who bears the plateau's order."
 ywc_tib.9.a:0 "Put estates under the new ledger"
 ywc_tib.9.b:0 "Admit the estate dispute is loose"
 ywc_tib.9.c:0 "Keep the balance by pact"
 ywc_flavor_kor_court_reform:0 "Court Reform Credit"
 ywc_flavor_kor_court_reform_desc:0 "The trust that the Three Offices, frontier commands, and maritime scholars place in court reform."
 ywc_flavor_kor_high:0 "Reform Edicts Hold"
 ywc_flavor_kor_high_desc:0 "Court edicts are beginning to be enforced by both offices and frontier commands."
 ywc_flavor_kor_low:0 "Reform Credit Broken"
 ywc_flavor_kor_low_desc:0 "Repeated compromises damage court authority and law enactment."
 ywc_flavor_lan_company_charter:0 "Mining Charter"
 ywc_flavor_lan_company_charter_desc:0 "Lanfang's charter bargain between shareholder ledgers, miner rights, and village boundaries."
 ywc_flavor_lan_high:0 "Charter Holds"
 ywc_flavor_lan_high_desc:0 "Shareholders and villages accept the mining government's accounts and duties."
 ywc_flavor_lan_low:0 "Mining Accounts Discredited"
 ywc_flavor_lan_low_desc:0 "Miners and villages no longer trust the company, raising the cost of defense."
 ywc_flavor_nmg_federal_bargain:0 "Federal Bargaining"
 ywc_flavor_nmg_federal_bargain_desc:0 "New Ming's accumulated credit in negotiations over Huamo autonomy, church, and Mexican federalism."
 ywc_flavor_nmg_high:0 "Federal Compact Enforceable"
 ywc_flavor_nmg_high_desc:0 "New Ming can trade clearer institutions for autonomy and a federal seat."
 ywc_flavor_nmg_low:0 "Frontier Bargain Broken"
 ywc_flavor_nmg_low_desc:0 "Mexico and local communities doubt New Ming's promises, raising debt pressure."
 ywc_je_flavor_kor_reform_1:0 "The Three Offices' Seal"
 ywc_je_flavor_kor_reform_1_reason:0 "Korea must decide whether the old civil order will rule alone or maritime learning and new law may enter court."
 ywc_je_flavor_kor_reform_2:0 "Registering the Frontier"
 ywc_je_flavor_kor_reform_2_reason:0 "Settlers, garrisons, and academies along the Yalu all demand a register that will not change again."
 ywc_je_flavor_kor_reform_3:0 "Reform Credit by the Eastern Sea"
 ywc_je_flavor_kor_reform_3_reason:0 "Both the small-China claim and a national state require the court to honor its promises."
 ywc_kor.7.t:0 "The Three Offices' Seal"
 ywc_kor.7.d:0 "The old seal still moves memorials, but cannot answer whether maritime learning and new law belong in court."
 ywc_kor.7.a:0 "Let the civil offices rewrite the charter"
 ywc_kor.7.b:0 "Give the new law its own bureau"
 ywc_kor.8.t:0 "Registering the Frontier"
 ywc_kor.8.d:0 "Settlers, garrisons, and academies along the Yalu keep separate lists. The court must decide whose names belong in the state's ledger."
 ywc_kor.8.a:0 "Unify the frontier register"
 ywc_kor.8.b:0 "Register a new national roll"
 ywc_kor.9.t:0 "Reform Credit by the Eastern Sea"
 ywc_kor.9.d:0 "Korea cannot postpone reform forever behind the small-China claim, nor erase the old order with one new charter."
 ywc_kor.9.a:0 "Deliver the bureaucratic reform"
 ywc_kor.9.b:0 "Admit reform credit is broken"
 ywc_kor.9.c:0 "Run old and new systems together"
 ywc_je_flavor_lan_charter_1:0 "A Charter Beside the Pit"
 ywc_je_flavor_lan_charter_1_reason:0 "Lanfang's company charter must say who bears the profits and risks of the mines."
 ywc_je_flavor_lan_charter_2:0 "Shareholders and Villages"
 ywc_je_flavor_lan_charter_2_reason:0 "Shareholders want the books, miners want wages, and villages want boundaries before another pit opens."
 ywc_je_flavor_lan_charter_3:0 "A Company's Public Duty"
 ywc_je_flavor_lan_charter_3_reason:0 "Lanfang must decide whether the company exists only for shareholders or also for miners, villages, and defense."
 ywc_lan.7.t:0 "A Charter Beside the Pit"
 ywc_lan.7.d:0 "The pits produce tin and debt. Shareholders demand the old charter while miners and villages demand its duties on the same page."
 ywc_lan.7.a:0 "Renew the company charter"
 ywc_lan.7.b:0 "Secure village boundaries first"
 ywc_lan.8.t:0 "Shareholders and Villages"
 ywc_lan.8.d:0 "Shareholders want the returns kept in the countinghouse, miners want wages, and villages want no new road to take their land."
 ywc_lan.8.a:0 "Distribute by the company ledger"
 ywc_lan.8.b:0 "Put mineral wealth into public defense"
 ywc_lan.9.t:0 "A Company's Public Duty"
 ywc_lan.9.d:0 "Lanfang's charter is no longer only a commercial contract; it decides who pays for roads, pits, and village safety."
 ywc_lan.9.a:0 "Make the company bear public duties"
 ywc_lan.9.b:0 "Admit the accounts are discredited"
 ywc_lan.9.c:0 "Share the duties by proportion"
 ywc_je_flavor_nmg_bargain_1:0 "The First Seat at the Frontier Table"
 ywc_je_flavor_nmg_bargain_1_reason:0 "New Ming must seek a seat that cannot be withdrawn while balancing a Mexican federal seat against local defense."
 ywc_je_flavor_nmg_bargain_2:0 "Church and Autonomy"
 ywc_je_flavor_nmg_bargain_2_reason:0 "Huamo communities, missionaries, and Mexican officials all demand a boundary for New Ming's autonomy."
 ywc_je_flavor_nmg_bargain_3:0 "Two Federal Futures"
 ywc_je_flavor_nmg_bargain_3_reason:0 "New Ming must decide whether institutions buy security or frontier defense buys bargaining room."
 ywc_nmg.6.t:0 "The First Seat at the Frontier Table"
 ywc_nmg.6.d:0 "Loreto's representatives bring two petitions: one for a seat in Mexico's federation, and one for local control of defense."
 ywc_nmg.6.a:0 "Seek a federal seat"
 ywc_nmg.6.b:0 "Build local defenses first"
 ywc_nmg.7.t:0 "Church and Autonomy"
 ywc_nmg.7.d:0 "The church wants its own diocese, Huamo elites want autonomy, and Mexican officials want laws they can enforce."
 ywc_nmg.7.a:0 "Trade federal law for autonomy"
 ywc_nmg.7.b:0 "Let local councils hold the frontier"
 ywc_nmg.8.t:0 "Two Federal Futures"
 ywc_nmg.8.d:0 "Mexico's table finally recognizes New Ming, but it has not promised that the seat will always belong to New Ming."
 ywc_nmg.8.a:0 "Write the future into the federal compact"
 ywc_nmg.8.b:0 "Admit the frontier bargain has broken"
 ywc_nmg.8.c:0 "Compromise through church and council"
