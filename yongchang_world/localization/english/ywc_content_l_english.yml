 ywc_mng.1.t:0 "South of the Gobi, North of It"
 ywc_mng.1.d:0 "The southern banners trade with the Shun and dress in its fashion; the northern princes still exchange gifts with Russian agents. The khans must weigh one against the other."
 ywc_mng.1.a:0 "Lean toward the Shun."
 ywc_mng.1.b:0 "Lean toward the north."
 ywc_mng.2.t:0 "Tea for Horses"
 ywc_mng.2.d:0 "The border markets open and close at the will of Shun frontier officials. The banners ask for a fixed annual quota."
 ywc_mng.2.a:0 "Settle an annual market."
 ywc_mng.2.b:0 "Let the trade wither."
 ywc_mng.3.t:0 "The Protector's Shadow"
 ywc_mng.3.d:0 "Russian agents invite the banners to a gathering at Kyakhta, promising protection for a voice in the trade."
 ywc_mng.3.a:0 "Parley, but promise nothing."
 ywc_mng.3.b:0 "Send the agents away."
 ywc_mng.4.t:0 "A Council of All Mongols"
 ywc_mng.4.d:0 "Voices call for a pan-Mongol assembly to choose a common spokesman for steppe affairs."
 ywc_mng.4.a:0 "Attend and deliberate."
 ywc_mng.4.b:0 "Refuse the assembly."
 ywc_mng.5.t:0 "The Southern Caravan Road"
 ywc_mng.5.d:0 "Expanding the caravan trade southward promises wool profits — and deeper dependence on the Shun frontier."
 ywc_mng.5.a:0 "Expand the road."
 ywc_mng.5.b:0 "The road stays closed."
 ywc_mng.5.c:0 "Hold at today's trade."
 ywc_mng.6.t:0 "Under the Tsar's Wing"
 ywc_mng.6.d:0 "A formal protection treaty with Russia would arm the northern banners — and answer to a distant throne."
 ywc_mng.6.a:0 "Sign the protection."
 ywc_mng.6.b:0 "The treaty stalls."
 ywc_mng.6.c:0 "Watch and wait."
