 ywc_oir.1.t:0 "The Dzungar Legacy"
 ywc_oir.1.d:0 "Half a century after the khanate fell, the elders argue over what the Oirat should carry forward: its armies, its law, or only its grief."
 ywc_oir.1.a:0 "Reform and endure."
 ywc_oir.1.b:0 "Dream of the old horde."
 ywc_oir.2.t:0 "Cossacks at the Passes"
 ywc_oir.2.d:0 "Russian border posts creep toward the Ili passes, demanding trade privileges and grazing rights."
 ywc_oir.2.a:0 "Buy them off with trade."
 ywc_oir.2.b:0 "Close the passes."
 ywc_oir.3.t:0 "The Ili Caravan"
 ywc_oir.3.d:0 "Tarim caravans and Russian merchants bid for the taxes of the Ili bazaar."
 ywc_oir.3.a:0 "Set an official tariff."
 ywc_oir.3.b:0 "Let the merchants fight it out."
 ywc_oir.4.t:0 "The Empty Saddle"
 ywc_oir.4.d:0 "The old khan is dying, and every banner has its own candidate."
 ywc_oir.4.a:0 "Raise a common khan."
 ywc_oir.4.b:0 "Let the banners split."
 ywc_oir.5.t:0 "A Khanate of Scribes"
 ywc_oir.5.d:0 "Reformers propose governing by written code and appointed officials, after the manner of Shun and Russia."
 ywc_oir.5.a:0 "Rule by code."
 ywc_oir.5.b:0 "The noyons resist."
 ywc_oir.5.c:0 "Go slowly."
 ywc_oir.6.t:0 "A Federation of Pastures"
 ywc_oir.6.d:0 "The banners propose a federation of pastures: shared herds, shared defense, no khan above them all."
 ywc_oir.6.a:0 "Bind the federation."
 ywc_oir.6.b:0 "The pact collapses."
 ywc_oir.6.c:0 "Set the pact aside."
