l_english:
 ywc_v03_enable_legacy_save:0 "Register Legacy Save and Enable v0.3 Content"
 ywc_v03_enable_legacy_save_desc:0 "Register this country's save by its actual chapter-one progress. An unstarted legacy chapter allows the corresponding v0.3 prototype. An ongoing chapter continues in place and skips the duplicate new opening. A completed or failed chapter preserves its outcome and later progress, also skipping that opening. A skip is not reform success: no opening costs are charged again and no rewards are granted. An already-started v0.3 arc takes priority, preserving its counters, queued events, timers and debt. Existing laws, territory and paid costs are preserved. Paid costs are not refunded."
