 ywc_v03_enable_legacy_save:0 "Register Legacy Save and Enable v0.3 Content"
 ywc_v03_enable_legacy_save_desc:0 "Register this country's legacy save and enable the v0.3 content entry. Existing laws, territory, completed outcomes, and paid costs are preserved. Paid costs are not refunded, and rewards are not granted automatically. Ongoing legacy arcs keep their progress; a legacy arc stops advancing only after its corresponding v0.3 arc actually starts. This decision does not otherwise alter the country."
