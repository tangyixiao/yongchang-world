l_english:
 ABN_FLAVOR_TEXT:0 "Alban clans move between steppe and mountain corridors, coordinating pasture, caravan escorts, and border guarantees through their assembly. Pasture, oaths, and common defence hold the steppe clans together. Excessive fixed service can drive them away; without coordination of winter camps and border markets, better-organized neighbours will steadily press in. Should the assembly settle pasture and caravan escorts together, or leave each camp to decide for itself?"
 AHM_FLAVOR_TEXT:0 "Ahom authority rests on the Brahmaputra valley and hill frontier, under pressure from both Burma and British India. Coastal and island communities live by sea lanes, harbours, and mutual trust. Control of port dues, arbitration between islands, and protection of fisheries determines whether merchants keep calling. Under pressure from Burma and British India, should the Ahom court rely on valley defences or use the hill routes to preserve room to manoeuvre?"
 AKS_FLAVOR_TEXT:0 "Aksu links Tarim oases with Ili trade; town defences and water management determine whether it can withstand stronger khanates. Oasis towns depend on canals, bazaars, and caravan roads. Higher tolls can fund offices but divert merchants to another stop; an easy passage can turn a temporary concession into a lasting claim. Should Aksu spend its limited revenue on oasis canals or on the trade road to Ili?"
 AMD_FLAVOR_TEXT:0 "Amdo's monasteries, pastoralists, and caravan towns jointly shape the northeastern plateau; policy needs religious and local consent. Authority in the highlands rests on seasonal passes, local promises, and a narrow tax base. Orders that bypass local compacts rarely cross the mountains; old bargains alone cannot pay for new roads or defence. How can Amdo win consent from monasteries, pastoral households, and market towns for roads and defence?"
 AMR_FLAVOR_TEXT:0 "Settlements on the Amur depend on fishing, timber, and river traffic; frontier rule must accommodate Tungusic communities and outside traders. Forests and river valleys leave settlements far apart. Rivers are both trade routes and channels for outside influence. Ports, stores, and local justice must work before lines on a frontier map become everyday authority. Should Amur communities govern river traffic together, or give priority to frontier posts and outside traders?"
 BKY_FLAVOR_TEXT:0 "Barkul lies north of the Tian Shan on the Qing military route toward Ili and the Dzungar steppe. Qing offices, garrisons, and Mongol banners all shape its defence; Russian trade brings goods and a new contest for influence. Are Russian trade revenues worth accepting a wider Qing and banner presence in Barkul?"
 BYL_FLAVOR_TEXT:0 "The Bai-Ul league sustains steppe defence through clan oaths, balancing shared cavalry duties against pasture autonomy. Pasture, oaths, and common defence hold the steppe clans together. Excessive fixed service can drive them away; without coordination of winter camps and border markets, better-organized neighbours will steadily press in. How much shared cavalry service will the Bai-Ul clans accept before pasture autonomy is at risk?"
 CHD_FLAVOR_TEXT:0 "Chamdo's monasteries and Kham chiefs control passes linking Lhasa, Sichuan, and Qinghai, balancing toll revenue with religious authority. Authority in the highlands rests on seasonal passes, local promises, and a narrow tax base. Orders that bypass local compacts rarely cross the mountains; old bargains alone cannot pay for new roads or defence. Should Chamdo's toll revenue remain shared by monasteries and Kham chiefs, or be gathered under one authority?"
 CHI_FLAVOR_TEXT:0 "Great Qing relies on Manchu offices and banner forces for restoration while rebuilding authority between Great Shun and the Russian frontier. A frontier ruler's orders often reach only towns and nearby settlements; older chiefs and local custom govern farther out. More troops can deter rivals for a time, but consume the budget needed for offices, roads, and stores. Should Great Qing rely on its banners and Manchu offices, or use Russian trade to counter pressure from Great Shun?"
 CHR_FLAVOR_TEXT:0 "Chahar clans lie between the steppe and North China, using oaths and cavalry coordination as bargaining power with Great Shun and northern rivals. Pasture, oaths, and common defence hold the steppe clans together. Excessive fixed service can drive them away; without coordination of winter camps and border markets, better-organized neighbours will steadily press in. Should Chahar cavalry compacts answer to Great Shun, or remain under a clan council that preserves room to choose?"
 DER_FLAVOR_TEXT:0 "Derge depends on its printing house, monastic estates, and caravans across Kham. Registers and roads can strengthen the state, but require consent from religious authorities and chiefs along the route. How much authority over Derge's printing house and road registers should be shared by religious and lay leaders?"
 DLI_FLAVOR_TEXT:0 "Dali links western Yunnan's hills with Burmese trade routes; garrisons and diverse towns demand recognized local autonomy. Coastal and island communities live by sea lanes, harbours, and mutual trust. Control of port dues, arbitration between islands, and protection of fisheries determines whether merchants keep calling. Can Dali secure the Burmese trade routes while giving its diverse towns a formal voice in local rule?"
 DMG_FLAVOR_TEXT:0 "Eastern Ming has built a Ming-descended court on Luzon. Spain presses its claims, while Ilocano and other local communities must decide whether to trust the new state. A dynastic name becomes a foundation only when written into a shared compact. How can Eastern Ming resist Spain and persuade Ilocano communities to make the Ming name part of a shared state?"
 DRZ_FLAVOR_TEXT:0 "Routes around Delingha link Lake Qinghai with the Qaidam Basin. Muslim merchants and local chiefs depend on wells and relay stations; the state's task is to protect trans-highland trade and balance neighbouring groups, not to govern through monastic estates. How can Delingha protect its wells and trans-highland routes without letting a neighbouring khanate monopolize tolls?"
 GYL_FLAVOR_TEXT:0 "The Gyalrong tribes seek a balance among farms, mountain passes, and common defence. A durable league requires clear rules for each member's voice, service, and share of the gains. If the Gyalrong league establishes common defence, how should it divide seats, service, and revenue among its tribes?"
 HMI_FLAVOR_TEXT:0 "Hami guards a gateway across the Tian Shan; irrigation, relay stations, and traffic with Qing offices and western caravans sustain the emir. Oasis towns depend on canals, bazaars, and caravan roads. Higher tolls can fund offices but divert merchants to another stop; an easy passage can turn a temporary concession into a lasting claim. How far should Hami open to Qing offices and western caravans while keeping the returns from its relays and canals?"
 HOR_FLAVOR_TEXT:0 "The Hor states unite through pasture and northern Tibetan trade; any common military service needs the chiefs' consent. Authority in the highlands rests on seasonal passes, local promises, and a narrow tax base. Orders that bypass local compacts rarely cross the mountains; old bargains alone cannot pay for new roads or defence. What common service would the Hor states accept to protect northern Tibetan trade?"
 HSR_FLAVOR_TEXT:0 "The Hui towns of the Hehuang valley rely on oasis farming, mosque networks, and trade toward Tibet. Nearby powers seek control of passes and dues; local politics turns on protecting communal autonomy while keeping routes open. How can the Hui towns of Hehuang protect communal autonomy while keeping neighbouring powers from taking their trade dues?"
 HUL_FLAVOR_TEXT:0 "The Hulun clans must coordinate pasture and border defence while preventing trade from becoming a neighbour's permanent foothold. Pasture, oaths, and common defence hold the steppe clans together. Excessive fixed service can drive them away; without coordination of winter camps and border markets, better-organized neighbours will steadily press in. Can Hulun trade bring frontier guarantees without allowing a neighbour to station permanent forces?"
 HXI_FLAVOR_TEXT:0 "The Hexi corridor garrisons depend on relay roads, military farms, and passes for supply. Great Shun needs them to secure the western trade route, while commanders demand room over levies and provisions; restoring signal towers and depots matters more than river timber traffic. Should Hexi commanders hand levies and mobilization to Great Shun, or keep those decisions local?"
 JHG_FLAVOR_TEXT:0 "Jinghai rests on the Zheng fleet, merchant houses, and its tributary ties to Great Shun. Convoys and ports can bring wealth, while dockyards, tribute, and autonomy compete for the same budget. How can Jinghai maintain its fleet and dockyards while preserving port autonomy and its tribute obligations to Great Shun?"
 JTR_FLAVOR_TEXT:0 "The Seven Juz span the northern Tian Shan and steppe, where Russian settlement and frontier growth make migration rights central. Pasture, oaths, and common defence hold the steppe clans together. Excessive fixed service can drive them away; without coordination of winter camps and border markets, better-organized neighbours will steadily press in. How can the Seven Juz protect seasonal migration as Russian settlement and frontier posts advance?"
 KAM_FLAVOR_TEXT:0 "Kham chiefs control mountain crossings and face demands from Great Shun's frontier offices and Lhasa's religious influence. Authority in the highlands rests on seasonal passes, local promises, and a narrow tax base. Orders that bypass local compacts rarely cross the mountains; old bargains alone cannot pay for new roads or defence. What compact can Kham chiefs accept while answering both Great Shun's frontier demands and Lhasa's religious influence?"
 KCH_FLAVOR_TEXT:0 "Kachin hills connect routes between Assam, Burma, and Yunnan; chiefs trade passage for security and market access. Coastal and island communities live by sea lanes, harbours, and mutual trust. Control of port dues, arbitration between islands, and protection of fisheries determines whether merchants keep calling. Should Kachin passage rights buy security guarantees from Assam, Burma, or Yunnan?"
 KER_FLAVOR_TEXT:0 "The Kereit league must coordinate scattered pasture and seasonal service; the khan's authority rests on fair shares for each clan. Pasture, oaths, and common defence hold the steppe clans together. Excessive fixed service can drive them away; without coordination of winter camps and border markets, better-organized neighbours will steadily press in. How should the Kereit clans share seasonal service so smaller camps retain fair pasture?"
 KGL_FLAVOR_TEXT:0 "The Kongrat Khanate organizes clans around pasture and Syr Darya trade, resisting attempts by oasis powers to turn commerce into subordination. Oasis towns depend on canals, bazaars, and caravan roads. Higher tolls can fund offices but divert merchants to another stop; an easy passage can turn a temporary concession into a lasting claim. Can the Kongrat Khanate open Syr Darya trade without letting Bukhara turn commerce into subordination?"
 KHO_FLAVOR_TEXT:0 "The Khoshut Khanate must sustain compacts across Qinghai pasture, Tibetan Buddhist institutions, and trade toward Tibet. Authority in the highlands rests on seasonal passes, local promises, and a narrow tax base. Orders that bypass local compacts rarely cross the mountains; old bargains alone cannot pay for new roads or defence. How should the Khoshut Khanate balance Qinghai pasture, monastic interests, and trade toward Tibet?"
 KHQ_FLAVOR_TEXT:0 "Khorchin banners must protect pasture and preserve room to choose partners among Qing Manchuria, Great Shun, and Russia. Pasture, oaths, and common defence hold the steppe clans together. Excessive fixed service can drive them away; without coordination of winter camps and border markets, better-organized neighbours will steadily press in. Where should Khorchin banners draw the line between alliance with Qing Manchuria, Great Shun, and Russia?"
 KHT_FLAVOR_TEXT:0 "Khotan's oasis farms and jade trade depend on canals and southern passes, making route security essential to local revenue. Oasis towns depend on canals, bazaars, and caravan roads. Higher tolls can fund offices but divert merchants to another stop; an easy passage can turn a temporary concession into a lasting claim. Should Khotan first protect jade caravans and southern passes, or secure irrigation for its oasis farms?"
 KIR_FLAVOR_TEXT:0 "Kyrgyz clans range across Tian Shan pasture and must coordinate seasonal migration between the Russian frontier and Central Asian khanates. A frontier ruler's orders often reach only towns and nearby settlements; older chiefs and local custom govern farther out. More troops can deter rivals for a time, but consume the budget needed for offices, roads, and stores. Can Kyrgyz clans coordinate migration across the Tian Shan without becoming bound by Russian posts or khanate service?"
 KOR_FLAVOR_TEXT:0 "Joseon has a mature civil administration, constrained by frontier security, ritual standing, and new maritime knowledge. Reform depends on the court earning the trust of offices and garrisons to carry it out. Should Joseon prioritize coastal defence and new learning, or first earn the officials' and garrisons' trust to carry out reform?"
 KRS_FLAVOR_TEXT:0 "Karshi links routes from Bukhara toward Afghanistan; oasis irrigation and frontier defence both draw on the emir's treasury. Oasis towns depend on canals, bazaars, and caravan roads. Higher tolls can fund offices but divert merchants to another stop; an easy passage can turn a temporary concession into a lasting claim. Should Karshi direct its treasury toward oasis irrigation or frontier defence toward Afghanistan?"
 KSH_FLAVOR_TEXT:0 "Kashgar links Ferghana to the Tarim Basin, leaving the khanate exposed to rivalry over caravans and border compacts. Oasis towns depend on canals, bazaars, and caravan roads. Higher tolls can fund offices but divert merchants to another stop; an easy passage can turn a temporary concession into a lasting claim. Should Kashgar keep Ferghana caravans moving freely, or seek security for the khanate through tighter border compacts?"
 KTG_FLAVOR_TEXT:0 "Kengtung controls Shan passes and tea routes, balancing Burma's court, Lan Na neighbours, and Great Shun's envoys. Coastal and island communities live by sea lanes, harbours, and mutual trust. Control of port dues, arbitration between islands, and protection of fisheries determines whether merchants keep calling. How can Kengtung protect its tea routes and local arbitration among Burma, Lan Na, and Great Shun?"
 KUC_FLAVOR_TEXT:0 "Kucha's oasis sits on the Tarim trade road, where water rights and relay security matter more than territorial expansion. Oasis towns depend on canals, bazaars, and caravan roads. Higher tolls can fund offices but divert merchants to another stop; an easy passage can turn a temporary concession into a lasting claim. Should Kucha first repair Tarim canals or strengthen the town guards that keep its relay stations secure?"
 KZH_FLAVOR_TEXT:0 "This steppe league must coordinate pasture, oaths, and common defence amid rivalry among neighbouring khanates. Pasture, oaths, and common defence hold the steppe clans together. Excessive fixed service can drive them away; without coordination of winter camps and border markets, better-organized neighbours will steadily press in. What oath can unite this steppe league over pasture without handing its defence to a neighbouring khanate?"
 LAD_FLAVOR_TEXT:0 "Ladakh links Kashmir and Tibet through high passes, making route security and seasonal trade central to royal revenue. Authority in the highlands rests on seasonal passes, local promises, and a narrow tax base. Orders that bypass local compacts rarely cross the mountains; old bargains alone cannot pay for new roads or defence. How can Ladakh secure seasonal trade between Kashmir and Tibet without turning its passes into a pretext for foreign garrisons?"
 LAN_FLAVOR_TEXT:0 "Lanfang's mines, company charters, and Hakka settlements depend on one another as Dutch power presses for greater access to ports and claims. A company republic endures only if profits carry duties to roads, workers, and defence. Should Lanfang's mining profits favour company shareholders, or fund roads, workers, and defence for Hakka settlements?"
 LJG_FLAVOR_TEXT:0 "The Mu house of Lijiang relies on mountain trade, salt licences, and local compacts. As Great Shun reorganizes the frontier, it must secure passage while respecting Naxi communities' boundaries. How can the Mu house keep its salt roads open while respecting the old boundaries of Naxi communities?"
 LTG_FLAVOR_TEXT:0 "Litang sits on a Kham transit route, where monastic estates and pastoral service both sustain local government. Authority in the highlands rests on seasonal passes, local promises, and a narrow tax base. Orders that bypass local compacts rarely cross the mountains; old bargains alone cannot pay for new roads or defence. Who should decide how Litang's monastic estates and pastoral households share the costs of roads and local government?"
 LXJ_FLAVOR_TEXT:0 "Lijiang's Mu house relies on Naxi communities, salt roads, and tea-horse trade; outside frontier reforms challenge its autonomy. Authority in the highlands rests on seasonal passes, local promises, and a narrow tax base. Orders that bypass local compacts rarely cross the mountains; old bargains alone cannot pay for new roads or defence. As Great Shun reorganizes the frontier, how much discretion should the Mu house yield in return for recognition of its trade routes and old compacts?"
 MEV_FLAVOR_TEXT:0 "Merv links Persia and Central Asia through oasis irrigation and desert caravans, making waterworks and merchant protection more urgent than conquest. Oasis towns depend on canals, bazaars, and caravan roads. Higher tolls can fund offices but divert merchants to another stop; an easy passage can turn a temporary concession into a lasting claim. Should Merv spend its limited means first on waterworks or on protecting desert caravans?"
 MHG_FLAVOR_TEXT:0 "The Mekong Chinese Republic rests on delta shipping, rice cultivation, and cross-border commerce; its institutions must protect local land rights and govern shared waterways. Coastal and island communities live by sea lanes, harbours, and mutual trust. Control of port dues, arbitration between islands, and protection of fisheries determines whether merchants keep calling. How will the Mekong Chinese state protect riverside land rights while governing waterways shared across communities?"
 MHL_FLAVOR_TEXT:0 "Marshallese atolls depend on navigation, copra, and shared fisheries; maritime supply and chiefly compacts shape defence. Island governments depend on ports, fisheries, and news by sea. Foreign ships bring scarce supplies but raise fears that outsiders will control harbour dues and justice; closing the bays makes provisions costlier too. How should the Marshallese atolls share maritime supply and patrols so their chiefly compact holds?"
 MRG_FLAVOR_TEXT:0 "The Marege alliance spans Australia's northern coast; communities must protect their land and sea trade amid British colonial expansion. Forests and river valleys leave settlements far apart. Rivers are both trade routes and channels for outside influence. Ports, stores, and local justice must work before lines on a frontier map become everyday authority. How can Marege communities defend northern lands and sea trade as British colonial expansion advances?"
 NMG_FLAVOR_TEXT:0 "New Ming governs a Chinese-Mexican frontier in Baja California and must negotiate autonomy, federal representation, and local defence with Mexico. Church networks and plural communities can bind the state together, but require visible institutional guarantees. Should New Ming make autonomy, federal representation, or local defence its first guarantee in negotiations with Mexico?"
 NMN_FLAVOR_TEXT:0 "Naiman clans hold their league through steppe compacts and cavalry cooperation while neighbouring powers court their border routes. Pasture, oaths, and common defence hold the steppe clans together. Excessive fixed service can drive them away; without coordination of winter camps and border markets, better-organized neighbours will steadily press in. Which border routes will Naiman clans open without letting trade become a neighbour's instrument of control?"
 NQG_FLAVOR_TEXT:0 "Northern Qing's exile court has retreated to Sakhalin, where restorationist memory cannot replace stores, ports, or the consent of island communities. Northern powers offer trade and protection while demanding a voice over diplomacy and the coast. Should Northern Qing accept northern protection of its coast, or risk building the ports and stores needed for restoration on its own?"
 ODS_FLAVOR_TEXT:0 "Ordos banners control the Yellow River bend and southern grazing routes; their leader must share pasture and resist outside attempts to divide the league. Pasture, oaths, and common defence hold the steppe clans together. Excessive fixed service can drive them away; without coordination of winter camps and border markets, better-organized neighbours will steadily press in. How can Ordos banners coordinate the Yellow River bend and southern grazing routes before outside powers court them separately?"
 OIR_FLAVOR_TEXT:0 "The Oirat Khanate inherits Dzungar institutions, Ili's caravan trade, and competing banners. Common pasture law can strengthen the khan, yet drive resistant clans toward outside patrons. Can common pasture law strengthen the Oirat khan without driving dissenting banners toward outside patrons?"
 OZH_FLAVOR_TEXT:0 "Clans unite around pasture and caravan roads, but fixed military service can weaken the confederation's leader. Pasture, oaths, and common defence hold the steppe clans together. Excessive fixed service can drive them away; without coordination of winter camps and border markets, better-organized neighbours will steadily press in. What compact can coordinate pasture and trade without fixed service weakening the clans' loyalty?"
 PLW_FLAVOR_TEXT:0 "Palau's island communities depend on reef fisheries and safe anchorages, while visiting ships must respect local jurisdiction. Island governments depend on ports, fisheries, and news by sea. Foreign ships bring scarce supplies but raise fears that outsiders will control harbour dues and justice; closing the bays makes provisions costlier too. Can Palau welcome visiting ships for supplies while keeping harbour disputes under local jurisdiction?"
 PNP_FLAVOR_TEXT:0 "Pohnpei's chiefdoms negotiate over harbours, farmland, and inter-island routes; foreign ships bring trade and sovereignty disputes. Island governments depend on ports, fisheries, and news by sea. Foreign ships bring scarce supplies but raise fears that outsiders will control harbour dues and justice; closing the bays makes provisions costlier too. After Pohnpei opens its harbours, how will its chiefdoms retain authority over farmland, anchorages, and inter-island disputes?"
 QRT_FLAVOR_TEXT:0 "Karategin's mountain chiefs control passes toward Ferghana, exchanging access for autonomy and security guarantees. Authority in the highlands rests on seasonal passes, local promises, and a narrow tax base. Orders that bypass local compacts rarely cross the mountains; old bargains alone cannot pay for new roads or defence. How much access to its mountain routes should Karategin exchange for local autonomy and frontier security?"
 RKN_FLAVOR_TEXT:0 "Arakan preserves its room to act through coastal ports and mountain routes while facing British protection demands and Burmese influence. Trade can fund the state, but each diplomatic promise redraws its boundaries. Should Arakan accept British protection, or rely on its ports and mountain routes to resist Burmese influence?"
 SHB_FLAVOR_TEXT:0 "Shahrisabz sustains local rule through oasis farms and mountain trade, while Bukhara and neighbouring khanates seek its revenue. Oasis towns depend on canals, bazaars, and caravan roads. Higher tolls can fund offices but divert merchants to another stop; an easy passage can turn a temporary concession into a lasting claim. How can Shahrisabz keep its oasis revenue without letting Bukhara absorb its trade into the emirate?"
 SHD_FLAVOR_TEXT:0 "The Shan council links scattered hill territories while answering pressure from Great Shun, Burma, and Britain. Common dues and patrols can bring security if each chief retains a voice in arbitration. Can the Shan council organize common patrols and dues while leaving each chief a real voice in arbitration?"
 SHU_FLAVOR_TEXT:0 "Great Shun inherited China's central offices and a vast realm, but must renegotiate authority among military households, local gentry, and a changing administration. Unity remains powerful; treasury and frontier will test whether the court can keep its promises. How should Great Shun divide authority among military households, local gentry, and its changing administration?"
 SIP_FLAVOR_TEXT:0 "The rulers of Kengtung sustain a mandala order through tea hills, passes, and seasonal tribute. Envoys from Great Shun and Burma both bring demands; council deliberation must secure room between them. How can the rulers of Kengtung answer tribute demands from Great Shun and Burma while preserving room for council decisions?"
 SMR_FLAVOR_TEXT:0 "Samarkand prospers through Zeravshan irrigation and Silk Road markets, with merchants and surrounding oases shaping its rule. Oasis towns depend on canals, bazaars, and caravan roads. Higher tolls can fund offices but divert merchants to another stop; an easy passage can turn a temporary concession into a lasting claim. Should Samarkand's merchants or its surrounding oases set the rules for irrigation and Silk Road tolls?"
 SOL_FLAVOR_TEXT:0 "Solon communities spread along the Amur basin, where river traffic and frontier posts hold the league together. Pasture, oaths, and common defence hold the steppe clans together. Excessive fixed service can drive them away; without coordination of winter camps and border markets, better-organized neighbours will steadily press in. How can Solon communities govern river traffic and frontier posts together without falling under outside control?"
 TIB_FLAVOR_TEXT:0 "The Ganden Phodrang's monasteries, nobles, and Kham chiefs jointly shape the highland order. Monastic estates sustain administration and troops; local compacts decide whether Lhasa's orders cross the passes. How can Lhasa's orders cross local compacts while sustaining the monasteries and winning Kham chiefs' cooperation?"
 TKK_FLAVOR_TEXT:0 "Teke clans guard oases and routes south of Khiva, facing threats to their independence from pasture pressures and Russian expansion around the Caspian. Oasis towns depend on canals, bazaars, and caravan roads. Higher tolls can fund offices but divert merchants to another stop; an easy passage can turn a temporary concession into a lasting claim. Should Teke clans prioritize the Khiva routes or wider pasture access as Russian expansion advances?"
 TRF_FLAVOR_TEXT:0 "Turfan relies on karez irrigation and vineyards while defending routes toward the Tarim and the northern Tian Shan. Oasis towns depend on canals, bazaars, and caravan roads. Higher tolls can fund offices but divert merchants to another stop; an easy passage can turn a temporary concession into a lasting claim. How should Turfan balance karez upkeep and vineyard income while protecting its routes to the Tarim?"
 TSK_FLAVOR_TEXT:0 "Tashkent is a commercial hinge between Central Asian oases and the steppe; urban autonomy, tolls, and the khan's authority shape its diplomacy. Oasis towns depend on canals, bazaars, and caravan roads. Higher tolls can fund offices but divert merchants to another stop; an easy passage can turn a temporary concession into a lasting claim. Should Tashkent trade urban autonomy for open commerce, or let the khan centralize tolls and diplomacy?"
 UZH_FLAVOR_TEXT:0 "The league sits between northern pasture and southern oasis routes; its members want trade without subordination to a neighbour. Pasture, oaths, and common defence hold the steppe clans together. Excessive fixed service can drive them away; without coordination of winter camps and border markets, better-organized neighbours will steadily press in. How far should this league expand trade with the southern oases without coming under their control?"
 WAA_FLAVOR_TEXT:0 "Wa hill territories unite through local chiefs and markets; common defence must respect authority dispersed among villages. Coastal and island communities live by sea lanes, harbours, and mutual trust. Control of port dues, arbitration between islands, and protection of fisheries determines whether merchants keep calling. How can Wa common defence respect village authority without leaving the confederation unable to act together?"
 WBK_FLAVOR_TEXT:0 "West Borneo's mining league depends on river-mouth trade and must balance company charters, Chinese community autonomy, and coastal rivals. Coastal and island communities live by sea lanes, harbours, and mutual trust. Control of port dues, arbitration between islands, and protection of fisheries determines whether merchants keep calling. How should West Borneo's mining league constrain company charters while protecting Hakka communities and river-mouth trade?"
 YAP_FLAVOR_TEXT:0 "Yap's stone-money networks and inter-island navigation sustain local prestige; open harbours must coexist with customary arbitration. Island governments depend on ports, fisheries, and news by sea. Foreign ships bring scarce supplies but raise fears that outsiders will control harbour dues and justice; closing the bays makes provisions costlier too. After Yap opens its harbours, can customary arbitration still settle disputes over navigation and stone-money networks?"
 YMD_FLAVOR_TEXT:0 "Yomut clans link the Caspian shore with Khiva's routes, relying on flexible bargains for sea trade and steppe migration. Oasis towns depend on canals, bazaars, and caravan roads. Higher tolls can fund offices but divert merchants to another stop; an easy passage can turn a temporary concession into a lasting claim. How can Yomut clans balance Caspian trade with steppe migration without letting Khiva or Russia monopolize passage?"
 YRK_FLAVOR_TEXT:0 "Yarkand rests on oasis irrigation and Silk Road markets; disputes over canals and tolls reach both towns and villages. Oasis towns depend on canals, bazaars, and caravan roads. Higher tolls can fund offices but divert merchants to another stop; an easy passage can turn a temporary concession into a lasting claim. Should Yarkand first repair its canals or standardize tolls to sustain both towns and villages?"
 ZHL_FLAVOR_TEXT:0 "Zhalair clans link the northern steppe with oasis frontiers, seeking trade and common defence without outside control. Pasture, oaths, and common defence hold the steppe clans together. Excessive fixed service can drive them away; without coordination of winter camps and border markets, better-organized neighbours will steadily press in. How can Zhalair clans expand trade and common defence while preventing a neighbour from gaining permanent control?"
 MGL_FLAVOR_TEXT:0 "The Khalkha Khanate stands between Great Shun's tea-horse markets and Russia's northern road. Both routes bring supplies and revenue; either patron's guarantees can narrow the khanate's room to act. Should the Khalkha Khanate rely on Great Shun's tea-horse markets or accept the protection and limits of Russia's northern route?"
 DAI_FLAVOR_TEXT:0 "Dai Nam governs the Vietnamese heartland east of the Mekong. Extending garrisons and offices can improve security, but draws resources from agriculture, roads, and coastal trade. Should Dai Nam expand coastal defences and offices, or keep resources for agriculture, roads, and port trade?"
