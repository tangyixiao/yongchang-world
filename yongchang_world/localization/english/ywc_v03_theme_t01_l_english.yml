 ywc_je_v03_t01_reform_transmission:0 "A Foreign Memorial Reaches the Court"
 ywc_je_v03_t01_reform_transmission_reason:0 "Korea has a school result; Shu reviews a local office shortage and chooses a paid visit, a pilot, or its own practice."
 ywc_society.1000.t:0 "A Translated Regulation"
 ywc_society.1000.d:0 "Korea has completed a school settlement. The translated regulation reaches Shu, whose office shortage still needs a local audit."
 ywc_society.1000.examine:0 "Examine the regulation and local shortage"
 ywc_society.1000.examine.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1000.examine.consequence_tooltip:0 "Records this decision."
 ywc_society.1000.decline:0 "Keep local practice"
 ywc_society.1000.decline.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1000.decline.consequence_tooltip:0 "Records this decision."
 ywc_society.1000.wait:0 "Wait and review again"
 ywc_society.1000.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1000.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1001.t:0 "The Delegation Bill"
 ywc_society.1001.d:0 "An observing delegation requires transport, translation and lodging. A paid bill is not collected twice on reconsideration."
 ywc_society.1001.pay:0 "Pay 1,000 for a delegation"
 ywc_society.1001.pay.cost_tooltip:0 "Shu pays 1,000 from its treasury."
 ywc_society.1001.pay.consequence_tooltip:0 "Records this decision."
 ywc_society.1001.reuse:0 "Use the paid delegation record"
 ywc_society.1001.reuse.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1001.reuse.consequence_tooltip:0 "Records this decision."
 ywc_society.1001.decline:0 "Proceed without a delegation"
 ywc_society.1001.decline.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1001.decline.consequence_tooltip:0 "Records this decision."
 ywc_society.1001.wait:0 "Wait and review again"
 ywc_society.1001.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1001.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1002.t:0 "A Tax Base That Cannot Be Copied"
 ywc_society.1002.d:0 "Korea relied on its own tax base and schools. Shu must fund a local pilot or reduce its ambition to existing resources."
 ywc_society.1002.budget:0 "Pay 500 for a local budget"
 ywc_society.1002.budget.cost_tooltip:0 "Shu pays 500 from its treasury."
 ywc_society.1002.budget.consequence_tooltip:0 "Records this decision."
 ywc_society.1002.reuse:0 "Reuse the paid budget"
 ywc_society.1002.reuse.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1002.reuse.consequence_tooltip:0 "Records this decision."
 ywc_society.1002.limited:0 "Prepare a limited local trial"
 ywc_society.1002.limited.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1002.limited.consequence_tooltip:0 "Records this decision."
 ywc_society.1002.decline:0 "Stop preparations"
 ywc_society.1002.decline.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1002.decline.consequence_tooltip:0 "Records this decision."
 ywc_society.1002.wait:0 "Wait and review again"
 ywc_society.1002.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1002.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1003.t:0 "A Request to the Reforming Court"
 ywc_society.1003.d:0 "Shu requests Korea’s experience with schools and accounts. Korea may pay to prepare its records or decline."
 ywc_society.1003.share:0 "Pay 1,000 to prepare and share records"
 ywc_society.1003.share.cost_tooltip:0 "Korea pays 1,000; no transfer to Shu."
 ywc_society.1003.share.consequence_tooltip:0 "Records this decision."
 ywc_society.1003.refuse:0 "Decline the outside request"
 ywc_society.1003.refuse.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1003.refuse.consequence_tooltip:0 "Records this decision."
 ywc_society.1003.wait:0 "Wait before responding"
 ywc_society.1003.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1003.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1004.t:0 "The Opposition Quotes a Neighbor"
 ywc_society.1004.d:0 "Opponents cite the controversy in Korea. Shu can invite local representatives to inspect the plan or keep the office-led review."
 ywc_society.1004.consult:0 "Invite local representatives"
 ywc_society.1004.consult.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1004.consult.consequence_tooltip:0 "Records this decision."
 ywc_society.1004.office:0 "Keep the office-led review"
 ywc_society.1004.office.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1004.office.consequence_tooltip:0 "Records this decision."
 ywc_society.1004.wait:0 "Wait and review again"
 ywc_society.1004.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1004.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1005.t:0 "Pilot and Local Practice"
 ywc_society.1005.d:0 "A one-year administrative pilot requires an actual treasury payment. Neither Shu’s tax law nor Korea’s laws change automatically."
 ywc_society.1005.trial:0 "Pay 1,500 for a one-year pilot"
 ywc_society.1005.trial.cost_tooltip:0 "Shu pays 1,500; the administrative modifier lasts one year."
 ywc_society.1005.trial.consequence_tooltip:0 "The local office pilots the plan; Korea receives its own report."
 ywc_society.1005.limited:0 "Choose limited learning instead"
 ywc_society.1005.limited.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1005.limited.consequence_tooltip:0 "Records this decision."
 ywc_society.1005.wait:0 "Wait and review again"
 ywc_society.1005.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1005.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1006.t:0 "We Did Not Copy It"
 ywc_society.1006.d:0 "Keeping local practice or retaining the papers is a valid outcome. If Korea is unavailable, Shu can close alone; expenses already paid are not refunded."
 ywc_society.1006.report:0 "Send the limited result to Korea"
 ywc_society.1006.report.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1006.report.consequence_tooltip:0 "Records this decision."
 ywc_society.1006.reconsider:0 "Reconsider local needs"
 ywc_society.1006.reconsider.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1006.reconsider.consequence_tooltip:0 "Records this decision."
 ywc_society.1006.alone:0 "Close locally because the partner is unavailable"
 ywc_society.1006.alone.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1006.alone.consequence_tooltip:0 "Records this decision."
 ywc_society.1006.wait:0 "Wait and review again"
 ywc_society.1006.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1006.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1007.t:0 "Two Different Reports"
 ywc_society.1007.d:0 "Korea may welcome Shu’s choice or emphasize that its own system cannot guarantee results elsewhere. Each retains its own institutions and budget."
 ywc_society.1007.welcome:0 "Welcome the independent decision"
 ywc_society.1007.welcome.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1007.welcome.consequence_tooltip:0 "Korea gains 5 relations with Shu."
 ywc_society.1007.reserve:0 "Record reservations and differences"
 ywc_society.1007.reserve.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1007.reserve.consequence_tooltip:0 "Korea loses 5 relations with Shu."
 ywc_society.1007.wait:0 "Wait before responding"
 ywc_society.1007.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1007.wait.consequence_tooltip:0 "Records this decision."
