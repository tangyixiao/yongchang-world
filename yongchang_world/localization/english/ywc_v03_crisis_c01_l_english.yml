l_english:
 ywc_je_v03_c01_envoy_roster_and_treaties:0 "The Envoy Roster and the Old Treaties"
 ywc_je_v03_c01_envoy_roster_and_treaties_reason:0 "Verify which parties and clauses of the old treaties still stand: who claims suzerainty, who governs itself, how markets and budgets each carry their share, and who may sign a new arrangement."
 ywc_je_v03_c01_who_pays_the_world:0 "Who Pays for the World"
 ywc_je_v03_c01_who_pays_the_world_reason:0 "Missions, offices and port inspections are paid from current income; every prospective signatory pays before signing, trims the terms if it cannot, and neither borrows against the future nor collects in advance."
 ywc_je_v03_c01_rites_into_daily:0 "Rites Written into Daily Life"
 ywc_je_v03_c01_rites_into_daily_reason:0 "Tariffs, extra levies and deadlines are tested against daily accounts: those who keep faith keep their standing, defaults are recorded as failures, and titles stand or fall with actual payment."
 ywc_crisis.1000.t:0 "The Line Missing from the Old Treaty"
 ywc_crisis.1000.d:0 "Before the mission departs, the old treaty copy no longer matches today's tariffs, markets and ledgers. The proposing court verifies clause by clause who still claims suzerainty, who appoints its own offices, and whose market and budget stand apart; a self-governing country is no longer written down as a necessary dependent."
 ywc_crisis.1000.examine:0 "Verify suzerainty, market and budget ties clause by clause"
 ywc_crisis.1000.examine.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1000.examine.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1000.record_independence:0 "Record self-governing countries without listing them as dependents"
 ywc_crisis.1000.record_independence.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1000.record_independence.consequence_tooltip:0 "Self-governing countries gain 2 relations and are no longer listed as dependents."
 ywc_crisis.1000.wait:0 "Wait and verify again"
 ywc_crisis.1000.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1000.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1001.t:0 "Two Rosters: Merchants and Rites Offices"
 ywc_crisis.1001.d:0 "Who drafts the roster decides the scope of the promise: with the sea merchants at the table, ports and ledgers come along; with the rites offices alone, ritual precedence narrows the commercial clauses. If the other side has no valid party left, there is nothing to negotiate."
 ywc_crisis.1001.merchant_roster:0 "Invite the sea merchants to draft the envoy roster jointly"
 ywc_crisis.1001.merchant_roster.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1001.merchant_roster.consequence_tooltip:0 "The roster goes out with port and ledger clauses; each country answers separately."
 ywc_crisis.1001.office_roster:0 "Let the rites offices draft the roster alone"
 ywc_crisis.1001.office_roster.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1001.office_roster.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1001.no_counterparty:0 "The other side has no valid party; there is nothing to negotiate"
 ywc_crisis.1001.no_counterparty.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1001.no_counterparty.consequence_tooltip:0 "The case closes as no-talks and the capacity slot is released at once."
 ywc_crisis.1001.wait:0 "Wait and verify again"
 ywc_crisis.1001.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1001.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1002.t:0 "The Reply Letter from Tainan"
 ywc_crisis.1002.d:0 "Jinghai's reply lies on the desk: fix the tribute in exchange for a clear autonomy boundary, counter with limited civil terms, or stay out of the pact altogether. The choice is Jinghai's own; the proposer cannot sign in its place."
 ywc_crisis.1002.fixed_tribute:0 "Fix the tribute in exchange for a clear autonomy boundary"
 ywc_crisis.1002.fixed_tribute.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1002.fixed_tribute.consequence_tooltip:0 "The tribute share is fixed and the autonomy boundary written; accounts and authorization are audited afterwards."
 ywc_crisis.1002.limited_civil:0 "Counter with limited civil terms"
 ywc_crisis.1002.limited_civil.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1002.limited_civil.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1002.refuse:0 "Stay out of the pact and keep the old usage"
 ywc_crisis.1002.refuse.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1002.refuse.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1002.wait:0 "Wait before responding"
 ywc_crisis.1002.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1002.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1003.t:0 "Envoys Not on the Same Step"
 ywc_crisis.1003.d:0 "Korea and Temasek each answer for themselves: seek equal envoys, keep the rites and join only the commercial clauses, or decline. Korea's independent standing is not rewritten by this pact; answering or not is recorded under each country's own name."
 ywc_crisis.1003.equal_envoys:0 "Seek equal envoys and join the common pact"
 ywc_crisis.1003.equal_envoys.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1003.equal_envoys.consequence_tooltip:0 "Equal envoys join the pact; Korea's independent standing is not rewritten by it."
 ywc_crisis.1003.keep_rites:0 "Keep the rites and join only the commercial clauses"
 ywc_crisis.1003.keep_rites.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1003.keep_rites.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1003.not_join:0 "Do not join; keep the old rules"
 ywc_crisis.1003.not_join.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1003.not_join.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1003.wait:0 "Wait before responding"
 ywc_crisis.1003.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1003.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1004.t:0 "The Mission's Travel Money"
 ywc_crisis.1004.d:0 "Missions, translators and office paperwork are paid from current income. Those who can pay send the mission as listed; those who cannot trim the terms instead. No permanent debt is created and no benefit is collected before payment."
 ywc_crisis.1004.pay_full:0 "Pay 800 and send the mission as listed"
 ywc_crisis.1004.pay_full.cost_tooltip:0 "The holder's treasury pays 800."
 ywc_crisis.1004.pay_full.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1004.reduce_terms:0 "Trim the terms to what the office can afford"
 ywc_crisis.1004.reduce_terms.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1004.reduce_terms.consequence_tooltip:0 "The terms shrink to what is affordable; only the limited agreement can be confirmed at settlement."
 ywc_crisis.1004.wait:0 "Wait and recheck the accounts"
 ywc_crisis.1004.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1004.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1005.t:0 "Authorization: Palace and Merchant Council"
 ywc_crisis.1005.d:0 "Before signing, settle the authorization: bear the oversight in the monarch's name, or let the council co-sign with oversight following the register. Each form writes a different oversight clause, audited later against its own record. Actual port-trade parties take up the tariff clause; the rest go to their own stations."
 ywc_crisis.1005.monarch_auth:0 "Authorize in the monarch's name and bear the oversight"
 ywc_crisis.1005.monarch_auth.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1005.monarch_auth.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1005.council_auth:0 "Let the council authorize, with oversight following the register"
 ywc_crisis.1005.council_auth.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1005.council_auth.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1005.wait:0 "Wait and deliberate the authorization again"
 ywc_crisis.1005.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1005.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1006.t:0 "One Ship, Two Tariffs"
 ywc_crisis.1006.d:0 "The same cargo is weighed at the same wharf, yet tariffs and inspection rights sit in two different ledgers. Opening the books for a joint audit costs real money; refusing inspection breeds friction. Objections are written into clauses, not into arms."
 ywc_crisis.1006.open_ledgers:0 "Open the ledgers and reconcile the tariff items (300)"
 ywc_crisis.1006.open_ledgers.cost_tooltip:0 "The holder's treasury pays 300."
 ywc_crisis.1006.open_ledgers.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1006.refuse_inspection:0 "Refuse outside inspection; local tariffs stand"
 ywc_crisis.1006.refuse_inspection.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1006.refuse_inspection.consequence_tooltip:0 "Relations with the proposer drop by 5; the trade friction is carried into the follow-up clauses."
 ywc_crisis.1006.accept_tariff:0 "Accept the unified tariff and port inspection"
 ywc_crisis.1006.accept_tariff.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1006.accept_tariff.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1006.wait:0 "Wait and recheck the tariff"
 ywc_crisis.1006.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1006.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1007.t:0 "The Court Demands an Extra Share"
 ywc_crisis.1007.d:0 "War presses, and the court demands an extra share from those who signed. The cap clause is put to the test: pay within the agreed 400, or not a coin beyond it. Participation is not an unlimited obligation. The demanded party answers separately, and each answer is kept in its own ledger."
 ywc_crisis.1007.demand_jhg:0 "Demand the extra levy from Jinghai"
 ywc_crisis.1007.demand_jhg.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1007.demand_jhg.consequence_tooltip:0 "Jinghai receives the separate demand; the cap clause is put to the test."
 ywc_crisis.1007.demand_kor:0 "Demand the extra levy from Korea"
 ywc_crisis.1007.demand_kor.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1007.demand_kor.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1007.demand_dmg:0 "Demand the extra levy from Temasek"
 ywc_crisis.1007.demand_dmg.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1007.demand_dmg.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1007.drop_demand:0 "Forgo the extra levy and go straight to review"
 ywc_crisis.1007.drop_demand.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1007.drop_demand.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1007.pay_capped:0 "Pay within the agreed cap of 400"
 ywc_crisis.1007.pay_capped.cost_tooltip:0 "The holder's treasury pays the 400 cap."
 ywc_crisis.1007.pay_capped.consequence_tooltip:0 "The payment is registered for the settlement audit; the proposer is released from waiting."
 ywc_crisis.1007.refuse_levy:0 "Not a coin beyond the cap"
 ywc_crisis.1007.refuse_levy.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1007.refuse_levy.consequence_tooltip:0 "The cap clause holds and the excess is refused; relations with the proposer drop by 5."
 ywc_crisis.1007.wait:0 "Wait before responding"
 ywc_crisis.1007.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1007.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1008.t:0 "Rewrite the Style, Keep the Trade Routes"
 ywc_crisis.1008.d:0 "The review opens: withdraw the exclusive rites and drop the style one rank while the civil commerce pact stands, or insist on the original text and shoulder the backlash at home and abroad. The routes do not break over a style, but resentment is written into the ledgers of exchange."
 ywc_crisis.1008.civil_arrangement:0 "Withdraw the exclusive rites and keep the civil commerce pact"
 ywc_crisis.1008.civil_arrangement.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1008.civil_arrangement.consequence_tooltip:0 "Each signatory gains 3 relations; the settlement round opens."
 ywc_crisis.1008.insist_original:0 "Insist on the original style"
 ywc_crisis.1008.insist_original.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1008.insist_original.consequence_tooltip:0 "Each signatory loses 3 relations; the backlash is carried into the follow-up clauses."
 ywc_crisis.1008.wait:0 "Wait before the review"
 ywc_crisis.1008.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1008.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1009.t:0 "The Harbors of the Unsigned"
 ywc_crisis.1009.d:0 "Their names are missing from the multilateral register. Watch how it turns out, open a separate limited bilateral recognition with the proposer, or leave this round entirely; onlookers do not receive the full multilateral terms, and each harbor keeps its own usage."
 ywc_crisis.1009.watch:0 "Watch how it turns out"
 ywc_crisis.1009.watch.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1009.watch.consequence_tooltip:0 "The line closes as status quo and the capacity slot is released."
 ywc_crisis.1009.bilateral_limited:0 "Open a separate limited bilateral recognition with the proposer"
 ywc_crisis.1009.bilateral_limited.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1009.bilateral_limited.consequence_tooltip:0 "Only limited bilateral recognition is granted, not the full multilateral terms; relations with the proposer rise by 2."
 ywc_crisis.1009.exit_from_talks:0 "Leave this round and keep the old rules"
 ywc_crisis.1009.exit_from_talks.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1009.exit_from_talks.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1009.wait:0 "Wait before deciding"
 ywc_crisis.1009.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1009.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1010.t:0 "Even the World Has Due Dates"
 ywc_crisis.1010.d:0 "The day of reckoning arrives. Those with both the actual payments and the political authority confirm the full agreement; those missing one confirm the limited form; those with neither keep the status quo. Fulfillment rests on the numbers in the register, not on words."
 ywc_crisis.1010.confirm_full:0 "Confirm the full agreement and settle on schedule"
 ywc_crisis.1010.confirm_full.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1010.confirm_full.consequence_tooltip:0 "The full agreement is registered, pending the court deadline review."
 ywc_crisis.1010.confirm_limited:0 "Confirm the limited agreement"
 ywc_crisis.1010.confirm_limited.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1010.confirm_limited.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1010.keep_status_quo:0 "Keep the status quo with old accounts and old usage"
 ywc_crisis.1010.keep_status_quo.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1010.keep_status_quo.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1010.wait:0 "Wait before the reckoning"
 ywc_crisis.1010.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1010.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1011.t:0 "Before the Next Court Session"
 ywc_crisis.1011.d:0 "The agreed deadline has arrived and the court audits the promises: missions dispatched, tribute delivered, tariffs kept to the register and the record reads kept; one clause fallen through and the failure is recorded as it is. The verdict is written back to all four countries as the warrant for their follow-up lines."
 ywc_crisis.1011.confirm_kept:0 "The court audit finds the promises kept"
 ywc_crisis.1011.confirm_kept.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1011.confirm_kept.consequence_tooltip:0 "The kept-faith record is written back to the Shu, Jinghai, Korea and Temasek follow-up lines."
 ywc_crisis.1011.admit_broken:0 "Admit the overdue default and settle as failure"
 ywc_crisis.1011.admit_broken.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1011.admit_broken.consequence_tooltip:0 "The default is recorded as it is; payments already made stay on file and no war follows from it."
 ywc_crisis.1011.wait:0 "Wait before the review"
 ywc_crisis.1011.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1011.wait.consequence_tooltip:0 "Records this decision."
