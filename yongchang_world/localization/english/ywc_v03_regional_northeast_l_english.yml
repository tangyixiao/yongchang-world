l_english:
 ywc_je_v03_chi_a:0 "The Rump Court's Grain Registers"
 ywc_je_v03_chi_a_reason:0 "The small court at Transbaikal still holds two registers: one for the bannermen's monthly grain, one for the settlers' tax grain. The older the books, the larger the arrears; only by putting the grain registers in order does anything else become possible."
 ywc_je_v03_chi_b:0 "Subjects Beyond the Style"
 ywc_je_v03_chi_b_reason:0 "Beneath the dynastic style live Buryat herders, Cossack settlers and correspondents across the sea. Who counts as the court's own, who stays a registered guest, and whose name the letters carry, will decide whether what remains is a court or something else."
 ywc_regional.1000.t:0 "The Eight Banners Still Must Eat Grain"
 ywc_regional.1000.d:0 "The old board register still records the bannermen's monthly grain, yet the land rents on the steppe can no longer fill the stipend stores. The secretary in charge of ration tickets spreads both books on the desk: while the stipend goes unchanged, the settlers' tax can never be collected in full."
 ywc_regional.1000.full_stipend:0 "Keep the stipend: clear the arrears, the treasury pays in full"
 ywc_regional.1000.full_stipend.cost_tooltip:0 "Arrears settlement: two weeks of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1000.full_stipend.consequence_tooltip:0 "The banner households' old loyalty is secured, but the unchanged stipend keeps occupying the tax base; the two registers still await their own settlement."
 ywc_regional.1000.halve_stipend:0 "Halve the stipend: settle the surplus bannermen on the land rolls"
 ywc_regional.1000.halve_stipend.cost_tooltip:0 "Land-grant outlay for the settled men: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1000.halve_stipend.consequence_tooltip:0 "The saved grain becomes working capital for land clearing; yielding the stipend is a political concession, and the old banner camps' resentment is carried into the review."
 ywc_regional.1000.defer_stipend:0 "Defer the ruling: keep the accounts hanging for now"
 ywc_regional.1000.defer_stipend.cost_tooltip:0 "No direct expense."
 ywc_regional.1000.defer_stipend.consequence_tooltip:0 "The decision is postponed; arrears and dispute keep compounding."
 ywc_regional.1000.withdraw_at_1000:0 "Drop this line: the banners fend for themselves by custom"
 ywc_regional.1000.withdraw_at_1000.cost_tooltip:0 "No direct expense."
 ywc_regional.1000.withdraw_at_1000.consequence_tooltip:0 "The grain-register line is withdrawn and the standing line will not be raised; custom carries its own profit and loss."
 ywc_regional.1001.t:0 "Two Ledgers of Transbaikal"
 ywc_regional.1001.d:0 "The banner register counts men, the settler register counts land, and in Transbaikal the two disagree: the same river valley is pasture in one book and new fields in the other. The clerks propose merging the rolls; the banner commanders will accept only an appendix."
 ywc_regional.1001.dual_ledger:0 "Merge the ledgers: banner and settler rolls filed together"
 ywc_regional.1001.dual_ledger.cost_tooltip:0 "Transcription cost for the merged roll: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1001.dual_ledger.consequence_tooltip:0 "The merged roll takes effect at once; a year later the old offices report on how it actually held."
 ywc_regional.1001.banner_ledger_first:0 "Banner roll first: settlers wait in an appendix"
 ywc_regional.1001.banner_ledger_first.cost_tooltip:0 "No direct expense."
 ywc_regional.1001.banner_ledger_first.consequence_tooltip:0 "The banner camps are satisfied while settlers' names wait in an appendix; at the review the old offices report this shortfall as it stands."
 ywc_regional.1001.defer_ledger:0 "Let each ledger keep its own books for now"
 ywc_regional.1001.defer_ledger.cost_tooltip:0 "No direct expense."
 ywc_regional.1001.defer_ledger.consequence_tooltip:0 "The decision is postponed; the same land keeps two names on two books."
 ywc_regional.1002.t:0 "The Old Offices' New Tax Sources"
 ywc_regional.1002.d:0 "The year is up and the old offices carry the review upward: where the rolls merged, the grain tax comes in full; where settlers waited in an appendix, two books still disagree. New tax sources have been found, but how the court owns this account is still its word to give."
 ywc_regional.1002.ratify_registers:0 "Ratify the registers: settler rolls enter the regular tax"
 ywc_regional.1002.ratify_registers.cost_tooltip:0 "No one-off expense; the new tax sources enter the standing budget."
 ywc_regional.1002.ratify_registers.consequence_tooltip:0 "With both the stipend concession and the merged roll the registers count as consolidated, otherwise the line settles as limited; the standing line follows."
 ywc_regional.1002.earmark_subsidy:0 "Earmark a fund: banners and settlers share it half and half"
 ywc_regional.1002.earmark_subsidy.cost_tooltip:0 "Fund start-up silver: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1002.earmark_subsidy.consequence_tooltip:0 "Finances hold on the earmarked fund while the account settles as limited; the sharing precedent is written into later budget disputes."
 ywc_regional.1002.defer_review:0 "Hang the review another year: wait for the next round of reports"
 ywc_regional.1002.defer_review.cost_tooltip:0 "No direct expense."
 ywc_regional.1002.defer_review.consequence_tooltip:0 "Settlement is postponed a year; the budget gap stays on the books."
 ywc_regional.1003.t:0 "Forms of Address in the Sakhalin Letter"
 ywc_regional.1003.d:0 "Letters from the island and the north have reached the post house: the salutation reads the Great Qing court, the signature reads the Transbaikal offices. Whose name the replies carry, and whether accounts with the northern states stay separate, waits on a ruling."
 ywc_regional.1003.dynastic_style:0 "Keep the dynastic style: letters go out under the court's name"
 ywc_regional.1003.dynastic_style.cost_tooltip:0 "No direct expense."
 ywc_regional.1003.dynastic_style.consequence_tooltip:0 "Correspondence with the north continues under the court's name; each state remains its own, letters and trade alike."
 ywc_regional.1003.dual_style:0 "Two styles: the court abroad, the offices at home"
 ywc_regional.1003.dual_style.cost_tooltip:0 "No direct expense."
 ywc_regional.1003.dual_style.consequence_tooltip:0 "The styles are kept in separate books and letters sorted by origin; borders and accounts with other states stay as they are."
 ywc_regional.1003.office_style:0 "Use the office style: sign as the Transbaikal offices alone"
 ywc_regional.1003.office_style.cost_tooltip:0 "Re-sealing cost for the new style: half a week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1003.office_style.consequence_tooltip:0 "The external style passes to the offices and the northern court's style is left to others; dealings continue state to state."
 ywc_regional.1003.defer_style:0 "Hold the replies: the post house files them for now"
 ywc_regional.1003.defer_style.cost_tooltip:0 "No direct expense."
 ywc_regional.1003.defer_style.consequence_tooltip:0 "The ruling is postponed; unanswered correspondence keeps piling up."
 ywc_regional.1004.t:0 "Ancestral Custom Does Not Know the New Residents"
 ywc_regional.1004.d:0 "Buryat herders, exiled craftsmen and wintering merchants grow more numerous each year, and ancestral custom has no entry for them. The old board's precedents do not match the new households, and the clerks ask: are these people the court's own subjects, or registered guests only?"
 ywc_regional.1004.banner_register_only:0 "New residents stay off the ancestral roll: open a guest roll"
 ywc_regional.1004.banner_register_only.cost_tooltip:0 "No direct expense."
 ywc_regional.1004.banner_register_only.consequence_tooltip:0 "The ancestral roll stands and a guest roll is kept apart; the split enters the final stage's record."
 ywc_regional.1004.shared_obligation:0 "New residents share corvee with the bannermen"
 ywc_regional.1004.shared_obligation.cost_tooltip:0 "Enrollment outlay for the shared corvee: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1004.shared_obligation.consequence_tooltip:0 "Corvee and the roll are shared; over who carries the heavier share, the banner camps and the newcomers carry their dispute to the last stage."
 ywc_regional.1004.custom_exam:0 "Examine by custom: those with the court's tongue enter the roll"
 ywc_regional.1004.custom_exam.cost_tooltip:0 "No direct expense."
 ywc_regional.1004.custom_exam.consequence_tooltip:0 "The roll opens by tongue; households without it stay in suspense until the charter stage."
 ywc_regional.1004.defer_residents:0 "Defer the new residents' standing: the precedents are to be argued again"
 ywc_regional.1004.defer_residents.cost_tooltip:0 "No direct expense."
 ywc_regional.1004.defer_residents.consequence_tooltip:0 "The standing is deferred; the newcomers' unease and the precedents' dispute pass intact to the final stage."
 ywc_regional.1005.t:0 "What Remains: Court or State"
 ywc_regional.1005.d:0 "The grain registers, the styles and the rolls all lie open: what remains is a dynasty's remnant by the banner roll, and a country of its own by the settler roll. What to write it down as is this generation's last line to set."
 ywc_regional.1005.charter_common_standing:0 "Charter it plainly: subjects are neither banner nor guest"
 ywc_regional.1005.charter_common_standing.cost_tooltip:0 "No one-off expense; the common standing enters the charter."
 ywc_regional.1005.charter_common_standing.consequence_tooltip:0 "An institution-consolidated ending; the grain and standing records stay readable by the crisis and theme lines."
 ywc_regional.1005.quota_compromise:0 "Compromise by quota: the guest roll takes a fixed share"
 ywc_regional.1005.quota_compromise.cost_tooltip:0 "No one-off expense."
 ywc_regional.1005.quota_compromise.consequence_tooltip:0 "A quota-compromise ending; the quota quarrel becomes a standing item in later budget debates."
 ywc_regional.1005.old_covenant_kept:0 "Keep the old covenant: standing still follows ancestral custom"
 ywc_regional.1005.old_covenant_kept.cost_tooltip:0 "No one-off expense."
 ywc_regional.1005.old_covenant_kept.consequence_tooltip:0 "An old-covenant ending; the split between guests and banner households stands as recorded, left for the next generation to raise again."
 ywc_regional.1005.withdraw_at_1005:0 "Withdraw the line: each roll keeps to its own old ways"
 ywc_regional.1005.withdraw_at_1005.cost_tooltip:0 "No direct expense."
 ywc_regional.1005.withdraw_at_1005.consequence_tooltip:0 "A withdrawn ending; paid costs are not refunded, and the common-standing question may be raised anew by later lines."
 ywc_je_v03_khq_a:0 "Banner Lands and Plough Furrows"
 ywc_je_v03_khq_a_reason:0 "Khorchin's banner roll knows the herding corridors and the settlers' deeds know furrows, and the two books do not agree inside the same banner office. The league's quota of horsemen, the tithe's revenue and the survival of the pastures all begin with making these two rolls one account."
 ywc_je_v03_khq_b:0 "A Seat Within the League Compact"
 ywc_je_v03_khq_b_reason:0 "With the banner-land and furrow accounts settled, Khorchin faces the league without and the next generation within: whether the mutual guarantee was confirmed, which roll holds the lessees' children, and whose names may sign when the compact is renewed."
 ywc_regional.1100.t:0 "A New Field Deed Beside the Pasture"
 ywc_regional.1100.d:0 "Along the same pasture boundary, a newly ploughed parcel has brought its first written deed: the signers are settler households, while the riders on the old herding rows are still the banner troopers of former days. The banner office's old register knows only the herding corridors, the new deed knows only furrows, and nobody can say which book the parcel belongs in."
 ywc_regional.1100.dual_register:0 "Enter both ledgers: furrows and herding rows in one register"
 ywc_regional.1100.dual_register.cost_tooltip:0 "Survey and roll fee: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1100.dual_register.consequence_tooltip:0 "Plough households and the troopers' corridors enter one register with disputes heard by the banner office; the question of horsemen follows."
 ywc_regional.1100.pasture_first:0 "The old herding roll decides: new fields stay as sojourn ploughing"
 ywc_regional.1100.pasture_first.cost_tooltip:0 "No direct expense."
 ywc_regional.1100.pasture_first.consequence_tooltip:0 "Saves the roll fee and satisfies the troopers, but the settlers' deeds have nowhere to be heard; grievance carries into the tithe question."
 ywc_regional.1100.wait_at_1100:0 "Let each roll keep its own book for now"
 ywc_regional.1100.wait_at_1100.cost_tooltip:0 "No direct expense."
 ywc_regional.1100.wait_at_1100.consequence_tooltip:0 "The decision is postponed; the deed and the herding roll keep quarrelling as before."
 ywc_regional.1100.withdraw_at_1100:0 "Drop this line; the old herding custom continues"
 ywc_regional.1100.withdraw_at_1100.cost_tooltip:0 "No direct expense."
 ywc_regional.1100.withdraw_at_1100.consequence_tooltip:0 "This line ends and the old custom continues; the league-seat line will not open."
 ywc_regional.1101.t:0 "How Many Horsemen the League Banners Will Give"
 ywc_regional.1101.d:0 "Before the new roll is dry, the league letter has arrived: the marches are unsettled and the league banners call on Khorchin to field men according to its register. Custom let each banner fix its own number; now that the roll holds both troopers and plough households, how many, from whom, and paid with what must be written as a fixed count for the first time."
 ywc_regional.1101.fixed_contingent:0 "A fixed contingent: muster a set count by the roll, paid from the treasury"
 ywc_regional.1101.fixed_contingent.cost_tooltip:0 "Muster pay: two weeks of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1101.fixed_contingent.consequence_tooltip:0 "Limited service becomes a fixed count; the line is rechecked after twelve months of execution. If the muster holds, the twin-ledger compact stands."
 ywc_regional.1101.cash_commutation:0 "Commutation: make up the shortfall in livestock and coin"
 ywc_regional.1101.cash_commutation.cost_tooltip:0 "No direct expense; the commuted livestock stays out of the banner store this year."
 ywc_regional.1101.cash_commutation.consequence_tooltip:0 "The league accepts the letter, but the count is discounted; the review settles this line as a limited result."
 ywc_regional.1101.withdraw_at_1101:0 "Withdraw the line; musters follow each banner's old custom"
 ywc_regional.1101.withdraw_at_1101.cost_tooltip:0 "No direct expense."
 ywc_regional.1101.withdraw_at_1101.consequence_tooltip:0 "This line ends and each banner keeps fixing its own count; the league-seat line will not open."
 ywc_regional.1102.t:0 "The Proposal for a Fixed Tithe"
 ywc_regional.1102.d:0 "With the settlers' deeds on the roll, the tax clerks bring a proposal: convert the new fields' rent grain into a fixed tithe that can be collected every year. The banner office can count the intake and the price in the same breath — every line of rent grain written into the roll narrows the spring and autumn pastures, and keeping the herding corridors whole means shrinking what the treasury has promised."
 ywc_regional.1102.lease_fixed:0 "Fix the tithe: the new fields pay a set grain tax yearly"
 ywc_regional.1102.lease_fixed.cost_tooltip:0 "No direct expense; revenue becomes predictable year by year from the next."
 ywc_regional.1102.lease_fixed.consequence_tooltip:0 "The rent grain enters the roll and quarrels over pasture between troopers and settlers will multiply; the record is left for the frontier and land lines to read."
 ywc_regional.1102.buy_back_corridors:0 "Keep the corridors: buy back the promised leases"
 ywc_regional.1102.buy_back_corridors.cost_tooltip:0 "Buy-back payment: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1102.buy_back_corridors.consequence_tooltip:0 "The spring and autumn pastures stay whole and the fiscal promise shrinks to what can be honoured; the settlers' leases must be renegotiated."
 ywc_regional.1102.defer_at_1102:0 "Hold the proposal: collect rents by custom this year"
 ywc_regional.1102.defer_at_1102.cost_tooltip:0 "No direct expense."
 ywc_regional.1102.defer_at_1102.consequence_tooltip:0 "The choice between a fixed tithe and whole corridors waits a year; the dispute passes intact to the next stage."
 ywc_regional.1103.t:0 "Gifts Sent Separately by the Neighbours"
 ywc_regional.1103.d:0 "The spring gift lists fill the desk: the southern magistracies that deal in land settlement send brick tea, and the neighbouring league banners of the steppe send saddled horses. Both speak the same words — the border herding corridors and field boundaries should stand under a mutual guarantee. But the gifts came separately and each wrote its own terms; the term of years is Khorchin's to set."
 ywc_regional.1103.two_year_pledge:0 "A two-year guarantee: send return gifts, fix the term at two years"
 ywc_regional.1103.two_year_pledge.cost_tooltip:0 "Return-gift payment: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1103.two_year_pledge.consequence_tooltip:0 "The mutual guarantee names two years as its term; whether it stands is confirmed or refused independently by the other side according to conditions on the marches, not by this banner's own wish."
 ywc_regional.1103.short_pledge:0 "A one-year trial: answer for one year only, renegotiate next year"
 ywc_regional.1103.short_pledge.cost_tooltip:0 "No direct expense."
 ywc_regional.1103.short_pledge.consequence_tooltip:0 "A one-year trial halves both the guarantee's benefit and its burden; the other side must still confirm it independently."
 ywc_regional.1103.decline_gifts:0 "Accept the gifts, decline the pact"
 ywc_regional.1103.decline_gifts.cost_tooltip:0 "No direct expense."
 ywc_regional.1103.decline_gifts.consequence_tooltip:0 "Both gifts enter the banner's store and the guarantee talk ends; the border corridors and field boundaries remain this banner's own charge."
 ywc_regional.1104.t:0 "The Lessees' Next Generation"
 ywc_regional.1104.d:0 "The first contract settlers' children have grown up: born on these fields, speaking both tongues, their names still hang under their fathers' leases. The banner office's old roll knows only the generation that signed; the new generation asks for rows of their own, and the people of the herding rows want a ruling too."
 ywc_regional.1104.second_generation_roll:0 "Roll the new generation: their own rows, their own obligations"
 ywc_regional.1104.second_generation_roll.cost_tooltip:0 "New-roll fee: half a week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1104.second_generation_roll.consequence_tooltip:0 "The next generation gains rows of their own, obligations and taxes counted separately; the old herding roll and the new field roll stand as two volumes."
 ywc_regional.1104.old_register:0 "The old roll stands: the next generation rides on their fathers' leases"
 ywc_regional.1104.old_register.cost_tooltip:0 "No direct expense."
 ywc_regional.1104.old_register.consequence_tooltip:0 "The fee is saved and the roll stays as it was; the next generation's grievance enters the final stage's record."
 ywc_regional.1104.defer_at_1104:0 "Hold the generational question"
 ywc_regional.1104.defer_at_1104.cost_tooltip:0 "No direct expense."
 ywc_regional.1104.defer_at_1104.consequence_tooltip:0 "The generational question waits; names keep piling up under the old leases."
 ywc_regional.1105.t:0 "Who May Renew the League Compact"
 ywc_regional.1105.d:0 "The old compact's term has run out: in the years since the twin rolls began, princes who signed it have died or stepped back. The new generation's roll rows, the leaseholding elders and the troopers of the herding corridors all ask the same question — when the league compact is written anew, whose names may fall upon the page."
 ywc_regional.1105.broad_renewal:0 "Renew broadly: princes and roll households sign alike"
 ywc_regional.1105.broad_renewal.cost_tooltip:0 "Assembly cost: half a week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1105.broad_renewal.consequence_tooltip:0 "The institution is consolidated: both rolls' people sign the compact and renewal rights become standing custom; the twin-ledger and confirmed-guarantee records enter the compact's own text."
 ywc_regional.1105.quota_compromise:0 "A quota compromise: roll households enter the league under a fixed cap"
 ywc_regional.1105.quota_compromise.cost_tooltip:0 "No direct expense."
 ywc_regional.1105.quota_compromise.consequence_tooltip:0 "The compact renews with capped seats; roll households beyond the cap wait in line, and the dispute is left to the next generation."
 ywc_regional.1105.retain_old_compact:0 "The old compact stands: renewal stays with the banner princes"
 ywc_regional.1105.retain_old_compact.cost_tooltip:0 "No direct expense."
 ywc_regional.1105.retain_old_compact.consequence_tooltip:0 "The old compact continues as it was, renewed by the princes alone; the roll rows' and lessees' claims stay on record without changing the old order."
 ywc_regional.1105.withdraw_at_1105:0 "Withdraw the line; renewal waits for another year"
 ywc_regional.1105.withdraw_at_1105.cost_tooltip:0 "No direct expense."
 ywc_regional.1105.withdraw_at_1105.consequence_tooltip:0 "Paid costs are not refunded; the renewal question may be raised anew by later lines."
 ywc_je_v03_hul_a:0 "The Winter Council"
 ywc_je_v03_hul_a_reason:0 "Winter on the Hulun steppe has never been a private matter: fences, market days and overwintering riders must all be settled around the same fire. Whoever shares the fodder, the road and the protection decides whether spring holds."
 ywc_je_v03_hul_b:0 "Trade Cannot Be Paid in Garrisons"
 ywc_je_v03_hul_b_reason:0 "No promise signed over a winter fire buys back what the steppe holds by custom: foreign riders may pass the cold season by granted term, they may not stand garrison; the market may widen, it may not be mortgaged. The Hulun league means to write that sentence into its compact - and make every newly joined town able to read it."
 ywc_regional.1200.t:0 "A New Fence in the Winter Camp"
 ywc_regional.1200.d:0 "Last winter a night blizzard tore open the Abaga pens and the herds drifted into a neighbour's winter camp. The elders gather by Hulun Lake: where the fence runs, who watches it and who pays - without one shared ledger, next winter will argue the same fight again."
 ywc_regional.1200.shared_watch_fence:0 "Raise one shared fence: rotating watch, shared cost"
 ywc_regional.1200.shared_watch_fence.cost_tooltip:0 "Fence timber and watch rations: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1200.shared_watch_fence.consequence_tooltip:0 "Each clan sends watchers in rotation and the duty clan answers for strays first; the market days follow."
 ywc_regional.1200.small_self_fence:0 "A smaller fence of our own: guard our own camp only"
 ywc_regional.1200.small_self_fence.cost_tooltip:0 "No direct treasury expense; materials raised by the clan itself."
 ywc_regional.1200.small_self_fence.consequence_tooltip:0 "It saves cost and spares the rotation, but neighbouring herds will still trample the pens; the grudge enters the winter ledger."
 ywc_regional.1200.wait_at_1200:0 "Mend each pen apart for now; settle accounts later"
 ywc_regional.1200.wait_at_1200.cost_tooltip:0 "No direct expense."
 ywc_regional.1200.wait_at_1200.consequence_tooltip:0 "The decision is postponed; strays and trespass go on as before."
 ywc_regional.1200.withdraw_at_1200:0 "Drop the council; each camp keeps its old custom"
 ywc_regional.1200.withdraw_at_1200.cost_tooltip:0 "No direct expense."
 ywc_regional.1200.withdraw_at_1200.consequence_tooltip:0 "This line ends and custom continues; watch and market questions are never pooled."
 ywc_regional.1201.t:0 "How Many Days the Border Market Opens"
 ywc_regional.1201.d:0 "The market's piles have doubled since last year, yet the old custom still allows only the same few days: late caravans turn back with their goods untouched, having burned good firewood camping for nothing. How many days, and who pays for storage, is the number the elders must be able to say out loud."
 ywc_regional.1201.long_market_storage:0 "Open the full season: build affordable storage"
 ywc_regional.1201.long_market_storage.cost_tooltip:0 "Storage sheds and market clerks: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1201.long_market_storage.consequence_tooltip:0 "Late caravans finally have somewhere to unload and the camps trade for salt, tea and iron; the storage bill enters the budget and the review settles on it."
 ywc_regional.1201.short_market_no_storage:0 "Keep the old few days; storage is each clan's own affair"
 ywc_regional.1201.short_market_no_storage.cost_tooltip:0 "No direct expense."
 ywc_regional.1201.short_market_no_storage.consequence_tooltip:0 "The ledger stays lean; late goods still turn back the way they came, and the complaint enters the winter ledger."
 ywc_regional.1201.keep_old_days:0 "Record it, change nothing; the days stand"
 ywc_regional.1201.keep_old_days.cost_tooltip:0 "No direct expense."
 ywc_regional.1201.keep_old_days.consequence_tooltip:0 "The old rule stands; the days dispute waits for the steward's review."
 ywc_regional.1202.t:0 "The Border Guard Asks to Winter Over"
 ywc_regional.1202.d:0 "A foreign guard column reaches the league's edge ahead of the snow, its captain offering gifts and a blade: only a winter ground to rest, gone by thaw. The elders know that phrase - what stays the winter tends to stay for good. What is granted, for how long and with what rights must be said plainly, once."
 ywc_regional.1202.winter_with_terms:0 "Grant the winter: write the rights and the term down"
 ywc_regional.1202.winter_with_terms.cost_tooltip:0 "Winter ground and fodder at half rate: half a week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1202.winter_with_terms.consequence_tooltip:0 "The riders keep to a named camp for two stated years, may hold no land, and leave when the term ends; the steward reviews the grant within the year."
 ywc_regional.1202.winter_no_arms:0 "Winter unarmed only: no arms, no posts"
 ywc_regional.1202.winter_no_arms.cost_tooltip:0 "No direct expense."
 ywc_regional.1202.winter_no_arms.consequence_tooltip:0 "The courtesy is given but no blade is allowed; riders who find it harsh leave early, and the clans rest easy."
 ywc_regional.1202.refuse_winter:0 "Refuse the camp: hire a small watch of our own"
 ywc_regional.1202.refuse_winter.cost_tooltip:0 "No direct treasury expense; the watch is levied clan by clan."
 ywc_regional.1202.refuse_winter.consequence_tooltip:0 "The column finds another road and the league keeps a smaller watch of its own this winter; the review settles on that self-guarded fact."
 ywc_regional.1203.t:0 "A Second Outlet for the Caravan Road"
 ywc_regional.1203.d:0 "The market's caravans have always left through one gap southward, straight into a neighbour's toll station, and this year the toll has risen again. The traders ask: may a second outlet open eastward, past another people's scale? Only that outlet, too, runs over someone else's road."
 ywc_regional.1203.partner_outlet_split:0 "Open eastward over the neighbour's road: share the toll"
 ywc_regional.1203.partner_outlet_split.cost_tooltip:0 "Road works and the first toll share: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1203.partner_outlet_split.consequence_tooltip:0 "The second outlet opens, but the road's gain is shared year by year; the concession enters the external record for later lines to read."
 ywc_regional.1203.own_outlet_small:0 "Open a small gap of our own: less trade, no favours owed"
 ywc_regional.1203.own_outlet_small.cost_tooltip:0 "No direct treasury expense; the traders build and guard the gap themselves."
 ywc_regional.1203.own_outlet_small.consequence_tooltip:0 "The outlet stays in the league's own hands with thin traffic; most of the southern toll rise must simply be swallowed."
 ywc_regional.1203.keep_single_outlet:0 "Keep the single southern outlet; bargain as before"
 ywc_regional.1203.keep_single_outlet.cost_tooltip:0 "No direct expense."
 ywc_regional.1203.keep_single_outlet.consequence_tooltip:0 "The single-outlet dependence stands; if the toll rises again the league can only pay it or choke the market."
 ywc_regional.1204.t:0 "How the New Towns Join the Council"
 ywc_regional.1204.d:0 "The market and the east outlet have raised two new towns whose people pay dues, mind the fences and drive the carts, yet cannot enter the old council tent - seats there follow the old clans. The towns have sent word: give us seats, or give us a reason."
 ywc_regional.1204.town_seats_paid:0 "Seat them: the towns buy in by assessed share"
 ywc_regional.1204.town_seats_paid.cost_tooltip:0 "Widening the council tent and clerk wages: half a week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1204.town_seats_paid.consequence_tooltip:0 "Town seats follow the assessed share and the budget gains a standing line; the old clans' displeasure stays on the record."
 ywc_regional.1204.town_observers:0 "Observer seats: heard in council, but no seal"
 ywc_regional.1204.town_observers.cost_tooltip:0 "No direct expense."
 ywc_regional.1204.town_observers.consequence_tooltip:0 "The towns may listen and speak but set no seal; the market's rules stay with the old clans."
 ywc_regional.1204.old_clans_first:0 "The old order stands: towns mind towns, clans mind the league"
 ywc_regional.1204.old_clans_first.cost_tooltip:0 "No direct expense."
 ywc_regional.1204.old_clans_first.consequence_tooltip:0 "The towns set their own small councils and the league's stands unchanged; the gap between the two charters passes to the final stage."
 ywc_regional.1205.t:0 "A Compact Without Resident Foreign Troops"
 ywc_regional.1205.d:0 "The winter terms, the market days, the outlet ledgers and the town seats all lie open on the felt. One last line is left to write: this compact shall never read \"foreign troops stand resident\" - trade cannot be paid in garrisons, and no partner may haggle over that sentence."
 ywc_regional.1205.charter_no_garrison:0 "Charter the last line: trade is never paid in garrisons"
 ywc_regional.1205.charter_no_garrison.cost_tooltip:0 "No one-off expense; the compact passes down by the ledger from here."
 ywc_regional.1205.charter_no_garrison.consequence_tooltip:0 "Consolidation: every winter grant must carry written rights, a term and no land; the MGL/NQG lines, crises C02/C03 and themes T10/T12 may read this record."
 ywc_regional.1205.quota_compromise:0 "A quota compromise: winter grants count down year by year"
 ywc_regional.1205.quota_compromise.cost_tooltip:0 "No one-off expense."
 ywc_regional.1205.quota_compromise.consequence_tooltip:0 "Winter grants run under a quota that shrinks each year - the rule holds while a crack stays open; it enters the external record."
 ywc_regional.1205.withdraw_compact:0 "Withdraw the line: the compact's last line stays blank"
 ywc_regional.1205.withdraw_compact.cost_tooltip:0 "No direct expense."
 ywc_regional.1205.withdraw_compact.consequence_tooltip:0 "The line is withdrawn: the last line stays blank and the clans keep to custom; later lines may raise it anew."
 ywc_regional.1205.keep_old_compact:0 "Keep the old compact: add to the ledger, replace nothing"
 ywc_regional.1205.keep_old_compact.cost_tooltip:0 "No one-off expense."
 ywc_regional.1205.keep_old_compact.consequence_tooltip:0 "The old compact stands and the new ledger records this winter only; the generational dispute is left for the next to reopen."
 ywc_je_v03_sol_a:0 "The Roster of Rotating River Duty"
 ywc_je_v03_sol_a_reason:0 "The Solon villages' ferry, patrol and relay shifts are all written in one roster of rotating duty, yet the shifts grow emptier each season: some households pay silver to be excused, some send a kinsman in their name, and some simply leave the book. While no one minds the river, furs and army grain alike fail to reach the landing."
 ywc_je_v03_sol_b:0 "The Office Between the Villages"
 ywc_je_v03_sol_b_reason:0 "The office's seal has settled between the villages: the ferry crossing now keeps a government roll and salaried clerks, the village covenants remain the old custom, and the young in town wait for vacancies. How the roster's account is closed decides who writes this official book next."
 ywc_regional.1300.t:0 "Who Mans the Crossing This Season"
 ywc_regional.1300.d:0 "The spring roster lies open on the desk and three villages' shifts at the crossing stand unfilled. The old boatmaster says each village's men are its lifeblood and taking silver for duty ruins the custom; the crossing clerk says fur payments make clean entries, and the villages themselves would rather pay. Who mans the crossing this season needs a rule written into the book."
 ywc_regional.1300.keep_rota:0 "Keep the rota: each village mans the crossing itself"
 ywc_regional.1300.keep_rota.cost_tooltip:0 "No direct expense; the rota keeps drawing on each village's labor."
 ywc_regional.1300.keep_rota.consequence_tooltip:0 "The villages keep manning the crossing in turn and the book gains no silver entries; the labor cost is carried into the review."
 ywc_regional.1300.fee_conversion:0 "Fee for duty: hire substitutes, furs credited against it"
 ywc_regional.1300.fee_conversion.cost_tooltip:0 "Subsistence for hired ferrymen: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1300.fee_conversion.consequence_tooltip:0 "Hired ferrymen take the crossings and each village sends one man fewer; the fee rule enters the book, its disputes carried to the review."
 ywc_regional.1300.defer_rota:0 "Hang the roster for now: ad hoc levies again this year"
 ywc_regional.1300.defer_rota.cost_tooltip:0 "No direct expense."
 ywc_regional.1300.defer_rota.consequence_tooltip:0 "The decision is postponed; absent shifts and substituted names keep quarrelling."
 ywc_regional.1300.withdraw_at_1300:0 "Retire the roster: each village keeps its own crossing"
 ywc_regional.1300.withdraw_at_1300.cost_tooltip:0 "No direct expense."
 ywc_regional.1300.withdraw_at_1300.consequence_tooltip:0 "The roster line is withdrawn and the offices line will not be raised; crossing disputes stay with the village covenants."
 ywc_regional.1301.t:0 "Furs Paid the Army Grain First"
 ywc_regional.1301.d:0 "The autumn floods passed and the channel has shallowed again. The army grain takes its share of furs, and the river works want pelts for timber and rope; the fur house will repair the crossing entire if it keeps the tolls for three years. The grain ledger and the river ledger share one desk, and the roster must say which is paid first."
 ywc_regional.1301.grain_first_self_works:0 "Army grain first: furs pay the levy, the works clear this reach only"
 ywc_regional.1301.grain_first_self_works.cost_tooltip:0 "Materials for this reach: half a week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1301.grain_first_self_works.consequence_tooltip:0 "Furs pay the grain first and the official reach is passable within the year; the works are reviewed on their actual results after a year."
 ywc_regional.1301.works_by_fur_contract:0 "Contract the fur house: it repairs the crossing and keeps the tolls three years"
 ywc_regional.1301.works_by_fur_contract.cost_tooltip:0 "No direct expense; the fur house keeps the crossing tolls for three years."
 ywc_regional.1301.works_by_fur_contract.consequence_tooltip:0 "The crossing is repaired all the same, but the toll concession enters the external record; the review reports a limited result."
 ywc_regional.1301.joint_nqg_defense:0 "Joint river defense: the Sakhalin court co-dredges its reach"
 ywc_regional.1301.joint_nqg_defense.cost_tooltip:0 "The joint reach's works share: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1301.joint_nqg_defense.consequence_tooltip:0 "The channel is dredged reach by reach with the Sakhalin river defense, patrol rosters copied into both books; the boundary markers enter the review."
 ywc_regional.1301.defer_grain_works:0 "Furs and grain keep separate books; the works wait"
 ywc_regional.1301.defer_grain_works.cost_tooltip:0 "No direct expense."
 ywc_regional.1301.defer_grain_works.consequence_tooltip:0 "The decision is postponed; the shallowed channel and the grain gap stand as they are."
 ywc_regional.1302.t:0 "River Patrols Begin Drawing Wages"
 ywc_regional.1302.d:0 "The year is up and the review ledger comes in: the salaried patrol holds the river, the hired ferrymen are entered in the book, the villages that kept the rota are short of grown men, and the works' material accounts vary. Whether the wages enter the standing budget is what this review must settle."
 ywc_regional.1302.ratify_wage_roll:0 "Ratify the roll: patrol wages enter the standing budget"
 ywc_regional.1302.ratify_wage_roll.cost_tooltip:0 "The first standing quarter's wages: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1302.ratify_wage_roll.consequence_tooltip:0 "The rota becomes standing wages; with self-run or jointly dredged works the line counts as consolidated, with the toll concession it settles as limited; the offices line follows."
 ywc_regional.1302.restore_rota_labor:0 "Restore the rota: wages stop at the works, the crossing returns to turns"
 ywc_regional.1302.restore_rota_labor.cost_tooltip:0 "No direct expense; each village's men return to the crossing."
 ywc_regional.1302.restore_rota_labor.consequence_tooltip:0 "A limited settlement: wages keep only the works, the shifts return to the roster, and the fee rule is suspended."
 ywc_regional.1302.neighbor_joint_review:0 "Joint review with neighbors: invite the neighboring chanceries' clerks"
 ywc_regional.1302.neighbor_joint_review.cost_tooltip:0 "No direct expense."
 ywc_regional.1302.neighbor_joint_review.consequence_tooltip:0 "A limited settlement; the neighbors' clerks' findings become an external record, cited by later cross-river business."
 ywc_regional.1302.defer_review_1302:0 "Hang the review another year: wait for the next round of reports"
 ywc_regional.1302.defer_review_1302.cost_tooltip:0 "No direct expense."
 ywc_regional.1302.defer_review_1302.consequence_tooltip:0 "Settlement is postponed a year; the parallel track of wages and rota runs on."
 ywc_regional.1303.t:0 "The Wharf Officer Does Not Know the Village Covenant"
 ywc_regional.1303.d:0 "The wharf officer fined a village's furs by the government roll, and the village elder laid its covenant on the desk: the crossing has been that village's charge for three generations, and the fine has no name in it. The roll is plainly written and the covenant is plainly old, and neither side yields. How this case is judged will be followed on both banks."
 ywc_regional.1303.covenant_joint_bench:0 "Seat the covenant: the ferry roll adds a joint-bench page"
 ywc_regional.1303.covenant_joint_bench.cost_tooltip:0 "The bench's yearly paper and subsistence: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1303.covenant_joint_bench.consequence_tooltip:0 "Cases under the roll and the covenants are heard on one bench; the wharf officer's sole judgment ends here."
 ywc_regional.1303.office_rule_appeal:0 "The roll decides: covenants stand as grounds for appeal only"
 ywc_regional.1303.office_rule_appeal.cost_tooltip:0 "No direct expense."
 ywc_regional.1303.office_rule_appeal.consequence_tooltip:0 "Adjudication passes to the roll with covenants as grounds for appeal; where standing wages exist, the rule is bound into the wage roll."
 ywc_regional.1303.two_covenants_parallel:0 "Two rules in parallel: the roll and the covenants each keep their reach"
 ywc_regional.1303.two_covenants_parallel.cost_tooltip:0 "No direct expense."
 ywc_regional.1303.two_covenants_parallel.consequence_tooltip:0 "Divergent verdicts for similar cases continue and enter the blackwater frontier's dispute record (Crisis C02)."
 ywc_regional.1303.defer_case_1303:0 "Hold the case: argued again after autumn"
 ywc_regional.1303.defer_case_1303.cost_tooltip:0 "No direct expense."
 ywc_regional.1303.defer_case_1303.consequence_tooltip:0 "Judgment is deferred; the quarrel between wharf and banks passes intact to the next stage."
 ywc_regional.1304.t:0 "The Young Choose to Stay in Town"
 ywc_regional.1304.d:0 "The young who drew wages do not go back to the villages: town has labor for hire, clerk vacancies and pay by the month. The villages' shifts must still be manned, their names stay on the roster while they stay at the wharf. Whether they may sit for the crossing clerk's post is a new page the roster must add."
 ywc_regional.1304.town_exam_office:0 "Examine in town: the crossing clerk's post opens to the young"
 ywc_regional.1304.town_exam_office.cost_tooltip:0 "The examination's cost: half a week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1304.town_exam_office.consequence_tooltip:0 "The young may take the crossing clerk's post by examination, and local office-holding gains a precedent; the record stays readable by the people-and-knowledge line (T02)."
 ywc_regional.1304.absent_rota_kept:0 "Keep the names: town workers stay written on the roster"
 ywc_regional.1304.absent_rota_kept.cost_tooltip:0 "No direct expense; each village's shifts must still be laid on someone."
 ywc_regional.1304.absent_rota_kept.consequence_tooltip:0 "The names stand while the men stay in town; substitution and fee disputes pass to the last stage."
 ywc_regional.1304.hired_substitutes:0 "Hire for vacancies: wages buy substitute shifts"
 ywc_regional.1304.hired_substitutes.cost_tooltip:0 "Subsistence for hired substitutes: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1304.hired_substitutes.consequence_tooltip:0 "Vacancies are filled with wage silver and the roster's shifts continue by hire."
 ywc_regional.1304.defer_succession:0 "Argue the roll again: old and new names wait together"
 ywc_regional.1304.defer_succession.cost_tooltip:0 "No direct expense."
 ywc_regional.1304.defer_succession.consequence_tooltip:0 "Succession is postponed; the discontent on both sides passes intact to the last stage."
 ywc_regional.1305.t:0 "The Last Page of the Duty Roster"
 ywc_regional.1305.d:0 "The duty roster has reached its last page: the wage accounts, the covenant cases and the names waiting in town are all on it. Once the page is written, the roster enters the government rolls, returns to the villages, or is boxed away. There is no modern industry and no mass politics; what matters is who continues this old book."
 ywc_regional.1305.charter_rota_office:0 "Charter it plainly: the roster enters the government rolls, vacancies paid from the fund"
 ywc_regional.1305.charter_rota_office.cost_tooltip:0 "No one-off expense; the roster's wages enter the standing budget."
 ywc_regional.1305.charter_rota_office.consequence_tooltip:0 "An institution-consolidated ending: wages, the joint bench and the clerk's exam enter the charter; the records stay readable by the blackwater crisis (C02) and the people-and-post lines (T02/T11)."
 ywc_regional.1305.rota_quota_compromise:0 "Compromise by quota: the roster keeps blank pages, each village's turns are fixed"
 ywc_regional.1305.rota_quota_compromise.cost_tooltip:0 "No one-off expense."
 ywc_regional.1305.rota_quota_compromise.consequence_tooltip:0 "A quota-compromise ending: each village's turns are fixed and the rest pay fees; the quarrel becomes a standing item in later budget debates."
 ywc_regional.1305.old_covenant_kept:0 "Keep the old covenant: the government roll is bound behind the covenants"
 ywc_regional.1305.old_covenant_kept.cost_tooltip:0 "No one-off expense."
 ywc_regional.1305.old_covenant_kept.consequence_tooltip:0 "An old-covenant ending: the roll remains an appendix to the covenants and the crossings follow custom, left for the next generation to raise again."
 ywc_regional.1305.withdraw_at_1305:0 "Box the roster away: each village keeps its own crossing"
 ywc_regional.1305.withdraw_at_1305.cost_tooltip:0 "No direct expense."
 ywc_regional.1305.withdraw_at_1305.consequence_tooltip:0 "A withdrawn ending: paid subsistence is not refunded, and the common-shift question may be raised anew by later lines."
 ywc_je_v03_amr_a:0 "The Common Fishery on the River Bank"
 ywc_je_v03_amr_a_reason:0 "The fishing grounds of the river bend, the mooring platform and the timber dues downstream now sit in three books: the league roll keeps the villages' old custom, the buyers' contracts keep the wharf and the rafts, and the newcomer fishers are in none of them. The Blackwater League must square these three accounts before the estuary can hold anything lasting."
 ywc_je_v03_amr_b:0 "The Estuary Gains Permanent Residents"
 ywc_je_v03_amr_b_reason:0 "With the river-bank accounts settled, the estuary faces policy without and a new generation within: whether the southern offices' rules acknowledge the league compact, which roll holds the families that no longer leave with the seasons, and whose names may sign when the riverbank compact is written anew. Each account must be settled by the league's own custom, one by one."
 ywc_regional.1400.t:0 "The Nets That Reached the Bay First"
 ywc_regional.1400.d:0 "The river bend runs two fishing seasons a year, and the order of casting nets has always followed the league roll: which village raises its weir first, which household casts first, all written in the compact's appendix. Yet for two years the same water has held nets beyond the league's villages — newly settled households and the cooks of the southern timber rafts cast too, and the old roll has no entry for them. The roll-keeper spreads the book open: by whose standing are these fishing grounds counted?"
 ywc_regional.1400.joint_grounds_register:0 "Enter both rolls: league, villages and newcomer nets filed together"
 ywc_regional.1400.joint_grounds_register.cost_tooltip:0 "Survey and roll fee: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1400.joint_grounds_register.consequence_tooltip:0 "The villages' custom and the newcomers' nets share one roll, and the season's order has a book to fall back on; the mooring platform question follows."
 ywc_regional.1400.league_roll_first:0 "The old league roll decides: newcomers wait in an appendix"
 ywc_regional.1400.league_roll_first.cost_tooltip:0 "No direct expense."
 ywc_regional.1400.league_roll_first.consequence_tooltip:0 "The fee is saved and the villages are satisfied, but the newcomers' nets have no written ground; grievance carries into the estuary question."
 ywc_regional.1400.wait_at_1400:0 "Let each roll keep its own book; the season keeps the old order"
 ywc_regional.1400.wait_at_1400.cost_tooltip:0 "No direct expense."
 ywc_regional.1400.wait_at_1400.consequence_tooltip:0 "The decision is postponed; the quarrel over shared water remains."
 ywc_regional.1400.withdraw_at_1400:0 "Drop this line; the grounds keep to the old custom"
 ywc_regional.1400.withdraw_at_1400.cost_tooltip:0 "No direct expense."
 ywc_regional.1400.withdraw_at_1400.consequence_tooltip:0 "This line ends and the old custom continues; the estuary line will not open."
 ywc_regional.1401.t:0 "Who Repairs the Mooring Platform"
 ywc_regional.1401.d:0 "The mooring platform at the river bend takes the season's boats and cargoes, and most of its piles have rotted. The league council wants it repaired and the treasury has no ready silver; the timber buyers downstream will pay for the whole work in exchange for three of every ten berths held as their own; the village elders will only repair their own stretches, saying the league's platform is the league's to mend. The platform cannot wait and the account must be settled now."
 ywc_regional.1401.league_public_works:0 "The league repairs it whole: the platform rebuilt by custom"
 ywc_regional.1401.league_public_works.cost_tooltip:0 "Rebuilding works: two weeks of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1401.league_public_works.consequence_tooltip:0 "Berths keep their old divisions and neither villages nor buyers gainsay it; the line is rechecked after twelve months of execution."
 ywc_regional.1401.timber_contract:0 "The buyers rebuild it: works priced in three years of reserved berths"
 ywc_regional.1401.timber_contract.cost_tooltip:0 "No direct expense; three of every ten berths go to the buyers for three years."
 ywc_regional.1401.timber_contract.consequence_tooltip:0 "The platform is rebuilt all the same, but the villages' berths are conceded; the concession record settles with the review."
 ywc_regional.1401.narrow_self_repair:0 "Narrow self-repair: mend only the league's berths"
 ywc_regional.1401.narrow_self_repair.cost_tooltip:0 "Half-run works: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1401.narrow_self_repair.consequence_tooltip:0 "The village landings and buyers' berths rot on, and the season's grievance carries into the review; this line settles as a limited result."
 ywc_regional.1402.t:0 "The Timber Buyers' New Terms"
 ywc_regional.1402.d:0 "The year is up and the platform and roll accounts lie before the council, and the timber buyers bring new terms: instead of renting year by year, grant a written export franchise letting them contract the downstream timber dues for three years at one settlement — while the villages' fish runs and firewood stands give up a stretch. A joint port authority preserves adjudication — buyers, villages and the council hearing cases at one table — but the league pays a standing clerk's bill for it."
 ywc_regional.1402.joint_port_authority:0 "A joint port authority: buyers, villages and council share the bench"
 ywc_regional.1402.joint_port_authority.cost_tooltip:0 "No one-off expense; the clerk's bill enters the standing budget yearly."
 ywc_regional.1402.joint_port_authority.consequence_tooltip:0 "Adjudication stays with the council and the villages keep their uses; with both the grounds roll and the platform whole the line counts as consolidated, otherwise it settles as limited; the estuary line follows."
 ywc_regional.1402.franchise_export:0 "Grant the export franchise: timber dues contracted for three years, commons narrowed"
 ywc_regional.1402.franchise_export.cost_tooltip:0 "No direct expense; the contracted dues enter by the quarter."
 ywc_regional.1402.franchise_export.consequence_tooltip:0 "The treasury turns on the contracted dues while the villages' uses are narrowed; this line settles as a limited result and the estuary line follows."
 ywc_regional.1402.defer_review:0 "Hang the review another year: wait for the next round of reports"
 ywc_regional.1402.defer_review.cost_tooltip:0 "No direct expense."
 ywc_regional.1402.defer_review.consequence_tooltip:0 "Settlement is postponed a year; the platform and roll accounts stay open."
 ywc_regional.1403.t:0 "Two Sets of Rules at the Estuary"
 ywc_regional.1403.d:0 "The southern policy letters have reached the estuary: the offices would fold the estuary's trade registration into their northeastern rolls, collect the timber dues by their own schedule, and hear the harbour's cases under their own rules. The league roll and the southern roll already write different notes on the same contract. The estuary now holds two sets of rules — which leads, and how the two run together, is the council's to fix now."
 ywc_regional.1403.league_compact_primary:0 "The compact leads: the southern offices file notice only, no bureau inside"
 ywc_regional.1403.league_compact_primary.cost_tooltip:0 "No direct expense."
 ywc_regional.1403.league_compact_primary.consequence_tooltip:0 "Trade registration stays on the league roll with the southern roll held for reference; external standing keeps its two-country footing."
 ywc_regional.1403.joint_policy_registry:0 "Register with the south: both rolls take the trade, dues split as agreed"
 ywc_regional.1403.joint_policy_registry.cost_tooltip:0 "Transcription cost for the joint roll: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1403.joint_policy_registry.consequence_tooltip:0 "The estuary's contracts enter both rolls with dues split as agreed; disputes are heard jointly."
 ywc_regional.1403.southern_policy_first:0 "The southern rules go first: harbour papers follow the southern roll, the compact keeps the villages"
 ywc_regional.1403.southern_policy_first.cost_tooltip:0 "No direct expense."
 ywc_regional.1403.southern_policy_first.consequence_tooltip:0 "The fee is saved and village matters stay inside the compact, but harbour cases now cite the southern schedule; the concession record carries to the final stage."
 ywc_regional.1403.defer_at_1403:0 "Let the two rolls wait; the post house keeps the papers apart"
 ywc_regional.1403.defer_at_1403.cost_tooltip:0 "No direct expense."
 ywc_regional.1403.defer_at_1403.consequence_tooltip:0 "The decision is postponed; one contract keeps carrying two sets of notes."
 ywc_regional.1404.t:0 "The Families That No Longer Leave With the Seasons"
 ywc_regional.1404.d:0 "The fishers who once came for winter and left with spring have simply stayed: house posts stand at the estuary, children are born on the river bank, and the nets have been swapped for the heavy winter mesh. The league roll knows only seasonal use and has no entry for year-round households. The villages ask how much of the fish runs to yield, the buyers whom to hire, and the elders ask one question: are these families the league's own, or guests?"
 ywc_regional.1404.resident_roll_opened:0 "Enroll the settled families: fish runs, firewood and berths divided by the roll"
 ywc_regional.1404.resident_roll_opened.cost_tooltip:0 "Roll and boundary fee: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1404.resident_roll_opened.consequence_tooltip:0 "The settled families gain their entry and uses divided by the roll; over who yields what, the villages and old households carry their dispute to the last stage."
 ywc_regional.1404.winter_guest_custom:0 "Winter guests by custom: the roll stands, settled families pay as guests"
 ywc_regional.1404.winter_guest_custom.cost_tooltip:0 "No direct expense."
 ywc_regional.1404.winter_guest_custom.consequence_tooltip:0 "The fee is saved while the settled families pay dues without a roll entry; their grievance enters the final stage's record."
 ywc_regional.1404.custom_enrollment:0 "Enroll by compact: those who accept its obligations enter the roll"
 ywc_regional.1404.custom_enrollment.cost_tooltip:0 "No direct expense."
 ywc_regional.1404.custom_enrollment.consequence_tooltip:0 "The roll opens to those who accept the compact's obligations; households that have not stay in suspense until the final stage."
 ywc_regional.1404.defer_at_1404:0 "Defer the settled families' standing: the custom is to be argued again"
 ywc_regional.1404.defer_at_1404.cost_tooltip:0 "No direct expense."
 ywc_regional.1404.defer_at_1404.consequence_tooltip:0 "The standing is deferred; the river bank's unease and the custom's dispute pass intact to the final stage."
 ywc_regional.1405.t:0 "Who Inherits the Riverbank Compact"
 ywc_regional.1405.d:0 "The elders who pressed their hands to the compact have died or can no longer walk the bank. The league roll, the timber contracts, the southern roll and the settled families' entries all lie open: when the riverbank compact is written anew, whose names may fall upon the page — the estuary's settled households, the league's villages, or the buyers downstream? That is the last line this generation of league folk sets."
 ywc_regional.1405.compact_renewed_broadly:0 "Renew broadly: villages, settled families and buyers sign alike, renewal made yearly custom"
 ywc_regional.1405.compact_renewed_broadly.cost_tooltip:0 "Renewal assembly cost: half a week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.1405.compact_renewed_broadly.consequence_tooltip:0 "The institution is consolidated: all three rolls' people sign the compact and renewal becomes standing custom; the fishery, platform and estuary records enter the compact's own text."
 ywc_regional.1405.quota_compromise:0 "A quota compromise: estuary seats under a fixed cap, the rest wait in line"
 ywc_regional.1405.quota_compromise.cost_tooltip:0 "No direct expense."
 ywc_regional.1405.quota_compromise.consequence_tooltip:0 "The compact renews with capped seats; estuary households beyond the cap wait in line, and the dispute is left to the next generation."
 ywc_regional.1405.old_compact_retained:0 "The old compact stands: the roll is unchanged, settled families wait in an appendix"
 ywc_regional.1405.old_compact_retained.cost_tooltip:0 "No direct expense."
 ywc_regional.1405.old_compact_retained.consequence_tooltip:0 "The old compact continues as it was, renewed by the league's elders alone; the estuary's and buyers' claims stay on record without changing the old order."
 ywc_regional.1405.withdraw_at_1405:0 "Withdraw the line; each roll keeps to itself"
 ywc_regional.1405.withdraw_at_1405.cost_tooltip:0 "No direct expense."
 ywc_regional.1405.withdraw_at_1405.consequence_tooltip:0 "Paid costs are not refunded; the renewal question may be raised anew by later lines."
