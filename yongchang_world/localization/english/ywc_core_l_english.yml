 ywc_je_eternal_yongchang:0 "The Unfinished Yongchang"
 ywc_je_eternal_yongchang_reason:0 "Yongchang must reconcile its immense realm, inherited institutions, and the demands of new production."
 ywc_je_jinghai_autonomy:0 "Jinghai Autonomy"
 ywc_je_jinghai_autonomy_reason:0 "Jinghai has its own treasury, armed forces, and maritime network within the Yongchang tributary order."
 ywc_je_dongming_survival:0 "Stranded Overseas"
 ywc_je_dongming_survival_reason:0 "Eastern Ming must survive between Spanish claims, local society, and its Ming-descended political tradition."
 ywc_je_blackwater_century:0 "The Blackwater Century"
 ywc_je_blackwater_century_reason:0 "Northern Qing must build a new state from Sakhalin's plural society, island routes, and restorationist memory."
 ywc_bootstrap.1.t:0 "Yongchang's Unfinished Work"
 ywc_bootstrap.1.d:0 "The old order still stands, but finance, administration, and production demand new answers."
 ywc_bootstrap.1.a:0 "Begin with the work at home."
 ywc_bootstrap.2.t:0 "The Jinghai Wind"
 ywc_bootstrap.2.d:0 "The boundaries between maritime trade, tributary ties, and autonomy must be renegotiated."
 ywc_bootstrap.2.a:0 "Preserve autonomy and the sea lanes."
 ywc_bootstrap.2.b:0 "Invest in the sea lanes."
 ywc_bootstrap.2.c:0 "Consolidate the maritime compact."
 ywc_bootstrap.3.t:0 "Eastern Ming's Frontier"
 ywc_bootstrap.3.d:0 "Spain's claims remain, and Eastern Ming must survive through its own people and ports."
 ywc_bootstrap.3.a:0 "Let Eastern Ming endure first."
 ywc_bootstrap.4.t:0 "A New Blackwater Order"
 ywc_bootstrap.4.d:0 "Sakhalin's peoples and memories of the old dynasty will shape Northern Qing's path."
 ywc_bootstrap.4.a:0 "Build order beneath the cold tide."
