 ywc_je_v03_t03_migration_diaspora:0 "Letters Across the Sea and Local Life"
 ywc_je_v03_t03_migration_diaspora_reason:0 "Dongming's workers cross the sea, and Lanfang's hall receives their letters and remittances. Dongming audits who actually left, how they live in both registers, and how this sea channel should be recorded and closed."
 ywc_society.1100.t:0 "A Letter Recruiting Workers"
 ywc_society.1100.d:0 "A recruiting letter reaches Dongming's offices through a Jinghai trading house: signed by kin in Xinming and a foreman in a Lanfang mine, full of wages, sailing dates, and one more empty stool at the village table. Dongming must verify both ends — whether the side that truly needs hands stands on its own register, and whether those who left still have a homeland register to fall back on."
 ywc_society.1100.examine:0 "Verify hands and registers on both shores"
 ywc_society.1100.examine.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1100.examine.consequence_tooltip:0 "Records this decision."
 ywc_society.1100.refuse_recruit:0 "Seal the letter and refuse recruitment"
 ywc_society.1100.refuse_recruit.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1100.refuse_recruit.consequence_tooltip:0 "Records this decision."
 ywc_society.1100.wait:0 "Wait and review again"
 ywc_society.1100.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1100.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1101.t:0 "The Land Deeds of Those Who Left"
 ywc_society.1101.d:0 "Those who crossed the sea left field deeds, house plots and unpaid levies. Dongming's land registry shares one ledger with the local land-titles line: hold the deeds in trust and record them yearly, or let the fields pass to kin and neighbours. A deed already held in trust is not paid for twice on reconsideration."
 ywc_society.1101.register:0 "Pay 500 to hold the deeds and open a migrant register"
 ywc_society.1101.register.cost_tooltip:0 "Dongming pays 500 from its treasury."
 ywc_society.1101.register.consequence_tooltip:0 "The deeds are held in trust; the register goes to Lanfang's hall for its answer."
 ywc_society.1101.reuse:0 "Use the deeds already held in trust"
 ywc_society.1101.reuse.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1101.reuse.consequence_tooltip:0 "Records this decision."
 ywc_society.1101.decline:0 "Hold nothing; let the land be settled locally"
 ywc_society.1101.decline.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1101.decline.consequence_tooltip:0 "Records this decision."
 ywc_society.1101.wait:0 "Wait and review again"
 ywc_society.1101.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1101.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1102.t:0 "The Request of the Hall and the Village"
 ywc_society.1102.d:0 "Lanfang's hall and the local village community file a joint request: the migrants' hall asks to be registered on its own footing, and the village asks for rules decided together — neither absorbing the other, each keeping its own ledger and its own dues. Lanfang may pay 800 to grant the registration, or withhold it and merely tolerate the gatherings and joint councils."
 ywc_society.1102.charter:0 "Pay 800 to grant the hall its registration"
 ywc_society.1102.charter.cost_tooltip:0 "Lanfang pays 800 from its treasury."
 ywc_society.1102.charter.consequence_tooltip:0 "The hall is registered and answers Dongming; both ends keep a record."
 ywc_society.1102.reuse:0 "Use the registration already granted"
 ywc_society.1102.reuse.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1102.reuse.consequence_tooltip:0 "Records this decision."
 ywc_society.1102.tolerate:0 "Grant no registration; tolerate gatherings and councils"
 ywc_society.1102.tolerate.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1102.tolerate.consequence_tooltip:0 "No registration, tolerated councils; Dongming receives the answer."
 ywc_society.1102.wait:0 "Wait before responding"
 ywc_society.1102.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1102.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1103.t:0 "Which Port Carries the Remittances"
 ywc_society.1103.d:0 "Money flows south easily and returns home with difficulty: routing through Jinghai's trading houses costs exchange and premiums, while direct remittance bills are faster but break with every storm. Dongming and Lanfang keep separate ledgers, and Jinghai's shipping houses actually handle the passage. Premiums already paid are not collected twice."
 ywc_society.1103.port_jhg:0 "Pay 400 to route through Jinghai's houses"
 ywc_society.1103.port_jhg.cost_tooltip:0 "Dongming pays 400 from its treasury."
 ywc_society.1103.port_jhg.consequence_tooltip:0 "Remittances route through Jinghai; the record passes to Lanfang."
 ywc_society.1103.reuse:0 "Use the routing already paid for"
 ywc_society.1103.reuse.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1103.reuse.consequence_tooltip:0 "Records this decision."
 ywc_society.1103.direct:0 "Send remittance bills direct, without a middleman"
 ywc_society.1103.direct.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1103.direct.consequence_tooltip:0 "Bills go direct on existing terms; the record passes to Lanfang."
 ywc_society.1103.stop:0 "Stop the remittances; keep only the letters"
 ywc_society.1103.stop.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1103.stop.consequence_tooltip:0 "Records this decision."
 ywc_society.1103.wait:0 "Wait and review again"
 ywc_society.1103.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1103.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1104.t:0 "The Second Generation's Names"
 ywc_society.1104.d:0 "Children born by the mines have reached the age of registers. Lanfang's civil roll, the village roster and Dongming's homeland register each write names their own way: the local roll asks a citizen's fee, a separate supplement keeps the old sounds and the old names. The second generation's standing is fixed here, and both sides file it."
 ywc_society.1104.register_local:0 "Pay 600 to enter the second generation in the local roll"
 ywc_society.1104.register_local.cost_tooltip:0 "Lanfang pays 600 from its treasury."
 ywc_society.1104.register_local.consequence_tooltip:0 "The second generation enters the local roll; both sides file it."
 ywc_society.1104.reuse:0 "Use the roll entries already made"
 ywc_society.1104.reuse.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1104.reuse.consequence_tooltip:0 "Records this decision."
 ywc_society.1104.keep_names:0 "Keep the homeland names; file a separate supplement"
 ywc_society.1104.keep_names.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1104.keep_names.consequence_tooltip:0 "The old names go into a supplement; both sides file it."
 ywc_society.1104.wait:0 "Wait before responding"
 ywc_society.1104.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1104.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1105.t:0 "A Hard Year in the Old Country"
 ywc_society.1105.d:0 "Famine is reported from the old country: fields failed and the granaries are empty. Dongming may pay 500 to open a relief register and hire ships to carry the plea, asking Lanfang's hall to raise subscriptions; or it may allow only private letters and keep the court's seal off the paper. The famine is real, and the plea must have a working route."
 ywc_society.1105.appeal:0 "Pay 500, open the relief register and appeal formally"
 ywc_society.1105.appeal.cost_tooltip:0 "Dongming pays 500 from its treasury."
 ywc_society.1105.appeal.consequence_tooltip:0 "The relief register is filed; the formal appeal passes to Lanfang's hall."
 ywc_society.1105.limited_letter:0 "Allow private pleas only; the court sets no seal"
 ywc_society.1105.limited_letter.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1105.limited_letter.consequence_tooltip:0 "Records this decision."
 ywc_society.1105.wait:0 "Wait and review again"
 ywc_society.1105.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1105.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1106.t:0 "To Stay or to Return"
 ywc_society.1106.d:0 "The choice of staying or returning sits between two generations and two registers. Dongming may ask Lanfang's hall to confer on shares of return and grain; may let the workers stay with remittances and letters continuing; or may refuse further recruitment and keep only the correspondence. If Lanfang cannot be reached, Dongming closes on its own; appeal costs already paid are not refunded."
 ywc_society.1106.consult:0 "Ask Lanfang's hall to confer on staying or returning"
 ywc_society.1106.consult.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1106.consult.consequence_tooltip:0 "The question of staying or returning passes to Lanfang; both ends record its terms."
 ywc_society.1106.stay_local:0 "Let the workers stay; keep remittances and letters flowing"
 ywc_society.1106.stay_local.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1106.stay_local.consequence_tooltip:0 "Limited acceptance: the workers stay and the channel stays open; both ends file it."
 ywc_society.1106.refuse_channel:0 "Refuse further recruitment; keep only the letters"
 ywc_society.1106.refuse_channel.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1106.refuse_channel.consequence_tooltip:0 "Further recruitment is refused; only correspondence remains."
 ywc_society.1106.alone:0 "Close on our own; the partner is unreachable"
 ywc_society.1106.alone.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1106.alone.consequence_tooltip:0 "A paid appeal channel closes as limited relief; otherwise the record lapses."
 ywc_society.1106.wait:0 "Wait and review again"
 ywc_society.1106.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1106.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1107.t:0 "After the Ledger Changes Hands"
 ywc_society.1107.d:0 "The hall's ledger lies open before both parties: subscription sailings, relief rice entered by name, and dues agreed with the village council. Lanfang may hand the ledger over, pay 1,000 in subscriptions and recognise the migrant community's standing; or keep the ledger and record terms without paying a coin. Either way the outcome is written into Dongming's register."
 ywc_society.1107.hand_over:0 "Hand over the ledger and pay 1,000 in subscriptions"
 ywc_society.1107.hand_over.cost_tooltip:0 "Lanfang pays 1,000; no transfer to Dongming."
 ywc_society.1107.hand_over.consequence_tooltip:0 "Lanfang gains 5 relations with Dongming; the community's standing is registered."
 ywc_society.1107.reserve:0 "Keep the ledger; record terms without subscriptions"
 ywc_society.1107.reserve.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1107.reserve.consequence_tooltip:0 "Lanfang loses 5 relations with Dongming; the terms are recorded all the same."
 ywc_society.1107.wait:0 "Wait before responding"
 ywc_society.1107.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1107.wait.consequence_tooltip:0 "Records this decision."
