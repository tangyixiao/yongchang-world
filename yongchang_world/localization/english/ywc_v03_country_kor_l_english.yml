 ywc_kor.1110.home_workshops:0 "Protect home workshops"
 ywc_kor.1110.home_workshops.cost_tooltip:0 "Next pay half the weekly-income base; pilot subsistence peasants gain 1 standard of living for up to 24 months."
 ywc_kor.1110.home_workshops.consequence_tooltip:0 "Requires employed peasants and an active home-workshops production method."
 ywc_kor.1110.limited_preparation:0 "Limited administrative preparation"
 ywc_kor.1110.limited_preparation.cost_tooltip:0 "Next pay one quarter of the weekly-income base; administrative preparation grants no state service modifier."
 ywc_kor.1110.limited_preparation.consequence_tooltip:0 "Requires an actual office post in the original state; the target is limited settlement."
 ywc_kor.1110.wait:0 "Wait"
 ywc_kor.1110.wait.cost_tooltip:0 "No charge at this step."
 ywc_kor.1110.wait.consequence_tooltip:0 "Keep the current stage and receive it again later."
 ywc_kor.1110.withdraw:0 "Withdraw and end the service"
 ywc_kor.1110.withdraw.cost_tooltip:0 "No charge at this step; paid public expenses are not refunded."
 ywc_kor.1110.withdraw.consequence_tooltip:0 "End the card and remove its remaining service modifier from the original state."
 ywc_kor.1111.t:0 "The Public Office Presents Its Bill"
 ywc_kor.1111.d:0 "The chosen program is recorded. Before payment, recheck the original state, its relevant jobs, inputs and treasury. This public expenditure buys a time-limited local service; it does not enter a named firm’s account."
 ywc_kor.1111.pay_program:0 "Pay the public service cost"
 ywc_kor.1111.pay_program.cost_tooltip:0 "Pay the previously selected amount from the treasury; it is not refundable or recoverable."
 ywc_kor.1111.pay_program.consequence_tooltip:0 "With current original-state conditions met, grant the selected service for up to 24 months; remove it on ownership loss or withdrawal."
 ywc_kor.1111.wait:0 "Wait"
 ywc_kor.1111.wait.cost_tooltip:0 "No charge at this step."
 ywc_kor.1111.wait.consequence_tooltip:0 "Keep the current stage and receive it again later."
 ywc_kor.1111.withdraw:0 "Withdraw and end the service"
 ywc_kor.1111.withdraw.cost_tooltip:0 "No charge at this step; paid public expenses are not refunded."
 ywc_kor.1111.withdraw.consequence_tooltip:0 "End the card and remove its remaining service modifier from the original state."
 ywc_kor.1112.t:0 "Who Witnesses the Account?"
 ywc_kor.1112.d:0 "A cooperative school may witness the account only if its paid, completed record and present posts remain valid. Otherwise the office can appoint a new reviewer. The earlier school agreement is not rewritten."
 ywc_kor.1112.reuse_school_mentor:0 "Use the cooperative school mentor"
 ywc_kor.1112.reuse_school_mentor.cost_tooltip:0 "No additional charge at this step."
 ywc_kor.1112.reuse_school_mentor.consequence_tooltip:0 "Use the genuinely fulfilled cooperative school as witness; its records and current posts remain subject to recheck."
 ywc_kor.1112.new_reviewer:0 "Appoint a new reviewer"
 ywc_kor.1112.new_reviewer.cost_tooltip:0 "No additional charge at this step."
 ywc_kor.1112.new_reviewer.consequence_tooltip:0 "Appoint a current office reviewer; the original-state post must remain valid."
 ywc_kor.1112.wait:0 "Wait"
 ywc_kor.1112.wait.cost_tooltip:0 "No charge at this step."
 ywc_kor.1112.wait.consequence_tooltip:0 "Keep the current stage and receive it again later."
 ywc_kor.1112.withdraw:0 "Withdraw and end the service"
 ywc_kor.1112.withdraw.cost_tooltip:0 "No charge at this step; paid public expenses are not refunded."
 ywc_kor.1112.withdraw.consequence_tooltip:0 "End the card and remove its remaining service modifier from the original state."
 ywc_kor.1113.t:0 "Duties of the Office and Workshops"
 ywc_kor.1113.d:0 "The reviewer, paid record and original pilot must still belong to the same arrangement before the office signs. The signature records a public duty; it promises neither a firm loan nor a profit."
 ywc_kor.1113.sign_duties:0 "Sign local duties"
 ywc_kor.1113.sign_duties.cost_tooltip:0 "No additional charge at this step."
 ywc_kor.1113.sign_duties.consequence_tooltip:0 "Sign the duties for the paid public service and the same pilot; no loan is created."
 ywc_kor.1113.wait:0 "Wait"
 ywc_kor.1113.wait.cost_tooltip:0 "No charge at this step."
 ywc_kor.1113.wait.consequence_tooltip:0 "Keep the current stage and receive it again later."
 ywc_kor.1113.withdraw:0 "Withdraw and end the service"
 ywc_kor.1113.withdraw.cost_tooltip:0 "No charge at this step; paid public expenses are not refunded."
 ywc_kor.1113.withdraw.consequence_tooltip:0 "End the card and remove its remaining service modifier from the original state."
 ywc_kor.1114.t:0 "Are the Jobs Still There?"
 ywc_kor.1114.d:0 "Before acceptance, check jobs and the selected service in the original state. At least six months must elapse and six checks in distinct calendar months must pass. The starting month is excluded; changes between monthly checks are not continuously tracked."
 ywc_kor.1114.accept_duties:0 "Accept duties and start observation"
 ywc_kor.1114.accept_duties.cost_tooltip:0 "No additional charge at this step."
 ywc_kor.1114.accept_duties.consequence_tooltip:0 "At least six months and six checks in different months are required; failure at a monthly check requires restarting."
 ywc_kor.1114.wait:0 "Wait"
 ywc_kor.1114.wait.cost_tooltip:0 "No charge at this step."
 ywc_kor.1114.wait.consequence_tooltip:0 "Keep the current stage and receive it again later."
 ywc_kor.1114.withdraw:0 "Withdraw and end the service"
 ywc_kor.1114.withdraw.cost_tooltip:0 "No charge at this step; paid public expenses are not refunded."
 ywc_kor.1114.withdraw.consequence_tooltip:0 "End the card and remove its remaining service modifier from the original state."
 ywc_kor.1115.t:0 "The Six-Month Review Bill"
 ywc_kor.1115.d:0 "After at least six months and six checks in different calendar months, the office pays one review fee. Failure at a monthly check requires restarting; changes between checks are not continuously tracked. A genuinely fulfilled and paid provincial military review can halve the fee."
 ywc_kor.1115.pay_review:0 "Pay review cost"
 ywc_kor.1115.pay_review.cost_tooltip:0 "Pay one weekly-income base from the treasury."
 ywc_kor.1115.pay_review.consequence_tooltip:0 "Record the actual review expense after completed observation; no principal is collected."
 ywc_kor.1115.reuse_military_review:0 "Reuse the paid military review"
 ywc_kor.1115.reuse_military_review.cost_tooltip:0 "If the earlier provincial military review was genuinely paid and remains valid, pay half the base."
 ywc_kor.1115.reuse_military_review.consequence_tooltip:0 "The old review changes this review cost and does not erase earlier obligations."
 ywc_kor.1115.restart_review:0 "Restart observation"
 ywc_kor.1115.restart_review.cost_tooltip:0 "No charge at this step."
 ywc_kor.1115.restart_review.consequence_tooltip:0 "After restoring actual jobs and duties, allow at least six months and pass six new checks in different calendar months."
 ywc_kor.1115.wait:0 "Wait"
 ywc_kor.1115.wait.cost_tooltip:0 "No charge at this step."
 ywc_kor.1115.wait.consequence_tooltip:0 "Keep the current stage and receive it again later."
 ywc_kor.1115.withdraw:0 "Withdraw and end the service"
 ywc_kor.1115.withdraw.cost_tooltip:0 "No charge at this step; paid public expenses are not refunded."
 ywc_kor.1115.withdraw.consequence_tooltip:0 "End the card and remove its remaining service modifier from the original state."
 ywc_kor.1116.t:0 "How Much of the Service Was Delivered?"
 ywc_kor.1116.d:0 "Both real expenses and the observation are recorded. Request full, limited-preparation or honest setback settlement according to the original state’s current jobs and the earlier witness. Existing obligations are not erased."
 ywc_kor.1116.request_full:0 "Request full settlement"
 ywc_kor.1116.request_full.cost_tooltip:0 "No charge at this step."
 ywc_kor.1116.request_full.consequence_tooltip:0 "Request full settlement when current jobs, both real payments and same-state duties all hold."
 ywc_kor.1116.request_limited:0 "Request limited settlement"
 ywc_kor.1116.request_limited.cost_tooltip:0 "No charge at this step."
 ywc_kor.1116.request_limited.consequence_tooltip:0 "Request a limited settlement only for the limited administrative preparation."
 ywc_kor.1116.request_setback:0 "Request an honest setback"
 ywc_kor.1116.request_setback.cost_tooltip:0 "No charge at this step; paid expenses are not refunded."
 ywc_kor.1116.request_setback.consequence_tooltip:0 "Preserve earned records and request an honest setback when current duties no longer hold."
 ywc_kor.1116.wait:0 "Wait"
 ywc_kor.1116.wait.cost_tooltip:0 "No charge at this step."
 ywc_kor.1116.wait.consequence_tooltip:0 "Keep the current stage and receive it again later."
 ywc_kor.1116.withdraw:0 "Withdraw and end the service"
 ywc_kor.1116.withdraw.cost_tooltip:0 "No charge at this step; paid public expenses are not refunded."
 ywc_kor.1116.withdraw.consequence_tooltip:0 "End the card and remove its remaining service modifier from the original state."
 ywc_kor.1117.t:0 "The Service Left Behind and Money Not Repaid"
 ywc_kor.1117.d:0 "Recheck the same pilot, fee records and current conditions before closing. A setback ends this card’s local service. In every outcome, public spending is not recoverable loan principal."
 ywc_kor.1117.close_full:0 "Confirm full settlement"
 ywc_kor.1117.close_full.cost_tooltip:0 "No charge at this step."
 ywc_kor.1117.close_full.consequence_tooltip:0 "Close after rechecking the original state and costs; the service ends at its original expiry."
 ywc_kor.1117.close_limited:0 "Confirm limited settlement"
 ywc_kor.1117.close_limited.cost_tooltip:0 "No charge at this step."
 ywc_kor.1117.close_limited.consequence_tooltip:0 "Close the limited administrative preparation without a state service modifier."
 ywc_kor.1117.close_setback:0 "Confirm setback"
 ywc_kor.1117.close_setback.cost_tooltip:0 "No charge at this step; paid expenses are not refunded."
 ywc_kor.1117.close_setback.consequence_tooltip:0 "Record the setback and remove any remaining state service modifier from this card."
 ywc_kor.1117.reconsider:0 "Return to reconsider settlement"
 ywc_kor.1117.reconsider.cost_tooltip:0 "No charge at this step; paid costs are not charged again."
 ywc_kor.1117.reconsider.consequence_tooltip:0 "Return to the request stage and choose full, limited or setback according to current conditions."
 ywc_kor.1117.wait:0 "Wait"
 ywc_kor.1117.wait.cost_tooltip:0 "No charge at this step."
 ywc_kor.1117.wait.consequence_tooltip:0 "Keep the current stage and receive it again later."
 ywc_kor.1117.withdraw:0 "Withdraw and end the service"
 ywc_kor.1117.withdraw.cost_tooltip:0 "No charge at this step; paid public expenses are not refunded."
 ywc_kor.1117.withdraw.consequence_tooltip:0 "End the card and remove its remaining service modifier from the original state."
 ywc_je_v03_kor_country_language_charter:0 " JE·Charter: Language and Letters"
 ywc_je_v03_kor_country_language_charter_reason:0 "From textbooks to teachers: turn who-learns-what into an auditable public charge."
 ywc_je_v03_kor_country_language_review:0 " JE·Inspection: Six Months"
 ywc_je_v03_kor_country_language_review_reason:0 "Six real calendar months of review; war or default breaks it."
 ywc_kor.1200.t:0 "The Price of Letters"
 ywc_kor.1200.d:0 "Print shops open in the capital while village schools still teach only the classics. Which children learn to read, and in which script, is the first question before the court."
 ywc_kor.1200.vernacular_first:0 "Vernacular schools first"
 ywc_kor.1200.vernacular_first.cost_tooltip:0 "Each later step is actually paid at half a weekly income."
 ywc_kor.1200.vernacular_first.consequence_tooltip:0 "Vernacular first: fast literacy, but the literati will call it a betrayal of the classics."
 ywc_kor.1200.dual_track:0 "Teach both scripts"
 ywc_kor.1200.dual_track.cost_tooltip:0 "Each later step is actually paid at half a weekly income."
 ywc_kor.1200.dual_track.consequence_tooltip:0 "Two curricula, two costs: the dearest and least contested road."
 ywc_kor.1200.classics_only:0 "Keep the classics first"
 ywc_kor.1200.classics_only.cost_tooltip:0 "Each later step is actually paid at half a weekly income."
 ywc_kor.1200.classics_only.consequence_tooltip:0 "The literati are appeased; literacy climbs slowly."
 ywc_kor.1200.wait_at_1200:0 "Defer the decision"
 ywc_kor.1200.wait_at_1200.cost_tooltip:0 "No expense."
 ywc_kor.1200.wait_at_1200.consequence_tooltip:0 "Defers one turn; tuition and staffing stand unchanged."
 ywc_kor.1200.withdraw_at_1200:0 "Withdraw from this line"
 ywc_kor.1200.withdraw_at_1200.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1200.withdraw_at_1200.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1201.t:0 "The Print Shop Ledger"
 ywc_kor.1201.d:0 "Schools want textbooks and the translation bureau wants masters. The print shop names its price and the treasury waits."
 ywc_kor.1201.state_press:0 "A state press"
 ywc_kor.1201.state_press.cost_tooltip:0 "Pays half a weekly income; inactive while the treasury cannot cover it."
 ywc_kor.1201.state_press.consequence_tooltip:0 "Textbooks at state prices; the cost lands on the treasury."
 ywc_kor.1201.charter_private:0 "Charter private shops"
 ywc_kor.1201.charter_private.cost_tooltip:0 "No direct outlay, but private shops take their cut."
 ywc_kor.1201.charter_private.consequence_tooltip:0 "Printing goes to merchants; textbook prices follow the market."
 ywc_kor.1201.wait_at_1201:0 "Defer the decision"
 ywc_kor.1201.wait_at_1201.cost_tooltip:0 "No expense."
 ywc_kor.1201.wait_at_1201.consequence_tooltip:0 "Defers one turn; textbooks stay scarce."
 ywc_kor.1201.withdraw_at_1201:0 "Withdraw from this line"
 ywc_kor.1201.withdraw_at_1201.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1201.withdraw_at_1201.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1202.t:0 "Where the Classics Go"
 ywc_kor.1202.d:0 "New textbooks want the press; the classics want the academy. Two memorials sit on one desk."
 ywc_kor.1202.print_classics:0 "Print new classical editions"
 ywc_kor.1202.print_classics.cost_tooltip:0 "Pays half a weekly income; inactive while the treasury cannot cover it."
 ywc_kor.1202.print_classics.consequence_tooltip:0 "The classics go to press; the literati get their books and the bureau yields."
 ywc_kor.1202.shrink_classics:0 "Trim the classical course"
 ywc_kor.1202.shrink_classics.cost_tooltip:0 "No extra outlay; the saving is in tuition."
 ywc_kor.1202.shrink_classics.consequence_tooltip:0 "Half the classical hours go; the literati are in an uproar."
 ywc_kor.1202.wait_at_1202:0 "Defer the decision"
 ywc_kor.1202.wait_at_1202.cost_tooltip:0 "No expense."
 ywc_kor.1202.wait_at_1202.consequence_tooltip:0 "Defers one turn; both memorials stay pending."
 ywc_kor.1202.withdraw_at_1202:0 "Withdraw from this line"
 ywc_kor.1202.withdraw_at_1202.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1202.withdraw_at_1202.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1203.t:0 "Who Stands at the Front"
 ywc_kor.1203.d:0 "Books exist, teachers do not. Examination men refuse the vernacular; vernacular readers cannot enter the bureaus."
 ywc_kor.1203.hire_teachers:0 "Fund real teaching posts"
 ywc_kor.1203.hire_teachers.cost_tooltip:0 "Pays half a weekly income and adds urban-center staff; inactive without funds."
 ywc_kor.1203.hire_teachers.consequence_tooltip:0 "Real hires at urban centers; the road to literacy opens."
 ywc_kor.1203.monk_volunteers:0 "Borrow monks and scholars"
 ywc_kor.1203.monk_volunteers.cost_tooltip:0 "No salary paid, but lectures rise and fall with goodwill."
 ywc_kor.1203.monk_volunteers.consequence_tooltip:0 "Free lectures, unstable ones."
 ywc_kor.1203.wait_at_1203:0 "Defer the decision"
 ywc_kor.1203.wait_at_1203.cost_tooltip:0 "No expense."
 ywc_kor.1203.wait_at_1203.consequence_tooltip:0 "Defers one turn; the lectern stays empty."
 ywc_kor.1203.withdraw_at_1203:0 "Withdraw from this line"
 ywc_kor.1203.withdraw_at_1203.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1203.withdraw_at_1203.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1204.t:0 "The Half-Year Inspection"
 ywc_kor.1204.d:0 "The first textbooks reach village schools. Only half a year will tell whether they are scandal or curriculum."
 ywc_kor.1204.open_review:0 "Open the inspection"
 ywc_kor.1204.open_review.cost_tooltip:0 "No expense; the review advances by real calendar months."
 ywc_kor.1204.open_review.consequence_tooltip:0 "Six unbroken months without war or default mature the inspection."
 ywc_kor.1204.wait_at_1204:0 "Defer the decision"
 ywc_kor.1204.wait_at_1204.cost_tooltip:0 "No expense."
 ywc_kor.1204.wait_at_1204.consequence_tooltip:0 "Defers one turn; the review has not begun."
 ywc_kor.1204.withdraw_at_1204:0 "Withdraw from this line"
 ywc_kor.1204.withdraw_at_1204.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1204.withdraw_at_1204.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1205.t:0 "The Inspection's First Ledger"
 ywc_kor.1205.d:0 "The rites board delivers the first inspection ledger: where pupils read, and where they only carry books."
 ywc_kor.1205.extend_review:0 "Continue the inspection"
 ywc_kor.1205.extend_review.cost_tooltip:0 "No expense."
 ywc_kor.1205.extend_review.consequence_tooltip:0 "The review continues until six months pass or it breaks."
 ywc_kor.1205.wait_at_1205:0 "Defer the decision"
 ywc_kor.1205.wait_at_1205.cost_tooltip:0 "No expense."
 ywc_kor.1205.wait_at_1205.consequence_tooltip:0 "Defers one turn; the ledger thickens."
 ywc_kor.1205.withdraw_at_1205:0 "Withdraw from this line"
 ywc_kor.1205.withdraw_at_1205.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1205.withdraw_at_1205.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1206.t:0 "The Literati Answer"
 ywc_kor.1206.d:0 "Memorials, letters, and assemblies before the academy: the script quarrel splits the court in two."
 ywc_kor.1206.stand_firm:0 "Hold the course"
 ywc_kor.1206.stand_firm.cost_tooltip:0 "No expense."
 ywc_kor.1206.stand_firm.consequence_tooltip:0 "The curriculum stands; literati discontent lands on legitimacy."
 ywc_kor.1206.grant_ranks:0 "Rank the new teachers"
 ywc_kor.1206.grant_ranks.cost_tooltip:0 "No separate outlay; salaries follow the old scale."
 ywc_kor.1206.grant_ranks.consequence_tooltip:0 "Teachers join the ranks; literati anger eases a little."
 ywc_kor.1206.wait_at_1206:0 "Defer the decision"
 ywc_kor.1206.wait_at_1206.cost_tooltip:0 "No expense."
 ywc_kor.1206.wait_at_1206.consequence_tooltip:0 "Defers one turn; both memorials stay unanswered."
 ywc_kor.1206.withdraw_at_1206:0 "Withdraw from this line"
 ywc_kor.1206.withdraw_at_1206.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1206.withdraw_at_1206.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1207.t:0 "The Inspection Concludes"
 ywc_kor.1207.d:0 "Six months of ledgers lie on the desk. Full measure, half measure, or failure: the brush must fall today."
 ywc_kor.1207.close_full:0 "Report: the curriculum holds"
 ywc_kor.1207.close_full.cost_tooltip:0 "Requires a matured six-month review and intact finances."
 ywc_kor.1207.close_full.consequence_tooltip:0 "Closes as full success on real payments and the matured review."
 ywc_kor.1207.close_limited:0 "Report: partial results"
 ywc_kor.1207.close_limited.cost_tooltip:0 "Requires intact finances."
 ywc_kor.1207.close_limited.consequence_tooltip:0 "Closes as partial results on the real financial record."
 ywc_kor.1207.close_setback:0 "Report: the inspection failed"
 ywc_kor.1207.close_setback.cost_tooltip:0 "No gate; the closure exit."
 ywc_kor.1207.close_setback.consequence_tooltip:0 "Closes as a setback, keeping the record of sums paid."
 ywc_kor.1207.withdraw_at_1207:0 "Withdraw from this line"
 ywc_kor.1207.withdraw_at_1207.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1207.withdraw_at_1207.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_je_v03_kor_diplomacy_protocol:0 " JE·Protocol: Letters and Missions"
 ywc_je_v03_kor_diplomacy_protocol_reason:0 "Turn the question of national standing into auditable missions and notes."
 ywc_je_v03_kor_diplomacy_review:0 " JE·Observation: Six Months"
 ywc_je_v03_kor_diplomacy_review_reason:0 "Six real calendar months of observation; war or default breaks it."
 ywc_kor.1210.t:0 "The Salutation on the Letter"
 ywc_kor.1210.d:0 "The rites board drafts three salutations: vassal to the elder state, equal among nations, or guest to all. Each stroke defines the state."
 ywc_kor.1210.protocol_equal:0 "Correspond as equals"
 ywc_kor.1210.protocol_equal.cost_tooltip:0 "Later mission costs are actually paid at half a weekly income."
 ywc_kor.1210.protocol_equal.consequence_tooltip:0 "An equal salutation; the old tribute courtesy is shelved."
 ywc_kor.1210.protocol_gradual:0 "Guest courtesy first"
 ywc_kor.1210.protocol_gradual.cost_tooltip:0 "Later mission costs are actually paid at half a weekly income."
 ywc_kor.1210.protocol_gradual.consequence_tooltip:0 "A guest courtesy in transition: dignity and risk both halfway."
 ywc_kor.1210.protocol_traditional:0 "Keep the old form"
 ywc_kor.1210.protocol_traditional.cost_tooltip:0 "Later mission costs are actually paid at half a weekly income."
 ywc_kor.1210.protocol_traditional.consequence_tooltip:0 "The old form costs least thought and speaks last."
 ywc_kor.1210.wait_at_1210:0 "Defer the decision"
 ywc_kor.1210.wait_at_1210.cost_tooltip:0 "No expense."
 ywc_kor.1210.wait_at_1210.consequence_tooltip:0 "Defers one turn; the drafts are redrawn."
 ywc_kor.1210.withdraw_at_1210:0 "Withdraw from this line"
 ywc_kor.1210.withdraw_at_1210.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1210.withdraw_at_1210.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1211.t:0 "The Mission's First Stipend"
 ywc_kor.1211.d:0 "The mission needs salaries and traveling silver. The treasury asks: which court receives it first?"
 ywc_kor.1211.fund_mission:0 "Fund the mission"
 ywc_kor.1211.fund_mission.cost_tooltip:0 "Pays half a weekly income; inactive while the treasury cannot cover it."
 ywc_kor.1211.fund_mission.consequence_tooltip:0 "The mission departs and the letter is delivered."
 ywc_kor.1211.letter_only:0 "Send letters, not envoys"
 ywc_kor.1211.letter_only.cost_tooltip:0 "No stipend paid; replies come slowly."
 ywc_kor.1211.letter_only.consequence_tooltip:0 "Letters lead; good faith is discounted."
 ywc_kor.1211.wait_at_1211:0 "Defer the decision"
 ywc_kor.1211.wait_at_1211.cost_tooltip:0 "No expense."
 ywc_kor.1211.wait_at_1211.consequence_tooltip:0 "Defers one turn; the mission still waits."
 ywc_kor.1211.withdraw_at_1211:0 "Withdraw from this line"
 ywc_kor.1211.withdraw_at_1211.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1211.withdraw_at_1211.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1212.t:0 "Copies in the Trading House"
 ywc_kor.1212.d:0 "Copies of the new letter circulate among the trading houses. Merchants ask the practical question: do the tariffs stand?"
 ywc_kor.1212.trade_stands:0 "Declare tariffs unchanged"
 ywc_kor.1212.trade_stands.cost_tooltip:0 "No expense; the pledge itself has weight."
 ywc_kor.1212.trade_stands.consequence_tooltip:0 "Trade stands and revenue follows the old ledgers."
 ywc_kor.1212.renegotiate_tariffs:0 "Renegotiate the tariffs"
 ywc_kor.1212.renegotiate_tariffs.cost_tooltip:0 "No expense, but markets wait and see."
 ywc_kor.1212.renegotiate_tariffs.consequence_tooltip:0 "Tariff talks reopen; short-run trade volume suffers."
 ywc_kor.1212.wait_at_1212:0 "Defer the decision"
 ywc_kor.1212.wait_at_1212.cost_tooltip:0 "No expense."
 ywc_kor.1212.wait_at_1212.consequence_tooltip:0 "Defers one turn; the trading houses keep asking."
 ywc_kor.1212.withdraw_at_1212:0 "Withdraw from this line"
 ywc_kor.1212.withdraw_at_1212.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1212.withdraw_at_1212.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1213.t:0 "Choosing the Port Office"
 ywc_kor.1213.d:0 "Trade has widened; the ports need a proper office. Old maritime bureau men, or the new school's interpreters?"
 ywc_kor.1213.staff_office:0 "Staff the port office"
 ywc_kor.1213.staff_office.cost_tooltip:0 "Pays half a weekly income and adds port staff; inactive without funds."
 ywc_kor.1213.staff_office.consequence_tooltip:0 "Real hires at the port; correspondence gets stewards."
 ywc_kor.1213.borrow_interpreters:0 "Detail interpreters"
 ywc_kor.1213.borrow_interpreters.cost_tooltip:0 "No office stipend; the staff remain on old rolls."
 ywc_kor.1213.borrow_interpreters.consequence_tooltip:0 "Interpreters double up; port papers pile up."
 ywc_kor.1213.wait_at_1213:0 "Defer the decision"
 ywc_kor.1213.wait_at_1213.cost_tooltip:0 "No expense."
 ywc_kor.1213.wait_at_1213.consequence_tooltip:0 "Defers one turn; the seal stays idle."
 ywc_kor.1213.withdraw_at_1213:0 "Withdraw from this line"
 ywc_kor.1213.withdraw_at_1213.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1213.withdraw_at_1213.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1214.t:0 "The Treaty Observation"
 ywc_kor.1214.d:0 "The letter is out; replies pending. Every note exchanged this half-year sets the treaty's tone."
 ywc_kor.1214.open_review:0 "Open the observation"
 ywc_kor.1214.open_review.cost_tooltip:0 "No expense; the review advances by real calendar months."
 ywc_kor.1214.open_review.consequence_tooltip:0 "Six unbroken months without war or default mature the observation."
 ywc_kor.1214.wait_at_1214:0 "Defer the decision"
 ywc_kor.1214.wait_at_1214.cost_tooltip:0 "No expense."
 ywc_kor.1214.wait_at_1214.consequence_tooltip:0 "Defers one turn; the observation has not begun."
 ywc_kor.1214.withdraw_at_1214:0 "Withdraw from this line"
 ywc_kor.1214.withdraw_at_1214.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1214.withdraw_at_1214.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1215.t:0 "The First Reply"
 ywc_kor.1215.d:0 "A reply arrives: in the old courtesy, the new, or with no answer at all."
 ywc_kor.1215.continue_review:0 "Keep waiting"
 ywc_kor.1215.continue_review.cost_tooltip:0 "No expense."
 ywc_kor.1215.continue_review.consequence_tooltip:0 "The observation continues until six months pass or it breaks."
 ywc_kor.1215.wait_at_1215:0 "Defer the decision"
 ywc_kor.1215.wait_at_1215.cost_tooltip:0 "No expense."
 ywc_kor.1215.wait_at_1215.consequence_tooltip:0 "Defers one turn; the reply is filed."
 ywc_kor.1215.withdraw_at_1215:0 "Withdraw from this line"
 ywc_kor.1215.withdraw_at_1215.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1215.withdraw_at_1215.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1216.t:0 "Old Pacts, New Courtesy"
 ywc_kor.1216.d:0 "The old pacts remain on the rolls. Under the old courtesy their reading belongs to others; under the new, renegotiation."
 ywc_kor.1216.uphold_old_pacts:0 "Uphold the old pacts"
 ywc_kor.1216.uphold_old_pacts.cost_tooltip:0 "No expense."
 ywc_kor.1216.uphold_old_pacts.consequence_tooltip:0 "Old pacts stand; the other side loses a pretext to reopen them."
 ywc_kor.1216.reopen_pacts:0 "Move to reopen the pacts"
 ywc_kor.1216.reopen_pacts.cost_tooltip:0 "No expense, but leverage at the table follows real strength."
 ywc_kor.1216.reopen_pacts.consequence_tooltip:0 "The motion is filed; its fate waits at the next station."
 ywc_kor.1216.wait_at_1216:0 "Defer the decision"
 ywc_kor.1216.wait_at_1216.cost_tooltip:0 "No expense."
 ywc_kor.1216.wait_at_1216.consequence_tooltip:0 "Defers one turn; the rolls stay untouched."
 ywc_kor.1216.withdraw_at_1216:0 "Withdraw from this line"
 ywc_kor.1216.withdraw_at_1216.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1216.withdraw_at_1216.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1217.t:0 "The Observation Concludes"
 ywc_kor.1217.d:0 "Half a year of notes and replies lies open. Whether the new courtesy holds: the brush falls today."
 ywc_kor.1217.close_full:0 "Report: the courtesy holds"
 ywc_kor.1217.close_full.cost_tooltip:0 "Requires a matured observation and intact finances."
 ywc_kor.1217.close_full.consequence_tooltip:0 "Closes as full success on real outlays and the matured observation."
 ywc_kor.1217.close_limited:0 "Report: courtesy with some courts"
 ywc_kor.1217.close_limited.cost_tooltip:0 "Requires intact finances."
 ywc_kor.1217.close_limited.consequence_tooltip:0 "Closes as partial results on the real financial record."
 ywc_kor.1217.close_setback:0 "Report: the courtesy failed"
 ywc_kor.1217.close_setback.cost_tooltip:0 "No gate; the closure exit."
 ywc_kor.1217.close_setback.consequence_tooltip:0 "Closes as a setback, keeping the record of sums paid."
 ywc_kor.1217.withdraw_at_1217:0 "Withdraw from this line"
 ywc_kor.1217.withdraw_at_1217.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1217.withdraw_at_1217.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_je_v03_kor_oblig_pledge:0 " JE·Pledge: Relief and Granaries"
 ywc_je_v03_kor_oblig_pledge_reason:0 "Turn the pledge against famine into audited purchases, statutes and funding."
 ywc_je_v03_kor_oblig_review:0 " JE·Trial: Four Months"
 ywc_je_v03_kor_oblig_review_reason:0 "Four real calendar months of review; war or default breaks it."
 ywc_kor.1220.t:0 "The Winter We Promised"
 ywc_kor.1220.d:0 "A lean year returns. The court once pledged not to watch famine idly; the granaries stand empty and the ledgers wait."
 ywc_kor.1220.local_mutual:0 "Local mutual aid first"
 ywc_kor.1220.local_mutual.cost_tooltip:0 "Later grain buys and statutes are actually paid at half a weekly income."
 ywc_kor.1220.local_mutual.consequence_tooltip:0 "Provinces raise their own; the court patches gaps."
 ywc_kor.1220.state_guarantee:0 "A state guarantee"
 ywc_kor.1220.state_guarantee.cost_tooltip:0 "Later statutes and payments are computed at half a weekly income."
 ywc_kor.1220.state_guarantee.consequence_tooltip:0 "Poor laws are codified; the accounts land on the treasury."
 ywc_kor.1220.austerity:0 "Austerity and self-help"
 ywc_kor.1220.austerity.cost_tooltip:0 "Viable only with at least 100 in reserve."
 ywc_kor.1220.austerity.consequence_tooltip:0 "The court saves; the provinces carry the grudge."
 ywc_kor.1220.wait_at_1220:0 "Defer the decision"
 ywc_kor.1220.wait_at_1220.cost_tooltip:0 "No expense."
 ywc_kor.1220.wait_at_1220.consequence_tooltip:0 "Defers one turn; famine does not wait."
 ywc_kor.1220.withdraw_at_1220:0 "Withdraw from this line"
 ywc_kor.1220.withdraw_at_1220.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1220.withdraw_at_1220.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1221.t:0 "The Granary's First Purchase"
 ywc_kor.1221.d:0 "A chosen road must show real grain: the charity granary needs stock, and stock is bought on the market."
 ywc_kor.1221.buy_grain:0 "Buy grain with real silver"
 ywc_kor.1221.buy_grain.cost_tooltip:0 "Pays half a weekly income; inactive while the treasury cannot cover it."
 ywc_kor.1221.buy_grain.consequence_tooltip:0 "A real market purchase; prices follow the exchange."
 ywc_kor.1221.levy_provinces:0 "Assess the provinces in kind"
 ywc_kor.1221.levy_provinces.cost_tooltip:0 "No silver paid; provincial resentment is entered in the record."
 ywc_kor.1221.levy_provinces.consequence_tooltip:0 "Granaries fill while the countryside strains."
 ywc_kor.1221.wait_at_1221:0 "Defer the decision"
 ywc_kor.1221.wait_at_1221.cost_tooltip:0 "No expense."
 ywc_kor.1221.wait_at_1221.consequence_tooltip:0 "Defers one turn; the bins stay empty."
 ywc_kor.1221.withdraw_at_1221:0 "Withdraw from this line"
 ywc_kor.1221.withdraw_at_1221.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1221.withdraw_at_1221.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1222.t:0 "Crossing the Poor-Law Threshold"
 ywc_kor.1222.d:0 "Codifying relief passes two gates at court: one of money, one of authority."
 ywc_kor.1222.push_poor_laws:0 "Move the poor laws"
 ywc_kor.1222.push_poor_laws.cost_tooltip:0 "Recorded as an enactment; no immediate outlay."
 ywc_kor.1222.push_poor_laws.consequence_tooltip:0 "Cannot repeat an enacted measure; later payments are itemized."
 ywc_kor.1222.keep_custom:0 "Keep the local customs"
 ywc_kor.1222.keep_custom.cost_tooltip:0 "No new statute, no new charge."
 ywc_kor.1222.keep_custom.consequence_tooltip:0 "Customs continue; the court keeps its hands clean."
 ywc_kor.1222.wait_at_1222:0 "Defer the decision"
 ywc_kor.1222.wait_at_1222.cost_tooltip:0 "No expense."
 ywc_kor.1222.wait_at_1222.consequence_tooltip:0 "Defers one turn; the bill stays pending."
 ywc_kor.1222.withdraw_at_1222:0 "Withdraw from this line"
 ywc_kor.1222.withdraw_at_1222.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1222.withdraw_at_1222.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1223.t:0 "What the Law Costs"
 ywc_kor.1223.d:0 "An enactment carries an annual charge. The treasury demands the sentence be finished: pay, or do not."
 ywc_kor.1223.fund_law:0 "Fund the law"
 ywc_kor.1223.fund_law.cost_tooltip:0 "Pays half a weekly income; inactive while the treasury cannot cover it."
 ywc_kor.1223.fund_law.consequence_tooltip:0 "The charge is booked; staffing follows."
 ywc_kor.1223.defer_funding:0 "Legislate without funding"
 ywc_kor.1223.defer_funding.cost_tooltip:0 "No payment; the statute idles."
 ywc_kor.1223.defer_funding.consequence_tooltip:0 "A law in name only; the grudge lands on the court."
 ywc_kor.1223.wait_at_1223:0 "Defer the decision"
 ywc_kor.1223.wait_at_1223.cost_tooltip:0 "No expense."
 ywc_kor.1223.wait_at_1223.consequence_tooltip:0 "Defers one turn; the price stays open."
 ywc_kor.1223.withdraw_at_1223:0 "Withdraw from this line"
 ywc_kor.1223.withdraw_at_1223.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1223.withdraw_at_1223.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1224.t:0 "The Four-Month Trial"
 ywc_kor.1224.d:0 "Grain in the bins, law through the councils. What remains is time: four months, unbroken."
 ywc_kor.1224.open_review:0 "Open the trial"
 ywc_kor.1224.open_review.cost_tooltip:0 "No expense; the review advances by real calendar months."
 ywc_kor.1224.open_review.consequence_tooltip:0 "Four unbroken months without war or default mature the trial."
 ywc_kor.1224.wait_at_1224:0 "Defer the decision"
 ywc_kor.1224.wait_at_1224.cost_tooltip:0 "No expense."
 ywc_kor.1224.wait_at_1224.consequence_tooltip:0 "Defers one turn; the trial has not begun."
 ywc_kor.1224.withdraw_at_1224:0 "Withdraw from this line"
 ywc_kor.1224.withdraw_at_1224.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1224.withdraw_at_1224.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1225.t:0 "Soup Lines and Ledgers"
 ywc_kor.1225.d:0 "The trial is half done: provinces report relief rolls, and hints of diverted grain."
 ywc_kor.1225.continue_review:0 "Continue the trial"
 ywc_kor.1225.continue_review.cost_tooltip:0 "No expense."
 ywc_kor.1225.continue_review.consequence_tooltip:0 "The review continues until four months pass or it breaks."
 ywc_kor.1225.wait_at_1225:0 "Defer the decision"
 ywc_kor.1225.wait_at_1225.cost_tooltip:0 "No expense."
 ywc_kor.1225.wait_at_1225.consequence_tooltip:0 "Defers one turn; the rolls are re-checked."
 ywc_kor.1225.withdraw_at_1225:0 "Withdraw from this line"
 ywc_kor.1225.withdraw_at_1225.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1225.withdraw_at_1225.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1226.t:0 "Where the Grudges Go"
 ywc_kor.1226.d:0 "Laid-out weavers in the cities and landless tenants in the villages wait on this ledger for an answer."
 ywc_kor.1226.widen_relief:0 "Widen the relief"
 ywc_kor.1226.widen_relief.cost_tooltip:0 "Widening raises charges, actually paid at half a weekly income."
 ywc_kor.1226.widen_relief.consequence_tooltip:0 "Radicalism and turmoil ease; the ledger grows."
 ywc_kor.1226.hold_line:0 "Hold the current line"
 ywc_kor.1226.hold_line.cost_tooltip:0 "No new charge; the grudge finds its own outlet."
 ywc_kor.1226.hold_line.consequence_tooltip:0 "The ledger holds; the streets may not."
 ywc_kor.1226.wait_at_1226:0 "Defer the decision"
 ywc_kor.1226.wait_at_1226.cost_tooltip:0 "No expense."
 ywc_kor.1226.wait_at_1226.consequence_tooltip:0 "Defers one turn; both options stay open."
 ywc_kor.1226.withdraw_at_1226:0 "Withdraw from this line"
 ywc_kor.1226.withdraw_at_1226.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1226.withdraw_at_1226.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_kor.1227.t:0 "The Trial Concludes"
 ywc_kor.1227.d:0 "Four months of ledgers close. The promised winter owes an answer."
 ywc_kor.1227.close_full:0 "Report: the guarantee holds"
 ywc_kor.1227.close_full.cost_tooltip:0 "Requires a matured review and intact finances."
 ywc_kor.1227.close_full.consequence_tooltip:0 "Closes as full success on real payments and the matured review."
 ywc_kor.1227.close_limited:0 "Report: kept in some provinces"
 ywc_kor.1227.close_limited.cost_tooltip:0 "Requires intact finances."
 ywc_kor.1227.close_limited.consequence_tooltip:0 "Closes as partial results on the real financial record."
 ywc_kor.1227.close_setback:0 "Report: the pledge failed"
 ywc_kor.1227.close_setback.cost_tooltip:0 "No gate; the closure exit."
 ywc_kor.1227.close_setback.consequence_tooltip:0 "Closes as a setback, keeping the record of sums paid."
 ywc_kor.1227.withdraw_at_1227:0 "Withdraw from this line"
 ywc_kor.1227.withdraw_at_1227.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_kor.1227.withdraw_at_1227.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
