 ywc_je_v03_kor_court_public_deliberation:0 "The Memorials Outside the Royal Lecture"
 ywc_je_v03_kor_court_public_deliberation_reason:0 "In one currently owned Joseon pilot state, choose the open court deliberation, local delegates or the conservative petition, or explicitly aim only at a conservative finite target. Each mode carries different current political law, in-government group, staffed-post and legitimacy conditions; the filing fee and a professional witness are handled later."
