 ywc_kor.1015.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1015.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1016.t:0 "Were Graduates Actually Appointed"
 ywc_kor.1016.d:0 "After continuous review, offices must show real posts and academies must be able to certify translations. Full establishment requires the staffed route and settled M1 contracts; capped lessons can only compromise."
 ywc_kor.1016.establish:0 "Establish through real university and office posts"
 ywc_kor.1016.establish.cost_tooltip:0 "No new fee."
 ywc_kor.1016.establish.consequence_tooltip:0 "Establishes only after the full target passes continuously; grants no law or degree."
 ywc_kor.1016.compromise:0 "Compromise with capped lessons and one clerk"
 ywc_kor.1016.compromise.cost_tooltip:0 "No new fee."
 ywc_kor.1016.compromise.consequence_tooltip:0 "Settles only the lower target and never mislabels it as full appointments."
 ywc_kor.1016.wait_for_observation:0 "Keep the continuous review running"
 ywc_kor.1016.wait_for_observation.cost_tooltip:0 "No new fee."
 ywc_kor.1016.wait_for_observation.consequence_tooltip:0 "If qualification remains valid, the settlement options return after the observation period."
 ywc_kor.1016.defer:0 "Acknowledge the 12-month block and defer"
 ywc_kor.1016.defer.cost_tooltip:0 "No new fee."
 ywc_kor.1016.defer.consequence_tooltip:0 "Deferral does not settle the review; the 36-month notice remains deliverable and withdrawal is always available."
 ywc_kor.1016.repair:0 "A condition failed; reset and observe again"
 ywc_kor.1016.repair.cost_tooltip:0 "No new fee."
 ywc_kor.1016.repair.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1016.withdraw:0 "Withdraw the academy and appointment charter"
 ywc_kor.1016.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1016.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1017.t:0 "New Learning Need Not Burn the Old Books"
 ywc_kor.1017.d:0 "The final check re-evaluates state ownership, war, finances and participating groups. If conditions change after the window opens, retry, narrow or withdraw under the current facts; existing debts remain due."
 ywc_kor.1017.settle_established:0 "Conditions still hold; settle co-management or court school"
 ywc_kor.1017.settle_established.cost_tooltip:0 "No further charge."
 ywc_kor.1017.settle_established.consequence_tooltip:0 "The selected schooling arrangement has been verified; settlement makes no additional change to interest group support."
 ywc_kor.1017.settle_compromise:0 "Conditions still hold; settle capped translation"
 ywc_kor.1017.settle_compromise.cost_tooltip:0 "No further charge."
 ywc_kor.1017.settle_compromise.consequence_tooltip:0 "The selected reduced schooling arrangement has been verified; settlement makes no additional change to interest group support and does not claim full education results."
 ywc_kor.1017.retry:0 "Conditions changed; review posts and accounts again"
 ywc_kor.1017.retry.cost_tooltip:0 "No new fee."
 ywc_kor.1017.retry.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1017.withdraw:0 "Keep signed old contracts and end the new arc"
 ywc_kor.1017.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1017.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_je_v03_kor_controlled_ports:0 "Customs Exceptions and Shore Ledgers"
 ywc_je_v03_kor_controlled_ports_reason:0 "A designated port, general trade, or a restricted shore office must be audited against real trade laws, port jobs and administrative supply. Settlement requires six continuous safe months."
 ywc_kor.1018.t:0 "Two Tax Bills for One Port"
 ywc_kor.1018.d:0 "Merchants are taxed by ship while shore clerks register the cargo; one voyage has two bills. Choose only a target supported by current law and existing staff; the arc creates no port or trade route."
 ywc_kor.1018.licensed_port:0 "Keep a ledger for one port under current trade law"
 ywc_kor.1018.licensed_port.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52; Base filing fee; checks an existing port only."
 ywc_kor.1018.licensed_port.consequence_tooltip:0 "Requires a trade-permitting law and a staffed real port."
 ywc_kor.1018.general_customs:0 "General trade with a unified customs ledger"
 ywc_kor.1018.general_customs.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52; Base fee plus half; requires staffed port and administration."
 ywc_kor.1018.general_customs.consequence_tooltip:0 "Wider target with higher administrative demands."
 ywc_kor.1018.shore_ledger:0 "Keep restrictions and audit the shore office"
 ywc_kor.1018.shore_ledger.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52; Lower target at the base fee; may proceed without a port if an office is staffed."
 ywc_kor.1018.shore_ledger.consequence_tooltip:0 "Does not claim an open port or general trade; audits shore administration only."
 ywc_kor.1018.defer:0 "Defer until the budget or posts recover"
 ywc_kor.1018.defer.cost_tooltip:0 "No new fee."
 ywc_kor.1018.defer.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1018.withdraw:0 "Withdraw the customs registration"
 ywc_kor.1018.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1018.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1019.t:0 "Can an Exception Be Written into Port Rules"
 ywc_kor.1019.d:0 "A port rule cannot override current trade law. A settled military-account route reduces central filing costs; a setback or unpaid old translation contract raises the reserve. Isolationism still forbids international trade."
 ywc_kor.1019.record_exception:0 "Record an exception under current law and accounts"
 ywc_kor.1019.record_exception.cost_tooltip:0 "Previously paid fees are not charged twice; any reserve required by a prior setback must be paid."
 ywc_kor.1019.record_exception.consequence_tooltip:0 "Two later nodes read the old military and school outcomes."
 ywc_kor.1019.narrow:0 "Narrow to shore accounts if trade law forbids trade"
 ywc_kor.1019.narrow.cost_tooltip:0 "The previously paid filing fee funds the reduced shore target; no refund, new fee or loss of old accounts."
 ywc_kor.1019.narrow.consequence_tooltip:0 "Keeps existing restrictions; later checks only office ledgers."
 ywc_kor.1019.defer:0 "Wait for law or staffing to change"
 ywc_kor.1019.defer.cost_tooltip:0 "No new fee."
 ywc_kor.1019.defer.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1019.withdraw:0 "Withdraw the port-rule exception"
 ywc_kor.1019.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1019.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1020.t:0 "Sea Merchants and the Shore Brokers"
 ywc_kor.1020.d:0 "Sea merchants want each voyage audited; shore brokers want cargo and checkpoint accounts. A co-managed academy route must retain literate review capacity, while capped translations accept a one-clerk reduced ledger."
 ywc_kor.1020.assign_auditors:0 "Assign real auditors by the school arrangement"
 ywc_kor.1020.assign_auditors.cost_tooltip:0 "No added fee."
 ywc_kor.1020.assign_auditors.consequence_tooltip:0 "The coastal office checks the same organization choice again later."
 ywc_kor.1020.shore_only:0 "Port staff are unavailable; use shore accounts"
 ywc_kor.1020.shore_only.cost_tooltip:0 "No refund or new fee; prior filing funds shore review and all outstanding accounts remain due."
 ywc_kor.1020.shore_only.consequence_tooltip:0 "Explicitly narrows to domestic shore accounts without claiming an open port."
 ywc_kor.1020.defer:0 "Wait for auditors to take their posts"
 ywc_kor.1020.defer.cost_tooltip:0 "No new fee."
 ywc_kor.1020.defer.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1020.withdraw:0 "End the exception draft"
 ywc_kor.1020.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1020.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1021.t:0 "The Coastal Office Requests the Ledger"
 ywc_kor.1021.d:0 "The coastal office checks both port staff and the budget. Full customs review cannot settle while old military invoices or school appointments remain unresolved; the narrow shore target remains available."
 ywc_kor.1021.verify_full:0 "Old contracts are paid; retain the full ledger target"
 ywc_kor.1021.verify_full.cost_tooltip:0 "No added fee; unpaid old obligations fail the guard."
 ywc_kor.1021.verify_full.consequence_tooltip:0 "Both real port capacity and the school arrangement must remain available."
 ywc_kor.1021.shore_only:0 "Narrow to shore review if invoices or port staff fall short"
 ywc_kor.1021.shore_only.cost_tooltip:0 "No new fee; prior payment funds the shore target and old military accounts stay on schedule."
 ywc_kor.1021.shore_only.consequence_tooltip:0 "Registers shore ledgers only and retains restrictions."
 ywc_kor.1021.defer:0 "Keep the books open until old invoices are paid"
 ywc_kor.1021.defer.cost_tooltip:0 "No new fee."
 ywc_kor.1021.defer.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1021.withdraw:0 "Withdraw customs review"
 ywc_kor.1021.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1021.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1022.t:0 "Settle the Arrears Before Revoking the Exception"
 ywc_kor.1022.d:0 "Real staffing or budget shortfalls reset continuous review. After 12 blocked months, repair or narrow; after 36 months, end the new registration without erasing existing coastal or interpreter contracts."
 ywc_kor.1022.repair:0 "Conditions recovered; restart six-month review"
 ywc_kor.1022.repair.cost_tooltip:0 "No refund and no new fee."
 ywc_kor.1022.repair.consequence_tooltip:0 "Review starts at zero; a reduced route can only compromise."
 ywc_kor.1022.narrow:0 "Narrow to shore accounts under existing restrictions"
 ywc_kor.1022.narrow.cost_tooltip:0 "No new fee; the previously paid port fee funds the reduced shore review, with no refund."
 ywc_kor.1022.narrow.consequence_tooltip:0 "Record prior accounts and paid contracts, then restart six months for the shore target without claiming general trade."
 ywc_kor.1022.defer:0 "Continue waiting at the 12-month blockage point"
 ywc_kor.1022.defer.cost_tooltip:0 "No new fee."
 ywc_kor.1022.defer.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1022.record_prior_contracts:0 "Reconsider: record prior contracts and continue to auditor assignment"
 ywc_kor.1022.record_prior_contracts.cost_tooltip:0 "No new fee; retain prior payments and all outstanding old accounts."
 ywc_kor.1022.record_prior_contracts.consequence_tooltip:0 "At the 36-month review, record old accounts and return to auditor assignment without skipping contracts or adding a fee."
 ywc_kor.1022.withdraw:0 "Withdraw from the port review"
 ywc_kor.1022.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1022.withdraw.consequence_tooltip:0 "Available at any time; paid fees are retained, a setback is recorded and the active slot is released."
 ywc_kor.1023.t:0 "Which Rule Governs the Next Ship"
 ywc_kor.1023.d:0 "After six continuous months, recheck ownership, war, port staff, law and finances. Full customs settles only if current law and a real port still support it; a shore route records domestic accounts only."
 ywc_kor.1023.settle_full:0 "Settle under the existing port and current trade law"
 ywc_kor.1023.settle_full.cost_tooltip:0 "No new fee."
 ywc_kor.1023.settle_full.consequence_tooltip:0 "Creates no trade route and changes no sovereignty."
 ywc_kor.1023.settle_shore:0 "Settle only the shore-office ledger"
 ywc_kor.1023.settle_shore.cost_tooltip:0 "No new fee."
 ywc_kor.1023.settle_shore.consequence_tooltip:0 "The lower target never claims an open port or general trade."
 ywc_kor.1023.wait_for_observation:0 "Keep the continuous review running"
 ywc_kor.1023.wait_for_observation.cost_tooltip:0 "No new fee."
 ywc_kor.1023.wait_for_observation.consequence_tooltip:0 "Keeps the current observation running; qualification must remain valid until the review completes."
 ywc_kor.1023.repair:0 "Conditions changed; observe again"
 ywc_kor.1023.repair.cost_tooltip:0 "No new fee."
 ywc_kor.1023.repair.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1023.withdraw:0 "End the new registration and keep old contracts"
