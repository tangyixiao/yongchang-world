l_english:
 ywc_je_v03_kor_military_audit:0 "Audit the Muster and Supply"
 ywc_je_v03_kor_military_audit_reason:0 "Choose court supply, provincial shares or capped legacy forces. Monthly real-state checks must pass continuously for six months; a failed month clears the timer. Show a blocked notice after 12 months and offer exit at 36. Without an army, a staffed office can sustain limited border service."
 ywc_je_v03_kor_service_settlement:0 "Who Will Sustain the New Army Office"
 ywc_je_v03_kor_service_settlement_reason:0 "After the first review, check nine continuous months. Each passing month requires actual payment; any failed month clears the timer. In peace review training, rotations and procurement; in war prioritize supply and allow narrowing. Subject status does not interrupt domestic work."
 ywc_kor.1000.t:0 "The Guards Missing from the Roll"
 ywc_kor.1000.d:0 "The army office has headcounts but no durable account of food, arms or rotations. Without an active army, this line audits office-based border service and legacy quotas without requiring expansion."
 ywc_kor.1000.court_supply:0 "Court supply: central command"
 ywc_kor.1000.court_supply.cost_tooltip:0 "One-time audit costs opening annual gross income / 52, minimum 100; regular army expenses remain in the game budget."
 ywc_kor.1000.court_supply.consequence_tooltip:0 "Gains central inspection; requires professional army law, medium or higher wages and qualifying barracks. Highest recurring cost."
 ywc_kor.1000.provincial_share:0 "Provincial shares: retain local returns"
 ywc_kor.1000.provincial_share.cost_tooltip:0 "One-time audit costs opening annual gross income / 52, minimum 100; regular army expenses remain in the game budget."
 ywc_kor.1000.provincial_share.consequence_tooltip:0 "Lower central allotment in exchange for provincial returns and audit rights; barrack and wage conditions still apply."
 ywc_kor.1000.limited_legacy:0 "Capped legacy forces: lower the target"
 ywc_kor.1000.limited_legacy.cost_tooltip:0 "One-time audit costs opening annual gross income / 52, minimum 100; no extra monthly military-supply tax is added."
 ywc_kor.1000.limited_legacy.consequence_tooltip:0 "No forced expansion or law change; check barracks if an army exists, or use a staffed, supplied office for border service if it does not."
 ywc_kor.1000.defer_or_withdraw:0 "Defer the audit or end this registration"
 ywc_kor.1000.defer_or_withdraw.cost_tooltip:0 "Deferral charges nothing further; ending retains any audit fee already paid."
 ywc_kor.1000.defer_or_withdraw.consequence_tooltip:0 "Retry when funds recover; ending records a setback and releases this country slot."
 ywc_kor.1001.t:0 "Where Did the Rations Stop"
 ywc_kor.1001.d:0 "The audited state's barracks must be staffed and free of military-goods shortages, and the state budget must sustain its existing military spending. This review adds no invented monthly ration debit."
 ywc_kor.1001.pay_month:0 "Keep the allotment and pay monthly"
 ywc_kor.1001.pay_month.cost_tooltip:0 "No extra monthly debit; wages and supplies resolve through the game's actual military budget and market."
 ywc_kor.1001.pay_month.consequence_tooltip:0 "Only months with valid real budget, law, wages, staffing and goods conditions count toward review."
 ywc_kor.1001.narrow:0 "Narrow garrison and rotation scope"
 ywc_kor.1001.narrow.cost_tooltip:0 "No new one-time fee; paid costs are not refunded."
 ywc_kor.1001.narrow.consequence_tooltip:0 "Later reviews use a lower target; narrowing does not count as full staffing or supply."
 ywc_kor.1002.t:0 "The Quotas Sent by the Provinces"
 ywc_kor.1002.d:0 "Court supply requires a central ledger; provincial shares trade audit rights for lower central payments; capped legacy forces do not expand or promise a uniform establishment."
 ywc_kor.1002.court_roll:0 "Centralize muster and inspection"
 ywc_kor.1002.court_roll.cost_tooltip:0 "Keep the higher court-supply allotment."
 ywc_kor.1002.court_roll.consequence_tooltip:0 "Local audit discretion narrows; law and barrack supply still depend on real state."
 ywc_kor.1002.province_roll:0 "Require provincial returns and keep local audit"
 ywc_kor.1002.province_roll.cost_tooltip:0 "Continue the lower provincial allotment."
 ywc_kor.1002.province_roll.consequence_tooltip:0 "Retains local audit rights; missing returns or supply failures block establishment."
 ywc_kor.1002.legacy_roll:0 "Cap old quotas and authorize no new levies"
 ywc_kor.1002.legacy_roll.cost_tooltip:0 "Keep the lowest allotment; existing arrears remain due."
 ywc_kor.1002.legacy_roll.consequence_tooltip:0 "Reduces provincial expansion burdens and lowers later targets."
 ywc_kor.1003.t:0 "A Scholar's Note in the Budget"
 ywc_kor.1003.d:0 "The literati note that military costs compete with schools and relief. Public accounts add oversight; private review preserves discretion at a cost to trust; fewer rotations ease the budget but lower training goals."
 ywc_kor.1003.publish:0 "Publish monthly returns"
 ywc_kor.1003.publish.cost_tooltip:0 "No new fee; publication refunds nothing."
 ywc_kor.1003.publish.consequence_tooltip:0 "The literati gain audit records and the army office must explain allotments; publication does not staff barracks or remove shortages."
 ywc_kor.1003.private:0 "Keep the review private at court"
 ywc_kor.1003.private.cost_tooltip:0 "No added payment; record a private-review trust note without directly changing political support."
 ywc_kor.1003.private.consequence_tooltip:0 "The court keeps discretion and the literati do not receive the ledger; the trust note records this line only and applies no separate political modifier."
 ywc_kor.1003.reduce_rotations:0 "Reduce training and rotation targets"
 ywc_kor.1003.reduce_rotations.cost_tooltip:0 "No new cost; the narrowed route uses a real staffed, shortage-free border office for review."
 ywc_kor.1003.reduce_rotations.consequence_tooltip:0 "Professional-army law and qualifying barracks are no longer required; the office must still pass continuous review and the result remains capped legacy service."
 ywc_kor.1004.t:0 "The Interpreter at the Arsenal"
 ywc_kor.1004.d:0 "Local translation work can review contracts. Great Shun or Jinghai instructors require that actual country’s separate consent; hiring grants no technology, units or goods."
 ywc_kor.1004.fund_local:0 "Fund local interpreters and workshop rolls"
 ywc_kor.1004.fund_local.cost_tooltip:0 "Only this choice starts the contract; at most 12 installments totaling one captured week of income, with signed unpaid installments still due monthly after success or withdrawal."
 ywc_kor.1004.fund_local.consequence_tooltip:0 "Each installment is a real debit; underfunded months pause, success or withdrawal does not erase the balance, paid totals never reset, and charging stops at 12 installments."
 ywc_kor.1004.offer_shu:0 "Ask Great Shun to provide instructors"
 ywc_kor.1004.offer_shu.cost_tooltip:0 "Inquiry and signature charge nothing. Signing fixes a 12-installment liability equal to the opening captured week of income."
 ywc_kor.1004.offer_shu.consequence_tooltip:0 "A real consenting partner, staffed and supplied schools and barracks are required. Debt persists; training needs current payment within the fixed term."
 ywc_kor.1004.offer_jhg:0 "Ask Jinghai to provide instructors"
 ywc_kor.1004.offer_jhg.cost_tooltip:0 "Inquiry and signature charge nothing. Signing fixes a 12-installment liability equal to the opening captured week of income."
 ywc_kor.1004.offer_jhg.consequence_tooltip:0 "A real consenting partner, staffed and supplied schools and barracks are required. Debt persists; training needs current payment within the fixed term."
 ywc_kor.1004.narrow_orders:0 "Keep old workshops and narrow equipment goals"
 ywc_kor.1004.narrow_orders.cost_tooltip:0 "No one-time fee; accept a lower equipment target."
 ywc_kor.1004.narrow_orders.consequence_tooltip:0 "Assumes neither an importer nor an arms factory; real goods shortages still block supply review."
 ywc_kor.1005.t:0 "A New Posting for Old Service Households"
 ywc_kor.1005.d:0 "When military changes affect real service households, the court can fund a time-limited transition register and stipend or retain limited border rotations. If no households can be confirmed, audit discharge rolls rather than inventing job transfers."
 ywc_kor.1005.fund_transition:0 "Pay for transition rolls and a temporary stipend"
 ywc_kor.1005.fund_transition.cost_tooltip:0 "Optional transition support is capped at 12 installments totaling one week of income; signed unpaid installments remain due monthly after success or withdrawal."
 ywc_kor.1005.fund_transition.consequence_tooltip:0 "Paid totals survive recovery and renewed review; success or withdrawal does not erase the signed balance, and insufficient funds pause payment until funds recover."
 ywc_kor.1005.retain_border:0 "Keep some legacy border rotations"
 ywc_kor.1005.retain_border.cost_tooltip:0 "Avoid stipend costs while keeping a smaller monthly allotment."
 ywc_kor.1005.retain_border.consequence_tooltip:0 "Preserves service ties and narrows the target; if army law or barracks conditions fail, a staffed shortage-free border office can qualify for continuous review without changing laws, armies or territory."
 ywc_kor.1005.refuse_stipend:0 "Decline a new stipend obligation"
 ywc_kor.1005.refuse_stipend.cost_tooltip:0 "No added cost; existing obligations remain due."
 ywc_kor.1005.refuse_stipend.consequence_tooltip:0 "Discharged households receive no stipend from this line, but later renegotiation remains possible; actual discharge is untouched."
 ywc_kor.1006.t:0 "After the First Muster Audit"
 ywc_kor.1006.d:0 "Begin the nine-month renewal only after six continuous months of real readiness. Any failed month clears the timer immediately. Show a blocked prompt after 12 continuous months and offer exit at 36; regular army spending remains in the base game."
 ywc_kor.1006.begin_renewal:0 "Confirm six continuous months and start the renewal"
 ywc_kor.1006.begin_renewal.cost_tooltip:0 "No second audit fee; regular army spending stays in the base game."
 ywc_kor.1006.begin_renewal.consequence_tooltip:0 "Opens renewal only when the six-month timer completed and current conditions still pass; early law changes do not replace the period."
 ywc_kor.1006.narrow_or_wait:0 "Narrow the plan or wait for recovery"
 ywc_kor.1006.narrow_or_wait.cost_tooltip:0 "Paid installments are not refunded; failed months are neither charged nor counted."
 ywc_kor.1006.narrow_or_wait.consequence_tooltip:0 "Keep the current army and laws; after a failed month, restart six continuous months at the narrowed installment."
 ywc_kor.1006.withdraw:0 "Withdraw unpaid new commitments"
 ywc_kor.1006.withdraw.cost_tooltip:0 "Stop unpaid portions; retain paid costs and recorded stipends."
 ywc_kor.1006.withdraw.consequence_tooltip:0 "Closes as a setback without disbanding armies or changing laws; provincial finance and veteran follow-ups remain available."
 ywc_kor.1007.t:0 "Military Goods on the Busan Invoice"
 ywc_kor.1007.d:0 "During renewal, review actual quotes from port merchants or inland workshops. This event creates no stockpiles, factories or trade routes; domestic review continues if no foreign partner is available."
 ywc_kor.1007.fund_invoice_review:0 "Pay for invoice review and keep monthly supply"
 ywc_kor.1007.fund_invoice_review.cost_tooltip:0 "Only this paid quotation-review choice debits one captured week; it creates no military goods."
 ywc_kor.1007.fund_invoice_review.consequence_tooltip:0 "Records a paid quotation review without granting equipment; shortages still block certification."
 ywc_kor.1007.current_workshops:0 "Narrow procurement to current workshops"
 ywc_kor.1007.current_workshops.cost_tooltip:0 "No added one-time cost; lower the target."
 ywc_kor.1007.current_workshops.consequence_tooltip:0 "Market and buildings determine capacity; insufficient supply still requires narrowing or exit."
 ywc_kor.1007.quote_shu:0 "Request a Great Shun quotation for military goods"
 ywc_kor.1007.quote_shu.cost_tooltip:0 "Asking is free; no trade route is created and no military goods appear."
 ywc_kor.1007.quote_shu.consequence_tooltip:0 "After Great Shun answers in writing, KOR separately decides whether to sign fixed captured terms against actual deliveries."
 ywc_kor.1007.quote_jhg:0 "Request a Jinghai quotation for military goods"
 ywc_kor.1007.quote_jhg.cost_tooltip:0 "Asking is free; no trade route is created and no military goods appear."
 ywc_kor.1007.quote_jhg.consequence_tooltip:0 "After Jinghai answers in writing, KOR separately decides whether to sign fixed captured terms against actual deliveries."
 ywc_kor.1008.t:0 "The Year Without a War"
 ywc_kor.1008.d:0 "In peace, review training, rotations and procurement. During war, use the wartime ledger, prioritize supply and allow narrowing. War is not automatic failure; subject changes do not interrupt the domestic journal."
 ywc_kor.1008.peace_ledger:0 "Review training and rotations in the peacetime ledger"
 ywc_kor.1008.peace_ledger.cost_tooltip:0 "Creates no troops, training or free income."
 ywc_kor.1008.peace_ledger.consequence_tooltip:0 "Marks completion only after nine continuous months; peace itself is not a pass."
 ywc_kor.1008.wartime_ration:0 "Prioritize supply and pause nonessential rotations"
 ywc_kor.1008.wartime_ration.cost_tooltip:0 "No added monthly debit; real army costs remain in the base-game system."
 ywc_kor.1008.wartime_ration.consequence_tooltip:0 "Continue reading shortages and budget during war; renewal timing restarts after recovery."
 ywc_kor.1008.restore_review:0 "Narrow the commitment and restart continuous review"
 ywc_kor.1008.restore_review.cost_tooltip:0 "Past payments are not refunded; after narrowing, restart nine months at the lower actual installment."
 ywc_kor.1008.restore_review.consequence_tooltip:0 "Keep the army, laws and existing contracts; the timer restarts only while budget, wages, staffing and supply remain valid."
 ywc_kor.1008.recognize_default:0 "Acknowledge the unfunded plan and exit"
 ywc_kor.1008.recognize_default.cost_tooltip:0 "Stop unpaid plans while retaining paid costs and service obligations."
 ywc_kor.1008.recognize_default.consequence_tooltip:0 "Does not disband the army; capped legacy forces and local renegotiation remain available."
 ywc_kor.1009.t:0 "The State Ledger Beyond the Army Office"
 ywc_kor.1009.d:0 "Settlement reads current law, barrack employment, goods shortages, wages, budget, provincial reports and the nine-month continuous review. Court supply has the highest fixed cost; provincial supply exchanges returns for lower central spending; capped legacy forces keep a smaller border goal."
 ywc_kor.1009.establish_court:0 "Establish court supply"
 ywc_kor.1009.establish_court.cost_tooltip:0 "No completion bonus; recurring costs remain in treasury."
 ywc_kor.1009.establish_court.consequence_tooltip:0 "Does not enact law or add troops; confirms existing law, barracks and continued supply."
 ywc_kor.1009.establish_provincial:0 "Establish provincial shares"
 ywc_kor.1009.establish_provincial.cost_tooltip:0 "No completion bonus; local allotments and returns remain due."
 ywc_kor.1009.establish_provincial.consequence_tooltip:0 "Cannot establish if local returns or real supply eligibility fail."
 ywc_kor.1009.establish_limited:0 "Close with capped legacy forces and border service"
 ywc_kor.1009.establish_limited.cost_tooltip:0 "Keep the lowest monthly allotment; paid costs are not refunded."
 ywc_kor.1009.establish_limited.consequence_tooltip:0 "A country without an army can continue limited border service through a staffed, shortage-free office; no army law or territory changes."
 ywc_kor.1009.establish_narrowed_target:0 "Establish the narrowed target through a border office"
 ywc_kor.1009.establish_narrowed_target.cost_tooltip:0 "No completion bonus or free supplies; signed contract balances remain payable monthly."
 ywc_kor.1009.establish_narrowed_target.consequence_tooltip:0 "Requires only a staffed shortage-free border office; it does not require professional-army law or qualifying barracks and changes no army, law or territory."
 ywc_kor.1009.restart_renewal:0 "Narrow and restart nine continuous months"
 ywc_kor.1009.restart_renewal.cost_tooltip:0 "Do not repeat the quotation fee; restart review while retaining paid contract totals and obligations."
 ywc_kor.1009.restart_renewal.consequence_tooltip:0 "Restart review when current conditions fail or review is incomplete; narrowing reduces commitments without changing laws or armies."
 ywc_kor.1009.withdraw:0 "Withdraw unpaid commitments after failure"
 ywc_kor.1009.withdraw.cost_tooltip:0 "Stop unpaid portions while retaining paid costs and signed obligations."
 ywc_kor.1009.withdraw.consequence_tooltip:0 "Failure can continue into local finance, schools, workshops and veteran follow-ups without erasing the army."
 ywc_kor.1030.t:0 "The Instructor Offer Answer"
 ywc_kor.1030.d:0 "The invited court receives KOR’s fixed offer. Only the actual recipient may accept or refuse; a stale answer changes no account."
 ywc_kor.1030.accept:0 "Accept the fixed-term service"
 ywc_kor.1030.accept.cost_tooltip:0 "No payment at signature; KOR assumes a fixed twelve-installment liability."
 ywc_kor.1030.accept.consequence_tooltip:0 "The first real monthly muster starts twelve calendar months; each collected installment credits this actual country."
 ywc_kor.1030.refuse:0 "Refuse to provide instructors"
 ywc_kor.1030.refuse.cost_tooltip:0 "Neither treasury is charged."
 ywc_kor.1030.refuse.consequence_tooltip:0 "KOR receives a refusal and may choose a domestic route or retry."
 ywc_kor.1030.stale_dismiss:0 "Dismiss a stale answer"
 ywc_kor.1030.stale_dismiss.cost_tooltip:0 "No payment."
 ywc_kor.1030.stale_dismiss.consequence_tooltip:0 "The stale answer cannot rewrite a later request."
 ywc_kor.1031.t:0 "Local Continuation of Instructor Cooperation"
 ywc_kor.1031.d:0 "KOR handles replies, expiry and current service status locally. A signed balance survives domestic alternatives and military settlement."
 ywc_kor.1031.continue_status:0 "Acknowledge this status"
 ywc_kor.1031.continue_status.cost_tooltip:0 "This choice charges nothing."
 ywc_kor.1031.continue_status.consequence_tooltip:0 "Existing balance and deadline remain."
 ywc_kor.1031.fund_local:0 "Fund local interpreters"
 ywc_kor.1031.fund_local.cost_tooltip:0 "The original domestic twelve installments apply only after a successful local signature."
 ywc_kor.1031.fund_local.consequence_tooltip:0 "Foreign arrears remain; interpreter and veteran charges stay separate."
 ywc_kor.1031.narrow_orders:0 "Narrow equipment orders"
 ywc_kor.1031.narrow_orders.cost_tooltip:0 "No new fee."
 ywc_kor.1031.narrow_orders.consequence_tooltip:0 "Old contract debt and military progress remain."
 ywc_kor.1031.retry_shu:0 "Retry with Great Shun"
 ywc_kor.1031.retry_shu.cost_tooltip:0 "A new inquiry charges nothing; the previous balance must be zero and service ended."
 ywc_kor.1031.retry_shu.consequence_tooltip:0 "The retry has a new generation; old answers cannot sign it."
 ywc_kor.1031.retry_jhg:0 "Retry with Jinghai"
 ywc_kor.1031.retry_jhg.cost_tooltip:0 "A new inquiry charges nothing; the previous balance must be zero and service ended."
 ywc_kor.1031.retry_jhg.consequence_tooltip:0 "The retry has a new generation; old answers cannot sign it."
 ywc_kor.1031.stale_dismiss:0 "Dismiss a stale notice"
 ywc_kor.1031.stale_dismiss.cost_tooltip:0 "No payment."
 ywc_kor.1031.stale_dismiss.consequence_tooltip:0 "The stale notice leaves the current request, debt and queues intact."
 ywc_kor.1032.t:0 "Instructor Service Term Ends"
 ywc_kor.1032.d:0 "The fixed twelve-calendar-month service ends. Its training effect is removed while unpaid debt remains."
 ywc_kor.1033.t:0 "The Procurement Quote Answer"
 ywc_kor.1033.d:0 "The invited court receives KOR's fixed quotation. Only the actual recipient may accept or refuse; a stale answer changes no quotation."
 ywc_kor.1033.accept:0 "Issue the fixed quotation"
 ywc_kor.1033.accept.cost_tooltip:0 "Issuing a quotation collects nothing; earned invoices follow actual monthly deliveries."
 ywc_kor.1033.accept.consequence_tooltip:0 "The quotation fixes terms for this generation; KOR must still sign against real deliveries itself."
 ywc_kor.1033.refuse:0 "Refuse to quote"
 ywc_kor.1033.refuse.cost_tooltip:0 "Neither treasury is charged."
 ywc_kor.1033.refuse.consequence_tooltip:0 "KOR receives a refusal and may take a domestic route or ask another partner."
 ywc_kor.1033.stale_dismiss:0 "Dismiss a stale inquiry"
 ywc_kor.1033.stale_dismiss.cost_tooltip:0 "No payment."
 ywc_kor.1033.stale_dismiss.consequence_tooltip:0 "The stale inquiry cannot rewrite a later quotation."
 ywc_kor.1034.t:0 "Local Decision on Foreign Military Procurement"
 ywc_kor.1034.d:0 "KOR handles quotations, expiry, suspension and arrears locally. Earned invoices survive domestic alternatives; signing requires actual deliveries."
 ywc_kor.1034.accept_quote:0 "Sign the fixed captured terms"
 ywc_kor.1034.accept_quote.cost_tooltip:0 "Signature collects nothing; each of three monthly inspections invoices and pays one third of the captured total."
 ywc_kor.1034.accept_quote.consequence_tooltip:0 "Only the exact supply district and markets captured at signature count; a changed source needs a new quote."
 ywc_kor.1034.decline_quote:0 "Decline the foreign quotation"
 ywc_kor.1034.decline_quote.cost_tooltip:0 "This choice charges nothing."
 ywc_kor.1034.decline_quote.consequence_tooltip:0 "Unsigned work ends; earned invoices remain."
 ywc_kor.1034.wait_terms:0 "Keep the quotation and wait"
 ywc_kor.1034.wait_terms.cost_tooltip:0 "Waiting is free."
 ywc_kor.1034.wait_terms.consequence_tooltip:0 "The three-month quote lifetime is not refreshed by redisplay; it lapses on schedule."
 ywc_kor.1034.review_status:0 "Acknowledge this status"
 ywc_kor.1034.review_status.cost_tooltip:0 "This choice charges nothing."
 ywc_kor.1034.review_status.consequence_tooltip:0 "Existing arrears and the contract window remain."
 ywc_kor.1034.domestic_route:0 "Take the domestic supply route"
 ywc_kor.1034.domestic_route.cost_tooltip:0 "This choice charges nothing; the domestic routes keep their existing costs."
 ywc_kor.1034.domestic_route.consequence_tooltip:0 "Unsigned foreign work ends; signed contract debt remains payable."
 ywc_kor.1034.retry_shu:0 "Retry with Great Shun"
 ywc_kor.1034.retry_shu.cost_tooltip:0 "A new inquiry charges nothing; the previous balance must be settled and its window ended."
 ywc_kor.1034.retry_shu.consequence_tooltip:0 "The retry has a new generation; old answers and quotes cannot sign it."
 ywc_kor.1034.retry_jhg:0 "Retry with Jinghai"
 ywc_kor.1034.retry_jhg.cost_tooltip:0 "A new inquiry charges nothing; the previous balance must be settled and its window ended."
 ywc_kor.1034.retry_jhg.consequence_tooltip:0 "The retry has a new generation; old answers and quotes cannot sign it."
 ywc_kor.1034.stale_dismiss:0 "Dismiss a stale notice"
 ywc_kor.1034.stale_dismiss.cost_tooltip:0 "No payment."
 ywc_kor.1034.stale_dismiss.consequence_tooltip:0 "The stale notice leaves the current quotation, debt and queues intact."
 ywc_kor.1035.t:0 "Procurement Window Ends"
 ywc_kor.1035.d:0 "The fixed three-calendar-month inspection window ends and only its own term marker is cleared; earned debt and paid records are untouched."
 ywc_je_v03_kor_school_funding:0 "Academy Funding and Translation Authority"
 ywc_je_v03_kor_school_funding_reason:0 "The court, academies and official school debate who pays and who may certify translations. The filing fee is captured at entry; signed military translation contracts remain payable."
 ywc_je_v03_kor_school_appointments:0 "Real Posts in Offices and Universities"
 ywc_je_v03_kor_school_appointments_reason:0 "Appointments count only where an existing university or office has staffed posts and current education law and finances permit them. Shortages open retryable reduced targets."
 ywc_je_v03_kor_school_review:0 "Six Months of Appointment and Accounts Review"
 ywc_je_v03_kor_school_review_reason:0 "Check the actual employer, supplies and fiscal safety for six continuous months. A bad month resets the clock; after 12 blocked months repair is offered and after 36 withdrawal is allowed."
 ywc_kor.1010.t:0 "The Translation Students at the Academy Gate"
 ywc_kor.1010.d:0 "Translation students wait outside the old academy. Teachers will check classical texts, while offices need interpreters who can do real administrative work. The court must assign funding and authority within existing posts and laws."
 ywc_kor.1010.co_manage:0 "Co-managed academy: joint review"
 ywc_kor.1010.co_manage.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52; Costs the base filing fee; requires an existing university or staffed office."
 ywc_kor.1010.co_manage.consequence_tooltip:0 "Academy and office share review; later requires real university/office appointments."
 ywc_kor.1010.court_office:0 "Court school: offices coordinate"
 ywc_kor.1010.court_office.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52; Costs 1.5 times the base fee; requires an existing office."
 ywc_kor.1010.court_office.consequence_tooltip:0 "Offices hold review authority and a higher budget obligation; later requires office staffing and an education law."
 ywc_kor.1010.limited_lessons:0 "Capped translation classes: one text, one course"
 ywc_kor.1010.limited_lessons.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52; Costs the base fee; only a staffed office is required."
 ywc_kor.1010.limited_lessons.consequence_tooltip:0 "Records a narrow translation course and lower appointment target, not universal schooling or credentials."
 ywc_kor.1010.defer:0 "Defer until funds or posts recover"
 ywc_kor.1010.defer.cost_tooltip:0 "No fee."
 ywc_kor.1010.defer.consequence_tooltip:0 "Registration stays open and can be retried when conditions recover."
 ywc_kor.1010.withdraw:0 "Withdraw the registration"
 ywc_kor.1010.withdraw.cost_tooltip:0 "Paid fees and old military contracts remain."
 ywc_kor.1010.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_kor.1011.t:0 "The Teacher's Note in the Margin"
 ywc_kor.1011.d:0 "A teacher notes the unpaid translation invoice beside the budget. If the earlier military account ended in setback or withdrawal, the court must reserve more for filing; any finite old contract continues to be collected monthly."
 ywc_kor.1011.record_old_invoice:0 "Record the old account and current reserve"
 ywc_kor.1011.record_old_invoice.cost_tooltip:0 "No double charge for paid invoices; setback on the old arc adds half the base filing fee."
 ywc_kor.1011.record_old_invoice.consequence_tooltip:0 "Carries the M1 result into the new filing threshold; old signed obligations continue."
 ywc_kor.1011.retry_account:0 "Funds are short; retry this reserve later"
 ywc_kor.1011.retry_account.cost_tooltip:0 "Payment guard failed; no charge."
 ywc_kor.1011.retry_account.consequence_tooltip:0 "The account does not advance and can be retried after finances recover."
 ywc_kor.1011.withdraw:0 "Return the file to the archive"
 ywc_kor.1011.withdraw.cost_tooltip:0 "Paid fees and old contracts remain."
 ywc_kor.1011.withdraw.consequence_tooltip:0 "Records a setback and releases the slot."
 ywc_kor.1012.t:0 "Who Will Check the Translation"
 ywc_kor.1012.d:0 "Academy teachers, the Devout and literate officials dispute editorial authority. Co-management needs an office and an available university, the court route assigns office oversight, and capped lessons rely on one staffed clerk."
 ywc_kor.1012.share_review:0 "Set review authority by the chosen route"
 ywc_kor.1012.share_review.cost_tooltip:0 "No new fee."
 ywc_kor.1012.share_review.consequence_tooltip:0 "A later appointment check enforces this authority; the arc moves to real posts."
 ywc_kor.1012.narrow_to_clerk:0 "Narrow to one office translator"
 ywc_kor.1012.narrow_to_clerk.cost_tooltip:0 "Filing fee is retained; no new charge."
 ywc_kor.1012.narrow_to_clerk.consequence_tooltip:0 "Lowers the staffing target and cannot be upgraded into a full school reform at the end."
 ywc_kor.1012.defer:0 "Defer the review decision"
 ywc_kor.1012.defer.cost_tooltip:0 "No new fee."
 ywc_kor.1012.defer.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1012.withdraw:0 "Withdraw the academy registration"
 ywc_kor.1012.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1012.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1013.t:0 "An Office Needs a Clerk, Not a Degree"
 ywc_kor.1013.d:0 "The charter grants no degree. It can only assign translation duties to existing university staff or office clerks, under current schooling law and safe finances."
 ywc_kor.1013.university_post:0 "Register existing university posts"
 ywc_kor.1013.university_post.cost_tooltip:0 "No new fee; an existing university must be staffed."
 ywc_kor.1013.university_post.consequence_tooltip:0 "University review favors literate officials and requires university posts to remain staffed."
 ywc_kor.1013.office_post:0 "Register existing office translation posts"
 ywc_kor.1013.office_post.cost_tooltip:0 "No new fee; an existing office must be staffed."
 ywc_kor.1013.office_post.consequence_tooltip:0 "Office coordination is steadier but has a higher budget and staffing requirement."
 ywc_kor.1013.defer:0 "Wait for a suitable post"
 ywc_kor.1013.defer.cost_tooltip:0 "No new fee."
 ywc_kor.1013.defer.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1013.withdraw:0 "Withdraw the appointment docket"
 ywc_kor.1013.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1013.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1014.t:0 "The Old Translation Contract in the Military Ledger"
 ywc_kor.1014.d:0 "Finite old interpreter contracts survive the new academy. If an invoice remains unpaid, the new docket may register staffed proofreading, but final settlement must wait until the old obligation is paid under its original terms."
 ywc_kor.1014.keep_docket:0 "Keep the new docket and pay the old contract as due"
 ywc_kor.1014.keep_docket.cost_tooltip:0 "Does not repay the old contract; this arc checks its existing installment progress."
 ywc_kor.1014.keep_docket.consequence_tooltip:0 "Two later gates read the contract state; unpaid installments block full settlement."
 ywc_kor.1014.narrow_to_clerk:0 "Narrow to one office proofreader"
 ywc_kor.1014.narrow_to_clerk.cost_tooltip:0 "The old contract continues its own installments; no new monthly charge."
 ywc_kor.1014.narrow_to_clerk.consequence_tooltip:0 "Sets only a capped translation target and cannot be upgraded to full appointments."
 ywc_kor.1014.defer:0 "Review after the next old-contract installment"
 ywc_kor.1014.defer.cost_tooltip:0 "No new fee."
 ywc_kor.1014.defer.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1014.withdraw:0 "Withdraw while retaining the old debt"
 ywc_kor.1014.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1014.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1015.t:0 "Which Class Stops When Paper and Staff Run Short"
 ywc_kor.1015.d:0 "When paper, bureaucracy or university posts fall short, continuous observation pauses. The court may wait for real staffing to recover, narrow to one clerk, or withdraw while retaining old contracts."
 ywc_kor.1015.start_review:0 "Conditions hold; start six-month review"
 ywc_kor.1015.start_review.cost_tooltip:0 "No new fee; old contracts continue to be collected."
 ywc_kor.1015.start_review.consequence_tooltip:0 "The third JE checks the full route monthly; a failed month resets it."
 ywc_kor.1015.narrow:0 "Use capped translation and one office clerk"
 ywc_kor.1015.narrow.cost_tooltip:0 "No refund or new monthly charge."
 ywc_kor.1015.narrow.consequence_tooltip:0 "Chooses a lower compromise threshold and can only settle as limited."
 ywc_kor.1015.retry:0 "Keep the docket and retry after recovery"
 ywc_kor.1015.retry.cost_tooltip:0 "No new fee."
 ywc_kor.1015.retry.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1015.withdraw:0 "Withdraw the appointment plan"
 ywc_kor.1015.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1015.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1016.t:0 "Were Graduates Actually Appointed"
 ywc_kor.1016.d:0 "After continuous review, offices must show real posts and academies must be able to certify translations. Full establishment requires the staffed route and settled M1 contracts; capped lessons can only compromise."
 ywc_kor.1016.establish:0 "Establish through real university and office posts"
 ywc_kor.1016.establish.cost_tooltip:0 "No new fee."
 ywc_kor.1016.establish.consequence_tooltip:0 "Establishes only after the full target passes continuously; grants no law or degree."
 ywc_kor.1016.compromise:0 "Compromise with capped lessons and one clerk"
 ywc_kor.1016.compromise.cost_tooltip:0 "No new fee."
 ywc_kor.1016.compromise.consequence_tooltip:0 "Settles only the lower target and never mislabels it as full appointments."
 ywc_kor.1016.wait_for_observation:0 "Keep the continuous review running"
 ywc_kor.1016.wait_for_observation.cost_tooltip:0 "No new fee."
 ywc_kor.1016.wait_for_observation.consequence_tooltip:0 "If qualification remains valid, the settlement options return after the observation period."
 ywc_kor.1016.defer:0 "Acknowledge the 12-month block and defer"
 ywc_kor.1016.defer.cost_tooltip:0 "No new fee."
 ywc_kor.1016.defer.consequence_tooltip:0 "Deferral does not settle the review; the 36-month notice remains deliverable and withdrawal is always available."
 ywc_kor.1016.repair:0 "A condition failed; reset and observe again"
 ywc_kor.1016.repair.cost_tooltip:0 "No new fee."
 ywc_kor.1016.repair.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1016.withdraw:0 "Withdraw the academy and appointment charter"
 ywc_kor.1016.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1016.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1017.t:0 "New Learning Need Not Burn the Old Books"
 ywc_kor.1017.d:0 "The final check re-evaluates state ownership, war, finances and participating groups. If conditions change after the window opens, retry, narrow or withdraw under the current facts; existing debts remain due."
 ywc_kor.1017.settle_established:0 "Conditions still hold; settle co-management or court school"
 ywc_kor.1017.settle_established.cost_tooltip:0 "No further charge."
 ywc_kor.1017.settle_established.consequence_tooltip:0 "The selected schooling arrangement has been verified; settlement makes no additional change to interest group support."
 ywc_kor.1017.settle_compromise:0 "Conditions still hold; settle capped translation"
 ywc_kor.1017.settle_compromise.cost_tooltip:0 "No further charge."
 ywc_kor.1017.settle_compromise.consequence_tooltip:0 "The selected reduced schooling arrangement has been verified; settlement makes no additional change to interest group support and does not claim full education results."
 ywc_kor.1017.retry:0 "Conditions changed; review posts and accounts again"
 ywc_kor.1017.retry.cost_tooltip:0 "No new fee."
 ywc_kor.1017.retry.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1017.withdraw:0 "Keep signed old contracts and end the new arc"
 ywc_kor.1017.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1017.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_je_v03_kor_controlled_ports:0 "Customs Exceptions and Shore Ledgers"
 ywc_je_v03_kor_controlled_ports_reason:0 "A designated port, general trade, or a restricted shore office must be audited against real trade laws, port jobs and administrative supply. Settlement requires six continuous safe months."
 ywc_kor.1018.t:0 "Two Tax Bills for One Port"
 ywc_kor.1018.d:0 "Merchants are taxed by ship while shore clerks register the cargo; one voyage has two bills. Choose only a target supported by current law and existing staff; the arc creates no port or trade route."
 ywc_kor.1018.licensed_port:0 "Keep a ledger for one port under current trade law"
 ywc_kor.1018.licensed_port.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52; Base filing fee; checks an existing port only."
 ywc_kor.1018.licensed_port.consequence_tooltip:0 "Requires a trade-permitting law and a staffed real port."
 ywc_kor.1018.general_customs:0 "General trade with a unified customs ledger"
 ywc_kor.1018.general_customs.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52; Base fee plus half; requires staffed port and administration."
 ywc_kor.1018.general_customs.consequence_tooltip:0 "Wider target with higher administrative demands."
 ywc_kor.1018.shore_ledger:0 "Keep restrictions and audit the shore office"
 ywc_kor.1018.shore_ledger.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52; Lower target at the base fee; may proceed without a port if an office is staffed."
 ywc_kor.1018.shore_ledger.consequence_tooltip:0 "Does not claim an open port or general trade; audits shore administration only."
 ywc_kor.1018.defer:0 "Defer until the budget or posts recover"
 ywc_kor.1018.defer.cost_tooltip:0 "No new fee."
 ywc_kor.1018.defer.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1018.withdraw:0 "Withdraw the customs registration"
 ywc_kor.1018.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1018.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1019.t:0 "Can an Exception Be Written into Port Rules"
 ywc_kor.1019.d:0 "A port rule cannot override current trade law. A settled military-account route reduces central filing costs; a setback or unpaid old translation contract raises the reserve. Isolationism still forbids international trade."
 ywc_kor.1019.record_exception:0 "Record an exception under current law and accounts"
 ywc_kor.1019.record_exception.cost_tooltip:0 "Previously paid fees are not charged twice; any reserve required by a prior setback must be paid."
 ywc_kor.1019.record_exception.consequence_tooltip:0 "Two later nodes read the old military and school outcomes."
 ywc_kor.1019.narrow:0 "Narrow to shore accounts if trade law forbids trade"
 ywc_kor.1019.narrow.cost_tooltip:0 "The previously paid filing fee funds the reduced shore target; no refund, new fee or loss of old accounts."
 ywc_kor.1019.narrow.consequence_tooltip:0 "Keeps existing restrictions; later checks only office ledgers."
 ywc_kor.1019.defer:0 "Wait for law or staffing to change"
 ywc_kor.1019.defer.cost_tooltip:0 "No new fee."
 ywc_kor.1019.defer.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1019.withdraw:0 "Withdraw the port-rule exception"
 ywc_kor.1019.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1019.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1020.t:0 "Sea Merchants and the Shore Brokers"
 ywc_kor.1020.d:0 "Sea merchants want each voyage audited; shore brokers want cargo and checkpoint accounts. A co-managed academy route must retain literate review capacity, while capped translations accept a one-clerk reduced ledger."
 ywc_kor.1020.assign_auditors:0 "Assign real auditors by the school arrangement"
 ywc_kor.1020.assign_auditors.cost_tooltip:0 "No added fee."
 ywc_kor.1020.assign_auditors.consequence_tooltip:0 "The coastal office checks the same organization choice again later."
 ywc_kor.1020.shore_only:0 "Port staff are unavailable; use shore accounts"
 ywc_kor.1020.shore_only.cost_tooltip:0 "No refund or new fee; prior filing funds shore review and all outstanding accounts remain due."
 ywc_kor.1020.shore_only.consequence_tooltip:0 "Explicitly narrows to domestic shore accounts without claiming an open port."
 ywc_kor.1020.defer:0 "Wait for auditors to take their posts"
 ywc_kor.1020.defer.cost_tooltip:0 "No new fee."
 ywc_kor.1020.defer.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1020.withdraw:0 "End the exception draft"
 ywc_kor.1020.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1020.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1021.t:0 "The Coastal Office Requests the Ledger"
 ywc_kor.1021.d:0 "The coastal office checks both port staff and the budget. Full customs review cannot settle while old military invoices or school appointments remain unresolved; the narrow shore target remains available."
 ywc_kor.1021.verify_full:0 "Old contracts are paid; retain the full ledger target"
 ywc_kor.1021.verify_full.cost_tooltip:0 "No added fee; unpaid old obligations fail the guard."
 ywc_kor.1021.verify_full.consequence_tooltip:0 "Both real port capacity and the school arrangement must remain available."
 ywc_kor.1021.shore_only:0 "Narrow to shore review if invoices or port staff fall short"
 ywc_kor.1021.shore_only.cost_tooltip:0 "No new fee; prior payment funds the shore target and old military accounts stay on schedule."
 ywc_kor.1021.shore_only.consequence_tooltip:0 "Registers shore ledgers only and retains restrictions."
 ywc_kor.1021.defer:0 "Keep the books open until old invoices are paid"
 ywc_kor.1021.defer.cost_tooltip:0 "No new fee."
 ywc_kor.1021.defer.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1021.withdraw:0 "Withdraw customs review"
 ywc_kor.1021.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1021.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1022.t:0 "Settle the Arrears Before Revoking the Exception"
 ywc_kor.1022.d:0 "Real staffing or budget shortfalls reset continuous review. After 12 blocked months, repair or narrow; after 36 months, end the new registration without erasing existing coastal or interpreter contracts."
 ywc_kor.1022.repair:0 "Conditions recovered; restart six-month review"
 ywc_kor.1022.repair.cost_tooltip:0 "No refund and no new fee."
 ywc_kor.1022.repair.consequence_tooltip:0 "Review starts at zero; a reduced route can only compromise."
 ywc_kor.1022.narrow:0 "Narrow to shore accounts under existing restrictions"
 ywc_kor.1022.narrow.cost_tooltip:0 "No new fee; the previously paid port fee funds the reduced shore review, with no refund."
 ywc_kor.1022.narrow.consequence_tooltip:0 "Record prior accounts and paid contracts, then restart six months for the shore target without claiming general trade."
 ywc_kor.1022.defer:0 "Continue waiting at the 12-month blockage point"
 ywc_kor.1022.defer.cost_tooltip:0 "No new fee."
 ywc_kor.1022.defer.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1022.record_prior_contracts:0 "Reconsider: record prior contracts and continue to auditor assignment"
 ywc_kor.1022.record_prior_contracts.cost_tooltip:0 "No new fee; retain prior payments and all outstanding old accounts."
 ywc_kor.1022.record_prior_contracts.consequence_tooltip:0 "At the 36-month review, record old accounts and return to auditor assignment without skipping contracts or adding a fee."
 ywc_kor.1022.withdraw:0 "Withdraw from the port review"
 ywc_kor.1022.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1022.withdraw.consequence_tooltip:0 "Available at any time; paid fees are retained, a setback is recorded and the active slot is released."
 ywc_kor.1023.t:0 "Which Rule Governs the Next Ship"
 ywc_kor.1023.d:0 "After six continuous months, recheck ownership, war, port staff, law and finances. Full customs settles only if current law and a real port still support it; a shore route records domestic accounts only."
 ywc_kor.1023.settle_full:0 "Settle under the existing port and current trade law"
 ywc_kor.1023.settle_full.cost_tooltip:0 "No new fee."
 ywc_kor.1023.settle_full.consequence_tooltip:0 "Creates no trade route and changes no sovereignty."
 ywc_kor.1023.settle_shore:0 "Settle only the shore-office ledger"
 ywc_kor.1023.settle_shore.cost_tooltip:0 "No new fee."
 ywc_kor.1023.settle_shore.consequence_tooltip:0 "The lower target never claims an open port or general trade."
 ywc_kor.1023.wait_for_observation:0 "Keep the continuous review running"
 ywc_kor.1023.wait_for_observation.cost_tooltip:0 "No new fee."
 ywc_kor.1023.wait_for_observation.consequence_tooltip:0 "Keeps the current observation running; qualification must remain valid until the review completes."
 ywc_kor.1023.repair:0 "Conditions changed; observe again"
 ywc_kor.1023.repair.cost_tooltip:0 "No new fee."
 ywc_kor.1023.repair.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_kor.1023.withdraw:0 "End the new registration and keep old contracts"
 ywc_kor.1023.withdraw.cost_tooltip:0 "No new fee."
 ywc_kor.1023.withdraw.consequence_tooltip:0 "Retry is available; withdrawal keeps paid fees and records a setback."
 ywc_je_v03_kor_provincial_revenue_settlement:0 "Whose Ledger Records the Retained Share"
 ywc_je_v03_kor_provincial_revenue_settlement_reason:0 "In one currently owned Joseon pilot state, agree to written shares, central collection or project grants, or explicitly choose the conservative finite target. Each mode carries different current tax-law, in-government group, staffed-post and turmoil conditions. This step only records the policy and pilot; a charter and a review each require a real later payment."
 ywc_je_v03_kor_provincial_revenue_review:0 "Arrears Absent from Six Monthly Ledgers"
 ywc_je_v03_kor_provincial_revenue_review_reason:0 "Check the same policy, law, groups, staffed posts and turmoil in the pilot for six consecutive months; any failure interrupts the run and needs an explicit restart from zero. Submitting the review does not erase the maturity proof. An interruption neither requires the arc to still hold a state nor silently swaps the pilot."
 ywc_kor.1100.t:0 "Whose Ledger Records the Retained Share"
 ywc_kor.1100.d:0 "The court wants new revenue for schools and garrisons, while the provinces want their retained share fixed first. In one pilot state the court must choose written shares, central collection or project grants, or explicitly aim only at a conservative finite target. No local tax-power law is invented and no tax law passes by itself."
 ywc_kor.1100.written_shares:0 "Written shares: the retained portion enters a charter"
 ywc_kor.1100.written_shares.cost_tooltip:0 "No charge now. The charter and review fees are charged later from one opening week of gross income, minimum100."
 ywc_kor.1100.written_shares.consequence_tooltip:0 "Select one currently owned pilot state and written shares, then charter it and verify current law, groups and posts."
 ywc_kor.1100.central_collection:0 "Central collection: the Court of Revenue collects"
 ywc_kor.1100.central_collection.cost_tooltip:0 "No charge now. Central collection needs real staffed offices and barracks; its charter costs two weekly-income bases."
 ywc_kor.1100.central_collection.consequence_tooltip:0 "Select the pilot and central collection; later needs staffed officials and barracks and the armed forces in government."
 ywc_kor.1100.project_grants:0 "Project grants: release funds by project only"
 ywc_kor.1100.project_grants.cost_tooltip:0 "No charge now. Project grants are a complete independent strategy, not the finite target, and need real farm employment and landowners or the devout."
 ywc_kor.1100.project_grants.consequence_tooltip:0 "Select the pilot and project grants; later needs farm employment and the relevant group, and promises no local tax power."
 ywc_kor.1100.finite_target:0 "Conservative finite: verify existing posts and appeals only"
 ywc_kor.1100.finite_target.cost_tooltip:0 "No charge now; both fees cost half a weekly-income base. No school, port, barracks, law change or foreign cooperation is required."
 ywc_kor.1100.finite_target.consequence_tooltip:0 "Explicitly choose the finite target; later verifies only the pilot's staffed officials, legitimacy and turmoil, still with real posts and two fees."
 ywc_kor.1100.wait_pilot:0 "Wait for current conditions"
 ywc_kor.1100.wait_pilot.cost_tooltip:0 "No charge; existing obligations remain."
 ywc_kor.1100.wait_pilot.consequence_tooltip:0 "Keep the question open for a later monthly chance; paid fees remain."
 ywc_kor.1100.withdraw:0 "Withdraw this retained-share mandate"
 ywc_kor.1100.withdraw.cost_tooltip:0 "No new charge or refund; old military, school or port contracts remain."
 ywc_kor.1100.withdraw.consequence_tooltip:0 "End this mandate and idempotently release this arc's slot once."
 ywc_kor.1101.t:0 "One Tax Receipt, Two Copies"
 ywc_kor.1101.d:0 "Chartering pays a real office account. Written shares cost one weekly-income base, central collection two, and project grants or the finite target half. A genuinely settled old military provincial-report contract halves the written-share charter. A fee that is not actually debited is never recorded as paid."
 ywc_kor.1101.pay_charter:0 "Pay the charter fee now due"
 ywc_kor.1101.pay_charter.cost_tooltip:0 "Written shares cost one base, central collection two, project grants or the finite target half. An old provincial-report contract halves the written-share fee."
 ywc_kor.1101.pay_charter.consequence_tooltip:0 "Continue only after a real debit, recording its positive actual amount; paid fees are never refunded or recharged and earned discounts are not collected later."
 ywc_kor.1101.wait_cash:0 "Wait for cash or conditions"
 ywc_kor.1101.wait_cash.cost_tooltip:0 "No charge; existing obligations remain."
 ywc_kor.1101.wait_cash.consequence_tooltip:0 "Keep the question open for a later monthly chance; paid fees remain."
 ywc_kor.1101.withdraw:0 "Withdraw this retained-share mandate"
 ywc_kor.1101.withdraw.cost_tooltip:0 "No new charge or refund; old contracts remain."
 ywc_kor.1101.withdraw.consequence_tooltip:0 "End this mandate and idempotently release this arc's slot once."
 ywc_kor.1102.t:0 "Claimants from School, Barracks and Fields"
 ywc_kor.1102.d:0 "By the chosen policy, decide who audits and who is liable: written shares need staffed schools and offices, central collection needs staffed barracks, project grants need farm employment. An old provincial-report contract lets this pilot reuse local audit at a half office threshold that still requires current staffed posts; a new audit without that contract needs full staffed posts."
 ywc_kor.1102.settle_reviewer:0 "Register the reviewer and liability by current policy"
 ywc_kor.1102.settle_reviewer.cost_tooltip:0 "No new fee. Old school or port contracts only change which reviewer and liability source is used; they grant no funds and assume no eligibility."
 ywc_kor.1102.settle_reviewer.consequence_tooltip:0 "Record the actual reviewer and source; later 1105/1106 reread the same contract and current posts."
 ywc_kor.1102.narrow_finite:0 "Narrow to the explicit finite target and verify"
 ywc_kor.1102.narrow_finite.cost_tooltip:0 "No new fee; the paid charter remains and is not reset."
 ywc_kor.1102.narrow_finite.consequence_tooltip:0 "Explicitly move to the finite target; no automatic tax-law change or silent pilot swap."
 ywc_kor.1102.wait_posts:0 "Wait for posts or supply to recover"
 ywc_kor.1102.wait_posts.cost_tooltip:0 "No charge; existing obligations remain."
 ywc_kor.1102.wait_posts.consequence_tooltip:0 "Keep the question open for a later monthly chance; paid fees remain."
 ywc_kor.1102.withdraw:0 "Withdraw this retained-share mandate"
 ywc_kor.1102.withdraw.cost_tooltip:0 "No new charge or refund; old contracts remain."
 ywc_kor.1102.withdraw.consequence_tooltip:0 "End this mandate and idempotently release this arc's slot once."
 ywc_kor.1103.t:0 "Who Signs Before the Seal"
 ywc_kor.1103.d:0 "Before sealing, recheck current responsibility, paid flags and the pilot, policy and target snapshot. If an old school or port reviewer no longer matches current posts, sign with a fresh audit instead. Signing truly hands off to the second journal and begins the six-month run."
 ywc_kor.1103.sign:0 "Sign and bind the old contract into the liability terms"
 ywc_kor.1103.sign.cost_tooltip:0 "No new fee; handoff only advances the journal and observation and does not recharge the paid charter."
 ywc_kor.1103.sign.consequence_tooltip:0 "Record policy, target and pilot snapshot at signing and truly enter the six-month run."
 ywc_kor.1103.reselect_reviewer:0 "Reselect the reviewer: return to 1102 and register again"
 ywc_kor.1103.reselect_reviewer.cost_tooltip:0 "No new fee; paid bills are untouched, with no refund or recharge."
