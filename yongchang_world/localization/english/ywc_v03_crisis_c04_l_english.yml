l_english:
 ywc_je_v03_c04_verifiable_ship_license:0 "A Verifiable Ship's License"
 ywc_je_v03_c04_verifiable_ship_license_reason:0 "One ship on the South Seas route sails under three names: registry, manifest and berth each tell a different story. Verify the actual nationality, cargo and port identity item by item, then let the protected ports and the island parties answer for themselves; even a failed talk keeps the status quo and the way out."
 ywc_je_v03_c04_escort_cost_bearer:0 "Who Bears the Escort Cost"
 ywc_je_v03_c04_escort_cost_bearer_reason:0 "The escort ledger lies open: the admiralty wants publicly funded patrols, the merchant houses want per-segment shares, and the small ports can only inspect the ships they can afford. The account is settled against the current fleets, ports and treasuries; a detained ore ship or a changed flag books each fulfillment conflict on its own side, never in arms."
 ywc_je_v03_c04_port_rules_reach_islands:0 "After Port Rules Reach the Small Islands"
 ywc_je_v03_c04_port_rules_reach_islands_reason:0 "Port rules and the route convention land on the small islands' wharves and manifests: how far the escort reaches, who verifies the ship's license, whether local justice stays, each is audited clause by clause in review and settlement. Deliveries are registered and credited, shortfalls recorded as failures, and signatories with different endings keep their own open questions."
 ywc_crisis.1300.t:0 "One Ship, Three Names"
 ywc_crisis.1300.d:0 "In the wharf files one ship carries three names: the registry, the manifest and the berth tax each insist on their own. The proposing country verifies the actual nationality, cargo and port identity item by item, separating lapsed names from standing obligations; island flags are recorded as they are, no longer written down as necessary dependents."
 ywc_crisis.1300.verify_registers:0 "Verify registry, manifest and berth identity item by item"
 ywc_crisis.1300.verify_registers.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1300.verify_registers.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1300.record_flags:0 "Record island flags as they are, without dependent listing"
 ywc_crisis.1300.record_flags.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1300.record_flags.consequence_tooltip:0 "Island parties gain 2 relations and are no longer listed as dependents."
 ywc_crisis.1300.wait:0 "Wait and verify again"
 ywc_crisis.1300.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1300.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1301.t:0 "The Premium Reaches the Wharf"
 ywc_crisis.1301.d:0 "Lost-voyage manifests and unpaid premiums pile up at the wharf: the port office settles losses, fees and the real escort capacity under its own country's rules, without assuming the navy is always available. Open the escort account and let each side answer, keep the local usage and collect the premium, or find that no valid party remains and there is nothing to negotiate."
 ywc_crisis.1301.open_escort_account:0 "Open the escort account and let each side answer"
 ywc_crisis.1301.open_escort_account.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1301.open_escort_account.consequence_tooltip:0 "The escort account goes out with segment and license clauses; each side answers separately."
 ywc_crisis.1301.local_fees_only:0 "Keep each port's own usage and collect the premium locally"
 ywc_crisis.1301.local_fees_only.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1301.local_fees_only.consequence_tooltip:0 "The line closes as status quo and the capacity slot is released at once."
 ywc_crisis.1301.no_counterparty:0 "No valid party remains; there is nothing to negotiate"
 ywc_crisis.1301.no_counterparty.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1301.no_counterparty.consequence_tooltip:0 "The case closes as no-talks and the capacity slot is released at once."
 ywc_crisis.1301.wait:0 "Wait and recheck the account"
 ywc_crisis.1301.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1301.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1302.t:0 "The Protected Parties' Counter"
 ywc_crisis.1302.d:0 "Each protected port answers for itself: pay per segment, recognize ship's licenses only, or stay out of the arrangement altogether. Whether to accept is each port's own call and the proposer cannot sign in its place; those who stay out first enter the review window, and the standing relations remain what they are."
 ywc_crisis.1302.pay_per_segment:0 "Pay per segment (300) and join the escort account"
 ywc_crisis.1302.pay_per_segment.cost_tooltip:0 "The holder's treasury pays 300."
 ywc_crisis.1302.pay_per_segment.consequence_tooltip:0 "The segment fee is booked; the escort round and settlement follow."
 ywc_crisis.1302.license_only:0 "Recognize ship's licenses only, without the escort fee"
 ywc_crisis.1302.license_only.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1302.license_only.consequence_tooltip:0 "Only the licenses are recognized and no escort terms are registered; review and settlement are awaited."
 ywc_crisis.1302.refuse:0 "Stay out of the arrangement and keep the old usage"
 ywc_crisis.1302.refuse.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1302.refuse.consequence_tooltip:0 "The review window opens first; the terms can be changed or left there."
 ywc_crisis.1302.wait:0 "Wait before responding"
 ywc_crisis.1302.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1302.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1303.t:0 "Berth Terms of the Islands"
 ywc_crisis.1303.d:0 "Each island party sets its own berth terms: allow the escort squadrons to resupply, limit the ships and days they may stay, or leave this round. What the other side gains is berth and water, never title to land; those who leave close as withdrawn."
 ywc_crisis.1303.allow_resupply:0 "Allow the escort squadrons to resupply and berth"
 ywc_crisis.1303.allow_resupply.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1303.allow_resupply.consequence_tooltip:0 "Berths and water open; no title to land passes; the port's own inspection setup follows."
 ywc_crisis.1303.restrict_stay:0 "Limit the ships and days they may stay"
 ywc_crisis.1303.restrict_stay.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1303.restrict_stay.consequence_tooltip:0 "The stay limits are written into the terms; the port-access dispute carries into the follow-up."
 ywc_crisis.1303.withdraw_islands:0 "Leave this round and keep the harbor usage"
 ywc_crisis.1303.withdraw_islands.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1303.withdraw_islands.consequence_tooltip:0 "The line closes as withdrawn and the harbor governance is untouched by this arrangement."
 ywc_crisis.1303.wait:0 "Wait before responding"
 ywc_crisis.1303.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1303.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1304.t:0 "The Admiralty's and the Merchant Houses' Ledger"
 ywc_crisis.1304.d:0 "The escort ledger lies open: the admiralty wants publicly funded patrols, the merchant houses want per-segment shares, and the account is settled against the current fleets, ports and treasuries only. A public sortie, merchant shares or a scaled-back coverage each enter the register; the risk of a detained ore ship follows the ledger."
 ywc_crisis.1304.public_patrol:0 "Fund the patrol publicly (600) with the full account"
 ywc_crisis.1304.public_patrol.cost_tooltip:0 "The holder's treasury pays 600."
 ywc_crisis.1304.public_patrol.consequence_tooltip:0 "The public patrol is registered; the seizure conflict mounts on whoever can hold it."
 ywc_crisis.1304.merchant_shares:0 "Let the merchant houses share per segment; the public book keeps shares only"
 ywc_crisis.1304.merchant_shares.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1304.merchant_shares.consequence_tooltip:0 "Merchant shares are registered and the public purse stays closed."
 ywc_crisis.1304.scale_back_patrol:0 "Scale the coverage back to the standing segments"
 ywc_crisis.1304.scale_back_patrol.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1304.scale_back_patrol.consequence_tooltip:0 "The reduced coverage enters the terms; only the limited agreement can be confirmed at settlement."
 ywc_crisis.1304.wait:0 "Wait and recheck the ledger"
 ywc_crisis.1304.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1304.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1305.t:0 "The Small Port's Inspector"
 ywc_crisis.1305.d:0 "The small port has one inspector and one sampan: inspect only the ships it can actually inspect, shrink the promise to what it can afford, or keep local judgment. An overpromise is scaled back on its own initiative, and the right of inspection stays in local hands."
 ywc_crisis.1305.minimal_inspection:0 "Inspect only the ships the port can actually inspect"
 ywc_crisis.1305.minimal_inspection.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1305.minimal_inspection.consequence_tooltip:0 "The limited inspection capability is registered; review and settlement are awaited."
 ywc_crisis.1305.scale_back_promise:0 "Scale the overpromise back on the port's own initiative"
 ywc_crisis.1305.scale_back_promise.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1305.scale_back_promise.consequence_tooltip:0 "The scale-back is on record; no inspection capability is overstated."
 ywc_crisis.1305.keep_local_judgment:0 "Keep local judgment over the inspections"
 ywc_crisis.1305.keep_local_judgment.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1305.keep_local_judgment.consequence_tooltip:0 "Local judgment stays and no inspection right is ceded; the terms follow strictly."
 ywc_crisis.1305.wait:0 "Wait before the setup"
 ywc_crisis.1305.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1305.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1306.t:0 "The Detained Ore Ship"
 ywc_crisis.1306.d:0 "A cargo of ore sits in the anchorage: the detaining island port must return and compensate, open a joint investigation, or keep the ship held; the cargo-owner country answers separately, claiming restitution, joining the survey or rerouting at its own loss. Each side books its own account, the trade and fiscal consequences stay in their own ledgers, and no arms follow."
 ywc_crisis.1306.return_compensate:0 "Return the cargo and compensate (400)"
 ywc_crisis.1306.return_compensate.cost_tooltip:0 "The holder's treasury pays 400."
 ywc_crisis.1306.return_compensate.consequence_tooltip:0 "The return and compensation are registered and the detention dispute is settled."
 ywc_crisis.1306.joint_investigation:0 "Open a joint investigation with the cargo owner"
 ywc_crisis.1306.joint_investigation.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1306.joint_investigation.consequence_tooltip:0 "The joint survey enters the terms; losses during detention are kept on each own book."
 ywc_crisis.1306.keep_held:0 "Keep the ship held pending the inquiry"
 ywc_crisis.1306.keep_held.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1306.keep_held.consequence_tooltip:0 "The continued detention is registered; only the limited agreement can be confirmed at settlement."
 ywc_crisis.1306.wait_island:0 "Wait before ruling"
 ywc_crisis.1306.wait_island.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1306.wait_island.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1306.claim_restitution:0 "Claim restitution and compensation"
 ywc_crisis.1306.claim_restitution.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1306.claim_restitution.consequence_tooltip:0 "The claim is on record; the island ruling and the settlement audit follow."
 ywc_crisis.1306.joint_survey:0 "Join the island port in a joint investigation"
 ywc_crisis.1306.joint_survey.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1306.joint_survey.consequence_tooltip:0 "The joint survey enters the terms; losses are kept on each own book."
 ywc_crisis.1306.reroute_write_off:0 "Reroute and write the ship off at own loss"
 ywc_crisis.1306.reroute_write_off.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1306.reroute_write_off.consequence_tooltip:0 "The reroute and write-off are registered; only the limited agreement can be confirmed at settlement."
 ywc_crisis.1306.wait_cargo:0 "Wait before answering"
 ywc_crisis.1306.wait_cargo.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1306.wait_cargo.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1307.t:0 "The Protector Under a New Flag"
 ywc_crisis.1307.d:0 "The suzerain has changed, the port changed hands, and the flag on the sea lane has changed with them. The old guarantee does not pass with the flag: renegotiate the terms now, record that the old guarantee lapsed and then renegotiate, or keep the status quo. The flag honors no old sentiment; the register honors only new signatures."
 ywc_crisis.1307.reopen_terms:0 "Renegotiate the escort and port terms now"
 ywc_crisis.1307.reopen_terms.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1307.reopen_terms.consequence_tooltip:0 "The review window opens and each side answers separately."
 ywc_crisis.1307.record_no_inheritance:0 "Record that the old guarantee lapsed, then renegotiate"
 ywc_crisis.1307.record_no_inheritance.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1307.record_no_inheritance.consequence_tooltip:0 "The lapse is on record and the review opens as usual."
 ywc_crisis.1307.keep_old_usage:0 "Keep the status quo without renegotiation"
 ywc_crisis.1307.keep_old_usage.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1307.keep_old_usage.consequence_tooltip:0 "The line closes as status quo and the capacity slot is released at once."
 ywc_crisis.1307.wait:0 "Wait before ruling"
 ywc_crisis.1307.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1307.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1308.t:0 "Only This Stretch of Sea"
 ywc_crisis.1308.d:0 "The escort country lays its cards down: no more whole-route promises, only the standing stretch of sea; segments it cannot provide are refunded or ended within the term. Each protected side answers separately, joining the trimmed segment or declining and keeping the old usage. The terms are written to what can actually be provided, not to what is wished."
 ywc_crisis.1308.maintain_segment:0 "Keep the trimmed segment and let each side answer anew"
 ywc_crisis.1308.maintain_segment.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1308.maintain_segment.consequence_tooltip:0 "The review window opens and each protected side answers separately."
 ywc_crisis.1308.refund_end_term:0 "Refund (200) and end the escort within the term"
 ywc_crisis.1308.refund_end_term.cost_tooltip:0 "The holder's treasury pays the 200 refund."
 ywc_crisis.1308.refund_end_term.consequence_tooltip:0 "The term-end is registered; only the limited agreement can be confirmed at settlement."
 ywc_crisis.1308.wait_org:0 "Wait before laying the cards down"
 ywc_crisis.1308.wait_org.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1308.wait_org.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1308.accept_segment:0 "Accept the trimmed segment and join the escort account"
 ywc_crisis.1308.accept_segment.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1308.accept_segment.consequence_tooltip:0 "The trimmed terms are registered and the settlement audit follows."
 ywc_crisis.1308.refuse_segment:0 "Decline the trimmed segment and keep the old usage"
 ywc_crisis.1308.refuse_segment.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1308.refuse_segment.consequence_tooltip:0 "The line closes as status quo and the capacity slot is released at once."
 ywc_crisis.1308.wait_responder:0 "Wait before answering"
 ywc_crisis.1308.wait_responder.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1308.wait_responder.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1309.t:0 "The Merchant House Cannot Speak for the Island"
 ywc_crisis.1309.d:0 "The merchant house's signature does not speak for the whole island: common verification may be accepted, local justice must stay, and the colonial clauses may be refused. The island's answer enters the register in the island's own name, with the merchant house merely the middleman."
 ywc_crisis.1309.accept_common_verification:0 "Accept common verification, registered in the island's name"
 ywc_crisis.1309.accept_common_verification.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1309.accept_common_verification.consequence_tooltip:0 "Common verification is registered and the local usage stands."
 ywc_crisis.1309.keep_local_justice:0 "Keep local justice; verification covers port matters only"
 ywc_crisis.1309.keep_local_justice.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1309.keep_local_justice.consequence_tooltip:0 "Local justice stays and the narrow verification scope enters the terms."
 ywc_crisis.1309.stay_out:0 "Refuse the colonial clauses and stay out of the arrangement"
 ywc_crisis.1309.stay_out.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1309.stay_out.consequence_tooltip:0 "The line closes as status quo and the harbor governance is untouched by this arrangement."
 ywc_crisis.1309.wait:0 "Wait before answering"
 ywc_crisis.1309.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1309.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1310.t:0 "The Route Convention with Different Signatures"
 ywc_crisis.1310.d:0 "The convention carries different signatures: those with both the actual payments and the authority confirm the full route; those with licenses only or trimmed coverage confirm the limited clauses; exits and defaults are filed separately. Each signature matches its own ledger, and nobody stands surety for another."
 ywc_crisis.1310.confirm_full:0 "Confirm the full route convention"
 ywc_crisis.1310.confirm_full.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1310.confirm_full.consequence_tooltip:0 "The full agreement is registered, pending the monsoon review."
 ywc_crisis.1310.confirm_limited:0 "Confirm the limited clauses (bilateral licenses or the trimmed segment)"
 ywc_crisis.1310.confirm_limited.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1310.confirm_limited.consequence_tooltip:0 "The limited agreement is registered and the missing clauses stay open as they are."
 ywc_crisis.1310.keep_status_quo:0 "Keep the status quo with old accounts and old usage"
 ywc_crisis.1310.keep_status_quo.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1310.keep_status_quo.consequence_tooltip:0 "The line closes as status quo and the capacity slot is released at once."
 ywc_crisis.1310.wait:0 "Wait before signing"
 ywc_crisis.1310.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1310.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1311.t:0 "The Manifest Before the Next Monsoon"
 ywc_crisis.1311.d:0 "Before the next monsoon the manifests are checked: whether berths, inspections, escort segments and licenses were honored, and which port carries the transport and labor pressure. Deliveries are registered and credited, shortfalls recorded as failures as they are; the verdict is written back to every participant as the warrant for their follow-up country and theme lines."
 ywc_crisis.1311.confirm_kept:0 "The audit finds the promises kept"
 ywc_crisis.1311.confirm_kept.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1311.confirm_kept.consequence_tooltip:0 "The kept-faith record is written back to every participant's follow-up country and theme lines."
 ywc_crisis.1311.admit_shortfall:0 "Admit the shortfall and settle as failure"
 ywc_crisis.1311.admit_shortfall.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1311.admit_shortfall.consequence_tooltip:0 "The shortfall is recorded as it is; payments already made stay on file and no war follows from it."
 ywc_crisis.1311.wait:0 "Wait before the review"
 ywc_crisis.1311.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1311.wait.consequence_tooltip:0 "Records this decision."
