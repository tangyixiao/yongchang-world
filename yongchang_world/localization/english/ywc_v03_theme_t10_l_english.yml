 ywc_je_v03_t10_trade_jurisdiction:0 "The Boundary of a Trade Note"
 ywc_je_v03_t10_trade_jurisdiction_reason:0 "Jinghai's port faces a jurisdictional claim carried by Dongming merchants. The court audits its routes, tariff and offices, then answers with transparent rules, limited arbitration, or its own precedent, and bears the administrative cost, relations and next-time standing."
 ywc_society.1450.t:0 "A Ship's Papers from an Unfamiliar Court"
 ywc_society.1450.d:0 "A Dongming merchant ship docks with a note claiming consular trial for its crew's disputes. Jinghai's harbour office must register the claim, hold the papers for inspection, or refuse the note outright."
 ywc_society.1450.register:0 "Register the note and file it"
 ywc_society.1450.register.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1450.register.consequence_tooltip:0 "The note is filed and Dongming is asked to respond; the waiting clock starts this month."
 ywc_society.1450.custody:0 "Hold the papers under local rules"
 ywc_society.1450.custody.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1450.custody.consequence_tooltip:0 "The papers are held for inspection and Dongming is still notified; the waiting clock starts this month."
 ywc_society.1450.decline:0 "Refuse the note and keep local practice"
 ywc_society.1450.decline.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1450.decline.consequence_tooltip:0 "The case moves straight to the verdict: whether to grant precedence stays with Jinghai."
 ywc_society.1450.wait:0 "Wait and review again"
 ywc_society.1450.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1450.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1451.t:0 "The Merchants Ask Their Own Court"
 ywc_society.1451.d:0 "Word of the registered note reaches Dongming. Its merchants ask their own court to intervene; Dongming may fund a consular agent or let the merchants stand alone, but the case will not pause by itself."
 ywc_society.1451.negotiate:0 "Pay 500 to send a consular agent"
 ywc_society.1451.negotiate.cost_tooltip:0 "Dongming pays 500 from its treasury; nothing is transferred to Jinghai."
 ywc_society.1451.negotiate.consequence_tooltip:0 "The agent is sent; Jinghai receives the answer and continues the case."
 ywc_society.1451.refuse:0 "Let the merchants stand alone"
 ywc_society.1451.refuse.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1451.refuse.consequence_tooltip:0 "Dongming sends no one; Jinghai receives the answer and continues the case."
 ywc_society.1451.wait:0 "Wait before responding"
 ywc_society.1451.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1451.wait.consequence_tooltip:0 "Records this decision; if the note sits unanswered for over half a year it lapses."
 ywc_society.1451.withdraw:0 "The case has closed; withdraw the request"
 ywc_society.1451.withdraw.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1451.withdraw.consequence_tooltip:0 "Withdraws this request and clears only this case's pending record."
 ywc_society.1452.t:0 "The Basis of the Local Tariff"
 ywc_society.1452.d:0 "Before any hearing, the tariff and fees need a stated basis. Jinghai may pay to publish transparent rules, fund a limited arbitration bench, or state no basis and keep the old practice."
 ywc_society.1452.publish:0 "Pay 500 to publish transparent rules"
 ywc_society.1452.publish.cost_tooltip:0 "Jinghai pays 500 from its treasury."
 ywc_society.1452.publish.consequence_tooltip:0 "The rules are published and the case continues under transparent rules."
 ywc_society.1452.arbitrate:0 "Pay 200 for a limited arbitration bench"
 ywc_society.1452.arbitrate.cost_tooltip:0 "Jinghai pays 200 from its treasury."
 ywc_society.1452.arbitrate.consequence_tooltip:0 "A single limited bench is funded; no general rules are published."
 ywc_society.1452.decline:0 "State no basis and keep the old practice"
 ywc_society.1452.decline.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1452.decline.consequence_tooltip:0 "The case skips the seating question and moves to the verdict."
 ywc_society.1452.wait:0 "Wait and review again"
 ywc_society.1452.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1452.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1453.t:0 "The Judge and the Consul Share a Bench"
 ywc_society.1453.d:0 "The hearing is imminent. If Dongming sent an agent, the consul may sit and be recorded beside the judge; otherwise the judge sits alone and the seating follows the old practice."
 ywc_society.1453.seat_consul:0 "Seat the consular agent with the record"
 ywc_society.1453.seat_consul.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1453.seat_consul.consequence_tooltip:0 "The seating is recorded and Dongming is asked about the cargo."
 ywc_society.1453.bench_only:0 "The judge sits alone as before"
 ywc_society.1453.bench_only.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1453.bench_only.consequence_tooltip:0 "The seating stays as before and Dongming is asked about the cargo."
 ywc_society.1453.decline:0 "Suspend the hearing"
 ywc_society.1453.decline.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1453.decline.consequence_tooltip:0 "The hearing is suspended and the case moves to the verdict."
 ywc_society.1453.wait:0 "Wait and review again"
 ywc_society.1453.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1453.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1454.t:0 "The Cargo Cannot Wait for the Verdict"
 ywc_society.1454.d:0 "The cargo accrues charges at berth every day. Dongming's merchants ask for release on bond, or the goods stay with the case until the verdict; both sides know the cargo cannot wait out a long trial."
 ywc_society.1454.bail:0 "Pay 200 bond and release the cargo"
 ywc_society.1454.bail.cost_tooltip:0 "Dongming pays 200 as bond from its treasury."
 ywc_society.1454.bail.consequence_tooltip:0 "The cargo is released; Jinghai receives the answer and moves to the verdict."
 ywc_society.1454.hold:0 "Hold the cargo with the case"
 ywc_society.1454.hold.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1454.hold.consequence_tooltip:0 "The cargo stays with the case; Jinghai receives the answer and moves to the verdict."
 ywc_society.1454.wait:0 "Wait before responding"
 ywc_society.1454.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1454.wait.consequence_tooltip:0 "Records this decision; if the note sits unanswered for over half a year it lapses."
 ywc_society.1454.withdraw:0 "The case has closed; withdraw the request"
 ywc_society.1454.withdraw.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1454.withdraw.consequence_tooltip:0 "Withdraws this request and clears only this case's pending record."
 ywc_society.1455.t:0 "The Price of Refusing Precedence"
 ywc_society.1455.d:0 "The verdict is due: grant this case precedence and send the case-limited agreement for signature, or refuse precedence, apply local law evenly, and bear the rerouted trade. If the partner is unreachable, the court may close alone."
 ywc_society.1455.accept:0 "Grant precedence and send for signature"
 ywc_society.1455.accept.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1455.accept.consequence_tooltip:0 "The proposed result goes to Dongming for signature; published rules count as full acceptance, otherwise limited."
 ywc_society.1455.refuse:0 "Refuse precedence and bear the rerouting"
 ywc_society.1455.refuse.cost_tooltip:0 "Jinghai's treasury absorbs 300 in lost transit customs."
 ywc_society.1455.refuse.consequence_tooltip:0 "The case closes with precedence refused; Dongming loses 5 relations with Jinghai."
 ywc_society.1455.alone:0 "Close alone because the partner is unreachable"
 ywc_society.1455.alone.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1455.alone.consequence_tooltip:0 "A paid rules or arbitration record closes as limited; otherwise as kept jurisdiction."
 ywc_society.1455.wait:0 "Wait and review again"
 ywc_society.1455.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1455.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1456.t:0 "An Agreement for This Case Only"
 ywc_society.1456.d:0 "The draft reaches Dongming: the tariff, seating and bonded release apply to this case only. Dongming may sign, or insist on generalizing the arrangement, and reweigh this route."
 ywc_society.1456.sign:0 "Sign the case-limited agreement"
 ywc_society.1456.sign.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1456.sign.consequence_tooltip:0 "Dongming gains 5 relations with Jinghai; Jinghai receives the signed receipt."
 ywc_society.1456.insist:0 "Insist on a general precedent"
 ywc_society.1456.insist.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1456.insist.consequence_tooltip:0 "Dongming loses 5 relations with Jinghai; Jinghai receives the disagreement receipt."
 ywc_society.1456.wait:0 "Wait before responding"
 ywc_society.1456.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1456.wait.consequence_tooltip:0 "Records this decision; if the note sits unanswered for over half a year it lapses."
 ywc_society.1456.withdraw:0 "The case has closed; withdraw the signature"
 ywc_society.1456.withdraw.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1456.withdraw.consequence_tooltip:0 "Withdraws the signature and clears only this case's pending record."
 ywc_society.1457.t:0 "Whether the Next Case May Follow"
 ywc_society.1457.d:0 "The case is closed. Jinghai's office records the result and decides whether the next case may follow it; Dongming records the same outcome on its side."
 ywc_society.1457.confirm:0 "Let the next case follow this one"
 ywc_society.1457.confirm.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1457.confirm.consequence_tooltip:0 "Closes with the proposed result, marks it repeatable, and files one copy on each side."
 ywc_society.1457.discontinue:0 "Record it without a precedent"
 ywc_society.1457.discontinue.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1457.discontinue.consequence_tooltip:0 "Closes with the proposed result but no precedent, filed on both sides."
 ywc_society.1457.wait:0 "Wait and review again"
 ywc_society.1457.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1457.wait.consequence_tooltip:0 "Records this decision."
