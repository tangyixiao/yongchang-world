l_english:
 ywc_ljg.1.t:0 "The Salt Permit Dispute"
 ywc_ljg.1.d:0 "Shun wants to rewrite the tea-horse precedent with salt-permit levies. Comply and the Mu clan's ancient licence slips away; refuse and the suzerain takes offence."
 ywc_ljg.1.a:0 "Enforce the edict: hand the licence to Shun's assessors"
 ywc_ljg.1.b:0 "Plead the old precedent: offer tribute tea instead"
 ywc_ljg.2.t:0 "Tibetan Merchants at the Gate"
 ywc_ljg.2.d:0 "Derge's monk-traders ride straight into Lijiang, bypassing Shun's tolls. Open the gates and the caravan road booms past the tax line; toll them and the caravans turn away."
 ywc_ljg.2.a:0 "Open the market: welcome the caravans"
 ywc_ljg.2.b:0 "Toll them all alike"
 ywc_ljg.3.t:0 "The Mu Succession"
 ywc_ljg.3.d:0 "The old chieftain is dying, the heir a child, and the clan would raise his brother. Shun's officials offer an imperial patent: accept and the title is secure; stand alone and the clan stays whole."
 ywc_ljg.3.a:0 "Ask Shun for the patent: confirm the child heir"
 ywc_ljg.3.b:0 "Settle it in the clan: no patent"
 ywc_sip.1.t:0 "The Tea Hills Contract"
 ywc_sip.1.d:0 "Han merchants offer to lease the six tea hills for yearly silver. The council splits: quick silver for slowly losing the hills, or costly self-management that keeps them."
 ywc_sip.1.a:0 "Lease the hills to the merchants"
 ywc_sip.1.b:0 "Keep the hills: run our own tea office"
 ywc_sip.2.t:0 "The Envoy from Burma"
 ywc_sip.2.d:0 "A Burmese envoy arrives asking that Sipsongpanna tribute Ava as before. Two courts, one mandala: report to Shun and refuse Burma, or hedge with double tribute."
 ywc_sip.2.a:0 "Report to Shun: refuse the envoy"
 ywc_sip.2.b:0 "Hedge: tribute both courts"
 ywc_sip.3.t:0 "Sharing the Twelve Banners"
 ywc_sip.3.d:0 "Tribute and defence cost dearly: the council asks all twelve banners to share, the Chao Phaendin would decide alone."
 ywc_sip.3.a:0 "Share it across the twelve banners"
 ywc_sip.3.b:0 "The Chao Phaendin bears it alone"
 ywc_der.1.t:0 "The Printing House Debt"
 ywc_der.1.d:0 "The printing house means to expand the canon but the treasury runs short. Borrow and the blocks get carved; wait and the monasteries grumble."
 ywc_der.1.a:0 "Borrow and keep carving"
 ywc_der.1.b:0 "Wait three years: clear the old debts"
 ywc_der.2.t:0 "The Caravan Escort Pact"
 ywc_der.2.d:0 "Raids plague the highland roads and the caravans beg Derge for escort. Ride out at our own cost, or ask Shun's frontier army and split the credit."
 ywc_der.2.a:0 "Escort them ourselves"
 ywc_der.2.b:0 "Ask Shun's frontier army"
 ywc_der.3.t:0 "Monks and Ministers"
 ywc_der.3.d:0 "The printing house's stewardship sets the chieftain's ministers against the monasteries: one hand governs cleanly, the old duality keeps the peace at a price."
 ywc_der.3.a:0 "Ministers take the seal; monasteries keep the income"
 ywc_der.3.b:0 "Keep the old duality"
 ywc_gyl.1.t:0 "Fields Against Pastures"
 ywc_gyl.1.d:0 "The league's farm colonies creep into the pastures and the herders petition the assembly. Curb the farms and the frontier thins; expand them and the tribes seethe."
 ywc_gyl.1.a:0 "Curb the farms: the herders win"
 ywc_gyl.1.b:0 "Expand the farms: the herders move"
 ywc_gyl.2.t:0 "The Drill Request"
 ywc_gyl.2.d:0 "Shun asks the league to send men for drilling — a shield for the southwest. Accept and gain the new drill at the price of summons; refuse and keep the old ways without a patron."
 ywc_gyl.2.a:0 "Send three hundred for drilling"
 ywc_gyl.2.b:0 "Decline: our borders, our ways"
 ywc_gyl.3.t:0 "The League Chair"
 ywc_gyl.3.d:0 "The old league chief is dead and seven tribes contend. A strong chair commands but breeds envy; a rotating one keeps peace and loses grip."
 ywc_gyl.3.a:0 "Seat the strongest tribe"
 ywc_gyl.3.b:0 "Rotate the chair among the tribes"
 ywc_shd.1.t:0 "The Thirty-Four Chiefs"
 ywc_shd.1.d:0 "The joint council sets tribute and post-road shares: spread evenly and all agree but slowly, or let the strong sawbwas pay and collect the grudge."
 ywc_shd.1.a:0 "Share it across the chiefs"
 ywc_shd.1.b:0 "The strong sawbwas pay on time"
 ywc_shd.2.t:0 "The Magistrate Request"
 ywc_shd.2.d:0 "Shun asks to post a magistrate at Mianning for the trade-road suits. Accept and the suzerain's law takes root; refuse and the old order keeps its own."
 ywc_shd.2.a:0 "Accept, with the chiefs sitting alongside"
 ywc_shd.2.b:0 "Refuse: our chiefs keep our law"
 ywc_shd.3.t:0 "Tea or Poppy"
 ywc_shd.3.d:0 "The hills can grow tea or poppy: ban the poppy for slow honest money, or let it bloom for silver now and blight later."
 ywc_shd.3.a:0 "Ban poppy, plant tea, ask Shun's roads"
 ywc_shd.3.b:0 "Let the poppy bloom"
 ywc_ara.1.t:0 "The Resident's Bill"
 ywc_ara.1.d:0 "The British Resident assesses a defence levy, payment at once. Pay and the treasury empties quietly; stall and the friction shows."
 ywc_ara.1.a:0 "Pay in full, no fuss"
 ywc_ara.1.b:0 "Stall: plead the lean harvest"
 ywc_ara.2.t:0 "The Burmese Exiles"
 ywc_ara.2.d:0 "Princes of the Burmese royal house cross the border and the monks shelter them. Harbour them and win hearts while provoking Ava; hand them over and calm the neighbour at a cost."
 ywc_ara.2.a:0 "Shelter them; ask Britain's forbearance"
 ywc_ara.2.b:0 "Hand them over to calm Ava"
 ywc_ara.3.t:0 "The Rice Contract"
 ywc_ara.3.d:0 "Britain offers a multi-year rice export contract at fixed prices. Sign for steady income and squeezed growers, or cap exports and sour the Resident."
 ywc_ara.3.a:0 "Sign the contract: fixed quotas"
 ywc_ara.3.b:0 "Cap the exports"
