l_english:
 ywc_je_v03_t08_grain_corridor:0 "The Crisis Crosses the Market Boundary"
 ywc_je_v03_t08_grain_corridor_reason:0 "Rising grain prices cross the market boundary: Shu audits real pressure and buys surplus grain from NQG, while quarantine, transport and ledgers decide whether relief arrives fairly — then charters rules for the next shortage."
 ywc_society.1350.t:0 "Grain Prices Bring the News First"
 ywc_society.1350.d:0 "Grain prices in Shu's markets rise before the reports do. After auditing local granaries and market prices, the offices must decide whether to approach a genuinely surplus neighbor about purchase and transport."
 ywc_society.1350.seek_surplus:0 "Ask the surplus neighbor for grain"
 ywc_society.1350.seek_surplus.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1350.seek_surplus.consequence_tooltip:0 "Records this decision and waits for NQG to audit its surplus."
 ywc_society.1350.self_audit:0 "Audit local granaries only"
 ywc_society.1350.self_audit.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1350.self_audit.consequence_tooltip:0 "No foreign purchase; the local record closes as a refusal."
 ywc_society.1350.wait:0 "Wait and review the market again"
 ywc_society.1350.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1350.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1351.t:0 "A Neighbor's Surplus"
 ywc_society.1351.d:0 "NQG audits its own markets and granaries and decides on what terms to release surplus grain: open sale at market prices, a limited quota, or holding it back for now. The terms enter ledgers both sides can read."
 ywc_society.1351.offer_open_terms:0 "Offer surplus grain at market prices"
 ywc_society.1351.offer_open_terms.cost_tooltip:0 "No additional treasury expense; prices follow the market."
 ywc_society.1351.offer_open_terms.consequence_tooltip:0 "Records this decision; Shu must arrange quarantine or the grain corridor."
 ywc_society.1351.offer_limited_terms:0 "Release only a limited quota"
 ywc_society.1351.offer_limited_terms.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1351.offer_limited_terms.consequence_tooltip:0 "Records this decision; Shu must arrange quarantine or the grain corridor."
 ywc_society.1351.hold_back_surplus:0 "Hold the surplus back"
 ywc_society.1351.hold_back_surplus.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1351.hold_back_surplus.consequence_tooltip:0 "The refusal is copied to Shu; relief can only shrink in scale."
 ywc_society.1351.wait:0 "Wait before responding"
 ywc_society.1351.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1351.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1352.t:0 "The Quarantine Dispute at the Docks"
 ywc_society.1352.d:0 "The grain route reaches docks or mountain passes and inspection authority is contested: coastal routes face dock inspection, inland routes rely on escorted passes. If Korea is known for health regulation its standard may be adopted; TIB's passes can carry the convoy. Closing the corridor is also an option."
 ywc_society.1352.charter_inspection:0 "Pay 300 to charter dock inspection"
 ywc_society.1352.charter_inspection.cost_tooltip:0 "Shu pays 300 from its treasury."
 ywc_society.1352.charter_inspection.consequence_tooltip:0 "Records this decision; relief distribution still needs arranging."
 ywc_society.1352.kor_standard:0 "Pay 200 to adopt Korea's health standard"
 ywc_society.1352.kor_standard.cost_tooltip:0 "Shu pays 200 from its treasury."
 ywc_society.1352.kor_standard.consequence_tooltip:0 "The quarantine standard is recorded; Korea's own laws do not change."
 ywc_society.1352.tib_convoy:0 "Pay 300 to route the convoy through TIB's passes"
 ywc_society.1352.tib_convoy.cost_tooltip:0 "Shu pays 300 from its treasury."
 ywc_society.1352.tib_convoy.consequence_tooltip:0 "Records this decision; TIB's own routes are unchanged."
 ywc_society.1352.inland_escort:0 "Pay 300 for an escorted inland corridor"
 ywc_society.1352.inland_escort.cost_tooltip:0 "Shu pays 300 from its treasury."
 ywc_society.1352.inland_escort.consequence_tooltip:0 "Records this decision."
 ywc_society.1352.waive_checks:0 "Waive checks and move the grain first"
 ywc_society.1352.waive_checks.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1352.waive_checks.consequence_tooltip:0 "The waiver is recorded; disease risk stays local."
 ywc_society.1352.close_corridor:0 "Close the corridor and stop buying relief"
 ywc_society.1352.close_corridor.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1352.close_corridor.consequence_tooltip:0 "Relief ends; discontent appears at the docks and in the countryside."
 ywc_society.1352.wait:0 "Wait and review again"
 ywc_society.1352.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1352.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1353.t:0 "Where the Relief Goes"
 ywc_society.1353.d:0 "Grain in hand is only the beginning. The offices choose targeted relief for the worst-hit counties, opening granaries to steady prices, or rationing only. If the neighbor held its surplus back, relief can only shrink — and both market and countryside keep the consequences."
 ywc_society.1353.targeted_relief:0 "Pay 500 for targeted relief"
 ywc_society.1353.targeted_relief.cost_tooltip:0 "Shu pays 500 from its treasury."
 ywc_society.1353.targeted_relief.consequence_tooltip:0 "Records this decision and waits for NQG to tally transport."
 ywc_society.1353.granary_release:0 "Pay 300 to open state granaries"
 ywc_society.1353.granary_release.cost_tooltip:0 "Shu pays 300 from its treasury."
 ywc_society.1353.granary_release.consequence_tooltip:0 "Records this decision and waits for NQG to tally transport."
 ywc_society.1353.ration_only:0 "Ration by household registry only"
 ywc_society.1353.ration_only.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1353.ration_only.consequence_tooltip:0 "Relief shrinks; if the neighbor refused to sell, discontent rises in the countryside."
 ywc_society.1353.halt_relief:0 "Halt relief"
 ywc_society.1353.halt_relief.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1353.halt_relief.consequence_tooltip:0 "Relief ends; discontent rises in the countryside."
 ywc_society.1353.wait:0 "Wait and review again"
 ywc_society.1353.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1353.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1354.t:0 "The Transport Ledger"
 ywc_society.1354.d:0 "NQG's shipping houses tally capacity: settle in silver, carry on credit, or decline the job. The account stays in NQG's ledgers and is copied to Shu; a credit debt does not quietly disappear."
 ywc_society.1354.settle_silver:0 "Pay 600 to settle transport in silver"
 ywc_society.1354.settle_silver.cost_tooltip:0 "NQG pays 600; no transfer to Shu."
 ywc_society.1354.settle_silver.consequence_tooltip:0 "Records this decision and waits for Shu's audit."
 ywc_society.1354.carry_on_credit:0 "Carry the grain on credit"
 ywc_society.1354.carry_on_credit.cost_tooltip:0 "No additional treasury expense; the debt enters the ledgers."
 ywc_society.1354.carry_on_credit.consequence_tooltip:0 "The credit record stands and later shapes borrowing terms."
 ywc_society.1354.refuse_transport:0 "Refuse the carriage"
 ywc_society.1354.refuse_transport.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1354.refuse_transport.consequence_tooltip:0 "The refusal is copied to Shu; the audit still proceeds."
 ywc_society.1354.wait:0 "Wait before responding"
 ywc_society.1354.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1354.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1355.t:0 "The Recipient Demands the Ledgers"
 ywc_society.1355.d:0 "Shu demands NQG open its transport and price ledgers: in full, in part, or not at all. How much is disclosed shapes next season's terms — and aid that never arrived must still be accounted for."
 ywc_society.1355.open_ledger:0 "Demand the ledgers in full"
 ywc_society.1355.open_ledger.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1355.open_ledger.consequence_tooltip:0 "Records this decision and waits for NQG's answer after the harvest."
 ywc_society.1355.partial_ledger:0 "Audit only part of the ledgers"
 ywc_society.1355.partial_ledger.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1355.partial_ledger.consequence_tooltip:0 "Records this decision and waits for NQG's answer after the harvest."
 ywc_society.1355.refuse_ledger:0 "Give up the audit"
 ywc_society.1355.refuse_ledger.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1355.refuse_ledger.consequence_tooltip:0 "The abandoned audit is recorded; NQG must still answer whether relief continues."
 ywc_society.1355.wait:0 "Wait and review again"
 ywc_society.1355.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1355.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1356.t:0 "Relief After the Harvest?"
 ywc_society.1356.d:0 "After the new harvest is stored, NQG rereads both sides' ledgers: if Shu opened its books and NQG's treasury allows, full relief continues for the season; otherwise seasonal limits or withdrawal. Each country keeps its own record."
 ywc_society.1356.continue_relief:0 "Pay 400 to continue relief for the season"
 ywc_society.1356.continue_relief.cost_tooltip:0 "NQG pays 400; no transfer to Shu."
 ywc_society.1356.continue_relief.consequence_tooltip:0 "Records this decision and waits for Shu to charter next shortage's rules."
 ywc_society.1356.seasonal_terms:0 "Continue with seasonal limits"
 ywc_society.1356.seasonal_terms.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1356.seasonal_terms.consequence_tooltip:0 "Records this decision and waits for Shu to charter next shortage's rules."
 ywc_society.1356.wind_down:0 "Withdraw from the arrangement"
 ywc_society.1356.wind_down.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1356.wind_down.consequence_tooltip:0 "The withdrawal is copied to Shu; each country keeps its own institutions and reserves."
 ywc_society.1356.wait:0 "Wait before responding"
 ywc_society.1356.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1356.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1357.t:0 "Preparing for the Next Shortage"
 ywc_society.1357.d:0 "Whatever this season's result, Shu must decide whether to charter standing granary rules, fund an audit office, or only record the refusal. If the partner's ledgers are missing, the local record can close the case."
 ywc_society.1357.charter_granary_rule:0 "Pay 500 to charter granary rules"
 ywc_society.1357.charter_granary_rule.cost_tooltip:0 "Shu pays 500 from its treasury."
 ywc_society.1357.charter_granary_rule.consequence_tooltip:0 "The acceptance stands; NQG gains 5 relations with Shu."
 ywc_society.1357.confirm_acceptance:0 "Record the acceptance without spending"
 ywc_society.1357.confirm_acceptance.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1357.confirm_acceptance.consequence_tooltip:0 "The acceptance stands, but without granary rules."
 ywc_society.1357.fund_audit_office:0 "Pay 300 to fund an audit office"
 ywc_society.1357.fund_audit_office.cost_tooltip:0 "Shu pays 300 from its treasury."
 ywc_society.1357.fund_audit_office.consequence_tooltip:0 "The limited outcome stands with the audit office on record."
 ywc_society.1357.confirm_limited:0 "Record the limited arrangement only"
 ywc_society.1357.confirm_limited.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1357.confirm_limited.consequence_tooltip:0 "The limited outcome stands without an audit office."
 ywc_society.1357.record_refusal:0 "Record the refusal"
 ywc_society.1357.record_refusal.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1357.record_refusal.consequence_tooltip:0 "The refusal stands; NQG loses 5 relations with Shu."
 ywc_society.1357.close_local:0 "Close by local record when the partner's ledgers are missing"
 ywc_society.1357.close_local.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1357.close_local.consequence_tooltip:0 "Delivered relief closes as limited; otherwise the arc lapses."
 ywc_society.1357.wait:0 "Wait and review again"
 ywc_society.1357.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1357.wait.consequence_tooltip:0 "Records this decision."
