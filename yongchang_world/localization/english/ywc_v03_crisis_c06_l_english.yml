l_english:
 ywc_je_v03_c06_pass_two_orders:0 "The Two Orders at the Passes"
 ywc_je_v03_c06_pass_two_orders_reason:0 "Register the obligations that genuinely clash at the passes: the frontier office's levy and the old Burmese tribute season are two separate orders. The proposing hill country verifies each one, asks both courts for their replies in writing, and never invents a double allegiance when only one arrangement is lawful."
 ywc_je_v03_c06_local_council_mandate:0 "The Mandate of the Local Council"
 ywc_je_v03_c06_local_council_mandate_reason:0 "With the replies in, execution begins: tea tribute converted to a fee, a limited grain supply, or village-by-village apportionment, each bearing its own real cost. The joint council convenes among the hill countries actually affected; who may speak for it and who is left out must be written into the register."
 ywc_je_v03_c06_frontier_precedent_bounds:0 "New Bounds for the Frontier Precedent"
 ywc_je_v03_c06_frontier_precedent_bounds_reason:0 "Execution and review test where the old precedent ends: the transit troops' winter grain, whether one seal can sign twice, the split between trade and military clauses, and finally the mountain roads after tribute season are written back according to each party's actual signature and actual payment."
 ywc_crisis.1500.t:0 "Tribute Season or the Military Order"
 ywc_crisis.1500.d:0 "Two documents arrive on the same pass road: the Great Shun frontier office pressing the winter levy, and the Burmese envoy reviving the old tribute season. The proposing hill country checks clause by clause whether the two obligations genuinely clash; when only one court demands anything, it is registered as a single lawful arrangement and no double allegiance is invented."
 ywc_crisis.1500.register_dual:0 "Register the two obligations as genuinely conflicting"
 ywc_crisis.1500.register_dual.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1500.register_dual.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1500.register_single:0 "Register a single lawful arrangement, invent no dual allegiance"
 ywc_crisis.1500.register_single.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1500.register_single.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1500.no_counterparty:0 "Neither court has a live demanding party; there is nothing to negotiate"
 ywc_crisis.1500.no_counterparty.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1500.no_counterparty.consequence_tooltip:0 "The case closes as no-talks and the capacity slot is released at once."
 ywc_crisis.1500.wait:0 "Wait and re-examine the documents"
 ywc_crisis.1500.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1500.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1501.t:0 "No Official Road to the Villages"
 ywc_crisis.1501.d:0 "The levy papers exist; the road does not. The corvee-liable households are scattered between the tea hills and the river valleys, and the official road stops at the chieftain's gate. Only after checking the levy-liable population, the roads and the real cost of upkeep are the two orders formally sent out for replies."
 ywc_crisis.1501.verify_roads:0 "Verify the levy-liable population and roads, then send both orders out as listed"
 ywc_crisis.1501.verify_roads.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1501.verify_roads.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1501.recount_upkeep:0 "Renegotiate the levy against the real upkeep cost (300)"
 ywc_crisis.1501.recount_upkeep.cost_tooltip:0 "The holder's treasury pays 300 for the road and levy-register audit."
 ywc_crisis.1501.recount_upkeep.consequence_tooltip:0 "The roads and levy register are audited against actual cost and recorded for the settlement review."
 ywc_crisis.1501.wait:0 "Wait and survey the mountain roads once more"
 ywc_crisis.1501.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1501.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1502.t:0 "The Frontier Office's Reply"
 ywc_crisis.1502.d:0 "The frontier office's reply has arrived: accept the levy within a fixed cap and answer it from the register, trade a definite passage right against the levy quota, or refuse this requisition and keep the old usage. The answer is recorded under the actual demanding party's own name; the proposing hill country cannot sign for it."
 ywc_crisis.1502.accept_capped:0 "Accept the capped levy and answer it from the register"
 ywc_crisis.1502.accept_capped.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1502.accept_capped.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1502.trade_passage:0 "Trade a definite passage right against the levy quota"
 ywc_crisis.1502.trade_passage.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1502.trade_passage.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1502.refuse_requisition:0 "Refuse this requisition and keep the old usage"
 ywc_crisis.1502.refuse_requisition.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1502.refuse_requisition.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1502.wait:0 "Wait before answering"
 ywc_crisis.1502.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1502.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1503.t:0 "The Burmese Envoy's Separate Terms"
 ywc_crisis.1503.d:0 "The Burmese envoy does not negotiate jointly with Great Shun and opens separate terms instead: grant seasonal passage with the tribute season unchanged, demand exclusive rights over the passes, or stay out of this compact altogether. This answer is kept in its own register and never copies the frontier office's wording."
 ywc_crisis.1503.seasonal_passage:0 "Grant seasonal passage with the tribute season unchanged"
 ywc_crisis.1503.seasonal_passage.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1503.seasonal_passage.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1503.demand_exclusive:0 "Demand exclusive rights over the passes"
 ywc_crisis.1503.demand_exclusive.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1503.demand_exclusive.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1503.not_join:0 "Stay out of this compact; each keeps its own course"
 ywc_crisis.1503.not_join.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1503.not_join.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1503.wait:0 "Wait before answering"
 ywc_crisis.1503.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1503.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1504.t:0 "Shares of Tea and Grain"
 ywc_crisis.1504.d:0 "What the tribute becomes and who bears it must land in the accounts: convert the tea tribute into a fee paid at once, answer the transit with a limited grain supply, or apportion shares village by village and let each stockade own its part. Every choice is paid from this country's own treasury; nothing is borrowed or collected in advance."
 ywc_crisis.1504.pay_tea_fee:0 "Convert the tea tribute into a fee and pay it at once (500)"
 ywc_crisis.1504.pay_tea_fee.cost_tooltip:0 "The holder's treasury pays 500."
 ywc_crisis.1504.pay_tea_fee.consequence_tooltip:0 "The converted fee is registered; the full compact can be confirmed at settlement."
 ywc_crisis.1504.limited_grain:0 "Answer the transit with a limited grain supply (300)"
 ywc_crisis.1504.limited_grain.cost_tooltip:0 "The holder's treasury pays 300."
 ywc_crisis.1504.limited_grain.consequence_tooltip:0 "The limited grain supply is registered; only the limited compact can be confirmed at settlement."
 ywc_crisis.1504.village_share:0 "Apportion shares village by village (200)"
 ywc_crisis.1504.village_share.cost_tooltip:0 "The holder's treasury pays 200 for the register and apportionment."
 ywc_crisis.1504.village_share.consequence_tooltip:0 "Each village's share is registered; only the limited compact can be confirmed at settlement."
 ywc_crisis.1504.wait:0 "Wait and check the accounts once more"
 ywc_crisis.1504.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1504.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1505.t:0 "Who Speaks for the Joint Council"
 ywc_crisis.1505.d:0 "The joint council stalls halfway: the chieftains each bring their villages' registers, yet none can say whom they are empowered to speak for. After checking the local mandates and the objectors, either join the compact by limited joint deliberation, or hand the matter to central arbitration and leave the dispute for later."
 ywc_crisis.1505.limited_council:0 "Deliberate jointly within limits, each keeping its own adjudication"
 ywc_crisis.1505.limited_council.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1505.limited_council.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1505.central_arbitration:0 "Hand it to central arbitration and leave the aftermath open"
 ywc_crisis.1505.central_arbitration.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1505.central_arbitration.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1505.wait:0 "Wait and ask the villages for their mandates again"
 ywc_crisis.1505.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1505.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1506.t:0 "Transit Troops Demand Winter Grain"
 ywc_crisis.1506.d:0 "The troops passing under the compact have camped at the pass, and their column commander slaps the requisition register on the table: military needs are pressing, and passage means requisition. The hill country may supply the winter grain, convert it into a toll, or close the passes; the demanding side may press the requisition, pay the market price, or withdraw the passage claim. Each side carries the result in its own ledger."
 ywc_crisis.1506.insist_requisition:0 "Press the military need and requisition by the register"
 ywc_crisis.1506.insist_requisition.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1506.insist_requisition.consequence_tooltip:0 "The requisition register stays at the pass; the hill country answers separately and each answer is kept in its own ledger."
 ywc_crisis.1506.offer_compensation:0 "Compensate the transit requisition at market price"
 ywc_crisis.1506.offer_compensation.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1506.offer_compensation.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1506.withdraw_passage:0 "Withdraw the passage claim and route the troops elsewhere"
 ywc_crisis.1506.withdraw_passage.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1506.withdraw_passage.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1506.demand_wait:0 "Wait and recount the military needs"
 ywc_crisis.1506.demand_wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1506.demand_wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1506.supply_grain:0 "Supply the winter grain from the register (400)"
 ywc_crisis.1506.supply_grain.cost_tooltip:0 "The holder's treasury pays 400."
 ywc_crisis.1506.supply_grain.consequence_tooltip:0 "The grain payment is registered; the demanding side records this supply in its own ledger."
 ywc_crisis.1506.grain_for_toll:0 "Convert the grain into a toll and leave the account open"
 ywc_crisis.1506.grain_for_toll.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1506.grain_for_toll.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1506.close_passes:0 "Close the passes and end the transit"
 ywc_crisis.1506.close_passes.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1506.close_passes.consequence_tooltip:0 "The transit ends; relations with the demanding side drop by 3 and the compact clauses go to review."
 ywc_crisis.1506.answer_wait:0 "Wait before answering"
 ywc_crisis.1506.answer_wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1506.answer_wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1507.t:0 "One Seal Cannot Sign Twice"
 ywc_crisis.1507.d:0 "As the register is unrolled, the old accounts collide: the same seal has written opposite promises to both courts in different years. Correct the old promise openly and note the order of precedence, conceal it for now and set the seal anyway, or suspend the signing and hand the old accounts back to the old usage. Correction leaves evidence; concealment leaves a snare."
 ywc_crisis.1507.public_correction:0 "Correct the old promise openly and note the order of precedence"
 ywc_crisis.1507.public_correction.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1507.public_correction.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1507.conceal_conflict:0 "Conceal the conflict for now and set the seal anyway"
 ywc_crisis.1507.conceal_conflict.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1507.conceal_conflict.consequence_tooltip:0 "The seal is set; the concealed account waits for the review, and the full compact can no longer be confirmed."
 ywc_crisis.1507.suspend_signing:0 "Suspend the signing and hand the old accounts back to the old usage"
 ywc_crisis.1507.suspend_signing.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1507.suspend_signing.consequence_tooltip:0 "The case closes with the status quo; remaining obligations stay under the old usage and normal play continues."
 ywc_crisis.1507.wait:0 "Wait and go through the old registers once more"
 ywc_crisis.1507.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1507.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1508.t:0 "Markets First, Garrisons Later"
 ywc_crisis.1508.d:0 "The review opens and the proposer lays the whole text out again: narrow it to border trade and civil passage so that those who cannot accept the military clauses stay at the table, or insist on the full text and write garrisons and levies into it together. The narrow pact has fewer signatures and less resentment; the full pact carries heavier clauses and heavier duties."
 ywc_crisis.1508.narrow_trade:0 "Narrow the compact to border trade and civil passage"
 ywc_crisis.1508.narrow_trade.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1508.narrow_trade.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1508.keep_full_terms:0 "Insist on the full text with the military clauses intact"
 ywc_crisis.1508.keep_full_terms.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1508.keep_full_terms.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1508.wait:0 "Wait and weigh the clauses again"
 ywc_crisis.1508.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1508.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1509.t:0 "The Hill State's Reservations"
 ywc_crisis.1509.d:0 "Before the compact reopens, each non-signatory states its reservations: join with the levy quota and its term limited, withdraw to the old usage and accept the cost of constrained trade, or keep the status quo and stay outside the compact. Returning to the old usage carries no punishment beyond it; it only costs one trade route at the market price."
 ywc_crisis.1509.limit_levy_term:0 "Limit the levy and its term, then join with reservations"
 ywc_crisis.1509.limit_levy_term.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1509.limit_levy_term.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1509.return_old_usage:0 "Return to the old usage and bear the trade cost"
 ywc_crisis.1509.return_old_usage.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1509.return_old_usage.consequence_tooltip:0 "The case closes as a voluntary withdrawal; the old usage returns with a trade cost and normal play continues."
 ywc_crisis.1509.keep_status:0 "Keep the status quo and stay outside the compact"
 ywc_crisis.1509.keep_status.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1509.keep_status.consequence_tooltip:0 "The case closes with the status quo; remaining obligations stay under the old usage and normal play continues."
 ywc_crisis.1509.wait:0 "Wait and weigh the reservations once more"
 ywc_crisis.1509.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1509.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1510.t:0 "Three Signatures on the Frontier Compact"
 ywc_crisis.1510.d:0 "The compact text is copied out fair, and the signatures come in three forms: those whose payment and correction are both complete sign the full compact; those joining only the border trade sign the limited one; those unwilling to sign keep the status quo. A signature binds only its own signatory; what each signed and where each clause stops is recorded plainly in each own ledger."
 ywc_crisis.1510.confirm_full:0 "Confirm the full compact"
 ywc_crisis.1510.confirm_full.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1510.confirm_full.consequence_tooltip:0 "The full compact is acknowledged by its signatories; each actual payment and term is registered."
 ywc_crisis.1510.confirm_limited:0 "Confirm the limited trade compact"
 ywc_crisis.1510.confirm_limited.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1510.confirm_limited.consequence_tooltip:0 "The limited trade compact is signed; those who did not sign keep to the old usage."
 ywc_crisis.1510.keep_status_quo:0 "Sign nothing and keep the status quo"
 ywc_crisis.1510.keep_status_quo.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1510.keep_status_quo.consequence_tooltip:0 "The case closes with the status quo; remaining obligations stay under the old usage and normal play continues."
 ywc_crisis.1510.wait:0 "Wait before signing"
 ywc_crisis.1510.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1510.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1511.t:0 "The Mountain Roads after Tribute Season"
 ywc_crisis.1511.d:0 "A full year after the signatures, the mountain roads are checked against the register: did the levies stop on their term, was the tea fee actually paid, and does the frontier office's patrol spending have its funding? SHU signatories pay the frontier upkeep from their own treasury; those who kept faith keep their standing, defaults are recorded as failures, and the verdict is written back to local governance and to the next round of representation."
 ywc_crisis.1511.audit_kept:0 "Audit the execution and write back governance and frontier costs"
 ywc_crisis.1511.audit_kept.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1511.audit_kept.consequence_tooltip:0 "The kept verdict is written into every participant's register; SHU signatories pay 200 in frontier upkeep."
 ywc_crisis.1511.admit_broken:0 "Admit fulfillment failed and record the arrears"
 ywc_crisis.1511.admit_broken.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1511.admit_broken.consequence_tooltip:0 "The case closes as fulfillment failed; the arrears are recorded as they are and normal play continues."
 ywc_crisis.1511.wait:0 "Wait before the final audit"
 ywc_crisis.1511.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1511.wait.consequence_tooltip:0 "Records this decision."
