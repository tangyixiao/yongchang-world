l_english:
 ywc_je_v03_t02_talent_crossing:0 "Talent Comes to the Border"
 ywc_je_v03_t02_talent_crossing_reason:0 "Korea's school has talent willing to travel; Jinghai must audit its own offices, schools and garrisons before deciding whether to send an invitation and a translated appointment."
 ywc_society.1050.t:0 "The Teacher Willing to Leave"
 ywc_society.1050.d:0 "A teacher of medicine, bookkeeping and translation at Korea's school is willing to go to Jinghai. Release requires a travel and translation record; withholding files the idea among faction disputes."
 ywc_society.1050.release:0 "Release the teacher with a travel and translation record"
 ywc_society.1050.release.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1050.release.consequence_tooltip:0 "Korea keeps a release record; Jinghai audits the vacancy itself."
 ywc_society.1050.withhold:0 "Withhold the teacher and refuse the departure"
 ywc_society.1050.withhold.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1050.withhold.consequence_tooltip:0 "The exchange closes as refused; Jinghai's vacancy remains its own to fill."
 ywc_society.1050.wait:0 "Wait before responding"
 ywc_society.1050.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1050.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1051.t:0 "The Vacant Post"
 ywc_society.1051.d:0 "Jinghai's offices, garrisons and schools all report understaffing. Sending an invitation and translated appointment costs real treasury funds; filling the post locally ends the exchange. A paid invitation is not collected twice on reconsideration."
 ywc_society.1051.invite:0 "Pay 500 to send an invitation and translated appointment"
 ywc_society.1051.invite.cost_tooltip:0 "Jinghai pays 500 from its treasury."
 ywc_society.1051.invite.consequence_tooltip:0 "The invitation and translation are filed; the credential review follows."
 ywc_society.1051.reuse:0 "Use the paid invitation record"
 ywc_society.1051.reuse.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1051.reuse.consequence_tooltip:0 "The invitation and translation are filed; the credential review follows."
 ywc_society.1051.local:0 "Fill the post with local hires instead"
 ywc_society.1051.local.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1051.local.consequence_tooltip:0 "The post is filled locally; the exchange closes as refused."
 ywc_society.1051.wait:0 "Wait and review again"
 ywc_society.1051.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1051.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1052.t:0 "Qualifications Beyond Language"
 ywc_society.1052.d:0 "The visitor carries case notes and ledgers beyond language skill. Jinghai may register the appointment, allow a probation under local guarantors, or reject the credentials and send the papers back."
 ywc_society.1052.register:0 "Recognize the credentials and register the appointment"
 ywc_society.1052.register.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1052.register.consequence_tooltip:0 "The registration is filed; the term report returns to Korea."
 ywc_society.1052.probation:0 "Allow one year of probation under local guarantors"
 ywc_society.1052.probation.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1052.probation.consequence_tooltip:0 "The probation and guarantors are filed; the term report returns to Korea."
 ywc_society.1052.reject:0 "Reject the credentials and return the papers"
 ywc_society.1052.reject.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1052.reject.consequence_tooltip:0 "The credentials are rejected; the exchange closes as refused."
 ywc_society.1052.wait:0 "Wait and review again"
 ywc_society.1052.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1052.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1053.t:0 "The Homecoming Report"
 ywc_society.1053.d:0 "The first term report has reached Korea. The school may pay to compile and file it, or dispute the report and leave the argument to the factions."
 ywc_society.1053.endorse:0 "Pay 500 to compile and file the teaching report"
 ywc_society.1053.endorse.cost_tooltip:0 "Korea pays 500 from its treasury."
 ywc_society.1053.endorse.consequence_tooltip:0 "The report is filed; the second letter will reach the Korean court."
 ywc_society.1053.dispute:0 "Dispute the report and leave it to faction argument"
 ywc_society.1053.dispute.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1053.dispute.consequence_tooltip:0 "The dispute is filed; the second letter will still reach the Korean court."
 ywc_society.1053.wait:0 "Wait before responding"
 ywc_society.1053.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1053.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1054.t:0 "The Exile's Second Letter"
 ywc_society.1054.d:0 "Some at court call the departed an exile, and a second letter arrives. Answering and filing the correspondence costs funds; archiving it as a faction record answers nothing."
 ywc_society.1054.answer:0 "Pay 500 to answer and file the correspondence"
 ywc_society.1054.answer.cost_tooltip:0 "Korea pays 500 from its treasury."
 ywc_society.1054.answer.consequence_tooltip:0 "The correspondence is filed; Jinghai will face its local credential dispute."
 ywc_society.1054.archive:0 "File it as a faction record only"
 ywc_society.1054.archive.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1054.archive.consequence_tooltip:0 "The faction record is filed; Jinghai will face its local credential dispute."
 ywc_society.1054.wait:0 "Wait before responding"
 ywc_society.1054.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1054.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1055.t:0 "The Unrecognized Certificate"
 ywc_society.1055.d:0 "Jinghai's local guilds and staff refuse the foreign credentials. Upholding the registration with guarantors costs real treasury funds; the post may be downgraded to a limited visiting seat, or revoked. A paid sponsorship is not collected twice on reconsideration."
 ywc_society.1055.uphold:0 "Pay 1,000 to uphold the registration with local guarantors"
 ywc_society.1055.uphold.cost_tooltip:0 "Jinghai pays 1,000 from its treasury."
 ywc_society.1055.uphold.consequence_tooltip:0 "The registration stands with guarantors; the placement decision follows."
 ywc_society.1055.downgrade:0 "Downgrade to a limited visiting seat"
 ywc_society.1055.downgrade.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1055.downgrade.consequence_tooltip:0 "The seat is downgraded to a limited visiting appointment."
 ywc_society.1055.revoke:0 "Revoke the appointment and return the papers"
 ywc_society.1055.revoke.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1055.revoke.consequence_tooltip:0 "The appointment is revoked; the exchange closes as refused."
 ywc_society.1055.wait:0 "Wait and review again"
 ywc_society.1055.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1055.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1056.t:0 "Retain, Return Home, or Seek Elsewhere"
 ywc_society.1056.d:0 "The term and the dispute are both on file. Jinghai may retain the teacher, send them home, or let them seek another post; if Korea is unreachable, Jinghai may close on its own. Expenses already paid are not refunded."
 ywc_society.1056.retain:0 "Retain the teacher and settle the handover to the apprentice"
 ywc_society.1056.retain.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1056.retain.consequence_tooltip:0 "The retention is written to records both sides can read; Korea will read the handover."
 ywc_society.1056.return:0 "Send the teacher home and pass the lesson plan to the local student"
 ywc_society.1056.return.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1056.return.consequence_tooltip:0 "The return is written to records both sides can read; the lesson plan passes to the local student."
 ywc_society.1056.elsewhere:0 "Let them seek another post and close the exchange record"
 ywc_society.1056.elsewhere.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1056.elsewhere.consequence_tooltip:0 "The departure is written to records both sides can read; the exchange closes."
 ywc_society.1056.alone:0 "Close on Jinghai's own record because Korea is unreachable"
 ywc_society.1056.alone.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1056.alone.consequence_tooltip:0 "The case closes on existing records; expenses already paid are not refunded."
 ywc_society.1056.wait:0 "Wait and review again"
 ywc_society.1056.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1056.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1057.t:0 "The Student Takes Over the Lesson Plan"
 ywc_society.1057.d:0 "The local apprentice can now take over the case notes, ledgers and interpretation. Korea may accept the handover or file reservations; either way each side keeps its own school and budget."
 ywc_society.1057.welcome:0 "Accept the local succession"
 ywc_society.1057.welcome.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1057.welcome.consequence_tooltip:0 "Korea gains 5 relations with Jinghai."
 ywc_society.1057.reserve:0 "File reservations and record the differences"
 ywc_society.1057.reserve.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1057.reserve.consequence_tooltip:0 "Korea loses 5 relations with Jinghai."
 ywc_society.1057.wait:0 "Wait before responding"
 ywc_society.1057.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1057.wait.consequence_tooltip:0 "Records this decision."
