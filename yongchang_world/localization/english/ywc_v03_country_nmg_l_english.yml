 ywc_nmg.1222.charter_the_houses.consequence_tooltip:0 "Licenses named; payouts on record."
 ywc_nmg.1222.let_houses_draft:0 "Houses draft their own"
 ywc_nmg.1222.let_houses_draft.cost_tooltip:0 "No outlay; articles stay with the houses."
 ywc_nmg.1222.let_houses_draft.consequence_tooltip:0 "Articles elsewhere; claims knock on private doors."
