 ywc_nmg.1217.t:0 "The Port Rules Conclude"
 ywc_nmg.1217.d:0 "Six months of reports lie ready. Unified, split, or old usage: the brush must fall today."
 ywc_nmg.1217.close_full:0 "Report: rules unified"
 ywc_nmg.1217.close_full.cost_tooltip:0 "Requires a matured six-month review and intact finances."
 ywc_nmg.1217.close_full.consequence_tooltip:0 "Closes as full success on real payments and the matured review."
 ywc_nmg.1217.close_limited:0 "Report: limited rules"
 ywc_nmg.1217.close_limited.cost_tooltip:0 "Requires intact finances."
 ywc_nmg.1217.close_limited.consequence_tooltip:0 "Closes as partial results on the real financial record."
 ywc_nmg.1217.close_setback:0 "Report: rules stranded"
 ywc_nmg.1217.close_setback.cost_tooltip:0 "No gate; the closure exit."
 ywc_nmg.1217.close_setback.consequence_tooltip:0 "Closes as a setback, keeping the record of sums paid."
