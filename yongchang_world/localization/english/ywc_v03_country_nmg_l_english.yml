 ywc_nmg.1212.withdraw_at_1212.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_nmg.1213.t:0 "The Charter Signed"
 ywc_nmg.1213.d:0 "The charter draft is done: berths, rates, and dispute hearing, all listed. Only the signature is missing."
 ywc_nmg.1213.sign_and_open_review:0 "Sign and open the review"
 ywc_nmg.1213.sign_and_open_review.cost_tooltip:0 "No expense; the review advances by real calendar months."
 ywc_nmg.1213.sign_and_open_review.consequence_tooltip:0 "Six unbroken months without war or default mature the review."
 ywc_nmg.1213.wait_at_1113:0 "Defer the decision"
 ywc_nmg.1213.wait_at_1113.cost_tooltip:0 "No expense."
 ywc_nmg.1213.wait_at_1113.consequence_tooltip:0 "Defers one turn; the charter is unsigned."
