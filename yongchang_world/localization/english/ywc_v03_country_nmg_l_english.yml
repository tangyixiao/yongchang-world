 ywc_nmg.1221.withdraw_at_1221.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_nmg.1222.t:0 "Licenses and Articles"
 ywc_nmg.1222.d:0 "The private road needs license articles: payout, audit, suspension, each clause listed."
 ywc_nmg.1222.charter_the_houses:0 "Charter by the office"
