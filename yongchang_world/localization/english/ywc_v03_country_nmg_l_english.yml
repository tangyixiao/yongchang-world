l_english:
 ywc_je_v03_nmg_land_arbitration:0 "The Gulf Land Books and the Old Villages"
 ywc_je_v03_nmg_land_arbitration_reason:0 "Old villages by ancestral line, migrants by new deed. A mixed court, unified titles or protected old boundaries: each costs a real sitting fee and needs a staffed office plus a real land law. A six-month watch decides the result, with a notice at twelve months and an exit at thirty-six."
 ywc_je_v03_nmg_land_settlement:0 "The Last Page of the Survey"
 ywc_je_v03_nmg_land_settlement_reason:0 "The titles are in the book; what remains is tax, migration and settlement. Proceed on a genuine tax base and staffed office, write the result into the country ledger, then free the slot."
 ywc_nmg.1000.t:0 "The Gulf Land Books"
 ywc_nmg.1000.d:0 "Old villages farm by ancestral boundary; migrants clear land on new deeds, and the two paper trails cancel each other inside one office. The council wants a ruling, the community will pay, and the Zhu ritual house asks only whose register counts."
 ywc_nmg.1000.mixed:0 "Constitute a mixed court"
 ywc_nmg.1000.mixed.cost_tooltip:0 "One sitting fee, then permanent administrative cost."
 ywc_nmg.1000.mixed.consequence_tooltip:0 "Unrest eases slowly and bureaucratic strain rises."
 ywc_nmg.1000.unified:0 "Impose a single deed"
 ywc_nmg.1000.unified.cost_tooltip:0 "Most expensive; needs a real land law and a staffed office."
 ywc_nmg.1000.unified.consequence_tooltip:0 "Clearest long-run tax base; the survey offends old boundary holders."
 ywc_nmg.1000.old:0 "Guarantee old districts, shrink the pilot"
 ywc_nmg.1000.old.cost_tooltip:0 "Cheapest; creates no standing bureau."
 ywc_nmg.1000.old.consequence_tooltip:0 "Boundary holders are pleased; new-town growth stalls."
 ywc_nmg.1001.t:0 "The Mixed Court Sits"
 ywc_nmg.1001.d:0 "Three village elders, two migrant delegates and one clerk take their seats. The first case stalls: the migrant deed bears the seal of an abolished county. Whatever is ruled, one side objects."
 ywc_nmg.1001.rule_register:0 "Rule on the surviving register"
 ywc_nmg.1001.rule_register.cost_tooltip:0 "No extra fee."
 ywc_nmg.1001.rule_register.consequence_tooltip:0 "Migrants keep the plot and villages resent it; execution needs a staffed office."
 ywc_nmg.1001.rule_custom:0 "Rule on ancestral custom"
 ywc_nmg.1001.rule_custom.cost_tooltip:0 "No extra fee, but the backlog grows."
 ywc_nmg.1001.rule_custom.consequence_tooltip:0 "Villages hold, and the survey book fills with unresolved entries."
 ywc_nmg.1001.defer:0 "Adjourn and re-enter old files"
 ywc_nmg.1001.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1001.defer.consequence_tooltip:0 "Nothing is settled and unrest keeps accumulating."
 ywc_nmg.1002.t:0 "Clerks Ride Out to Survey"
 ywc_nmg.1002.d:0 "Clerks ride out with cord, ink and a thin register. Villages shift the stones half a foot; migrants add a line on a deed's back. Every plot must be checked, and a shortage halts the work."
 ywc_nmg.1002.finish_survey:0 "Staff it fully and finish at once"
 ywc_nmg.1002.finish_survey.cost_tooltip:0 "A second charge equal to the sitting fee."
 ywc_nmg.1002.finish_survey.consequence_tooltip:0 "The register lands whole; the treasury feels it sharply."
 ywc_nmg.1002.half_survey:0 "Survey the near suburbs only"
 ywc_nmg.1002.half_survey.cost_tooltip:0 "No extra fee."
 ywc_nmg.1002.half_survey.consequence_tooltip:0 "Far districts stay blank and need another ride."
 ywc_nmg.1002.defer:0 "Suspend until the office is staffed"
 ywc_nmg.1002.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1002.defer.consequence_tooltip:0 "The survey stops and migrants keep clearing land."
 ywc_nmg.1003.t:0 "Boundary Stones, New Town Drainage"
 ywc_nmg.1003.d:0 "The stones hold, but the new-town plan fits on half a sheet. The council wants water and road; the community will pay for the canal if the office recognizes their ground."
 ywc_nmg.1003.keep_old:0 "Keep the old line, slow the new town"
 ywc_nmg.1003.keep_old.cost_tooltip:0 "No further charge."
 ywc_nmg.1003.keep_old.consequence_tooltip:0 "Boundary holders are satisfied; new-town growth is blocked for long."
 ywc_nmg.1003.canal_deal:0 "Trade the canal for recognition"
 ywc_nmg.1003.canal_deal.cost_tooltip:0 "Community-funded; no treasury cost."
 ywc_nmg.1003.canal_deal.consequence_tooltip:0 "Parish and community gain; boundary holders read it as a concession."
 ywc_nmg.1003.defer:0 "Shelve the plan"
 ywc_nmg.1003.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1003.defer.consequence_tooltip:0 "The dispute is not solved, only postponed."
 ywc_nmg.1004.t:0 "Migrants and the Survey Book"
 ywc_nmg.1004.d:0 "Migrants keep arriving while the book stays open. Tighten the migration law and the flow thins; starve the office and the book freezes on its last page. Every number here is read by the next tax bill."
 ywc_nmg.1004.keep_recording:0 "Keep recording, add no restriction"
 ywc_nmg.1004.keep_recording.cost_tooltip:0 "No extra fee."
 ywc_nmg.1004.keep_recording.consequence_tooltip:0 "Population and entries both grow; unrest rises for now."
 ywc_nmg.1004.slow_intake:0 "Slow the intake"
 ywc_nmg.1004.slow_intake.cost_tooltip:0 "No fee."
 ywc_nmg.1004.slow_intake.consequence_tooltip:0 "Office pressure eases; waiting migrants are not pleased."
 ywc_nmg.1004.defer:0 "Leave it for next month"
 ywc_nmg.1004.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1004.defer.consequence_tooltip:0 "The book keeps piling up."
 ywc_nmg.1005.t:0 "Water Works and Land Tax"
 ywc_nmg.1005.d:0 "The canal is half built and the tax roll unfinished. The council wants last year's figure, the community wants new acreage counted, the parish wants poor relief kept. Three methods, three rates."
 ywc_nmg.1005.old_assessment:0 "Assess on the old figure"
 ywc_nmg.1005.old_assessment.cost_tooltip:0 "No extra fee."
 ywc_nmg.1005.old_assessment.consequence_tooltip:0 "Collection is smooth and tax reform slips."
 ywc_nmg.1005.new_assessment:0 "Assess on new acreage"
 ywc_nmg.1005.new_assessment.cost_tooltip:0 "No extra fee, but a staffed office must execute it."
 ywc_nmg.1005.new_assessment.consequence_tooltip:0 "A cleaner long-run base, with more resistance now."
 ywc_nmg.1005.defer:0 "Defer the question"
 ywc_nmg.1005.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1005.defer.consequence_tooltip:0 "The roll stays suspended."
 ywc_nmg.1006.t:0 "Six Months of Survey"
 ywc_nmg.1006.d:0 "Six months on, whether the office still stands staffed, the fields still yield and migrants are still shut out decides the route. If any one breaks, the money already spent is wasted."
 ywc_nmg.1006.hold_route:0 "Hold the arrangement"
 ywc_nmg.1006.hold_route.cost_tooltip:0 "No extra fee."
 ywc_nmg.1006.hold_route.consequence_tooltip:0 "The route continues; the monthly review records blockage if conditions slip."
 ywc_nmg.1006.renegotiate:0 "Renegotiate on the spot"
 ywc_nmg.1006.renegotiate.cost_tooltip:0 "No extra fee."
 ywc_nmg.1006.renegotiate.consequence_tooltip:0 "Terms loosen and the payoff shrinks."
 ywc_nmg.1006.defer:0 "Wait another quarter"
 ywc_nmg.1006.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1006.defer.consequence_tooltip:0 "The watch stretches and opportunity cost rises."
 ywc_nmg.1007.t:0 "Settling the Gulf Titles"
 ywc_nmg.1007.d:0 "Settlement day. One copy goes to the office, one to the parish archive, one to the council. The stones still stand, the canal already carries water, and the accounts must clear at once."
 ywc_nmg.1007.settle_full:0 "Settle on the agreed terms"
 ywc_nmg.1007.settle_full.cost_tooltip:0 "Fees already paid are the settlement."
 ywc_nmg.1007.settle_full.consequence_tooltip:0 "Records completion and releases the slot."
 ywc_nmg.1007.settle_partial:0 "Spread it over years"
 ywc_nmg.1007.settle_partial.cost_tooltip:0 "Only half the legacy amount this year."
 ywc_nmg.1007.settle_partial.consequence_tooltip:0 "A compromise, the slot freed, a residue left on the books."
 ywc_nmg.1007.withdraw:0 "Refuse to settle"
 ywc_nmg.1007.withdraw.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1007.withdraw.consequence_tooltip:0 "Records a setback and releases the slot."
 ywc_je_v03_nmg_bilingual_office:0 "One Document, Two Languages"
 ywc_je_v03_nmg_bilingual_office_reason:0 "A standing bilingual office, local translators, or a single official language with appeals. Each needs a real opening fee, and the bilingual route needs real literacy and a staffed office. Six months later read the notice board: no literacy gain means changing the route, and an office with nobody left means a setback."
 ywc_nmg.1010.t:0 "One Document, Two Languages"
 ywc_nmg.1010.d:0 "The office posts its first notice: the community cannot read the Spanish above, the ritual house cannot read the Chinese below. The parish offers a reading room if its mediation is recognized. Three roads, three ledgers."
 ywc_nmg.1010.bilingual:0 "Establish a standing bilingual office"
 ywc_nmg.1010.bilingual.cost_tooltip:0 "One opening fee, then permanent administrative cost."
 ywc_nmg.1010.bilingual.consequence_tooltip:0 "Literacy and acceptance rise; bureaucratic efficiency falls."
 ywc_nmg.1010.local:0 "Contract local translators"
 ywc_nmg.1010.local.cost_tooltip:0 "Moderate fee, settled per batch."
 ywc_nmg.1010.local.consequence_tooltip:0 "Costs stay controlled, coverage stays uneven."
 ywc_nmg.1010.single:0 "Single official language plus appeal"
 ywc_nmg.1010.single.cost_tooltip:0 "Cheapest; almost only paper and ink."
 ywc_nmg.1010.single.consequence_tooltip:0 "Acceptance falls and the risk of unrest rises."
 ywc_nmg.1011.t:0 "The Translators Roster"
 ywc_nmg.1011.d:0 "The roster lies open: three youths from the parish school, two copyists hired by the harbour firms, and one schoolmaster who speaks both tongues but writes one. What the office lacks is people who can write both."
 ywc_nmg.1011.hire_full:0 "Hire the whole roster"
 ywc_nmg.1011.hire_full.cost_tooltip:0 "A second charge equal to the opening fee."
 ywc_nmg.1011.hire_full.consequence_tooltip:0 "Coverage is complete; the treasury feels it now."
 ywc_nmg.1011.hire_thin:0 "Take only the first three"
 ywc_nmg.1011.hire_thin.cost_tooltip:0 "No extra fee."
 ywc_nmg.1011.hire_thin.consequence_tooltip:0 "Enough for the capital; the countryside runs on word of mouth."
 ywc_nmg.1011.defer:0 "Hold the roster"
 ywc_nmg.1011.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1011.defer.consequence_tooltip:0 "Notices stay in one language."
 ywc_nmg.1012.t:0 "Gentry and Parish"
 ywc_nmg.1012.d:0 "The council fears the office favours foreign firms, the parish fears losing its mediation, and the ritual house cares only whether Chinese stays on the register. Whoever nods decides whether the order lands."
 ywc_nmg.1012.court_parish:0 "Bring the parish in"
 ywc_nmg.1012.court_parish.cost_tooltip:0 "No extra fee."
 ywc_nmg.1012.court_parish.consequence_tooltip:0 "Legitimacy and acceptance rise; parish influence grows."
 ywc_nmg.1012.court_council:0 "Let the council oversee it"
 ywc_nmg.1012.court_council.cost_tooltip:0 "No extra fee."
 ywc_nmg.1012.court_council.consequence_tooltip:0 "The books get clearer and the office hands get tied."
 ywc_nmg.1012.defer:0 "Commit to neither"
 ywc_nmg.1012.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1012.defer.consequence_tooltip:0 "The order hangs and literacy work stalls."
 ywc_nmg.1013.t:0 "Schools Feeding the Office"
 ywc_nmg.1013.d:0 "The office needs people; the schools need money. With little school investment the office keeps borrowing clerks from the harbour firms, and borrowed clerks answer the firms first."
 ywc_nmg.1013.fund_schools:0 "Fund the schools"
 ywc_nmg.1013.fund_schools.cost_tooltip:0 "Standing school investment is the cost."
 ywc_nmg.1013.fund_schools.consequence_tooltip:0 "Literacy grows faster and the office stops borrowing clerks."
 ywc_nmg.1013.borrow_staff:0 "Keep borrowing from the firms"
 ywc_nmg.1013.borrow_staff.cost_tooltip:0 "Nothing this term."
 ywc_nmg.1013.borrow_staff.consequence_tooltip:0 "Foreign capital influence deepens and the office is constrained."
 ywc_nmg.1013.defer:0 "Keep things as they are"
 ywc_nmg.1013.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1013.defer.consequence_tooltip:0 "The gap carries into next year."
 ywc_nmg.1014.t:0 "The Notice Board After Six Months"
 ywc_nmg.1014.d:0 "Six months on the office can count whether more or fewer people read the notice board. If literacy has not moved the route must change; if nobody is left to send, it cannot change either."
 ywc_nmg.1014.keep_route:0 "Keep the arrangement"
 ywc_nmg.1014.keep_route.cost_tooltip:0 "No extra fee."
 ywc_nmg.1014.keep_route.consequence_tooltip:0 "If conditions slip the monthly review records blockage."
 ywc_nmg.1014.switch_local:0 "Shift to local translators"
 ywc_nmg.1014.switch_local.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1014.switch_local.consequence_tooltip:0 "Costs fall and so does coverage."
 ywc_nmg.1014.withdraw:0 "Withdraw the office"
 ywc_nmg.1014.withdraw.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1014.withdraw.consequence_tooltip:0 "Records a setback and releases the slot."
 ywc_nmg.1015.t:0 "Filed: A Land in Two Scripts"
 ywc_nmg.1015.d:0 "The last file goes into the archive. The community register, the parish mediation record and the oversight book are all settled here. The bilingual office either becomes standing law or shrinks back to a notice."
 ywc_nmg.1015.close_full:0 "Make it standing"
 ywc_nmg.1015.close_full.cost_tooltip:0 "No extra fee."
 ywc_nmg.1015.close_full.consequence_tooltip:0 "Records completion and releases the slot."
 ywc_nmg.1015.close_partial:0 "Leave it provisional"
 ywc_nmg.1015.close_partial.cost_tooltip:0 "No extra fee."
 ywc_nmg.1015.close_partial.consequence_tooltip:0 "Records a compromise and releases the slot."
 ywc_nmg.1015.withdraw:0 "Withdraw the office"
 ywc_nmg.1015.withdraw.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1015.withdraw.consequence_tooltip:0 "Records a setback and releases the slot."
 ywc_je_v03_nmg_revenue_opening:0 "The Mexico City Bill and the Local Budget"
 ywc_je_v03_nmg_revenue_opening_reason:0 "Opening the account: a fixed share, a joint project, or arrears on the old figure. First read the real subject relation and the overlord's temper, then reconcile the tax base, garrison and office books. This stage opens the account only; terms come later."
 ywc_je_v03_nmg_revenue_negotiation:0 "Negotiation: Terms and Replies"
 ywc_je_v03_nmg_revenue_negotiation_reason:0 "Negotiation: press for the real figure or accept the overlord's floor, depending on real relations and fiscal capacity. A joint project needs real buildings and real money; arrears writes nothing down at all."
 ywc_je_v03_nmg_revenue_settlement:0 "Settlement: Residues and Arrears"
 ywc_je_v03_nmg_revenue_settlement_reason:0 "Settlement: fold the year's remittances, works accounts and garrison muster into one volume. Owning or disputing the residue moves real diplomatic relations. Filing frees the slot."
 ywc_nmg.1020.t:0 "The Bill from Mexico City"
 ywc_nmg.1020.d:0 "A courier brings this year budget, a fifth larger than last. Xinming is a protected subject: the overlord may audit its books, send officers, and sail a squadron into the gulf if it proves difficult. All three roads cost real money and must read Mexico City temper."
 ywc_nmg.1020.fixed:0 "Convert to a fixed share"
 ywc_nmg.1020.fixed.cost_tooltip:0 "One renegotiation fee, then a fixed quarterly remittance."
 ywc_nmg.1020.fixed.consequence_tooltip:0 "Budgetable, but flexibility is gone: a shrinking base still remits."
 ywc_nmg.1020.joint:0 "Propose a joint project"
 ywc_nmg.1020.joint.cost_tooltip:0 "One proposal fee, and the overlord must actually agree."
 ywc_nmg.1020.joint.consequence_tooltip:0 "Costs are shared and half the say over port and garrison goes with them."
 ywc_nmg.1020.arrears:0 "Keep the old figure and fall into arrears"
 ywc_nmg.1020.arrears.cost_tooltip:0 "Nothing paid now; the cash stays home."
 ywc_nmg.1020.arrears.consequence_tooltip:0 "Relations suffer at once and debt pressure accumulates."
 ywc_nmg.1021.t:0 "Checking Base Against Garrison"
 ywc_nmg.1021.d:0 "Before arguing the bill Xinming must know what it holds: harbour cargo, field rolls, barracks musters. If the three do not reconcile, the overlord officer sees it at a glance, and a subject with bad books gets bad terms."
 ywc_nmg.1021.audit_strict:0 "Three months of closed-door reconciliation"
 ywc_nmg.1021.audit_strict.cost_tooltip:0 "Ties up office staff; no extra fee."
 ywc_nmg.1021.audit_strict.consequence_tooltip:0 "Credible books and a basis for talks; efficiency drops meanwhile."
 ywc_nmg.1021.audit_public:0 "Reconcile in public"
 ywc_nmg.1021.audit_public.cost_tooltip:0 "No extra fee."
 ywc_nmg.1021.audit_public.consequence_tooltip:0 "The local community gains confidence; Mexico City sees more clearly."
 ywc_nmg.1021.defer:0 "Postpone the reconciliation"
 ywc_nmg.1021.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1021.defer.consequence_tooltip:0 "With no ledger the terms only worsen."
 ywc_nmg.1022.t:0 "Account Opened: The First Remittance"
 ywc_nmg.1022.d:0 "The account is open. Under a fixed share the first instalment leaves this quarter; under a joint project the fee goes and Mexico City reply is awaited; under arrears nothing leaves and the cost lands in the relations ledger. After this the argument is about terms."
 ywc_nmg.1022.close_account:0 "Close the account, move to negotiation"
 ywc_nmg.1022.close_account.cost_tooltip:0 "No further charge."
 ywc_nmg.1022.close_account.consequence_tooltip:0 "Enters negotiation; the first journal entry completes."
 ywc_nmg.1022.close_account_joint:0 "Close the account (joint project)"
 ywc_nmg.1022.close_account_joint.cost_tooltip:0 "No further charge."
 ywc_nmg.1022.close_account_joint.consequence_tooltip:0 "Enters negotiation; needs genuine overlord consent."
 ywc_nmg.1022.reopen:0 "Hold the account open"
 ywc_nmg.1022.reopen.cost_tooltip:0 "No fee."
 ywc_nmg.1022.reopen.consequence_tooltip:0 "Back to the start, and Mexico City patience thins."
 ywc_nmg.1023.t:0 "Two Papers on the Table"
 ywc_nmg.1023.d:0 "The commissioner brings two sheets: the overlord floor and Xinming real capacity. The distance between them is the whole negotiation. A subject with no leverage can only wear that distance down with time and relations."
 ywc_nmg.1023.press_quota:0 "Press for the real figure"
 ywc_nmg.1023.press_quota.cost_tooltip:0 "No extra fee."
 ywc_nmg.1023.press_quota.consequence_tooltip:0 "Success improves terms; failure damages relations."
 ywc_nmg.1023.accept_floor:0 "Accept the overlord floor"
 ywc_nmg.1023.accept_floor.cost_tooltip:0 "No extra fee, but the remittance is larger."
 ywc_nmg.1023.accept_floor.consequence_tooltip:0 "Relations hold; the treasury stays tight."
 ywc_nmg.1023.defer:0 "Adjourn"
 ywc_nmg.1023.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1023.defer.consequence_tooltip:0 "Every day of delay adds a day of interest."
 ywc_nmg.1024.t:0 "Mexico City Replies"
 ywc_nmg.1024.d:0 "The reply arrives. On paper it is routine; its temperature depends on relations. In decent standing the commissioner leaves a door open on the harbour; in a cold standing the reply says only pay as before."
 ywc_nmg.1024.use_temperature:0 "Read the temper and keep talking"
 ywc_nmg.1024.use_temperature.cost_tooltip:0 "No extra fee."
 ywc_nmg.1024.use_temperature.consequence_tooltip:0 "Depends on real relations; it cannot be forced."
 ywc_nmg.1024.escalate:0 "Put the quarrel on the record"
 ywc_nmg.1024.escalate.cost_tooltip:0 "No fee, but relations suffer."
 ywc_nmg.1024.escalate.consequence_tooltip:0 "The council is pleased; Mexico City remembers the entry."
 ywc_nmg.1024.defer:0 "Leave it unanswered"
 ywc_nmg.1024.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1024.defer.consequence_tooltip:0 "Silence is itself an answer."
 ywc_nmg.1025.t:0 "Splitting Port and Garrison"
 ywc_nmg.1025.d:0 "A joint project needs substance: a quay that takes a ship, or a garrison that appears on the muster. Xinming brings land, men and materials; Mexico City brings ships and instructors. Whoever brings more speaks louder."
 ywc_nmg.1025.share_even:0 "Split it evenly"
 ywc_nmg.1025.share_even.cost_tooltip:0 "Billed at the current share."
 ywc_nmg.1025.share_even.consequence_tooltip:0 "Costs and influence are each split in two."
 ywc_nmg.1025.carry_heavy:0 "Xinming carries more"
 ywc_nmg.1025.carry_heavy.cost_tooltip:0 "Another charge equal to the quota."
 ywc_nmg.1025.carry_heavy.consequence_tooltip:0 "Influence is kept; the treasury tightens again."
 ywc_nmg.1025.defer:0 "Shelve the project"
 ywc_nmg.1025.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1025.defer.consequence_tooltip:0 "The talks lose their strongest card."
 ywc_nmg.1026.t:0 "Negotiation Concluded"
 ywc_nmg.1026.d:0 "The terms are set. A fixed share writes the number down; a joint project writes the split; arrears writes nothing at all, because by now the talks are no longer talks. One last entry must still be settled."
 ywc_nmg.1026.conclude:0 "Conclude and move to settlement"
 ywc_nmg.1026.conclude.cost_tooltip:0 "No further charge."
 ywc_nmg.1026.conclude.consequence_tooltip:0 "Enters settlement; the second journal entry completes."
 ywc_nmg.1026.walk_out:0 "Walk out"
 ywc_nmg.1026.walk_out.cost_tooltip:0 "No fee, but relations take a heavy hit."
 ywc_nmg.1026.walk_out.consequence_tooltip:0 "Back to the opening stage with the cost in relations."
 ywc_nmg.1026.defer:0 "One more round"
 ywc_nmg.1026.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1026.defer.consequence_tooltip:0 "The talks drag and interest keeps running."
 ywc_nmg.1027.t:0 "Settlement Day"
 ywc_nmg.1027.d:0 "On settlement day the office, council, parish and community delegates attend. On the table lie the year remittances, the harbour accounts and the garrison muster. The arrears road does not arrive here: it only leaves a deepening mark."
 ywc_nmg.1027.settle_full:0 "Settle in full"
 ywc_nmg.1027.settle_full.cost_tooltip:0 "Fees already paid are the settlement."
 ywc_nmg.1027.settle_full.consequence_tooltip:0 "Records completion and releases the slot."
 ywc_nmg.1027.settle_partial:0 "Settle in instalments"
 ywc_nmg.1027.settle_partial.cost_tooltip:0 "Only half is settled this term."
 ywc_nmg.1027.settle_partial.consequence_tooltip:0 "A compromise, the slot freed, a residue left on the books."
 ywc_nmg.1027.defer:0 "Hold one more month"
 ywc_nmg.1027.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1027.defer.consequence_tooltip:0 "Interest keeps running."
 ywc_nmg.1028.t:0 "Residues and Arrears"
 ywc_nmg.1028.d:0 "A residue remains. The quarter that went unpaid does not vanish: it becomes a line in the debt and one more room when Mexico City sends a commissioner. Whether to own it or dispute it divides the benches."
 ywc_nmg.1028.own_arrears:0 "Own the arrears"
 ywc_nmg.1028.own_arrears.cost_tooltip:0 "Settled at the current figure."
 ywc_nmg.1028.own_arrears.consequence_tooltip:0 "Relations take a small hit and the books come clean."
 ywc_nmg.1028.dispute:0 "Record it as disputed"
 ywc_nmg.1028.dispute.cost_tooltip:0 "Nothing leaves this term."
 ywc_nmg.1028.dispute.consequence_tooltip:0 "Relations worsen markedly and debt pressure rises."
 ywc_nmg.1028.defer:0 "Leave it to the next clerk"
 ywc_nmg.1028.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1028.defer.consequence_tooltip:0 "The problem is not solved, only handed on."
 ywc_nmg.1029.t:0 "Filed: The Gulf Ledger"
 ywc_nmg.1029.d:0 "The final entry is filed. Mexico City bill, the local budget, the harbour accounts and the garrison muster go into one volume. The line leaves the agenda, but its result will be read by the next budget, negotiation and crisis."
 ywc_nmg.1029.close_full:0 "File on the concluded terms"
 ywc_nmg.1029.close_full.cost_tooltip:0 "No extra fee."
 ywc_nmg.1029.close_full.consequence_tooltip:0 "Records completion and releases the slot."
 ywc_nmg.1029.close_partial:0 "File with a reservation"
