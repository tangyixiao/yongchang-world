 ywc_nmg.1216.t:0 "The Review Nears Maturity"
 ywc_nmg.1216.d:0 "Monthly ledgers stack; the hall burns lamp oil late. The merchants wait for a verdict."
 ywc_nmg.1216.finalize_review:0 "Close the review"
 ywc_nmg.1216.finalize_review.cost_tooltip:0 "No expense."
 ywc_nmg.1216.finalize_review.consequence_tooltip:0 "A matured review closes clean; otherwise it closes with a flaw."
