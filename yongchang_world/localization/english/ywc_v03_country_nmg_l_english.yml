 ywc_nmg.1212.staff_the_register.cost_tooltip:0 "Pays half a weekly income and adds administration staff."
 ywc_nmg.1212.staff_the_register.consequence_tooltip:0 "Entries on record; disputes get a file."
 ywc_nmg.1212.let_factories_keep_books:0 "Factories keep their own books"
 ywc_nmg.1212.let_factories_keep_books.cost_tooltip:0 "No outlay; books stay at the factories."
 ywc_nmg.1212.let_factories_keep_books.consequence_tooltip:0 "Books elsewhere; every query crosses three doors."
