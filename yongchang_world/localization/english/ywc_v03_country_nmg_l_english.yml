 ywc_nmg.1220.withdraw_at_1220.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_nmg.1220.withdraw_at_1220.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_nmg.1221.t:0 "Seed Coin for the Fund"
 ywc_nmg.1221.d:0 "A pool needs seed coin. The treasury hands up the first bill."
 ywc_nmg.1221.pay_the_seed:0 "Pay the seed"
 ywc_nmg.1221.pay_the_seed.cost_tooltip:0 "Pays half a weekly income; inactive while the treasury cannot cover it."
 ywc_nmg.1221.pay_the_seed.consequence_tooltip:0 "Seed paid; the notes gain a price."
 ywc_nmg.1221.defer_the_seed:0 "Defer the seed"
 ywc_nmg.1221.defer_the_seed.cost_tooltip:0 "No outlay; the fund idles."
 ywc_nmg.1221.defer_the_seed.consequence_tooltip:0 "Insurance on paper; the sea keeps its risks."
 ywc_nmg.1221.wait_at_1201:0 "Defer the decision"
 ywc_nmg.1221.wait_at_1201.cost_tooltip:0 "No expense."
 ywc_nmg.1221.wait_at_1201.consequence_tooltip:0 "Defers one turn; the bill stays on the pile."
