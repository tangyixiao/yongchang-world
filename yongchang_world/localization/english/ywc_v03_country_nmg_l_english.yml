l_english:
 ywc_je_v03_nmg_land_arbitration:0 "The Gulf Land Books and the Old Villages"
 ywc_je_v03_nmg_land_arbitration_reason:0 "Old villages by ancestral line, migrants by new deed. A mixed court, unified titles or protected old boundaries: each costs a real sitting fee and needs a staffed office plus a real land law. A six-month watch decides the result, with a notice at twelve months and an exit at thirty-six."
 ywc_je_v03_nmg_land_settlement:0 "The Last Page of the Survey"
 ywc_je_v03_nmg_land_settlement_reason:0 "The titles are in the book; what remains is tax, migration and settlement. Proceed on a genuine tax base and staffed office, write the result into the country ledger, then free the slot."
 ywc_nmg.1000.t:0 "The Gulf Land Books"
 ywc_nmg.1000.d:0 "Old villages farm by ancestral boundary; migrants clear land on new deeds, and the two paper trails cancel each other inside one office. The council wants a ruling, the community will pay, and the Zhu ritual house asks only whose register counts."
 ywc_nmg.1000.mixed:0 "Constitute a mixed court"
 ywc_nmg.1000.mixed.cost_tooltip:0 "Choosing this route pays the filing fee: annual gross income ÷ 52 (minimum 100). All routes cost the same at this opening. Any later fee is disclosed at its decision."
 ywc_nmg.1000.mixed.consequence_tooltip:0 "The mixed court reduces bureaucracy by 2 for ten years."
 ywc_nmg.1000.unified:0 "Impose a single deed"
 ywc_nmg.1000.unified.cost_tooltip:0 "Choosing this route pays the filing fee: annual gross income ÷ 52 (minimum 100). All routes cost the same at this opening. Any later fee is disclosed at its decision."
 ywc_nmg.1000.unified.consequence_tooltip:0 "Clearest long-run tax base; the survey offends old boundary holders."
 ywc_nmg.1000.old:0 "Guarantee old districts, shrink the pilot"
 ywc_nmg.1000.old.cost_tooltip:0 "Choosing this route pays the filing fee: annual gross income ÷ 52 (minimum 100). All routes cost the same at this opening. Any later fee is disclosed at its decision."
 ywc_nmg.1000.old.consequence_tooltip:0 "Boundary holders are pleased; new-town growth stalls."
 ywc_nmg.1000.wait_for_funds:0 "Wait for funds"
 ywc_nmg.1000.wait_for_funds.cost_tooltip:0 "No additional fee"
 ywc_nmg.1000.wait_for_funds.consequence_tooltip:0 "Keep the current choice and retry when funds are available."
 ywc_nmg.1001.t:0 "The Mixed Court Sits"
 ywc_nmg.1001.d:0 "Three village elders, two migrant delegates and one clerk take their seats. The first case stalls: the migrant deed bears the seal of an abolished county. Whatever is ruled, one side objects."
 ywc_nmg.1001.rule_register:0 "Rule on the surviving register"
 ywc_nmg.1001.rule_register.cost_tooltip:0 "No extra fee."
 ywc_nmg.1001.rule_register.consequence_tooltip:0 "Migrants keep the plot and villages resent it; execution needs a staffed office."
 ywc_nmg.1001.rule_custom:0 "Rule on ancestral custom"
 ywc_nmg.1001.rule_custom.cost_tooltip:0 "No extra fee, but the backlog grows."
 ywc_nmg.1001.rule_custom.consequence_tooltip:0 "Villages hold, and the survey book fills with unresolved entries."
 ywc_nmg.1001.defer:0 "Adjourn and re-enter old files"
 ywc_nmg.1001.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1001.defer.consequence_tooltip:0 "Nothing is settled and unrest keeps accumulating."
 ywc_nmg.1002.t:0 "Clerks Ride Out to Survey"
 ywc_nmg.1002.d:0 "Clerks ride out with cord, ink and a thin register. Villages shift the stones half a foot; migrants add a line on a deed's back. Every plot must be checked, and a shortage halts the work."
 ywc_nmg.1002.finish_survey:0 "Staff it fully and finish at once"
 ywc_nmg.1002.finish_survey.cost_tooltip:0 "A second charge equal to the sitting fee."
 ywc_nmg.1002.finish_survey.consequence_tooltip:0 "The register lands whole; the treasury feels it sharply."
 ywc_nmg.1002.half_survey:0 "Survey the near suburbs only"
 ywc_nmg.1002.half_survey.cost_tooltip:0 "No extra fee."
 ywc_nmg.1002.half_survey.consequence_tooltip:0 "Far districts stay blank and need another ride."
 ywc_nmg.1002.defer:0 "Suspend until the office is staffed"
 ywc_nmg.1002.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1002.defer.consequence_tooltip:0 "The survey stops and migrants keep clearing land."
 ywc_nmg.1003.t:0 "Boundary Stones, New Town Drainage"
 ywc_nmg.1003.d:0 "The stones hold, but the new-town plan fits on half a sheet. The council wants water and road; the community will pay for the canal if the office recognizes their ground."
 ywc_nmg.1003.keep_old:0 "Keep the old line, slow the new town"
 ywc_nmg.1003.keep_old.cost_tooltip:0 "No further charge."
 ywc_nmg.1003.keep_old.consequence_tooltip:0 "Boundary holders are satisfied; new-town growth is blocked for long."
 ywc_nmg.1003.canal_deal:0 "Trade the canal for recognition"
 ywc_nmg.1003.canal_deal.cost_tooltip:0 "Community-funded; no treasury cost."
 ywc_nmg.1003.canal_deal.consequence_tooltip:0 "Parish and community gain; boundary holders read it as a concession."
 ywc_nmg.1003.defer:0 "Shelve the plan"
 ywc_nmg.1003.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1003.defer.consequence_tooltip:0 "The dispute is not solved, only postponed."
 ywc_nmg.1004.t:0 "Migrants and the Survey Book"
 ywc_nmg.1004.d:0 "Migrants keep arriving while the book stays open. Tighten the migration law and the flow thins; starve the office and the book freezes on its last page. Every number here is read by the next tax bill."
 ywc_nmg.1004.keep_recording:0 "Keep recording, add no restriction"
 ywc_nmg.1004.keep_recording.cost_tooltip:0 "No extra fee."
 ywc_nmg.1004.keep_recording.consequence_tooltip:0 "Population and entries both grow; unrest rises for now."
 ywc_nmg.1004.slow_intake:0 "Slow the intake"
 ywc_nmg.1004.slow_intake.cost_tooltip:0 "No fee."
 ywc_nmg.1004.slow_intake.consequence_tooltip:0 "Office pressure eases; waiting migrants are not pleased."
 ywc_nmg.1004.defer:0 "Leave it for next month"
 ywc_nmg.1004.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1004.defer.consequence_tooltip:0 "The book keeps piling up."
 ywc_nmg.1005.t:0 "Water Works and Land Tax"
 ywc_nmg.1005.d:0 "The canal is half built and the tax roll unfinished. The council wants last year's figure, the community wants new acreage counted, the parish wants poor relief kept. Three methods, three rates."
 ywc_nmg.1005.old_assessment:0 "Assess on the old figure"
 ywc_nmg.1005.old_assessment.cost_tooltip:0 "No extra fee."
 ywc_nmg.1005.old_assessment.consequence_tooltip:0 "Collection is smooth and tax reform slips."
 ywc_nmg.1005.new_assessment:0 "Assess on new acreage"
 ywc_nmg.1005.new_assessment.cost_tooltip:0 "No extra fee, but a staffed office must execute it."
 ywc_nmg.1005.new_assessment.consequence_tooltip:0 "A cleaner long-run base, with more resistance now."
 ywc_nmg.1005.defer:0 "Defer the question"
 ywc_nmg.1005.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1005.defer.consequence_tooltip:0 "The roll stays suspended."
 ywc_nmg.1006.t:0 "Six Months of Survey"
 ywc_nmg.1006.d:0 "Six months on, whether the office still stands staffed, the fields still yield and migrants are still shut out decides the route. If any one breaks, the money already spent is wasted."
 ywc_nmg.1006.hold_route:0 "Hold the arrangement"
 ywc_nmg.1006.hold_route.cost_tooltip:0 "No extra fee."
 ywc_nmg.1006.hold_route.consequence_tooltip:0 "The route continues; the monthly review records blockage if conditions slip."
 ywc_nmg.1006.renegotiate:0 "Renegotiate on the spot"
 ywc_nmg.1006.renegotiate.cost_tooltip:0 "No extra fee."
 ywc_nmg.1006.renegotiate.consequence_tooltip:0 "Terms loosen and the payoff shrinks."
 ywc_nmg.1006.defer:0 "Wait another quarter"
 ywc_nmg.1006.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1006.defer.consequence_tooltip:0 "The watch stretches and opportunity cost rises."
 ywc_nmg.1007.t:0 "Settling the Gulf Titles"
 ywc_nmg.1007.d:0 "Settlement day. One copy goes to the office, one to the parish archive, one to the council. The stones still stand, the canal already carries water, and the accounts must clear at once."
 ywc_nmg.1007.settle_full:0 "Settle on the agreed terms"
 ywc_nmg.1007.settle_full.cost_tooltip:0 "Fees already paid are the settlement."
 ywc_nmg.1007.settle_full.consequence_tooltip:0 "Records completion and releases the slot."
 ywc_nmg.1007.settle_partial:0 "Spread it over years"
 ywc_nmg.1007.settle_partial.cost_tooltip:0 "Only half the legacy amount this year."
 ywc_nmg.1007.settle_partial.consequence_tooltip:0 "Old boundaries remain protected; the first choice starts a fresh six-month observation. After it matures, confirm to record the compromise and release the slot."
 ywc_nmg.1007.withdraw:0 "Refuse to settle"
 ywc_nmg.1007.withdraw.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1007.withdraw.consequence_tooltip:0 "Records a setback and releases the slot."
 ywc_nmg.1007.wait_retry:0 "Wait and recheck"
 ywc_nmg.1007.wait_retry.cost_tooltip:0 "No additional fee"
 ywc_nmg.1007.wait_retry.consequence_tooltip:0 "If the target is ineligible, clear stale maturity, preserve the contract, and retry later."
 ywc_je_v03_nmg_bilingual_office:0 "One Document, Two Languages"
 ywc_je_v03_nmg_bilingual_office_reason:0 "A standing bilingual office, local translators, or a single official language with appeals. Each needs a real opening fee, and the bilingual route needs real literacy and a staffed office. Six months later read the notice board: no literacy gain means changing the route, and an office with nobody left means a setback."
 ywc_nmg.1010.t:0 "One Document, Two Languages"
 ywc_nmg.1010.d:0 "The office posts its first notice: the community cannot read the Spanish above, the ritual house cannot read the Chinese below. The parish offers a reading room if its mediation is recognized. Three roads, three ledgers."
 ywc_nmg.1010.bilingual:0 "Establish a standing bilingual office"
 ywc_nmg.1010.bilingual.cost_tooltip:0 "Choosing this route pays one filing fee: annual gross income ÷ 52 (minimum 100). Later full-roster or other fees are disclosed at their decisions; the local-record route has a lower administrative burden."
 ywc_nmg.1010.bilingual.consequence_tooltip:0 "Literacy and acceptance rise; bureaucratic efficiency falls."
 ywc_nmg.1010.local:0 "Contract local translators"
 ywc_nmg.1010.local.cost_tooltip:0 "Choosing this route pays one filing fee: annual gross income ÷ 52 (minimum 100). Later full-roster or other fees are disclosed at their decisions; the local-record route has a lower administrative burden."
 ywc_nmg.1010.local.consequence_tooltip:0 "Costs stay controlled, coverage stays uneven."
 ywc_nmg.1010.single:0 "Single official language plus appeal"
 ywc_nmg.1010.single.cost_tooltip:0 "Choosing this route pays one filing fee: annual gross income ÷ 52 (minimum 100). Later full-roster or other fees are disclosed at their decisions; the local-record route has a lower administrative burden."
 ywc_nmg.1010.single.consequence_tooltip:0 "Acceptance falls and the risk of unrest rises."
 ywc_nmg.1010.wait_for_funds:0 "Wait for funds"
 ywc_nmg.1010.wait_for_funds.cost_tooltip:0 "No additional fee"
 ywc_nmg.1010.wait_for_funds.consequence_tooltip:0 "Keep the current choice and retry when funds are available."
 ywc_nmg.1011.t:0 "The Translators Roster"
 ywc_nmg.1011.d:0 "The roster lies open: three youths from the parish school, two copyists hired by the harbour firms, and one schoolmaster who speaks both tongues but writes one. What the office lacks is people who can write both."
 ywc_nmg.1011.hire_full:0 "Hire the whole roster"
 ywc_nmg.1011.hire_full.cost_tooltip:0 "A second charge equal to the opening fee."
 ywc_nmg.1011.hire_full.consequence_tooltip:0 "Coverage is complete; the treasury feels it now."
 ywc_nmg.1011.hire_thin:0 "Take only the first three"
 ywc_nmg.1011.hire_thin.cost_tooltip:0 "No extra fee."
 ywc_nmg.1011.hire_thin.consequence_tooltip:0 "Enough for the capital; the countryside runs on word of mouth."
 ywc_nmg.1011.defer:0 "Hold the roster"
 ywc_nmg.1011.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1011.defer.consequence_tooltip:0 "Notices stay in one language."
 ywc_nmg.1012.t:0 "Gentry and Parish"
 ywc_nmg.1012.d:0 "The council fears the office favours foreign firms, the parish fears losing its mediation, and the ritual house cares only whether Chinese stays on the register. Whoever nods decides whether the order lands."
 ywc_nmg.1012.court_parish:0 "Bring the parish in"
 ywc_nmg.1012.court_parish.cost_tooltip:0 "No extra fee."
 ywc_nmg.1012.court_parish.consequence_tooltip:0 "Legitimacy and acceptance rise; parish influence grows."
 ywc_nmg.1012.court_council:0 "Let the council oversee it"
 ywc_nmg.1012.court_council.cost_tooltip:0 "No extra fee."
 ywc_nmg.1012.court_council.consequence_tooltip:0 "The books get clearer and the office hands get tied."
 ywc_nmg.1012.defer:0 "Commit to neither"
 ywc_nmg.1012.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1012.defer.consequence_tooltip:0 "The order hangs and literacy work stalls."
 ywc_nmg.1013.t:0 "Schools Feeding the Office"
 ywc_nmg.1013.d:0 "The office needs people; the schools need money. With little school investment the office keeps borrowing clerks from the harbour firms, and borrowed clerks answer the firms first."
 ywc_nmg.1013.fund_schools:0 "Fund the schools"
 ywc_nmg.1013.fund_schools.cost_tooltip:0 "Standing school investment is the cost."
 ywc_nmg.1013.fund_schools.consequence_tooltip:0 "Literacy grows faster and the office stops borrowing clerks."
 ywc_nmg.1013.borrow_staff:0 "Keep borrowing from the firms"
 ywc_nmg.1013.borrow_staff.cost_tooltip:0 "Nothing this term."
 ywc_nmg.1013.borrow_staff.consequence_tooltip:0 "Foreign capital influence deepens and the office is constrained."
 ywc_nmg.1013.defer:0 "Keep things as they are"
 ywc_nmg.1013.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1013.defer.consequence_tooltip:0 "The gap carries into next year."
 ywc_nmg.1014.t:0 "The Notice Board After Six Months"
 ywc_nmg.1014.d:0 "Six months on the office can count whether more or fewer people read the notice board. If literacy has not moved the route must change; if nobody is left to send, it cannot change either."
 ywc_nmg.1014.keep_route:0 "Keep the arrangement"
 ywc_nmg.1014.keep_route.cost_tooltip:0 "No extra fee."
 ywc_nmg.1014.keep_route.consequence_tooltip:0 "If conditions slip the monthly review records blockage."
 ywc_nmg.1014.switch_local:0 "Shift to local translators"
 ywc_nmg.1014.switch_local.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1014.switch_local.consequence_tooltip:0 "Costs fall and so does coverage."
 ywc_nmg.1014.withdraw:0 "Withdraw the office"
 ywc_nmg.1014.withdraw.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1014.withdraw.consequence_tooltip:0 "Records a setback and releases the slot."
 ywc_nmg.1015.t:0 "Filed: A Land in Two Scripts"
 ywc_nmg.1015.d:0 "The last file goes into the archive. The community register, the parish mediation record and the oversight book are all settled here. The bilingual office either becomes standing law or shrinks back to a notice."
 ywc_nmg.1015.close_full:0 "Make it standing"
 ywc_nmg.1015.close_full.cost_tooltip:0 "No extra fee."
 ywc_nmg.1015.close_full.consequence_tooltip:0 "Records completion and releases the slot."
 ywc_nmg.1015.close_partial:0 "Leave it provisional"
 ywc_nmg.1015.close_partial.cost_tooltip:0 "No extra fee."
 ywc_nmg.1015.close_partial.consequence_tooltip:0 "The borrowed single-language roster keeps the office running; the first choice starts a fresh six-month observation. After it matures, confirm to record the compromise and release the slot."
 ywc_nmg.1015.withdraw:0 "Withdraw the office"
 ywc_nmg.1015.withdraw.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1015.withdraw.consequence_tooltip:0 "Records a setback and releases the slot."
 ywc_nmg.1015.wait_retry:0 "Wait and recheck"
 ywc_nmg.1015.wait_retry.cost_tooltip:0 "No additional fee"
 ywc_nmg.1015.wait_retry.consequence_tooltip:0 "If the target is ineligible, clear stale maturity, preserve the contract, and retry later."
 ywc_je_v03_nmg_revenue_opening:0 "The Mexico City Bill and the Local Budget"
 ywc_je_v03_nmg_revenue_opening_reason:0 "Opening the account: a fixed share, a joint project, or arrears on the old figure. First read the real subject relation and the overlord's temper, then reconcile the tax base, garrison and office books. This stage opens the account only; terms come later."
 ywc_je_v03_nmg_revenue_negotiation:0 "Negotiation: Terms and Replies"
 ywc_je_v03_nmg_revenue_negotiation_reason:0 "Negotiation: press for the real figure or accept the overlord's floor, depending on real relations and fiscal capacity. A joint project needs real buildings and real money; arrears writes nothing down at all."
 ywc_je_v03_nmg_revenue_settlement:0 "Settlement: Residues and Arrears"
 ywc_je_v03_nmg_revenue_settlement_reason:0 "Settlement: fold the year's remittances, works accounts and garrison muster into one volume. Owning or disputing the residue moves real diplomatic relations. Filing frees the slot."
 ywc_nmg.1020.t:0 "The Bill from Mexico City"
 ywc_nmg.1020.d:0 "Xinming reviews its fiscal and port accounts. Fixed remittances require the actual Mexican overlord’s response; a joint project lets Xinming choose Mexico or Jinghai and the burden split. Arrears and domestic plans remain available. A route pays one filing fee; signed obligations survive a change of plan."
 ywc_nmg.1020.fixed:0 "Convert to a fixed share"
 ywc_nmg.1020.fixed.cost_tooltip:0 "In addition to the one-time filing fee, Mexican acceptance creates 60 monthly remittances. Each is the filing fee divided by 30 and rounded down to whole currency; missed payments remain arrears."
 ywc_nmg.1020.fixed.consequence_tooltip:0 "Ask the actual Mexican overlord; after refusal or expiry, reissue without another filing fee when no old arrears remain. A monthly check grants +5 bureaucracy for local port-budget administration while eligible. Subject changes remove it immediately; other changes are checked next month."
 ywc_nmg.1020.joint:0 "Invite Mexico to an equal project"
 ywc_nmg.1020.joint.cost_tooltip:0 "Pays one filing fee. If Mexico accepts, the base monthly amount is the filing fee divided by 60 and rounded down to whole currency. For 60 months Xinming pays the base monthly amount monthly and the partner pays the base amount; each pays its own expense and arrears remain due."
 ywc_nmg.1020.joint.consequence_tooltip:0 "Ask the actual Mexican government about a port-and-garrison administrative accounting project. Monthly checks grant Xinming +1 bureaucracy only when both sides are current; no building or force is created."
 ywc_nmg.1020.arrears:0 "Keep the old figure and fall into arrears"
 ywc_nmg.1020.arrears.cost_tooltip:0 "Pays the same one-time filing fee as the other routes; this proposal retains arrears and incurs the stated relations loss."
 ywc_nmg.1020.arrears.consequence_tooltip:0 "Relations immediately fall by 25 and domestic arrears are recorded; legitimacy falls by 4 for ten years. No foreign debt is created."
 ywc_nmg.1020.wait_for_funds:0 "Wait for funds"
 ywc_nmg.1020.wait_for_funds.cost_tooltip:0 "No additional fee"
 ywc_nmg.1020.wait_for_funds.consequence_tooltip:0 "Keep the current choice and retry when funds are available."
 ywc_nmg.1020.domestic:0 "Adopt a domestic budget plan"
 ywc_nmg.1020.domestic.cost_tooltip:0 "Pays the one-time filing fee."
 ywc_nmg.1020.domestic.consequence_tooltip:0 "Uses Xinming’s own tax base and port or garrison without a foreign reply; existing signed obligations remain due."
 ywc_nmg.1020.joint_heavy:0 "Invite Mexico with a heavier Xinming share"
 ywc_nmg.1020.joint_heavy.cost_tooltip:0 "Pays one filing fee. If Mexico accepts, the base monthly amount is the filing fee divided by 60 and rounded down to whole currency. For 60 months Xinming pays twice the base monthly amount monthly and the partner pays the base amount; each pays its own expense and arrears remain due."
 ywc_nmg.1020.joint_heavy.consequence_tooltip:0 "Ask the actual Mexican government about a port-and-garrison administrative accounting project. Monthly checks grant Xinming +1 bureaucracy only when both sides are current; no building or force is created."
 ywc_nmg.1020.joint_jhg:0 "Invite Jinghai to an equal project"
 ywc_nmg.1020.joint_jhg.cost_tooltip:0 "Pays one filing fee. If Jinghai accepts, the base monthly amount is the filing fee divided by 60 and rounded down to whole currency. For 60 months Xinming pays the base monthly amount monthly and the partner pays the base amount; each pays its own expense and arrears remain due."
 ywc_nmg.1020.joint_jhg.consequence_tooltip:0 "Ask the actual Jinghai government about a port-and-garrison administrative accounting project. Monthly checks grant Xinming +1 bureaucracy only when both sides are current; no building or force is created."
 ywc_nmg.1020.joint_jhg_heavy:0 "Invite Jinghai with a heavier Xinming share"
 ywc_nmg.1020.joint_jhg_heavy.cost_tooltip:0 "Pays one filing fee. If Jinghai accepts, the base monthly amount is the filing fee divided by 60 and rounded down to whole currency. For 60 months Xinming pays twice the base monthly amount monthly and the partner pays the base amount; each pays its own expense and arrears remain due."
 ywc_nmg.1020.joint_jhg_heavy.consequence_tooltip:0 "Ask the actual Jinghai government about a port-and-garrison administrative accounting project. Monthly checks grant Xinming +1 bureaucracy only when both sides are current; no building or force is created."
 ywc_nmg.1020.resume_joint:0 "Continue the current project account"
 ywc_nmg.1020.resume_joint.cost_tooltip:0 "No second filing fee."
 ywc_nmg.1020.resume_joint.consequence_tooltip:0 "Continue the pending or signed project; after refusal, choose a partner and share to ask again."
 ywc_nmg.1021.t:0 "Checking Base Against Garrison"
 ywc_nmg.1021.d:0 "Reconciliation starts by listing Xinming port, field, and garrison assets. The office chooses a route from those records; later options read existing facilities, finances, and overlord relations, without an audit visit from a Mexico City official."
 ywc_nmg.1021.audit_strict:0 "Three months of closed-door reconciliation"
 ywc_nmg.1021.audit_strict.cost_tooltip:0 "Ties up office staff; no extra fee."
 ywc_nmg.1021.audit_strict.consequence_tooltip:0 "Credible books and a basis for talks; efficiency drops meanwhile."
 ywc_nmg.1021.audit_public:0 "Reconcile in public"
 ywc_nmg.1021.audit_public.cost_tooltip:0 "No extra fee."
 ywc_nmg.1021.audit_public.consequence_tooltip:0 "The local community gains confidence; Mexico City sees more clearly."
 ywc_nmg.1021.defer:0 "Postpone the reconciliation"
 ywc_nmg.1021.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1021.defer.consequence_tooltip:0 "With no ledger the terms only worsen."
 ywc_nmg.1022.t:0 "Opening the Account: Quota and Project Accounts"
 ywc_nmg.1022.d:0 "The account moves toward negotiation. Fixed remittances and joint projects each require an actual partner acceptance and payments under the agreed terms. Xinming may switch to a domestic budget without a fee refund or cancelling signed obligations."
 ywc_nmg.1022.close_account:0 "Close the account, move to negotiation"
 ywc_nmg.1022.close_account.cost_tooltip:0 "No further charge."
 ywc_nmg.1022.close_account.consequence_tooltip:0 "Continue only while the actual Mexican agreement is current and remittances have no arrears; paid costs are retained."
 ywc_nmg.1022.close_account_joint:0 "Close the account (joint project)"
 ywc_nmg.1022.close_account_joint.cost_tooltip:0 "No further charge."
 ywc_nmg.1022.close_account_joint.consequence_tooltip:0 "Continue only after the selected partner has actually accepted and both sides are current on their monthly contributions."
 ywc_nmg.1022.reopen:0 "Hold the account open"
 ywc_nmg.1022.reopen.cost_tooltip:0 "No fee."
 ywc_nmg.1022.reopen.consequence_tooltip:0 "Back to the start, and Mexico City patience thins."
 ywc_nmg.1022.close_account_domestic:0 "Advance the domestic account"
 ywc_nmg.1022.close_account_domestic.cost_tooltip:0 "No additional charge."
 ywc_nmg.1022.close_account_domestic.consequence_tooltip:0 "Continue with the domestic budget."
 ywc_nmg.1022.switch_domestic:0 "Switch to a domestic budget"
 ywc_nmg.1022.switch_domestic.cost_tooltip:0 "No filing-fee refund; signed remittances remain due."
 ywc_nmg.1022.switch_domestic.consequence_tooltip:0 "Cancel unsigned inquiries and continue the domestic review."
 ywc_nmg.1022.close_account_arrears:0 "Advance the arrears account"
 ywc_nmg.1022.close_account_arrears.cost_tooltip:0 "No second filing fee."
 ywc_nmg.1022.close_account_arrears.consequence_tooltip:0 "Continue reviewing the recorded arrears without implying a new foreign consent or forgiving any other signed obligation."
 ywc_nmg.1023.t:0 "Two Papers on the Table"
 ywc_nmg.1023.d:0 "This step compares the existing relations condition with Xinming's fiscal capacity for the next accounting choice. No commissioner arrives, submits a new offer, or transfers funds. The subject can press or accept using the conditions already in place."
 ywc_nmg.1023.press_quota:0 "Press for the real figure"
 ywc_nmg.1023.press_quota.cost_tooltip:0 "No extra fee."
 ywc_nmg.1023.press_quota.consequence_tooltip:0 "Success improves terms; failure damages relations."
 ywc_nmg.1023.accept_floor:0 "Accept the overlord floor"
 ywc_nmg.1023.accept_floor.cost_tooltip:0 "No extra fee; records acceptance of the higher quota proposal."
 ywc_nmg.1023.accept_floor.consequence_tooltip:0 "Relations hold; the treasury stays tight."
 ywc_nmg.1023.defer:0 "Adjourn"
 ywc_nmg.1023.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1023.defer.consequence_tooltip:0 "Keeps the account unresolved and queues a retry; this option adds no interest."
 ywc_nmg.1023.local_plan:0 "Review the domestic budget"
 ywc_nmg.1023.local_plan.cost_tooltip:0 "No charge."
 ywc_nmg.1023.local_plan.consequence_tooltip:0 "If no audit was recorded earlier, audit the existing local tax base first; this does not imply foreign consent."
 ywc_nmg.1023.project_plan:0 "Review the signed project"
 ywc_nmg.1023.project_plan.cost_tooltip:0 "No extra fee; signed project expenses remain due."
 ywc_nmg.1023.project_plan.consequence_tooltip:0 "Review the chosen partner’s signed split without implying an extra Mexican reply."
 ywc_nmg.1023.renew_agreement:0 "Ask a partner about a new agreement"
 ywc_nmg.1023.renew_agreement.cost_tooltip:0 "No second filing fee; old arrears must be settled before a new offer."
 ywc_nmg.1023.renew_agreement.consequence_tooltip:0 "Open the inquiry menu in the current stage; old agreements are not overwritten and the existing queue is preserved."
 ywc_nmg.1024.t:0 "Following the Relations Assessment"
 ywc_nmg.1024.d:0 "The next step branches on the current relations value. With relations in range, the talks can continue; otherwise the dispute can be recorded at a relations cost. This choice reads existing relations and receives no new reply from Mexico City."
 ywc_nmg.1024.use_temperature:0 "Read the temper and keep talking"
 ywc_nmg.1024.use_temperature.cost_tooltip:0 "No extra fee."
 ywc_nmg.1024.use_temperature.consequence_tooltip:0 "Depends on real relations; it cannot be forced."
 ywc_nmg.1024.escalate:0 "Put the quarrel on the record"
 ywc_nmg.1024.escalate.cost_tooltip:0 "No fee, but relations suffer."
 ywc_nmg.1024.escalate.consequence_tooltip:0 "The council is pleased; Mexico City remembers the entry."
 ywc_nmg.1024.defer:0 "Leave it unanswered"
 ywc_nmg.1024.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1024.defer.consequence_tooltip:0 "Silence is itself an answer."
 ywc_nmg.1024.local_record:0 "Record the local arrangement"
 ywc_nmg.1024.local_record.cost_tooltip:0 "No charge or foreign relations change."
 ywc_nmg.1024.local_record.consequence_tooltip:0 "Continue to the port and garrison accounts."
 ywc_nmg.1024.project_record:0 "Record the joint-project terms"
 ywc_nmg.1024.project_record.cost_tooltip:0 "No extra fee; signed project expenses remain due."
 ywc_nmg.1024.project_record.consequence_tooltip:0 "Record the existing agreement without changing foreign relations."
 ywc_nmg.1024.renew_agreement:0 "Ask a partner about a new agreement"
 ywc_nmg.1024.renew_agreement.cost_tooltip:0 "No second filing fee; old arrears must be settled before a new offer."
 ywc_nmg.1024.renew_agreement.consequence_tooltip:0 "Open the inquiry menu in the current stage; old agreements are not overwritten and the existing queue is preserved."
 ywc_nmg.1025.t:0 "Port and Garrison Accounts"
 ywc_nmg.1025.d:0 "Review the port and garrison accounts. A joint project keeps its accepted split; the fixed-share route may pay an additional local preparation fee, and a domestic plan retains its own budget. Signed amounts cannot be changed here."
 ywc_nmg.1025.share_even:0 "Confirm the current project or arrears account"
 ywc_nmg.1025.share_even.cost_tooltip:0 "No extra charge; both project participants continue paying their signed monthly expenses."
 ywc_nmg.1025.share_even.consequence_tooltip:0 "Confirm the signed project terms or arrears record; this does not change the agreed split."
 ywc_nmg.1025.carry_heavy:0 "Xinming carries more"
 ywc_nmg.1025.carry_heavy.cost_tooltip:0 "Another charge equal to the quota."
 ywc_nmg.1025.carry_heavy.consequence_tooltip:0 "Influence is kept; the treasury tightens again."
 ywc_nmg.1025.defer:0 "Shelve the project"
 ywc_nmg.1025.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1025.defer.consequence_tooltip:0 "The talks lose their strongest card."
 ywc_nmg.1025.retain_local_budget:0 "Retain the domestic budget"
 ywc_nmg.1025.retain_local_budget.cost_tooltip:0 "No additional charge."
 ywc_nmg.1025.retain_local_budget.consequence_tooltip:0 "Record the budget now; settlement still requires the real tax base and a port or garrison. This creates no foreign contribution or new right."
 ywc_nmg.1025.renew_agreement:0 "Ask a partner about a new agreement"
 ywc_nmg.1025.renew_agreement.cost_tooltip:0 "No second filing fee; old arrears must be settled before a new offer."
 ywc_nmg.1025.renew_agreement.consequence_tooltip:0 "Open the inquiry menu in the current stage; old agreements are not overwritten and the existing queue is preserved."
 ywc_nmg.1026.t:0 "Negotiation Concluded"
 ywc_nmg.1026.d:0 "Fixed remittances and joint projects follow their signed amounts and terms; a domestic budget creates no foreign contribution. This advances the review and neither pays nor forgives arrears."
 ywc_nmg.1026.conclude:0 "Conclude and move to settlement"
 ywc_nmg.1026.conclude.cost_tooltip:0 "No further charge."
 ywc_nmg.1026.conclude.consequence_tooltip:0 "Enters settlement; the second journal entry completes."
 ywc_nmg.1026.walk_out:0 "Walk out"
 ywc_nmg.1026.walk_out.cost_tooltip:0 "No foreign relations change on the domestic plan; other routes lose 25 relations with Mexico if it exists."
 ywc_nmg.1026.walk_out.consequence_tooltip:0 "Return to the active negotiation stage; paid costs remain and signed obligations continue."
 ywc_nmg.1026.defer:0 "One more round"
 ywc_nmg.1026.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1026.defer.consequence_tooltip:0 "The negotiation record remains open; this choice adds no interest."
 ywc_nmg.1026.renew_agreement:0 "Ask a partner about a new agreement"
 ywc_nmg.1026.renew_agreement.cost_tooltip:0 "No second filing fee; old arrears must be settled before a new offer."
 ywc_nmg.1026.renew_agreement.consequence_tooltip:0 "Open the inquiry menu in the current stage; old agreements are not overwritten and the existing queue is preserved."
 ywc_nmg.1027.t:0 "Settlement Day"
 ywc_nmg.1027.d:0 "The final review checks budget and port or garrison accounts. Fixed remittances require a current agreement with no arrears; a joint project requires both parties to pay their agreed expenses. Signed obligations survive settlement and changes of plan."
 ywc_nmg.1027.settle_full:0 "Settle in full"
 ywc_nmg.1027.settle_full.cost_tooltip:0 "Fees already paid are the settlement."
 ywc_nmg.1027.settle_full.consequence_tooltip:0 "Records completion and releases the slot."
 ywc_nmg.1027.settle_partial:0 "Settle in instalments"
 ywc_nmg.1027.settle_partial.cost_tooltip:0 "No additional fee; this choice makes no new payment."
 ywc_nmg.1027.settle_partial.consequence_tooltip:0 "With the six-month observation already mature and the route conditions met, record the compromise and release the slot; no new payment is made."
 ywc_nmg.1027.defer:0 "Hold one more month"
 ywc_nmg.1027.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1027.defer.consequence_tooltip:0 "Settlement remains pending; this choice adds no interest."
 ywc_nmg.1027.wait_retry:0 "Wait and recheck"
 ywc_nmg.1027.wait_retry.cost_tooltip:0 "No additional fee"
 ywc_nmg.1027.wait_retry.consequence_tooltip:0 "If the target is ineligible, clear stale maturity, preserve the contract, and retry later."
 ywc_nmg.1027.switch_domestic:0 "Switch to a domestic budget and restart review"
 ywc_nmg.1027.switch_domestic.cost_tooltip:0 "No refund; signed remittances continue."
 ywc_nmg.1027.switch_domestic.consequence_tooltip:0 "Restart the six-month review."
 ywc_nmg.1027.review_local_audit:0 "Complete the local audit"
 ywc_nmg.1027.review_local_audit.cost_tooltip:0 "No additional fee."
 ywc_nmg.1027.review_local_audit.consequence_tooltip:0 "Audit the existing local tax base and begin a fresh six-month review."
 ywc_nmg.1027.renew_agreement:0 "Ask a partner about a new agreement"
 ywc_nmg.1027.renew_agreement.cost_tooltip:0 "No second filing fee; old arrears must be settled before a new offer."
 ywc_nmg.1027.renew_agreement.consequence_tooltip:0 "Open the inquiry menu in the current stage; old agreements are not overwritten and the existing queue is preserved."
 ywc_nmg.1028.t:0 "Residues and Arrears"
 ywc_nmg.1028.d:0 "An unresolved entry remains in the domestic contract record. The arrears route preserves that entry and applies the relations or legitimacy effects defined by the choices; no foreign debt, interest, or commissioner is created. Council and community positions shape whether to own or dispute the entry."
 ywc_nmg.1028.own_arrears:0 "Own the arrears"
 ywc_nmg.1028.own_arrears.cost_tooltip:0 "No payment; owning the arrears lowers relations by 5."
 ywc_nmg.1028.own_arrears.consequence_tooltip:0 "Records local responsibility for the arrears; relations fall by 5, with no repayment."
 ywc_nmg.1028.dispute:0 "Record it as disputed"
 ywc_nmg.1028.dispute.cost_tooltip:0 "Nothing leaves this term."
 ywc_nmg.1028.dispute.consequence_tooltip:0 "Applies the stated relations change; creates no foreign debt."
 ywc_nmg.1028.defer:0 "Leave it to the next clerk"
 ywc_nmg.1028.defer.cost_tooltip:0 "No fee."
 ywc_nmg.1028.defer.consequence_tooltip:0 "The problem is not solved, only handed on."
 ywc_nmg.1029.t:0 "Filed: The Gulf Ledger"
 ywc_nmg.1029.d:0 "The final entry is filed. Mexico City bill, the local budget, the harbour accounts and the garrison muster go into one volume. The line leaves the agenda, but its result will be read by the next budget, negotiation and crisis."
 ywc_nmg.1029.close_full:0 "File on the concluded terms"
 ywc_nmg.1029.close_full.cost_tooltip:0 "No extra fee."
 ywc_nmg.1029.close_full.consequence_tooltip:0 "Records completion and releases the slot."
 ywc_nmg.1029.close_partial:0 "Close with the current limited settlement"
 ywc_nmg.1029.close_partial.cost_tooltip:0 "No paid fees are refunded; signed obligations continue."
 ywc_nmg.1029.close_partial.consequence_tooltip:0 "Close partially only after the current plan has passed its six-month review and still meets its conditions."
 ywc_nmg.1029.withdraw:0 "Refuse to file"
 ywc_nmg.1029.withdraw.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1029.withdraw.consequence_tooltip:0 "Records a setback, frees the slot, and damages relations besides."
 ywc_nmg.1029.wait_retry:0 "Wait and recheck"
 ywc_nmg.1029.wait_retry.cost_tooltip:0 "No additional fee"
 ywc_nmg.1029.wait_retry.consequence_tooltip:0 "If the target is ineligible, clear stale maturity, preserve the contract, and retry later."
 ywc_nmg.1029.switch_domestic:0 "Switch to a domestic budget and restart review"
 ywc_nmg.1029.switch_domestic.cost_tooltip:0 "No refund; signed remittances continue."
 ywc_nmg.1029.switch_domestic.consequence_tooltip:0 "Preserve any queued work and restart the local review."
 ywc_nmg.1029.select_arrears_limited:0 "Select the limited arrears plan"
 ywc_nmg.1029.select_arrears_limited.cost_tooltip:0 "Relations with Mexico fall by 5; paid fees are not refunded."
 ywc_nmg.1029.select_arrears_limited.consequence_tooltip:0 "Select the limited arrears plan and begin a fresh six-month observation; after it matures, confirm to close."
 ywc_nmg.1029.renew_agreement:0 "Ask a partner about a new agreement"
 ywc_nmg.1029.renew_agreement.cost_tooltip:0 "No second filing fee; old arrears must be settled before a new offer."
 ywc_nmg.1029.renew_agreement.consequence_tooltip:0 "Open the inquiry menu in the current stage; old agreements are not overwritten and the existing queue is preserved."
 ywc_nmg.1030.t:0 "Answer New Ming’s Agreement Proposal"
 ywc_nmg.1030.d:0 "New Ming has proposed an agreement with a defined term, amount and purpose. The available response lists the actual captured terms; acceptance binds the parties to them."
 ywc_nmg.1030.accept:0 "Accept the fixed-remittance agreement"
 ywc_nmg.1030.accept.cost_tooltip:0 "New Ming remits @money![SCOPE.GetValue('ywc_nmg_mexshare_request_monthly')|0v] monthly to Mexico for [SCOPE.GetValue('ywc_nmg_mexshare_request_term')|0v] months; arrears remain due."
 ywc_nmg.1030.accept.consequence_tooltip:0 "Monthly eligibility checks grant New Ming +5 bureaucracy; subject changes remove it immediately and other changes are checked next month. Subject law is unchanged."
 ywc_nmg.1030.refuse:0 "Refuse the proposed share"
 ywc_nmg.1030.refuse.cost_tooltip:0 "No new remittance or cost is created."
 ywc_nmg.1030.refuse.consequence_tooltip:0 "New Ming may wait, ask again, or choose a domestic plan; its filing fee remains paid."
 ywc_nmg.1030.stale_dismiss:0 "Dismiss a stale inquiry"
 ywc_nmg.1030.stale_dismiss.cost_tooltip:0 "No payment."
 ywc_nmg.1030.stale_dismiss.consequence_tooltip:0 "An old answer cannot change a later agreement."
 ywc_nmg.1030.accept_joint:0 "Accept the joint-project split"
 ywc_nmg.1030.accept_joint.cost_tooltip:0 "For [SCOPE.GetValue('ywc_nmg_jointproject_request_term')|0v] months New Ming pays @money![SCOPE.GetValue('ywc_nmg_jointproject_request_own')|0v] monthly and this country pays @money![SCOPE.GetValue('ywc_nmg_jointproject_request_partner_amount')|0v] monthly; each pays its own expense and arrears remain due."
 ywc_nmg.1030.accept_joint.consequence_tooltip:0 "The project covers port-and-garrison administrative accounts; New Ming gains +1 bureaucracy when both monthly shares are current. No building or force is created."
 ywc_nmg.1031.t:0 "Fiscal or Project Agreement Ends"
 ywc_nmg.1031.d:0 "Ends only the captured agreement generation; paid history and arrears remain."
 ywc_nmg.1032.t:0 "Choose a New Agreement"
 ywc_nmg.1032.d:0 "No previous agreement can currently continue, and old arrears are settled. Choose the partner and burden split for a new independent response, or send no inquiry."
 ywc_nmg.1032.fixed:0 "Reoffer fixed remittances to Mexico"
 ywc_nmg.1032.fixed.cost_tooltip:0 "No new filing fee. The proposed monthly amount is the original filing fee divided by 30 and rounded down, for 60 months."
 ywc_nmg.1032.fixed.consequence_tooltip:0 "Mexico receives a new independent inquiry; old answers and old endpoint events cannot sign or end the new agreement."
 ywc_nmg.1032.joint:0 "Invite Mexico to an equal project"
 ywc_nmg.1032.joint.cost_tooltip:0 "No new filing fee. The base monthly amount is the original filing fee divided by 60 and rounded down; each pays it monthly, for 60 months."
 ywc_nmg.1032.joint.consequence_tooltip:0 "Ask the actual Mexican government about a port-and-garrison administrative accounting project. Monthly checks grant Xinming +1 bureaucracy only when both sides are current; no building or force is created."
 ywc_nmg.1032.joint_heavy:0 "Invite Mexico with a heavier Xinming share"
 ywc_nmg.1032.joint_heavy.cost_tooltip:0 "No new filing fee. The base monthly amount is the original filing fee divided by 60 and rounded down; each pays it monthly, with Xinming paying twice that amount, for 60 months."
 ywc_nmg.1032.joint_heavy.consequence_tooltip:0 "Ask the actual Mexican government about a port-and-garrison administrative accounting project. Monthly checks grant Xinming +1 bureaucracy only when both sides are current; no building or force is created."
 ywc_nmg.1032.joint_jhg:0 "Invite Jinghai to an equal project"
 ywc_nmg.1032.joint_jhg.cost_tooltip:0 "No new filing fee. The base monthly amount is the original filing fee divided by 60 and rounded down; each pays it monthly, for 60 months."
 ywc_nmg.1032.joint_jhg.consequence_tooltip:0 "Ask the actual Jinghai government about a port-and-garrison administrative accounting project. Monthly checks grant Xinming +1 bureaucracy only when both sides are current; no building or force is created."
 ywc_nmg.1032.joint_jhg_heavy:0 "Invite Jinghai with a heavier Xinming share"
 ywc_nmg.1032.joint_jhg_heavy.cost_tooltip:0 "No new filing fee. The base monthly amount is the original filing fee divided by 60 and rounded down; each pays it monthly, with Xinming paying twice that amount, for 60 months."
 ywc_nmg.1032.joint_jhg_heavy.consequence_tooltip:0 "Ask the actual Jinghai government about a port-and-garrison administrative accounting project. Monthly checks grant Xinming +1 bureaucracy only when both sides are current; no building or force is created."
 ywc_nmg.1032.cancel:0 "Do not send an inquiry"
 ywc_nmg.1032.cancel.cost_tooltip:0 "No charge."
 ywc_nmg.1032.cancel.consequence_tooltip:0 "Preserve the current stage’s ordinary queue."
 ywc_nmg.1033.t:0 "A Market for New Ming"
 ywc_nmg.1033.d:0 "New Ming has paid a fixed remittance and asks to manage its own market. The existing agreement is @money![SCOPE.GetValue('ywc_nmg_market_contract_monthly')|0v] per month for [SCOPE.GetValue('ywc_nmg_market_contract_term')|0v] months from its original signature. About [SCOPE.GetValue('ywc_nmg_market_remaining_months')|0v] calendar months remained when this request was sent; the original exact deadline still applies and is not restarted by approval. Arrears remain due. Acceptance separates New Ming from the current shared market and may disrupt supplies. The pact does not change subject status, either side may break it, and its maintenance condition fails on a later check if payments lapse, the agreement ends or the direct subject relationship is lost."
 ywc_nmg.1033.accept:0 "Agree to New Ming market control"
 ywc_nmg.1033.accept.cost_tooltip:0 "No extra remittance; the existing agreement continues."
 ywc_nmg.1033.accept.consequence_tooltip:0 "New Ming leaves the shared market and manages its own market. The pact can be broken; arrears are not forgiven."
 ywc_nmg.1033.refuse:0 "Refuse the market-control request"
 ywc_nmg.1033.refuse.cost_tooltip:0 "No additional cost; existing remittances remain due."
 ywc_nmg.1033.refuse.consequence_tooltip:0 "This response does not change market control; New Ming may ask again after the cooldown."
 ywc_nmg.1033.stale_dismiss:0 "Dismiss a stale request"
 ywc_nmg.1033.stale_dismiss.cost_tooltip:0 "No payment."
 ywc_nmg.1033.stale_dismiss.consequence_tooltip:0 "An old request cannot change a current agreement or market."
 ywc_je_v03_nmg_parish_school:0 "Parish Bells and the Guild Timetable"
 ywc_je_v03_nmg_parish_school_reason:0 "Responsibility is fixed before classes start: joint, parish-split or secular coordination is chosen from current religion and education laws, school investment and real staffed posts, or an explicit limited local classroom. The registry fee is a real treasury debit and only the truly signed timetable hands off."
 ywc_je_v03_nmg_parish_settlement:0 "Continuous Duty and the Next School Year"
 ywc_je_v03_nmg_parish_settlement_reason:0 "Signing is followed by service: the second wage is debited at the current rate, the duty audit reads real employment and living institutions, and six months of genuine attendance decide the result. Any current obligation loss is recorded, recovery needs an explicit restart, and closing or recounting rechecks the facts once more."
 ywc_nmg.1110.t:0 "Which Rings First: Bell or Timetable"
 ywc_nmg.1110.d:0 "Parish bells and the guild timetable cannot ring separately. The office fixes teaching responsibility from current laws, school investment and real staffed posts; under any regime a limited local classroom may be opened alone. The pilot state is chosen once here and never swapped."
 ywc_nmg.1110.joint_school:0 "Joint public school"
 ywc_nmg.1110.joint_school.cost_tooltip:0 "No fee at this step; the registry fee is debited at the current rate next."
 ywc_nmg.1110.joint_school.consequence_tooltip:0 "Requires a current religious or public school law, freedom of conscience, school investment, staffed office and university academics, and one governing group's current support."
 ywc_nmg.1110.parish_split:0 "Parish split"
 ywc_nmg.1110.parish_split.cost_tooltip:0 "No fee at this step; the registry fee is debited at the current rate next."
 ywc_nmg.1110.parish_split.consequence_tooltip:0 "Requires religious schools, state religion or freedom of conscience, school investment, staffed office and university clergymen, and the devout group's current support."
 ywc_nmg.1110.secular_coordination:0 "Secular coordination"
 ywc_nmg.1110.secular_coordination.cost_tooltip:0 "No fee at this step; both the registry and the wage are debited at the full rate."
 ywc_nmg.1110.secular_coordination.consequence_tooltip:0 "Requires public schools with total separation, higher school investment, fuller office and university staffing, and the intelligentsia's current support."
 ywc_nmg.1110.limited_classroom:0 "Explicit limited local classroom"
 ywc_nmg.1110.limited_classroom.cost_tooltip:0 "No fee at this step; both bills are debited at the limited rate."
 ywc_nmg.1110.limited_classroom.consequence_tooltip:0 "Fits any regime and law: only a real staffed office post at the floor, administration and legitimacy, peace and fiscal safety."
 ywc_nmg.1110.wait_and_defer:0 "Defer the choice"
 ywc_nmg.1110.wait_and_defer.cost_tooltip:0 "No fee."
 ywc_nmg.1110.wait_and_defer.consequence_tooltip:0 "Holds this stage until current facts qualify."
 ywc_nmg.1110.withdraw:0 "Withdraw the line"
 ywc_nmg.1110.withdraw.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1110.withdraw.consequence_tooltip:0 "Records the withdrawal, releases this arc slot and clears only this line's ledger."
 ywc_nmg.1111.t:0 "Who Pays the First Sum"
 ywc_nmg.1111.d:0 "The registry and the curriculum transcript cost real money. Joint and secular routes pay the full rate, the parish split half, a qualified complete old bilingual roster halves the registry, and the limited classroom always pays half. No parish donation and no private payer exist; the treasury debits it all."
 ywc_nmg.1111.pay_register:0 "Debit the registry fee"
 ywc_nmg.1111.pay_register.cost_tooltip:0 "The base is yearly gross income ÷ 52 (at least 100): full for joint and secular, half for parish split and the limited classroom, half registry for a joint route with a qualified complete old bilingual roster. Unaffordable cash, default or bankruptcy block payment."
 ywc_nmg.1111.pay_register.consequence_tooltip:0 "One real debit with a positive paid amount recorded; the old office's past spending is not this line's fee, and narrowing or recounting neither refunds nor recharges."
 ywc_nmg.1111.wait_and_defer:0 "Hold the payment"
 ywc_nmg.1111.wait_and_defer.cost_tooltip:0 "No fee."
 ywc_nmg.1111.wait_and_defer.consequence_tooltip:0 "Pay later when funds exist; no interest or arrears accrue."
 ywc_nmg.1111.withdraw:0 "Abandon the school"
 ywc_nmg.1111.withdraw.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1111.withdraw.consequence_tooltip:0 "Records the withdrawal and releases this arc slot."
 ywc_nmg.1112.t:0 "One Master, Two Letters of Appointment"
 ywc_nmg.1112.d:0 "Letters follow current qualification: a qualified complete old bilingual roster may be reused, a new academic hire needs a full university post, the parish split appoints real clergymen, and the limited classroom takes the staffed local officer. Whoever is appointed is rechecked at every later step."
 ywc_nmg.1112.reuse_bilingual_roster:0 "Reuse the complete old bilingual roster"
 ywc_nmg.1112.reuse_bilingual_roster.cost_tooltip:0 "No fee at this step."
 ywc_nmg.1112.reuse_bilingual_roster.consequence_tooltip:0 "Available only while the old office truly completed in full and its current office staffing, school investment and literacy still qualify; the same roster is rechecked throughout."
 ywc_nmg.1112.hire_academic:0 "Hire a university academic"
 ywc_nmg.1112.hire_academic.cost_tooltip:0 "No fee at this step."
 ywc_nmg.1112.hire_academic.consequence_tooltip:0 "Requires an academic truly employed at a staffed university at the full threshold."
 ywc_nmg.1112.appoint_clergy:0 "Appoint a parish clergyman"
 ywc_nmg.1112.appoint_clergy.cost_tooltip:0 "No fee at this step."
 ywc_nmg.1112.appoint_clergy.consequence_tooltip:0 "The parish-split route requires a clergyman truly employed at the university at the floor threshold."
 ywc_nmg.1112.local_instructor:0 "Engage the local staffed officer"
 ywc_nmg.1112.local_instructor.cost_tooltip:0 "No fee at this step."
 ywc_nmg.1112.local_instructor.consequence_tooltip:0 "The limited classroom needs only a real staffed office post at the floor, no university or school investment."
 ywc_nmg.1112.wait_and_defer:0 "Hold the letters"
 ywc_nmg.1112.wait_and_defer.cost_tooltip:0 "No fee."
 ywc_nmg.1112.wait_and_defer.consequence_tooltip:0 "Without a roster the timetable cannot be signed."
 ywc_nmg.1112.withdraw:0 "Withdraw the letters"
 ywc_nmg.1112.withdraw.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1112.withdraw.consequence_tooltip:0 "Records the withdrawal and releases this arc slot."
 ywc_nmg.1113.t:0 "One Timetable, Three Seals"
 ywc_nmg.1113.d:0 "Office, parish and guild seal one timetable. The current policy, the roster and the paid sums are rechecked first; a signed parish split is just as full a route and never degrades itself to limited. After signing, responsibility passes to the settlement volume."
 ywc_nmg.1113.sign_curriculum:0 "Sign the timetable and hand off"
 ywc_nmg.1113.sign_curriculum.cost_tooltip:0 "No fee at this step."
 ywc_nmg.1113.sign_curriculum.consequence_tooltip:0 "Current laws, institutions, the governing group, real staffing and the adopted teacher source are all rechecked now; after signing, settlement can still be entered and left even if the state is lost."
 ywc_nmg.1113.wait_and_defer:0 "Delay the signing"
 ywc_nmg.1113.wait_and_defer.cost_tooltip:0 "No fee."
 ywc_nmg.1113.wait_and_defer.consequence_tooltip:0 "The timetable stays unsigned; responsibility stays with the office."
 ywc_nmg.1113.withdraw:0 "Tear up the timetable"
 ywc_nmg.1113.withdraw.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1113.withdraw.consequence_tooltip:0 "Records the withdrawal and releases this arc slot."
 ywc_nmg.1114.t:0 "A Wage Still Owed in the Absence Book"
 ywc_nmg.1114.d:0 "The second sum is the wage, debited from the treasury at the current rate: full for joint, half for the parish split, one and a half for secular coordination, half for the limited classroom. It is not a parish account or a foreign receipt; without cash nothing is debited."
 ywc_nmg.1114.pay_wages:0 "Debit the wage"
 ywc_nmg.1114.pay_wages.cost_tooltip:0 "Full for joint, half for parish split and the limited classroom, one and a half for secular coordination; the base is yearly gross income ÷ 52 (at least 100). Unaffordable cash, default or bankruptcy block payment."
 ywc_nmg.1114.pay_wages.consequence_tooltip:0 "One real debit with a positive paid amount recorded; no refund, no top-up, no second charge."
 ywc_nmg.1114.wait_and_defer:0 "Hold the wage"
 ywc_nmg.1114.wait_and_defer.cost_tooltip:0 "No fee."
 ywc_nmg.1114.wait_and_defer.consequence_tooltip:0 "While the wage is unpaid the audit cannot begin."
 ywc_nmg.1114.withdraw:0 "Stop the classes"
 ywc_nmg.1114.withdraw.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1114.withdraw.consequence_tooltip:0 "Records the withdrawal and releases this arc slot; reachable even after losing the state post-signing."
 ywc_nmg.1115.t:0 "What Parish and Guild Owe Separately"
 ywc_nmg.1115.d:0 "The audit accepts no donation: the office reads actual employment, employers and living institutions item by item, records the responsible office, teacher and curriculum, and opens the six-month watch. If any entry fails to match, the audit cannot pass."
 ywc_nmg.1115.audit_teaching_duties:0 "Audit the teaching duties"
 ywc_nmg.1115.audit_teaching_duties.cost_tooltip:0 "No fee here, and no received-funds marker is created."
 ywc_nmg.1115.audit_teaching_duties.consequence_tooltip:0 "The teacher source and every duty snapshot are rechecked now; on passing, the watch counts from zero."
 ywc_nmg.1115.wait_and_defer:0 "Defer the audit"
 ywc_nmg.1115.wait_and_defer.cost_tooltip:0 "No fee."
 ywc_nmg.1115.wait_and_defer.consequence_tooltip:0 "The watch has not begun; duties remain unrecorded."
 ywc_nmg.1115.withdraw:0 "Dissolve the arrangement"
 ywc_nmg.1115.withdraw.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1115.withdraw.consequence_tooltip:0 "Records the withdrawal and releases this arc slot."
 ywc_nmg.1116.t:0 "Six Months of Attendance"
 ywc_nmg.1116.d:0 "Attendance is recorded month by month: six full months are needed before closing may be requested, and with genuine maturity, both sums paid and a current obligation lost, an honest setback may be requested. After an interruption nothing resumes by itself; only an explicit restart or a real limited re-engagement counts six fresh months."
 ywc_nmg.1116.request_full:0 "Request the full closing"
 ywc_nmg.1116.request_full.cost_tooltip:0 "No additional fee."
 ywc_nmg.1116.request_full.consequence_tooltip:0 "Requires genuine maturity, both positive paid sums and intact current obligations; closing rechecks once more."
 ywc_nmg.1116.request_limited:0 "Request the limited closing"
 ywc_nmg.1116.request_limited.cost_tooltip:0 "No additional fee."
 ywc_nmg.1116.request_limited.consequence_tooltip:0 "The limited classroom requests closing under the same genuine maturity and paid sums."
 ywc_nmg.1116.request_setback:0 "Request an honest setback"
 ywc_nmg.1116.request_setback.cost_tooltip:0 "No additional fee."
 ywc_nmg.1116.request_setback.consequence_tooltip:0 "Only with genuine maturity, both sums paid and a current obligation truly lost; once recovered the old request is inert."
 ywc_nmg.1116.restart_review:0 "Restart the watch explicitly"
 ywc_nmg.1116.restart_review.cost_tooltip:0 "No additional fee."
 ywc_nmg.1116.restart_review.consequence_tooltip:0 "Once current obligations are restored, clears the interruption and counts six fresh months from zero."
 ywc_nmg.1116.narrow_and_recount:0 "Re-engage limited and recount"
 ywc_nmg.1116.narrow_and_recount.cost_tooltip:0 "No refund and no recharge; both paid sums are retained."
 ywc_nmg.1116.narrow_and_recount.consequence_tooltip:0 "Truly re-engages the staffed local officer as the fourth teacher kind, syncs every duty snapshot, clears requests and maturity, and counts six fresh months."
 ywc_nmg.1116.wait_and_defer:0 "Keep the watch running"
 ywc_nmg.1116.wait_and_defer.cost_tooltip:0 "No fee."
 ywc_nmg.1116.wait_and_defer.consequence_tooltip:0 "The watch keeps counting; decide later."
 ywc_nmg.1116.withdraw:0 "Stop the watch"
 ywc_nmg.1116.withdraw.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1116.withdraw.consequence_tooltip:0 "Records the withdrawal and releases this arc slot."
 ywc_nmg.1117.t:0 "Who Answers for the Next School Year"
 ywc_nmg.1117.d:0 "Current facts are rechecked before closing: full and limited each record their result, the setback only honours a loss that still exists, and recounting returns to the watch for six fresh months without recharging. Every result releases this arc slot exactly once."
 ywc_nmg.1117.close_full:0 "Close in full"
 ywc_nmg.1117.close_full.cost_tooltip:0 "The two paid sums are the settlement; no further fee."
 ywc_nmg.1117.close_full.consequence_tooltip:0 "After one more recheck of current obligations, records the full result and releases the slot once."
 ywc_nmg.1117.close_limited:0 "Close as limited"
 ywc_nmg.1117.close_limited.cost_tooltip:0 "The two paid sums are the settlement; no further fee."
 ywc_nmg.1117.close_limited.consequence_tooltip:0 "The limited classroom records its limited result over current facts and releases the slot once."
 ywc_nmg.1117.close_setback:0 "Record the honest setback"
 ywc_nmg.1117.close_setback.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1117.close_setback.consequence_tooltip:0 "Stands only while the current obligation is still lost; once recovered it is inert, leaving recount or withdrawal."
 ywc_nmg.1117.recount:0 "Recount the attendance"
 ywc_nmg.1117.recount.cost_tooltip:0 "No recharge and no refund."
 ywc_nmg.1117.recount.consequence_tooltip:0 "Returns to the watch for six fresh months from zero, keeping both real paid sums and current snapshots."
 ywc_nmg.1117.wait_and_defer:0 "Wait another month"
 ywc_nmg.1117.wait_and_defer.cost_tooltip:0 "No fee."
 ywc_nmg.1117.wait_and_defer.consequence_tooltip:0 "Closing slips a month; the ledger is unchanged."
 ywc_nmg.1117.withdraw:0 "Leave the arrangement"
 ywc_nmg.1117.withdraw.cost_tooltip:0 "Paid fees are not refunded."
 ywc_nmg.1117.withdraw.consequence_tooltip:0 "Records the withdrawal and releases this arc slot, mutually exclusive with the other results."
