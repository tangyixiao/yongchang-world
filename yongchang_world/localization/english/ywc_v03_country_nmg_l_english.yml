 ywc_je_v03_nmg_succ_charter:0 " JE: The Shipowners' Pool"
 ywc_je_v03_nmg_succ_charter_reason:0 "From notes to payout: make sea-risk backing an auditable account."
 ywc_je_v03_nmg_succ_review:0 " JE: The Half-Year Reckoning"
 ywc_je_v03_nmg_succ_review_reason:0 "Six real calendar months of review; war or default breaks it."
 ywc_nmg.1220.t:0 "The Shipowners' Notes"
 ywc_nmg.1220.d:0 "After the typhoon season, notes of sunken hulls circulate. Who stands behind this paper?"
 ywc_nmg.1220.official_fund:0 "An official mutual fund"
 ywc_nmg.1220.official_fund.cost_tooltip:0 "Institution first, costs later; later steps pay half a weekly income."
 ywc_nmg.1220.official_fund.consequence_tooltip:0 "The treasury backs the pool; risk lands on the state."
 ywc_nmg.1220.private_licenses:0 "Private insurance licenses"
 ywc_nmg.1220.private_licenses.cost_tooltip:0 "Same order: institution first, costs later."
 ywc_nmg.1220.private_licenses.consequence_tooltip:0 "Houses take licenses; the office keeps the rules."
 ywc_nmg.1220.state_borrowing:0 "The state borrows directly"
 ywc_nmg.1220.state_borrowing.cost_tooltip:0 "Same order: institution first, costs later."
 ywc_nmg.1220.state_borrowing.consequence_tooltip:0 "Sovereign debt soothes the notes; interest lands on later books."
