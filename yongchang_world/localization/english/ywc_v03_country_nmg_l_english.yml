 ywc_nmg.1215.t:0 "The Old-Usage Quarrel"
 ywc_nmg.1215.d:0 "Factories cite old usage against the new rates; port lords cite the charter against old berths. The hall holds both ends."
 ywc_nmg.1215.apply_the_charter:0 "Rule by the charter"
 ywc_nmg.1215.apply_the_charter.cost_tooltip:0 "No expense."
 ywc_nmg.1215.apply_the_charter.consequence_tooltip:0 "The charter rules and old usage yields; factories keep score."
