 ywc_nmg.1120.t:0 "The Shipowners' Notes"
 ywc_nmg.1120.d:0 "After the typhoon season, notes of sunken hulls circulate. Who stands behind this paper?"
 ywc_nmg.1120.official_fund:0 "An official mutual fund"
 ywc_nmg.1120.official_fund.cost_tooltip:0 "Institution first, costs later; later steps pay half a weekly income."
 ywc_nmg.1120.official_fund.consequence_tooltip:0 "The treasury backs the pool; risk lands on the state."
 ywc_nmg.1120.private_licenses:0 "Private insurance licenses"
 ywc_nmg.1120.private_licenses.cost_tooltip:0 "Same order: institution first, costs later."
 ywc_nmg.1120.private_licenses.consequence_tooltip:0 "Houses take licenses; the office keeps the rules."
 ywc_nmg.1120.state_borrowing:0 "The state borrows directly"
 ywc_nmg.1120.state_borrowing.cost_tooltip:0 "Same order: institution first, costs later."
 ywc_nmg.1120.state_borrowing.consequence_tooltip:0 "Sovereign debt soothes the notes; interest lands on later books."
 ywc_nmg.1120.wait_at_1200:0 "Defer the decision"
 ywc_nmg.1120.wait_at_1200.cost_tooltip:0 "No expense."
 ywc_nmg.1120.wait_at_1200.consequence_tooltip:0 "Defers one turn; the notes still drift."
 ywc_nmg.1120.withdraw_at_1120:0 "Withdraw from this line"
 ywc_nmg.1120.withdraw_at_1120.cost_tooltip:0 "No direct expense; sums already paid are not refunded."
 ywc_nmg.1120.withdraw_at_1120.consequence_tooltip:0 "The line ends, freeing agenda capacity; the record of sums paid is kept."
 ywc_nmg.1121.t:0 "Seed Coin for the Fund"
 ywc_nmg.1121.d:0 "A pool needs seed coin. The treasury hands up the first bill."
 ywc_nmg.1121.pay_the_seed:0 "Pay the seed"
 ywc_nmg.1121.pay_the_seed.cost_tooltip:0 "Pays half a weekly income; inactive while the treasury cannot cover it."
 ywc_nmg.1121.pay_the_seed.consequence_tooltip:0 "Seed paid; the notes gain a price."
 ywc_nmg.1121.defer_the_seed:0 "Defer the seed"
 ywc_nmg.1121.defer_the_seed.cost_tooltip:0 "No outlay; the fund idles."
 ywc_nmg.1121.defer_the_seed.consequence_tooltip:0 "Insurance on paper; the sea keeps its risks."
 ywc_nmg.1121.wait_at_1201:0 "Defer the decision"
 ywc_nmg.1121.wait_at_1201.cost_tooltip:0 "No expense."
