 ywc_nmg.1214.t:0 "First Monthly Port Report"
 ywc_nmg.1214.d:0 "First month under the charter: berth quarrels fall; factory rates still cling to the old list."
 ywc_nmg.1214.continue_review:0 "Continue the review"
 ywc_nmg.1214.continue_review.cost_tooltip:0 "No expense."
 ywc_nmg.1214.continue_review.consequence_tooltip:0 "The review continues until six months pass or it breaks."
