 ywc_mng.1022.t:0 "Granary Terms: Stores and Service"
 ywc_mng.1022.d:0 "Monastery grain ledgers, administrative rolls, and military requisitions sit on the same table. Princes, monasteries, and herders ask who bears storage and service duties. This confirms Khalkha’s proposed co-custody, state-office, or legacy-sharing terms; choosing one does not build a granary, move grain, or change the law. The following six-month review checks actual grain prices and imports, staffed offices, Devout approval, and the selected terms."
