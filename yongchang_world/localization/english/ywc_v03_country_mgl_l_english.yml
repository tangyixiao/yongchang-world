 ywc_mng.1003.withdraw.cost_tooltip:0 "Past costs remain spent."
 ywc_mng.1003.withdraw.consequence_tooltip:0 "Withdraw and release the slot."
 ywc_mng.1004.t:0 "Escort Papers: Terms Verification"
 ywc_mng.1004.d:0 "The retained ledger copy does not clearly assign escort costs and toll rights. Khalkha can confirm its proposed clauses only after checking them line by line; confirmation does not sign for a neighbor or create a new protection or trade commitment."
