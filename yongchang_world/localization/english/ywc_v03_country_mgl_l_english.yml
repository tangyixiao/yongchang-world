 ywc_mng.1004.dual_terms.consequence_tooltip:0 "After confirmation, the dual-corridor watch checks mercantilism, market access ≥0.75, tea exports >50, and at least neutral relations with both Shun and Russia. The fee is paid and nonrefundable; no second debit. Landowner approval +1 was applied at the initial paid selection and expires 730 days after it; this confirmation does not renew it. Six qualifying months accrue after confirmation; the later review card does not restart the clock."
