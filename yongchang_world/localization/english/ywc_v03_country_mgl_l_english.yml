 ywc_mng.1004.resolve_dispute.consequence_tooltip:0 "This can produce only a limited result."
 ywc_mng.1005.t:0 "Six-month Trade Observation"
 ywc_mng.1005.d:0 "The selected trade terms accrue six continuous qualifying months after confirmation. Loss resets the watch; a new six-month run begins once qualification returns. Eligible months may already have elapsed when this card appears; the popup does not restart the clock."
 ywc_mng.1005.review:0 "Continue selected trade review"
 ywc_mng.1005.review.cost_tooltip:0 "No extra charge; continue checking the selected terms’ actual conditions. The watch counts qualifying months after confirmation."
 ywc_mng.1005.review.consequence_tooltip:0 "Continue the existing observation; this card does not restart the clock or grant an agreement, protection, income, or grain."
