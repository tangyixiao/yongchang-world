 ywc_mng.1004.single_terms.consequence_tooltip:0 "After confirmation, the one-sided-cooperation watch checks at least one existing neighbor relation at neutral or better, market access ≥0.50, and tea exports >0. The fee is paid and nonrefundable; no second debit. Landowner approval -1 and Devout approval +1 were applied at the initial paid selection and expire 730 days after it; this confirmation does not renew them. Six qualifying months accrue after confirmation; the later review card does not restart the clock."
