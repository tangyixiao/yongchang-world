l_english:
 ywc_je_v03_mgl_roads_register:0 "Tea Bricks and Northern Market Ledgers"
 ywc_je_v03_mgl_roads_register_reason:0 "Both corridors need escorts while checkpoint officials contest the tolls. Princes, merchants and herders must pay real costs and clarify conflicting readings of the trade papers."
 ywc_je_v03_mgl_roads_review:0 "Corridor Review"
 ywc_je_v03_mgl_roads_review_reason:0 "The route must sustain six consecutive months of market access and relations; any break resets the observation."
 ywc_mng.1000.t:0 "North–South Trade: Cargo Ledgers"
 ywc_mng.1000.d:0 "Caravans demand escorts on both roads as checkpoints dispute tolls."
 ywc_mng.1000.dual:0 "Dual escort: double setup fee"
 ywc_mng.1000.dual.cost_tooltip:0 "One-time setup fee: snapshot opening yearly gross income / 52, clamped to 100–1,000,000,000, then charge the double factor. Nonrefundable; later terms confirmation costs nothing."
 ywc_mng.1000.dual.consequence_tooltip:0 "Entry requires mercantilism, market access ≥0.75, tea exports >50, and existing Shun and Russia with relations at least neutral. Landowner approval +1 is applied on payment and runs 730 days from this first paid selection; later confirmation does not renew it. The six-month watch accrues only after terms are confirmed and qualified."
 ywc_mng.1000.single:0 "One-corridor cooperation: one setup fee"
 ywc_mng.1000.single.cost_tooltip:0 "One-time setup fee: snapshot opening yearly gross income / 52, clamped to 100–1,000,000,000, then charge the one factor. Nonrefundable; later terms confirmation costs nothing."
 ywc_mng.1000.single.consequence_tooltip:0 "Entry requires at least one existing neighbor relation at neutral or better, market access ≥0.50, and tea exports >0. Landowner approval -1 and Devout approval +1 are applied on payment and run 730 days from this first paid selection; later confirmation does not renew them. The six-month watch accrues only after terms are confirmed and qualified."
 ywc_mng.1000.local:0 "Border market: half setup fee"
 ywc_mng.1000.local.cost_tooltip:0 "One-time setup fee: snapshot opening yearly gross income / 52, clamped to 100–1,000,000,000, then charge the half factor. Nonrefundable; later terms confirmation costs nothing."
 ywc_mng.1000.local.consequence_tooltip:0 "Entry requires market access ≥0.35 and grain imports ≥1. Rural Folk approval +1 is applied on payment and runs 730 days from this first paid selection; later confirmation does not renew it. The six-month watch accrues only after terms are confirmed and qualified; no long-distance escort or neighbor cooperation is promised."
 ywc_mng.1000.defer:0 "Defer and retry"
 ywc_mng.1000.defer.cost_tooltip:0 "No charge."
 ywc_mng.1000.defer.consequence_tooltip:0 "No advance or failure."
 ywc_mng.1000.withdraw:0 "Withdraw"
 ywc_mng.1000.withdraw.cost_tooltip:0 "Past costs remain spent."
 ywc_mng.1000.withdraw.consequence_tooltip:0 "Withdraw and release the slot."
 ywc_mng.1001.t:0 "Trade Proposal: Continue or Review"
 ywc_mng.1001.d:0 "Continue the trade proposal whose fee has been paid. Dual escort, one-sided cooperation, and border-market exchange each have distinct market, trade, or relation conditions; this event does not change the selected proposal."
 ywc_mng.1001.review:0 "Review selected trade proposal"
 ywc_mng.1001.review.cost_tooltip:0 "No extra charge; review the selected trade proposal and check market access and relations."
 ywc_mng.1001.review.consequence_tooltip:0 "Continue checking domestic conditions for the selected proposal; this does not change the route or grant an agreement, protection, income, or grain."
 ywc_mng.1001.defer:0 "Defer and retry"
 ywc_mng.1001.defer.cost_tooltip:0 "No charge."
 ywc_mng.1001.defer.consequence_tooltip:0 "No advance or failure."
 ywc_mng.1001.withdraw:0 "Withdraw"
 ywc_mng.1001.withdraw.cost_tooltip:0 "Past costs remain spent."
 ywc_mng.1001.withdraw.consequence_tooltip:0 "Withdraw and release the slot."
 ywc_mng.1002.t:0 "Trade Terms: Escorts and Toll Rights"
 ywc_mng.1002.d:0 "The opening fee has been paid and a Khalkha trade proposal chosen. Carriers ask who will bear escort costs; herders and checkpoint officials dispute toll rights. This confirms Khalkha’s proposed terms, not a new agreement signed by either neighbor. Continuation requirements differ by proposal; later review checks the selected terms’ market, trade, and, where required, relation conditions."
 ywc_mng.1002.defer:0 "Defer and retry"
 ywc_mng.1002.defer.cost_tooltip:0 "No charge."
 ywc_mng.1002.defer.consequence_tooltip:0 "No advance or failure."
 ywc_mng.1002.withdraw:0 "Withdraw"
 ywc_mng.1002.withdraw.cost_tooltip:0 "Past costs remain spent."
 ywc_mng.1002.withdraw.consequence_tooltip:0 "Withdraw and release the slot."
 ywc_mng.1002.dual_terms:0 "Joint corridor clauses"
 ywc_mng.1002.dual_terms.cost_tooltip:0 "Uses the already-paid route fee; no second debit."
 ywc_mng.1002.dual_terms.consequence_tooltip:0 "Continuation conditions: mercantilism, market access ≥0.75, tea exports >50, and at least neutral relations with both Shun and Russia. The fee is paid and nonrefundable; no second debit. Landowner approval +1 was applied at the initial paid selection and expires 730 days after it; this confirmation does not renew it. The six-month watch accrues after later terms confirmation and qualification."
 ywc_mng.1002.single_terms:0 "One-sided escort clauses"
 ywc_mng.1002.single_terms.cost_tooltip:0 "Uses the already-paid route fee; no second debit."
 ywc_mng.1002.single_terms.consequence_tooltip:0 "Continuation conditions: at least one existing neighbor relation at neutral or better, market access ≥0.50, and tea exports >0. The fee is paid and nonrefundable; no second debit. Landowner approval -1 and Devout approval +1 were applied at the initial paid selection and expire 730 days after it; this confirmation does not renew them. The six-month watch accrues after later terms confirmation and qualification."
 ywc_mng.1002.local_terms:0 "Local-market quota"
 ywc_mng.1002.local_terms.cost_tooltip:0 "Uses the already-paid route fee; no second debit."
 ywc_mng.1002.local_terms.consequence_tooltip:0 "Continuation conditions: market access ≥0.35 and grain imports ≥1. The fee is paid and nonrefundable; no second debit. Rural Folk approval +1 was applied at the initial paid selection and expires 730 days after it; this confirmation does not renew it. No long-distance escort is promised. The six-month watch accrues after later terms confirmation and qualification."
 ywc_mng.1003.t:0 "Clarify checkpoint papers: Southern Ledger"
 ywc_mng.1003.d:0 "Caravan ledgers disagree on escort costs and checkpoint toll rights. Khalkha can request a clause-by-clause check or reject the ambiguous wording and leave the dispute open. This is a domestic decision on the proposal, not a neighbor’s assent or signature."
 ywc_mng.1003.clarify:0 "Request a clause-by-clause clarification"
 ywc_mng.1003.clarify.cost_tooltip:0 "Check the merchant ledgers and checkpoint seals at no extra charge."
 ywc_mng.1003.clarify.consequence_tooltip:0 "Checks Khalkha’s proposed escort and toll clauses; it is no new agreement."
 ywc_mng.1003.refuse:0 "Reject the ambiguous terms and keep the dispute open"
 ywc_mng.1003.refuse.cost_tooltip:0 "Paid costs are not refunded."
 ywc_mng.1003.refuse.consequence_tooltip:0 "The dispute remains open for Khalkha to narrow later or withdraw; this does not record the other party’s acceptance or rejection."
 ywc_mng.1003.defer:0 "Defer and retry"
 ywc_mng.1003.defer.cost_tooltip:0 "No charge."
 ywc_mng.1003.defer.consequence_tooltip:0 "No advance or failure."
