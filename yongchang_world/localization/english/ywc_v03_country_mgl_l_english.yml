 ywc_mng.1022.joint_terms:0 "Monastery co-custody clauses"
 ywc_mng.1022.joint_terms.cost_tooltip:0 "Uses the already-paid route fee; no second debit."
 ywc_mng.1022.joint_terms.consequence_tooltip:0 "Continuation conditions: grain price <0.15, grain imports >0, at least one government administration building with employed staff, Devout approval ≥0, and military-expense share ≥0.10. The fee is paid and nonrefundable; no second debit. Devout and Landowner approval +1 were applied at the initial paid selection and expire 730 days after it; this confirmation does not renew them. No granary is built or grain delivered; the six-month watch accrues after later confirmation and qualification."
 ywc_mng.1022.state_terms:0 "State granary clauses"
 ywc_mng.1022.state_terms.cost_tooltip:0 "Uses the already-paid route fee; no second debit."
 ywc_mng.1022.state_terms.consequence_tooltip:0 "Continuation conditions: grain price <0.20, grain imports >0, at least one government administration building with employed staff, and Devout approval ≥0. The fee is paid and nonrefundable; no second debit. Devout approval -1 and Armed Forces approval +1 were applied at the initial paid selection and expire 730 days after it; this confirmation does not renew them. No granary is built or grain delivered; the six-month watch accrues after later confirmation and qualification."
 ywc_mng.1022.legacy_terms:0 "Legacy levy clauses"
 ywc_mng.1022.legacy_terms.cost_tooltip:0 "Uses the already-paid route fee; no second debit."
 ywc_mng.1022.legacy_terms.consequence_tooltip:0 "Continuation conditions: grain price <0.25, grain imports >0, at least one government administration building with employed staff, and Devout approval ≥0. The fee is paid and nonrefundable; no second debit. Devout approval +1 and Rural Folk approval -1 were applied at the initial paid selection and expire 730 days after it; this confirmation does not renew them. No new tax is levied or grain delivered; the six-month watch accrues after later confirmation and qualification."
 ywc_mng.1023.t:0 "Check grain prices: Monastery Note"
 ywc_mng.1023.d:0 "The accounts office checks grain prices and imports, and verifies whether government-administration jobs have actual employees. Completing the selected grain terms requires staffed government administration; no warehouse building, monastery workplace, or specific profession is required. Khalkha can clarify the proposal or reject it and leave the dispute open."
 ywc_mng.1023.clarify:0 "Request a clause-by-clause clarification"
 ywc_mng.1023.clarify.cost_tooltip:0 "Check grain prices, imports, and actually employed government administrators at no extra charge."
 ywc_mng.1023.clarify.consequence_tooltip:0 "Checks Khalkha’s proposed grain-sharing clauses; it builds no granary or delivers grain."
 ywc_mng.1023.refuse:0 "Reject the ambiguous terms and keep the dispute open"
 ywc_mng.1023.refuse.cost_tooltip:0 "Paid costs are not refunded."
 ywc_mng.1023.refuse.consequence_tooltip:0 "The dispute remains open for Khalkha to narrow later or withdraw; this does not record the other party’s acceptance or rejection."
