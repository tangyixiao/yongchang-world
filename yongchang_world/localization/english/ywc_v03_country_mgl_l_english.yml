 ywc_mng.1012.t:0 "Herders’ Notes: Verification and Burden"
 ywc_mng.1012.d:0 "The herders’ notes from merchant houses and monastery treasuries do not always match. Princes want a durable way to check them; herders fear being pursued twice for the same debt. This confirms Khalkha’s proposed arbitration, public-relief, or protective-covenant terms. Choosing a text does not cancel private debts or transfer money to creditors. Later review checks the selected terms’ land law, ranch jobs, wool exports, and, where applicable, state-average living-standard requirements."
 ywc_mng.1012.defer:0 "Defer and retry"
 ywc_mng.1012.defer.cost_tooltip:0 "No charge."
 ywc_mng.1012.defer.consequence_tooltip:0 "No advance or failure."
