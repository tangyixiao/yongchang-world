 ywc_mng.1012.arbitration_terms:0 "Joint arbitration clauses"
 ywc_mng.1012.arbitration_terms.cost_tooltip:0 "Uses the already-paid route fee; no second debit."
 ywc_mng.1012.arbitration_terms.consequence_tooltip:0 "Continuation conditions: tenant-farmers law, state-average living standard ≥10 in at least one state, actual ranch employment, and wool exports >0. The fee is paid and nonrefundable; no second debit. Rural Folk approval +1 and Landowner approval -1 were applied at the initial paid selection and expire 730 days after it; this confirmation does not renew them. Review forgives or transfers no debt; the six-month watch accrues after later terms confirmation and qualification."
 ywc_mng.1012.relief_terms:0 "Public debt-relief clauses"
 ywc_mng.1012.relief_terms.cost_tooltip:0 "Uses the already-paid route fee; no second debit."
 ywc_mng.1012.relief_terms.consequence_tooltip:0 "Entry requires homesteading, a state with average living standard <10 and ranch employment, and wool exports >0. Completion instead requires homesteading, average living standard ≥10 in the ranch-employment state, and wool exports >0. The fee is paid and nonrefundable; no second debit. Rural Folk approval +2 and Devout approval -1 were applied at the initial paid selection and expire 730 days after it; this confirmation does not renew them. No debt is forgiven or relief payment made; the six-month watch accrues after later confirmation and qualification."
 ywc_mng.1012.covenant_terms:0 "Protective covenant clauses"
 ywc_mng.1012.covenant_terms.cost_tooltip:0 "Uses the already-paid route fee; no second debit."
 ywc_mng.1012.covenant_terms.consequence_tooltip:0 "Continuation conditions for the narrower covenant result: serfdom and wool exports >0; ranch employment is an entry condition, not a continuing condition. The fee is paid and nonrefundable; no second debit. Devout approval +1 and Rural Folk approval -1 were applied at the initial paid selection and expire 730 days after it; this confirmation does not renew them. No debt is forgiven or transferred; the six-month watch accrues after later confirmation and qualification."
 ywc_mng.1013.t:0 "Reconcile the accounts: Monastery Note"
 ywc_mng.1013.d:0 "The debt ledgers disagree about debtors and collateral. Khalkha can check the recorded debts and security or reject the ambiguous wording and leave the dispute open; checking the accounts does not forgive debt or transfer a claim."
 ywc_mng.1013.clarify:0 "Request a clause-by-clause clarification"
 ywc_mng.1013.clarify.cost_tooltip:0 "Check the debtors, creditor records, and collateral at no extra charge."
 ywc_mng.1013.clarify.consequence_tooltip:0 "Checks Khalkha’s proposed debt clauses; no debt is forgiven and no claim is transferred."
 ywc_mng.1013.refuse:0 "Reject the ambiguous terms and keep the dispute open"
 ywc_mng.1013.refuse.cost_tooltip:0 "Paid costs are not refunded."
 ywc_mng.1013.refuse.consequence_tooltip:0 "The dispute remains open for Khalkha to narrow later or withdraw; this does not record the other party’s acceptance or rejection."
