 ywc_je_v03_mgl_debt_register:0 "Pastoral Debt Ledger: Term Review"
 ywc_je_v03_mgl_debt_register_reason:0 "Notes are split between merchant houses and monasteries; herder livelihoods, pastoral employment and land law decide which promises can be enforced."
 ywc_je_v03_mgl_debt_review:0 "Pastoral Debt Ledger: Term Review"
 ywc_je_v03_mgl_debt_review_reason:0 "Notes are split between merchant houses and monasteries; herder livelihoods, pastoral employment and land law decide which promises can be enforced."
 ywc_mng.1010.t:0 "Pastoral Debt: Ledgers Arrive"
 ywc_mng.1010.d:0 "Creditors record herd proceeds, trade advances and monastery loans in separate books."
 ywc_mng.1010.dual:0 "Joint arbitration: double setup fee"
 ywc_mng.1010.dual.cost_tooltip:0 "One-time setup fee: snapshot opening yearly gross income / 52, clamped to 100–1,000,000,000, then charge the double factor. Nonrefundable; later terms confirmation costs nothing."
 ywc_mng.1010.dual.consequence_tooltip:0 "Entry requires tenant-farmers law, a ranch building with an actually employed ranch worker, and wool exports >0. Rural Folk approval +1 and Landowner approval -1 are applied on payment and run 730 days from this first paid selection; later confirmation does not renew them. The six-month qualifying watch accrues only after terms are confirmed."
 ywc_mng.1010.single:0 "Public debt relief: one setup fee"
 ywc_mng.1010.single.cost_tooltip:0 "One-time setup fee: snapshot opening yearly gross income / 52, clamped to 100–1,000,000,000, then charge the one factor. Nonrefundable; later terms confirmation costs nothing."
 ywc_mng.1010.single.consequence_tooltip:0 "Entry requires homesteading, a ranch building, a state with average living standard <10 and ranch employment, and wool exports >0. Rural Folk approval +2 and Devout approval -1 are applied on payment and run 730 days from this first paid selection; later confirmation does not renew them. The six-month qualifying watch accrues only after terms are confirmed."
 ywc_mng.1010.local:0 "Protective covenant: half setup fee"
 ywc_mng.1010.local.cost_tooltip:0 "One-time setup fee: snapshot opening yearly gross income / 52, clamped to 100–1,000,000,000, then charge the half factor. Nonrefundable; later terms confirmation costs nothing."
 ywc_mng.1010.local.consequence_tooltip:0 "Entry requires serfdom, a ranch building with an actually employed ranch worker, and wool exports >0. Devout approval +1 and Rural Folk approval -1 are applied on payment and run 730 days from this first paid selection; later confirmation does not renew them. This route’s completion watch requires serfdom and wool exports, not continuing ranch employment; its six-month watch accrues after terms are confirmed."
 ywc_mng.1010.defer:0 "Defer and retry"
