 ywc_je_v03_mgl_grain_register:0 "Princes and Monasteries: Granary Compact"
 ywc_je_v03_mgl_grain_register_reason:0 "Grain prices, Devout support and existing offices determine whether storage and service-sharing can be enforced."
 ywc_je_v03_mgl_grain_review:0 "Granary Compact: Supply Review"
 ywc_je_v03_mgl_grain_review_reason:0 "Grain prices, Devout support and existing offices determine whether storage and service-sharing can be enforced."
 ywc_mng.1020.t:0 "Grain Sharing: Ledgers Arrive"
 ywc_mng.1020.d:0 "Grain prices fluctuate while monastery, princely and office ledgers disagree on storage and labor service."
 ywc_mng.1020.dual:0 "Monastery co-custody: double setup fee"
 ywc_mng.1020.dual.cost_tooltip:0 "One-time setup fee: snapshot opening yearly gross income / 52, clamped to 100–1,000,000,000, then charge the double factor. Nonrefundable; later terms confirmation costs nothing."
 ywc_mng.1020.dual.consequence_tooltip:0 "Entry requires grain price >0.25, Devout approval ≥0, and military-expense share ≥0.10. Devout and Landowner approval +1 are applied on payment and run 730 days from this first paid selection; later confirmation does not renew them. The six-month watch accrues after terms are confirmed and qualified."
 ywc_mng.1020.single:0 "State granary: one setup fee"
 ywc_mng.1020.single.cost_tooltip:0 "One-time setup fee: snapshot opening yearly gross income / 52, clamped to 100–1,000,000,000, then charge the one factor. Nonrefundable; later terms confirmation costs nothing."
 ywc_mng.1020.single.consequence_tooltip:0 "Entry requires grain price >0.15, at least one government administration building with employed administrators, and Devout approval ≥0. Devout approval -1 and Armed Forces approval +1 are applied on payment and run 730 days from this first paid selection; later confirmation does not renew them. The six-month watch accrues after terms are confirmed and qualified."
 ywc_mng.1020.local:0 "Legacy levy: half setup fee"
 ywc_mng.1020.local.cost_tooltip:0 "One-time setup fee: snapshot opening yearly gross income / 52, clamped to 100–1,000,000,000, then charge the half factor. Nonrefundable; later terms confirmation costs nothing."
 ywc_mng.1020.local.consequence_tooltip:0 "Entry requires grain price >0.10 and Devout approval ≥0. Devout approval +1 and Rural Folk approval -1 are applied on payment and run 730 days from this first paid selection; later confirmation does not renew them. The six-month watch accrues after terms are confirmed and qualified."
