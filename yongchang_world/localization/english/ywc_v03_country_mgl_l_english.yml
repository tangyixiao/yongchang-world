 ywc_mng.1011.d:0 "Continue the pastoral-debt proposal whose fee has been paid. Arbitration, public relief, and a protective covenant have different law, employment, living-standard, or export conditions; this event does not change the selected proposal."
 ywc_mng.1011.review:0 "Review selected debt proposal"
 ywc_mng.1011.review.cost_tooltip:0 "No extra charge; review the selected debt proposal and check land law and pastoral employment."
 ywc_mng.1011.review.consequence_tooltip:0 "Continue checking domestic conditions for the selected proposal; this does not change the route or grant an agreement, protection, income, or grain."
