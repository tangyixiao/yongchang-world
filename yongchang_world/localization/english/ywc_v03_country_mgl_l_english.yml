 ywc_mng.1004.local_terms.cost_tooltip:0 "Uses the already-paid route fee; no second debit."
 ywc_mng.1004.local_terms.consequence_tooltip:0 "After confirmation, the border-market watch checks market access ≥0.35 and grain imports ≥1. The fee is paid and nonrefundable; no second debit. Rural Folk approval +1 was applied at the initial paid selection and expires 730 days after it; this confirmation does not renew it. No long-distance escort is included. Six qualifying months accrue after confirmation; the later review card does not restart the clock."
 ywc_mng.1004.resolve_dispute:0 "Settle the dispute on a local cap"
