 ywc_mng.1021.t:0 "Grain Proposal: Continue or Review"
 ywc_mng.1021.d:0 "Continue the paid grain proposal. Its selected terms are checked against grain prices, imports, government-administration employment, and Devout approval. Approval must be at least 0; co-custody also requires military-expense share of at least 0.10."
 ywc_mng.1021.review:0 "Review selected grain proposal"
 ywc_mng.1021.review.cost_tooltip:0 "No extra charge; review the selected grain proposal and check Devout support and office conditions."
 ywc_mng.1021.review.consequence_tooltip:0 "Continue checking domestic conditions for the selected proposal; this does not change the route or grant an agreement, protection, income, or grain."
