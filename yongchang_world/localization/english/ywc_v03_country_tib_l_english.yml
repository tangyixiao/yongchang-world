 ywc_tib.1124.t:0 "Inking the charter and filling the posts"
 ywc_tib.1124.d:0 "The plan must be carried out: office posts must be filled by real staff and the treasury must hold real funds. Continuous observation begins only after final verification, and advances monthly rather than by same-day pulses."
