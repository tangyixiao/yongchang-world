 ywc_tib.1122.t:0 "The traders' offer and the monastic gift"
 ywc_tib.1122.d:0 "Traders offer money for post stations and market order; monasteries offer gifts in lieu of part of the public burden. Each comes with its price. The offices must verify real market access and agricultural employment before counting either source."
