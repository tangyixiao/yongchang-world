 ywc_tib.1123.t:0 "One sum, three ways to write it"
 ywc_tib.1123.d:0 "Written sharing, central taxation and local quotas are mutually exclusive: the same public sum cannot be collected three ways at once. The plan must stand on the current tax laws, staffed administration and state-level conditions."
 ywc_tib.1123.review_next:0 "Confirm the exclusive plan and proceed to execution"
 ywc_tib.1123.review_next.cost_tooltip:0 "No duplicate opening charge; any new expense is gated and cannot advance on failure."
 ywc_tib.1123.review_next.consequence_tooltip:0 "Locks the arc's exclusive route and advances to execution; benefits cannot be stacked with other routes."
