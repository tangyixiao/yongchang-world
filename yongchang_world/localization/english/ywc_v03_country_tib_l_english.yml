 ywc_je_v03_tib_revenue_1:0 "Monastic Estates, Trade Dues and Public Grain: Opening the Council"
 ywc_je_v03_tib_revenue_1_reason:0 "Fixed public expenditure has grown while the old service-and-tax sharing no longer matches. Monasteries, nobles, households, traders and offices must renegotiate under the current tax laws, staffed administration and fiscal conditions."
 ywc_je_v03_tib_revenue_2:0 "Monastic Estates, Trade Dues and Public Grain: Forming the Plan"
 ywc_je_v03_tib_revenue_2_reason:0 "The sharing plan takes shape: verify the ledgers, confirm funding sources and form one of the mutually exclusive written-sharing, central-taxation or local-quota plans."
 ywc_je_v03_tib_revenue_3:0 "Monastic Estates, Trade Dues and Public Grain: Execution and Settlement"
 ywc_je_v03_tib_revenue_3_reason:0 "The chosen sharing plan enters execution: final verification, continuous observation, obstruction notices and a real settlement. Observation advances monthly and does not settle early."
 ywc_tib.1120.t:0 "Three ledgers that no longer match"
 ywc_tib.1120.d:0 "The offices, the monastic treasury and the noble manors each keep their own ledger for the same public expenses. The old service register, granary obligations and trade dues must be reconciled under the current tax laws and staffed administration, not settled by one party alone."
 ywc_tib.1120.route_1:0 "Open talks on a written sharing charter"
 ywc_tib.1120.route_1.cost_tooltip:0 "Pays route 1 costs based on the captured yearly gross income / 52 (reduced to three quarters if the service-register outcome is complete, raised by half if a granary obligation stands); disabled when insolvent or unaffordable."
 ywc_tib.1120.route_1.consequence_tooltip:0 "Monastic and noble estates share public expenses by charter: slightly higher tax capacity, Landowner and Devout discontent, for two years."
 ywc_tib.1120.route_2:0 "Let the offices collect public dues directly"
 ywc_tib.1120.route_2.cost_tooltip:0 "Pays route 2 costs based on the captured yearly gross income / 52 (same legacy adjustments); disabled when insolvent or unaffordable."
 ywc_tib.1120.route_2.consequence_tooltip:0 "Offices collect dues directly, bypassing monastic and noble intermediaries: slightly higher bureaucracy, Devout and Rural Folk burden, for two years."
 ywc_tib.1120.route_3:0 "Assign each state its own quota"
 ywc_tib.1120.route_3.cost_tooltip:0 "Pays route 3 costs based on the captured yearly gross income / 52 (raised by half if a granary obligation stands); disabled when insolvent or unaffordable."
 ywc_tib.1120.route_3.consequence_tooltip:0 "States raise their own public funds at minimal central cost: Landowners and Devout satisfied, slower law enactment, for two years."
 ywc_tib.1120.defer:0 "Defer and retry when conditions recover"
