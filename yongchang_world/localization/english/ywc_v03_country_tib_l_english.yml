 ywc_tib.1121.t:0 "Verifying the old ledgers: service register and granary notes"
 ywc_tib.1121.d:0 "Before talks begin, the old accounts are checked: a completed service-register outcome gives the charter something to stand on, while an unsettled granary obligation makes every new plan first repay old debts. Verification reads real outcome variables, not mere choices."
