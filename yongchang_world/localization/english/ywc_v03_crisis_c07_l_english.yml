l_english:
 ywc_je_v03_c07_contract_annex:0 "The Annex to the Development Contract"
 ywc_je_v03_c07_contract_annex_reason:0 "Register the real industry, land and investment relations: whether the mine is registered, who owns the land, which country's money is behind it. The host audits the dispute and puts the guarantee question; the funder decides on its own to cap, shrink or stop putting in money. The terms name the countries that actually signed, and nobody answers for another."
 ywc_je_v03_c07_interest_public_duty:0 "Interest and the Public Duty"
 ywc_je_v03_c07_interest_public_duty_reason:0 "Rescheduling, disinvestment, shrinkage and public spending each keep their own ledger: the road order follows building capacity, the reschedule is paid from the funder's interest, the accident liability is checked against the register, and the tariff dispute is answered on each side. The completion mark is written only when the execution segment ends, and nobody signs for another."
 ywc_je_v03_c07_who_stays_after:0 "Who Stays after the Development"
 ywc_je_v03_c07_who_stays_after_reason:0 "Examine how the project ends and review it: the phase split, the ledger after withdrawal, two different victories, and finally the aftermath written from each side's actual signature and actual payment. Full agreement, limited project, status quo, withdrawal, fulfillment failed and no talks are all ordinary endings, and normal play continues."
 ywc_crisis.1600.t:0 "A Parcel outside the Contract"
 ywc_crisis.1600.d:0 "The surveyed lode falls outside the signed contract: the host country must first audit the real industry, land and investment relations - whether the mine is actually registered, who owns the land, and which country's money is behind it. Without a real counterparty, no cross-country debt is invented."
 ywc_crisis.1600.register_dispute:0 "Audit the registered mine and land title, then register the dispute"
 ywc_crisis.1600.register_dispute.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1600.register_dispute.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1600.register_land_only:0 "Register only the domestic land dispute, leaving foreign capital out"
 ywc_crisis.1600.register_land_only.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1600.register_land_only.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1600.no_counterparty:0 "No real counterparty; there is nothing to negotiate"
 ywc_crisis.1600.no_counterparty.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1600.no_counterparty.consequence_tooltip:0 "The case closes as no-talks and the capacity slot is released at once."
 ywc_crisis.1600.wait:0 "Wait and re-examine the mine register"
 ywc_crisis.1600.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1600.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1601.t:0 "Public Spending before Profits"
 ywc_crisis.1601.d:0 "Before the mine ships its first cart of ore, the road, the barracks and the village losses are already on the books: the host country decides who bears this public spending - the treasury in advance, shared through the contract, or converted into the laborers' obligation. Only then is the guarantee question put to the funder."
 ywc_crisis.1601.treasury_prepays:0 "The treasury prepays the survey and resettlement costs (200)"
 ywc_crisis.1601.treasury_prepays.cost_tooltip:0 "The holder's treasury pays 200."
 ywc_crisis.1601.treasury_prepays.consequence_tooltip:0 "The prepayment is registered and the guarantee question is sent to the funder."
 ywc_crisis.1601.shared_in_contract:0 "Write it into the contract and share it out of development revenue"
 ywc_crisis.1601.shared_in_contract.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1601.shared_in_contract.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1601.laborers_bear:0 "Convert it into the laborers' obligation for the town to carry"
 ywc_crisis.1601.laborers_bear.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1601.laborers_bear.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1601.wait:0 "Wait and check the accounts once more"
 ywc_crisis.1601.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1601.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1602.t:0 "The Funder Demands Security"
 ywc_crisis.1602.d:0 "The funder's accountants refuse to pay endlessly for a works with no visible return: cap the guarantee to an approved share, shrink the works to what the disbursed funds can bear, or decline any new capital. The guarantee changes neither the host's land title nor its taxation, and it never answers in the host's name."
 ywc_crisis.1602.capped_guarantee:0 "Cap the guarantee to the approved share"
 ywc_crisis.1602.capped_guarantee.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1602.capped_guarantee.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1602.shrink_works:0 "Shrink the works to what the disbursed funds can bear"
 ywc_crisis.1602.shrink_works.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1602.shrink_works.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1602.decline_new_money:0 "Decline to put in any new capital"
 ywc_crisis.1602.decline_new_money.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1602.decline_new_money.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1602.wait:0 "Wait before answering"
 ywc_crisis.1602.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1602.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1603.t:0 "The Mining Town Rejects a Blank Contract"
 ywc_crisis.1603.d:0 "The mining town's representatives arrive with their own registers: the miners want wages and hours in writing, the villages want shares of the road and water, the shareholders want their capital secured first. The host decides whom to bind - labor and villages, the shareholders, or a full town assembly. The terms are written openly; nobody signs for another."
 ywc_crisis.1603.bind_labor_villages:0 "Bind the terms with the laborers and villages"
 ywc_crisis.1603.bind_labor_villages.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1603.bind_labor_villages.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1603.bind_shareholders:0 "Bind the terms with the shareholders, capital secured first"
 ywc_crisis.1603.bind_shareholders.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1603.bind_shareholders.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1603.open_town_assembly:0 "Open a full town assembly and write the terms in public"
 ywc_crisis.1603.open_town_assembly.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1603.open_town_assembly.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1603.wait:0 "Wait and hear the town out once more"
 ywc_crisis.1603.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1603.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1604.t:0 "Which Road Comes First"
 ywc_crisis.1604.d:0 "The road money covers one stretch only: the mine-mouth road first lets the ore move; the barracks and channels first keep the laborers. The host sets the order by its real building and funding capacity, and the survey is paid in coin; the roads and barracks themselves remain ordinary works of the construction system, and this contract registers only the order and the duty."
 ywc_crisis.1604.road_first:0 "Open the mine-mouth road first, pay for the survey (300)"
 ywc_crisis.1604.road_first.cost_tooltip:0 "The holder's treasury pays 300."
 ywc_crisis.1604.road_first.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1604.housing_first:0 "Build the barracks and channels first to keep the laborers"
 ywc_crisis.1604.housing_first.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1604.housing_first.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1604.wait:0 "Wait and price one more stretch"
 ywc_crisis.1604.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1604.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1605.t:0 "A Reschedule the Budget Can Carry"
 ywc_crisis.1605.d:0 "The funder lays its own budget on the table: reschedule the debt against interest actually paid, shift the works onto the contractor's advances while the claim stands still, or stop every undisbursed line. None of it charges the host a coin more, and none of it decides for another country; the reschedule's price is paid from the funder's own treasury."
 ywc_crisis.1605.reschedule_pay:0 "Pay the interest and reschedule the debt (400)"
 ywc_crisis.1605.reschedule_pay.cost_tooltip:0 "The funder's treasury pays 400."
 ywc_crisis.1605.reschedule_pay.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1605.contractor_advance:0 "Shift the works onto the contractor's advances, claim unchanged"
 ywc_crisis.1605.contractor_advance.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1605.contractor_advance.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1605.stop_new_capital:0 "Stop every undisbursed line of capital"
 ywc_crisis.1605.stop_new_capital.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1605.stop_new_capital.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1605.wait:0 "Wait and re-check the budget once more"
 ywc_crisis.1605.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1605.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1606.t:0 "Who Answers for the Mine Accident"
 ywc_crisis.1606.d:0 "After the pit's accident, liability is checked against the register: whose duty is workplace safety, can the labor institutions hear the case, which book pays the relief. The host needs no fixed historical disaster - wherever real labor risk exists at the mine, this page applies. Only after the check does the tariff dispute resume."
 ywc_crisis.1606.fund_relief:0 "Pay the miners' relief from the treasury (300)"
 ywc_crisis.1606.fund_relief.cost_tooltip:0 "The holder's treasury pays 300."
 ywc_crisis.1606.fund_relief.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1606.institutional_review:0 "Hand the case to the labor institutions for a regular hearing"
 ywc_crisis.1606.institutional_review.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1606.institutional_review.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1606.deny_liability:0 "Deny the liability on this side and record the dispute"
 ywc_crisis.1606.deny_liability.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1606.deny_liability.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1606.wait:0 "Wait and go through the safety register once more"
 ywc_crisis.1606.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1606.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1607.t:0 "Can the Tariff Repay Everything"
 ywc_crisis.1607.d:0 "The funder wants the exclusive right to collect the mine's duties written into the contract, to be repaid from the tariff; the host refuses the exclusive right, or negotiates only a cap and a term. The funder decides on its own whether to accept the cap or withdraw the claim. The taxing power stays where the land lies, and nobody writes for the other side."
 ywc_crisis.1607.refuse_exclusive:0 "Refuse the exclusive taxing right; duties stay local"
 ywc_crisis.1607.refuse_exclusive.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1607.refuse_exclusive.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1607.cap_tariff_term:0 "Negotiate only a capped tariff with a fixed term"
 ywc_crisis.1607.cap_tariff_term.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1607.cap_tariff_term.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1607.accept_cap:0 "Accept the capped tariff and repayment by quota"
 ywc_crisis.1607.accept_cap.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1607.accept_cap.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1607.withdraw_claim:0 "Withdraw the taxing claim and keep the claim itself"
 ywc_crisis.1607.withdraw_claim.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1607.withdraw_claim.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1607.wait:0 "Wait before answering"
 ywc_crisis.1607.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1607.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1608.t:0 "Splitting the Works into Two Phases"
 ywc_crisis.1608.d:0 "Building everything at once also binds the public duties at once. The host may split the works into two phases - the first only what the disbursed funds can audit, public facilities inspected phase by phase - or insist on building at once and carry the risk itself. Either way the choice enters the contract, and the remaining accounts wait for settlement."
 ywc_crisis.1608.two_phase_plan:0 "Split into two phases, public facilities inspected per phase"
 ywc_crisis.1608.two_phase_plan.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1608.two_phase_plan.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1608.continue_full:0 "Insist on building at once and carry the risk"
 ywc_crisis.1608.continue_full.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1608.continue_full.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1608.wait:0 "Wait and estimate both phases once more"
 ywc_crisis.1608.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1608.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1609.t:0 "The Ledger after Withdrawal"
 ywc_crisis.1609.d:0 "Even without agreement the ledger closes honestly: the host may compensate what the funder actually paid, hand over the built works and end the claim, or leave the dispute on the register with the project continuing. The funder decides for itself whether to take the compensation, take the works, or keep the dispute. Compensation is paid as registered, and both sides keep a state the game can go on with."
 ywc_crisis.1609.compensate_funder:0 "Compensate what the funder has actually paid (500)"
 ywc_crisis.1609.compensate_funder.cost_tooltip:0 "The holder's treasury pays 500."
 ywc_crisis.1609.compensate_funder.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1609.handover_works:0 "Hand over the built works and end the claim"
 ywc_crisis.1609.handover_works.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1609.handover_works.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1609.leave_dispute_open:0 "Leave the dispute on the register with the project continuing"
 ywc_crisis.1609.leave_dispute_open.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1609.leave_dispute_open.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1609.accept_compensation:0 "Accept the compensation and close the paid account"
 ywc_crisis.1609.accept_compensation.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1609.accept_compensation.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1609.take_handover:0 "Take over the built works"
 ywc_crisis.1609.take_handover.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1609.take_handover.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1609.keep_dispute:0 "Keep the dispute; each side keeps its own ledger"
 ywc_crisis.1609.keep_dispute.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1609.keep_dispute.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1609.wait:0 "Wait before answering"
 ywc_crisis.1609.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1609.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1610.t:0 "Not the Same Victory"
 ywc_crisis.1610.d:0 "At settlement each side's victory differs: the host confirms the full development under public constraints, only the limited project, or keeps the status quo; the funder accepts either of those two outcomes or leaves with what it has paid. Each signs its own closing, and the remaining disagreements stay on the register."
 ywc_crisis.1610.confirm_full:0 "Confirm the full development under public constraints"
 ywc_crisis.1610.confirm_full.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1610.confirm_full.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1610.confirm_limited:0 "Confirm only the limited project"
 ywc_crisis.1610.confirm_limited.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1610.confirm_limited.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1610.keep_status_quo:0 "Keep the status quo and record no compact"
 ywc_crisis.1610.keep_status_quo.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1610.keep_status_quo.consequence_tooltip:0 "The case closes with the status quo; remaining duties stay in each own ledger and normal play continues."
 ywc_crisis.1610.accept_full:0 "Accept the outcome of the full development"
 ywc_crisis.1610.accept_full.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1610.accept_full.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1610.accept_limited:0 "Accept the outcome of the limited project"
 ywc_crisis.1610.accept_limited.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1610.accept_limited.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1610.withdraw_from_deal:0 "Withdraw from the deal with what has been paid"
 ywc_crisis.1610.withdraw_from_deal.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1610.withdraw_from_deal.consequence_tooltip:0 "The case closes as a voluntary withdrawal; what has been paid stays in the funder's own ledger and normal play continues."
 ywc_crisis.1610.wait:0 "Wait before signing"
 ywc_crisis.1610.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1610.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1611.t:0 "The Mining Town's Second Generation"
 ywc_crisis.1611.d:0 "Who stays after the development is checked against the register: did people actually settle, does the industry still run, which institutions remain. Those who kept the contract write an aftermath later lines can pick up; those who failed record it as failure. Each verdict enters its own ledger, and normal play continues."
 ywc_crisis.1611.audit_settlement_kept:0 "Record the aftermath from the register for later lines"
 ywc_crisis.1611.audit_settlement_kept.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1611.audit_settlement_kept.consequence_tooltip:0 "The kept verdict is written into both registers; an unanswered partner is wound up on this side's behalf."
 ywc_crisis.1611.record_fulfillment_failed:0 "Admit fulfillment failed and record it as it is"
 ywc_crisis.1611.record_fulfillment_failed.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1611.record_fulfillment_failed.consequence_tooltip:0 "The case closes as fulfillment failed; the arrears are recorded as they are and normal play continues."
 ywc_crisis.1611.wait:0 "Wait before the final audit"
 ywc_crisis.1611.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1611.wait.consequence_tooltip:0 "Records this decision."
