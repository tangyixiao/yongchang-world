 ywc_lan.1011.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1011.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1012.t:0 "The Neighbour Asks Who Runs the River"
 ywc_lan.1012.d:0 "Borneo neighbours and the Dutch ask the same question. This event records real diplomatic relations only and invents no partner."
 ywc_lan.1012.notify_neighbour:0 "Notify the real neighbour and register the arrangement"
 ywc_lan.1012.notify_neighbour.cost_tooltip:0 "No new fee; needs a real border or established relation."
 ywc_lan.1012.notify_neighbour.consequence_tooltip:0 "A later node reads the same relation."
 ywc_lan.1012.unilateral:0 "Proceed unilaterally"
 ywc_lan.1012.unilateral.cost_tooltip:0 "No new fee; the diplomatic cost is deferred."
 ywc_lan.1012.unilateral.consequence_tooltip:0 "Neighbour relations do not improve and the unrest gate is higher."
 ywc_lan.1012.defer:0 "Defer until conditions recover"
 ywc_lan.1012.defer.cost_tooltip:0 "No new fee."
