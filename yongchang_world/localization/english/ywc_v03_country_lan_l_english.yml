 ywc_lan.1012.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1012.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1013.t:0 "Compensation and Seats on the Board"
 ywc_lan.1013.d:0 "Co-management needs a real office and real money. A failed payment advances nothing."
 ywc_lan.1013.fund_board:0 "Fund compensation and open board seats"
 ywc_lan.1013.fund_board.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52; compensation reserve."
 ywc_lan.1013.fund_board.consequence_tooltip:0 "The clearest unrest reduction at the highest cost."
 ywc_lan.1013.restrict_blocks:0 "Switch to restricted blocks"
 ywc_lan.1013.restrict_blocks.cost_tooltip:0 "No new fee; the output target drops."
 ywc_lan.1013.restrict_blocks.consequence_tooltip:0 "Only the narrow ending remains."
