 ywc_lan.1020.private_relief:0 "Private relief: almost no public money"
 ywc_lan.1020.private_relief.cost_tooltip:0 "No new fee; the coverage is narrow."
 ywc_lan.1020.private_relief.consequence_tooltip:0 "Living standards and unrest deteriorate; it cannot be both unpaid and unrest-free."
