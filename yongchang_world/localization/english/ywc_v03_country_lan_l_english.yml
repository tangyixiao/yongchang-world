l_english:
 ywc_je_v03_lan_mine_ledger:0 "Three Mine Ledgers, One Public Purse"
 ywc_je_v03_lan_mine_ledger_reason:0 "The guilds self-report profit while public defence and relief go short. The filing fee is captured at entry and is never refunded. The first journal dispatches registration, audit and reconciliation."
 ywc_je_v03_lan_mine_settlement:0 "The Public Purse After the Ledgers"
 ywc_je_v03_lan_mine_settlement_reason:0 "The opening public account, continuous observation and settlement. A mature narrow target cannot be promoted into the high-standard ending."
 ywc_lan.1000.t:0 "Three Ledgers the Guilds Report"
 ywc_lan.1000.d:0 "The mine audit starts with a recorded route, not a new mine. Later eligibility checks use actual mine employment and scale, and the audit route also requires a staffed public office. The one-time filing fee uses annual gross income captured when this journal begins."
 ywc_lan.1000.public_audit:0 "Public audit: clerks on the public payroll"
 ywc_lan.1000.public_audit.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52 at the base rate; a staffed public office is also required."
 ywc_lan.1000.public_audit.consequence_tooltip:0 "Records the audit route. Later checks use the recorded choice and actual office and mine conditions."
 ywc_lan.1000.shareholder_farm:0 "Choose the guild's fixed-sum ledger route"
 ywc_lan.1000.shareholder_farm.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52 at 70% of the base rate."
 ywc_lan.1000.shareholder_farm.consequence_tooltip:0 "Records the guild route; later eligibility requires real mine scale."
 ywc_lan.1000.limited_liability:0 "Choose the self-report and limited-liability route"
 ywc_lan.1000.limited_liability.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52; charged at half the base rate; registers liability and audits only."
 ywc_lan.1000.limited_liability.consequence_tooltip:0 "Records the limited-liability and audit route; this route qualifies only for the narrow ending."
 ywc_lan.1000.defer:0 "Defer until conditions recover"
 ywc_lan.1000.defer.cost_tooltip:0 "No new fee."
 ywc_lan.1000.defer.consequence_tooltip:0 "Retry remains available; withdrawal keeps paid fees and records a setback."
 ywc_lan.1000.withdraw:0 "Withdraw this registration"
 ywc_lan.1000.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1000.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1001.t:0 "The Clerks Want Into the Mining District"
 ywc_lan.1001.d:0 "A government administration building counts as staffed at 80% occupancy with no input shortage. Mine employment requires 60% occupancy with no input shortage."
 ywc_lan.1001.staff_audit:0 "Send clerks from a staffed office"
 ywc_lan.1001.staff_audit.cost_tooltip:0 "No new fee; records the public office clerk choice."
 ywc_lan.1001.staff_audit.consequence_tooltip:0 "Later eligibility uses actual office employment and this audit choice."
 ywc_lan.1001.guild_clerks:0 "Use the guild's own bookkeepers"
 ywc_lan.1001.guild_clerks.cost_tooltip:0 "No new fee; records the guild-ledger route."
 ywc_lan.1001.guild_clerks.consequence_tooltip:0 "Records the guild-ledger choice; it qualifies only for the narrow target."
 ywc_lan.1001.defer:0 "Defer until conditions recover"
 ywc_lan.1001.defer.cost_tooltip:0 "No new fee."
 ywc_lan.1001.defer.consequence_tooltip:0 "Retry remains available; withdrawal keeps paid fees and records a setback."
 ywc_lan.1001.withdraw:0 "Withdraw this registration"
 ywc_lan.1001.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1001.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1002.t:0 "Shareholders Want a Dividend, the Public Purse Wants a Share"
 ywc_lan.1002.d:0 "These options record which claim has priority in the ledger. They do not transfer revenue or pay dividends; later targets depend on the recorded route and actual mine conditions."
 ywc_lan.1002.public_share_first:0 "Choose the public-claim-first route"
 ywc_lan.1002.public_share_first.cost_tooltip:0 "No new fee; records the public-claim-first choice."
 ywc_lan.1002.public_share_first.consequence_tooltip:0 "Later eligibility follows the recorded priority and the route conditions."
 ywc_lan.1002.dividend_first:0 "Choose the dividend-first route"
 ywc_lan.1002.dividend_first.cost_tooltip:0 "No new fee; records the dividend-first choice."
 ywc_lan.1002.dividend_first.consequence_tooltip:0 "Later targets on this route are narrower."
 ywc_lan.1002.defer:0 "Defer until conditions recover"
 ywc_lan.1002.defer.cost_tooltip:0 "No new fee."
 ywc_lan.1002.defer.consequence_tooltip:0 "Retry remains available; withdrawal keeps paid fees and records a setback."
 ywc_lan.1002.withdraw:0 "Withdraw this registration"
 ywc_lan.1002.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1002.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1003.t:0 "Choosing How to Reconcile the Freight"
 ywc_lan.1003.d:0 "Set the charter for reconciling shipping accounts; later completion still depends on the recorded route and actual office and mine conditions."
 ywc_lan.1003.use_shipping:0 "Choose the shipping-reconciliation route"
 ywc_lan.1003.use_shipping.cost_tooltip:0 "No new fee."
 ywc_lan.1003.use_shipping.consequence_tooltip:0 "Later checks use this route and actual mine scale; they do not check ports or shipment volume."
 ywc_lan.1003.internal_only:0 "Choose the internal-only route"
 ywc_lan.1003.internal_only.cost_tooltip:0 "No new fee; the target drops."
 ywc_lan.1003.internal_only.consequence_tooltip:0 "This route does not claim that outside shipping was verified."
 ywc_lan.1003.defer:0 "Defer until conditions recover"
 ywc_lan.1003.defer.cost_tooltip:0 "No new fee."
 ywc_lan.1003.defer.consequence_tooltip:0 "Retry remains available; withdrawal keeps paid fees and records a setback."
 ywc_lan.1003.withdraw:0 "Withdraw this registration"
 ywc_lan.1003.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1003.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1004.t:0 "Choosing How Customs Handles the Mine Ledger"
 ywc_lan.1004.d:0 "Choose whether customs and mine accounts use combined or separate books; completion still requires the actual office and mine conditions."
 ywc_lan.1004.merge_customs:0 "Choose the combined-ledger route"
 ywc_lan.1004.merge_customs.cost_tooltip:0 "No new fee; records the combined-ledger choice."
 ywc_lan.1004.merge_customs.consequence_tooltip:0 "Later checks use the recorded route and actual mine and office conditions."
 ywc_lan.1004.separate_books:0 "Keep the mine ledger separate"
 ywc_lan.1004.separate_books.cost_tooltip:0 "No new fee; records the separate-ledger route."
 ywc_lan.1004.separate_books.consequence_tooltip:0 "Records the separate-books choice; this route qualifies only for the narrow target."
 ywc_lan.1004.defer:0 "Defer until conditions recover"
 ywc_lan.1004.defer.cost_tooltip:0 "No new fee."
 ywc_lan.1004.defer.consequence_tooltip:0 "Retry remains available; withdrawal keeps paid fees and records a setback."
 ywc_lan.1004.withdraw:0 "Withdraw this registration"
 ywc_lan.1004.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1004.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1005.t:0 "Count the Public Account Before the Shift"
 ywc_lan.1005.d:0 "Public audit, shareholder farming and self-report each carry a different opening cost. A failed payment only preserves the retreat."
 ywc_lan.1005.fund_audit:0 "Fund auditors and register liability"
 ywc_lan.1005.fund_audit.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52; second audit reserve."
 ywc_lan.1005.fund_audit.consequence_tooltip:0 "Records the audit-reserve route; settlement still requires the real target and continuous observation."
 ywc_lan.1005.cap_public_claim:0 "Choose the capped public-claim route"
 ywc_lan.1005.cap_public_claim.cost_tooltip:0 "No new fee; records the capped-claim choice."
 ywc_lan.1005.cap_public_claim.consequence_tooltip:0 "Only the low target can conclude."
 ywc_lan.1005.defer:0 "Defer until conditions recover"
 ywc_lan.1005.defer.cost_tooltip:0 "No new fee."
 ywc_lan.1005.defer.consequence_tooltip:0 "Retry remains available; withdrawal keeps paid fees and records a setback."
 ywc_lan.1005.withdraw:0 "Withdraw this registration"
 ywc_lan.1005.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1005.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1006.t:0 "Three Ledgers After Six Months"
 ywc_lan.1006.d:0 "Six consecutive months record the actual conditions; a bad month clears the observation and restarts it."
 ywc_lan.1006.begin_review:0 "Confirm six months and open the review"
 ywc_lan.1006.begin_review.cost_tooltip:0 "No second filing fee."
 ywc_lan.1006.begin_review.consequence_tooltip:0 "Concluding early cannot substitute for the six months."
 ywc_lan.1006.narrow_or_wait:0 "Narrow the target or wait"
 ywc_lan.1006.narrow_or_wait.cost_tooltip:0 "Paid fees stay; failing months cost nothing."
 ywc_lan.1006.narrow_or_wait.consequence_tooltip:0 "Observation restarts from zero."
 ywc_lan.1006.defer:0 "Defer until conditions recover"
 ywc_lan.1006.defer.cost_tooltip:0 "No new fee."
 ywc_lan.1006.defer.consequence_tooltip:0 "Retry remains available; withdrawal keeps paid fees and records a setback."
 ywc_lan.1006.withdraw:0 "Withdraw this registration"
 ywc_lan.1006.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1006.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1006.reconsider_mine_12:0 "Reconsider the mine target"
 ywc_lan.1006.reconsider_mine_12.cost_tooltip:0 "No new fee."
 ywc_lan.1006.reconsider_mine_12.consequence_tooltip:0 "The current target returns to its live queue with a fresh blocked clock."
 ywc_lan.1006.narrow_mine_12:0 "Narrow the mine target and restart observation"
 ywc_lan.1006.narrow_mine_12.cost_tooltip:0 "No new fee."
 ywc_lan.1006.narrow_mine_12.consequence_tooltip:0 "The selected lower target must complete a fresh observation window."
 ywc_lan.1006.withdraw_mine_12:0 "Withdraw the mine accounts plan"
 ywc_lan.1006.withdraw_mine_12.cost_tooltip:0 "No new fee."
 ywc_lan.1006.withdraw_mine_12.consequence_tooltip:0 "Withdraws this agreement and releases its active slot."
 ywc_lan.1007.t:0 "Which Ledger the Public Purse Follows"
 ywc_lan.1007.d:0 "Settlement checks the recorded route, actual office and mine conditions, and whether the high target held continuously. A mature narrow target cannot qualify for the high-standard ending."
 ywc_lan.1007.settle_full:0 "Settle on the public audit"
 ywc_lan.1007.settle_full.cost_tooltip:0 "No closing bonus or new fee; earlier costs were handled by the selected options."
 ywc_lan.1007.settle_full.consequence_tooltip:0 "Only holds when the real high target held continuously."
 ywc_lan.1007.settle_compromise:0 "Settle on the narrowed public share"
 ywc_lan.1007.settle_compromise.cost_tooltip:0 "No closing bonus."
 ywc_lan.1007.settle_compromise.consequence_tooltip:0 "Delivers only the narrow target, not a full audit."
 ywc_lan.1007.withdraw:0 "Withdraw this registration"
 ywc_lan.1007.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1007.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1007.narrow_mine_36:0 "Narrow the mine target and restart observation"
 ywc_lan.1007.narrow_mine_36.cost_tooltip:0 "No new fee."
 ywc_lan.1007.narrow_mine_36.consequence_tooltip:0 "The narrowed contract restarts its full observation window."
 ywc_lan.1007.withdraw_mine_36:0 "Withdraw the mine accounts plan"
 ywc_lan.1007.withdraw_mine_36.cost_tooltip:0 "No new fee."
 ywc_lan.1007.withdraw_mine_36.consequence_tooltip:0 "Withdraws the blocked agreement and releases its slot."
 ywc_je_v03_lan_river_compacts:0 "The Upstream Is Not Empty Land"
 ywc_je_v03_lan_river_compacts_reason:0 "Mining concessions and river works reach into existing settlements. The fee is captured at entry. The first journal dispatches registration, deeds, the neighbour and the two enforcement routes."
 ywc_je_v03_lan_river_settlement:0 "The Waterway After the Settlements"
 ywc_je_v03_lan_river_settlement_reason:0 "Six months of route conditions precede settlement. Co-management needs its one-time reserve; restricted and guard routes have narrower outcomes."
 ywc_lan.1010.t:0 "The Waterway Crosses Ground Already Occupied"
 ywc_lan.1010.d:0 "Choose a river-compensation, restricted-area or guard route. Co-management requires a staffed public office and a later one-time reserve charge; all settlement routes also require a checked deed and real river infrastructure."
 ywc_lan.1010.compensate:0 "Choose the co-management route"
 ywc_lan.1010.compensate.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52 at the base rate; a real public office is required."
 ywc_lan.1010.compensate.consequence_tooltip:0 "Records this route; it does not alter unrest or diplomatic relations."
 ywc_lan.1010.restrict:0 "Choose the restricted-area route"
 ywc_lan.1010.restrict.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52 at half the base rate."
 ywc_lan.1010.restrict.consequence_tooltip:0 "Records the restricted-area route; it qualifies only for the narrow ending and does not change actual output."
 ywc_lan.1010.guards:0 "Choose the private-guard route"
 ywc_lan.1010.guards.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52 at 40% of the base rate."
 ywc_lan.1010.guards.consequence_tooltip:0 "Records the guard route; the timed modifier is applied only if guards are hired later."
 ywc_lan.1010.defer:0 "Defer until conditions recover"
 ywc_lan.1010.defer.cost_tooltip:0 "No new fee."
 ywc_lan.1010.defer.consequence_tooltip:0 "Retry remains available; withdrawal keeps paid fees and records a setback."
 ywc_lan.1010.withdraw:0 "Withdraw this registration"
 ywc_lan.1010.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1010.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1011.t:0 "The Deeds Must Be Checked"
 ywc_lan.1011.d:0 "The deed-review choice is available under commercialized agriculture. If that law is absent, the survey-only route remains. Co-management requires a staffed office; restriction requires real mine scale."
 ywc_lan.1011.deed_review:0 "Record a deed review under current land law"
 ywc_lan.1011.deed_review.cost_tooltip:0 "No new fee."
 ywc_lan.1011.deed_review.consequence_tooltip:0 "Later river eligibility requires this deed-check choice and real river infrastructure."
 ywc_lan.1011.survey_only:0 "Choose the survey-only route"
 ywc_lan.1011.survey_only.cost_tooltip:0 "No new fee; the target drops."
 ywc_lan.1011.survey_only.consequence_tooltip:0 "A deed check is still required before the river target can qualify."
 ywc_lan.1011.defer:0 "Defer until conditions recover"
 ywc_lan.1011.defer.cost_tooltip:0 "No new fee."
 ywc_lan.1011.defer.consequence_tooltip:0 "Retry remains available; withdrawal keeps paid fees and records a setback."
 ywc_lan.1011.withdraw:0 "Withdraw this registration"
 ywc_lan.1011.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1011.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1012.t:0 "A Question of Who Governs the River"
 ywc_lan.1012.d:0 "Record whether the checked deed is paired with a neighbour notice or a unilateral route. This choice checks no live diplomatic relation and does not represent foreign consent."
 ywc_lan.1012.notify_neighbour:0 "Record a neighbour notice in the plan"
 ywc_lan.1012.notify_neighbour.cost_tooltip:0 "No new fee; records that the deed was checked."
 ywc_lan.1012.notify_neighbour.consequence_tooltip:0 "Records the notice choice only; it does not check diplomatic relations or represent consent."
 ywc_lan.1012.unilateral:0 "Proceed unilaterally"
 ywc_lan.1012.unilateral.cost_tooltip:0 "No new fee; records the unilateral route."
 ywc_lan.1012.unilateral.consequence_tooltip:0 "Records the unilateral choice; it does not change neighbour relations or unrest."
 ywc_lan.1012.defer:0 "Defer until conditions recover"
 ywc_lan.1012.defer.cost_tooltip:0 "No new fee."
 ywc_lan.1012.defer.consequence_tooltip:0 "Retry remains available; withdrawal keeps paid fees and records a setback."
 ywc_lan.1012.withdraw:0 "Withdraw this registration"
 ywc_lan.1012.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1012.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1013.t:0 "Compensation and Seats on the Board"
 ywc_lan.1013.d:0 "Co-management requires a staffed office and a second one-time reserve charge. If that payment fails, the choice remains here; the restricted-area route has no new charge."
 ywc_lan.1013.fund_board:0 "Choose co-management and its compensation reserve"
 ywc_lan.1013.fund_board.cost_tooltip:0 "One-time reserve charge uses the opening annual gross-income / 52 snapshot at the base rate."
 ywc_lan.1013.fund_board.consequence_tooltip:0 "Records the paid reserve and co-management route; it does not modify unrest."
 ywc_lan.1013.restrict_blocks:0 "Switch to restricted blocks"
 ywc_lan.1013.restrict_blocks.cost_tooltip:0 "No new fee; records the restricted-area route."
 ywc_lan.1013.restrict_blocks.consequence_tooltip:0 "Later checks use the narrow target; actual output is unchanged."
 ywc_lan.1013.defer:0 "Defer until conditions recover"
 ywc_lan.1013.defer.cost_tooltip:0 "No new fee."
 ywc_lan.1013.defer.consequence_tooltip:0 "Retry remains available; withdrawal keeps paid fees and records a setback."
 ywc_lan.1013.withdraw:0 "Withdraw this registration"
 ywc_lan.1013.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1013.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1014.t:0 "Private Guards Enter the Riverside"
 ywc_lan.1014.d:0 "Hiring guards requires one additional one-time fee and applies a 1095-day modifier: legitimacy base −10 and political-movement radicalism multiplier +0.25."
 ywc_lan.1014.hire_guards:0 "Hire private guards"
 ywc_lan.1014.hire_guards.cost_tooltip:0 "The one-time guard-hiring fee uses the opening annual gross-income / 52 snapshot at the full rate; a 1095-day modifier is applied."
 ywc_lan.1014.hire_guards.consequence_tooltip:0 "Legitimacy base falls by 10 and radicals from political movements rise by 25%. Diplomatic coordination is strained: Influence generation falls by 10% for 1095 days. The same hiring choice neither charges again nor refreshes the penalty."
 ywc_lan.1014.convert_to_board:0 "Pay to record a co-management conversion choice"
 ywc_lan.1014.convert_to_board.cost_tooltip:0 "Converting to co-management charges one additional full one-time fee using the opening snapshot."
 ywc_lan.1014.convert_to_board.consequence_tooltip:0 "Records the conversion choice; the guard route and its timed modifier remain in effect."
 ywc_lan.1014.keep_restricted:0 "Keep the restriction and hire no guards"
 ywc_lan.1014.keep_restricted.cost_tooltip:0 "No new fee; the output target drops."
 ywc_lan.1014.keep_restricted.consequence_tooltip:0 "Records the restricted-area choice; later only the narrow ending is available."
 ywc_lan.1014.defer:0 "Defer until conditions recover"
 ywc_lan.1014.defer.cost_tooltip:0 "No new fee."
 ywc_lan.1014.defer.consequence_tooltip:0 "Retry remains available; withdrawal keeps paid fees and records a setback."
 ywc_lan.1014.withdraw:0 "Withdraw this registration"
 ywc_lan.1014.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1014.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1015.t:0 "Does the River Plan Account for Mine Scale"
 ywc_lan.1015.d:0 "Choose whether the record follows the expansion or hold-scale route. Neither choice changes mine scale or production; the ending still depends on the earlier river route and its live conditions."
 ywc_lan.1015.expand_blocks:0 "Choose the expansion route within the real mine-scale condition"
 ywc_lan.1015.expand_blocks.cost_tooltip:0 "No new fee; needs real mine scale to back it."
 ywc_lan.1015.expand_blocks.consequence_tooltip:0 "Records the expansion choice; mine scale and actual output do not change."
 ywc_lan.1015.hold_scale:0 "Hold the current scale"
 ywc_lan.1015.hold_scale.cost_tooltip:0 "No new fee."
 ywc_lan.1015.hold_scale.consequence_tooltip:0 "Records the hold-scale choice; eligibility remains governed by the selected river route."
 ywc_lan.1015.defer:0 "Defer until conditions recover"
 ywc_lan.1015.defer.cost_tooltip:0 "No new fee."
 ywc_lan.1015.defer.consequence_tooltip:0 "Retry remains available; withdrawal keeps paid fees and records a setback."
 ywc_lan.1015.withdraw:0 "Withdraw this registration"
 ywc_lan.1015.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1015.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1016.t:0 "Six Months Under the River Compact"
 ywc_lan.1016.d:0 "The selected route must meet its actual eligibility conditions for six consecutive months. A failed month resets observation; a narrower target cannot become the co-management ending."
 ywc_lan.1016.begin_review:0 "Confirm six months and open the review"
 ywc_lan.1016.begin_review.cost_tooltip:0 "No second filing fee."
 ywc_lan.1016.begin_review.consequence_tooltip:0 "Concluding early cannot substitute for the six months."
 ywc_lan.1016.narrow_or_wait:0 "Narrow the target or wait for its conditions to recover"
 ywc_lan.1016.narrow_or_wait.cost_tooltip:0 "Paid fees stay; failing months cost nothing."
 ywc_lan.1016.narrow_or_wait.consequence_tooltip:0 "Observation restarts from zero."
 ywc_lan.1016.defer:0 "Defer until conditions recover"
 ywc_lan.1016.defer.cost_tooltip:0 "No new fee."
 ywc_lan.1016.defer.consequence_tooltip:0 "Retry remains available; withdrawal keeps paid fees and records a setback."
 ywc_lan.1016.withdraw:0 "Withdraw this registration"
 ywc_lan.1016.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1016.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1016.reconsider_river_12:0 "Reconsider the river target"
 ywc_lan.1016.reconsider_river_12.cost_tooltip:0 "No new fee."
 ywc_lan.1016.reconsider_river_12.consequence_tooltip:0 "The current target returns to its live queue with a fresh blocked clock."
 ywc_lan.1016.narrow_river_12:0 "Narrow the river target and restart observation"
 ywc_lan.1016.narrow_river_12.cost_tooltip:0 "No new fee."
 ywc_lan.1016.narrow_river_12.consequence_tooltip:0 "The selected lower target must complete a fresh observation window."
 ywc_lan.1016.withdraw_river_12:0 "Withdraw the river compact"
 ywc_lan.1016.withdraw_river_12.cost_tooltip:0 "No new fee."
 ywc_lan.1016.withdraw_river_12.consequence_tooltip:0 "Withdraws this agreement and releases its active slot."
 ywc_lan.1017.t:0 "Which Compact the River Follows"
 ywc_lan.1017.d:0 "Settlement depends on the selected route, the deed-check choice, real river infrastructure and the route-specific requirements over six months."
 ywc_lan.1017.settle_full:0 "Settle on the co-managed compact"
 ywc_lan.1017.settle_full.cost_tooltip:0 "No closing bonus or new fee; previously paid one-time reserves are not charged again."
 ywc_lan.1017.settle_full.consequence_tooltip:0 "Only holds when the real high target held continuously."
 ywc_lan.1017.settle_compromise:0 "Settle on restricted blocks"
 ywc_lan.1017.settle_compromise.cost_tooltip:0 "No closing bonus."
 ywc_lan.1017.settle_compromise.consequence_tooltip:0 "Delivers only the narrow target, not co-management."
 ywc_lan.1017.withdraw:0 "Withdraw this registration"
 ywc_lan.1017.withdraw.cost_tooltip:0 "Paid fees and signed obligations remain."
 ywc_lan.1017.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1017.narrow_river_36:0 "Narrow the river target and restart observation"
 ywc_lan.1017.narrow_river_36.cost_tooltip:0 "No new fee."
 ywc_lan.1017.narrow_river_36.consequence_tooltip:0 "The narrowed contract restarts its full observation window."
 ywc_lan.1017.withdraw_river_36:0 "Withdraw the river compact"
 ywc_lan.1017.withdraw_river_36.cost_tooltip:0 "No new fee."
 ywc_lan.1017.withdraw_river_36.consequence_tooltip:0 "Withdraws the blocked agreement and releases its slot."
 ywc_je_v03_lan_accident_fund:0 "Liability After the Shift"
 ywc_je_v03_lan_accident_fund_reason:0 "Who carries injury, wages and migration debt. The fee is captured at entry. The first journal dispatches registration, the roll, old debt and the fund charter."
 ywc_je_v03_lan_fund_settlement:0 "What Remains After the Payout"
 ywc_je_v03_lan_fund_settlement_reason:0 "Settlement follows the selected path and its route-specific conditions over six months; a lower target cannot become the mutual-fund ending."
 ywc_lan.1020.t:0 "Who Pays After the Shift"
 ywc_lan.1020.d:0 "The mutual-fund option requires poor laws and enough cash for its opening fee; the company route also has a one-time fee. Private relief remains available without a filing fee. Later targets require route-specific choices and, on some routes, real mine or office employment."
 ywc_lan.1020.mutual_fund:0 "Choose the mutual-fund route"
