 ywc_lan.1015.expand_blocks:0 "Expand modestly inside the restricted blocks"
 ywc_lan.1015.expand_blocks.cost_tooltip:0 "No new fee; needs real mine scale to back it."
 ywc_lan.1015.expand_blocks.consequence_tooltip:0 "Output rises while the unrest gate does not fall."
