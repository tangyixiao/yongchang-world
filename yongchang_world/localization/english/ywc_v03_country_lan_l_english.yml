 ywc_lan.1013.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_lan.1014.t:0 "Private Guards Enter the Riverside"
 ywc_lan.1014.d:0 "Private guards are cheapest and fastest, but really add radicals and cost legitimacy. This is the route that cannot be both unpaid and unrest-free."
 ywc_lan.1014.hire_guards:0 "Hire private guards"
 ywc_lan.1014.hire_guards.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52; guard fees, really charged."
 ywc_lan.1014.hire_guards.consequence_tooltip:0 "Really adds radicals and legitimacy loss; the later unrest gate is higher."
 ywc_lan.1014.convert_to_board:0 "Convert to co-management and stand the guards down"
 ywc_lan.1014.convert_to_board.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52; compensation reserve replaces guard fees."
 ywc_lan.1014.convert_to_board.consequence_tooltip:0 "Unrest falls while the cost rises."
 ywc_lan.1014.keep_restricted:0 "Keep the restriction and hire no guards"
 ywc_lan.1014.keep_restricted.cost_tooltip:0 "No new fee; the output target drops."
 ywc_lan.1014.keep_restricted.consequence_tooltip:0 "Unrest does not spike, but only the narrow ending remains."
