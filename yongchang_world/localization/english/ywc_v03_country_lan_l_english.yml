 ywc_je_v03_lan_public_mandate:0 "Lanfang Beyond the Board"
 ywc_je_v03_lan_public_mandate_reason:0 "Agree public authority among company, residents and shareholders in the currently owned West Borneo district. Present law, government support, people and tax sources determine full eligibility. Explicit public accounts and appeals provide a limited goal where conditions remain incomplete. Registration and review each require payment."
 ywc_je_v03_lan_public_budget:0 "Budgeting Public Obligations"
 ywc_je_v03_lan_public_budget_reason:0 "Implement appeals, current taxes and government responsibility and a real review payment, then check six consecutive monthly accounts. Co-management and mutual precedents save duplicate work, never invent cash. War, loss, default or lost eligibility interrupts observation and needs explicit deferral and a fresh count."
 ywc_je_v03_lan_public_succession:0 "No Blank Mandate at Succession"
 ywc_je_v03_lan_public_succession_reason:0 "After six satisfactory public accounts, the qualifying current government confirms a twelve-month commission. The close checks the same district, responsible role, law, support and expiry again. Lost conditions or an expired commission leave an explicit setback or withdrawal."
 ywc_lan.1100.t:0 "The Investors Seal"
 ywc_lan.1100.d:0 "The mines can contribute public funds, but a board seal cannot speak for residents forever. Companies, offices and residents in West Borneo need to agree who may sign a budget and carry its obligations. A company republic, resident representation and constrained shareholder control each offer a path."
 ywc_lan.1100.term_company_republic:0 "A company republic with a bounded mandate"
 ywc_lan.1100.term_company_republic.cost_tooltip:0 "No charge now; later registration, appeal and review costs use one opening week of gross income, minimum100."
 ywc_lan.1100.term_company_republic.consequence_tooltip:0 "Select the currently owned West Borneo district and direction of authority, then register the agreement and verify its required qualifications."
 ywc_lan.1100.resident_representation:0 "Expand resident representation"
 ywc_lan.1100.resident_representation.cost_tooltip:0 "No charge now; later registration, appeal and review costs use one opening week of gross income, minimum100."
 ywc_lan.1100.resident_representation.consequence_tooltip:0 "Select the currently owned West Borneo district and direction of authority, then register the agreement and verify its required qualifications."
 ywc_lan.1100.bounded_shareholders:0 "Shareholder control with public constraints"
 ywc_lan.1100.bounded_shareholders.cost_tooltip:0 "No charge now; later registration, appeal and review costs use one opening week of gross income, minimum100."
 ywc_lan.1100.bounded_shareholders.consequence_tooltip:0 "Select the currently owned West Borneo district and direction of authority, then register the agreement and verify its required qualifications."
 ywc_lan.1100.wait_pilot:0 "Wait for current conditions"
 ywc_lan.1100.wait_pilot.cost_tooltip:0 "No charge; existing costs and obligations remain."
 ywc_lan.1100.wait_pilot.consequence_tooltip:0 "Keep this question open for a later monthly discussion. Earlier payments remain settled."
 ywc_lan.1100.withdraw:0 "Withdraw this public mandate"
 ywc_lan.1100.withdraw.cost_tooltip:0 "No new charge or refund; earlier mine, river and fund obligations remain."
 ywc_lan.1100.withdraw.consequence_tooltip:0 "End this agreement and free one long-term undertaking slot. Paid accounts and earlier obligations remain in force."
 ywc_lan.1101.t:0 "Can a Mine Ledger Become a Public Ledger"
 ywc_lan.1101.d:0 "An established public mine audit can save some repeated registration work. The offices must still verify that public funds came first, the old accounts were settled and this district retains staff to administer them. An unsuccessful earlier reform can also begin again at the current rate."
 ywc_lan.1101.pay_charter:0 "Pay the public registration fee currently due"
 ywc_lan.1101.pay_charter.cost_tooltip:0 "Company registration costs one weekly-income base, resident representation one and a half, and shareholder constraints half. A genuine public-audit conclusion, its public share and current pilot supply halve company registration."
 ywc_lan.1101.pay_charter.consequence_tooltip:0 "Continues only after a real deduction, recording its positive actual amount and source. Earlier mine reserves are not this cash; earned discounts are never retroactively collected."
 ywc_lan.1101.wait_cash:0 "Wait for current conditions"
 ywc_lan.1101.wait_cash.cost_tooltip:0 "No charge; existing costs and obligations remain."
 ywc_lan.1101.wait_cash.consequence_tooltip:0 "Keep this question open for a later monthly discussion. Earlier payments remain settled."
 ywc_lan.1101.withdraw:0 "Withdraw this public mandate"
 ywc_lan.1101.withdraw.cost_tooltip:0 "No new charge or refund; earlier mine, river and fund obligations remain."
 ywc_lan.1101.withdraw.consequence_tooltip:0 "End this agreement and free one long-term undertaking slot. Paid accounts and earlier obligations remain in force."
 ywc_lan.1102.t:0 "The Row Without Shares"
 ywc_lan.1102.d:0 "Residents without shares sit behind the board: they pay taxes and work, and want to know who decides the budget. Present law, groups in government and residents' actual eligibility determine which representation can be confirmed. Public accounts and an appeal procedure can come first where those conditions remain incomplete."
 ywc_lan.1102.verify_constituency:0 "Verify the mandate under current law"
 ywc_lan.1102.verify_constituency.cost_tooltip:0 "No extra fee; requires the current regime, taxes, government groups and their clout and approval, plus this pilot's people or tax source."
 ywc_lan.1102.verify_constituency.consequence_tooltip:0 "Recognizes only authority supported by existing institutions. The resident plan checks an actually eligible non-owner occupational cohort, without declaring a vote for every resident."
 ywc_lan.1102.bounded_petitions:0 "Limit the goal to public accounts and petitions"
 ywc_lan.1102.bounded_petitions.cost_tooltip:0 "Needs no new school, law, republic or mine scale; still requires an employed pilot bureaucrat, a quarter-staffed office without shortages, administration, legitimacy and actual spending."
 ywc_lan.1102.bounded_petitions.consequence_tooltip:0 "Implements only bounded publicity and petitions, ending at most in compromise. Office capacity is not new voting rights."
 ywc_lan.1102.wait_rights:0 "Wait for current conditions"
 ywc_lan.1102.wait_rights.cost_tooltip:0 "No charge; existing costs and obligations remain."
 ywc_lan.1102.wait_rights.consequence_tooltip:0 "Keep this question open for a later monthly discussion. Earlier payments remain settled."
 ywc_lan.1102.withdraw:0 "Withdraw this public mandate"
 ywc_lan.1102.withdraw.cost_tooltip:0 "No new charge or refund; earlier mine, river and fund obligations remain."
 ywc_lan.1102.withdraw.consequence_tooltip:0 "End this agreement and free one long-term undertaking slot. Paid accounts and earlier obligations remain in force."
 ywc_lan.1103.t:0 "Authority Is Not Permanent Property"
 ywc_lan.1103.d:0 "Contributors are ready to sign a mandate; the offices ask for public budgets, responsible roles and limits on authority to be written down. Full representation or a limited appeal goal should become verifiable terms for this district before the budget is implemented."
 ywc_lan.1103.sign_bounded_mandate:0 "Sign rules for a bounded public mandate"
 ywc_lan.1103.sign_bounded_mandate.cost_tooltip:0 "No repeat registration fee; paid costs, the selected goal and current eligibility must still hold."
 ywc_lan.1103.sign_bounded_mandate.consequence_tooltip:0 "Record this district's responsible role, public budget obligations and limits on authority, then begin budget implementation."
 ywc_lan.1103.wait_mandate:0 "Wait for current conditions"
 ywc_lan.1103.wait_mandate.cost_tooltip:0 "No charge; existing costs and obligations remain."
 ywc_lan.1103.wait_mandate.consequence_tooltip:0 "Keep this question open for a later monthly discussion. Earlier payments remain settled."
 ywc_lan.1103.withdraw:0 "Withdraw this public mandate"
 ywc_lan.1103.withdraw.cost_tooltip:0 "No new charge or refund; earlier mine, river and fund obligations remain."
 ywc_lan.1103.withdraw.consequence_tooltip:0 "End this agreement and free one long-term undertaking slot. Paid accounts and earlier obligations remain in force."
 ywc_lan.1104.t:0 "Upstream Residents Belong in the Accounts"
 ywc_lan.1104.d:0 "The obligations of upstream settlements belong in the public accounts too. An established river co-management procedure can be reused; otherwise, this agreement needs a new appeal register and its fee. Earlier compensation, road protection and guard accounts remain obligations to carry forward."
 ywc_lan.1104.reuse_river_board:0 "Reuse the actual co-management appeal precedent"
 ywc_lan.1104.reuse_river_board.cost_tooltip:0 "A genuine co-management conclusion, paid board cost and current pilot offices waive this quarter-week appeal registration fee; no new cash payment is claimed."
 ywc_lan.1104.reuse_river_board.consequence_tooltip:0 "Binds new appeals to this pilot. An old neighbour notice is not foreign consent, and earlier guard backlash and diplomatic costs remain."
 ywc_lan.1104.write_public_appeal:0 "Write new public appeal rules"
 ywc_lan.1104.write_public_appeal.cost_tooltip:0 "Pays one quarter of the opening weekly-income base, minimum25, after another current cash and same-pilot check."
 ywc_lan.1104.write_public_appeal.consequence_tooltip:0 "Needs no earlier river arc; records this positive payment and new clauses without creating land rights, foreign contributions or capital."
 ywc_lan.1104.wait_appeal:0 "Wait for current conditions"
 ywc_lan.1104.wait_appeal.cost_tooltip:0 "No charge; existing costs and obligations remain."
 ywc_lan.1104.wait_appeal.consequence_tooltip:0 "Keep this question open for a later monthly discussion. Earlier payments remain settled."
 ywc_lan.1104.withdraw:0 "Withdraw this public mandate"
 ywc_lan.1104.withdraw.cost_tooltip:0 "No new charge or refund; earlier mine, river and fund obligations remain."
 ywc_lan.1104.withdraw.consequence_tooltip:0 "End this agreement and free one long-term undertaking slot. Paid accounts and earlier obligations remain in force."
 ywc_lan.1105.t:0 "Whoever Governs Must Sign the Tax Bill"
 ywc_lan.1105.d:0 "A tax bill needs more than the former board's seal. The groups governing today and those able to answer for this district's tax sources or resident procedures must be checked again. A limited goal covers present accounts and appeals within the authority actually held."
 ywc_lan.1105.confirm_current_tax_base:0 "Confirm public accounts under the current tax system"
 ywc_lan.1105.confirm_current_tax_base.cost_tooltip:0 "No extra fee; selected current taxes, real government support and this pilot's tax source or resident eligibility must still qualify."
 ywc_lan.1105.confirm_current_tax_base.consequence_tooltip:0 "Records the current budget-responsible government group and the same pilot; past funding does not automatically authorize a successor."
 ywc_lan.1105.confirm_bounded_accounts:0 "Confirm only existing accounts and petition duties"
 ywc_lan.1105.confirm_bounded_accounts.cost_tooltip:0 "No extra fee; bounded goals still need current offices, employed bureaucrats, legitimacy and fiscal safety."
 ywc_lan.1105.confirm_bounded_accounts.consequence_tooltip:0 "Implements public accounts and petitions against the existing tax base; does not call an old tax law new tax powers or suffrage."
 ywc_lan.1105.wait_accounts:0 "Wait for current conditions"
 ywc_lan.1105.wait_accounts.cost_tooltip:0 "No charge; existing costs and obligations remain."
 ywc_lan.1105.wait_accounts.consequence_tooltip:0 "Keep this question open for a later monthly discussion. Earlier payments remain settled."
 ywc_lan.1105.withdraw:0 "Withdraw this public mandate"
 ywc_lan.1105.withdraw.cost_tooltip:0 "No new charge or refund; earlier mine, river and fund obligations remain."
 ywc_lan.1105.withdraw.consequence_tooltip:0 "End this agreement and free one long-term undertaking slot. Paid accounts and earlier obligations remain in force."
 ywc_lan.1106.t:0 "A Budget Place for Those Underground"
 ywc_lan.1106.d:0 "Miners and injured families have left their names in the earlier accounts. A district with an established mutual fund, paid reserves and adopted procedures can save repeated review work. A company arrangement that records only a reserve still carries its own distinct obligations."
 ywc_lan.1106.pay_public_review:0 "Pay this public review and record-keeping cost"
 ywc_lan.1106.pay_public_review.cost_tooltip:0 "Normally pays one opening weekly-income base, minimum100. Only the resident plan may halve it on genuine mutual-fund settlement, paid reserves, current pilot mine workers and offices and current poor laws."
 ywc_lan.1106.pay_public_review.consequence_tooltip:0 "Reduces reusable public record work, transfers no old balance and invents no private contribution. Six consecutive monthly checks begin only after the new deduction."
 ywc_lan.1106.wait_review_funds:0 "Wait for current conditions"
 ywc_lan.1106.wait_review_funds.cost_tooltip:0 "No charge; existing costs and obligations remain."
 ywc_lan.1106.wait_review_funds.consequence_tooltip:0 "Keep this question open for a later monthly discussion. Earlier payments remain settled."
 ywc_lan.1106.withdraw:0 "Withdraw this public mandate"
 ywc_lan.1106.withdraw.cost_tooltip:0 "No new charge or refund; earlier mine, river and fund obligations remain."
 ywc_lan.1106.withdraw.consequence_tooltip:0 "End this agreement and free one long-term undertaking slot. Paid accounts and earlier obligations remain in force."
 ywc_lan.1107.t:0 "Six Consecutive Public Accounts"
 ywc_lan.1107.d:0 "Six public accounts must pass the same checks in succession: the same district, effective terms, present representation or limited eligibility, peace and fiscal safety. An interruption needs an explicit decision to observe again. Only a completed review advances to the final mandate."
 ywc_lan.1107.accept_six_reviews:0 "Accept six consecutive valid public accounts"
 ywc_lan.1107.accept_six_reviews.cost_tooltip:0 "No further charge; the same pilot, terms, current representation or bounded eligibility, peace and fiscal safety need six actual consecutive monthly checks."
 ywc_lan.1107.accept_six_reviews.consequence_tooltip:0 "Completes the budget journal on real observation and opens succession, counting no months that never happened or expired support."
 ywc_lan.1107.defer_recount:0 "Explicitly defer and recount after recovery"
 ywc_lan.1107.defer_recount.cost_tooltip:0 "Recollects no settled fee and cancels no clause or debt."
 ywc_lan.1107.defer_recount.consequence_tooltip:0 "Restarts consecutive observation at zero without counting creation day. Continuing faults interrupt again next month; recovery alone never passes the audit."
 ywc_lan.1107.wait_review:0 "Wait for current conditions"
 ywc_lan.1107.wait_review.cost_tooltip:0 "No charge; existing costs and obligations remain."
 ywc_lan.1107.wait_review.consequence_tooltip:0 "Keep this question open for a later monthly discussion. Earlier payments remain settled."
 ywc_lan.1107.withdraw:0 "Withdraw this public mandate"
 ywc_lan.1107.withdraw.cost_tooltip:0 "No new charge or refund; earlier mine, river and fund obligations remain."
 ywc_lan.1107.withdraw.consequence_tooltip:0 "End this agreement and free one long-term undertaking slot. Paid accounts and earlier obligations remain in force."
 ywc_lan.1108.t:0 "A Successor Cannot Inherit a Blank Mandate"
 ywc_lan.1108.d:0 "The budget has been implemented; the government carrying its obligations must still sign under present law and support. This public commission runs for twelve months from confirmation and rests with a qualifying current group or office. Changed conditions permit waiting or a recorded dispute."
 ywc_lan.1108.confirm_current_mandate:0 "Confirm a twelve-month commission under the current role"
 ywc_lan.1108.confirm_current_mandate.cost_tooltip:0 "No extra fee; real registration, appeal and review evidence, six valid accounts and current conditions must all hold."
 ywc_lan.1108.confirm_current_mandate.consequence_tooltip:0 "Starts this agreement's twelve-month commission now and records the current group. Invents no election and changes no ruler's term; expiry is not permanent authority."
 ywc_lan.1108.record_dispute:0 "Send the current mandate gap to the close"
 ywc_lan.1108.record_dispute.cost_tooltip:0 "No new charge; every real payment remains."
 ywc_lan.1108.record_dispute.consequence_tooltip:0 "Records a dispute only when present conditions fail and grants no authority. It ends in setback or exit, without restoring an old board automatically."
 ywc_lan.1108.wait_successor:0 "Wait for current conditions"
 ywc_lan.1108.wait_successor.cost_tooltip:0 "No charge; existing costs and obligations remain."
 ywc_lan.1108.wait_successor.consequence_tooltip:0 "Keep this question open for a later monthly discussion. Earlier payments remain settled."
 ywc_lan.1108.withdraw:0 "Withdraw this public mandate"
 ywc_lan.1108.withdraw.cost_tooltip:0 "No new charge or refund; earlier mine, river and fund obligations remain."
 ywc_lan.1108.withdraw.consequence_tooltip:0 "End this agreement and free one long-term undertaking slot. Paid accounts and earlier obligations remain in force."
 ywc_lan.1109.t:0 "Public Money Beyond the Board"
 ywc_lan.1109.d:0 "The final public account asks who can carry an open responsibility today, as well as what the company once paid. The district, terms, law, support and commission must still hold for a full or limited agreement. Otherwise, record the actual shortcomings or end the agreement."
 ywc_lan.1109.close_established:0 "Confirm the bounded public mandate is established"
 ywc_lan.1109.close_established.cost_tooltip:0 "No further charge; full conditions, six valid accounts, real spending, the current responsible group and an unexpired commission must still qualify."
 ywc_lan.1109.close_established.consequence_tooltip:0 "Records establishment and releases capacity once, retaining the concrete public arrangement without granting laws, posts, votes or capital."
 ywc_lan.1109.close_compromise:0 "Confirm shareholder constraints or bounded petitions"
 ywc_lan.1109.close_compromise.cost_tooltip:0 "No further charge; current conditions, real spending, six accounts and the unexpired commission must still hold."
 ywc_lan.1109.close_compromise.consequence_tooltip:0 "Records a bounded compromise and releases capacity once. Shareholder control is not universal suffrage, nor bounded accounts a full public reform."
 ywc_lan.1109.close_setback:0 "Record setback against the current gap"
 ywc_lan.1109.close_setback.cost_tooltip:0 "No new charge or refund."
 ywc_lan.1109.close_setback.consequence_tooltip:0 "Records setback only if neither success condition holds. Expiry never renews authority automatically; real accounts and prior sources remain for later content."
 ywc_lan.1109.wait_close:0 "Wait for current conditions"
 ywc_lan.1109.wait_close.cost_tooltip:0 "No charge; existing costs and obligations remain."
 ywc_lan.1109.wait_close.consequence_tooltip:0 "Keep this question open for a later monthly discussion. Earlier payments remain settled."
 ywc_lan.1109.withdraw:0 "Withdraw this public mandate"
 ywc_lan.1109.withdraw.cost_tooltip:0 "No new charge or refund; earlier mine, river and fund obligations remain."
 ywc_lan.1109.withdraw.consequence_tooltip:0 "End this agreement and free one long-term undertaking slot. Paid accounts and earlier obligations remain in force."
