 ywc_je_v03_lan_fund_settlement:0 "What Remains After the Payout"
 ywc_je_v03_lan_fund_settlement_reason:0 "Wages and contributions, continuous observation, tiered settlement. Responsibility cannot be unpaid and unrest-free at once."
 ywc_lan.1020.t:0 "Who Pays After the Shift"
