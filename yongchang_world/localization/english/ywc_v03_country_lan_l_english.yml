 ywc_lan.1022.d:0 "Migrant debt entangles with company advances. This event reads real law and the budget only."
 ywc_lan.1022.assume_debt:0 "Let the fund assume the old debt"
 ywc_lan.1022.assume_debt.cost_tooltip:0 "One-time filing fee snapshots opening annual gross income / 52; assumption reserve."
 ywc_lan.1022.assume_debt.consequence_tooltip:0 "Living standards improve while costs rise."
 ywc_lan.1022.company_holds:0 "Leave the debt with the company"
 ywc_lan.1022.company_holds.cost_tooltip:0 "No new fee; a gap opens if the firm fails."
