 ywc_lan.1017.t:0 "Which Compact the River Follows"
 ywc_lan.1017.d:0 "Settlement reads land law, unrest, real output and the registered route."
 ywc_lan.1017.settle_full:0 "Settle on the co-managed compact"
 ywc_lan.1017.settle_full.cost_tooltip:0 "No closing bonus; recurring payments stay on the budget."
 ywc_lan.1017.settle_full.consequence_tooltip:0 "Only holds when the real high target held continuously."
 ywc_lan.1017.settle_compromise:0 "Settle on restricted blocks"
 ywc_lan.1017.settle_compromise.cost_tooltip:0 "No closing bonus."
 ywc_lan.1017.settle_compromise.consequence_tooltip:0 "Delivers only the narrow target, not co-management."
