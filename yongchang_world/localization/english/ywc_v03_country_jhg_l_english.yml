 ywc_jhg.1026.refuse:0 "Refuse to share the project"
 ywc_jhg.1026.refuse.cost_tooltip:0 "Neither side pays a project share."
 ywc_jhg.1026.refuse.consequence_tooltip:0 "Jinghai can choose a fixed share or ambiguity; its filing fee is retained."
