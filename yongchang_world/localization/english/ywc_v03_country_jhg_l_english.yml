 ywc_jhg.1025.switch_ambiguity:0 "Switch to ambiguous terms and restart the watch"
 ywc_jhg.1025.switch_ambiguity.cost_tooltip:0 "Paid costs are retained; no second filing fee."
 ywc_jhg.1025.switch_ambiguity.consequence_tooltip:0 "Choose a domestic route and restart its 180-day watch; signed project expenditures are not refunded."
 ywc_jhg.1025.switch_fixed_share:0 "Switch to a fixed share and restart the watch"
 ywc_jhg.1025.switch_fixed_share.cost_tooltip:0 "Paid costs are retained; no second filing fee."
 ywc_jhg.1025.switch_fixed_share.consequence_tooltip:0 "Choose a domestic route and restart its 180-day watch; signed project expenditures are not refunded."
