 ywc_jhg.1017.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1018.t:0 "Settling the Lanes"
 ywc_jhg.1018.d:0 "At six months, settlement depends on port staffing, administrative capacity, and the continuing qualification from an existing ally. If conditions fall short, only the lower target is available. This does not establish that an ally dispatched ships or extend escort to every lane."
 ywc_jhg.1018.settle_full:0 "Record the full domestic result"
 ywc_jhg.1018.settle_full.cost_tooltip:0 "No extra fee."
 ywc_jhg.1018.settle_full.consequence_tooltip:0 "Records the full domestic settlement and releases its country slot; it does not mean any foreign fleet was deployed."
 ywc_jhg.1018.settle_partial:0 "Record the limited compromise result"
