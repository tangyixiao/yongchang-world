 ywc_jhg.1019.t:0 "The Shipowners Bill"
 ywc_jhg.1019.d:0 "Once the scheme lands the shipowners bring a bill: premiums are up, turnaround is down, but at least every voyage is no longer pure luck."
 ywc_jhg.1019.insurance:0 "Let merchants carry premiums"
 ywc_jhg.1019.insurance.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs bureaucratic capacity."
 ywc_jhg.1019.insurance.consequence_tooltip:0 "The treasury avoids premiums; merchants carry more."
 ywc_jhg.1019.defer:0 "Defer until conditions recover"
 ywc_jhg.1019.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1019.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
