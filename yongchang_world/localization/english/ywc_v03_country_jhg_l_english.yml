 ywc_jhg.1018.limited_36_settlement.consequence_tooltip:0 "Switches the current route to its lower qualified target. A limited settlement becomes available only after all conditions hold continuously for a fresh 180 days."
 ywc_jhg.1019.t:0 "The Shipowners Bill"
 ywc_jhg.1019.d:0 "After the arrangement is recorded as settled, shipowners bring another bill. The treasury checks existing administrative capacity; no premiums, voyage times, or escort coverage are actually changed here."
 ywc_jhg.1019.insurance:0 "Register a merchant-premium proposal"
 ywc_jhg.1019.insurance.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs bureaucratic capacity."
 ywc_jhg.1019.insurance.consequence_tooltip:0 "Records the country’s chosen merchant-premium arrangement; it transfers no costs and changes neither treasury nor merchant finances."
 ywc_jhg.1019.defer:0 "Defer until conditions recover"
