 ywc_jhg.1019.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_je_v03_jhg_tribute_autonomy:0 "Autonomy on the Tribute List"
 ywc_je_v03_jhg_tribute_autonomy_reason:0 "A fixed share, project sharing or ambiguity. Every line of the list costs real money and reads real ties and finances."
 ywc_jhg.1020.t:0 "Autonomy on the Tribute List"
 ywc_jhg.1020.d:0 "The tribute sailing is due again. The household does not ask whether to send it but what the list buys in autonomy: a fixed share, project-by-project sharing, or more ambiguity."
 ywc_jhg.1020.fixed_share:0 "Fix a standing share"
 ywc_jhg.1020.fixed_share.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs bureaucracy of at least 20."
 ywc_jhg.1020.fixed_share.consequence_tooltip:0 "The share is fixed and the autonomy boundary with it."
 ywc_jhg.1020.project_share:0 "Share by project"
 ywc_jhg.1020.project_share.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs a real partner willing to pay."
 ywc_jhg.1020.project_share.consequence_tooltip:0 "The burden is shared but depends on the partner."
 ywc_jhg.1020.ambiguity:0 "Keep it ambiguous"
 ywc_jhg.1020.ambiguity.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs legitimacy of at least 30."
 ywc_jhg.1020.ambiguity.consequence_tooltip:0 "Flexible now, exposed to back-payment later."
 ywc_jhg.1020.defer:0 "Defer until conditions recover"
 ywc_jhg.1020.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1020.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1020.withdraw:0 "Withdraw the registration"
