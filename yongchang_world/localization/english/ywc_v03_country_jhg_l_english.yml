 ywc_jhg.1019.t:0 "The Shipowners Bill"
 ywc_jhg.1019.d:0 "After the arrangement is recorded as settled, shipowners bring another bill. The treasury checks existing administrative capacity; no premiums, voyage times, or escort coverage are actually changed here."
 ywc_jhg.1019.insurance:0 "Register a merchant-premium proposal"
 ywc_jhg.1019.insurance.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs bureaucratic capacity."
 ywc_jhg.1019.insurance.consequence_tooltip:0 "Records the country’s chosen merchant-premium arrangement; it transfers no costs and changes neither treasury nor merchant finances."
 ywc_jhg.1019.defer:0 "Defer until conditions recover"
 ywc_jhg.1019.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1019.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1019.withdraw:0 "Withdraw the registration"
 ywc_jhg.1019.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1019.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1030.t:0 "The Shared Escort Answer"
 ywc_jhg.1030.d:0 "Jinghai proposes limited shared escort at coverage level 2 for 120 months. On signature, Jinghai transfers half its filing fee, @money![SCOPE.GetValue('ywc_jhg_escort_request_cost')|0v], to the recipient. This records a joint plan rather than deploying a fleet; only the actual recipient can accept or refuse, and a stale answer cannot alter the terms."
 ywc_jhg.1030.accept:0 "Share the Escort on Captured Terms"
 ywc_jhg.1030.accept.cost_tooltip:0 "When Jinghai can afford it, signature transfers the captured cost share to the recipient; otherwise the accepted offer waits until expiry."
 ywc_jhg.1030.accept.consequence_tooltip:0 "The partnership binds only the partner and generation captured at signature; partner death suspends it instead of retargeting."
 ywc_jhg.1030.refuse:0 "Refuse to Share"
 ywc_jhg.1030.refuse.cost_tooltip:0 "Neither treasury is charged."
 ywc_jhg.1030.refuse.consequence_tooltip:0 "Jinghai receives the refusal and may keep the single-lane escort or insurance route; the filing fee already paid is not refunded."
 ywc_jhg.1030.stale_dismiss:0 "Dismiss a Stale Inquiry"
 ywc_jhg.1030.stale_dismiss.cost_tooltip:0 "No payment."
 ywc_jhg.1030.stale_dismiss.consequence_tooltip:0 "A stale inquiry cannot rewrite a later escort partnership."
 ywc_jhg.1031.t:0 "The Escort Partnership Ends"
 ywc_jhg.1031.d:0 "The captured escort term ends and only that generation’s partnership is cleared; paid costs and Jinghai’s own convoy progress are untouched."
 ywc_je_v03_jhg_tribute_autonomy:0 "Autonomy on the Tribute List"
 ywc_je_v03_jhg_tribute_autonomy_reason:0 "Choose a fixed share, ask the actual overlord to share a project, or leave terms ambiguous. Both sides pay a project share upon signature; later relationship changes do not refund expenditure."
 ywc_jhg.1020.t:0 "Autonomy on the Tribute List"
 ywc_jhg.1020.d:0 "Jinghai may choose a fixed share, ask its actual SHU overlord to share a project, or leave terms ambiguous. SHU answers independently. Each side contributes a project cost equal to the filing fee, which is separate from Jinghai’s nonrefundable filing fee."
 ywc_jhg.1020.fixed_share:0 "Propose a standing-share arrangement"
 ywc_jhg.1020.fixed_share.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs bureaucracy of at least 20."
 ywc_jhg.1020.fixed_share.consequence_tooltip:0 "The household records a proposed standing share; autonomy remains under the current order."
 ywc_jhg.1020.project_share:0 "Propose project-linked sharing"
 ywc_jhg.1020.project_share.cost_tooltip:0 "The filing fee is annual gross income at entry ÷ 52, minimum 100 and maximum 1,000,000,000. If SHU accepts and both can afford it, each separately pays that same amount toward the project; no building is automatically constructed."
 ywc_jhg.1020.project_share.consequence_tooltip:0 "Sends terms only to the actual SHU overlord; shared-project settlement requires its answer and both payments."
 ywc_jhg.1020.ambiguity:0 "Leave the tribute terms open"
 ywc_jhg.1020.ambiguity.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs legitimacy of at least 30."
 ywc_jhg.1020.ambiguity.consequence_tooltip:0 "Keep the terms open while the existing legitimacy requirement holds; no standing share is set yet."
 ywc_jhg.1020.defer:0 "Defer until conditions recover"
 ywc_jhg.1020.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1020.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1020.withdraw:0 "Withdraw the registration"
 ywc_jhg.1020.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1020.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1021.t:0 "The Overlords Letter"
 ywc_jhg.1021.d:0 "The overlord asks why this year’s list is late. A fixed share may be proposed where an existing overlord or allied tie qualifies. Registration records the country’s choice; relations remain subject to their existing conditions and do not improve automatically."
 ywc_jhg.1021.fixed_share:0 "Propose a fixed share in reply"
 ywc_jhg.1021.fixed_share.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs a real overlord or allied tie."
 ywc_jhg.1021.fixed_share.consequence_tooltip:0 "Registers the country’s fixed-share proposal; it does not stabilize relations or change autonomy automatically."
 ywc_jhg.1021.switch_ambiguity:0 "Switch to domestic ambiguous terms"
 ywc_jhg.1021.switch_ambiguity.cost_tooltip:0 "No second filing fee; the unsigned project inquiry is cancelled."
 ywc_jhg.1021.switch_ambiguity.consequence_tooltip:0 "A domestic plan remains selectable after the overlord is lost, without changing independence. Fixed tribute still requires a real relationship; an independent ambiguity plan can settle on domestic conditions."
 ywc_jhg.1021.switch_fixed_share:0 "Switch to the domestic fixed-share plan"
 ywc_jhg.1021.switch_fixed_share.cost_tooltip:0 "No second filing fee; the unsigned project inquiry is cancelled."
 ywc_jhg.1021.switch_fixed_share.consequence_tooltip:0 "A domestic plan remains selectable after the overlord is lost, without changing independence. Fixed tribute still requires a real relationship; an independent ambiguity plan can settle on domestic conditions."
 ywc_jhg.1021.continue_domestic:0 "Keep the domestic plan and continue the accounts"
 ywc_jhg.1021.continue_domestic.cost_tooltip:0 "The paid filing fee is retained; no further charge."
 ywc_jhg.1021.continue_domestic.consequence_tooltip:0 "Keeps the domestic fixed-share or ambiguity plan; settlement still requires a real qualifying relationship."
 ywc_jhg.1021.defer:0 "Defer until conditions recover"
 ywc_jhg.1021.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1021.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1021.withdraw:0 "Withdraw the registration"
 ywc_jhg.1021.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1021.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1022.t:0 "The Shared Account"
 ywc_jhg.1022.d:0 "The treasury checks SHU’s actual answer, both project expenditures and the agreed term. While unsigned, refused or lacking the overlord relationship, Jinghai can wait, ask again, or switch to a fixed share or ambiguity."
 ywc_jhg.1022.project_share:0 "Continue with the signed joint project"
 ywc_jhg.1022.project_share.cost_tooltip:0 "Each side has already paid its project share; this step charges nothing further."
 ywc_jhg.1022.project_share.consequence_tooltip:0 "Requires the current actual partnership; it does not change subject status or construct buildings."
 ywc_jhg.1022.continue_domestic:0 "Continue the selected domestic plan"
 ywc_jhg.1022.continue_domestic.cost_tooltip:0 "The filing fee is already paid; this step charges nothing further."
 ywc_jhg.1022.continue_domestic.consequence_tooltip:0 "Keeps the selected domestic route and cancels unsigned inquiries without inventing a foreign commitment."
 ywc_jhg.1022.request_shu:0 "Ask SHU again to share the project"
 ywc_jhg.1022.request_shu.cost_tooltip:0 "No second filing fee; if both agree and can pay, each contributes a project share equal to the filing fee."
 ywc_jhg.1022.request_shu.consequence_tooltip:0 "Sends a new generation of terms to the actual overlord; old answers cannot be reused."
 ywc_jhg.1022.ambiguity:0 "Switch to ambiguous terms"
 ywc_jhg.1022.ambiguity.cost_tooltip:0 "The paid filing fee and signed project expenditures are retained and not charged twice."
 ywc_jhg.1022.ambiguity.consequence_tooltip:0 "Cancels an unsigned inquiry and chooses a domestic plan. Fixed tribute still requires a real relationship; independent ambiguity can settle on domestic conditions."
 ywc_jhg.1022.fixed_share:0 "Switch to a fixed share"
 ywc_jhg.1022.fixed_share.cost_tooltip:0 "The paid filing fee and signed project expenditures are retained and not charged twice."
 ywc_jhg.1022.fixed_share.consequence_tooltip:0 "Cancels an unsigned inquiry and chooses a domestic plan. Fixed tribute still requires a real relationship; independent ambiguity can settle on domestic conditions."
 ywc_jhg.1022.defer:0 "Defer until conditions recover"
 ywc_jhg.1022.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1022.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1022.withdraw:0 "Withdraw the registration"
 ywc_jhg.1022.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1022.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1023.t:0 "What Ambiguity Costs"
 ywc_jhg.1023.d:0 "The ambiguity route may be registered when the existing legitimacy qualification permits it. The record does not waive the country’s filing fee or automatically create a future back-payment."
 ywc_jhg.1023.ambiguity:0 "Leave the tribute terms open"
 ywc_jhg.1023.ambiguity.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs legitimacy."
 ywc_jhg.1023.ambiguity.consequence_tooltip:0 "Records the country’s choice to retain ambiguity; it creates no additional cash saving or new back-payment."
 ywc_jhg.1023.defer:0 "Defer until conditions recover"
 ywc_jhg.1023.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1023.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1023.withdraw:0 "Withdraw the registration"
 ywc_jhg.1023.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1023.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1024.t:0 "Six Months of Reconciliation"
 ywc_jhg.1024.d:0 "Review the chosen arrangement’s relationship, finances and administration. Project sharing requires the signed parties, term and real payments; a domestic switch does not refund spending."
 ywc_jhg.1024.hold_course:0 "Reconcile under the current arrangement"
 ywc_jhg.1024.hold_course.cost_tooltip:0 "No extra fee."
 ywc_jhg.1024.hold_course.consequence_tooltip:0 "Observation continues; settlement after six months."
 ywc_jhg.1024.defer:0 "Defer until conditions recover"
 ywc_jhg.1024.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1024.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1024.withdraw:0 "Withdraw the registration"
 ywc_jhg.1024.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1024.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1025.t:0 "Settling the Tribute List"
 ywc_jhg.1025.d:0 "Settlement checks the real relationship, finances and chosen plan. Fixed tribute needs a qualifying relationship; an independent Jinghai may settle ambiguity on domestic conditions. Project sharing also requires a live agreement paid by both sides; no autonomy law or building changes automatically."
 ywc_jhg.1025.settle_full:0 "Record the full domestic result"
