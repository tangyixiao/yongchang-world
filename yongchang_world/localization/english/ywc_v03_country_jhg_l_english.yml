 ywc_jhg.1025.acknowledge_12_notice:0 "Acknowledge the 12-month notice and keep the existing schedule"
 ywc_jhg.1025.acknowledge_12_notice.cost_tooltip:0 "No fee."
 ywc_jhg.1025.acknowledge_12_notice.consequence_tooltip:0 "Keeps the ordinary event queue intact; the notice does not replace pending work."
 ywc_jhg.1025.limited_36_settlement:0 "Choose the lower target and restart a 180-day watch"
 ywc_jhg.1025.limited_36_settlement.cost_tooltip:0 "No fee."
 ywc_jhg.1025.limited_36_settlement.consequence_tooltip:0 "Switches the current route to its lower qualified target. A limited settlement becomes available only after all conditions hold continuously for a fresh 180 days."
 ywc_jhg.1026.t:0 "SHU Answers the Project Proposal"
 ywc_jhg.1026.d:0 "Jinghai proposes a 120-month joint project. On signature Jinghai spends @money![SCOPE.GetValue('ywc_jhg_share_request_jhg_cost')|0v] and SHU spends @money![SCOPE.GetValue('ywc_jhg_share_request_shu_cost')|0v]. These are each side’s project expenditures; no building or subject relationship is changed automatically."
 ywc_jhg.1026.accept:0 "Accept the joint project terms"
 ywc_jhg.1026.accept.cost_tooltip:0 "Both captured project shares are debited only when both can afford them; otherwise the answer waits until the inquiry expires."
 ywc_jhg.1026.accept.consequence_tooltip:0 "Records the term and payments without constructing a building or changing subject status."
 ywc_jhg.1026.refuse:0 "Refuse to share the project"
 ywc_jhg.1026.refuse.cost_tooltip:0 "Neither side pays a project share."
 ywc_jhg.1026.refuse.consequence_tooltip:0 "Jinghai can choose a fixed share or ambiguity; its filing fee is retained."
 ywc_jhg.1026.stale_dismiss:0 "Dismiss the stale inquiry"
 ywc_jhg.1026.stale_dismiss.cost_tooltip:0 "No payment."
 ywc_jhg.1026.stale_dismiss.consequence_tooltip:0 "A stale answer cannot alter a newer agreement."
 ywc_jhg.1027.t:0 "The Project Agreement Ends"
 ywc_jhg.1027.d:0 "Ends only the captured project-agreement generation; neither side receives a refund."
