 ywc_je_v03_jhg_tribute_autonomy:0 "Autonomy on the Tribute List"
 ywc_je_v03_jhg_tribute_autonomy_reason:0 "The country may register a fixed share, propose a joint project, or retain ambiguity. The domestic treasury pays one filing fee, while existing relations, fiscal, and administrative qualifications are read. A project proposal does not mean foreign assent or payment."
 ywc_jhg.1020.t:0 "Autonomy on the Tribute List"
 ywc_jhg.1020.d:0 "The tribute sailing is due again. The household must choose a domestic arrangement: a fixed share, a proposal tied to a joint project, or continued ambiguity. The project proposal requires an existing qualifying partner relationship; choosing it does not mean the other side has agreed or paid."
 ywc_jhg.1020.fixed_share:0 "Propose a standing-share arrangement"
 ywc_jhg.1020.fixed_share.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs bureaucracy of at least 20."
 ywc_jhg.1020.fixed_share.consequence_tooltip:0 "The household records a proposed standing share; autonomy remains under the current order."
 ywc_jhg.1020.project_share:0 "Propose project-linked sharing"
 ywc_jhg.1020.project_share.cost_tooltip:0 "One-time fee for this arc: 1/52 of annual gross income, snapshotted at entry and debited from this country’s treasury. Requires no default, no bankruptcy, and a qualifying existing partner relationship. This fee is neither tribute nor a partner payment."
 ywc_jhg.1020.project_share.consequence_tooltip:0 "Registers the country’s project-sharing proposal; it does not record partner assent or payment of tribute."
 ywc_jhg.1020.ambiguity:0 "Leave the tribute terms open"
 ywc_jhg.1020.ambiguity.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs legitimacy of at least 30."
 ywc_jhg.1020.ambiguity.consequence_tooltip:0 "Keep the terms open while the existing legitimacy requirement holds; no standing share is set yet."
 ywc_jhg.1020.defer:0 "Defer until conditions recover"
 ywc_jhg.1020.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1020.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1020.withdraw:0 "Withdraw the registration"
 ywc_jhg.1020.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1020.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1021.t:0 "The Overlords Letter"
 ywc_jhg.1021.d:0 "The overlord asks why this year’s list is late. A fixed share may be proposed where an existing overlord or allied tie qualifies. Registration records the country’s choice; relations remain subject to their existing conditions and do not improve automatically."
 ywc_jhg.1021.fixed_share:0 "Propose a fixed share in reply"
 ywc_jhg.1021.fixed_share.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs a real overlord or allied tie."
 ywc_jhg.1021.fixed_share.consequence_tooltip:0 "Registers the country’s fixed-share proposal; it does not stabilize relations or change autonomy automatically."
 ywc_jhg.1021.defer:0 "Defer until conditions recover"
 ywc_jhg.1021.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1021.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1021.withdraw:0 "Withdraw the registration"
 ywc_jhg.1021.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1021.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1022.t:0 "The Shared Account"
 ywc_jhg.1022.d:0 "The treasury lays out a joint-project proposal. This domestic arrangement is available only when an existing partner relationship meets the qualification. It transfers no partner funds and records no promise by the partner to share the tribute."
 ywc_jhg.1022.project_share:0 "Propose a joint-project arrangement"
 ywc_jhg.1022.project_share.cost_tooltip:0 "One-time fee for this arc: 1/52 of annual gross income, snapshotted at entry and debited from this country’s treasury. Requires no default, no bankruptcy, and the existing partner and solvency qualifications. No partner funds are transferred."
 ywc_jhg.1022.project_share.consequence_tooltip:0 "Records the country’s project proposal; it does not represent partner assent, payment, or a share of tribute."
 ywc_jhg.1022.defer:0 "Defer until conditions recover"
 ywc_jhg.1022.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1022.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1022.withdraw:0 "Withdraw the registration"
 ywc_jhg.1022.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1022.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1023.t:0 "What Ambiguity Costs"
 ywc_jhg.1023.d:0 "The ambiguity route may be registered when the existing legitimacy qualification permits it. The record does not waive the country’s filing fee or automatically create a future back-payment."
 ywc_jhg.1023.ambiguity:0 "Leave the tribute terms open"
 ywc_jhg.1023.ambiguity.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs legitimacy."
 ywc_jhg.1023.ambiguity.consequence_tooltip:0 "Records the country’s choice to retain ambiguity; it creates no additional cash saving or new back-payment."
 ywc_jhg.1023.defer:0 "Defer until conditions recover"
 ywc_jhg.1023.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1023.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1023.withdraw:0 "Withdraw the registration"
 ywc_jhg.1023.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1023.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1024.t:0 "Six Months of Reconciliation"
 ywc_jhg.1024.d:0 "The arrangement and one-time filing fee are on the domestic books. Over the next six months, the check is whether existing relations, fiscal, and administrative qualifications continue to hold; it does not await a new payment from the other side."
 ywc_jhg.1024.hold_course:0 "Reconcile under the current arrangement"
 ywc_jhg.1024.hold_course.cost_tooltip:0 "No extra fee."
 ywc_jhg.1024.hold_course.consequence_tooltip:0 "Observation continues; settlement after six months."
 ywc_jhg.1024.defer:0 "Defer until conditions recover"
 ywc_jhg.1024.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1024.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1024.withdraw:0 "Withdraw the registration"
 ywc_jhg.1024.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1024.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1025.t:0 "Settling the Tribute List"
 ywc_jhg.1025.d:0 "At settlement, existing relations, fiscal, and administrative conditions determine whether the full or compromise result is available. The result records the country’s chosen tribute arrangement; it does not enact a new autonomy law, transfer foreign funds, or create a foreign commitment."
 ywc_jhg.1025.settle_full:0 "Record the full domestic result"
 ywc_jhg.1025.settle_full.cost_tooltip:0 "No extra fee."
 ywc_jhg.1025.settle_full.consequence_tooltip:0 "Writes the arc outcome and releases the slot."
 ywc_jhg.1025.settle_partial:0 "Record a compromise settlement"
 ywc_jhg.1025.settle_partial.cost_tooltip:0 "No extra fee."
 ywc_jhg.1025.settle_partial.consequence_tooltip:0 "Writes the compromise outcome and releases the slot."
 ywc_jhg.1025.defer:0 "Defer until conditions recover"
 ywc_jhg.1025.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1025.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1025.withdraw:0 "Withdraw the registration"
 ywc_jhg.1025.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1025.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1025.acknowledge_12_notice:0 "Acknowledge the 12-month notice and keep the existing schedule"
 ywc_jhg.1025.acknowledge_12_notice.cost_tooltip:0 "No fee."
 ywc_jhg.1025.acknowledge_12_notice.consequence_tooltip:0 "Keeps the ordinary event queue intact; the notice does not replace pending work."
 ywc_jhg.1025.limited_36_settlement:0 "Choose the lower target and restart a 180-day watch"
 ywc_jhg.1025.limited_36_settlement.cost_tooltip:0 "No fee."
 ywc_jhg.1025.limited_36_settlement.consequence_tooltip:0 "Switches the current route to its lower qualified target. A limited settlement becomes available only after all conditions hold continuously for a fresh 180 days."
