 ywc_jhg.1018.acknowledge_12_notice.consequence_tooltip:0 "Keeps the ordinary event queue intact; the notice does not replace pending work."
 ywc_jhg.1018.limited_36_settlement:0 "Choose the lower target and restart a 180-day watch"
