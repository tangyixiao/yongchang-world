 ywc_je_v03_jhg_court_assembly:0 "The Household Ledger and the Merchants Council"
 ywc_je_v03_jhg_court_assembly_reason:0 "Ledgers, a household guarantee, and a merchant proposal each carry a choice. The country’s treasury pays one filing fee when the matter is opened; later settlement checks staffing and existing route qualifications and grants no legitimacy."
 ywc_je_v03_jhg_court_settlement:0 "Settling the Ledger"
 ywc_je_v03_jhg_court_settlement_reason:0 "The clerks spread six months of ledgers across the table, comparing each quarter’s customs returns and the staff at their posts. If the arrangement holds, the council can close on its full terms; if not, the household may settle for a compromise."
 ywc_jhg.1000.t:0 "The Household Ledger and the Merchants Council"
 ywc_jhg.1000.d:0 "The customs ledgers lie across the household table, with shipowners below. No outside purse is on offer: the choices are domestic terms—open the books in pursuit of credit, put the household name behind a guarantee, or propose priority clearance for merchants. Each route begins with the country’s filing fee."
 ywc_jhg.1000.audit_contract:0 "Register the audit-contract proposal"
 ywc_jhg.1000.audit_contract.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs staffed bureaucracy."
 ywc_jhg.1000.audit_contract.consequence_tooltip:0 "Registers the domestic audit arrangement; it adds no administrative burden or legitimacy."
 ywc_jhg.1000.prince_guarantee:0 "Register the household guarantee proposal"
 ywc_jhg.1000.prince_guarantee.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs a property-representation law."
 ywc_jhg.1000.prince_guarantee.consequence_tooltip:0 "Registers the domestic guarantee arrangement; it separately changes no authority, landowner support, or transparency."
 ywc_jhg.1000.merchant_pool:0 "Propose merchant priority clearance"
 ywc_jhg.1000.merchant_pool.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs powerful industrialists."
 ywc_jhg.1000.merchant_pool.consequence_tooltip:0 "Registers a domestic priority-clearance arrangement; it changes no tax base, legitimacy, or interest-group strength."
 ywc_jhg.1000.defer:0 "Defer until conditions recover"
 ywc_jhg.1000.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1000.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1000.withdraw:0 "Withdraw the registration"
 ywc_jhg.1000.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1000.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1001.t:0 "The Fine Print of the Audit Contract"
 ywc_jhg.1001.d:0 "The council wants quarterly customs ledgers and two shipowners at the table. The household treasury worries: once open, who verifies it?"
 ywc_jhg.1001.audit_contract:0 "Record quarterly-disclosure terms"
 ywc_jhg.1001.audit_contract.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs staffed administration."
 ywc_jhg.1001.audit_contract.consequence_tooltip:0 "Continues qualification checks against existing administration and staffing; it adds no burden or legitimacy."
 ywc_jhg.1001.defer:0 "Defer until conditions recover"
 ywc_jhg.1001.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1001.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1001.withdraw:0 "Withdraw the registration"
 ywc_jhg.1001.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1001.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1002.t:0 "The Price of the Household Guarantee"
 ywc_jhg.1002.d:0 "The household guarantee is proposed for the record. Further registration depends on the existing legitimacy threshold; this choice does not mean that the bankers have issued loans."
 ywc_jhg.1002.prince_guarantee:0 "Register the household guarantee proposal"
 ywc_jhg.1002.prince_guarantee.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs legitimacy of at least 30."
 ywc_jhg.1002.prince_guarantee.consequence_tooltip:0 "Checks the domestic guarantee plan against the existing legitimacy threshold; it adds no authority."
 ywc_jhg.1002.defer:0 "Defer until conditions recover"
 ywc_jhg.1002.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1002.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1002.withdraw:0 "Withdraw the registration"
 ywc_jhg.1002.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1002.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1003.t:0 "The Merchants Pool Their Books"
 ywc_jhg.1003.d:0 "Merchants propose three years of priority clearance as a domestic arrangement. The treasury checks the existing qualifications: the Industrialists must be powerful and the country must afford its one-time filing fee. No merchant advance is transferred to the treasury."
 ywc_jhg.1003.merchant_pool:0 "Register the priority-clearance proposal"
 ywc_jhg.1003.merchant_pool.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs powerful industrialists and no default."
 ywc_jhg.1003.merchant_pool.consequence_tooltip:0 "Registers the domestic priority-clearance arrangement; it transfers no merchant advance and changes no tax base, legitimacy, or Industrialist strength."
 ywc_jhg.1003.defer:0 "Defer until conditions recover"
 ywc_jhg.1003.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1003.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1003.withdraw:0 "Withdraw the registration"
 ywc_jhg.1003.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1003.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1004.t:0 "The Clerks Who Must Be at Their Desks"
 ywc_jhg.1004.d:0 "The audit contract demands quarterly checks, yet half the customs clerks positions stand empty. Vacancy is not paperwork: it decides whether the contract can be honoured."
 ywc_jhg.1004.audit_contract:0 "Verify current clerk staffing"
 ywc_jhg.1004.audit_contract.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs administration occupancy of at least 80%."
 ywc_jhg.1004.audit_contract.consequence_tooltip:0 "The country pays its one-time filing fee and must meet the existing staffing threshold; no recurring administrative charge is added."
 ywc_jhg.1004.defer:0 "Defer until conditions recover"
 ywc_jhg.1004.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1004.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1004.withdraw:0 "Withdraw the registration"
 ywc_jhg.1004.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1004.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1005.t:0 "Who Speaks for Property"
 ywc_jhg.1005.d:0 "The council claims the taxpaying shipowners; the household says it cannot speak for the island landowners. Who sits at the table depends on how this country defines property representation."
 ywc_jhg.1005.prince_guarantee:0 "Confirm representation under current law"
 ywc_jhg.1005.prince_guarantee.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs a representation law or landowner power."
 ywc_jhg.1005.prince_guarantee.consequence_tooltip:0 "Checks representation eligibility against existing law or landowner strength; it adds no legitimacy."
 ywc_jhg.1005.defer:0 "Defer until conditions recover"
 ywc_jhg.1005.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1005.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1005.withdraw:0 "Withdraw the registration"
 ywc_jhg.1005.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1005.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1006.t:0 "Six Months of Watching"
 ywc_jhg.1006.d:0 "The treasury has paid the one-time filing fee. Over the next six months, the books will be checked against staffing and the existing qualifications. The observation itself grants no legitimacy."
 ywc_jhg.1006.hold_course:0 "Continue observing the current arrangement"
 ywc_jhg.1006.hold_course.cost_tooltip:0 "No extra fee."
 ywc_jhg.1006.hold_course.consequence_tooltip:0 "Observation continues; settlement comes after six months."
 ywc_jhg.1006.defer:0 "Defer until conditions recover"
 ywc_jhg.1006.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1006.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1006.withdraw:0 "Withdraw the registration"
 ywc_jhg.1006.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1006.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1007.t:0 "Settling the Ledger"
 ywc_jhg.1007.d:0 "At six months, the result is checked against staffing and the existing qualifications. A full or compromise settlement records the domestic outcome; it does not separately change legitimacy, authority, the tax base, or interest-group strength."
 ywc_jhg.1007.settle_full:0 "Record the full domestic settlement"
 ywc_jhg.1007.settle_full.cost_tooltip:0 "No extra fee."
 ywc_jhg.1007.settle_full.consequence_tooltip:0 "Writes the arc outcome and releases the slot."
 ywc_jhg.1007.settle_partial:0 "Record a compromise settlement"
 ywc_jhg.1007.settle_partial.cost_tooltip:0 "No extra fee."
 ywc_jhg.1007.settle_partial.consequence_tooltip:0 "Writes the compromise outcome and releases the slot."
 ywc_jhg.1007.defer:0 "Defer until conditions recover"
 ywc_jhg.1007.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1007.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1007.withdraw:0 "Withdraw the registration"
 ywc_jhg.1007.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1007.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1007.acknowledge_12_notice:0 "Acknowledge the 12-month notice and keep the existing schedule"
 ywc_jhg.1007.acknowledge_12_notice.cost_tooltip:0 "No fee."
 ywc_jhg.1007.acknowledge_12_notice.consequence_tooltip:0 "Keeps the ordinary event queue intact; the notice does not replace pending work."
 ywc_jhg.1007.limited_36_settlement:0 "Choose the lower target and restart a 180-day watch"
 ywc_jhg.1007.limited_36_settlement.cost_tooltip:0 "No fee."
 ywc_jhg.1007.limited_36_settlement.consequence_tooltip:0 "Switches the current route to its lower qualified target. A limited settlement becomes available only after all conditions hold continuously for a fresh 180 days."
 ywc_je_v03_jhg_convoy_capacity:0 "An Escort Is Not a Sentence"
 ywc_je_v03_jhg_convoy_capacity_reason:0 "Seven lanes and three flotillas cannot cover every lane. Register a limited main lane, ask an actual partner to share the escort, or propose domestic insurance."
 ywc_je_v03_jhg_convoy_partner_watch:0 "The Partner Who Shares the Watch"
 ywc_je_v03_jhg_convoy_partner_watch_reason:0 "The admiral checks the inquiry, the partner's answer and the agreed cost and term. If the partner loses the ability to contribute, the partnership pauses and the domestic plan can be reconsidered. These accounts do not automatically deploy a joint fleet."
 ywc_je_v03_jhg_convoy_settlement:0 "Settling the Lanes"
 ywc_je_v03_jhg_convoy_settlement_reason:0 "Check domestic conditions for the chosen plan. Shared escort also checks its signed partner and any recovery period. A completed domestic watch is retained; a new domestic route needs a fresh watch."
 ywc_jhg.1010.t:0 "An Escort Is Not a Sentence"
 ywc_jhg.1010.d:0 "The harbour council lists the lanes needing escort. Jinghai cannot cover every sea for free with its current fleet and budget: it may concentrate on the main lane, invite Lanfang or Dongming to share on stated terms, or register domestic commercial insurance. The invited country decides for itself."
 ywc_jhg.1010.main_lane:0 "Register a main-lane plan"
 ywc_jhg.1010.main_lane.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs a real navy and staffed ports."
 ywc_jhg.1010.main_lane.consequence_tooltip:0 "Registers a domestic plan limited to the main lane; no fleet is actually deployed and no all-lane escort is created."
 ywc_jhg.1010.shared_escort:0 "Invite Lanfang to share the escort"
 ywc_jhg.1010.shared_escort.cost_tooltip:0 "The one-off filing fee is annual gross income at entry ÷ 52, with a minimum of 100 and maximum of 1,000,000,000; it is not charged twice. If the partner agrees and Jinghai can afford it, half the filing fee is transferred to that partner."
 ywc_jhg.1010.shared_escort.consequence_tooltip:0 "Only Lanfang receives this inquiry and independently accepts or refuses its cost and term. Refusal or expiry leaves the main-lane and domestic-insurance alternatives."
 ywc_jhg.1010.shared_escort_dmg:0 "Invite Dongming to share the escort"
 ywc_jhg.1010.shared_escort_dmg.cost_tooltip:0 "The one-off filing fee is annual gross income at entry ÷ 52, with a minimum of 100 and maximum of 1,000,000,000; it is not charged twice. If the partner agrees and Jinghai can afford it, half the filing fee is transferred to that partner."
 ywc_jhg.1010.shared_escort_dmg.consequence_tooltip:0 "Only Dongming receives this inquiry and independently accepts or refuses its cost and term. Refusal or expiry leaves the main-lane and domestic-insurance alternatives."
 ywc_jhg.1010.insurance:0 "Register a domestic insurance proposal"
 ywc_jhg.1010.insurance.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs bureaucratic capacity and no default."
 ywc_jhg.1010.insurance.consequence_tooltip:0 "Registers a domestic commercial-insurance arrangement; it does not reduce naval strain or pay merchants’ premiums."
 ywc_jhg.1010.defer:0 "Defer until conditions recover"
 ywc_jhg.1010.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1010.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1010.withdraw:0 "Withdraw the registration"
 ywc_jhg.1010.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1010.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1011.t:0 "Flags and Dry Docks"
 ywc_jhg.1011.d:0 "Flags and docks both need people to maintain them. A main-lane plan checks Jinghai’s staffed ports; a signed partnership can continue on its own terms, or the country can choose domestic insurance. A written agreement does not automatically dispatch ships."
 ywc_jhg.1011.main_lane:0 "Check current staffing at main-lane ports"
 ywc_jhg.1011.main_lane.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs port occupancy of at least 80%."
 ywc_jhg.1011.main_lane.consequence_tooltip:0 "Records a domestic plan limited to the main lane; other lanes remain outside the proposed schedule."
 ywc_jhg.1011.shared_escort:0 "Arrange the flags under the signed partnership"
 ywc_jhg.1011.shared_escort.cost_tooltip:0 "The share was paid when the partnership was signed; this step charges nothing further."
 ywc_jhg.1011.shared_escort.consequence_tooltip:0 "Uses the still-active partnership without requiring a fully staffed Jinghai port; it does not deploy a fleet automatically."
 ywc_jhg.1011.insurance:0 "Switch to domestic insurance"
 ywc_jhg.1011.insurance.cost_tooltip:0 "The paid filing fee is retained and is not charged again here."
 ywc_jhg.1011.insurance.consequence_tooltip:0 "Cancel any unsigned inquiry and use domestic insurance; a signed and paid partnership remains recorded."
 ywc_jhg.1011.defer:0 "Defer until conditions recover"
 ywc_jhg.1011.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1011.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1011.withdraw:0 "Withdraw the registration"
 ywc_jhg.1011.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1011.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1012.t:0 "The Partner Who Shares the Watch"
 ywc_jhg.1012.d:0 "The Admiralty brings the escort accounts to the household. The actual reply, signed terms and the partner’s present capacity determine whether shared escort can continue; waiting, a renewed inquiry, the main lane and insurance remain distinct choices."
 ywc_jhg.1012.shared_escort:0 "Continue under the signed escort partnership"
 ywc_jhg.1012.shared_escort.cost_tooltip:0 "The signed partnership share has already been paid; this step charges nothing further."
 ywc_jhg.1012.shared_escort.consequence_tooltip:0 "Requires the actual partnership to remain active; the main lane and domestic insurance remain available if the partner is lost."
 ywc_jhg.1012.main_lane:0 "Register a main-lane plan"
 ywc_jhg.1012.main_lane.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs a real navy and staffed ports."
 ywc_jhg.1012.main_lane.consequence_tooltip:0 "Switch to this domestic route; any unsigned inquiry is cancelled, and the filing fee and signed-partnership payments are preserved."
 ywc_jhg.1012.insurance:0 "Register a domestic insurance proposal"
 ywc_jhg.1012.insurance.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs bureaucratic capacity and no default."
 ywc_jhg.1012.insurance.consequence_tooltip:0 "Switch to this domestic route; any unsigned inquiry is cancelled, and the filing fee and signed-partnership payments are preserved."
 ywc_jhg.1012.request_lan:0 "Ask Lanfang to share the escort"
 ywc_jhg.1012.request_lan.cost_tooltip:0 "The one-off filing fee is annual gross income at entry ÷ 52, with a minimum of 100 and maximum of 1,000,000,000; it is not charged twice. If the partner agrees and Jinghai can afford it, half the filing fee is transferred to that partner."
 ywc_jhg.1012.request_lan.consequence_tooltip:0 "Only Lanfang receives this inquiry and independently accepts or refuses its cost and term. Refusal or expiry leaves the main-lane and domestic-insurance alternatives."
 ywc_jhg.1012.request_dmg:0 "Ask Dongming to share the escort"
 ywc_jhg.1012.request_dmg.cost_tooltip:0 "The one-off filing fee is annual gross income at entry ÷ 52, with a minimum of 100 and maximum of 1,000,000,000; it is not charged twice. If the partner agrees and Jinghai can afford it, half the filing fee is transferred to that partner."
 ywc_jhg.1012.request_dmg.consequence_tooltip:0 "Only Dongming receives this inquiry and independently accepts or refuses its cost and term. Refusal or expiry leaves the main-lane and domestic-insurance alternatives."
 ywc_jhg.1012.defer:0 "Defer until conditions recover"
 ywc_jhg.1012.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1012.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1012.withdraw:0 "Withdraw the registration"
 ywc_jhg.1012.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1012.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1013.t:0 "The Bill for the Fleet"
 ywc_jhg.1013.d:0 "The navy asks to expand, while the treasury first checks the existing fleet-size qualification and whether the country can pay its filing fee. Choosing the main-lane plan does not automatically raise naval spending or expand the fleet."
 ywc_jhg.1013.main_lane:0 "Register a main-lane plan"
 ywc_jhg.1013.main_lane.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs a minimum navy size."
 ywc_jhg.1013.main_lane.consequence_tooltip:0 "Keeps the domestic plan to the main lane; it adds no naval spending and does not extend to every route."
 ywc_jhg.1013.defer:0 "Defer until conditions recover"
 ywc_jhg.1013.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1013.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1013.withdraw:0 "Withdraw the registration"
 ywc_jhg.1013.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1013.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1014.t:0 "The Underwriters Terms"
 ywc_jhg.1014.d:0 "The underwriters’ proposal requires the country to meet the existing administrative threshold. Choosing this route records a domestic plan; it does not mean underwriters have covered the lanes or change merchant premiums."
 ywc_jhg.1014.insurance:0 "Register a commercial-insurance proposal"
 ywc_jhg.1014.insurance.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs bureaucracy of at least 20."
 ywc_jhg.1014.insurance.consequence_tooltip:0 "Checks insurance eligibility against existing administrative capacity; it changes neither naval strain nor merchant premiums."
 ywc_jhg.1014.defer:0 "Defer until conditions recover"
 ywc_jhg.1014.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1014.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1014.withdraw:0 "Withdraw the registration"
 ywc_jhg.1014.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1014.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1015.t:0 "The Seventh Sea"
 ywc_jhg.1015.d:0 "The council again puts \"escort every lane\" on the table. The admiral pushes the chart away: covering all seven needs a standing escort fund nobody has ever agreed to fund."
 ywc_jhg.1015.explain_limits:0 "Acknowledge the escort limit"
 ywc_jhg.1015.explain_limits.cost_tooltip:0 "No extra fee."
 ywc_jhg.1015.explain_limits.consequence_tooltip:0 "Full coverage stays unreachable; only limited coverage is possible."
 ywc_jhg.1015.defer:0 "Defer until conditions recover"
 ywc_jhg.1015.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1015.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1015.withdraw:0 "Withdraw the registration"
 ywc_jhg.1015.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1015.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1016.t:0 "The Standing of the Fleet"
 ywc_jhg.1016.d:0 "Merchants argue that the existing naval law and fleet qualifications determine whether the escort proposal can continue. Registering a main-lane plan neither creates a standing navy nor turns the plan into an actual deployment."
 ywc_jhg.1016.main_lane:0 "Register a main-lane plan under current naval law"
 ywc_jhg.1016.main_lane.cost_tooltip:0 "One-off filing fee = annual gross income / 52 snapshotted at entry, debited from the treasury; requires no default and no bankruptcy.  Also needs a naval law and a real fleet."
 ywc_jhg.1016.main_lane.consequence_tooltip:0 "Checks existing naval-law and fleet qualifications; it creates no fleet or escort deployment."
 ywc_jhg.1016.defer:0 "Defer until conditions recover"
 ywc_jhg.1016.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1016.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1016.withdraw:0 "Withdraw the registration"
 ywc_jhg.1016.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1016.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1017.t:0 "Six Months of Open Water"
 ywc_jhg.1017.d:0 "The filing fee is paid. The six-month watch checks domestic capacity for the selected plan; shared escort also checks the actual signed partner and its present capacity. An interruption preserves a completed domestic record, but recovery requires 180 days of renewed continuous verification."
 ywc_jhg.1017.hold_course:0 "Continue review under the current plan"
 ywc_jhg.1017.hold_course.cost_tooltip:0 "No extra fee."
 ywc_jhg.1017.hold_course.consequence_tooltip:0 "Observation continues; settlement after six months."
 ywc_jhg.1017.defer:0 "Defer until conditions recover"
 ywc_jhg.1017.defer.cost_tooltip:0 "No fee."
 ywc_jhg.1017.defer.consequence_tooltip:0 "Registration stays open and can be retried once conditions recover."
 ywc_jhg.1017.withdraw:0 "Withdraw the registration"
 ywc_jhg.1017.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1017.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1018.t:0 "Settling the Lanes"
 ywc_jhg.1018.d:0 "Settlement checks the domestic conditions for the chosen route. Shared escort also requires the signed partner to remain active and pass any recovery watch. A completed domestic record is retained; switching to the main lane or domestic insurance starts a new 180-day watch. These accounts do not mean a foreign fleet has been deployed."
 ywc_jhg.1018.settle_full:0 "Record the full domestic result"
 ywc_jhg.1018.settle_full.cost_tooltip:0 "No extra fee."
 ywc_jhg.1018.settle_full.consequence_tooltip:0 "Records the full domestic settlement and releases its country slot; it does not mean any foreign fleet was deployed."
 ywc_jhg.1018.settle_partial:0 "Record the limited compromise result"
