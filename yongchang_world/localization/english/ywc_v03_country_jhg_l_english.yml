 ywc_jhg.1021.withdraw.cost_tooltip:0 "Paid fees are retained, not refunded."
 ywc_jhg.1021.withdraw.consequence_tooltip:0 "Records a setback and releases this arc slot idempotently."
 ywc_jhg.1022.t:0 "The Shared Account"
 ywc_jhg.1022.d:0 "The treasury checks SHU’s actual answer, both project expenditures and the agreed term. While unsigned, refused or lacking the overlord relationship, Jinghai can wait, ask again, or switch to a fixed share or ambiguity."
 ywc_jhg.1022.project_share:0 "Continue with the signed joint project"
 ywc_jhg.1022.project_share.cost_tooltip:0 "Each side has already paid its project share; this step charges nothing further."
 ywc_jhg.1022.project_share.consequence_tooltip:0 "Requires the current actual partnership; it does not change subject status or construct buildings."
 ywc_jhg.1022.continue_domestic:0 "Continue the selected domestic plan"
 ywc_jhg.1022.continue_domestic.cost_tooltip:0 "The filing fee is already paid; this step charges nothing further."
 ywc_jhg.1022.continue_domestic.consequence_tooltip:0 "Keeps the selected domestic route and cancels unsigned inquiries without inventing a foreign commitment."
 ywc_jhg.1022.request_shu:0 "Ask SHU again to share the project"
 ywc_jhg.1022.request_shu.cost_tooltip:0 "No second filing fee; if both agree and can pay, each contributes a project share equal to the filing fee."
 ywc_jhg.1022.request_shu.consequence_tooltip:0 "Sends a new generation of terms to the actual overlord; old answers cannot be reused."
 ywc_jhg.1022.ambiguity:0 "Switch to ambiguous terms"
 ywc_jhg.1022.ambiguity.cost_tooltip:0 "The paid filing fee and signed project expenditures are retained and not charged twice."
 ywc_jhg.1022.ambiguity.consequence_tooltip:0 "Cancels an unsigned inquiry and chooses a domestic plan. Fixed tribute still requires a real relationship; independent ambiguity can settle on domestic conditions."
 ywc_jhg.1022.fixed_share:0 "Switch to a fixed share"
 ywc_jhg.1022.fixed_share.cost_tooltip:0 "The paid filing fee and signed project expenditures are retained and not charged twice."
 ywc_jhg.1022.fixed_share.consequence_tooltip:0 "Cancels an unsigned inquiry and chooses a domestic plan. Fixed tribute still requires a real relationship; independent ambiguity can settle on domestic conditions."
 ywc_jhg.1022.defer:0 "Defer until conditions recover"
