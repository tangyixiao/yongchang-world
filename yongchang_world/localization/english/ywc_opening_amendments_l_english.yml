l_english:
 amendment_ywc_shu_exam_bureaucracy:0 "Examination Appointments"
 amendment_ywc_shu_exam_bureaucracy_desc:0 "Appointments through the examination tradition lend the central bureaucracy additional administrative capacity. This is a gameplay abstraction of the fictional Great Shun's civil administration, not a claim about a real dynasty."
 amendment_ywc_jhg_maritime_council:0 "Maritime Council of Merchants and Fleet"
 amendment_ywc_jhg_maritime_council_desc:0 "Merchant and naval deliberation supports shipbuilding and lowers naval supply costs, reflecting the fictional Jinghai polity's established maritime strength."
 amendment_ywc_dmg_luzon_military_households:0 "Luzon Military Household Service"
 amendment_ywc_dmg_luzon_military_households_desc:0 "The military households of fictional Dongming reinforce the standing of the ruler and the state's authority."
 amendment_ywc_nmg_baja_autonomy_charter:0 "Baja Autonomy Charter"
 amendment_ywc_nmg_baja_autonomy_charter_desc:0 "Local assemblies under the fictional New Ming charter broaden the basis of government legitimacy while limiting the center's authority."
 amendment_ywc_nqg_exile_court_edicts:0 "Edicts of the Exile Court"
 amendment_ywc_nqg_exile_court_edicts_desc:0 "The fictional Northern Qing court uses censorship to strengthen state authority, while its exile status weighs on its legitimacy."
 amendment_ywc_oir_yili_post_trade_accounts:0 "Yili Relay and Trade Accounts"
 amendment_ywc_oir_yili_post_trade_accounts_desc:0 "Records maintained along the fictional Oirat state's relay and trade routes improve bureaucratic capacity."
 amendment_ywc_mgl_banner_league_seats:0 "Seats for Jasagh Banner Leagues"
 amendment_ywc_mgl_banner_league_seats_desc:0 "The fictional independent Khalkha khanate grants its aristocrats greater voting weight in oligarchic councils. This is a worldbuilding choice, not a description of Qing-era banner law."
 amendment_ywc_tib_ganden_phodrang_regency_council:0 "Ganden Phodrang Regency Council"
 amendment_ywc_tib_ganden_phodrang_regency_council_desc:0 "A regency council supports the legitimacy of the Tibetan government and its authority during rule through regents."
 amendment_ywc_kor_three_tax_burdens:0 "Three Administrations Surcharges"
 amendment_ywc_kor_three_tax_burdens_desc:0 "A small flat land-tax modifier at every tax setting models the fiscal pressures associated with the Three Administrations in late Joseon Korea. The burden strains state authority; it is a gameplay abstraction, not a precise historical tax rate."
 amendment_ywc_lan_mining_district_council:0 "Mining District Council"
 amendment_ywc_lan_mining_district_council_desc:0 "Shopkeepers and district representation gain influence in the census-based government of Lanfang, an approximation of a mining-company polity rather than a modern representative republic."
