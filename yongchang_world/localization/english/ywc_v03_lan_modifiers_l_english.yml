l_english:
 ywc_lan_guard_backlash:0 "Guard Enforcement Backlash"
 ywc_lan_relief_gap:0 "救济缺口"
 ywc_lan_relief_gap_desc:0 "私人救济覆盖窄，未获赔付者的生活预期与不满由地方自行消化。"
 ywc_lan_relief_gap:0 "Relief Gap"
 ywc_lan_relief_gap_desc:0 "Private relief covers few. The living expectations and resentment of the uncovered are absorbed locally."
 ywc_lan_guard_backlash_desc:0 "Substituting private guards for public authority erodes legitimacy, increases radicals from political movements and diverts diplomatic coordination, reducing Influence generation by 10% during the backlash."
 ywc_lan_gold_processing_settled:0 "Processing Diversified"
 ywc_lan_gold_processing_settled_desc:0 "Part of the mining margin goes into workshops, steadying employment and daily goods. Administration rises slightly, legitimacy dips a little, and industrialists and the petty bourgeoisie are more satisfied."
 ywc_lan_gold_farming_settled:0 "Agricultural Supply Secured"
 ywc_lan_gold_farming_settled_desc:0 "Rice fields secure the staple, improving lower-strata living expectations and easing radicals slightly. Farmers are pleased, landowners less so, and legitimacy rises a little."
 ywc_lan_gold_monopoly_settled:0 "Mining Monopoly Settled"
 ywc_lan_gold_monopoly_settled_desc:0 "Mines and offices together draw taxable public revenue, strengthening administration and industry. Legitimacy suffers, the countryside is displeased, and radicals tick up."
 ywc_lan_gold_compromise_hold:0 "Bounded Account Maintained"
 ywc_lan_gold_compromise_hold_desc:0 "Only the existing accounts and their gap are maintained, without full results; legitimacy dips slightly and lower-strata expectations are a little higher."
 ywc_lan_gold_processing_country:0 "Processing Accounts"
 ywc_lan_gold_processing_country_desc:0 "The processing arrangement changes the administrative burden and the standing of commercial groups."
 ywc_lan_gold_processing_state:0 "Local Processing Support"
 ywc_lan_gold_processing_state_desc:0 "The pilot state's processing arrangement supports lower-strata living standards."
 ywc_lan_gold_farming_country:0 "Agricultural Accounts"
 ywc_lan_gold_farming_country_desc:0 "The supply arrangement changes legitimacy and the standing of rural interests and landowners."
 ywc_lan_gold_farming_state:0 "Local Food Supply"
 ywc_lan_gold_farming_state_desc:0 "The pilot state's supply arrangement supports lower-strata living standards and eases political radicalisation."
 ywc_lan_gold_monopoly_country:0 "Mining Monopoly Accounts"
 ywc_lan_gold_monopoly_country_desc:0 "The monopoly strengthens administration and industrial interests at a cost to legitimacy and rural approval."
 ywc_lan_gold_monopoly_state:0 "Local Monopoly Friction"
 ywc_lan_gold_monopoly_state_desc:0 "The pilot state's monopoly raises radicalisation from political movements."
 ywc_lan_gold_compromise_country:0 "Limited Public Accounts"
 ywc_lan_gold_compromise_country_desc:0 "A bounded arrangement leaves a small cost to legitimacy."
 ywc_lan_gold_compromise_state:0 "Local Expectations Gap"
 ywc_lan_gold_compromise_state_desc:0 "The bounded arrangement leaves higher lower-strata expectations in the pilot state."
