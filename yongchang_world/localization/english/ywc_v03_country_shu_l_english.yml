l_english:
 ywc_je_v03_shu_register_pilot:0 "Put the Land Tax in One Register"
 ywc_je_v03_shu_register_pilot_reason:0 "Audit land tax, office staffing and input shortages in a state you actually own. Central review requires an existing land-based, per-capita or proportional taxation law; the two audits must be at least three months apart. If capacity is short, improve staffing or supply and wait."
 ywc_je_v03_shu_fiscal_settlement:0 "The New Register Must Honor Old Duties"
 ywc_je_v03_shu_fiscal_settlement_reason:0 "Apply the first stage to military pay, provincial service or port-merchant advances. Principal is collected by a monthly fiscal callback after one year; insolvency keeps the arrears obligation active. The six-month review matures only through uninterrupted peace, no default or bankruptcy, no three-month worsening in scaled debt burden, a retained pilot state and a ready office."
 ywc_shu.1000.t:0 "Two Ledgers from One County"
 ywc_shu.1000.d:0 "Choose one actually owned state from Sichuan, Chongqing, Yunnan or Guizhou so clerks, garrisons and the Board audit the same register. If it is lost, another can be selected without refunding prior expenses."
 ywc_shu.1000.pilot_state_sichuan:0 "Select Sichuan as the pilot"
 ywc_shu.1000.pilot_state_sichuan.cost_tooltip:0 "No charge. Only an actually owned Sichuan, Chongqing, Yunnan or Guizhou state can be selected."
 ywc_shu.1000.pilot_state_sichuan.consequence_tooltip:0 "Later checks use this state's office only. If it is lost, select another eligible state; prior charges are not refunded."
 ywc_shu.1000.pilot_state_chongqing:0 "Select Chongqing as the pilot"
 ywc_shu.1000.pilot_state_chongqing.cost_tooltip:0 "No charge. Only an actually owned Sichuan, Chongqing, Yunnan or Guizhou state can be selected."
 ywc_shu.1000.pilot_state_chongqing.consequence_tooltip:0 "Later checks use this state's office only. If it is lost, select another eligible state; prior charges are not refunded."
 ywc_shu.1000.pilot_state_yunnan:0 "Select Yunnan as the pilot"
 ywc_shu.1000.pilot_state_yunnan.cost_tooltip:0 "No charge. Only an actually owned Sichuan, Chongqing, Yunnan or Guizhou state can be selected."
 ywc_shu.1000.pilot_state_yunnan.consequence_tooltip:0 "Later checks use this state's office only. If it is lost, select another eligible state; prior charges are not refunded."
 ywc_shu.1000.pilot_state_guizhou:0 "Select Guizhou as the pilot"
 ywc_shu.1000.pilot_state_guizhou.cost_tooltip:0 "No charge. Only an actually owned Sichuan, Chongqing, Yunnan or Guizhou state can be selected."
 ywc_shu.1000.pilot_state_guizhou.consequence_tooltip:0 "Later checks use this state's office only. If it is lost, select another eligible state; prior charges are not refunded."
 ywc_shu.1000.withdraw_before_pilot:0 "No eligible pilot remains; withdraw"
 ywc_shu.1000.withdraw_before_pilot.cost_tooltip:0 "No new charge; prior payments are not refunded."
 ywc_shu.1000.withdraw_before_pilot.consequence_tooltip:0 "Release this arc slot and record withdrawal; remains available if every candidate state is lost."
 ywc_shu.1001.t:0 "Where the Survey Clerks Will Work"
 ywc_shu.1001.d:0 "Auditors must use an office in the designated pilot state. Its government administration building must reach 80% occupancy and have no building input shortage; then a real positive administrative balance can support the audit. Existing capacity is recognized."
 ywc_shu.1001.central_register:0 "Central audit under the existing tax law"
 ywc_shu.1001.central_register.cost_tooltip:0 "When affordable, deduct half of the opening snapshot of annual gross income ÷ 52 (minimum 100); later income changes do not recalculate it."
 ywc_shu.1001.central_register.consequence_tooltip:0 "Requires an existing tax law and a staffed, supplied government office in the selected state."
 ywc_shu.1001.local_register:0 "Provincial co-audit for review rights"
 ywc_shu.1001.local_register.cost_tooltip:0 "No start-up payment; provinces receive review rights and any compensation is decided separately."
 ywc_shu.1001.local_register.consequence_tooltip:0 "Records provincial inspection rights without fabricating offices or staff."
 ywc_shu.1001.cap_old_quota:0 "Cap old quotas and review local obligations only"
 ywc_shu.1001.cap_old_quota.cost_tooltip:0 "No start-up payment; this makes no promise of a national survey."
 ywc_shu.1001.cap_old_quota.consequence_tooltip:0 "Preserves gentry and garrison service obligations under the old quota."
 ywc_shu.1001.wait_for_office:0 "Defer until the selected office is ready"
 ywc_shu.1001.wait_for_office.cost_tooltip:0 "No charge and no audit is recorded."
 ywc_shu.1001.wait_for_office.consequence_tooltip:0 "Improve staffing or supplies, then the monthly dispatcher will offer the audit again."
 ywc_shu.1001.reselect_state_sichuan:0 "Replace the lost pilot with Sichuan"
 ywc_shu.1001.reselect_state_sichuan.cost_tooltip:0 "Reselecting does not refund previous costs."
 ywc_shu.1001.reselect_state_sichuan.consequence_tooltip:0 "The audit switches to this state and resumes at the next stage after the loss."
 ywc_shu.1001.reselect_state_chongqing:0 "Replace the lost pilot with Chongqing"
 ywc_shu.1001.reselect_state_chongqing.cost_tooltip:0 "Reselecting does not refund previous costs."
 ywc_shu.1001.reselect_state_chongqing.consequence_tooltip:0 "The audit switches to this state and resumes at the next stage after the loss."
 ywc_shu.1001.reselect_state_yunnan:0 "Replace the lost pilot with Yunnan"
 ywc_shu.1001.reselect_state_yunnan.cost_tooltip:0 "Reselecting does not refund previous costs."
 ywc_shu.1001.reselect_state_yunnan.consequence_tooltip:0 "The audit switches to this state and resumes at the next stage after the loss."
 ywc_shu.1001.reselect_state_guizhou:0 "Replace the lost pilot with Guizhou"
 ywc_shu.1001.reselect_state_guizhou.cost_tooltip:0 "Reselecting does not refund previous costs."
 ywc_shu.1001.reselect_state_guizhou.consequence_tooltip:0 "The audit switches to this state and resumes at the next stage after the loss."
 ywc_shu.1001.withdraw_after_state_loss:0 "No eligible pilot remains: withdraw the register"
 ywc_shu.1001.withdraw_after_state_loss.cost_tooltip:0 "Prior costs and advances remain owed."
 ywc_shu.1001.withdraw_after_state_loss.consequence_tooltip:0 "Ends as a breach rather than claiming another state is available."
 ywc_shu.1002.t:0 "An Exemption Has Its Own History"
 ywc_shu.1002.d:0 "Landowners present inherited exemptions with old bridge and service accounts. The garrison asks for pay before any reassessment; county clerks warn that a new tax roll does not erase duplicate labor demands."
 ywc_shu.1002.time_limited_exemption:0 "Write a time-limited exemption with local service"
 ywc_shu.1002.time_limited_exemption.cost_tooltip:0 "No immediate deduction; records local review rights and 12 months of shared duties."
 ywc_shu.1002.time_limited_exemption.consequence_tooltip:0 "The court gives up some coverage for local service and a reviewable term.; Landowners gain 1 approval for 12 months."
 ywc_shu.1002.collect_with_compensation:0 "Collect by the roll and compensate landowners"
 ywc_shu.1002.collect_with_compensation.cost_tooltip:0 "Deduct twice the one-week income estimate; if the budget gate fails, neither payment nor compensation is recorded."
 ywc_shu.1002.collect_with_compensation.consequence_tooltip:0 "Landowners lose the exemption but receive one compensation; their objection remains in the later audit.; if paid, Landowners gain 2 approval for 12 months."
 ywc_shu.1002.retain_exemption:0 "Keep custom and audit only its boundary"
 ywc_shu.1002.retain_exemption.cost_tooltip:0 "No immediate charge; the card gives up any claim of national tax-base coverage."
 ywc_shu.1002.retain_exemption.consequence_tooltip:0 "Accepts a bounded compromise and keeps later renegotiation open.; Landowners gain 3 approval for 12 months."
 ywc_shu.1003.t:0 "The Garrison Claims Its Share First"
 ywc_shu.1003.d:0 "The military households place their border duty accounts beside their unpaid-pay petitions. Rotations and garrisons cost money even in peace; provincial officials argue that their tax share cannot simply disappear into the central chest."
 ywc_shu.1003.pay_partial_advance:0 "Pay the first installment and commit to twelve"
 ywc_shu.1003.pay_partial_advance.cost_tooltip:0 "Each installment is one quarter of the opening weekly-income base; the first is paid now, and twelve total three weekly bases. The base is annual gross income ÷ 52, minimum 100."
 ywc_shu.1003.pay_partial_advance.consequence_tooltip:0 "Requires cash, nonnegative net fixed income, and no default or bankruptcy. Missed installments remain due and at most one is paid per monthly check, even after the fiscal arc ends. A treasury charge is not a salary transfer to an identified military POP."
 ywc_shu.1003.budget_queue:0 "Put it in the budget queue without promising goodwill"
 ywc_shu.1003.budget_queue.cost_tooltip:0 "No immediate charge and no twelve-installment funding contract."
 ywc_shu.1003.budget_queue.consequence_tooltip:0 "The garrison still waits for appropriation; the choice grants no free support."
 ywc_shu.1003.provincial_pay:0 "Let provinces offset pay and recognize their tax claim"
 ywc_shu.1003.provincial_pay.cost_tooltip:0 "Records a provincial tax claim and shared responsibility; no verified cash payment from a provincial account is claimed."
 ywc_shu.1003.provincial_pay.consequence_tooltip:0 "The fiscal close and later military line can read the provincial payer; this choice does not establish that garrison pay was settled."
 ywc_shu.1003.continue_military_recorded:0 "Continue with the recorded payer"
 ywc_shu.1003.continue_military_recorded.cost_tooltip:0 "No repeated charge and no new contract for a legacy one-time payment."
 ywc_shu.1003.continue_military_recorded.consequence_tooltip:0 "Keeps the recorded payer; resumes the next step only if this stage lost its queue."
 ywc_shu.1003.dismiss_military_stale:0 "Close the outdated funding proposal"
 ywc_shu.1003.dismiss_military_stale.cost_tooltip:0 "No payment or change to the queue."
 ywc_shu.1003.dismiss_military_stale.consequence_tooltip:0 "Preserves the current agenda and existing commitments."
 ywc_shu.1004.t:0 "Households Written Twice"
 ywc_shu.1004.d:0 "A household appears in the county tax ledger, then again in the garrison’s levee and grain-hauling service rolls. One petition cannot rewrite national population, but the Board can decide who hears the appeal."
 ywc_shu.1004.central_appeal:0 "Refer it to the office for a staffed review"
 ywc_shu.1004.central_appeal.cost_tooltip:0 "No immediate deduction; ongoing work must be supported by real bureaucracy and jobs."
 ywc_shu.1004.central_appeal.consequence_tooltip:0 "The court creates a review process; an understaffed office cannot be described as resolving the case."
 ywc_shu.1004.local_mediation:0 "Refer the petition to provincial mediation"
 ywc_shu.1004.local_mediation.cost_tooltip:0 "No immediate deduction; trades for local adjudication and inspection rights."
 ywc_shu.1004.local_mediation.consequence_tooltip:0 "Protects provincial custom and lowers central coverage while preserving local appeals."
 ywc_shu.1004.leave_old_roll:0 "Leave the old roll and narrow this pilot"
 ywc_shu.1004.leave_old_roll.cost_tooltip:0 "No immediate deduction."
 ywc_shu.1004.leave_old_roll.consequence_tooltip:0 "Gentry gain short-term stability; duplicate service remains unresolved."
 ywc_shu.1005.t:0 "Merchants Offer an Advance"
 ywc_shu.1005.d:0 "A staffed port can support a merchant advance; if no eligible port exists, a staffed agricultural district can propose local prepayment. Without either source the court may refuse or narrow the pilot. New principal is collected on a monthly check after twelve full months and remains a debt with a political cost if funds are insufficient."
 ywc_shu.1005.accept_port_advance:0 "Accept an advance from an eligible source"
 ywc_shu.1005.accept_port_advance.cost_tooltip:0 "Receive principal based on one week of estimated income. A monthly check collects it after twelve full months when funds suffice; otherwise the debt remains."
 ywc_shu.1005.accept_port_advance.consequence_tooltip:0 "Requires a staffed port or agricultural building without a goods shortage; the latter represents local prepayment. Principal is not deducted from a specific merchant or population account."
 ywc_shu.1005.refuse_private_advance:0 "Refuse and avoid pledging future port dues"
 ywc_shu.1005.refuse_private_advance.cost_tooltip:0 "No transfer and no new repayment debt."
 ywc_shu.1005.refuse_private_advance.consequence_tooltip:0 "The court keeps future tariff freedom but loses short-term merchant liquidity."
 ywc_shu.1005.narrow_pilot:0 "Narrow the audit and avoid private credit"
 ywc_shu.1005.narrow_pilot.cost_tooltip:0 "No additional audit deduction."
 ywc_shu.1005.narrow_pilot.consequence_tooltip:0 "Does not assume maritime trade means industrialization; a limited old-quota settlement remains valid."
 ywc_shu.1005.continue_recorded:0 "Continue with the recorded decision"
 ywc_shu.1005.continue_recorded.cost_tooltip:0 "No repeated payment or new debt."
 ywc_shu.1005.continue_recorded.consequence_tooltip:0 "Preserves the original decision and any debt; resumes the audit only while this stage is still current."
 ywc_shu.1005.dismiss_stale:0 "Dismiss the stale advance inquiry"
 ywc_shu.1005.dismiss_stale.cost_tooltip:0 "No expense or principal is created."
 ywc_shu.1005.dismiss_stale.consequence_tooltip:0 "Keeps the existing queue and recorded decisions."
 ywc_shu.1006.t:0 "The Second Audit, or a Long-Stalled Pilot"
 ywc_shu.1006.d:0 "The two formal audits must be at least three months apart. If staffing, input supply or fiscal conditions still block progress after 36 months, acknowledge a limited pilot rather than recording an audit that never happened."
 ywc_shu.1006.publish_central_difference:0 "Publish the centrally audited difference"
 ywc_shu.1006.publish_central_difference.cost_tooltip:0 "Second half-installment equals half the one-week income estimate; if the budget gate fails it remains due, not paid."
 ywc_shu.1006.publish_central_difference.consequence_tooltip:0 "Requires a local office, non-negative bureaucracy, paper availability and both audits; the button creates no tax revenue."
 ywc_shu.1006.settle_as_provincial:0 "Settle as provincial sharing at lower coverage"
 ywc_shu.1006.settle_as_provincial.cost_tooltip:0 "Pays the audit share calculated from the proxy; provincial sharing creates no money."
 ywc_shu.1006.settle_as_provincial.consequence_tooltip:0 "Requires an actual provincial co-audit or tax-sharing commitment and accepts lower central coverage."
 ywc_shu.1006.wait_for_audit:0 "Wait for capacity or repayment"
 ywc_shu.1006.wait_for_audit.cost_tooltip:0 "No immediate payment; any advance remains due on its existing schedule."
 ywc_shu.1006.wait_for_audit.consequence_tooltip:0 "Keep the audit route open and retry after conditions improve; unmet requirements remain unmet."
 ywc_shu.1006.pause_as_legacy:0 "Pause and retain bounded old quotas"
 ywc_shu.1006.pause_as_legacy.cost_tooltip:0 "Earlier payments are not refunded; no second installment is taken."
 ywc_shu.1006.pause_as_legacy.consequence_tooltip:0 "Enter capped-legacy review only with the pilot still owned, safe finances and at least 25% office staffing; six months of continuous fulfillment still remains."
 ywc_shu.1006.withdraw_after_failed_audit:0 "Withdraw and retain prior payments"
 ywc_shu.1006.withdraw_after_failed_audit.cost_tooltip:0 "No new charges; prior payments are not refunded."
 ywc_shu.1006.withdraw_after_failed_audit.consequence_tooltip:0 "Record withdrawal and close this arc."
 ywc_shu.1007.t:0 "The Provinces’ Retained Share"
 ywc_shu.1007.d:0 "The Board must assign the new register’s claims to military pay, local service or merchant advances. Central audit, provincial sharing and capped quotas are mutually exclusive; the court cannot claim all three gains."
 ywc_shu.1007.central_public_duties:0 "Central court pays garrisons and public duties"
 ywc_shu.1007.central_public_duties.cost_tooltip:0 "Maintain non-negative net fixed income for the six-month review; no tax law is granted."
 ywc_shu.1007.central_public_duties.consequence_tooltip:0 "Continues the central audit path; real pay and office costs remain on the budget."
 ywc_shu.1007.provincial_retention:0 "Retain a provincial share for shared service"
 ywc_shu.1007.provincial_retention.cost_tooltip:0 "Observe local performance for six months at lower central coverage."
 ywc_shu.1007.provincial_retention.consequence_tooltip:0 "Provincial review and garrison sharing carry forward; merchant advances cannot cancel them."
 ywc_shu.1007.cap_old_dues:0 "Cap old dues and keep only the pilot in central reach"
 ywc_shu.1007.cap_old_dues.cost_tooltip:0 "Earlier payments are not refunded and collection is not extended nationally."
 ywc_shu.1007.cap_old_dues.consequence_tooltip:0 "Allows conservative continuity without claiming the central-audit result."
 ywc_shu.1007.defer_until_ready:0 "Defer the ruling until the pilot and capped-quota conditions recover"
 ywc_shu.1007.defer_until_ready.cost_tooltip:0 "Adds no charge and starts no review; prior spending is not refunded."
 ywc_shu.1007.defer_until_ready.consequence_tooltip:0 "Requeues this event behind the shared major-event cooldown; no 180-day review or settlement begins until the conditions recover."
 ywc_shu.1007.withdraw_before_execution:0 "Withdraw the capped agreement before execution"
 ywc_shu.1007.withdraw_before_execution.cost_tooltip:0 "Adds no charge; earlier costs and advances remain owed and are not refunded."
 ywc_shu.1007.withdraw_before_execution.consequence_tooltip:0 "Ends as a breach and releases the arc slot; it does not count as a successful capped-quota settlement."
 ywc_shu.1008.t:0 "The Register Meets War and Austerity"
 ywc_shu.1008.d:0 "The six-month consolidation review arrives. In peace it checks net fixed income, offices and building inputs. Real war, default, a negative budget or loss of the pilot state moves the court to a wartime limit or credit repair instead of pretending conditions are normal."
 ywc_shu.1008.review_in_peace:0 "Peace review: retain what is affordable"
 ywc_shu.1008.review_in_peace.cost_tooltip:0 "No extra deduction; uses the actual budget."
 ywc_shu.1008.review_in_peace.consequence_tooltip:0 "Establishment requires real conditions; otherwise only compromise or cap can close."
 ywc_shu.1008.limit_for_war:0 "Defer in war or fiscal distress; restart the six-month review later"
 ywc_shu.1008.limit_for_war.cost_tooltip:0 "Keep prior payments, add no new charge, and retain deferred obligations."
 ywc_shu.1008.limit_for_war.consequence_tooltip:0 "No forced peace. The interrupted review resets; once peace and the pilot state return, a fresh six-month review begins."
 ywc_shu.1008.withdraw_repair_credit:0 "Withdraw and repair fiscal credibility"
 ywc_shu.1008.withdraw_repair_credit.cost_tooltip:0 "Keep past payments and take on no new obligations."
 ywc_shu.1008.withdraw_repair_credit.consequence_tooltip:0 "Active withdrawal is recorded as breach; later customs and provincial lines can renegotiate."
 ywc_shu.1008.reselect_state_sichuan:0 "Move the pilot to Sichuan"
 ywc_shu.1008.reselect_state_sichuan.cost_tooltip:0 "This does not refund prior costs or charge a new standard pilot fee."
 ywc_shu.1008.reselect_state_sichuan.consequence_tooltip:0 "The new pilot must pass a fresh continuous 180-day review; it must be an owned state among the four listed candidates."
 ywc_shu.1008.reselect_state_chongqing:0 "Move the pilot to Chongqing"
 ywc_shu.1008.reselect_state_chongqing.cost_tooltip:0 "This does not refund prior costs or charge a new standard pilot fee."
 ywc_shu.1008.reselect_state_chongqing.consequence_tooltip:0 "The new pilot must pass a fresh continuous 180-day review; it must be an owned state among the four listed candidates."
 ywc_shu.1008.reselect_state_yunnan:0 "Move the pilot to Yunnan"
 ywc_shu.1008.reselect_state_yunnan.cost_tooltip:0 "This does not refund prior costs or charge a new standard pilot fee."
 ywc_shu.1008.reselect_state_yunnan.consequence_tooltip:0 "The new pilot must pass a fresh continuous 180-day review; it must be an owned state among the four listed candidates."
 ywc_shu.1008.reselect_state_guizhou:0 "Move the pilot to Guizhou"
 ywc_shu.1008.reselect_state_guizhou.cost_tooltip:0 "This does not refund prior costs or charge a new standard pilot fee."
 ywc_shu.1008.reselect_state_guizhou.consequence_tooltip:0 "The new pilot must pass a fresh continuous 180-day review; it must be an owned state among the four listed candidates."
 ywc_shu.1009.t:0 "The Ledger That Remains"
 ywc_shu.1009.d:0 "Settlement is not a free tax law. The court records who audited, who supplied service, whether merchants advanced funds, and whether net fixed income can sustain the office. Unmet conditions permit only a limited compromise, capped custom or breach withdrawal."
 ywc_shu.1009.establish_central:0 "Establish central audit"
 ywc_shu.1009.establish_central.cost_tooltip:0 "No revenue reward or tax exemption; administration and pay remain budgeted."
 ywc_shu.1009.establish_central.consequence_tooltip:0 "Established only if both audits, administrative supply and affordability are met."
 ywc_shu.1009.confirm_provincial_share:0 "Confirm provincial sharing"
 ywc_shu.1009.confirm_provincial_share.cost_tooltip:0 "No treasury transfer; retain provincial service and audit obligations."
 ywc_shu.1009.confirm_provincial_share.consequence_tooltip:0 "Compromise requires actual provincial review rights and a completed audit."
 ywc_shu.1009.reconcile_legacy_military_budget:0 "Queue the legacy military bill and confirm provincial sharing"
 ywc_shu.1009.reconcile_legacy_military_budget.cost_tooltip:0 "No immediate charge and no retroactive twelve-installment contract; the old unpaid military bill remains in the budget queue."
 ywc_shu.1009.reconcile_legacy_military_budget.consequence_tooltip:0 "For a legacy fiscal register with no recorded payer: assign the unresolved bill to the budget queue, then close under provincial sharing if all other conditions hold."
 ywc_shu.1009.keep_capped_quotas:0 "Settle with bounded old quotas"
 ywc_shu.1009.keep_capped_quotas.cost_tooltip:0 "No refund; does not claim a national register."
 ywc_shu.1009.keep_capped_quotas.consequence_tooltip:0 "Conservative continuity is a bounded result, open to later customs or provincial reform."
 ywc_shu.1009.retry_after_interruption:0 "Conditions changed; restart the six-month review"
 ywc_shu.1009.retry_after_interruption.cost_tooltip:0 "No new charge; after recovery, begin a fresh continuous six-month review."
 ywc_shu.1009.retry_after_interruption.consequence_tooltip:0 "Keep the commitment and return to interruption handling; the timer restarts after conditions recover."
 ywc_shu.1009.withdraw_as_breach:0 "Withdraw and accept breach consequences"
 ywc_shu.1009.withdraw_as_breach.cost_tooltip:0 "Stop future charges; prior payments remain spent."
 ywc_shu.1009.withdraw_as_breach.consequence_tooltip:0 "Records breach without erasing old debt or provincial grievances."
 ywc_je_v03_shu_service_contract:0 "Garrison Pay Compact"
 ywc_je_v03_shu_service_contract_reason:0 "Choose and pay for a bounded compact that assigns responsibility for pay and appointments."
 ywc_je_v03_shu_service_appointments:0 "Appointments and Garrison Supply"
 ywc_je_v03_shu_service_appointments_reason:0 "Check actual forces, owned barracks and administration: professional, compact and legacy routes require at least 80%, 60% and 25% barracks occupancy respectively, without barracks input shortages. Wait, repair or reduce the target when short."
 ywc_je_v03_shu_service_successor:0 "The Successor Still Follows the Compact"
 ywc_je_v03_shu_service_successor_reason:0 "Continuously verify peaceful supply, appointments and finances for six months. Overdue military funding or an invalid active ledger interrupts professional review; repair it to restart, or reduce the target or withdraw."
 ywc_shu.1010.t:0 "One Order, Two Seals"
 ywc_shu.1010.d:0 "The Board brings a court seal while the garrisons produce their old supply warrants. Decide who checks the next roster; this sets the negotiating table and appoints nobody."
 ywc_shu.1010.court_seal:0 "Let court and personnel office countersign first"
 ywc_shu.1010.court_seal.cost_tooltip:0 "No charge."
 ywc_shu.1010.court_seal.consequence_tooltip:0 "The court keeps review authority, lowering later professional-audit cost while requiring complete garrison rosters."
 ywc_shu.1010.garrison_seal:0 "Require the garrisons to seal the supply record too"
 ywc_shu.1010.garrison_seal.cost_tooltip:0 "No charge."
 ywc_shu.1010.garrison_seal.consequence_tooltip:0 "Garrisons gain a written review role; the later local compact can waive a fee, while central verification becomes harder."
 ywc_shu.1010.delay_order:0 "Seal the order without signing a compact"
 ywc_shu.1010.delay_order.cost_tooltip:0 "No charge."
 ywc_shu.1010.delay_order.consequence_tooltip:0 "No new charge; the compact enters a recoverable negotiation delay and can be retried or withdrawn."
 ywc_shu.1011.t:0 "Unpaid Garrisons, Vacant Offices"
 ywc_shu.1011.d:0 "Both rosters are incomplete: garrison households cite arrears, while the personnel office has vacant posts. Verify one bounded ledger, assign responsibility locally, or cap the legacy obligation."
 ywc_shu.1011.verify_payroll:0 "Audit one payroll and vacancy ledger"
 ywc_shu.1011.verify_payroll.cost_tooltip:0 "One audit fee equal to annual gross income ÷ 52 (minimum 100); requires safe finances and available reserves."
 ywc_shu.1011.verify_payroll.consequence_tooltip:0 "Only a successful charge advances to recommendations; existing arrears remain due."
 ywc_shu.1011.local_ledger:0 "Ask the provinces to report actual amounts first"
 ywc_shu.1011.local_ledger.cost_tooltip:0 "No central fee; accepts provincial reporting rights and a later check of real administration employment."
 ywc_shu.1011.local_ledger.consequence_tooltip:0 "A local compact gives provinces review rights; the court cannot also settle as if it held the full centralized roster."
 ywc_shu.1011.cap_arrears:0 "Keep a limited legacy allowance without claiming all arrears"
 ywc_shu.1011.cap_arrears.cost_tooltip:0 "No audit fee; the target is smaller and unpaid military arrears are not declared cleared."
 ywc_shu.1011.cap_arrears.consequence_tooltip:0 "Preserves legacy command at a lower supply target; later barracks employment threshold and centralization benefit are both lower."
 ywc_shu.1012.t:0 "A Commander's Recommendation List"
 ywc_shu.1012.d:0 "A commander submits recommendations; the personnel office wants each vacancy to have a traceable handover. Military nomination, joint review and recognition of incumbents assign different powers."
 ywc_shu.1012.professional_list:0 "Audit military appointments by qualification"
 ywc_shu.1012.professional_list.cost_tooltip:0 "No charge."
 ywc_shu.1012.professional_list.consequence_tooltip:0 "Professional reorganization requires professional-army law or high actual barracks employment; commanders lose sole nomination authority."
 ywc_shu.1012.joint_list:0 "Have personnel office and garrisons sign together"
 ywc_shu.1012.joint_list.cost_tooltip:0 "No charge."
 ywc_shu.1012.joint_list.consequence_tooltip:0 "Recognizes a local compact and dual review; both administration and barracks must show staffed posts."
 ywc_shu.1012.incumbents_only:0 "Recognize incumbents without expanding nominations"
 ywc_shu.1012.incumbents_only.cost_tooltip:0 "No charge."
 ywc_shu.1012.incumbents_only.consequence_tooltip:0 "Maintains only verifiable existing strength; the lower target preserves garrison authority and creates no appointments."
 ywc_shu.1013.t:0 "Audit by Barracks or Contract by Garrison"
 ywc_shu.1013.d:0 "Each military arrangement carries a different ledger. Professional reorganization requires professional-army law or well-staffed barracks; a garrison compact uses current law with provincial review; capped legacy strength lowers the target and preserves existing command."
 ywc_shu.1013.professional:0 "Sign professional reorganization: audit each barracks"
 ywc_shu.1013.professional.cost_tooltip:0 "One-time cost is annual gross income ÷ 52; existing professional-army law or already-qualified barracks halves it; cash reserves are required."
 ywc_shu.1013.professional.consequence_tooltip:0 "Checks real barracks, office posts and supply; overdue installments or an invalid active central-funding ledger interrupt professional succession review. Future installments need not be prepaid."
 ywc_shu.1013.provincial_compact:0 "Sign a garrison compact: local supply, central review"
 ywc_shu.1013.provincial_compact.cost_tooltip:0 "Prior provincial reporting or joint review, or fiscal provincial supply rights with the pilot still owned, waive the central audit fee; otherwise one quarter of the opening weekly-income base is charged from available reserves."
 ywc_shu.1013.provincial_compact.consequence_tooltip:0 "Existing provincial supply rights retain local reporting authority; waiving the central fee does not assert a cash payment from a provincial account."
 ywc_shu.1013.legacy_cap:0 "Cap legacy forces: no expansion, audit the rolls only"
 ywc_shu.1013.legacy_cap.cost_tooltip:0 "No new fee; requires a real barracks or administration record, with a 25% barracks-employment target."
 ywc_shu.1013.legacy_cap.consequence_tooltip:0 "Preserves legacy command without claiming modernization; the cap is checked again at succession."
 ywc_shu.1013.dismiss_stale_compact:0 "Close the outdated military proposal"
 ywc_shu.1013.dismiss_stale_compact.cost_tooltip:0 "No payment; an unanswered legacy proposal is requeued when safe."
 ywc_shu.1013.dismiss_stale_compact.consequence_tooltip:0 "Preserves the current stage and existing commitments."
 ywc_shu.1014.t:0 "The Military Bill in a Year Without Campaigns"
 ywc_shu.1014.d:0 "A quiet year does not erase military bills. Actual barracks and office posts, supply shortages, current law and fiscal safety determine whether the compact can be fulfilled."
 ywc_shu.1014.check_supply:0 "Audit supply against the current barracks"
 ywc_shu.1014.check_supply.cost_tooltip:0 "No charge."
 ywc_shu.1014.check_supply.consequence_tooltip:0 "Advances only when real posts, law and supply meet the selected route; shortages can be repaired and retried."
 ywc_shu.1014.pay_local_share:0 "Arrange provincial transport sharing"
 ywc_shu.1014.pay_local_share.cost_tooltip:0 "Prior fiscal provincial supply rights waive the central coordination fee while the pilot remains owned; otherwise one quarter of the opening weekly base is charged. Waiver and actual payment are recorded separately."
 ywc_shu.1014.pay_local_share.consequence_tooltip:0 "Records provincial co-responsibility and reporting rights without claiming a provincial cash transfer. If the prior right is lost, the cash-funded fee applies."
 ywc_shu.1014.reduce_target:0 "Reduce the supply target to the existing rolls"
 ywc_shu.1014.reduce_target.cost_tooltip:0 "No charge."
 ywc_shu.1014.reduce_target.consequence_tooltip:0 "Professional or compact route converts to limited legacy strength; prior charges and signed provincial duties remain due."
 ywc_shu.1014.dismiss_stale_supply:0 "Close the outdated supply proposal"
 ywc_shu.1014.dismiss_stale_supply.cost_tooltip:0 "No payment; an unmarked legacy supply proposal can be requeued when safe."
 ywc_shu.1014.dismiss_stale_supply.consequence_tooltip:0 "Preserves the current stage and signed obligations."
 ywc_shu.1014.wait_for_supply:0 "Wait for supply before another review"
 ywc_shu.1014.wait_for_supply.cost_tooltip:0 "No immediate charge; existing fees and obligations remain."
 ywc_shu.1014.wait_for_supply.consequence_tooltip:0 "Recheck actual forces, employment and supply later."
 ywc_shu.1014.reopen_reduced_supply:0 "Recheck capped supply before resuming"
 ywc_shu.1014.reopen_reduced_supply.cost_tooltip:0 "No payment; prior charges, waivers and debts remain."
 ywc_shu.1014.reopen_reduced_supply.consequence_tooltip:0 "The legacy cap alone does not identify the old stage; explicitly return to supply review."
 ywc_shu.1015.t:0 "The Personnel Office Returns the Appointment"
 ywc_shu.1015.d:0 "A returned appointment is not merely a court-versus-military quarrel: the post may be vacant, the roster incomplete, or nomination rules inconsistent with the selected arrangement. Supply evidence or narrow the commitment."
 ywc_shu.1015.accept_appointments:0 "Register appointments from the agreed roster"
 ywc_shu.1015.accept_appointments.cost_tooltip:0 "No charge."
 ywc_shu.1015.accept_appointments.consequence_tooltip:0 "Requires real administration posts and the selected route’s barracks-employment and law conditions, then starts a six-month compliance review."
 ywc_shu.1015.joint_recheck:0 "Let garrisons and personnel office jointly review once"
 ywc_shu.1015.joint_recheck.cost_tooltip:0 "Does not appoint anyone automatically; a joint roster can meet the review condition for a local compact."
 ywc_shu.1015.joint_recheck.consequence_tooltip:0 "Real posts and supply must still qualify; the six-month observation begins only after conditions are met."
 ywc_shu.1015.vacant_cap:0 "Leave vacancies open and record a limited legacy cap"
 ywc_shu.1015.vacant_cap.cost_tooltip:0 "No charge."
 ywc_shu.1015.vacant_cap.consequence_tooltip:0 "Appoints nobody by fiat; continued compliance checks only existing strength and 25% barracks occupancy."
 ywc_shu.1015.dismiss_stale_appointment:0 "Close the outdated appointment notice"
 ywc_shu.1015.dismiss_stale_appointment.cost_tooltip:0 "No payment; requeue appointments when supply handling is recorded, otherwise return to the supply review."
 ywc_shu.1015.dismiss_stale_appointment.consequence_tooltip:0 "Preserves the current stage and signed obligations."
 ywc_shu.1015.wait_for_appointments:0 "Wait for posts and supply before appointment"
 ywc_shu.1015.wait_for_appointments.cost_tooltip:0 "No immediate charge; signed obligations remain due."
 ywc_shu.1015.wait_for_appointments.consequence_tooltip:0 "Continue the selected military route when conditions recover."
 ywc_shu.1015.reopen_reduced_supply:0 "Recheck capped supply before resuming"
 ywc_shu.1015.reopen_reduced_supply.cost_tooltip:0 "No payment; prior charges, waivers and debts remain."
 ywc_shu.1015.reopen_reduced_supply.consequence_tooltip:0 "The legacy cap alone does not identify the old stage; explicitly return to supply review."
 ywc_shu.1016.t:0 "The Garrisons Ask to Renegotiate the Cap"
 ywc_shu.1016.d:0 "The ledger has been blocked for twelve or thirty-six months, or a real condition has just failed. Renegotiation changes future duties; signed contracts and paid obligations remain."
 ywc_shu.1016.resume_service_contract:0 "Return to the compact negotiations"
 ywc_shu.1016.resume_service_contract.cost_tooltip:0 "No new fee."
 ywc_shu.1016.resume_service_contract.consequence_tooltip:0 "Resumes the ordinary negotiation queue without changing recorded accounts."
 ywc_shu.1016.resume_service_appointments:0 "Return to appointments and supply review"
 ywc_shu.1016.resume_service_appointments.cost_tooltip:0 "No new fee."
 ywc_shu.1016.resume_service_appointments.consequence_tooltip:0 "Resumes the current phase’s ordinary review queue."
 ywc_shu.1016.retry_after_repair:0 "Keep the route and restart timing after repairs"
 ywc_shu.1016.retry_after_repair.cost_tooltip:0 "No charge."
 ywc_shu.1016.retry_after_repair.consequence_tooltip:0 "Keeps the original compact; all continuous reviews restart after conditions recover."
 ywc_shu.1016.accept_cap:0 "Reduce future duties to capped legacy strength"
 ywc_shu.1016.accept_cap.cost_tooltip:0 "No charge."
 ywc_shu.1016.accept_cap.consequence_tooltip:0 "Return to capped supply review; at succession a new review starts only once conditions recover. Earlier payments and debts remain."
 ywc_shu.1016.withdraw_service:0 "Admit non-fulfilment and withdraw unpaid future duties"
 ywc_shu.1016.withdraw_service.cost_tooltip:0 "No charge."
 ywc_shu.1016.withdraw_service.consequence_tooltip:0 "Keeps paid fees and debts, releases the arc slot and records breach; later governance can revisit local or legacy duties."
 ywc_shu.1016.wait_service_recovery:0 "Wait for arrears or supply to recover"
 ywc_shu.1016.wait_service_recovery.cost_tooltip:0 "No immediate charge; signed bills and arrears remain due."
 ywc_shu.1016.wait_service_recovery.consequence_tooltip:0 "Retain the current route; a fresh six-month review can begin only after requirements recover."
 ywc_shu.1017.t:0 "The Next Successor Must Follow the Rules"
 ywc_shu.1017.d:0 "The roster passes to a successor, who must still meet the selected route, six months of peaceful continuous compliance and fiscal conditions. If blocked, the compact can be retried or withdrawn; war is never presumed."
 ywc_shu.1017.settle_service:0 "Settle by the compact and retain successor review"
 ywc_shu.1017.settle_service.cost_tooltip:0 "No charge."
 ywc_shu.1017.settle_service.consequence_tooltip:0 "Records whether professional appointments, a local compact or capped legacy strength met its route; the outcome is recorded without a new military or faction modifier, law change or troops."
 ywc_shu.1017.restart_service_review:0 "Conditions were interrupted; restart after recovery"
 ywc_shu.1017.restart_service_review.cost_tooltip:0 "No charge."
 ywc_shu.1017.restart_service_review.consequence_tooltip:0 "Clears maturity and restarts a fresh six-month continuous review."
 ywc_shu.1017.withdraw_at_close:0 "Withdraw unpaid duties while keeping signed bills"
 ywc_shu.1017.withdraw_at_close.cost_tooltip:0 "No charge."
 ywc_shu.1017.withdraw_at_close.consequence_tooltip:0 "Stops only future unpaid duties; paid fees, signed debts and appointments already made remain."
 ywc_shu.1017.wait_service_review_recovery:0 "Keep the route and wait for recovery"
 ywc_shu.1017.wait_service_review_recovery.cost_tooltip:0 "No immediate charge; arrears and signed obligations remain due."
 ywc_shu.1017.wait_service_review_recovery.consequence_tooltip:0 "A new six-month review can begin after the real conditions recover."
 ywc_je_v03_shu_port_customs:0 "Port and Treasury Reconciliation"
 ywc_je_v03_shu_port_customs_reason:0 "Verify unified customs, negotiated revenue sharing or a capped legacy collection at a real port and under current trade and taxation laws; reduce the goal if no port exists, and keep debts on the ledger."
 ywc_shu.1018.t:0 "Three Claimants to One Port Duty"
 ywc_shu.1018.d:0 "The administration, merchants and province each hold a receipt. Choose unified books, negotiated shares or a legacy cap; without a national port, narrow this to an inland ledger or withdraw."
 ywc_shu.1018.unified_customs:0 "Propose unified customs under the administration"
 ywc_shu.1018.unified_customs.cost_tooltip:0 "No charge."
 ywc_shu.1018.unified_customs.consequence_tooltip:0 "Records this responsibility for a later check against actual conditions."
 ywc_shu.1018.merchant_share:0 "Negotiate a share and retain merchant review"
 ywc_shu.1018.merchant_share.cost_tooltip:0 "No charge."
 ywc_shu.1018.merchant_share.consequence_tooltip:0 "Records merchant review and a revenue share; the arc cannot later settle as if the court collected all revenue."
 ywc_shu.1018.legacy_collection:0 "Keep the legacy collection under a fixed cap"
 ywc_shu.1018.legacy_collection.cost_tooltip:0 "No charge."
 ywc_shu.1018.legacy_collection.consequence_tooltip:0 "Limits the goal to existing port operations and ledgers; claims neither unified customs nor new trade."
 ywc_shu.1018.inland_narrow:0 "No port can be audited; narrow to inland books"
 ywc_shu.1018.inland_narrow.cost_tooltip:0 "No charge."
 ywc_shu.1018.inland_narrow.consequence_tooltip:0 "Checks only existing administrative receipts and costs; claims no port duty or trade that is absent."
 ywc_shu.1018.withdraw_no_port:0 "No port or usable ledger; withdraw"
 ywc_shu.1018.withdraw_no_port.cost_tooltip:0 "No fee; previously signed debts remain due."
 ywc_shu.1018.withdraw_no_port.consequence_tooltip:0 "Releases this arc slot and records withdrawal."
 ywc_shu.1019.t:0 "Inland Auditors Arrive at Customs"
 ywc_shu.1019.d:0 "Inland auditors compare port duties, office costs and the earlier tax-register result. A successful central audit can lower the unified-route threshold; local sharing or a legacy cap keeps its own duties."
 ywc_shu.1019.publish_books:0 "Publish one set of customs books"
 ywc_shu.1019.publish_books.cost_tooltip:0 "No charge."
 ywc_shu.1019.publish_books.consequence_tooltip:0 "A prior central-audit result halves the later fee; a prior local-share result requires continued provincial review."
 ywc_shu.1019.split_books:0 "Record the provincial share separately"
 ywc_shu.1019.split_books.cost_tooltip:0 "No charge."
 ywc_shu.1019.split_books.consequence_tooltip:0 "Retains provincial share and merchant review; cannot claim full central revenue."
 ywc_shu.1019.cap_books:0 "Keep old books with a capped assessment"
 ywc_shu.1019.cap_books.cost_tooltip:0 "No charge."
 ywc_shu.1019.cap_books.consequence_tooltip:0 "A conservative prior outcome lowers cost but also requires a smaller port target."
 ywc_shu.1020.t:0 "What Will the Merchants Advance?"
 ywc_shu.1020.d:0 "Merchants offer a short advance with principal and a due date for real bookkeeping only; the court may instead grant review rights or refuse credit. No advance is invented without actual port operations."
 ywc_shu.1020.merchant_advance:0 "Accept a short advance and repay principal after twelve months"
 ywc_shu.1020.merchant_advance.cost_tooltip:0 "Principal is the opening weekly-income base (annual gross income ÷ 52, minimum 100); requires an eligible port, nonnegative net fixed income, and no default or bankruptcy. Monthly checks repay after twelve full months when funds permit."
 ywc_shu.1020.merchant_advance.consequence_tooltip:0 "Principal enters the treasury with an equal debt; no debit from an identified merchant or POP account is claimed. The debt remains after settlement or withdrawal."
 ywc_shu.1020.consult_only:0 "Take no new loan; carry over or pay for ledger review"
 ywc_shu.1020.consult_only.cost_tooltip:0 "One-time review fee is half of weekly income (annual gross income ÷ 52); a still-present real tax-book advance source (acceptance record, positive principal, and the merchant consultation right) lawfully waives it without cash. An already paid fee is never retroactively rewritten into a waiver and never refunded."
 ywc_shu.1020.consult_only.consequence_tooltip:0 "Payment or a lawful waiver secures this ledger review. Verification charges no second fee; existing loans remain payable on their original terms."
 ywc_shu.1020.refuse_credit:0 "Refuse the advance and take no loan"
 ywc_shu.1020.refuse_credit.cost_tooltip:0 "No charge."
 ywc_shu.1020.refuse_credit.consequence_tooltip:0 "Adds neither cash nor debt; merchants receive no review right, and the court or province bears audit work."
 ywc_shu.1020.reopen_legacy_port_offer:0 "Reopen an unanswered legacy credit offer"
 ywc_shu.1020.reopen_legacy_port_offer.cost_tooltip:0 "No payment or loan; only requeue the proposal."
 ywc_shu.1020.reopen_legacy_port_offer.consequence_tooltip:0 "When the legacy stage marker is missing, display the choice again."
 ywc_shu.1020.dismiss_stale_port_offer:0 "Close the outdated port credit offer"
 ywc_shu.1020.dismiss_stale_port_offer.cost_tooltip:0 "No payment; preserves this stage while a notice is pending."
 ywc_shu.1020.dismiss_stale_port_offer.consequence_tooltip:0 "Does not overwrite another stage or an existing debt."
 ywc_shu.1021.t:0 "Prohibited Goods Still Appear on the Ledger"
 ywc_shu.1021.d:0 "Restricted goods appearing in a ledger do not mean trade is permitted. Review under current trade and consumption-tax laws, narrow the audit to books, or wait for the lawmaking system to change."
 ywc_shu.1021.current_law_review:0 "Verify under current trade and tax law"
 ywc_shu.1021.current_law_review.cost_tooltip:0 "No charge."
 ywc_shu.1021.current_law_review.consequence_tooltip:0 "Trade law limits auditable trade and tax law limits existing receipts; neither opens trade automatically."
 ywc_shu.1021.books_only:0 "Audit books without changing restricted-goods policy"
 ywc_shu.1021.books_only.cost_tooltip:0 "No charge."
 ywc_shu.1021.books_only.consequence_tooltip:0 "Narrows the target to administrative books; law remains unchanged and restricted goods do not become newly taxed."
 ywc_shu.1021.wait_law:0 "Defer the customs pledge until law changes through normal process"
 ywc_shu.1021.wait_law.cost_tooltip:0 "No charge."
 ywc_shu.1021.wait_law.consequence_tooltip:0 "Does not force an immediate law change; the journal can wait or withdraw."
 ywc_shu.1022.t:0 "Ships Enter, Money Does Not"
 ywc_shu.1022.d:0 "A ship in harbor does not mean its duty reached the treasury. Pay for verification, register the provincial share, or wait; progress requires affordability and real port operations."
 ywc_shu.1022.pay_verification:0 "Verify receipts and arrears"
 ywc_shu.1022.pay_verification.cost_tooltip:0 "One-time fee equals weekly income; with the honored central register result and the still-owned pilot state it is halved as an actual payment. A lawfully waived consultation fee carries over here, paying no cash and charging nothing again; failure sets no verification flag and makes no progress."
 ywc_shu.1022.pay_verification.consequence_tooltip:0 "Requires a qualified port, administrative supply and sound finances. Paid or lawfully waived fees are not charged again. Otherwise current central-audit and pilot eligibility determine half or full price; insufficient cash keeps the task pending."
 ywc_shu.1022.register_share:0 "Record the provincial share and unpaid arrears first"
 ywc_shu.1022.register_share.cost_tooltip:0 "No charge."
 ywc_shu.1022.register_share.consequence_tooltip:0 "The limited legacy route can register directly. Unpaid unified or shared routes return to 1022 for the actual fee; arrears remain owed, and payment starts a fresh 180-day review."
 ywc_shu.1022.wait_receipts:0 "Receipts have not arrived; keep the ledger pending"
 ywc_shu.1022.wait_receipts.cost_tooltip:0 "No charge."
 ywc_shu.1022.wait_receipts.consequence_tooltip:0 "Records this responsibility for a later check against actual conditions."
 ywc_shu.1023.t:0 "The Fee on Two Customs Forms"
 ywc_shu.1023.d:0 "Port officials present central and revenue-share forms. Decide who pays and who can review; earlier garrison and fiscal responsibilities change review eligibility."
 ywc_shu.1023.central_form:0 "Use the unified central form"
 ywc_shu.1023.central_form.cost_tooltip:0 "A prior central fiscal-register result waives this second audit fee; otherwise a one-time fee applies."
 ywc_shu.1023.central_form.consequence_tooltip:0 "Requires actual administration supply and full central review under the unified route."
 ywc_shu.1023.share_form:0 "Negotiate a share and retain merchant review"
 ywc_shu.1023.share_form.cost_tooltip:0 "No charge."
 ywc_shu.1023.share_form.consequence_tooltip:0 "A prior garrison compact or fiscal local-share result supports this route; otherwise a one-time negotiation cost applies."
 ywc_shu.1023.legacy_form:0 "Cap the legacy collection instead of full customs"
 ywc_shu.1023.legacy_form.cost_tooltip:0 "No charge."
 ywc_shu.1023.legacy_form.consequence_tooltip:0 "Lowers the target to current receipts and seasonal costs, without unified-collection benefits."
 ywc_shu.1024.t:0 "Sharing the Burden in the Off-season"
 ywc_shu.1024.d:0 "Off-season port receipts may fall while administrative costs, merchant principal and sharing duties continue. Choose central payment, existing shared terms or a reduced commitment, then begin six months of review."
 ywc_shu.1024.central_burden:0 "The court pays current port costs"
 ywc_shu.1024.central_burden.cost_tooltip:0 "Legacy books waive the one-time fee; unified customs requires cash. Any fiscal or port interruption resets observation."
 ywc_shu.1024.central_burden.consequence_tooltip:0 "Starts a continuous six-month review; worsening finances, war or port loss clears maturity."
 ywc_shu.1024.shared_burden:0 "Share the burden under the compact"
 ywc_shu.1024.shared_burden.cost_tooltip:0 "No charge."
 ywc_shu.1024.shared_burden.consequence_tooltip:0 "Requires a recorded provincial share or merchant review; records the arrangement and starts observation without transferring provincial or merchant funds."
 ywc_shu.1024.reduce_burden:0 "Reduce to seasonal review of the capped legacy amount"
 ywc_shu.1024.reduce_burden.cost_tooltip:0 "No charge."
 ywc_shu.1024.reduce_burden.consequence_tooltip:0 "Both target and benefit are smaller; existing advances remain repayable."
 ywc_shu.1024.withdraw_port:0 "Withdraw from this port reform"
 ywc_shu.1024.withdraw_port.cost_tooltip:0 "No further fee; existing advances and arrears remain due."
 ywc_shu.1024.withdraw_port.consequence_tooltip:0 "Frees the slot and records withdrawal without counting as a successful port settlement."
 ywc_shu.1024.retry_after_repair:0 "Restore eligibility and restart the six-month review"
 ywc_shu.1024.retry_after_repair.cost_tooltip:0 "No new fee; prior port costs and advances remain unchanged."
 ywc_shu.1024.retry_after_repair.consequence_tooltip:0 "Settlement remains unavailable until 180 continuous qualifying days have passed again."
 ywc_shu.1024.resume_pending_port_step:0 "Return to the unfinished port step"
 ywc_shu.1024.resume_pending_port_step.cost_tooltip:0 "No charge; existing debts are unchanged."
 ywc_shu.1024.resume_pending_port_step.consequence_tooltip:0 "Keep the unfinished step and wait for eligibility; if books are recorded and credit remains unanswered, redeliver that choice."
 ywc_shu.1025.t:0 "The Treasury Cannot Depend on One Port"
 ywc_shu.1025.d:0 "After six months of customs review, recheck trade law, real ports, administrative supply and finances. Settlement does not repay the advance early; country monthly checks continue collection after maturity."
 ywc_shu.1025.settle_unified:0 "Settle unified customs"
 ywc_shu.1025.settle_unified.cost_tooltip:0 "No charge."
 ywc_shu.1025.settle_unified.consequence_tooltip:0 "Requires unified route, real port, sustained legal and staffing conditions and a mature review; records centralized bookkeeping."
 ywc_shu.1025.settle_share:0 "Settle negotiated sharing and review"
 ywc_shu.1025.settle_share.cost_tooltip:0 "No charge."
 ywc_shu.1025.settle_share.consequence_tooltip:0 "Retains provincial and merchant shares; yields less than unified customs but honors recorded responsibilities."
 ywc_shu.1025.settle_legacy:0 "Settle capped legacy books"
 ywc_shu.1025.settle_legacy.cost_tooltip:0 "No charge."
 ywc_shu.1025.settle_legacy.consequence_tooltip:0 "Recognizes existing receipts and a smaller target; retains conservative group support without claiming unified customs."
 ywc_shu.1025.revisit_share_terms:0 "Revisit the ledger form and complete sharing terms"
 ywc_shu.1025.revisit_share_terms.cost_tooltip:0 "Paid fees and existing debts remain; no new principal is issued."
 ywc_shu.1025.revisit_share_terms.consequence_tooltip:0 "Return to form negotiation. Complete review rights and local shares, then begin a new six-month observation; this does not grant settlement."
 ywc_shu.1025.retry_port:0 "Conditions broke; repair and restart observation"
 ywc_shu.1025.retry_port.cost_tooltip:0 "No charge."
 ywc_shu.1025.retry_port.consequence_tooltip:0 "Clears maturity; after port operations and finances recover, a new six-month continuous review begins."
 ywc_shu.1025.withdraw_port:0 "Withdraw unpaid customs duties"
 ywc_shu.1025.withdraw_port.cost_tooltip:0 "No charge."
 ywc_shu.1025.withdraw_port.consequence_tooltip:0 "Merchant principal, provincial shares and paid costs remain; only unpaid future duties end."
 ywc_je_v03_shu_provincial_charter:0 "A New Division Between Court and Province"
 ywc_je_v03_shu_provincial_charter_reason:0 "The centre has taken new duties but no executable agreement exists with the provinces about who pays and who answers for refusal. First fix a provincial pilot in a state you actually own, then pass the school-account and standing-obligation gates, then face six calendar months of audit on the chosen route. Only real state ownership, office staffing, an existing tax law and payable cash are required; no foundation tax register must be complete and no year forces the transition."
 ywc_je_v03_shu_provincial_ledger:0 "Who Pays Across Six Months"
 ywc_je_v03_shu_provincial_ledger_reason:0 "This line's own six-calendar-month real audit. Each real monthly pulse is counted once by this line's helper; a one-day expiry gate blocks double counting from two same-day calls; war, a lost state, bankruptcy or lost conditions reset the consecutive count. Only six matured counts close it, and only then does it read real evidence for the route."
 ywc_shu.1100.t:0 "The Province's Own Budget"
 ywc_shu.1100.d:0 "The Board lays out the old accounts: the centre wants a ledger it can verify at the state granary, the governor wants next year's budget free of ad-hoc levies. Fix the provincial pilot in a state you actually own, or reuse a prior pilot still in our hands. This step only fixes the pilot; it does not pick the governance route."
 ywc_shu.1100.pilot_sichuan:0 "Use Sichuan as the provincial pilot"
 ywc_shu.1100.pilot_sichuan.cost_tooltip:0 "No charge; only records the provincial pilot state."
 ywc_shu.1100.pilot_sichuan.consequence_tooltip:0 "This line's own owned pilot; it does not rewrite the foundation pilot, and advances to 1101."
 ywc_shu.1100.pilot_chongqing:0 "Use Chongqing as the provincial pilot"
 ywc_shu.1100.pilot_chongqing.cost_tooltip:0 "No charge; only records the provincial pilot state."
 ywc_shu.1100.pilot_chongqing.consequence_tooltip:0 "This line's own owned pilot; advances to 1101."
 ywc_shu.1100.pilot_yunnan:0 "Use Yunnan as the provincial pilot"
 ywc_shu.1100.pilot_yunnan.cost_tooltip:0 "No charge; only records the provincial pilot state."
 ywc_shu.1100.pilot_yunnan.consequence_tooltip:0 "This line's own owned pilot; advances to 1101."
 ywc_shu.1100.pilot_guizhou:0 "Use Guizhou as the provincial pilot"
 ywc_shu.1100.pilot_guizhou.cost_tooltip:0 "No charge; only records the provincial pilot state."
 ywc_shu.1100.pilot_guizhou.consequence_tooltip:0 "This line's own owned pilot; advances to 1101."
 ywc_shu.1100.reuse_owned_pilot:0 "Reuse the pilot state still in our hands"
 ywc_shu.1100.reuse_owned_pilot.cost_tooltip:0 "No charge; captures the still-owned prior pilot as this line's own pilot."
 ywc_shu.1100.reuse_owned_pilot.consequence_tooltip:0 "This is the continuation from a still-owned prior pilot; absent if that pilot is lost."
 ywc_shu.1100.no_provincial_pilot:0 "No usable provincial pilot yet; defer"
 ywc_shu.1100.no_provincial_pilot.cost_tooltip:0 "No charge; does not advance the stage."
 ywc_shu.1100.no_provincial_pilot.consequence_tooltip:0 "Keeps stage 1100; the monthly queue re-offers once an eligible state exists."
 ywc_shu.1100.withdraw_before_prov_pilot:0 "Withdraw before a provincial budget exists"
 ywc_shu.1100.withdraw_before_prov_pilot.cost_tooltip:0 "No new charge; prior payments are not refunded."
 ywc_shu.1100.withdraw_before_prov_pilot.consequence_tooltip:0 "Releases the arc and records an exit."
 ywc_shu.1101.t:0 "The Line for the School"
 ywc_shu.1101.d:0 "Who carries the line for schools and public works? This is the first node that reads real conditions and picks a route. Central funding needs cash and does not pretend a school exists; provincial funding records only an intent to negotiate retention; keeping the old office admits a limited office-works result without new law or school."
 ywc_shu.1101.central_funding:0 "Put school and office works on the central treasury"
 ywc_shu.1101.central_funding.cost_tooltip:0 "Pay one week of income, at least 100; a completed central fiscal result in the same still-owned pilot halves it. Cash and source are checked again when paid."
 ywc_shu.1101.central_funding.consequence_tooltip:0 "Budget for existing schools or office works; no building or law is created. Relief responsibility must still be settled."
 ywc_shu.1101.provincial_funding:0 "Provincial funding (record intent to negotiate first)"
 ywc_shu.1101.provincial_funding.cost_tooltip:0 "No treasury deduction; no state tax transfer."
 ywc_shu.1101.provincial_funding.consequence_tooltip:0 "This does not grant share_terms; retention rights must be written at 1104."
 ywc_shu.1101.keep_old_office:0 "Keep the old office and do only limited works"
 ywc_shu.1101.keep_old_office.cost_tooltip:0 "No charge."
 ywc_shu.1101.keep_old_office.consequence_tooltip:0 "Works without school or new law; still needs 1105's real peace-and-solvency confirmation and closes as a bounded compromise."
 ywc_shu.1101.wait_for_office:0 "Defer until the office is staffed"
 ywc_shu.1101.wait_for_office.cost_tooltip:0 "No charge; no expenditure recorded."
 ywc_shu.1101.wait_for_office.consequence_tooltip:0 "Keeps stage 1101; targets real 25% office staffing and creates no building."
 ywc_shu.1101.withdraw_school_line:0 "Withdraw the provincial budget"
 ywc_shu.1101.withdraw_school_line.cost_tooltip:0 "No new charge."
 ywc_shu.1101.withdraw_school_line.consequence_tooltip:0 "Releases the arc; grants no school or law."
 ywc_shu.1102.t:0 "The Governor Will Not Advance Again"
 ywc_shu.1102.d:0 "The same conflict has two faces: in an unsettled state the governor has already refused to advance relief and public spending; in peace the question is whether a standing obligation should be set up first, since provinces must budget for relief, public health and schools before retention is discussed. Whichever face is present, all three ways out are here; unrest is not required to reach this node."
 ywc_shu.1102.pay_relief_once:0 "Pay one relief or standing advance from the centre"
 ywc_shu.1102.pay_relief_once.cost_tooltip:0 "Deducts once this line's own weekly-income estimate; short cash takes, records and advances nothing."
 ywc_shu.1102.pay_relief_once.consequence_tooltip:0 "Records a real payment; it changes no school or law. Only success advances to 1103 and never jumps to 1106."
 ywc_shu.1102.provincial_self_raise:0 "Provincial self-financing (record pending responsibility)"
 ywc_shu.1102.provincial_self_raise.cost_tooltip:0 "No treasury deduction; no state tax transfer."
 ywc_shu.1102.provincial_self_raise.consequence_tooltip:0 "Records only a pending provincial responsibility; grants no written right and counts no cash as paid. Advances to 1104."
 ywc_shu.1102.push_old_quota:0 "Push the old quota back to the legacy review"
 ywc_shu.1102.push_old_quota.cost_tooltip:0 "No charge and no new relief."
 ywc_shu.1102.push_old_quota.consequence_tooltip:0 "Leaves real risk; old-quota confirmation must still pass 1105. Advances to 1105."
 ywc_shu.1102.withdraw_relief_line:0 "Withdraw the provincial budget"
 ywc_shu.1102.withdraw_relief_line.cost_tooltip:0 "No new charge."
 ywc_shu.1102.withdraw_relief_line.consequence_tooltip:0 "Releases the arc."
 ywc_shu.1103.t:0 "Central Counting House, Local Granary"
 ywc_shu.1103.d:0 "Central takeover only means something if it can really keep books: this line's pilot office at 80% and unshortaged, an existing tax law, a non-negative national bureaucracy balance. If short, downgrade to shared 25% staffing or fall back to old negotiation; failure keeps prior payments and charges nothing again."
 ywc_shu.1103.establish_central:0 "Meet the standard and establish central coordination"
 ywc_shu.1103.establish_central.cost_tooltip:0 "No extra charge; real office, tax law and balance are the only basis."
 ywc_shu.1103.establish_central.consequence_tooltip:0 "Records mode=1 and enters JE2's six-month audit; grants no law or building."
 ywc_shu.1103.downgrade_shared:0 "Downgrade to shared 25% staffing"
 ywc_shu.1103.downgrade_shared.cost_tooltip:0 "No deduction; prior payments are not refunded."
 ywc_shu.1103.downgrade_shared.consequence_tooltip:0 "Moves to provincial sharing and enters 1104; it may still fail."
 ywc_shu.1103.downgrade_legacy:0 "Acknowledge refusal and return to old negotiation"
 ywc_shu.1103.downgrade_legacy.cost_tooltip:0 "No deduction."
 ywc_shu.1103.downgrade_legacy.consequence_tooltip:0 "Keeps the refusal record and enters 1105; success is not guaranteed."
 ywc_shu.1103.wait_central:0 "Defer until office or balance is ready"
 ywc_shu.1103.wait_central.cost_tooltip:0 "No charge."
 ywc_shu.1103.wait_central.consequence_tooltip:0 "Keeps stage 1103; the monthly queue re-offers once conditions improve."
 ywc_shu.1103.withdraw_after_central_fail:0 "Withdraw the arc"
 ywc_shu.1103.withdraw_after_central_fail.cost_tooltip:0 "No new charge; prior payments are not refunded."
 ywc_shu.1103.withdraw_after_central_fail.consequence_tooltip:0 "Releases the arc."
 ywc_shu.1104.t:0 "One Chair Missing from the Table"
 ywc_shu.1104.d:0 "Provincial sharing needs both to be real: a still-valid negotiation right and the original pilot still held. This line can write that right itself, or continue from a still-owned prior right. An old record with a lost pilot is an empty chair and must be re-established against 25% office staffing with a real meeting fee, or fall back to old negotiation."
 ywc_shu.1104.write_share_terms:0 "Put accountable provincial terms in writing"
 ywc_shu.1104.write_share_terms.cost_tooltip:0 "Continue a real audit right in the same still-owned original pilot free; otherwise the treasury pays half a week of income, at least 50, for the meeting. No provincial tax is transferred."
 ywc_shu.1104.write_share_terms.consequence_tooltip:0 "Record this arc's terms and pilot provenance, then observe six calendar months. Written terms do not mean local cash has arrived."
 ywc_shu.1104.meeting_without_terms:0 "Hold the meeting without terms (setback)"
 ywc_shu.1104.meeting_without_terms.cost_tooltip:0 "No charge."
 ywc_shu.1104.meeting_without_terms.consequence_tooltip:0 "Records a setback without closing; keeps stage 1104 so terms still require the conditions."
 ywc_shu.1104.fallback_legacy:0 "Fall back to old negotiation"
 ywc_shu.1104.fallback_legacy.cost_tooltip:0 "No charge."
 ywc_shu.1104.fallback_legacy.consequence_tooltip:0 "Enters 1105; it does not inherit sharing rights."
 ywc_shu.1104.wait_for_share_right:0 "Defer until office or meeting cash is ready"
 ywc_shu.1104.wait_for_share_right.cost_tooltip:0 "No charge."
 ywc_shu.1104.wait_for_share_right.consequence_tooltip:0 "Keeps stage 1104; the monthly queue re-offers once conditions are met, and non-participation never locks the line."
 ywc_shu.1104.withdraw_after_share_fail:0 "Withdraw the arc"
 ywc_shu.1104.withdraw_after_share_fail.cost_tooltip:0 "No new charge."
 ywc_shu.1104.withdraw_after_share_fail.consequence_tooltip:0 "Releases the arc."
 ywc_shu.1105.t:0 "Can the Old Quota Hold One More Year"
 ywc_shu.1105.d:0 "Keeping the old negotiation is almost the default in long peace or before industrialisation: no new law or school needed, only genuine fiscal safety and no war. But peace and the old quota must actually hold: with this line's unpaid provincial undertaking or school debit, the honest result is a setback or renegotiation, not a pretence that the old quota clears everything."
 ywc_shu.1105.confirm_old_quota:0 "Peace and solvency hold; establish the bounded old quota"
 ywc_shu.1105.confirm_old_quota.cost_tooltip:0 "No new cost; grants no law or building."
 ywc_shu.1105.confirm_old_quota.consequence_tooltip:0 "Confirm a limited old quota against actual office staffing, peace and solvency, then observe six months. Earlier local responsibilities are not recorded as paid cash, and central coverage is not expanded."
 ywc_shu.1105.renegotiate_next_year:0 "Renegotiate next year: defer without free passage"
 ywc_shu.1105.renegotiate_next_year.cost_tooltip:0 "No charge."
 ywc_shu.1105.renegotiate_next_year.consequence_tooltip:0 "Keeps stage 1105; re-offered once conditions improve, and deferral is not free passage."
 ywc_shu.1105.withdraw_legacy_line:0 "Withdraw the arc"
 ywc_shu.1105.withdraw_legacy_line.cost_tooltip:0 "No new charge."
 ywc_shu.1105.withdraw_legacy_line.consequence_tooltip:0 "Releases the arc."
 ywc_shu.1106.t:0 "The Crack in the Ledger"
 ywc_shu.1106.d:0 "When the six-month audit matures or is interrupted, a crack appears. If mature and conditions still hold, the route proceeds to settlement; war, default, bankruptcy or a lost state only defer or exit, and an immature audit is never written as done nor charged again. Deferral must wait for recovery and recount six months from zero."
 ywc_shu.1106.settle_on_time:0 "Settle on time and move to the close"
 ywc_shu.1106.settle_on_time.cost_tooltip:0 "No repeated charge."
 ywc_shu.1106.settle_on_time.consequence_tooltip:0 "Only moves the stage to 1107; the real outcome and release wait for 1107's live re-check."
 ywc_shu.1106.defer_no_fee:0 "Defer: recount six months from zero after recovery"
 ywc_shu.1106.defer_no_fee.cost_tooltip:0 "No new deduction."
 ywc_shu.1106.defer_no_fee.consequence_tooltip:0 "Resets the streak and keeps stage 1106; after recovery it must accrue six real months again and never passes for free."
 ywc_shu.1106.withdraw_ledger:0 "Exit and enter credit repair"
 ywc_shu.1106.withdraw_ledger.cost_tooltip:0 "Keeps prior payments and adds nothing."
 ywc_shu.1106.withdraw_ledger.consequence_tooltip:0 "Records exit and releases the arc."
 ywc_shu.1107.t:0 "Will the Next Governor Take the Ledger"
 ywc_shu.1107.d:0 "The close only confirms the tier actually reached now: established, compromise, setback with repairable goals, or a formal exit. Nothing is charged here and no law, school or sovereignty is granted; an earlier candidate is not current full eligibility, and if conditions have vanished only setback, deferral or exit is available. A successor governor reads the same variables."
 ywc_shu.1107.close_established:0 "Confirm the full central compact"
 ywc_shu.1107.close_established.cost_tooltip:0 "No charge."
 ywc_shu.1107.close_established.consequence_tooltip:0 "Full central = 1; provincial/legacy/partial central = 2; releases the arc once after a live re-check."
 ywc_shu.1107.close_compromise:0 "Confirm bounded shared or legacy terms"
 ywc_shu.1107.close_compromise.cost_tooltip:0 "No charge."
 ywc_shu.1107.close_compromise.consequence_tooltip:0 "Record a bounded compromise, without claiming full central responsibility; release this arc's capacity once."
 ywc_shu.1107.close_setback:0 "Confirm setback, keep repairable goals"
 ywc_shu.1107.close_setback.cost_tooltip:0 "No charge."
 ywc_shu.1107.close_setback.consequence_tooltip:0 "Writes a setback and keeps repairable goals; it does not feign success."
 ywc_shu.1107.close_exit:0 "Formal exit"
 ywc_shu.1107.close_exit.cost_tooltip:0 "Prior payments are not refunded."
 ywc_shu.1107.close_exit.consequence_tooltip:0 "Writes exit and releases the arc; the close always has an executable option."
 ywc_je_v03_shu_deliberation_eligibility:0 "Who May Address the Court"
 ywc_je_v03_shu_deliberation_eligibility_reason:0 "Fix budget speech and appeal responsibility under the real old fiscal contract, current laws, groups and original-state offices: choose the full court-consultation, property-representation or sealed-deliberation route with a verified witness, then sign the real budget duty to the Board. Interruptions are recorded honestly; an unsigned budget is never written as done."
 ywc_je_v03_shu_deliberation_appeal_execution:0 "Who Answers Across Six Months"
 ywc_je_v03_shu_deliberation_appeal_execution_reason:0 "After an appeal is accepted, this line's own six-calendar-month observation begins: each real monthly pulse counts once and a one-day expiry gate blocks same-day double counting; war, a lost state, bankruptcy or a lost current duty clears the streak and records the interruption, and recovery needs an explicit restart. Only six matured counts close it, and an immature observation is never written as an answer."
 ywc_shu.1120.t:0 "First Ask Who May Speak"
 ywc_shu.1120.d:0 "Four petitions reach the court: scholars ask for open consultation, propertied industrialists and rural folk ask for representation, gentry and garrisons ask for a sealed channel, and the Board only wants to know who takes a limited appeal. This line's pilot is already fixed among actually owned Sichuan, Chongqing, Yunnan or Guizhou; when the current mode conditions fall short, the full route may not be chosen."
 ywc_shu.1120.court_consultation:0 "Court consultation: scholars speak in open session"
 ywc_shu.1120.court_consultation.cost_tooltip:0 "No charge at this node; the full route's register fee is actually paid at 1121 under the conditions then current."
 ywc_shu.1120.court_consultation.consequence_tooltip:0 "Requires monarchy, appointed bureaucrats, one of three speech laws, non-negative bureaucracy, legitimacy 25, the intelligentsia in government at clout 0.10, and 0.8 original-state office staffing."
 ywc_shu.1120.property_representation:0 "Property representation: propertied interests take seats"
 ywc_shu.1120.property_representation.cost_tooltip:0 "No charge at this node; the register fee is B with a real old local audit right, otherwise 1.5B, actually paid at 1121."
 ywc_shu.1120.property_representation.consequence_tooltip:0 "Requires one of wealth/census/universal suffrage, assembly or protected speech, non-negative net fixed income, legitimacy 25, industrialists and rural folk both in government at clout 0.10, and 0.5 original-state office staffing."
 ywc_shu.1120.sealed_appeal:0 "Sealed deliberation: gentry and garrisons submit sealed memorials"
 ywc_shu.1120.sealed_appeal.cost_tooltip:0 "No charge at this node; the full sealed route's register fee is 0.5B, actually paid at 1121."
 ywc_shu.1120.sealed_appeal.consequence_tooltip:0 "Requires autocracy or oligarchy, outlawed dissent or censorship, authority 50, legitimacy 25, landowners and armed forces both in government at clout 0.10, and 0.5 original-state office staffing."
 ywc_shu.1120.limited_appeal:0 "Explicit limited appeal: target2 acceptance only"
 ywc_shu.1120.limited_appeal.cost_tooltip:0 "No charge at this node; the limited register fee is fixed at 0.5B and no full-policy discount overrides the limited price."
 ywc_shu.1120.limited_appeal.consequence_tooltip:0 "Applies under any regime or law: only 0.25 office staffing, non-negative bureaucracy, legitimacy 20, peace and fiscal safety. mode3 here is an explicit limited choice, not reliance on full mode3 laws."
 ywc_shu.1120.defer_mode_choice:0 "Defer: conditions fall short; wait for current facts to recover"
 ywc_shu.1120.defer_mode_choice.cost_tooltip:0 "No charge and no stage advance."
 ywc_shu.1120.defer_mode_choice.consequence_tooltip:0 "Keeps stage 1120; the monthly queue re-offers once laws, groups or staffing recover. Deferral allows later reconsideration."
 ywc_shu.1120.withdraw_at_1120:0 "Withdraw the speech-eligibility agenda"
 ywc_shu.1120.withdraw_at_1120.cost_tooltip:0 "No new charge; prior payments are not refunded."
 ywc_shu.1120.withdraw_at_1120.consequence_tooltip:0 "Releases this arc once as an active withdrawal; old ledgers and debts are untouched."
 ywc_shu.1121.t:0 "A Budget That Can Be Questioned"
 ywc_shu.1121.d:0 "The Board slides the register over: establishing a budget speech right begins with a registration fee. Full consultation B, property representation B with a real old local audit right and 1.5B without, sealed deliberation and limited acceptance 0.5B each. The merchants' old money is not a new fee, and borrowed principal is never spent on this line."
 ywc_shu.1121.pay_register:0 "Pay the register fee and open the budget roll"
 ywc_shu.1121.pay_register.cost_tooltip:0 "B is captured at claim (annual gross income ÷ 52, minimum 100, never recomputed on popups). Full mode1 B; full mode2 B with a real old local audit right, else 1.5B; full mode3 0.5B; limited target2 0.5B. Deduct first, record a positive amount, never overdraft, refund or top up."
 ywc_shu.1121.pay_register.consequence_tooltip:0 "Menu and execution read the same current price, cash and bankruptcy state; branches are mutually exclusive and no full discount overrides the limited price."
 ywc_shu.1121.wait_register_funds:0 "Defer the fee until cash is raised"
 ywc_shu.1121.wait_register_funds.cost_tooltip:0 "No deduction and no payment recorded."
 ywc_shu.1121.wait_register_funds.consequence_tooltip:0 "Keeps stage 1121; the monthly queue re-offers once cash recovers, and the price is rechecked under the then-current conditions."
 ywc_shu.1121.defer_register_stage:0 "Reconsider later: leave the register fee undecided"
 ywc_shu.1121.defer_register_stage.cost_tooltip:0 "No charge."
 ywc_shu.1121.defer_register_stage.consequence_tooltip:0 "Deferral allows later reconsideration; this node changes no business, money or queue."
 ywc_shu.1121.withdraw_at_1121:0 "Withdraw the budget register"
 ywc_shu.1121.withdraw_at_1121.cost_tooltip:0 "No new charge; prior payments are not refunded."
 ywc_shu.1121.withdraw_at_1121.consequence_tooltip:0 "Releases this arc once and records withdrawal."
 ywc_shu.1122.t:0 "The Witness's Seat"
 ywc_shu.1122.d:0 "The budget roll is open, but a witness must sit. Reusing a real old local audit right or province-compact proof at 0.5 current office staffing is a genuine inheritance; a new witness without that right needs 0.8; the target2-only local witness needs 0.25. The witness source is written into the record and rechecked continuously afterwards."
 ywc_shu.1122.reuse_local_witness:0 "Reuse the real old local audit or province-compact proof"
 ywc_shu.1122.reuse_local_witness.cost_tooltip:0 "No charge; a real old right is a real witness."
 ywc_shu.1122.reuse_local_witness.consequence_tooltip:0 "The source field points to real old fiscal or province-compact evidence tied to this line's pilot; it is rechecked every stage and fails if lost."
 ywc_shu.1122.new_witness:0 "New witness: an office at 0.8 original-state staffing"
 ywc_shu.1122.new_witness.cost_tooltip:0 "No charge; a new witness rests on a real staffed office, and no building or job is created."
 ywc_shu.1122.new_witness.consequence_tooltip:0 "A new witness without the old right needs 0.8; where current mode2 policy already allows 0.5, the difference between the two witnesses is genuinely visible."
 ywc_shu.1122.local_witness:0 "Limited-only local witness at 0.25 staffing"
 ywc_shu.1122.local_witness.cost_tooltip:0 "No charge; target2 only, and the full route may never borrow the 0.25 threshold."
 ywc_shu.1122.local_witness.consequence_tooltip:0 "Writes witness_source=3 with target2; a later narrow re-sign replaces it and clears the old source reference."
 ywc_shu.1122.wait_witness_office:0 "Defer until the office is staffed"
 ywc_shu.1122.wait_witness_office.cost_tooltip:0 "No charge."
 ywc_shu.1122.wait_witness_office.consequence_tooltip:0 "Keeps stage 1122; the monthly queue re-offers once staffing recovers. Deferral allows later reconsideration."
 ywc_shu.1122.withdraw_at_1122:0 "Withdraw the witness arrangement"
 ywc_shu.1122.withdraw_at_1122.cost_tooltip:0 "No new charge; the paid register fee is not refunded."
 ywc_shu.1122.withdraw_at_1122.consequence_tooltip:0 "Releases this arc once and records withdrawal."
 ywc_shu.1123.t:0 "Which Page the Board Must Answer"
 ywc_shu.1123.d:0 "Every page is opened before signing: current laws and groups, original-state offices, the paid register fee, the current witness source and every snapshot. Only when all hold is the budget duty signed to the Board and JE2 handed off. The handoff checks only that a real signature exists, not capacity or ownership — even if the state is lost or capacity fills right after signing, the appeal line still takes over and can exit honestly."
 ywc_shu.1123.sign_budget:0 "Sign the budget duty once every page checks out"
 ywc_shu.1123.sign_budget.cost_tooltip:0 "No extra charge; the signature checks current facts and the positive paid amount without recharging or topping up."
 ywc_shu.1123.sign_budget.consequence_tooltip:0 "sign_mode/target/pilot snapshots must match the current mode, target and pilot; then signed is written and JE2 takes over without capacity or ownership checks."
 ywc_shu.1123.defer_signing:0 "Defer signing pending rechecks"
 ywc_shu.1123.defer_signing.cost_tooltip:0 "No charge."
 ywc_shu.1123.defer_signing.consequence_tooltip:0 "Keeps stage 1123; deferral allows later reconsideration and the monthly queue re-offers after recovery."
 ywc_shu.1123.withdraw_at_1123:0 "Withdraw the signing agenda"
 ywc_shu.1123.withdraw_at_1123.cost_tooltip:0 "No new charge; prior payments are not refunded."
 ywc_shu.1123.withdraw_at_1123.consequence_tooltip:0 "Releases this arc once, records withdrawal, and JE1 fails."
 ywc_shu.1124.t:0 "Who Takes the Appeal"
 ywc_shu.1124.d:0 "JE2's first question: choose the recipient by the current mode. mode1/2 use public acceptance, mode3 sealed acceptance, and target2 local acceptance; the scope and handling office are recorded for real before the six-month observation starts. No unapproved extra payment is taken."
 ywc_shu.1124.register_public_appeal:0 "Public acceptance under the consultation or representation scope"
 ywc_shu.1124.register_public_appeal.cost_tooltip:0 "No charge and no unapproved extra payment."
 ywc_shu.1124.register_public_appeal.consequence_tooltip:0 "The acceptance snapshot records the current mode, target and pilot with the handling-office threshold, then 1125's six-month observation begins."
 ywc_shu.1124.register_sealed_appeal:0 "Sealed acceptance for gentry and garrison memorials"
 ywc_shu.1124.register_sealed_appeal.cost_tooltip:0 "No charge."
 ywc_shu.1124.register_sealed_appeal.consequence_tooltip:0 "The sealed channel opens only under current full mode3 conditions; acceptance moves to 1125's observation."
 ywc_shu.1124.register_local_appeal:0 "Local acceptance, target2 only"
 ywc_shu.1124.register_local_appeal.cost_tooltip:0 "No charge; local acceptance applies under any regime and needs only current target2 conditions."
 ywc_shu.1124.register_local_appeal.consequence_tooltip:0 "The acceptance scope covers only this state's office duties; 1125's observation matures on six real monthly pulses."
 ywc_shu.1124.defer_acceptance:0 "Defer acceptance pending a recheck of current conditions"
 ywc_shu.1124.defer_acceptance.cost_tooltip:0 "No charge and no observation starts."
 ywc_shu.1124.defer_acceptance.consequence_tooltip:0 "Keeps stage 1124; deferral allows later reconsideration and the monthly queue re-offers after recovery."
 ywc_shu.1124.withdraw_at_1124:0 "Withdraw the appeal acceptance"
 ywc_shu.1124.withdraw_at_1124.cost_tooltip:0 "No new charge; prior payments are not refunded."
 ywc_shu.1124.withdraw_at_1124.consequence_tooltip:0 "Releases this arc once and records withdrawal."
 ywc_shu.1125.t:0 "Old Debts Do Not Answer for the Court"
 ywc_shu.1125.d:0 "The observation matures or breaks here. Only six real matured months let the review fee be actually paid before 1126 — full mode1 B, full mode2 B with a genuinely repaid-principal merchant consultation source and 1.5B without; mode3 and target2 0.5B each; consultation, principal and actual repayment are all required for the discount. After a real interruption, an explicit restart counts from zero; narrow_and_recount re-signs the limited witness and every snapshot, keeps actual payments, clears the request and maturity, and starts six fresh months. The limited route needs no school or old history."
 ywc_shu.1125.pay_review:0 "Pay the review fee and move to 1126"
 ywc_shu.1125.pay_review.cost_tooltip:0 "Full mode1 B; full mode2 B with a genuinely repaid-principal merchant consultation source, else 1.5B; full mode3 0.5B; target2 0.5B. Menu, outer limit and helper read the same current price; deduct first, record a positive amount, never overdraft or recharge."
 ywc_shu.1125.pay_review.consequence_tooltip:0 "Only genuine maturity plus a paid review advances; five months are not six, and old debts or consultation rights never answer for the court."
 ywc_shu.1125.advance_paid_review:0 "Review already paid: advance to 1126 once six fresh months mature"
 ywc_shu.1125.advance_paid_review.cost_tooltip:0 "No second charge; the paid review and register fees keep their original amounts, with no refund, top-up or rewrite."
 ywc_shu.1125.advance_paid_review.consequence_tooltip:0 "Advance to 1126 only while the review is paid in a positive amount, six genuine fresh months have matured, and the current stage, phase, receipt and staged snapshots still hold; an immature observation never skips ahead."
 ywc_shu.1125.restart_review:0 "Explicit restart: refresh the real record and count from zero"
 ywc_shu.1125.restart_review.cost_tooltip:0 "No charge; the paid register and review fees are both kept."
 ywc_shu.1125.restart_review.consequence_tooltip:0 "The interruption flag clears, streak and maturity reset to zero, and six fresh real months are counted; a restart requires the base duty to be currently performable."
 ywc_shu.1125.narrow_and_recount:0 "Explicitly re-sign the limited witness and acceptance, recounting six fresh months"
 ywc_shu.1125.narrow_and_recount.cost_tooltip:0 "No new fee and no refund: actually paid register and review fees keep their original amounts, and the recount never recharges."
 ywc_shu.1125.narrow_and_recount.consequence_tooltip:0 "Request and maturity clear, the old witness-source reference is replaced by the limited witness, every snapshot is rewritten for target2, and six fresh months begin. The local witness and handler can genuinely change."
 ywc_shu.1125.wait_review_recovery:0 "Defer while the observation is immature or still interrupted"
 ywc_shu.1125.wait_review_recovery.cost_tooltip:0 "No charge."
 ywc_shu.1125.wait_review_recovery.consequence_tooltip:0 "Keeps stage 1125; after recovery a restart or re-sign is needed before continuing. Deferral allows later reconsideration."
 ywc_shu.1125.withdraw_at_1125:0 "Withdraw the observation and appeal"
 ywc_shu.1125.withdraw_at_1125.cost_tooltip:0 "No new charge; prior payments are not refunded."
 ywc_shu.1125.withdraw_at_1125.consequence_tooltip:0 "Releases this arc once and records withdrawal."
 ywc_shu.1126.t:0 "Write the Answer into the Next Budget"
 ywc_shu.1126.d:0 "With the review paid, the answer is drafted from current facts: request_full while the full duty holds now, request_limited under the limited duty, request_setback only when the duty is genuinely lost. Once recovery has happened, a cached setback button can neither be proposed nor executed. recount may return to 1125 without recharging; the monthly pulse never rewinds this stage to 1125."
 ywc_shu.1126.request_full:0 "Propose the answer under the full policy"
 ywc_shu.1126.request_full.cost_tooltip:0 "No charge."
 ywc_shu.1126.request_full.consequence_tooltip:0 "The answer type is recorded from current full facts; 1127 still double-checks."
 ywc_shu.1126.request_limited:0 "Propose the answer under the current limited local duty"
 ywc_shu.1126.request_limited.cost_tooltip:0 "No charge."
 ywc_shu.1126.request_limited.consequence_tooltip:0 "The limited answer claims only the current local duty and never passes for the full policy."
 ywc_shu.1126.request_setback:0 "The duty is genuinely lost: propose a setback answer honestly"
 ywc_shu.1126.request_setback.cost_tooltip:0 "No charge."
 ywc_shu.1126.request_setback.consequence_tooltip:0 "A setback answer is available only while genuinely matured, review paid and the current duty lost; once recovered, this button disappears and cannot execute."
 ywc_shu.1126.recount:0 "Return to 1125 and recount without recharging"
 ywc_shu.1126.recount.cost_tooltip:0 "No extra charge: the paid review fee keeps its original amount and the recount deducts nothing."
 ywc_shu.1126.recount.consequence_tooltip:0 "The current request and maturity clear and the six-month observation reopens; this is the only lawful 1126→1125 return."
 ywc_shu.1126.withdraw_at_1126:0 "Withdraw the reviewed answer"
 ywc_shu.1126.withdraw_at_1126.cost_tooltip:0 "No new charge; prior payments are not refunded."
 ywc_shu.1126.withdraw_at_1126.consequence_tooltip:0 "Releases this arc once and records withdrawal."
 ywc_shu.1127.t:0 "Who Answers for This Answer"
 ywc_shu.1127.d:0 "The close double-checks current facts: outcome1 needs explicit target1, the current full policy, both fees actually paid in positive amounts, current witness and acceptance sources, the same mode-target-pilot snapshots and a matured six; outcome2 needs explicit target2 plus the current limited local duty; outcome3 settles only when genuinely matured, the review is paid and the current duty is lost — a recovered old setback button is unlawful. Each writes once and releases the arc; recount may return to 1125."
 ywc_shu.1127.close_full:0 "Confirm the full answer and release the arc"
 ywc_shu.1127.close_full.cost_tooltip:0 "No charge."
 ywc_shu.1127.close_full.consequence_tooltip:0 "outcome1 is written once and the arc released once; mode and outcome are never conflated."
 ywc_shu.1127.close_limited:0 "Confirm the limited answer and release the arc"
 ywc_shu.1127.close_limited.cost_tooltip:0 "No charge."
 ywc_shu.1127.close_limited.consequence_tooltip:0 "outcome2 is written once and the arc released once, without claiming full responsibility."
 ywc_shu.1127.close_setback:0 "Confirm the setback answer"
 ywc_shu.1127.close_setback.cost_tooltip:0 "No charge; paid fees are kept."
 ywc_shu.1127.close_setback.consequence_tooltip:0 "outcome3 is written once and the arc released once; a recovered old setback button can neither be proposed nor executed."
 ywc_shu.1127.recount_from_close:0 "Return to 1125 and recount"
 ywc_shu.1127.recount_from_close.cost_tooltip:0 "No repeated charge."
 ywc_shu.1127.recount_from_close.consequence_tooltip:0 "Returns to 1125 and reopens the observation; this is the only retreat from 1127."
 ywc_shu.1127.withdraw_at_1127:0 "Active exit"
 ywc_shu.1127.withdraw_at_1127.cost_tooltip:0 "Prior payments are not refunded."
 ywc_shu.1127.withdraw_at_1127.consequence_tooltip:0 "outcome4 goes only through the fail exit; the close always has an executable option."
