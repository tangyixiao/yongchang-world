l_english:
 ywc_je_v03_t11_roads_post_information:0 "The Neighbor's End of the Post Line"
 ywc_je_v03_t11_roads_post_information_reason:0 "Khalkha relay stations keep holding up transit papers, and every section of the line toward Oirat needs real staff, remounts and money before it can be joined. The court first picks between the old relay, a railway section and the wire according to era and researched technique, then audits the stations, the land and the merchant letters with Oirat, and finally settles who maintains the shared line; refusal or a limited acceptance is an equally valid ending."
 ywc_society.1500.t:0 "The Order That Arrived Late"
 ywc_society.1500.d:0 "An order took two months on the road to reach the station. Staff and remounts are short, and every section of the line toward Oirat must first be audited: the treasury, any existing railway and the researched techniques decide what is repaired first."
 ywc_society.1500.restore:0 "Pay 500 to restore the relay section"
 ywc_society.1500.restore.cost_tooltip:0 "Khalkha pays 500 from its treasury."
 ywc_society.1500.restore.consequence_tooltip:0 "The old relay goes first; Oirat is told the section will be joined."
 ywc_society.1500.railway:0 "Pay 800 to attach a researched railway section"
 ywc_society.1500.railway.cost_tooltip:0 "Khalkha pays 800; no railway is conjured, only an existing line is joined."
 ywc_society.1500.railway.consequence_tooltip:0 "The railway section joins the line; Oirat is told the section will be joined."
 ywc_society.1500.telegraph:0 "Pay 800 to string the wire along the line"
 ywc_society.1500.telegraph.cost_tooltip:0 "Khalkha pays 800 from its treasury."
 ywc_society.1500.telegraph.consequence_tooltip:0 "The wire goes first; Oirat is told the section will be joined."
 ywc_society.1500.wait:0 "Wait and review the books again"
 ywc_society.1500.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1500.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1501.t:0 "The Section the Neighbor Will Connect"
 ywc_society.1501.d:0 "Word of Khalkha's repairs reaches Oirat. Its office must first confirm its own stations can take a joining section, then fund the section, build only to the border, or refuse the connection; whatever the answer, Khalkha's station audit does not pause."
 ywc_society.1501.connect:0 "Pay 400 to build the joining section"
 ywc_society.1501.connect.cost_tooltip:0 "Oirat pays 400 from its treasury; nothing is transferred to Khalkha."
 ywc_society.1501.connect.consequence_tooltip:0 "The joining section is built; Khalkha receives the answer and continues the station audit."
 ywc_society.1501.limited:0 "Build only up to the border"
 ywc_society.1501.limited.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1501.limited.consequence_tooltip:0 "Only the border is joined; Khalkha receives the limited answer and continues the station audit."
 ywc_society.1501.decline:0 "Refuse the connection and keep separate relays"
 ywc_society.1501.decline.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1501.decline.consequence_tooltip:0 "The connection is refused; Khalkha records the refusal and proceeds on its own section only."
 ywc_society.1501.wait:0 "Wait before responding"
 ywc_society.1501.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1501.wait.consequence_tooltip:0 "Records this decision; if the line sits unanswered for over half a year it lapses."
 ywc_society.1501.withdraw:0 "The line has moved on; withdraw the request"
 ywc_society.1501.withdraw.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1501.withdraw.consequence_tooltip:0 "Withdraws the answer and clears only this pending record."
 ywc_society.1502.t:0 "Who Inspects the Post Relay"
 ywc_society.1502.d:0 "The relay section needs its standing rule: who inspects the papers, horses and accounts of the stations. The banner may inspect on its own or invite Oirat stationmen for a joint audit; the record must be readable on both sides."
 ywc_society.1502.own_office:0 "Inspect with the own banner stations"
 ywc_society.1502.own_office.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1502.own_office.consequence_tooltip:0 "The self-inspection is filed; the case moves to the land question."
 ywc_society.1502.joint:0 "Invite Oirat stationmen to inspect jointly"
 ywc_society.1502.joint.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1502.joint.consequence_tooltip:0 "The joint inspection is filed on both sides, one copy in each register."
 ywc_society.1502.wait:0 "Wait and review again"
 ywc_society.1502.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1502.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1503.t:0 "The Land the Line Occupies"
 ywc_society.1503.d:0 "The line must cross winter pastures and fields. Compensation and rerouting both cost real money; where the railway section is joined, the bed may be requisitioned section by section with a register. If the neighbor refused the connection, the case proceeds on the own section only."
 ywc_society.1503.compensate:0 "Pay 300 by the acre for the fields"
 ywc_society.1503.compensate.cost_tooltip:0 "Khalkha pays 300 from its treasury."
 ywc_society.1503.compensate.consequence_tooltip:0 "The compensation is registered; the line advances to the reroute or the court-letter question."
 ywc_society.1503.reroute:0 "Pay 200 to reroute around the fields"
 ywc_society.1503.reroute.cost_tooltip:0 "Khalkha pays 200 from its treasury."
 ywc_society.1503.reroute.consequence_tooltip:0 "The line is rerouted around the fields; the case advances onward."
 ywc_society.1503.requisition:0 "Pay 500 to requisition the rail bed with a register"
 ywc_society.1503.requisition.cost_tooltip:0 "Khalkha pays 500; open only when the railway section is already joined."
 ywc_society.1503.requisition.consequence_tooltip:0 "The requisition is registered; the case advances onward."
 ywc_society.1503.wait:0 "Wait and review again"
 ywc_society.1503.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1503.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1504.t:0 "The Alternative Route When Service Stops"
 ywc_society.1504.d:0 "Spring snows stop the middle section and transit goods pile up at both ends. Both countries share the duty: Oirat may fund a detour on its own section or close it and fall back to the old relay; either answer is filed in both registers."
 ywc_society.1504.divert:0 "Pay 200 to open a detour on the own section"
 ywc_society.1504.divert.cost_tooltip:0 "Oirat pays 200 from its treasury."
 ywc_society.1504.divert.consequence_tooltip:0 "The detour is opened; Khalkha receives the answer and moves to the court-letter question."
 ywc_society.1504.close:0 "Close the section and fall back to the old relay"
 ywc_society.1504.close.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1504.close.consequence_tooltip:0 "The closure is notified; Khalkha moves to the court-letter question."
 ywc_society.1504.wait:0 "Wait before responding"
 ywc_society.1504.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1504.wait.consequence_tooltip:0 "Records this decision; if the line sits unanswered for over half a year it lapses."
 ywc_society.1504.withdraw:0 "The line has moved on; withdraw the request"
 ywc_society.1504.withdraw.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1504.withdraw.consequence_tooltip:0 "Withdraws the answer and clears only this pending record."
 ywc_society.1505.t:0 "Merchant Letters Enter the Court"
 ywc_society.1505.d:0 "Merchants ask to attach their letters to the official relay; the old rule carries papers only. The court decides whether to open it, charging per cover and quickening trade news, or to keep the relay official and let merchants hire their own couriers. If the neighbor refused or is unreachable, the case closes directly as a limited connection."
 ywc_society.1505.open:0 "Let merchant letters ride the relay for a fee"
 ywc_society.1505.open.cost_tooltip:0 "No additional treasury expense; letters are counted per cover."
 ywc_society.1505.open.consequence_tooltip:0 "Merchant letters ride the relay on record; the case advances to the degree question or closes directly."
 ywc_society.1505.keep:0 "Keep the relay for official papers only"
 ywc_society.1505.keep.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1505.keep.consequence_tooltip:0 "Merchant letters stay off the relay; the case advances onward."
 ywc_society.1505.wait:0 "Wait and review again"
 ywc_society.1505.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1505.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1506.t:0 "How Far the Connection Goes"
 ywc_society.1506.d:0 "Both ends must state the degree plainly: through traffic with standing fees on both sides, or a handover at the border only. Once the degree is set, the maintenance of the shared line needs its own answer."
 ywc_society.1506.through:0 "Open through traffic with standing fees on both ends"
 ywc_society.1506.through.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1506.through.consequence_tooltip:0 "Oirat gains 5 relations with Khalkha; Khalkha receives the through-traffic proposal."
 ywc_society.1506.closed:0 "Hand over at the border only; no through traffic inland"
 ywc_society.1506.closed.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1506.closed.consequence_tooltip:0 "The handover stays at the border; Khalkha receives the limited proposal."
 ywc_society.1506.wait:0 "Wait before responding"
 ywc_society.1506.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1506.wait.consequence_tooltip:0 "Records this decision; if the line sits unanswered for over half a year it lapses."
 ywc_society.1506.withdraw:0 "The line has moved on; withdraw the request"
 ywc_society.1506.withdraw.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1506.withdraw.consequence_tooltip:0 "Withdraws the answer and clears only this pending record."
 ywc_society.1507.t:0 "Who Maintains the Shared Line"
 ywc_society.1507.d:0 "The line is built or dropped. Who pays the yearly repair and whether the next case may follow the same terms must be written down: a shared fund needs a staffed administration; each side may also repair its own; if the partner is unreachable, the case closes by the paid work record. Both registers keep the same result."
 ywc_society.1507.confirm:0 "Pay 400 to fund the shared yearly repair"
 ywc_society.1507.confirm.cost_tooltip:0 "Khalkha pays 400; the administration must still be staffed to manage the fund."
 ywc_society.1507.confirm.consequence_tooltip:0 "The shared repair fund is registered as repeatable, one copy on each side."
 ywc_society.1507.own_only:0 "Maintain the own side only, without a shared fund"
 ywc_society.1507.own_only.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1507.own_only.consequence_tooltip:0 "Each side maintains its own section without a precedent, filed on both sides."
 ywc_society.1507.abandon:0 "Drop the plan and keep the old relays"
 ywc_society.1507.abandon.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1507.abandon.consequence_tooltip:0 "The plan is dropped; if the partner is reachable, Oirat loses 5 relations with Khalkha."
 ywc_society.1507.alone:0 "Close alone because the partner is unreachable"
 ywc_society.1507.alone.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1507.alone.consequence_tooltip:0 "A paid work record closes as a limited connection; an unpaid one keeps the old relay."
 ywc_society.1507.wait:0 "Wait and review again"
 ywc_society.1507.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1507.wait.consequence_tooltip:0 "Records this decision."
