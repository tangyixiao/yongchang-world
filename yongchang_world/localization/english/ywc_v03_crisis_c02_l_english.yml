l_english:
 ywc_je_v03_c02_blackwater_testimonies:0 "Testimonies from Both Banks of the Blackwater"
 ywc_je_v03_c02_blackwater_testimonies_reason:0 "The seizure point, the fishery and the border posts each point to a different party. Identify the actual owners first, then let the far bank and the distant guarantor answer for themselves; every testimony is kept under its own name and nobody signs for another."
 ywc_je_v03_c02_river_defense_ledger:0 "The Ledger of River Defense and Border Trade"
 ywc_je_v03_c02_river_defense_ledger_reason:0 "Patrols, granaries, requisitions and registrations are paid from the year's accounts: those who can pay carry the full share, those who cannot trim it, winter grain is either compensated or narrowed, and nothing is borrowed against the future. Small countries raise no ocean fleets, and the river folk keep their own registers."
 ywc_je_v03_c02_spring_flood_agreement:0 "The Agreement After the Spring Flood"
 ywc_je_v03_c02_spring_flood_agreement_reason:0 "Conflicts of fulfillment go through review before they stand: which old tickets the new officers honor, what way out the weaker side keeps, which single border market opens first, all written into one joint river notice. When the river opens, each boat is audited against the ledger; those who keep faith keep their name, defaults are recorded as they are."
 ywc_crisis.1100.t:0 "One Cargo, Two Customs Tickets"
 ywc_crisis.1100.d:0 "The cargo seized from one boat comes with a customs ticket from each bank. The proposing court verifies item by item: which port owns the seizure point, which ticket still qualifies, who the actual cargo owner is. The answers go on record; nothing is confiscated first."
 ywc_crisis.1100.identify_owner:0 "Identify the actual owner of the seizure point"
 ywc_crisis.1100.identify_owner.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1100.identify_owner.consequence_tooltip:0 "The seizure owner and the valid ticket are recorded; the fishery and border inquiry follows."
 ywc_crisis.1100.record_both:0 "Record both tickets; leave ownership to the far bank's answer"
 ywc_crisis.1100.record_both.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1100.record_both.consequence_tooltip:0 "Both tickets are kept on file; ownership is settled at the review."
 ywc_crisis.1100.wait:0 "Wait and check the tickets again"
 ywc_crisis.1100.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1100.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1101.t:0 "The Fishery Missing from the War Map"
 ywc_crisis.1101.d:0 "The fishery absent from the war chart feeds two banks of families. Keeping its customary right costs the supply column and wins local standing; putting the army first gains the watchpost and taxes the fishery. Once settled, the far bank and the distant guarantor each answer on their own."
 ywc_crisis.1101.fishery_custom:0 "Keep the fishery's customary right; find supply elsewhere"
 ywc_crisis.1101.fishery_custom.cost_tooltip:0 "No additional treasury expense; the supply burden is carried elsewhere."
 ywc_crisis.1101.fishery_custom.consequence_tooltip:0 "The customary right is recorded and local standing rises; the far bank and the guarantor answer separately, each on its own."
 ywc_crisis.1101.military_first:0 "Put the army first; the fishery yields to the watchpost"
 ywc_crisis.1101.military_first.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1101.military_first.consequence_tooltip:0 "Military priority is recorded; supply is secured at the fishery's cost, and the far bank and guarantor answer separately."
 ywc_crisis.1101.wait:0 "Wait before deciding"
 ywc_crisis.1101.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1101.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1102.t:0 "The Boundary Marker on the Far Bank"
 ywc_crisis.1102.d:0 "The country on the far bank answers for itself: agree to survey the boundary together with a border market, accept the market but not the survey, or keep the old line. The marker stays where it stands; agreeing or refusing is entered in the far bank's own register."
 ywc_crisis.1102.agree_survey:0 "Agree to the survey and negotiate the market jointly"
 ywc_crisis.1102.agree_survey.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1102.agree_survey.consequence_tooltip:0 "The survey and market clauses are recorded and the river-defense budget follows; the marker does not move."
 ywc_crisis.1102.market_only:0 "Accept only the market; the boundary line follows the old register"
 ywc_crisis.1102.market_only.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1102.market_only.consequence_tooltip:0 "Only the market clause is recorded; the old boundary stands and the river-defense budget remains the far bank's own."
 ywc_crisis.1102.refuse:0 "Neither survey nor market; the old line governs"
 ywc_crisis.1102.refuse.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1102.refuse.consequence_tooltip:0 "The far bank stays out and moves to the renegotiation window; the proposer cannot sign in its place and the old line stands."
 ywc_crisis.1102.wait:0 "Wait before answering"
 ywc_crisis.1102.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1102.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1103.t:0 "The Distant Guarantor"
 ywc_crisis.1103.d:0 "A distant country with real route ties may answer: a limited guarantee traded for market clauses, free observation, or outright refusal. The guarantee lands on commerce and relations only; no military command that is not its own is written into it."
 ywc_crisis.1103.limited_guarantee:0 "Offer a limited guarantee for market clauses"
 ywc_crisis.1103.limited_guarantee.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1103.limited_guarantee.consequence_tooltip:0 "The guarantee clause is recorded as market terms and improved relations, with no military command; the river-defense share follows."
 ywc_crisis.1103.observe_free:0 "Observe freely without joining any clause"
 ywc_crisis.1103.observe_free.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1103.observe_free.consequence_tooltip:0 "Observation is recorded without any clause; a separate decision follows when the renegotiation window opens."
 ywc_crisis.1103.refuse_guarantee:0 "Refuse the guarantee; keep the old routes"
 ywc_crisis.1103.refuse_guarantee.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1103.refuse_guarantee.consequence_tooltip:0 "The refusal is recorded and the renegotiation window follows; the old routes stay open."
 ywc_crisis.1103.wait:0 "Wait before answering"
 ywc_crisis.1103.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1103.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1104.t:0 "Patrol Boats and Granaries"
 ywc_crisis.1104.d:0 "River patrols, granaries and watchpost garrisons are paid from current income. Those who can afford it carry all three; those who cannot trim it to the border-market granary alone. Small countries raise no ocean fleets and nothing is enjoyed before it is paid."
 ywc_crisis.1104.pay_full:0 "Carry all three and pay 600"
 ywc_crisis.1104.pay_full.cost_tooltip:0 "The holder's treasury pays 600."
 ywc_crisis.1104.pay_full.consequence_tooltip:0 "Patrols, granaries and watchposts stand as written; the winter-grain clause is tested next."
 ywc_crisis.1104.pay_limited:0 "Trim to the border-market granary and pay 200"
 ywc_crisis.1104.pay_limited.cost_tooltip:0 "The holder's treasury pays 200."
 ywc_crisis.1104.pay_limited.consequence_tooltip:0 "Only the market granary stands; the patrol and watchpost shortfall is carried into settlement and only a limited agreement can be confirmed."
 ywc_crisis.1104.wait:0 "Wait and recheck the accounts"
 ywc_crisis.1104.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1104.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1105.t:0 "Who Testifies for the River Folk"
 ywc_crisis.1105.d:0 "Corvee, fishery dues and customs crossings all need the river folk as witnesses. A joint community register makes taxes collect and disputes fewer; office adjudication speeds the levy and breeds resentment. The register belongs to the river folk, not to the war chart."
 ywc_crisis.1105.joint_register:0 "Set up the joint community register"
 ywc_crisis.1105.joint_register.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1105.joint_register.consequence_tooltip:0 "The joint register is recorded; taxes collect smoothly and corvee disputes lessen, and the holder's own clauses can be confirmed at settlement."
 ywc_crisis.1105.office_adjudication:0 "Let the office adjudicate alone"
 ywc_crisis.1105.office_adjudication.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1105.office_adjudication.consequence_tooltip:0 "Office adjudication is recorded; the levy runs faster but resentment is kept on file and tax collection is discounted."
 ywc_crisis.1105.wait:0 "Wait before fixing the register"
 ywc_crisis.1105.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1105.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1106.t:0 "The Requisitioned Winter Grain"
 ywc_crisis.1106.d:0 "The army needs winter grain, and the granary is to be requisitioned. Full compensation keeps the river folk and the neighbours; narrowing the requisition saves silver and spends good will. The accounts are carried as they are, with no shifting of burdens and no arrears."
 ywc_crisis.1106.compensate_grain:0 "Compensate the winter grain and pay 400"
 ywc_crisis.1106.compensate_grain.cost_tooltip:0 "The holder's treasury pays 400."
 ywc_crisis.1106.compensate_grain.consequence_tooltip:0 "The army is fed and the compensation is on the books; relations with the locals and the far bank improve and the old tickets keep their force."
 ywc_crisis.1106.narrow_requisition:0 "Narrow the requisition to camp needs only"
 ywc_crisis.1106.narrow_requisition.cost_tooltip:0 "No additional treasury expense; the supply shortfall is kept on file."
 ywc_crisis.1106.narrow_requisition.consequence_tooltip:0 "The requisition narrows and silver is saved at local standing's cost; the fulfillment gap must be faced at the review."
 ywc_crisis.1106.wait:0 "Hold the requisition"
 ywc_crisis.1106.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1106.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1107.t:0 "New Officers, Old Tickets"
 ywc_crisis.1107.d:0 "The port changes hands and the office changes clerks: do the old tickets stand? The new controller and the original party each confirm: keep the clauses in force, shrink them to the border market alone, or walk out. Nobody resurrects the old master and no map is redrawn."
 ywc_crisis.1107.reaffirm_clauses:0 "Confirm the old tickets still stand; the clauses keep their force"
 ywc_crisis.1107.reaffirm_clauses.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1107.reaffirm_clauses.consequence_tooltip:0 "The clauses keep their force and the market confirmation or settlement follows; no map is redrawn."
 ywc_crisis.1107.market_only_clauses:0 "Shrink the old tickets to the border market alone"
 ywc_crisis.1107.market_only_clauses.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1107.market_only_clauses.consequence_tooltip:0 "The other clauses lapse and only the border market stands; only a limited agreement can be confirmed at settlement."
 ywc_crisis.1107.withdraw_case:0 "Leave the case and keep to the old usage"
 ywc_crisis.1107.withdraw_case.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1107.withdraw_case.consequence_tooltip:0 "The case closes as a withdrawal and the capacity slot is released; the old usage stands and no feud is written."
 ywc_crisis.1107.wait:0 "Wait before confirming"
 ywc_crisis.1107.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1107.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1108.t:0 "One Border Market First"
 ywc_crisis.1108.d:0 "Nobody can carry the whole line, so the two banks each confirm one border market that can actually open: its site, tariff and opening date go on the register. When the other bank confirms, the joint river notice can be printed; if it stalls, each side still has its own way out."
 ywc_crisis.1108.confirm_market:0 "Confirm one border market first"
 ywc_crisis.1108.confirm_market.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1108.confirm_market.consequence_tooltip:0 "The market confirmation is recorded; if the other bank has confirmed the joint notice opens, otherwise it waits for its counterpart."
 ywc_crisis.1108.insist_full_line:0 "Insist on the whole line; open no single market"
 ywc_crisis.1108.insist_full_line.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1108.insist_full_line.consequence_tooltip:0 "The whole-line claim is recorded and no single market opens; after the term expires the holder settles by its own exit."
 ywc_crisis.1108.wait:0 "Wait before confirming"
 ywc_crisis.1108.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1108.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1109.t:0 "The Way Out Beyond the Watchposts"
 ywc_crisis.1109.d:0 "The weaker side chooses its own way out: join under restraint, leave for another partner, or pause and deliberate. Refusal does not ruin a country and leaving writes no feud; the clauses are laid out in the open and the road stays under its own feet."
 ywc_crisis.1109.restrained_join:0 "Restrain unilaterally and join in the limited form"
 ywc_crisis.1109.restrained_join.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1109.restrained_join.consequence_tooltip:0 "Joined in the limited form: local countries settle their register first while the others await the settlement; the burden is chosen and carried by the holder itself."
 ywc_crisis.1109.alternative_partner:0 "Take another partner and leave the case"
 ywc_crisis.1109.alternative_partner.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1109.alternative_partner.consequence_tooltip:0 "The case closes as a withdrawal and the capacity slot is released; the alternative partnership stays on file and no feud is written."
 ywc_crisis.1109.wait:0 "Pause the answer and deliberate the way out again"
 ywc_crisis.1109.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1109.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1110.t:0 "The Joint River Notice"
 ywc_crisis.1110.d:0 "The day of reckoning arrives: those with both the payments and the registers confirm the full river arrangement; those missing one confirm the limited market; those with neither keep the status quo. The notice is printed on paper, not on arms."
 ywc_crisis.1110.confirm_full:0 "Confirm the full river arrangement"
 ywc_crisis.1110.confirm_full.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1110.confirm_full.consequence_tooltip:0 "The full river arrangement is recorded pending the opening audit; every boat and ticket passes by the register."
 ywc_crisis.1110.confirm_limited:0 "Confirm the limited market clauses"
 ywc_crisis.1110.confirm_limited.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1110.confirm_limited.consequence_tooltip:0 "The limited market is recorded: the border market opens as written and the shortfalls are carried into the aftermath."
 ywc_crisis.1110.keep_status_quo:0 "Keep the status quo with old accounts and old usage"
 ywc_crisis.1110.keep_status_quo.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1110.keep_status_quo.consequence_tooltip:0 "The case closes as the status quo and the capacity slot is released; old accounts and old usage stand."
 ywc_crisis.1110.wait:0 "Wait before the reckoning"
 ywc_crisis.1110.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1110.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1111.t:0 "The First Boats of the Opening"
 ywc_crisis.1111.d:0 "When the river opens, the first boats pass the market. Each promise on the notice is checked: patrols standing, granaries full, the market open, and those who kept faith keep their name; one clause fallen through and the failure is recorded as it is. The verdict is written back to every participant's own register."
 ywc_crisis.1111.audit_kept:0 "Audit the promises kept and record the faithful"
 ywc_crisis.1111.audit_kept.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1111.audit_kept.consequence_tooltip:0 "The kept-faith record is written back to every participant's register and the capacity slot is released; the river and market run by the notice."
 ywc_crisis.1111.admit_broken:0 "Admit the promises fell through and record the failure"
 ywc_crisis.1111.admit_broken.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1111.admit_broken.consequence_tooltip:0 "The default is recorded as it is and payments already made stay on file; no war follows and the way out remains."
 ywc_crisis.1111.wait:0 "Wait before the audit"
 ywc_crisis.1111.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1111.wait.consequence_tooltip:0 "Records this decision."
