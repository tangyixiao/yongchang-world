l_english:
 ywc_je_v03_c05_autonomy_tax_bill:0 "The Autonomy Tax Bill"
 ywc_je_v03_c05_autonomy_tax_bill_reason:0 "Identify the local-federal responsibility dispute: how the two tax bills reconcile, in whose name the proposal is drafted, and how Mexico City and the overseas partners each answer; every step is recorded under the answering country's own name."
 ywc_je_v03_c05_coastal_defense_mandate:0 "The Coastal Defense Mandate"
 ywc_je_v03_c05_coastal_defense_mandate_reason:0 "Guard funding and appointment authority both land on real budgets: New Ming pays its own militia payroll, Mexico settles who appoints; each side executes with its own money and no free military grant is created."
 ywc_je_v03_c05_federal_promise_review:0 "The Review of the Federal Promise"
 ywc_je_v03_c05_federal_promise_review_reason:0 "Promises are audited: the wharf deeds and the missing quarter are reconciled as they actually stand, the pact text is confirmed by each congress separately, and the aftermath is recorded as practiced; defaults and shrinkage enter the same ledger."
 ywc_crisis.1400.t:0 "Two Tax Bills for One Household"
 ywc_crisis.1400.d:0 "On the same customs ledger, New Ming enters one remittance and Mexico City another defense levy. The proposing court must reconcile line by line which duties belong to the locality and which to the federation, and what remittance the local budget can actually carry."
 ywc_crisis.1400.reconcile_ledgers:0 "Reconcile the two tax bills line by line"
 ywc_crisis.1400.reconcile_ledgers.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1400.reconcile_ledgers.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1400.register_federal_claims:0 "Register the federal tax and defense levies as claimed"
 ywc_crisis.1400.register_federal_claims.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1400.register_federal_claims.consequence_tooltip:0 "The federal items are registered as the baseline for later talks."
 ywc_crisis.1400.wait:0 "Wait and recheck the accounts"
 ywc_crisis.1400.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1400.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1401.t:0 "The Petition of Parishes and Councils"
 ywc_crisis.1401.d:0 "The proposal needs a representative base: drafted jointly with parishes and councils, bilingual and parish-school claims enter the text; the court alone drafts narrower clauses. On submission the proposer sends the text to Mexico City and, along real contacts only, asks overseas commercial partners."
 ywc_crisis.1401.joint_mandate:0 "Draft the proposal jointly with parishes and councils"
 ywc_crisis.1401.joint_mandate.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1401.joint_mandate.consequence_tooltip:0 "The text goes to Mexico City; qualifying third countries are asked separately and answer for themselves."
 ywc_crisis.1401.court_only:0 "Let the court draft alone with a narrower base"
 ywc_crisis.1401.court_only.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1401.court_only.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1401.wait:0 "Wait and deliberate the mandate again"
 ywc_crisis.1401.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1401.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1402.t:0 "The Budget Committee of Mexico City"
 ywc_crisis.1402.d:0 "The federal budget committee reads the text: accept the remittance cap while keeping the listed obligations, demand a larger coastal-defense share from New Ming, or refuse the cap outright. The answer is Mexico's own; New Ming cannot sign for it."
 ywc_crisis.1402.accept_cap:0 "Accept the remittance cap; the federation keeps its listed duties"
 ywc_crisis.1402.accept_cap.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1402.accept_cap.consequence_tooltip:0 "The federal answer is recorded and later reconciled with New Ming's execution phase."
 ywc_crisis.1402.demand_defense:0 "Demand a larger coastal-defense share from New Ming"
 ywc_crisis.1402.demand_defense.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1402.demand_defense.consequence_tooltip:0 "New Ming's guard payroll will be raised accordingly."
 ywc_crisis.1402.refuse_cap:0 "Refuse the cap and keep the old register"
 ywc_crisis.1402.refuse_cap.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1402.refuse_cap.consequence_tooltip:0 "Relations with the proposer drop by 3; the federation moves to the reconsideration queue."
 ywc_crisis.1402.wait:0 "Wait before responding"
 ywc_crisis.1402.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1402.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1403.t:0 "Support from Across the Sea"
 ywc_crisis.1403.d:0 "Countries with real trade, diplomatic or migration ties are asked where they stand: extend a two-year limited commercial advance, invest against wharf preference, or merely observe. No outsider votes for the two parties or declares independence on New Ming's behalf."
 ywc_crisis.1403.limited_commercial:0 "Extend a two-year limited commercial advance (200)"
 ywc_crisis.1403.limited_commercial.cost_tooltip:0 "This country's treasury pays 200, sent directly to New Ming."
 ywc_crisis.1403.limited_commercial.consequence_tooltip:0 "The advance arrives and relations with New Ming rise by 3; no vote is cast for either party."
 ywc_crisis.1403.invest_conditions:0 "Invest against wharf preference"
 ywc_crisis.1403.invest_conditions.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1403.invest_conditions.consequence_tooltip:0 "The investment condition is recorded on New Ming; it can be claimed in the wharf dispute."
 ywc_crisis.1403.observe:0 "Observe without conditions"
 ywc_crisis.1403.observe.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1403.observe.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1403.wait:0 "Wait before responding"
 ywc_crisis.1403.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1403.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1404.t:0 "The Coastal Militia's Payroll"
 ywc_crisis.1404.d:0 "The guard must be paid from the local budget alone: one quarter's payroll as listed, or only watch posts and lookouts. If the federation has demanded a larger defense share the payroll rises; if no standing pay is affordable, none is created."
 ywc_crisis.1404.fund_payroll:0 "Pay one quarter's payroll and stand up the guard as listed"
 ywc_crisis.1404.fund_payroll.cost_tooltip:0 "The holder's treasury pays 400; 600 if the federation has demanded a larger defense share."
 ywc_crisis.1404.fund_payroll.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1404.limited_watch:0 "Keep only watch posts and lookouts, without standing pay"
 ywc_crisis.1404.limited_watch.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1404.limited_watch.consequence_tooltip:0 "No free military grant; only the limited agreement can be confirmed at settlement."
 ywc_crisis.1404.wait:0 "Wait and recheck the payroll"
 ywc_crisis.1404.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1404.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1405.t:0 "The Vacant Federal Appointments"
 ywc_crisis.1405.d:0 "The customs and defense vacancies hang open: joint appointment by both parties, nomination by New Ming with federal confirmation, or the old system with the federation alone. Whichever is chosen, the affected ports must be able to live with it."
 ywc_crisis.1405.joint_appointment:0 "Fill customs and defense vacancies by joint appointment"
 ywc_crisis.1405.joint_appointment.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1405.joint_appointment.consequence_tooltip:0 "Relations with the proposer rise by 3."
 ywc_crisis.1405.local_nomination:0 "New Ming nominates; the federation confirms"
 ywc_crisis.1405.local_nomination.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1405.local_nomination.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1405.keep_old:0 "Keep the old system; the federation appoints alone"
 ywc_crisis.1405.keep_old.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1405.keep_old.consequence_tooltip:0 "Relations with the proposer drop by 5; the imposed old system is recorded on New Ming."
 ywc_crisis.1405.wait:0 "Wait and deliberate the appointment again"
 ywc_crisis.1405.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1405.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1406.t:0 "The New Wharf Deeds"
 ywc_crisis.1406.d:0 "Outside investment has landed on specific plots: the new deeds clash with the old holders. Pay for arbitration and compensation, honor the investment conditions and favor the investors, or let the courts deliberate; objections go into clauses, not into arms."
 ywc_crisis.1406.arbitrate_compensate:0 "Pay 300 to arbitrate and compensate the old holders"
 ywc_crisis.1406.arbitrate_compensate.cost_tooltip:0 "The holder's treasury pays 300."
 ywc_crisis.1406.arbitrate_compensate.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1406.investor_priority:0 "Honor the investment terms; deeds favor the investors"
 ywc_crisis.1406.investor_priority.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1406.investor_priority.consequence_tooltip:0 "Relations with Mexico drop by 5; the investment terms are honored."
 ywc_crisis.1406.defer_courts:0 "Let the local courts deliberate; port business continues"
 ywc_crisis.1406.defer_courts.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1406.defer_courts.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1406.wait:0 "Wait and recheck the plots"
 ywc_crisis.1406.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1406.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1407.t:0 "The Quarter That Never Arrived"
 ywc_crisis.1407.d:0 "This quarter's remittance never reached Mexico City's ledger. The owing side must explain honestly: war losses at sea, a poor harvest, or money withheld against defense advances; the receiving side disposes separately: a make-up schedule, an offset from next quarter, or shrinking the pact to actual payment. Each answer is its own government's."
 ywc_crisis.1407.war_cost:0 "War losses at sea consumed the revenue; ask for a season's grace"
 ywc_crisis.1407.war_cost.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1407.war_cost.consequence_tooltip:0 "The explanation is sent; Mexico City disposes of it separately."
 ywc_crisis.1407.income_shortfall:0 "A poor harvest; remit half of what was actually collected"
 ywc_crisis.1407.income_shortfall.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1407.income_shortfall.consequence_tooltip:0 "The explanation is sent; Mexico City disposes of it separately."
 ywc_crisis.1407.withhold:0 "Withhold the remittance against defense advances"
 ywc_crisis.1407.withhold.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1407.withhold.consequence_tooltip:0 "Relations with Mexico drop by 5; the withholding stays on record."
 ywc_crisis.1407.schedule_makeup:0 "Fix a make-up schedule with two seasons' grace"
 ywc_crisis.1407.schedule_makeup.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1407.schedule_makeup.consequence_tooltip:0 "The make-up schedule is recorded on New Ming; New Ming moves to renegotiation."
 ywc_crisis.1407.offset_costs:0 "Offset from next quarter; the rest is paid as listed"
 ywc_crisis.1407.offset_costs.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1407.offset_costs.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1407.shrink_pact:0 "Shrink the pact to actual payment; trim the listed duties"
 ywc_crisis.1407.shrink_pact.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1407.shrink_pact.consequence_tooltip:0 "The shrinkage is recorded on New Ming; the full pact is no longer available."
 ywc_crisis.1407.wait:0 "Wait before disposing"
 ywc_crisis.1407.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1407.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1408.t:0 "Leaving the Open Questions on Paper"
 ywc_crisis.1408.d:0 "List fiscal affairs, defense and final status separately and sign a limited pact first; or write all three into one text; or leave the open clauses on paper and keep the current usage. The proposer can only propose; it cannot consent for the federation."
 ywc_crisis.1408.propose_limited:0 "List the three threads separately; sign the limited pact first"
 ywc_crisis.1408.propose_limited.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1408.propose_limited.consequence_tooltip:0 "The text goes to the federation for ratification; it may refuse."
 ywc_crisis.1408.propose_full:0 "Write all three threads into one pact"
 ywc_crisis.1408.propose_full.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1408.propose_full.consequence_tooltip:0 "The text goes to the federation for ratification; it may refuse."
 ywc_crisis.1408.leave_undecided:0 "Leave the open clauses on paper; keep the current usage"
 ywc_crisis.1408.leave_undecided.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1408.leave_undecided.consequence_tooltip:0 "The case closes as status quo and the capacity slot is released at once."
 ywc_crisis.1408.wait:0 "Wait and draft again"
 ywc_crisis.1408.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1408.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1409.t:0 "The Federation May Also Refuse"
 ywc_crisis.1409.d:0 "The federal congress reads the text: ratify as written for both congresses to confirm, defer ratification and trial the limited clauses first, or refuse and leave the pact unsigned. The proposer cannot flip the constitutional relationship on the federation's behalf."
 ywc_crisis.1409.ratify_text:0 "Ratify as written for both congresses to confirm"
 ywc_crisis.1409.ratify_text.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1409.ratify_text.consequence_tooltip:0 "The confirmation round opens; each congress confirms separately."
 ywc_crisis.1409.defer_text:0 "Defer ratification; trial the limited clauses first"
 ywc_crisis.1409.defer_text.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1409.defer_text.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1409.refuse_text:0 "Refuse to ratify; no other pact is negotiated"
 ywc_crisis.1409.refuse_text.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1409.refuse_text.consequence_tooltip:0 "Relations with the proposer drop by 3; the federation closes as withdrawn."
 ywc_crisis.1409.wait:0 "Wait and read the text again"
 ywc_crisis.1409.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1409.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1410.t:0 "Two Congresses, One Checklist"
 ywc_crisis.1410.d:0 "The checklist reaches both congresses: New Ming confirms the full or limited pact or shelves the status quo; Mexico accepts the text or refuses and walks out. Each confirmation binds only its own side; the full pact requires both."
 ywc_crisis.1410.ratify_full:0 "Merge the two lists and confirm the full pact"
 ywc_crisis.1410.ratify_full.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1410.ratify_full.consequence_tooltip:0 "The full pact stands; Mexico's confirmation is on record."
 ywc_crisis.1410.ratify_limited:0 "Confirm only the limited pact; the rest returns to talks"
 ywc_crisis.1410.ratify_limited.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1410.ratify_limited.consequence_tooltip:0 "The limited pact stands; remaining questions return to talks."
 ywc_crisis.1410.keep_status_quo:0 "Shelve both lists; keep the current usage"
 ywc_crisis.1410.keep_status_quo.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1410.keep_status_quo.consequence_tooltip:0 "The case closes as status quo and the capacity slot is released at once."
 ywc_crisis.1410.accept_text:0 "The congress accepts the text and performs as listed"
 ywc_crisis.1410.accept_text.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1410.accept_text.consequence_tooltip:0 "The federal confirmation is recorded; both sides share one ledger once New Ming settles."
 ywc_crisis.1410.refuse_text:0 "The congress refuses and leaves this round"
 ywc_crisis.1410.refuse_text.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1410.refuse_text.consequence_tooltip:0 "Relations with the proposer drop by 3; the federation closes as withdrawn."
 ywc_crisis.1410.wait:0 "Wait before the vote"
 ywc_crisis.1410.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1410.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1411.t:0 "What the Next Generation Calls the Country"
 ywc_crisis.1411.d:0 "The charter lands in schoolbooks, registers and deeds: bilingual administration, parish schools and citizenship are recorded as actually practiced. If pay was withheld or the pact shrank, the default is recorded too, and the accounts start anew."
 ywc_crisis.1411.record_kept:0 "Record identity and usage as actually practiced"
 ywc_crisis.1411.record_kept.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1411.record_kept.consequence_tooltip:0 "The aftermath record is shared with the participants; the capacity slot is released."
 ywc_crisis.1411.admit_default:0 "Record the default and shrinkage honestly; restart the accounts"
 ywc_crisis.1411.admit_default.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1411.admit_default.consequence_tooltip:0 "Fulfillment failure is recorded; the remaining questions continue through normal play."
 ywc_crisis.1411.wait:0 "Wait and recheck the registers"
 ywc_crisis.1411.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1411.wait.consequence_tooltip:0 "Records this decision."
