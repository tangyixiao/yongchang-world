l_english:
 ywc_je_v03_mhg_land_waterway:0 "Riverside Land Titles and the Shared Waterway"
 ywc_je_v03_mhg_land_waterway_reason:0 "The names on riverside deeds do not always match the people who actually farm the land, and nobody has agreed who pays to keep the channel clear. A Chinese polity on the Mekong must first put its land and waterway accounts in order."
 ywc_je_v03_mhg_common_resident:0 "Common Residents Beyond the Guild Hall"
 ywc_je_v03_mhg_common_resident_reason:0 "The guild hall's register cannot hold every riverside resident. Newcomers, local villages and the next generation each have claims, and the polity must decide who shares its courts, schools and seats."
 ywc_regional.7200.t:0 "Two Names on the Riverside Deed"
 ywc_regional.7200.d:0 "For the same riverside field, the guild's old ledger names the townsman who paid to clear it, while the government's new register names the household that actually pays the grain tax. Each book is half right, and half wrong."
 ywc_regional.7200.mixed_registry:0 "Run both ledgers: record clearing and grain tax together"
 ywc_regional.7200.mixed_registry.cost_tooltip:0 "Survey and registration fee: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.7200.mixed_registry.consequence_tooltip:0 "Clearing investors and tax-paying households are recorded side by side, with disputes heard by the office; the waterway question follows."
 ywc_regional.7200.guild_ledger:0 "Old ledger first: the guild's subscription book decides"
 ywc_regional.7200.guild_ledger.cost_tooltip:0 "No direct treasury expense."
 ywc_regional.7200.guild_ledger.consequence_tooltip:0 "Saves money and satisfies the guild, but farming households lose their written ground for appeal; grievance carries into the village question."
 ywc_regional.7200.wait_at_7200:0 "Let each ledger keep its own books for now"
 ywc_regional.7200.wait_at_7200.cost_tooltip:0 "No direct expense."
 ywc_regional.7200.wait_at_7200.consequence_tooltip:0 "The decision is postponed; duplicate claims remain on the books."
 ywc_regional.7200.withdraw_at_7200:0 "Drop this line; leave it to custom"
 ywc_regional.7200.withdraw_at_7200.cost_tooltip:0 "No direct expense."
 ywc_regional.7200.withdraw_at_7200.consequence_tooltip:0 "This line ends and custom continues; the guild line will still raise the same old accounts."
 ywc_regional.7201.t:0 "The Channel Cannot Dredge Itself"
 ywc_regional.7201.d:0 "The sandbar at the outlet has risen again since the rains. The trading house offers to dredge it all, in exchange for three years of exclusive tolls; the government's own crews want real money. The land registers are barely settled and the waterway's bill has arrived."
 ywc_regional.7201.public_dredge:0 "Government crews: dredge the whole run at public cost"
 ywc_regional.7201.public_dredge.cost_tooltip:0 "Dredging works: two weeks of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.7201.public_dredge.consequence_tooltip:0 "The channel clears with no attached privileges; the line settles after twelve months of execution."
 ywc_regional.7201.guild_contract:0 "Contract the trading house: cash saved, tolls conceded"
 ywc_regional.7201.guild_contract.cost_tooltip:0 "No direct expense; the trading house keeps the bar tolls for three years."
 ywc_regional.7201.guild_contract.consequence_tooltip:0 "The channel still clears, but the concession is entered in the record; this line settles as a limited result."
 ywc_regional.7201.narrow_self:0 "Narrow self-work: clear only the official channel"
 ywc_regional.7201.narrow_self.cost_tooltip:0 "Half-run works: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.7201.narrow_self.consequence_tooltip:0 "The merchant channel stays silted and the complaint carries into the next line; this line settles as a limited result."
 ywc_regional.7202.t:0 "Newcomers Ask the Guild Hall for Protection"
 ywc_regional.7202.d:0 "Another boatload of fellow townsfolk has drifted downriver: no land, no shop, only a letter of introduction at the guild gate. Whether to enter them, and whose people they become afterwards, is a question the guild cannot answer alone for the first time."
 ywc_regional.7202.guild_register:0 "Guild register: the hall underwrites them"
 ywc_regional.7202.guild_register.cost_tooltip:0 "Underwriting: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.7202.guild_register.consequence_tooltip:0 "Newcomers enter the guild register and the hall's reach grows, but local villages treat them as outsiders."
 ywc_regional.7202.public_register:0 "Office register: residency enters the public roll"
 ywc_regional.7202.public_register.cost_tooltip:0 "Clerk time comes from routine administration; no one-off expense."
 ywc_regional.7202.public_register.consequence_tooltip:0 "Once the public roll stands, villages and traders alike begin citing the same resident record."
 ywc_regional.7202.refuse_register:0 "Hold the register: send them to find their own footing"
 ywc_regional.7202.refuse_register.cost_tooltip:0 "No direct expense."
 ywc_regional.7202.refuse_register.consequence_tooltip:0 "The money stays, but unease at the docks accumulates."
 ywc_regional.7203.t:0 "The Villages Demand a Shared Bench"
 ywc_regional.7203.d:0 "The village elders arrive with a sheet pressed full of thumbprints: cases touching both communities cannot be decided by the guild's directors alone. What they want is not a verdict but a place where reasons can be heard."
 ywc_regional.7203.joint_bench:0 "Establish a joint bench: each side seats one assessor"
 ywc_regional.7203.joint_bench.cost_tooltip:0 "Standing court cost: one week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.7203.joint_bench.consequence_tooltip:0 "Mixed cases gain a shared bench; the guild's exclusive adjudication ends here."
 ywc_regional.7203.guild_with_appeal:0 "Keep guild adjudication; villages may appeal"
 ywc_regional.7203.guild_with_appeal.cost_tooltip:0 "No direct expense."
 ywc_regional.7203.guild_with_appeal.consequence_tooltip:0 "Adjudication stays put with an appeal step bolted on; whether the villages accept shows in later stages."
 ywc_regional.7203.separate_ways:0 "Keep separate ways: two sets of rules in parallel"
 ywc_regional.7203.separate_ways.cost_tooltip:0 "No direct expense."
 ywc_regional.7203.separate_ways.consequence_tooltip:0 "Divergent verdicts for similar cases will continue and enter the trade-record disputes."
 ywc_regional.7204.t:0 "The First Officials from the Two-Tongue School"
 ywc_regional.7204.d:0 "The school's first class has finished: guild children and village children studied in the same room and now wait for the same vacancies. The roll lies on the desk, but the rules for office are still the old ones."
 ywc_regional.7204.open_exams_both:0 "Hold exams in both tongues: pass either to serve"
 ywc_regional.7204.open_exams_both.cost_tooltip:0 "Examination costs in both tongues: half a week of opening income (deferred if the treasury cannot cover it)."
 ywc_regional.7204.open_exams_both.consequence_tooltip:0 "Vacancies henceforth open to students of either tongue; documents and court fees follow the new rule."
 ywc_regional.7204.guild_school_first:0 "Guild-school men first; village students wait in line"
 ywc_regional.7204.guild_school_first.cost_tooltip:0 "No direct expense."
 ywc_regional.7204.guild_school_first.consequence_tooltip:0 "The old order of appointment stands; the waiting list's grievance enters the final stage's record."
 ywc_regional.7204.defer_office:0 "Defer the rule; keep the roll"
 ywc_regional.7204.defer_office.cost_tooltip:0 "No direct expense."
 ywc_regional.7204.defer_office.consequence_tooltip:0 "The roll is held in abeyance and the appointment dispute passes intact to the final stage."
 ywc_regional.7205.t:0 "Who the Riversides' Polity Represents"
 ywc_regional.7205.d:0 "The land rolls, the court and the school accounts all lie open: this polity shelters more than the guild's umbrella now. Whether to write that widened duty into its charter is this generation's question to answer."
 ywc_regional.7205.charter_common_resident:0 "Charter it plainly: residents inside and outside the guild alike"
 ywc_regional.7205.charter_common_resident.cost_tooltip:0 "No one-off expense; the widened duty enters the standing budget."
 ywc_regional.7205.charter_common_resident.consequence_tooltip:0 "The common-resident charter runs for five years; later crises and diaspora lines read this record."
 ywc_regional.7205.guild_ledged_accountability:0 "The guild stays in charge, with open books"
 ywc_regional.7205.guild_ledged_accountability.cost_tooltip:0 "No one-off expense."
 ywc_regional.7205.guild_ledged_accountability.consequence_tooltip:0 "Authority remains with the guild, but inspection becomes routine; external standing stays under the guild's name."
 ywc_regional.7205.old_order_continues:0 "The old order continues; the charter gains nothing yet"
 ywc_regional.7205.old_order_continues.cost_tooltip:0 "No one-off expense."
 ywc_regional.7205.old_order_continues.consequence_tooltip:0 "Existing rulings and grievances stand as recorded, left for the next generation to raise again."
 ywc_regional.7205.withdraw_at_7205:0 "Withdraw the line; each roll keeps to itself"
 ywc_regional.7205.withdraw_at_7205.cost_tooltip:0 "No direct expense."
 ywc_regional.7205.withdraw_at_7205.consequence_tooltip:0 "Paid costs are not refunded; the common-standing question may be raised anew by later lines."
