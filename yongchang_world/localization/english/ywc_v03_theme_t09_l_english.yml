l_english:
 ywc_je_v03_t09_capital_terms:0 "Conditions Before Capital Arrives"
 ywc_je_v03_t09_capital_terms_reason:0 "Korea seeks funds for industry and roads, and Dongming's lenders may be approached. Before capital arrives, the accounts, the collateral and the repayment order must be settled; if they are not, a small self-funded plan remains."
 ywc_society.1400.t:0 "An Investable Ledger"
 ywc_society.1400.d:0 "The Dongming lender asks for books first. Korea may present settled prior accounts as credit or hand over only the current year's ledger; either way the books must survive an audit."
 ywc_society.1400.present_settled:0 "Present the settled prior accounts"
 ywc_society.1400.present_settled.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1400.present_settled.consequence_tooltip:0 "The settled military and school account records go to Dongming; the lender's review follows."
 ywc_society.1400.present_current:0 "Present the current year's ledger"
 ywc_society.1400.present_current.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1400.present_current.consequence_tooltip:0 "The current ledger goes to Dongming; without settled prior accounts, scrutiny will be stricter."
 ywc_society.1400.self_fund:0 "Fund a small plan at home instead"
 ywc_society.1400.self_fund.cost_tooltip:0 "No additional treasury expense; the scale is capped by existing funds."
 ywc_society.1400.self_fund.consequence_tooltip:0 "No loan from Dongming; a small self-funded plan goes straight to the project decision."
 ywc_society.1400.wait:0 "Wait and review again"
 ywc_society.1400.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1400.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1401.t:0 "The Lender's Review"
 ywc_society.1401.d:0 "Dongming's clerks audit the books Korea sent. With its own budget on record and the borrower's settled prior accounts, it may lend without collateral; otherwise it demands tax rights or declines."
 ywc_society.1401.approve_terms:0 "Approve the loan against tax rights"
 ywc_society.1401.approve_terms.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1401.approve_terms.consequence_tooltip:0 "The review passes with tax rights as collateral; the terms go to Korea."
 ywc_society.1401.approve_plain:0 "Approve the loan without collateral"
 ywc_society.1401.approve_plain.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1401.approve_plain.consequence_tooltip:0 "With its own budget records and the borrower's settled books, the loan proceeds unsecured."
 ywc_society.1401.refuse_review:0 "Fail the review and decline the loan"
 ywc_society.1401.refuse_review.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1401.refuse_review.consequence_tooltip:0 "The books do not support a loan; Dongming declines and Korea settles on its own ledger."
 ywc_society.1401.wait:0 "Wait before responding"
 ywc_society.1401.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1401.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1402.t:0 "Tax Rights as Collateral"
 ywc_society.1402.d:0 "Dongming's terms have arrived: tax rights as collateral, port customs alone, or unsecured acceptance. What is pledged is what is forfeited on default; refusing means returning to self-funding."
 ywc_society.1402.pledge_tax:0 "Pledge tax rights as collateral"
 ywc_society.1402.pledge_tax.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1402.pledge_tax.consequence_tooltip:0 "Tax rights stand as collateral pending the first disbursement; default forfeits them."
 ywc_society.1402.pledge_limited:0 "Pledge port customs only"
 ywc_society.1402.pledge_limited.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1402.pledge_limited.consequence_tooltip:0 "Port customs alone stand as collateral; the weaker pledge may halve the disbursement."
 ywc_society.1402.accept_unsecured:0 "Accept the unsecured terms"
 ywc_society.1402.accept_unsecured.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1402.accept_unsecured.consequence_tooltip:0 "The unsecured terms stand on the settled-books credit pending disbursement."
 ywc_society.1402.refuse_terms:0 "Refuse the terms and self-fund"
 ywc_society.1402.refuse_terms.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1402.refuse_terms.consequence_tooltip:0 "The outside collateral terms are refused and tax rights are kept; a small self-funded plan proceeds instead."
 ywc_society.1402.wait:0 "Wait and review again"
 ywc_society.1402.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1402.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1403.t:0 "The First Disbursement"
 ywc_society.1403.d:0 "Dongming's clerks size the first disbursement to the collateral: full with tax rights pledged, half otherwise. Short of funds or for other reasons, it may also withhold."
 ywc_society.1403.disburse_full:0 "Disburse the first installment in full"
 ywc_society.1403.disburse_full.cost_tooltip:0 "Dongming pays 800 from its treasury; Korea receives 800."
 ywc_society.1403.disburse_full.consequence_tooltip:0 "The first installment reaches Korea and both ledgers record it; the repayment date follows."
 ywc_society.1403.disburse_partial:0 "Disburse half the first installment"
 ywc_society.1403.disburse_partial.cost_tooltip:0 "Dongming pays 400 from its treasury; Korea receives 400."
 ywc_society.1403.disburse_partial.consequence_tooltip:0 "The halved installment reaches Korea; the project scale must shrink accordingly."
 ywc_society.1403.withhold_disburse:0 "Withhold the disbursement and hold the terms"
 ywc_society.1403.withhold_disburse.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1403.withhold_disburse.consequence_tooltip:0 "The collateral does not justify disbursement; Dongming withholds and Korea settles on its own ledger."
 ywc_society.1403.wait:0 "Wait before responding"
 ywc_society.1403.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1403.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1404.t:0 "The Due Date Meets a Lean Harvest"
 ywc_society.1404.d:0 "Repayment falls in a lean harvest and the market tightens. Korea may ask Dongming for an extension, pay the installment anyway, or record the arrears and prepare to shrink the project."
 ywc_society.1404.request_extension:0 "Ask Dongming for an extension"
 ywc_society.1404.request_extension.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1404.request_extension.consequence_tooltip:0 "The extension request and the arrears record go to Dongming; the creditor's budget decides."
 ywc_society.1404.pay_anyway:0 "Pay the installment on time anyway"
 ywc_society.1404.pay_anyway.cost_tooltip:0 "Korea pays 500 from its treasury; Dongming receives 500."
 ywc_society.1404.pay_anyway.consequence_tooltip:0 "The installment is paid on time and both ledgers record it; the project decision follows."
 ywc_society.1404.record_arrears:0 "Record the arrears honestly"
 ywc_society.1404.record_arrears.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1404.record_arrears.consequence_tooltip:0 "The arrears enter the ledger, the project is prepared for shrinking, and no funds move to Dongming."
 ywc_society.1404.wait:0 "Wait and review again"
 ywc_society.1404.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1404.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1405.t:0 "The Creditor Also Has a Budget"
 ywc_society.1405.d:0 "Dongming's own budget has its own shortfalls. With surplus it can absorb the extension's cost; without, it books a service fee; otherwise it holds to the original terms."
 ywc_society.1405.extend_absorb:0 "Grant the extension and absorb the cost"
 ywc_society.1405.extend_absorb.cost_tooltip:0 "Dongming pays 200; no transfer to Korea."
 ywc_society.1405.extend_absorb.consequence_tooltip:0 "The extension is granted at the creditor's own expense and both ledgers record it."
 ywc_society.1405.extend_fee:0 "Extend with a booked service fee"
 ywc_society.1405.extend_fee.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1405.extend_fee.consequence_tooltip:0 "The extension is granted with the fee booked and settled with the accounts."
 ywc_society.1405.refuse_extension:0 "Refuse the extension and hold the original terms"
 ywc_society.1405.refuse_extension.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1405.refuse_extension.consequence_tooltip:0 "The extension is refused; the original terms stand and Korea decides on the project itself."
 ywc_society.1405.wait:0 "Wait before responding"
 ywc_society.1405.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1405.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1406.t:0 "Extend or Shrink the Project"
 ywc_society.1406.d:0 "Korea decides on its own books: a granted extension lets the project continue; whatever the creditor answered, the project may shrink to what existing funds carry, or the arrangement may end. Each ledger records the decision independently."
 ywc_society.1406.extend_project:0 "Continue the project on extended terms"
 ywc_society.1406.extend_project.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1406.extend_project.consequence_tooltip:0 "The project continues on the granted extension pending the close."
 ywc_society.1406.shrink_project:0 "Shrink the project to a self-funded scale"
 ywc_society.1406.shrink_project.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1406.shrink_project.consequence_tooltip:0 "The project shrinks to what existing funds carry and the arrears record stands."
 ywc_society.1406.terminate_terms:0 "End the arrangement and settle the accounts"
 ywc_society.1406.terminate_terms.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1406.terminate_terms.consequence_tooltip:0 "The lending arrangement with Dongming ends; expenses already paid are not refunded."
 ywc_society.1406.wait:0 "Wait and review again"
 ywc_society.1406.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1406.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1407.t:0 "Institutions Beyond Repayment"
 ywc_society.1407.d:0 "The books must close. Settle on the joint record: full performance, a limited close, or refused credit. If Dongming is unavailable, Korea closes on the accounts it holds. Beyond repayment, the institutions—the bounds of collateral and the rules of reconciliation—remain on record."
 ywc_society.1407.close_accepted:0 "Close the ledger as full performance"
 ywc_society.1407.close_accepted.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1407.close_accepted.consequence_tooltip:0 "Full performance closes the ledger; Dongming gains 5 relations with Korea."
 ywc_society.1407.close_limited:0 "Close the ledger as a limited close"
 ywc_society.1407.close_limited.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1407.close_limited.consequence_tooltip:0 "A limited close settles the ledger on the self-funded plan or the unfinished loan."
 ywc_society.1407.close_refused:0 "Close the ledger as refused credit"
 ywc_society.1407.close_refused.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1407.close_refused.consequence_tooltip:0 "Refused credit closes the ledger; Dongming loses 5 relations with Korea."
 ywc_society.1407.close_alone:0 "Close locally because the creditor is unavailable"
 ywc_society.1407.close_alone.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1407.close_alone.consequence_tooltip:0 "The creditor is unavailable; Korea closes on the accounts it holds. Expenses already paid are not refunded."
 ywc_society.1407.wait:0 "Wait before closing"
 ywc_society.1407.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1407.wait.consequence_tooltip:0 "Records this decision."
