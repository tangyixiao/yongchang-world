l_english:
 ywc_je_v03_c03_caravan_routes_reality:0 "Which Road the Caravans Actually Take"
 ywc_je_v03_c03_caravan_routes_reality_reason:0 "Verify the usable routes and the real bottlenecks first: held territory and adjacency, the state of the relay stations, the duplicated gate tolls; then the proposing court sends the transit note, and the main transit country and the local authorizer each answer for themselves."
 ywc_je_v03_c03_relay_station_sponsors:0 "Who Pays for the Relay Stations"
 ywc_je_v03_c03_relay_station_sponsors_reason:0 "Road protection, relay stations and warehouses are all paid from the current treasury: each funding court picks one to begin with, and merchant advance or public office each keeps its own register; when herding trails clash with cart traffic or a pass closes, matters are settled by what has actually happened."
 ywc_je_v03_c03_transit_rights_next_season:0 "Transit Rights, Next Season"
 ywc_je_v03_c03_transit_rights_next_season_reason:0 "Review and settlement: the multilateral text is narrowed or carried forward, the tariff court gives its final answer, the actual signatories seal against what they truly paid; the guests the road brought are recorded against the country lines as they are, or the seasonal exchange continues."
 ywc_crisis.1200.t:0 "The Station That Vanished from the Map"
 ywc_crisis.1200.d:0 "The register still lists the relay station; on the road, half of it has fallen in. The proposing court checks held territory and adjacency stretch by stretch: which line still has intact stations, which gate collects its toll twice, which maintenance debt runs deepest. The comparison decides where the proposal starts."
 ywc_crisis.1200.survey_routes:0 "Verify territory and adjacency stretch by stretch and list the usable routes"
 ywc_crisis.1200.survey_routes.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1200.survey_routes.consequence_tooltip:0 "The usable routes and bottlenecks are registered; the audit of tolls and protection follows."
 ywc_crisis.1200.mark_bottleneck:0 "Mark the stretch with the deepest maintenance gap first"
 ywc_crisis.1200.mark_bottleneck.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1200.mark_bottleneck.consequence_tooltip:0 "The maintenance gap is filed separately and weighed first at the funding stage."
 ywc_crisis.1200.wait:0 "Wait and send surveyors out again"
 ywc_crisis.1200.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1200.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1201.t:0 "More Gate Passes than Pack Horses"
 ywc_crisis.1201.d:0 "One stretch collects three gate tolls while the road-guard money has not arrived for a year. After the audit of tolls, protection and local revenue, the proposing court decides what to fix first and sends the note to the transit parties and the tariff holder. If the other side has no valid party left, there is nothing to negotiate."
 ywc_crisis.1201.dispatch_notes:0 "Fix the order of priorities from the audit and dispatch the transit notes"
 ywc_crisis.1201.dispatch_notes.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1201.dispatch_notes.consequence_tooltip:0 "The main transit country and the local authorizer each receive their note and answer separately; the tariff court enters the funding stage."
 ywc_crisis.1201.audit_local_first:0 "Audit the oasis water and tax registers first, then dispatch the notes"
 ywc_crisis.1201.audit_local_first.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1201.audit_local_first.consequence_tooltip:0 "The local register is filed first, the notes go out after, and the answers remain under each party's own name."
 ywc_crisis.1201.no_counterparty:0 "The other side has no valid party; there is nothing to negotiate"
 ywc_crisis.1201.no_counterparty.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1201.no_counterparty.consequence_tooltip:0 "The case closes as no-talks and the capacity slot is released at once."
 ywc_crisis.1201.wait:0 "Wait and audit the tolls and road-guard accounts once more"
 ywc_crisis.1201.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1201.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1202.t:0 "The Note from Beyond the Pass"
 ywc_crisis.1202.d:0 "The main transit country's reply lies on the desk: passage is granted with a maintenance fee attached, or only a seasonal corridor opens, or the clauses go unanswered. Answering or not is recorded under the transit country's own name; the proposer cannot sign in its place."
 ywc_crisis.1202.accept_with_upkeep:0 "Grant passage with the maintenance-fee clause attached"
 ywc_crisis.1202.accept_with_upkeep.cost_tooltip:0 "No additional treasury expense; the upkeep duty is written into the clause."
 ywc_crisis.1202.accept_with_upkeep.consequence_tooltip:0 "The transit country signs and enters the funding stage; the maintenance fee is audited by actual payment there."
 ywc_crisis.1202.seasonal_passage:0 "Open only a limited seasonal passage"
 ywc_crisis.1202.seasonal_passage.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1202.seasonal_passage.consequence_tooltip:0 "The seasonal limit is registered; only the limited convention can be confirmed at settlement."
 ywc_crisis.1202.refuse_passage:0 "Refuse the note's clauses and keep the old usage"
 ywc_crisis.1202.refuse_passage.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1202.refuse_passage.consequence_tooltip:0 "The transit country stays out of the compact and decides its own course during the review window."
 ywc_crisis.1202.wait:0 "Wait before responding"
 ywc_crisis.1202.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1202.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1203.t:0 "The Banner Lord Nobody Invited"
 ywc_crisis.1203.d:0 "The banner lord on the plateau side was never seated, yet holds the corvee rights over the pass. Taking an arbitration seat, keeping the old corvee rights, or leaving the round altogether is the banner lord's own call; no one may consent in its place."
 ywc_crisis.1203.take_arbitration_seat:0 "Take the arbitration seat on own authority and join the talks"
 ywc_crisis.1203.take_arbitration_seat.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1203.take_arbitration_seat.consequence_tooltip:0 "The banner lord signs and enters the funding stage; the old corvee rights are kept in their own register."
 ywc_crisis.1203.keep_service_rights:0 "Join the compact but demand the corvee rights be kept"
 ywc_crisis.1203.keep_service_rights.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1203.keep_service_rights.consequence_tooltip:0 "The retained corvee clause is registered and audited at funding and settlement."
 ywc_crisis.1203.exit_round:0 "Leave the round and keep the old rules"
 ywc_crisis.1203.exit_round.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1203.exit_round.consequence_tooltip:0 "The case closes as withdrawn and the capacity slot is released; nothing already paid is chased."
 ywc_crisis.1203.wait:0 "Wait before responding"
 ywc_crisis.1203.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1203.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1204.t:0 "The Treasury Cannot Repair Every Mountain Road"
 ywc_crisis.1204.d:0 "Road protection, relay stations and warehouses all wait for money, and the treasury funds only one first. Each funding court checks its own strength and picks one; those who cannot pay trim down to maintaining a single line. No false accounts are entered and no permanent debt is left."
 ywc_crisis.1204.repair_roads_first:0 "Begin with road protection and pay 400 from the register"
 ywc_crisis.1204.repair_roads_first.cost_tooltip:0 "The holder's treasury pays 400."
 ywc_crisis.1204.repair_roads_first.consequence_tooltip:0 "Road protection begins; the payment is registered for the settlement audit."
 ywc_crisis.1204.build_stations_first:0 "Begin with the relay stations and pay 500 from the register"
 ywc_crisis.1204.build_stations_first.cost_tooltip:0 "The holder's treasury pays 500."
 ywc_crisis.1204.build_stations_first.consequence_tooltip:0 "The relay stations are built first; the payment is registered for the settlement audit."
 ywc_crisis.1204.build_warehouses_first:0 "Begin with the warehouses and pay 450 from the register"
 ywc_crisis.1204.build_warehouses_first.cost_tooltip:0 "The holder's treasury pays 450."
 ywc_crisis.1204.build_warehouses_first.consequence_tooltip:0 "The warehouses are repaired first; the payment is registered for the settlement audit."
 ywc_crisis.1204.reduce_scope:0 "The strength is short; trim down to maintaining one line"
 ywc_crisis.1204.reduce_scope.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1204.reduce_scope.consequence_tooltip:0 "The terms shrink to what is affordable; only the limited convention can be confirmed at settlement."
 ywc_crisis.1204.wait:0 "Wait and recheck the accounts"
 ywc_crisis.1204.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1204.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1205.t:0 "The Fine Print of the Caravan Contract"
 ywc_crisis.1205.d:0 "The merchant consortia will advance the repair money if the oversight right is written into the fine print; if the offices pay themselves, the public name is kept. Each form of contract keeps its own account, audited later against its own register, with the abuse of monopoly checked in a separate file."
 ywc_crisis.1205.merchant_consortium:0 "Let the consortium advance the money for the oversight right in the fine print"
 ywc_crisis.1205.merchant_consortium.cost_tooltip:0 "No additional treasury expense; the oversight right passes to the consortium."
 ywc_crisis.1205.merchant_consortium.consequence_tooltip:0 "The advanced-funding contract is registered; the monopoly abuse is checked against the register before the seal."
 ywc_crisis.1205.public_funding:0 "Pay from the state and keep the line public"
 ywc_crisis.1205.public_funding.cost_tooltip:0 "No separately itemized expense; upkeep money flows through the standing treasury channels."
 ywc_crisis.1205.public_funding.consequence_tooltip:0 "The public line keeps its name and the oversight follows the official register."
 ywc_crisis.1205.wait:0 "Wait and deliberate the fine print again"
 ywc_crisis.1205.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1205.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1206.t:0 "The Herding Trail Yielded to the Cart Road"
 ywc_crisis.1206.d:0 "The newly graded cart road cuts across the lambing-season herding trail, and the steppe party must give its local answer: compensate the seasonal migration, turn the caravans aside, or requisition the corridor outright. The price of requisition is that the upkeep promise loses its credit."
 ywc_crisis.1206.compensate_herders:0 "Compensate the seasonal migration and pay 400"
 ywc_crisis.1206.compensate_herders.cost_tooltip:0 "The holder's treasury pays 400."
 ywc_crisis.1206.compensate_herders.consequence_tooltip:0 "The migration keeps its season; relations with the proposer and the tariff court rise by 2, and the settlement wait begins."
 ywc_crisis.1206.redirect_caravans:0 "Turn the caravans aside from the lambing pastures"
 ywc_crisis.1206.redirect_caravans.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1206.redirect_caravans.consequence_tooltip:0 "The trail is kept and the longer caravan haul is written into the clause; the settlement wait begins."
 ywc_crisis.1206.expropriate_corridor:0 "Requisition the herding corridor outright"
 ywc_crisis.1206.expropriate_corridor.cost_tooltip:0 "No additional treasury expense; the local resentment is borne as it falls."
 ywc_crisis.1206.expropriate_corridor.consequence_tooltip:0 "The upkeep promise is recorded as broken and relations with the proposer and the tariff court drop by 5; the seal records the failure as it is."
 ywc_crisis.1206.wait:0 "Wait before deciding"
 ywc_crisis.1206.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1206.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1207.t:0 "After the Pass Closed"
 ywc_crisis.1207.d:0 "War, a change of control and years of missed upkeep have finally closed the pass. The party cut off must choose a substitute road: reroute at its own cost, file the maintenance gap as a claim, or accept the seasonal closure and take the old track. No road is gifted without a price."
 ywc_crisis.1207.reroute_alternative:0 "Reroute at own cost and pay 500"
 ywc_crisis.1207.reroute_alternative.cost_tooltip:0 "The holder's treasury pays 500."
 ywc_crisis.1207.reroute_alternative.consequence_tooltip:0 "The substitute road is paid and registered; no separate claim is filed."
 ywc_crisis.1207.claim_upkeep_debt:0 "File the maintenance gap as a claim and keep it on record"
 ywc_crisis.1207.claim_upkeep_debt.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1207.claim_upkeep_debt.consequence_tooltip:0 "The claim is registered and weighed at review and seal; it is not paid automatically."
 ywc_crisis.1207.accept_seasonal_close:0 "Accept the seasonal closure and take the old track"
 ywc_crisis.1207.accept_seasonal_close.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1207.accept_seasonal_close.consequence_tooltip:0 "The old track carries the trade, with the volume limited by the season."
 ywc_crisis.1207.wait:0 "Wait and scout the pass once more"
 ywc_crisis.1207.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1207.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1208.t:0 "Subtract the Most Expensive Stretch"
 ywc_crisis.1208.d:0 "The notes have come back but the accounts do not close: one signatory has lost contact, one stretch costs more than it can be repaired for. The proposing court carries the original text forward, narrows the multilateral convention into an executable adjacent bilateral arrangement, or abandons the convention and lets the old usage stand."
 ywc_crisis.1208.keep_multilateral:0 "The signatories all stand; carry the original text forward"
 ywc_crisis.1208.keep_multilateral.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1208.keep_multilateral.consequence_tooltip:0 "The multilateral text enters the final answer and the sealing stage."
 ywc_crisis.1208.narrow_bilateral:0 "Narrow it to the adjacent bilateral arrangement"
 ywc_crisis.1208.narrow_bilateral.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1208.narrow_bilateral.consequence_tooltip:0 "The narrowed clause is registered; signatories without adjacency do not receive the full terms."
 ywc_crisis.1208.drop_convention:0 "Abandon the convention and let the old usage stand"
 ywc_crisis.1208.drop_convention.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1208.drop_convention.consequence_tooltip:0 "The proposer closes as withdrawn and releases the slot; the remaining parties each decide their own course."
 ywc_crisis.1208.wait:0 "Wait and reconcile the accounts once more"
 ywc_crisis.1208.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1208.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1209.t:0 "The Local Gate's Last Collection"
 ywc_crisis.1209.d:0 "The unified tariff lies before the tariff court: authorize a capped levy, buy out the old gate rights, or refuse the unification and keep the local usage. The fiscal and the recognition consequences are kept in separate registers, and a refusal carries none of the full compact's duty."
 ywc_crisis.1209.authorize_quota_levy:0 "Authorize the capped levy and collect one share in ten by the register"
 ywc_crisis.1209.authorize_quota_levy.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1209.authorize_quota_levy.consequence_tooltip:0 "The capped levy is registered, relations with the proposer rise by 2, and the sealing stage opens."
 ywc_crisis.1209.buyout_old_rights:0 "Buy out the old gate rights and pay 600"
 ywc_crisis.1209.buyout_old_rights.cost_tooltip:0 "The holder's treasury pays 600."
 ywc_crisis.1209.buyout_old_rights.consequence_tooltip:0 "The buyout is registered and the gate unified; the sealing stage opens."
 ywc_crisis.1209.refuse_unified_tariff:0 "Refuse the unified tariff and keep the local usage"
 ywc_crisis.1209.refuse_unified_tariff.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1209.refuse_unified_tariff.consequence_tooltip:0 "The fiscal usage is kept and recognition narrows; relations with the proposer drop by 3, and only the limited convention can be confirmed at the seal."
 ywc_crisis.1209.wait:0 "Wait before responding"
 ywc_crisis.1209.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1209.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1210.t:0 "The Seal on the Caravan Convention"
 ywc_crisis.1210.d:0 "The day of the seal arrives: the actual payments, the working roads and the list of signatories are all on the register. Those with everything seal the full compact; those missing one seal the limited form; those whose clauses fell through record the failure as it is. The unsigned carry none of this compact's duty."
 ywc_crisis.1210.stamp_full_compact:0 "Seal the full compact against the register"
 ywc_crisis.1210.stamp_full_compact.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1210.stamp_full_compact.consequence_tooltip:0 "The full compact is registered with the payments and working roads checked against the register."
 ywc_crisis.1210.stamp_limited_compact:0 "Seal the limited compact with the missing items attached"
 ywc_crisis.1210.stamp_limited_compact.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1210.stamp_limited_compact.consequence_tooltip:0 "The limited compact is registered and the missing items are attached as they are."
 ywc_crisis.1210.record_failed_clauses:0 "Admit the clauses fell through and record the failure as it is"
 ywc_crisis.1210.record_failed_clauses.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1210.record_failed_clauses.consequence_tooltip:0 "The failed clauses are recorded as they are; payments already made stay on file and no war follows from it."
 ywc_crisis.1210.keep_status_quo:0 "Leave the seal unset and keep the status quo"
 ywc_crisis.1210.keep_status_quo.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1210.keep_status_quo.consequence_tooltip:0 "The case closes as status quo and the capacity slot is released."
 ywc_crisis.1210.wait:0 "Wait before sealing"
 ywc_crisis.1210.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1210.wait.consequence_tooltip:0 "Records this decision."
 ywc_crisis.1211.t:0 "New Guests the Road Brought"
 ywc_crisis.1211.d:0 "With the road open the guests arrive: some settle and are entered through the country line, some are only the seasonal coming and going of caravans. Actual settlement is recorded against the talent country line as it is; where none formed, the seasonal exchange continues and no household rolls are inflated."
 ywc_crisis.1211.record_real_entry:0 "Enter the actual settlement through the country line"
 ywc_crisis.1211.record_real_entry.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1211.record_real_entry.consequence_tooltip:0 "The settlement is entered against the own talent country line's actual result; no quota is inflated."
 ywc_crisis.1211.keep_seasonal_exchange:0 "No settlement formed; keep the seasonal exchange"
 ywc_crisis.1211.keep_seasonal_exchange.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1211.keep_seasonal_exchange.consequence_tooltip:0 "The caravans come and go by the season and the household rolls grow by not one false entry."
 ywc_crisis.1211.wait:0 "Wait before entering the record"
 ywc_crisis.1211.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_crisis.1211.wait.consequence_tooltip:0 "Records this decision."
