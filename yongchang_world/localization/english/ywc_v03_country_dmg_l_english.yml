l_english:
 ywc_je_v03_dmg_public_qualification:0 "Eligibility on One State Letter"
 ywc_je_v03_dmg_public_qualification_reason:0 "Six months is the minimum continuous period with eligibility, staffed posts and local execution all in place. If conditions are short, wait and address them; the shared delivery queue is not a failure. The twelve-month notice appears only for a real route-specific shortfall; month thirty-six offers limited settlement or withdrawal. The shared 90-day cooldown means the ten sequential main events take at least about 27 months after the first event."
 ywc_je_v03_dmg_compact_review:0 "Did Shared Duties Hold"
 ywc_je_v03_dmg_compact_review_reason:0 "A continuous nine-month review checks current eligibility, staffed posts, local appeals, and fiscal or territorial facts. Under elections it checks profession voting power and citizenship voting rights; a non-electoral monarchy must show an actual public office and joint-appointment charter, without invented seats."
 ywc_dmg.1000.t:0 "Three Names on the Muster Roll"
 ywc_dmg.1000.d:0 "The roll lists Ming-descended service households, merchant families and local defenders. Shared taxes and service do not grant the same access to office, military work or appeals. Without an active army, review office rolls; if a group is absent, examine current newcomers."
 ywc_dmg.1000.common_qualification:0 "Set common public qualifications"
 ywc_dmg.1000.common_qualification.cost_tooltip:0 "One estimated week of gross income, minimum 100, funds registry and appeals."
 ywc_dmg.1000.common_qualification.consequence_tooltip:0 "Does not change law, primary culture or government; appointments need real jobs."
 ywc_dmg.1000.territorial_compact:0 "Joint tax offices and local appeals"
 ywc_dmg.1000.territorial_compact.cost_tooltip:0 "Same registry estimate; local verification continues."
 ywc_dmg.1000.territorial_compact.consequence_tooltip:0 "Cross-region officeholding and migration remain subject to negotiation."
 ywc_dmg.1000.status_orders:0 "Keep status rolls and publish limits"
 ywc_dmg.1000.status_orders.cost_tooltip:0 "Registry plus a separate one-week estimate for divided administration."
 ywc_dmg.1000.status_orders.consequence_tooltip:0 "Old allies keep their status; newcomers need separate appeals."
 ywc_dmg.1000.defer:0 "Defer until the treasury can support a route"
 ywc_dmg.1000.defer.cost_tooltip:0 "No registry fee now; choose again later."
 ywc_dmg.1000.defer.consequence_tooltip:0 "The agenda remains open without a route commitment."
 ywc_dmg.1000.withdraw:0 "Withdraw from this agenda"
 ywc_dmg.1000.withdraw.cost_tooltip:0 "No further payment."
 ywc_dmg.1000.withdraw.consequence_tooltip:0 "Exit as breach and release the agenda slot; prior payments remain."
 ywc_dmg.1001.t:0 "Taxes Paid, Seal Withheld"
 ywc_dmg.1001.d:0 "Tax and service records are not appointments. Check current citizenship law, actual acceptance among non-primary pops, and administration or barracks staffing separately; separate checks do not prove the same group holds the jobs."
 ywc_dmg.1001.first:0 "Pursue ordinary legislation; do not enact it for free"
 ywc_dmg.1001.first.cost_tooltip:0 "No free legal change; administration remains budgeted."
 ywc_dmg.1001.first.consequence_tooltip:0 "Ordinary lawmaking still uses normal game rules."
 ywc_dmg.1001.second:0 "Appoint local agents under current law"
 ywc_dmg.1001.second.cost_tooltip:0 "No officials are created for free."
 ywc_dmg.1001.second.consequence_tooltip:0 "Local agents require real jobs; they are not national equality."
 ywc_dmg.1001.third:0 "Keep old qualifications and permit review"
 ywc_dmg.1001.third.cost_tooltip:0 "No payment is refunded."
 ywc_dmg.1001.third.consequence_tooltip:0 "Does not change property or employment automatically."
 ywc_dmg.1002.t:0 "The Service Households' Petition"
 ywc_dmg.1002.d:0 "Old military obligations meet newcomers' claims to compete. Transition grants, open competition and reserved posts are distinct choices; the grant uses the opening income estimate and is paid once."
 ywc_dmg.1002.pay_training:0 "Pay a one-time transition grant and open competition"
 ywc_dmg.1002.pay_training.cost_tooltip:0 "One weekly opening-income estimate, minimum 100; paid once."
 ywc_dmg.1002.pay_training.consequence_tooltip:0 "Grant cushions transition but does not fill the army."
 ywc_dmg.1002.open_competition:0 "Allow those eligible under current law to compete"
 ywc_dmg.1002.open_competition.cost_tooltip:0 "No grant; budget remains binding."
 ywc_dmg.1002.open_competition.consequence_tooltip:0 "Pay, training and vacancies remain real budget matters."
 ywc_dmg.1002.reserved_posts:0 "Reserve some old posts with a review date"
 ywc_dmg.1002.reserved_posts.cost_tooltip:0 "No transition grant; administration still costs."
 ywc_dmg.1002.reserved_posts.consequence_tooltip:0 "Keeps old duties but does not establish common access."
 ywc_dmg.1003.t:0 "A Village Is More Than One Signature"
 ywc_dmg.1003.d:0 "Choose one appeal institution: each costs a further estimated week of gross income (minimum 100) and changes legitimacy, authority or bureaucracy for 24 months. The later local execution review checks an actually employed secondary-culture worker, staffed and supplied administration, the inheritance rule, the public-language rule and this institution. A crown may use joint hearings without election law."
 ywc_dmg.1003.joint_hearing:0 "Fund a mixed hearing and appeal roll"
 ywc_dmg.1003.joint_hearing.cost_tooltip:0 "One additional week of gross income (yearly gross income / 52), minimum 100."
 ywc_dmg.1003.joint_hearing.consequence_tooltip:0 "Consultative hearing; costs bureaucracy while it improves legitimacy."
 ywc_dmg.1003.noble_guarantee:0 "Use a noble guarantee with narrow jurisdiction"
 ywc_dmg.1003.noble_guarantee.cost_tooltip:0 "One additional week of gross income (yearly gross income / 52), minimum 100."
 ywc_dmg.1003.noble_guarantee.consequence_tooltip:0 "Protects local rights, but costs authority while raising legitimacy."
 ywc_dmg.1003.royal_order:0 "Issue a royal order and accept local resistance"
 ywc_dmg.1003.royal_order.cost_tooltip:0 "One additional week of gross income (yearly gross income / 52), minimum 100."
 ywc_dmg.1003.royal_order.consequence_tooltip:0 "Expands administrative reach while reducing legitimacy."
 ywc_dmg.1003.defer:0 "Defer implementation until funds are available"
 ywc_dmg.1003.defer.cost_tooltip:0 "No payment; choose again later."
 ywc_dmg.1003.defer.consequence_tooltip:0 "The local arrangement remains pending."
 ywc_dmg.1003.withdraw:0 "Withdraw from this agenda"
 ywc_dmg.1003.withdraw.cost_tooltip:0 "No further payment."
 ywc_dmg.1003.withdraw.consequence_tooltip:0 "Exit as breach and release the agenda slot; prior payments remain."
 ywc_dmg.1004.t:0 "Two Heirs With the Same Name"
 ywc_dmg.1004.d:0 "One inheritance case cannot speak for all households. Choose one office rule, district-by-district recognition, or retain precedent with review; none rewrites all property rights. If the relevant group is absent, review newcomers' cross-district appeals."
 ywc_dmg.1004.first:0 "Use one office-eligibility rule; review property separately"
 ywc_dmg.1004.first.cost_tooltip:0 "No land compensation is paid."
 ywc_dmg.1004.first.consequence_tooltip:0 "Unifies appointment rules without rewriting property rights."
 ywc_dmg.1004.second:0 "Keep district rules and cross-district appeals"
 ywc_dmg.1004.second.cost_tooltip:0 "Districts bear review work."
 ywc_dmg.1004.second.consequence_tooltip:0 "Migrants may face repeated local procedures."
 ywc_dmg.1004.third:0 "Retain precedent with review for rejected claims"
 ywc_dmg.1004.third.cost_tooltip:0 "Existing offices carry the review."
 ywc_dmg.1004.third.consequence_tooltip:0 "Excluded people do not receive jobs by precedent alone."
 ywc_dmg.1005.t:0 "Who Reads the Tax Order After the Rite"
 ywc_dmg.1005.d:0 "Ritual, public language and tax appeals intersect. Shared readings, parallel rites or one court ritual all require real offices to provide interpretation."
 ywc_dmg.1005.first:0 "Read orders jointly and register translation needs"
 ywc_dmg.1005.first.cost_tooltip:0 "No officials are created; real offices staff translation."
 ywc_dmg.1005.first.consequence_tooltip:0 "Translation remains the offices' work."
 ywc_dmg.1005.second:0 "Allow parallel rites and local explanations"
 ywc_dmg.1005.second.cost_tooltip:0 "Districts retain interpretation duties."
 ywc_dmg.1005.second.consequence_tooltip:0 "Retains multiple practices and cross-district costs."
 ywc_dmg.1005.third:0 "Keep one court rite and explain each order"
 ywc_dmg.1005.third.cost_tooltip:0 "Offices explain orders individually."
 ywc_dmg.1005.third.consequence_tooltip:0 "Central rites do not grant newcomers office access."
 ywc_dmg.1006.t:0 "The First Joint Appointment"
 ywc_dmg.1006.d:0 "The minimum six-month continuous readiness period has elapsed. Common eligibility requires full acceptance (tier 5) and the same non-primary group actually employed as bureaucrats or military staff in a staffed, supplied administration or barrack; acceptance and jobs are linked in one pop scope. The local route separately requires an actually employed secondary-culture pop at a staffed administration. Queued results wait for the next 90-day event window and are not failure. A twelve-month notice requires a real route gap; month thirty-six offers limited settlement or withdrawal."
 ywc_dmg.1006.common_qualification:0 "Confirm qualification under current law"
 ywc_dmg.1006.common_qualification.cost_tooltip:0 "Pay ongoing wages from the real budget."
 ywc_dmg.1006.common_qualification.consequence_tooltip:0 "Common status needs separate acceptance, legal and staffing checks."
 ywc_dmg.1006.territorial_compact:0 "Confirm local countersignature and appeals"
 ywc_dmg.1006.territorial_compact.cost_tooltip:0 "Local review duties continue."
 ywc_dmg.1006.territorial_compact.consequence_tooltip:0 "Requires actual local execution and usable appeal."
 ywc_dmg.1006.status_orders:0 "Confirm status orders and state newcomer limits"
 ywc_dmg.1006.status_orders.cost_tooltip:0 "Opening fee was already paid once."
 ywc_dmg.1006.status_orders.consequence_tooltip:0 "Acknowledges limits and retains newcomer review."
 ywc_dmg.1007.t:0 "Two Orders Reach the Border Village"
 ywc_dmg.1007.d:0 "A local compact is an execution claim, not a signed plan. One of three matched bundles of appeal institution, inheritance precedent, public language and country capacity can authorize the corresponding staffed-office order. The fourth option records an execution gap; it never claims local implementation."
 ywc_dmg.1007.first:0 "Assign one office to issue orders"
 ywc_dmg.1007.first.cost_tooltip:0 "Existing jobs carry the work; no troops are created."
 ywc_dmg.1007.first.consequence_tooltip:0 "If the border is gone, this becomes domestic jurisdiction."
 ywc_dmg.1007.second:0 "Require local countersignature"
 ywc_dmg.1007.second.cost_tooltip:0 "Local verification continues."
 ywc_dmg.1007.second.consequence_tooltip:0 "Keeps duplicated jurisdictions and their paperwork."
 ywc_dmg.1007.third:0 "Keep dual orders but limit jurisdiction"
 ywc_dmg.1007.third.cost_tooltip:0 "No standing military cost is added."
 ywc_dmg.1007.third.consequence_tooltip:0 "Retains divided authority for later renegotiation."
 ywc_dmg.1007.record_gap:0 "Record the execution gap and keep a limited arrangement"
 ywc_dmg.1007.record_gap.cost_tooltip:0 "No additional rollout charge."
 ywc_dmg.1007.record_gap.consequence_tooltip:0 "Records missing posts or political capacity without claiming implementation."
 ywc_dmg.1008.t:0 "Why Is the Seat Empty"
 ywc_dmg.1008.d:0 "The nine-month review is due. Each non-withdrawal audit applies a 24-month consequence based on the chosen inheritance and public-language rules. Twelve-month notices still require a real route gap; event queues do not count. At month thirty-six, limited settlement or withdrawal remains available."
 ywc_dmg.1008.first:0 "Repair qualifications and appeal access"
 ywc_dmg.1008.first.cost_tooltip:0 "New laws/jobs carry their actual costs."
 ywc_dmg.1008.first.consequence_tooltip:0 "Acceptance, vacancies and budget shortfalls are separate facts."
 ywc_dmg.1008.second:0 "Recognize local exceptions and publish review rights"
 ywc_dmg.1008.second.cost_tooltip:0 "Ongoing review has a cost."
 ywc_dmg.1008.second.consequence_tooltip:0 "Works with or without elections."
 ywc_dmg.1008.third:0 "Withdraw the common promise and accept breach"
 ywc_dmg.1008.third.cost_tooltip:0 "Stops future extra costs; past payments remain spent."
 ywc_dmg.1008.third.consequence_tooltip:0 "Past commitments and political distance remain."
 ywc_dmg.1009.t:0 "Common Subjects, Shared Obligations"
 ywc_dmg.1009.d:0 "Success choices appear only when their current legal, group-employment, building, administrative and payment conditions hold. Limited settlement and withdrawal remain available in every case. Withdrawal closes as breach immediately, preserves payments, and cannot be overwritten."
 ywc_dmg.1009.common_qualification:0 "Confirm common eligibility"
 ywc_dmg.1009.common_qualification.cost_tooltip:0 "No free law or culture effects."
 ywc_dmg.1009.common_qualification.consequence_tooltip:0 "Limited result is recorded if real conditions are short."
 ywc_dmg.1009.territorial_compact:0 "Confirm territorial compact"
 ywc_dmg.1009.territorial_compact.cost_tooltip:0 "Past costs remain paid; local duties continue."
 ywc_dmg.1009.territorial_compact.consequence_tooltip:0 "Does not claim universal equality."
 ywc_dmg.1009.status_orders:0 "Confirm status orders"
 ywc_dmg.1009.status_orders.cost_tooltip:0 "No duplicate charge; prior payments remain."
 ywc_dmg.1009.status_orders.consequence_tooltip:0 "Conservative continuity remains open to later reform."
 ywc_dmg.1009.continue_repair:0 "Continue repairs and observe again"
 ywc_dmg.1009.continue_repair.cost_tooltip:0 "No new payment."
 ywc_dmg.1009.continue_repair.consequence_tooltip:0 "Continue repairs; once selected-route conditions return, a fresh nine-month observation begins."
 ywc_dmg.1009.limited_settlement:0 "Record limited eligibility and vacancies"
 ywc_dmg.1009.limited_settlement.cost_tooltip:0 "No further charge; prior registry, rollout and status-order payments remain spent."
 ywc_dmg.1009.limited_settlement.consequence_tooltip:0 "When jobs, acceptance or local execution fall short, this records a limited arrangement only."
 ywc_dmg.1009.withdraw_breach:0 "Withdraw and accept breach"
 ywc_dmg.1009.withdraw_breach.cost_tooltip:0 "No further charge; prior payments are not refunded."
 ywc_dmg.1009.withdraw_breach.consequence_tooltip:0 "Closes directly as breach; paid flags remain and no later choice can overwrite it."
