l_english:
 ywc_je_v03_dmg_public_qualification:0 "Eligibility on One State Letter"
 ywc_je_v03_dmg_public_qualification_reason:0 "Six months is the minimum continuous period with eligibility, staffed posts and local execution all in place. If conditions are short, wait and address them; the shared delivery queue is not a failure. The twelve-month notice appears only for a real route-specific shortfall; month thirty-six offers limited settlement or withdrawal. The shared 90-day cooldown means the ten sequential main events take at least about 27 months after the first event."
 ywc_je_v03_dmg_compact_review:0 "Did Shared Duties Hold"
 ywc_je_v03_dmg_compact_review_reason:0 "A continuous nine-month review checks current eligibility, staffed posts, local appeals, and fiscal or territorial facts. Under elections it checks profession voting power and citizenship voting rights; a non-electoral monarchy must show an actual public office and joint-appointment charter, without invented seats."
 ywc_dmg.1000.t:0 "Three Names on the Muster Roll"
 ywc_dmg.1000.d:0 "The roll lists Ming-descended service households, merchant families and local defenders. Shared taxes and service do not grant the same access to office, military work or appeals. Without an active army, review office rolls; if a group is absent, examine current newcomers."
 ywc_dmg.1000.common_qualification:0 "Set common public qualifications"
 ywc_dmg.1000.common_qualification.cost_tooltip:0 "One estimated week of gross income, minimum 100, funds registry and appeals."
 ywc_dmg.1000.common_qualification.consequence_tooltip:0 "Does not change law, primary culture or government; appointments need real jobs."
 ywc_dmg.1000.territorial_compact:0 "Joint tax offices and local appeals"
 ywc_dmg.1000.territorial_compact.cost_tooltip:0 "Same registry estimate; local verification continues."
 ywc_dmg.1000.territorial_compact.consequence_tooltip:0 "Cross-region officeholding and migration remain subject to negotiation."
 ywc_dmg.1000.status_orders:0 "Keep status rolls and publish limits"
 ywc_dmg.1000.status_orders.cost_tooltip:0 "Registry plus a separate one-week estimate for divided administration."
 ywc_dmg.1000.status_orders.consequence_tooltip:0 "Old allies keep their status; newcomers need separate appeals."
 ywc_dmg.1000.defer:0 "Defer until the treasury can support a route"
 ywc_dmg.1000.defer.cost_tooltip:0 "No registry fee now; choose again later."
 ywc_dmg.1000.defer.consequence_tooltip:0 "The agenda remains open without a route commitment."
 ywc_dmg.1000.withdraw:0 "Withdraw from this agenda"
 ywc_dmg.1000.withdraw.cost_tooltip:0 "No further payment."
 ywc_dmg.1000.withdraw.consequence_tooltip:0 "Exit as breach and release the agenda slot; prior payments remain."
 ywc_dmg.1001.t:0 "Taxes Paid, Seal Withheld"
 ywc_dmg.1001.d:0 "Tax and service records are not appointments. Check current citizenship law, actual acceptance among non-primary pops, and administration or barracks staffing separately; separate checks do not prove the same group holds the jobs."
 ywc_dmg.1001.first:0 "Pursue ordinary legislation; do not enact it for free"
 ywc_dmg.1001.first.cost_tooltip:0 "No free legal change; administration remains budgeted."
 ywc_dmg.1001.first.consequence_tooltip:0 "Ordinary lawmaking still uses normal game rules."
 ywc_dmg.1001.second:0 "Appoint local agents under current law"
 ywc_dmg.1001.second.cost_tooltip:0 "No officials are created for free."
 ywc_dmg.1001.second.consequence_tooltip:0 "Local agents require real jobs; they are not national equality."
 ywc_dmg.1001.third:0 "Keep old qualifications and permit review"
 ywc_dmg.1001.third.cost_tooltip:0 "No payment is refunded."
 ywc_dmg.1001.third.consequence_tooltip:0 "Does not change property or employment automatically."
 ywc_dmg.1002.t:0 "The Service Households' Petition"
 ywc_dmg.1002.d:0 "Old military obligations meet newcomers' claims to compete. Transition grants, open competition and reserved posts are distinct choices; the grant uses the opening income estimate and is paid once."
 ywc_dmg.1002.pay_training:0 "Pay a one-time transition grant and open competition"
 ywc_dmg.1002.pay_training.cost_tooltip:0 "One weekly opening-income estimate, minimum 100; paid once."
 ywc_dmg.1002.pay_training.consequence_tooltip:0 "Grant cushions transition but does not fill the army."
 ywc_dmg.1002.open_competition:0 "Allow those eligible under current law to compete"
 ywc_dmg.1002.open_competition.cost_tooltip:0 "No grant; budget remains binding."
 ywc_dmg.1002.open_competition.consequence_tooltip:0 "Pay, training and vacancies remain real budget matters."
 ywc_dmg.1002.reserved_posts:0 "Reserve some old posts with a review date"
 ywc_dmg.1002.reserved_posts.cost_tooltip:0 "No transition grant; administration still costs."
 ywc_dmg.1002.reserved_posts.consequence_tooltip:0 "Keeps old duties but does not establish common access."
 ywc_dmg.1003.t:0 "A Village Is More Than One Signature"
 ywc_dmg.1003.d:0 "Choose one appeal institution: each costs a further estimated week of gross income (minimum 100) and changes legitimacy, authority or bureaucracy for 24 months. The later local execution review checks an actually employed secondary-culture worker, staffed and supplied administration, the inheritance rule, the public-language rule and this institution. A crown may use joint hearings without election law."
 ywc_dmg.1003.joint_hearing:0 "Fund a mixed hearing and appeal roll"
 ywc_dmg.1003.joint_hearing.cost_tooltip:0 "One additional week of gross income (yearly gross income / 52), minimum 100."
 ywc_dmg.1003.joint_hearing.consequence_tooltip:0 "Consultative hearing; costs bureaucracy while it improves legitimacy."
 ywc_dmg.1003.noble_guarantee:0 "Use a noble guarantee with narrow jurisdiction"
 ywc_dmg.1003.noble_guarantee.cost_tooltip:0 "One additional week of gross income (yearly gross income / 52), minimum 100."
 ywc_dmg.1003.noble_guarantee.consequence_tooltip:0 "Protects local rights, but costs authority while raising legitimacy."
 ywc_dmg.1003.royal_order:0 "Issue a royal order and accept local resistance"
 ywc_dmg.1003.royal_order.cost_tooltip:0 "One additional week of gross income (yearly gross income / 52), minimum 100."
 ywc_dmg.1003.royal_order.consequence_tooltip:0 "Expands administrative reach while reducing legitimacy."
 ywc_dmg.1003.defer:0 "Defer implementation until funds are available"
 ywc_dmg.1003.defer.cost_tooltip:0 "No payment; choose again later."
 ywc_dmg.1003.defer.consequence_tooltip:0 "The local arrangement remains pending."
 ywc_dmg.1003.withdraw:0 "Withdraw from this agenda"
 ywc_dmg.1003.withdraw.cost_tooltip:0 "No further payment."
 ywc_dmg.1003.withdraw.consequence_tooltip:0 "Exit as breach and release the agenda slot; prior payments remain."
 ywc_dmg.1004.t:0 "Two Heirs With the Same Name"
 ywc_dmg.1004.d:0 "One inheritance case cannot speak for all households. Choose one office rule, district-by-district recognition, or retain precedent with review; none rewrites all property rights. If the relevant group is absent, review newcomers' cross-district appeals."
 ywc_dmg.1004.first:0 "Use one office-eligibility rule; review property separately"
 ywc_dmg.1004.first.cost_tooltip:0 "No land compensation is paid."
 ywc_dmg.1004.first.consequence_tooltip:0 "Unifies appointment rules without rewriting property rights."
 ywc_dmg.1004.second:0 "Keep district rules and cross-district appeals"
 ywc_dmg.1004.second.cost_tooltip:0 "Districts bear review work."
 ywc_dmg.1004.second.consequence_tooltip:0 "Migrants may face repeated local procedures."
 ywc_dmg.1004.third:0 "Retain precedent with review for rejected claims"
 ywc_dmg.1004.third.cost_tooltip:0 "Existing offices carry the review."
 ywc_dmg.1004.third.consequence_tooltip:0 "Excluded people do not receive jobs by precedent alone."
 ywc_dmg.1005.t:0 "Who Reads the Tax Order After the Rite"
 ywc_dmg.1005.d:0 "Ritual, public language and tax appeals intersect. Shared readings, parallel rites or one court ritual all require real offices to provide interpretation."
 ywc_dmg.1005.first:0 "Read orders jointly and register translation needs"
 ywc_dmg.1005.first.cost_tooltip:0 "No officials are created; real offices staff translation."
 ywc_dmg.1005.first.consequence_tooltip:0 "Translation remains the offices' work."
 ywc_dmg.1005.second:0 "Allow parallel rites and local explanations"
 ywc_dmg.1005.second.cost_tooltip:0 "Districts retain interpretation duties."
 ywc_dmg.1005.second.consequence_tooltip:0 "Retains multiple practices and cross-district costs."
 ywc_dmg.1005.third:0 "Keep one court rite and explain each order"
 ywc_dmg.1005.third.cost_tooltip:0 "Offices explain orders individually."
 ywc_dmg.1005.third.consequence_tooltip:0 "Central rites do not grant newcomers office access."
 ywc_dmg.1006.t:0 "The First Joint Appointment"
 ywc_dmg.1006.d:0 "The minimum six-month continuous readiness period has elapsed. Common eligibility requires full acceptance (tier 5) and the same non-primary group actually employed as bureaucrats or military staff in a staffed, supplied administration or barrack; acceptance and jobs are linked in one pop scope. The local route separately requires an actually employed secondary-culture pop at a staffed administration. Queued results wait for the next 90-day event window and are not failure. A twelve-month notice requires a real route gap; month thirty-six offers limited settlement or withdrawal."
 ywc_dmg.1006.common_qualification:0 "Confirm qualification under current law"
 ywc_dmg.1006.common_qualification.cost_tooltip:0 "Pay ongoing wages from the real budget."
 ywc_dmg.1006.common_qualification.consequence_tooltip:0 "Common status needs separate acceptance, legal and staffing checks."
 ywc_dmg.1006.territorial_compact:0 "Confirm local countersignature and appeals"
 ywc_dmg.1006.territorial_compact.cost_tooltip:0 "Local review duties continue."
 ywc_dmg.1006.territorial_compact.consequence_tooltip:0 "Requires actual local execution and usable appeal."
 ywc_dmg.1006.status_orders:0 "Confirm status orders and state newcomer limits"
 ywc_dmg.1006.status_orders.cost_tooltip:0 "Opening fee was already paid once."
 ywc_dmg.1006.status_orders.consequence_tooltip:0 "Acknowledges limits and retains newcomer review."
 ywc_dmg.1007.t:0 "Two Orders Reach the Border Village"
 ywc_dmg.1007.d:0 "A local compact is an execution claim, not a signed plan. One of three matched bundles of appeal institution, inheritance precedent, public language and country capacity can authorize the corresponding staffed-office order. The fourth option records an execution gap; it never claims local implementation."
 ywc_dmg.1007.first:0 "Assign one office to issue orders"
 ywc_dmg.1007.first.cost_tooltip:0 "Existing jobs carry the work; no troops are created."
 ywc_dmg.1007.first.consequence_tooltip:0 "If the border is gone, this becomes domestic jurisdiction."
 ywc_dmg.1007.second:0 "Require local countersignature"
 ywc_dmg.1007.second.cost_tooltip:0 "Local verification continues."
 ywc_dmg.1007.second.consequence_tooltip:0 "Keeps duplicated jurisdictions and their paperwork."
 ywc_dmg.1007.third:0 "Keep dual orders but limit jurisdiction"
 ywc_dmg.1007.third.cost_tooltip:0 "No standing military cost is added."
 ywc_dmg.1007.third.consequence_tooltip:0 "Retains divided authority for later renegotiation."
 ywc_dmg.1007.record_gap:0 "Record the execution gap and keep a limited arrangement"
 ywc_dmg.1007.record_gap.cost_tooltip:0 "No additional rollout charge."
 ywc_dmg.1007.record_gap.consequence_tooltip:0 "Records missing posts or political capacity without claiming implementation."
 ywc_dmg.1008.t:0 "Why Is the Seat Empty"
 ywc_dmg.1008.d:0 "The nine-month review is due. Each non-withdrawal audit applies a 24-month consequence based on the chosen inheritance and public-language rules. Twelve-month notices still require a real route gap; event queues do not count. At month thirty-six, limited settlement or withdrawal remains available."
 ywc_dmg.1008.first:0 "Repair qualifications and appeal access"
 ywc_dmg.1008.first.cost_tooltip:0 "New laws/jobs carry their actual costs."
 ywc_dmg.1008.first.consequence_tooltip:0 "Acceptance, vacancies and budget shortfalls are separate facts."
 ywc_dmg.1008.second:0 "Recognize local exceptions and publish review rights"
 ywc_dmg.1008.second.cost_tooltip:0 "Ongoing review has a cost."
 ywc_dmg.1008.second.consequence_tooltip:0 "Works with or without elections."
 ywc_dmg.1008.third:0 "Withdraw the common promise and accept breach"
 ywc_dmg.1008.third.cost_tooltip:0 "Stops future extra costs; past payments remain spent."
 ywc_dmg.1008.third.consequence_tooltip:0 "Past commitments and political distance remain."
 ywc_dmg.1009.t:0 "Common Subjects, Shared Obligations"
 ywc_dmg.1009.d:0 "Success choices appear only when their current legal, group-employment, building, administrative and payment conditions hold. Limited settlement and withdrawal remain available in every case. Withdrawal closes as breach immediately, preserves payments, and cannot be overwritten."
 ywc_dmg.1009.common_qualification:0 "Confirm common eligibility"
 ywc_dmg.1009.common_qualification.cost_tooltip:0 "No free law or culture effects."
 ywc_dmg.1009.common_qualification.consequence_tooltip:0 "Limited result is recorded if real conditions are short."
 ywc_dmg.1009.territorial_compact:0 "Confirm territorial compact"
 ywc_dmg.1009.territorial_compact.cost_tooltip:0 "Past costs remain paid; local duties continue."
 ywc_dmg.1009.territorial_compact.consequence_tooltip:0 "Does not claim universal equality."
 ywc_dmg.1009.status_orders:0 "Confirm status orders"
 ywc_dmg.1009.status_orders.cost_tooltip:0 "No duplicate charge; prior payments remain."
 ywc_dmg.1009.status_orders.consequence_tooltip:0 "Conservative continuity remains open to later reform."
 ywc_dmg.1009.continue_repair:0 "Continue repairs and observe again"
 ywc_dmg.1009.continue_repair.cost_tooltip:0 "No new payment."
 ywc_dmg.1009.continue_repair.consequence_tooltip:0 "Continue repairs; once selected-route conditions return, a fresh nine-month observation begins."
 ywc_dmg.1009.limited_settlement:0 "Record limited eligibility and vacancies"
 ywc_dmg.1009.limited_settlement.cost_tooltip:0 "No further charge; prior registry, rollout and status-order payments remain spent."
 ywc_dmg.1009.limited_settlement.consequence_tooltip:0 "When jobs, acceptance or local execution fall short, this records a limited arrangement only."
 ywc_dmg.1009.withdraw_breach:0 "Withdraw and accept breach"
 ywc_dmg.1009.withdraw_breach.cost_tooltip:0 "No further charge; prior payments are not refunded."
 ywc_dmg.1009.withdraw_breach.consequence_tooltip:0 "Closes directly as breach; paid flags remain and no later choice can overwrite it."
 ywc_je_v03_dmg_land_titles_review:0 "Survey, Compensation and Registration Review"
 ywc_je_v03_dmg_land_titles_review_reason:0 "Run a registration pilot in one really owned state: pay a registry fee of one week of estimated yearly gross income (yearly gross income / 52, minimum 100), choose one of three routes, and only then reach survey and compensation. Execution needs real agricultural employment and a staffed office plus affordable finances; six continuous months mature the review, and any interruption restarts it from zero. Month 12 offers only a cap or renegotiation, month 36 settles or exits. Fees paid and signed compensation debts are never erased, and ordinary peace can still complete the lane."
 ywc_dmg.1010.t:0 "The Service Household and the Village Each Hold a Contract"
 ywc_dmg.1010.d:0 "On the same field the service household holds an old duty contract and the village holds customary tillage records. The court must pick the evidence it will register: mixed arbitration seats villages in joint hearings, a unified contract verifies written deeds under the real land law and has the office take them up, and old-boundary delimitation keeps the old line and registers only undisputed parcels. Each route costs and demands differently, and a thin treasury may simply not advance."
 ywc_dmg.1010.mixed_arbitration:0 "Mixed arbitration (county joint hearings and village appeals)"
 ywc_dmg.1010.mixed_arbitration.cost_tooltip:0 "Charges one week of estimated yearly gross income (yearly gross income / 52), minimum 100. The route locks only after the deduction really lands."
 ywc_dmg.1010.mixed_arbitration.consequence_tooltip:0 "Service-duty contracts and village tillage custom are heard together and villages may send representatives; the survey stage opens only after the fee is really deducted."
 ywc_dmg.1010.unified_contract:0 "Unified contract (written verification taken up by the office)"
 ywc_dmg.1010.unified_contract.cost_tooltip:0 "Charges one week of estimated yearly gross income (yearly gross income / 52), minimum 100. The route locks only after the deduction really lands."
 ywc_dmg.1010.unified_contract.consequence_tooltip:0 "Registration runs on written contracts that the country's real land law allows, verified by the office in post; accepted cultivators and contract holders share one register."
 ywc_dmg.1010.old_boundary:0 "Old-boundary delimitation (keep the old line, narrow the pilot)"
 ywc_dmg.1010.old_boundary.cost_tooltip:0 "Charges one week of estimated yearly gross income (yearly gross income / 52), minimum 100. The route locks only after the deduction really lands."
 ywc_dmg.1010.old_boundary.consequence_tooltip:0 "The old boundary and old rolls stand and only undisputed parcels are registered, while the court still carries the cost of repeated surveying and ledger checking."
 ywc_dmg.1010.defer:0 "Defer registration (do not advance while the treasury is thin)"
 ywc_dmg.1010.defer.cost_tooltip:0 "No new charge."
 ywc_dmg.1010.defer.consequence_tooltip:0 "No route is chosen and the event may return in a later month; no registration fact is created."
 ywc_dmg.1010.withdraw_titles:0 "Withdraw the title lane (lawful exit)"
 ywc_dmg.1010.withdraw_titles.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1010.withdraw_titles.consequence_tooltip:0 "The lane ends in withdrawal; signed compensation debts, fees already paid and registration facts already recorded all remain."
 ywc_dmg.1011.t:0 "Which Ridge the Surveyor Walks"
 ywc_dmg.1011.d:0 "Someone must walk the line. Representatives with common eligibility may come along, contract holders may stand surety in writing, or the survey may only check the old rolls and old boundary. The three paths decide who may sign and how high the thresholds for a staffed office and agricultural employment sit. The more completely the earlier common-subjects arrangement held on acceptance and posts, the more representatives may walk along; where conditions fall short the pilot narrows or another route is taken."
 ywc_dmg.1011.joint_survey:0 "Joint survey (representatives with common eligibility walk along)"
 ywc_dmg.1011.joint_survey.cost_tooltip:0 "No new charge."
 ywc_dmg.1011.joint_survey.consequence_tooltip:0 "The right to sign extends to actual cultivators; when the earlier common-subjects arrangement really held on acceptance and posts, more representatives walk along and the result is harder to deny."
 ywc_dmg.1011.contract_holders:0 "Contract holders stand surety (written merchant guarantee)"
 ywc_dmg.1011.contract_holders.cost_tooltip:0 "No new charge."
 ywc_dmg.1011.contract_holders.consequence_tooltip:0 "Survey lines are guaranteed in writing by contract holders and accepted cultivators; the office checks documents instead of walking every parcel."
 ywc_dmg.1011.old_register:0 "Resurvey on the old register (check against the old boundary rolls)"
 ywc_dmg.1011.old_register.cost_tooltip:0 "No new charge."
 ywc_dmg.1011.old_register.consequence_tooltip:0 "The survey only checks the old rolls and old boundary; outside and disputed parcels stay unregistered, so the expense recurs while the pilot stays smallest."
 ywc_dmg.1011.defer:0 "Wait until representatives are really in place"
 ywc_dmg.1011.defer.cost_tooltip:0 "No new charge."
 ywc_dmg.1011.defer.consequence_tooltip:0 "This node stays open until the office or representative condition actually exists."
 ywc_dmg.1011.withdraw_titles:0 "Withdraw the title lane (lawful exit)"
 ywc_dmg.1011.withdraw_titles.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1011.withdraw_titles.consequence_tooltip:0 "The lane ends in withdrawal; paid money and signed debts remain."
 ywc_dmg.1012.t:0 "The Merchant's Mortgage"
 ywc_dmg.1012.d:0 "The contract-holding merchant wants the mortgage entered in the register with priority of claim. The court may record that order, hand verification to local sureties, or refuse the mortgage and narrow the pilot to undisputed parcels. Once the order of documented debts is recorded, who is paid first and how much cash it takes at the next node changes with it."
 ywc_dmg.1012.priority_recorded:0 "Record the mortgage's priority of claim"
 ywc_dmg.1012.priority_recorded.cost_tooltip:0 "No new deduction here; the verified claim is folded into the payment order, which raises the cash 1013 requires to one and a half weeks of yearly gross income (multiply 1.5)."
 ywc_dmg.1012.priority_recorded.consequence_tooltip:0 "The verification fee is not taken here but ranks first in the 1013 payment by documented order; without the larger cash reserve the payment cannot be made."
 ywc_dmg.1012.local_joint_guarantee:0 "Local joint guarantee (sureties carry the verification)"
 ywc_dmg.1012.local_joint_guarantee.cost_tooltip:0 "No new charge."
 ywc_dmg.1012.local_joint_guarantee.consequence_tooltip:0 "Local sureties carry the verification burden and the mortgage gains no priority, so the payee at 1013 is still decided by who the claimant actually is."
 ywc_dmg.1012.refuse_mortgage:0 "Refuse the mortgage and narrow the pilot"
 ywc_dmg.1012.refuse_mortgage.cost_tooltip:0 "No new charge."
 ywc_dmg.1012.refuse_mortgage.consequence_tooltip:0 "The pilot keeps only undisputed parcels and the merchant claim stays out of the register, narrowing compensation and registration together."
 ywc_dmg.1012.defer:0 "Verify first, pay later"
 ywc_dmg.1012.defer.cost_tooltip:0 "No new charge."
 ywc_dmg.1012.defer.consequence_tooltip:0 "The debt order is not recorded yet and this event may return in a later month."
 ywc_dmg.1012.withdraw_titles:0 "Withdraw the title lane (lawful exit)"
 ywc_dmg.1012.withdraw_titles.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1012.withdraw_titles.consequence_tooltip:0 "The lane ends in withdrawal; paid money and the merchant contract remain facts."
 ywc_dmg.1013.t:0 "Who Is Compensated First"
 ywc_dmg.1013.d:0 "Compensation is paid once: to the service household, to those actually tilling, or to the creditor named in the documents. A single payment deducts real money and re-checks both the treasury and bankruptcy; only a real deduction writes the payment and advances. Without the funds the node retries, switches to local instalments or an old-boundary limit, or the lane is lawfully withdrawn."
 ywc_dmg.1013.pay_documented_creditor:0 "Pay the creditor who stands in the documents first"
 ywc_dmg.1013.pay_documented_creditor.cost_tooltip:0 "Deducts one week of estimated yearly gross income (yearly gross income / 52), minimum 100. A charge already made is never repeated."
 ywc_dmg.1013.pay_documented_creditor.consequence_tooltip:0 "Only a real deduction writes the payment and advances; without the cash, or under bankruptcy, the node retries or the lane is lawfully withdrawn."
 ywc_dmg.1013.pay_actual_cultivator:0 "Pay the actual cultivators first"
 ywc_dmg.1013.pay_actual_cultivator.cost_tooltip:0 "Deducts one week of estimated yearly gross income (yearly gross income / 52), minimum 100. A charge already made is never repeated."
 ywc_dmg.1013.pay_actual_cultivator.consequence_tooltip:0 "Compensation goes straight to those actually tilling, and old service contracts drop to ordinary creditors; only a real deduction advances."
 ywc_dmg.1013.pay_service_household:0 "Pay the service household itself first"
 ywc_dmg.1013.pay_service_household.cost_tooltip:0 "Deducts one week of estimated yearly gross income (yearly gross income / 52), minimum 100. A charge already made is never repeated."
 ywc_dmg.1013.pay_service_household.consequence_tooltip:0 "Compensation follows the old service contract to the household first, leaving villagers and newcomers to a later round; only a real deduction advances."
 ywc_dmg.1013.local_instalments:0 "Switch to local instalments (no single payment)"
 ywc_dmg.1013.local_instalments.cost_tooltip:0 "No new charge."
 ywc_dmg.1013.local_instalments.consequence_tooltip:0 "Nothing is deducted here and compensation moves to local instalments; the outstanding debt stays on the books and the lane cannot close as paid."
 ywc_dmg.1013.old_boundary_limit:0 "Pay only along the old boundary and narrow the scope"
 ywc_dmg.1013.old_boundary_limit.cost_tooltip:0 "No new charge."
 ywc_dmg.1013.old_boundary_limit.consequence_tooltip:0 "Parcels outside the old boundary and disputed parcels are neither compensated nor registered; paid money is not refunded and unpaid debts stay on the books."
 ywc_dmg.1013.withdraw_titles:0 "Withdraw the title lane (lawful exit)"
 ywc_dmg.1013.withdraw_titles.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1013.withdraw_titles.consequence_tooltip:0 "The lane ends in withdrawal; paid money, compensation debts and registration facts all remain."
 ywc_dmg.1014.t:0 "Newcomers Ask to Be Entered"
 ywc_dmg.1014.d:0 "Newcomers want their tillage and mortgage ties entered on the register. Individual appeals may be heard household by household, villages may co-sign, or only old-register parcels may be added. Each path needs a real office in post, an existing representative or surety mechanism, or the old register itself. The event creates no migrant pops and a failed charge never advances."
 ywc_dmg.1014.individual_appeal:0 "Individual appeal by newcomers (verified household by household)"
 ywc_dmg.1014.individual_appeal.cost_tooltip:0 "No new charge."
 ywc_dmg.1014.individual_appeal.consequence_tooltip:0 "Appeals are handled household by household and need a real secondary office in post; the more completely the common-subjects arrangement held, the more appeals can be accepted."
 ywc_dmg.1014.village_cosignature:0 "Village co-signature (requires a representative mechanism)"
 ywc_dmg.1014.village_cosignature.cost_tooltip:0 "No new charge."
 ywc_dmg.1014.village_cosignature.consequence_tooltip:0 "Newcomers need a village co-signature, which exists only if the survey stage really produced representatives or local sureties."
 ywc_dmg.1014.old_roll_entry:0 "Supplementary entry on the old rolls (record against the old register)"
 ywc_dmg.1014.old_roll_entry.cost_tooltip:0 "No new charge."
 ywc_dmg.1014.old_roll_entry.consequence_tooltip:0 "Only parcels inside the old register are added and the registered scope does not grow, while the cost of repeated checking continues."
 ywc_dmg.1014.defer:0 "Wait for the next survey round"
 ywc_dmg.1014.defer.cost_tooltip:0 "No new charge."
 ywc_dmg.1014.defer.consequence_tooltip:0 "Supplementary entry is postponed and the event may return; no migrant pops or new parcels are created."
 ywc_dmg.1014.withdraw_titles:0 "Withdraw the title lane (lawful exit)"
 ywc_dmg.1014.withdraw_titles.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1014.withdraw_titles.consequence_tooltip:0 "The lane ends in withdrawal; recorded entries and paid money remain."
 ywc_dmg.1015.t:0 "The Land Did Not Move with the Paper"
 ywc_dmg.1015.d:0 "The review checks real registration, agricultural employment, administrative supply, the treasury and local unrest. Only continuous observance on this route may confirm the result, while lawful partial performance may settle as a compromise. A lost state, war or bankruptcy still leaves capping, renegotiation or withdrawal open, and debts are always retained."
 ywc_dmg.1015.confirm_mixed:0 "Confirm mixed arbitration (continuous review held)"
 ywc_dmg.1015.confirm_mixed.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1015.confirm_mixed.consequence_tooltip:0 "Confirmed only with six continuous months of review, the registry fee and the compensation really paid; for 36 months administration costs more and legitimacy rises."
 ywc_dmg.1015.confirm_contract:0 "Confirm the unified contract (written verification held)"
 ywc_dmg.1015.confirm_contract.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1015.confirm_contract.consequence_tooltip:0 "Confirmed only when the real land law allows it and written verification plus the registry fee both hold; for 36 months administration is cheaper but old claimants accept less."
 ywc_dmg.1015.confirm_legacy:0 "Confirm old-boundary delimitation (old line and old rolls rule)"
 ywc_dmg.1015.confirm_legacy.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1015.confirm_legacy.consequence_tooltip:0 "The old boundary and rolls keep standing and the pilot stays smallest; registration stays expensive and legitimacy stays limited."
 ywc_dmg.1015.limited_settlement:0 "Accept a limited settlement (thirty-six months without readiness)"
 ywc_dmg.1015.limited_settlement.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1015.limited_settlement.consequence_tooltip:0 "After month thirty-six, the lane closes as limited only if the narrower target was actually selected, the registry fee was paid, the local route is ready and a fresh continuous six-month review passed; otherwise the lane stays open."
 ywc_dmg.1015.renegotiate:0 "Wait safely or renegotiate"
 ywc_dmg.1015.renegotiate.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1015.renegotiate.consequence_tooltip:0 "Propose or retain a narrower target for the titles lane. Once the real office, registry and fiscal conditions return, a fresh continuous six-month review is required before confirmation or limited closure. Waiting preserves the current route, payments and debts."
 ywc_dmg.1015.withdraw_titles:0 "Withdraw the title lane (lawful exit)"
 ywc_dmg.1015.withdraw_titles.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1015.withdraw_titles.consequence_tooltip:0 "Ends in withdrawal; the registry fee paid, compensation debts and registration facts all remain."
 ywc_je_v03_dmg_court_appointment:0 "Settling the Appointment"
 ywc_je_v03_dmg_court_appointment_reason:0 "The court's seal and the locality's seal must sit on one letter. Three real arrangements are mutually exclusive: royal administration carries the appointment on a central budget and offices in post, joint appointment rests on the country's real voting qualification or a co-signed charter, and a local compact needs a local budget share and joint appeals. Any route charges a further one week of estimated yearly gross income (yearly gross income / 52, minimum 100) as the document and survey fee, and the lane locks only after the deduction really lands. Choosing the text is not completing the appointment; a lost state or a shifting political group still leaves renegotiation, capping or withdrawal open."
 ywc_je_v03_dmg_court_budget:0 "Posts and Local Budget Fulfilment"
 ywc_je_v03_dmg_court_budget_reason:0 "Once the letter reaches the office someone must really be in post and the budget share must really be payable. This lane checks actual government administration buildings and employment, the chosen budget share and fiscal capacity; posts are never generated by events, and vacancies can only be filled or built by the player in the base game. The land-title arbitration keeps biting here: old-boundary delimitation keeps the old office ledger, mixed arbitration recognises joint appeals, and a unified contract requires written office verification. Months 12 and 36 open repair or exit windows, and money paid, real posts and debts all remain."
 ywc_je_v03_dmg_court_charter_review:0 "Nine Continuous Months of Representation Review"
 ywc_je_v03_dmg_court_charter_review_reason:0 "Which instrument the towns accept depends on nine continuous months of real conditions: with a franchise the check runs on the country's own voting qualification and employed representatives, and without one it runs on a co-signed office charter, state budget and appeal record. Any interruption restarts from zero and no seat is ever invented. A lost state, war, fiscal deterioration or a shifting political group each open renegotiation, capping or withdrawal, while peace carries budget countersignature and rotating audit as usual."
 ywc_dmg.1016.t:0 "The Royal Seal and the Local Seal on One Letter"
 ywc_dmg.1016.d:0 "The court presses for the appointment while the towns demand budget responsibility first. Royal administration, joint appointment and a local compact lead to different journal goals, different document fees and different real thresholds for posts. The document and survey fee must really be deducted before the lane locks, and a thin treasury may simply not advance."
 ywc_dmg.1016.royal_administration:0 "Royal administration (central budget, offices in post)"
 ywc_dmg.1016.royal_administration.cost_tooltip:0 "Charges one week of estimated yearly gross income (yearly gross income / 52) as the appointment document and survey fee, minimum 100; the lane locks only after the deduction really lands."
 ywc_dmg.1016.royal_administration.consequence_tooltip:0 "The lane advances only after the fee is really deducted; the court must carry the appointment with offices actually in post and a central budget, and no funds or staff appear from the event."
 ywc_dmg.1016.joint_appointment:0 "Joint appointment (real representatives or a co-signed charter)"
 ywc_dmg.1016.joint_appointment.cost_tooltip:0 "Also charges one week of estimated yearly gross income, minimum 100, and requires either real representatives or a secondary office able to take up the appointment."
 ywc_dmg.1016.joint_appointment.consequence_tooltip:0 "With a franchise the check runs on the country's own voting qualification and employed representatives; without one the office charter and budget must be co-signed. Proclaiming it never completes the appointment."
 ywc_dmg.1016.local_compact:0 "Local compact (local budget share and joint appeals)"
 ywc_dmg.1016.local_compact.cost_tooltip:0 "Also charges one week of estimated yearly gross income, minimum 100, and requires a secondary office really in post."
 ywc_dmg.1016.local_compact.consequence_tooltip:0 "The locality carries a budget share and gains a joint appeal channel; office posts must still be really staffed and the event creates none."
 ywc_dmg.1016.defer:0 "Defer the decision (until offices and treasury are ready)"
 ywc_dmg.1016.defer.cost_tooltip:0 "No new charge."
 ywc_dmg.1016.defer.consequence_tooltip:0 "Both seals stay pending and the event may return in a later month; no appointment fact is created."
 ywc_dmg.1016.withdraw_court:0 "Withdraw the provinces lane (lawful exit)"
 ywc_dmg.1016.withdraw_court.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1016.withdraw_court.consequence_tooltip:0 "The lane ends in withdrawal; fees paid, posts in service and existing debts all remain."
 ywc_dmg.1017.t:0 "How Much the Locality Will Pay"
 ywc_dmg.1017.d:0 "The share can be paid three ways: the centre pays and submits to central audit, the locality pays from its real finances and gains co-signature, or the old budget is capped and the task narrowed. The title arbitration decides here who may countersign and what local appeals cost; the event invents no income."
 ywc_dmg.1017.central_audit_pays:0 "The centre pays under central audit"
 ywc_dmg.1017.central_audit_pays.cost_tooltip:0 "Deducts one week of estimated yearly gross income (yearly gross income / 52), minimum 100. A budget share already paid is never charged twice, and no advance happens without the deduction."
 ywc_dmg.1017.central_audit_pays.consequence_tooltip:0 "The budget share is really paid by the centre and audited centrally; only a real deduction advances, otherwise this node retries."
 ywc_dmg.1017.local_share_countersign:0 "The locality pays a share and gains co-signature"
 ywc_dmg.1017.local_share_countersign.cost_tooltip:0 "Deducts one week of estimated yearly gross income (yearly gross income / 52), minimum 100. A budget share already paid is never charged twice, and no advance happens without the deduction."
 ywc_dmg.1017.local_share_countersign.consequence_tooltip:0 "Who may countersign follows the title arbitration: mixed arbitration recognises representatives, a unified contract requires office verification, and old-boundary delimitation keeps the old office ledger; without a title result the office in post decides. Only a real deduction secures the co-signature."
 ywc_dmg.1017.limited_old_budget:0 "Cap the old budget and narrow the task"
 ywc_dmg.1017.limited_old_budget.cost_tooltip:0 "No new charge."
 ywc_dmg.1017.limited_old_budget.consequence_tooltip:0 "Nothing is deducted and no income is invented; the task shrinks to what the old budget can carry and later checks use the narrowed goal."
 ywc_dmg.1017.defer:0 "Reopen the budget share next month"
 ywc_dmg.1017.defer.cost_tooltip:0 "No new charge."
 ywc_dmg.1017.defer.consequence_tooltip:0 "The share stays undecided and the event may return in a later month."
 ywc_dmg.1017.withdraw_court:0 "Withdraw the provinces lane (lawful exit)"
 ywc_dmg.1017.withdraw_court.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1017.withdraw_court.consequence_tooltip:0 "Ends in withdrawal; money paid and posts in service remain."
 ywc_dmg.1018.t:0 "The Letter Reaches an Empty Office"
 ywc_dmg.1018.d:0 "The letter arrives and the office may be empty. A staffed office authorises by the book; where posts are vacant the player must hire or build in the base game, a really staffed local office may deputise, or the goal narrows to what the existing offices can execute. The event creates no office pops."
 ywc_dmg.1018.authorize_staffed:0 "The office is staffed, so authorise by the book"
 ywc_dmg.1018.authorize_staffed.cost_tooltip:0 "No new charge."
 ywc_dmg.1018.authorize_staffed.consequence_tooltip:0 "Authorisation runs only when a secondary bureaucrat is really in post at a usable government administration building; the post is never created by the event."
 ywc_dmg.1018.temporary_deputy:0 "A temporary local deputy (limited authorisation)"
 ywc_dmg.1018.temporary_deputy.cost_tooltip:0 "No new charge."
 ywc_dmg.1018.temporary_deputy.consequence_tooltip:0 "A really staffed local office deputises with limited authority; the full office still has to be hired or built by the player in the base game."
 ywc_dmg.1018.wait_for_posting:0 "Wait for the office to be staffed"
 ywc_dmg.1018.wait_for_posting.cost_tooltip:0 "No new charge."
 ywc_dmg.1018.wait_for_posting.consequence_tooltip:0 "The letter stays with the court and the event may return; no office pops or buildings are created."
 ywc_dmg.1018.narrow_goal:0 "Narrow the goal to the offices that exist"
 ywc_dmg.1018.narrow_goal.cost_tooltip:0 "No new charge."
 ywc_dmg.1018.narrow_goal.consequence_tooltip:0 "The task shrinks to what the staffed offices can actually execute, and later route checks use the narrowed goal."
 ywc_dmg.1018.withdraw_court:0 "Withdraw the provinces lane (lawful exit)"
 ywc_dmg.1018.withdraw_court.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1018.withdraw_court.consequence_tooltip:0 "Ends in withdrawal; the fee paid and existing posts remain."
 ywc_dmg.1019.t:0 "The Order in Which the Nobles Sit"
 ywc_dmg.1019.d:0 "Landowners and other existing political groups contest the order of budget review. A time-limited amendment, a noble guarantee and sole court deliberation each carry different legitimacy and administrative costs over the next 24 months, and eligibility is checked against the country's real polity and the groups that really exist."
 ywc_dmg.1019.time_limited_amendment:0 "A time-limited amendment to the agenda (24 months)"
 ywc_dmg.1019.time_limited_amendment.cost_tooltip:0 "No new charge."
 ywc_dmg.1019.time_limited_amendment.consequence_tooltip:0 "No new charge, but for 24 months the hearings occupy administrative resources while legitimacy rises."
 ywc_dmg.1019.noble_guarantee:0 "Noble guarantee (24 months)"
 ywc_dmg.1019.noble_guarantee.cost_tooltip:0 "No new charge."
 ywc_dmg.1019.noble_guarantee.consequence_tooltip:0 "Surety comes from the landowner interest group that really exists: for 24 months legitimacy rises while government authority falls."
 ywc_dmg.1019.royal_sole_review:0 "Sole court deliberation (24 months)"
 ywc_dmg.1019.royal_sole_review.cost_tooltip:0 "No new charge."
 ywc_dmg.1019.royal_sole_review.consequence_tooltip:0 "The court fixes the order alone: for 24 months administrative reach improves while legitimacy falls sharply and local groups cooperate less later."
 ywc_dmg.1019.defer:0 "Let nobles and towns settle the order themselves"
 ywc_dmg.1019.defer.cost_tooltip:0 "No new charge."
 ywc_dmg.1019.defer.consequence_tooltip:0 "The order stays undecided and the event may return."
 ywc_dmg.1019.withdraw_court:0 "Withdraw the provinces lane (lawful exit)"
 ywc_dmg.1019.withdraw_court.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1019.withdraw_court.consequence_tooltip:0 "Ends in withdrawal; paid money and existing group relations remain."
 ywc_dmg.1020.t:0 "How to Deliberate Without Elections"
 ywc_dmg.1020.d:0 "Where a franchise exists the check runs on the country's own voting qualification and employed representatives; where none exists, a co-signed office charter, state budget and appeal record stand in. The co-signature clause written by the second path is what later makes the joint-appointment lane valid. Neither path invents a seat."
 ywc_dmg.1020.elected_representatives:0 "Deliberate through real voting eligibility and employed representatives"
 ywc_dmg.1020.elected_representatives.cost_tooltip:0 "No new charge."
 ywc_dmg.1020.elected_representatives.consequence_tooltip:0 "When the country really has a franchise, the check runs on its own voting qualification and employed representatives; no seats are invented."
 ywc_dmg.1020.office_charter_cosign:0 "Co-sign the office charter and budget (without a franchise)"
 ywc_dmg.1020.office_charter_cosign.cost_tooltip:0 "No new charge."
 ywc_dmg.1020.office_charter_cosign.consequence_tooltip:0 "Without a franchise, a co-signed office charter, state budget and appeal record stand in for seats; this co-signature clause is what makes the joint-appointment lane valid."
 ywc_dmg.1020.old_ledger_consultation:0 "Consult the old office ledger (limited scope)"
 ywc_dmg.1020.old_ledger_consultation.cost_tooltip:0 "No new charge."
 ywc_dmg.1020.old_ledger_consultation.consequence_tooltip:0 "Only those already on the old ledger are consulted, so deliberation and the task narrow together; no representative seat is added."
 ywc_dmg.1020.defer:0 "Wait until the franchise or charter is ready"
 ywc_dmg.1020.defer.cost_tooltip:0 "No new charge."
 ywc_dmg.1020.defer.consequence_tooltip:0 "The form of deliberation stays undecided and the event may return."
 ywc_dmg.1020.withdraw_court:0 "Withdraw the provinces lane (lawful exit)"
 ywc_dmg.1020.withdraw_court.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1020.withdraw_court.consequence_tooltip:0 "Ends in withdrawal; paid money and signed charters remain."
 ywc_dmg.1021.t:0 "Who May Veto Defence Spending"
 ywc_dmg.1021.d:0 "A wartime emergency veto is discussed only where a real war and military spending exist, while peace reviews the ordinary barrack budget. The court may keep audit control and pay its cost, a joint veto may go only to a locality really carrying a budget share, and the old practice may keep no veto at the price of local resentment and narrower spending. The event never forces a war."
 ywc_dmg.1021.court_keeps_control:0 "The court keeps audit control (peacetime barrack budget)"
 ywc_dmg.1021.court_keeps_control.cost_tooltip:0 "No new charge."
 ywc_dmg.1021.court_keeps_control.consequence_tooltip:0 "In peace only the ordinary barrack budget is reviewed and no wartime spending is invented; for 24 months the audit costs administrative capacity and buys legitimacy."
 ywc_dmg.1021.joint_veto:0 "A shared local veto"
 ywc_dmg.1021.joint_veto.cost_tooltip:0 "No new charge."
 ywc_dmg.1021.joint_veto.consequence_tooltip:0 "The veto is granted only where the locality really carries a budget share; for 24 months hearings cost administrative capacity and raise legitimacy."
 ywc_dmg.1021.old_system_no_veto:0 "The old system keeps no veto (local resentment builds)"
 ywc_dmg.1021.old_system_no_veto.cost_tooltip:0 "No new charge."
 ywc_dmg.1021.old_system_no_veto.consequence_tooltip:0 "The old practice saves administrative capacity but builds local resentment: for 24 months administration is lighter while legitimacy falls sharply."
 ywc_dmg.1021.wartime_emergency_veto:0 "A wartime emergency veto (real military spending)"
 ywc_dmg.1021.wartime_emergency_veto.cost_tooltip:0 "No new charge."
 ywc_dmg.1021.wartime_emergency_veto.consequence_tooltip:0 "Available only while the country is really at war; for 24 months administrative reach improves while legitimacy falls."
 ywc_dmg.1021.defer:0 "Leave the defence veto undecided"
 ywc_dmg.1021.defer.cost_tooltip:0 "No new charge."
 ywc_dmg.1021.defer.consequence_tooltip:0 "The veto stays undecided and the event may return."
 ywc_dmg.1021.withdraw_court:0 "Withdraw the provinces lane (lawful exit)"
 ywc_dmg.1021.withdraw_court.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1021.withdraw_court.consequence_tooltip:0 "Ends in withdrawal; paid money and existing defence arrangements remain."
 ywc_dmg.1022.t:0 "Must the New Official Sign Again"
 ywc_dmg.1022.d:0 "The official in post or the successor takes over and reads the title arbitration together with the compensation debts already paid and still unpaid. The standing terms may be confirmed, amended for a fee, or left to a vacancy. A predecessor's departure is never debt forgiveness, and under old-boundary delimitation re-registration needs more cash."
 ywc_dmg.1022.confirm_signed_terms:0 "Confirm the standing terms (debts follow the office)"
 ywc_dmg.1022.confirm_signed_terms.cost_tooltip:0 "No new charge."
 ywc_dmg.1022.confirm_signed_terms.consequence_tooltip:0 "A predecessor's departure is not debt forgiveness: where the title lane signed compensation that is still unpaid, the successor inherits it on the books; nothing is deducted here."
 ywc_dmg.1022.pay_to_amend:0 "Pay to amend the terms"
 ywc_dmg.1022.pay_to_amend.cost_tooltip:0 "Deducts one week of estimated yearly gross income (yearly gross income / 52), minimum 100. Where the local share was already paid this can never be charged twice, so the option exists only while unpaid; under old-boundary delimitation the re-registration needs one and a half weeks of cash (multiply 1.5)."
 ywc_dmg.1022.pay_to_amend.consequence_tooltip:0 "Only a real deduction enters the successor's amended terms on the register and moves to the recognition stage; a short treasury returns to this node for a later attempt."
 ywc_dmg.1022.suspend_into_vacancy:0 "Suspend into the vacancy (no re-signature)"
 ywc_dmg.1022.suspend_into_vacancy.cost_tooltip:0 "No new charge."
 ywc_dmg.1022.suspend_into_vacancy.consequence_tooltip:0 "Nothing is deducted and the office is left vacant; fees paid, posts in service and existing debts remain facts, and the task narrows."
 ywc_dmg.1022.defer:0 "Wait until the successor takes office"
 ywc_dmg.1022.defer.cost_tooltip:0 "No new charge."
 ywc_dmg.1022.defer.consequence_tooltip:0 "Whether to re-sign stays undecided and the event may return."
 ywc_dmg.1022.withdraw_court:0 "Withdraw the provinces lane (lawful exit)"
 ywc_dmg.1022.withdraw_court.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1022.withdraw_court.consequence_tooltip:0 "Ends in withdrawal; unpaid debts and money already paid both stay on the books."
 ywc_dmg.1023.t:0 "Which Instrument the Towns Accept"
 ywc_dmg.1023.d:0 "Nine continuous months of real posts, budget and lawful representation confirm exactly one of royal administration, joint appointment or a local compact. Lawful partial performance may compromise and a blocked lane may settle as capped; a lost state, war, fiscal deterioration or a departing political group each opens renegotiation, capping or withdrawal. The event never grants independence or changes the polity by itself."
 ywc_dmg.1023.confirm_royal:0 "Confirm the royal-administration instrument"
 ywc_dmg.1023.confirm_royal.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1023.confirm_royal.consequence_tooltip:0 "Confirmed only with nine continuous months of review, the charter fee and budget share really paid, and offices really in post; for 36 months administration costs more and legitimacy is limited."
 ywc_dmg.1023.confirm_joint:0 "Confirm the joint-appointment instrument"
 ywc_dmg.1023.confirm_joint.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1023.confirm_joint.consequence_tooltip:0 "Confirmed only when the real franchise route or the co-signed charter really holds and nine continuous months of review passed; for 36 months legitimacy rises while administration costs more."
 ywc_dmg.1023.confirm_local:0 "Confirm the local-compact instrument"
 ywc_dmg.1023.confirm_local.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1023.confirm_local.consequence_tooltip:0 "Grounded in a really staffed secondary office and a local budget share, confirmed after nine continuous months of review; for 36 months administration is lighter while central authority eases slightly."
 ywc_dmg.1023.limited_settlement:0 "Accept a limited settlement (thirty-six months without readiness)"
 ywc_dmg.1023.limited_settlement.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1023.limited_settlement.consequence_tooltip:0 "After month thirty-six, the lane closes as limited only if the narrower target was proposed and selected, charter and budget costs were paid, local representation and defence terms were implemented, and a fresh continuous nine-month review passed; otherwise the lane stays open."
 ywc_dmg.1023.renegotiate:0 "Wait safely or renegotiate"
 ywc_dmg.1023.renegotiate.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1023.renegotiate.consequence_tooltip:0 "When readiness is temporarily lost, wait safely with the original route, payments and debts preserved, then observe nine fresh continuous months after offices, budget, finances and peace are restored; the local compact may also renegotiate its target under the existing rules."
 ywc_dmg.1023.withdraw_court:0 "Withdraw the provinces lane (lawful exit)"
 ywc_dmg.1023.withdraw_court.cost_tooltip:0 "No new charge. Money already paid is never refunded."
 ywc_dmg.1023.withdraw_court.consequence_tooltip:0 "Ends in withdrawal; the charter fee paid, the budget share, posts in service and unpaid debts all remain."
 ywc_je_v03_dmg_school_languages:0 "Two Voices in the Classroom"
 ywc_je_v03_dmg_school_languages_reason:0 "Northern Luzon's curriculum, local texts and teaching budget need an agreement that can survive a change of government. Choose bilingual public schooling, local joint provision or a central curriculum; verify school institutions, university staff and offices in the owned pilot, then pay registration and the next term's bill. Close after six consecutive monthly checks, or agree a limited tuition and appeal arrangement while schools remain insufficient."
 ywc_dmg.1120.t:0 "One Classroom"
 ywc_dmg.1120.d:0 "Several timetables have reached the northern Luzon offices. Some ask for common textbooks, others insist on local texts, while clergy and villages seek a role in provision. The government must choose a direction before checking staff and funding. Crown or republic, it faces the same questions: who will teach, and who will pay?"
 ywc_dmg.1120.bilingual_public:0 "Bilingual public schooling: common lessons and local texts"
 ywc_dmg.1120.bilingual_public.cost_tooltip:0 "No charge at this step; registration normally costs one week's opening income."
 ywc_dmg.1120.bilingual_public.consequence_tooltip:0 "Select the currently owned northern Luzon pilot and curriculum direction, then arrange textbook registration."
 ywc_dmg.1120.local_joint:0 "Local joint provision: retain local and religious teaching"
 ywc_dmg.1120.local_joint.cost_tooltip:0 "No charge at this step; registration normally costs half a week's opening income."
 ywc_dmg.1120.local_joint.consequence_tooltip:0 "Select the currently owned northern Luzon pilot and curriculum direction, then arrange textbook registration."
 ywc_dmg.1120.central_curriculum:0 "Central curriculum under the government now in office"
 ywc_dmg.1120.central_curriculum.cost_tooltip:0 "No charge at this step; registration normally costs one week's opening income."
 ywc_dmg.1120.central_curriculum.consequence_tooltip:0 "Select the currently owned northern Luzon pilot and curriculum direction, then arrange textbook registration."
 ywc_dmg.1120.wait_pilot:0 "Wait for the pilot or reconsider"
 ywc_dmg.1120.wait_pilot.cost_tooltip:0 "No charge now; previous payments remain settled."
 ywc_dmg.1120.wait_pilot.consequence_tooltip:0 "Keep the present question open for a later monthly discussion."
 ywc_dmg.1120.withdraw:0 "Withdraw this school agreement"
 ywc_dmg.1120.withdraw.cost_tooltip:0 "No further charge or refund; earlier land and court accounts remain in force."
 ywc_dmg.1120.withdraw.consequence_tooltip:0 "End this agreement and free one long-term undertaking slot."
 ywc_dmg.1121.t:0 "Who Pays for the Translations"
 ywc_dmg.1121.d:0 "Copies, translations and enrolment rolls all need staff. Offices that established common qualifications and public translation duties can reuse that work, provided staff in this pilot can carry it forward. A country whose earlier reform did not succeed can still fund a fresh start."
 ywc_dmg.1121.pay_setup:0 "Pay the setup fee currently due"
 ywc_dmg.1121.pay_setup.cost_tooltip:0 "The base is one week's opening income, minimum 100. Bilingual public and central provision normally pay the full amount; local joint provision pays half. Bilingual provision also pays half when common qualifications and translation duties are established and this pilot retains staff to administer them."
 ywc_dmg.1121.pay_setup.consequence_tooltip:0 "Pay the amount currently due, then verify teaching provision. A discount already settled will not be reclaimed."
 ywc_dmg.1121.wait_cash:0 "Wait for current conditions"
 ywc_dmg.1121.wait_cash.cost_tooltip:0 "No charge now; previous payments remain settled."
 ywc_dmg.1121.wait_cash.consequence_tooltip:0 "Keep the present question open for a later monthly discussion."
 ywc_dmg.1121.withdraw:0 "Withdraw this school agreement"
 ywc_dmg.1121.withdraw.cost_tooltip:0 "No further charge or refund; earlier land and court accounts remain in force."
 ywc_dmg.1121.withdraw.consequence_tooltip:0 "End this agreement and free one long-term undertaking slot."
 ywc_dmg.1122.t:0 "Teaching Posts and Worship"
 ywc_dmg.1122.d:0 "The timetable is written; the teaching posts still need checking. Can scholars or clergy employed at the university support the materials? Do school institutions sustain the chosen curriculum, and what does religious policy permit? If provision remains insufficient, the agreement can begin with limited literacy tuition and assistance through the offices."
 ywc_dmg.1122.confirm_supply:0 "Confirm current teaching supply"
 ywc_dmg.1122.confirm_supply.cost_tooltip:0 "No charge at this step; requires the appropriate education law, at least level-one school investment and university staff employed in this pilot."
 ywc_dmg.1122.confirm_supply.consequence_tooltip:0 "Bilingual provision requires fully accepted non-primary-culture academics and 80% university occupancy. Joint provision accepts non-primary academics or clergy at 50%. Central provision requires a staffed university and offices at 80%. All checked workplaces must have no goods shortage."
 ywc_dmg.1122.limit_existing_tuition:0 "Limit the agreement to existing literacy and office tuition"
 ywc_dmg.1122.limit_existing_tuition.cost_tooltip:0 "Requires national literacy of at least 10% and non-primary-culture bureaucrats employed in this pilot's administration, with at least 25% occupancy and no goods shortage. The registration fee remains paid."
 ywc_dmg.1122.limit_existing_tuition.consequence_tooltip:0 "Limit the goal to existing literacy tuition, assistance through the offices and appeals. Six monthly observations and the later payment can establish a limited agreement."
 ywc_dmg.1122.wait_supply:0 "Wait for current conditions"
 ywc_dmg.1122.wait_supply.cost_tooltip:0 "No charge now; previous payments remain settled."
 ywc_dmg.1122.wait_supply.consequence_tooltip:0 "Keep the present question open for a later monthly discussion."
 ywc_dmg.1122.withdraw:0 "Withdraw this school agreement"
 ywc_dmg.1122.withdraw.cost_tooltip:0 "No further charge or refund; earlier land and court accounts remain in force."
 ywc_dmg.1122.withdraw.consequence_tooltip:0 "End this agreement and free one long-term undertaking slot."
 ywc_dmg.1123.t:0 "The Boundary of Village Consent"
 ywc_dmg.1123.d:0 "Village representatives will sign beside the enrolment rolls, but want to know where disputes will be heard. A village consent procedure established through mixed land arbitration can supply a precedent. Otherwise, this pilot needs its own appeal clause."
 ywc_dmg.1123.reuse_village_clause:0 "Reuse the settled village co-signature rule"
 ywc_dmg.1123.reuse_village_clause.cost_tooltip:0 "No charge; requires concluded mixed arbitration, paid compensation, an established village consent clause and staff still employed in this pilot."
 ywc_dmg.1123.reuse_village_clause.consequence_tooltip:0 "Reuse the village appeal procedure, record terms for this pilot and begin six consecutive monthly observations. Earlier land accounts remain in force."
 ywc_dmg.1123.write_new_appeal:0 "Write a new appeal clause for this agreement"
 ywc_dmg.1123.write_new_appeal.cost_tooltip:0 "No additional charge; registration must be paid and current staff, offices and selected provision must remain qualified."
 ywc_dmg.1123.write_new_appeal.consequence_tooltip:0 "Write a new appeal clause for this pilot and begin six consecutive monthly observations."
 ywc_dmg.1123.wait_terms:0 "Wait for current conditions"
 ywc_dmg.1123.wait_terms.cost_tooltip:0 "No charge now; previous payments remain settled."
 ywc_dmg.1123.wait_terms.consequence_tooltip:0 "Keep the present question open for a later monthly discussion."
 ywc_dmg.1123.withdraw:0 "Withdraw this school agreement"
 ywc_dmg.1123.withdraw.cost_tooltip:0 "No further charge or refund; earlier land and court accounts remain in force."
 ywc_dmg.1123.withdraw.consequence_tooltip:0 "End this agreement and free one long-term undertaking slot."
 ywc_dmg.1124.t:0 "The Next Term Bill"
 ywc_dmg.1124.d:0 "Staff, terms, finances and peace have been checked month by month. Six consecutive satisfactory observations bring the next term's bill; war, loss of the pilot, default or interrupted provision require a new observation period. An established central appointment and budget charter may reduce the coordination charge."
 ywc_dmg.1124.pay_next_term:0 "Pay the next-term bill currently due after observation"
 ywc_dmg.1124.pay_next_term.cost_tooltip:0 "Uses the opening one-week income base. Bilingual public and central provision normally pay the full amount; joint provision pays half. Central provision pays half when the earlier central charter is established, its two fees are paid, and this pilot's offices and bureaucracy remain qualified."
 ywc_dmg.1124.pay_next_term.consequence_tooltip:0 "Pay this agreement's next term bill and proceed to the closing review. A limited goal also carries its applicable bill."
 ywc_dmg.1124.defer_recount:0 "Explicitly defer and recount six months from zero"
 ywc_dmg.1124.defer_recount.cost_tooltip:0 "Registration is not charged again; the next term bill is deferred."
 ywc_dmg.1124.defer_recount.consequence_tooltip:0 "Explicitly restart the observation period and count six satisfactory monthly checks from zero. Continuing problems interrupt the new period again."
 ywc_dmg.1124.wait_bill:0 "Wait for recovery or the current bill"
 ywc_dmg.1124.wait_bill.cost_tooltip:0 "No charge now; previous payments remain settled."
 ywc_dmg.1124.wait_bill.consequence_tooltip:0 "Keep the present question open for a later monthly discussion."
 ywc_dmg.1124.withdraw:0 "Withdraw this school agreement"
 ywc_dmg.1124.withdraw.cost_tooltip:0 "No further charge or refund; earlier land and court accounts remain in force."
 ywc_dmg.1124.withdraw.consequence_tooltip:0 "End this agreement and free one long-term undertaking slot."
 ywc_dmg.1125.t:0 "The Next Generation on the Roll"
 ywc_dmg.1125.d:0 "The new roll has space for the next intake. The government must now decide whether present staff, curriculum and accounts can sustain its promise: confirm the full agreement, accept local joint provision or a limited goal, record unresolved shortcomings, or end the pilot."
 ywc_dmg.1125.close_established:0 "Confirm the full bilingual-public or central agreement"
 ywc_dmg.1125.close_established.cost_tooltip:0 "No further charge; full provision, six satisfactory monthly observations, both payments and current pilot conditions must all hold."
 ywc_dmg.1125.close_established.consequence_tooltip:0 "Confirm the bilingual public or central curriculum agreement, retain its direction and ledger, and conclude this undertaking."
 ywc_dmg.1125.close_compromise:0 "Confirm local joint provision or the explicit bounded agreement"
 ywc_dmg.1125.close_compromise.cost_tooltip:0 "No further charge; joint provision or the selected limited goal must remain qualified, with six observations and both payments complete."
 ywc_dmg.1125.close_compromise.consequence_tooltip:0 "Confirm the agreement within the scope actually delivered, retaining its terms, expenditure and earlier precedents."
 ywc_dmg.1125.close_setback:0 "Record a setback against the current gap"
 ywc_dmg.1125.close_setback.cost_tooltip:0 "No further charge or refund."
 ywc_dmg.1125.close_setback.consequence_tooltip:0 "When present conditions support neither a full nor a limited agreement, record the shortcomings and conclude this undertaking for a future government to revisit."
 ywc_dmg.1125.wait_final:0 "Keep the ledger and await current conditions"
 ywc_dmg.1125.wait_final.cost_tooltip:0 "No charge now; previous payments remain settled."
 ywc_dmg.1125.wait_final.consequence_tooltip:0 "Keep the present question open for a later monthly discussion."
