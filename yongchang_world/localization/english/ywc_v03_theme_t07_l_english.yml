l_english:
 ywc_je_v03_t07_patronage_ledger:0 "Incense, Almsgiving and the State Ledger"
 ywc_je_v03_t07_patronage_ledger_reason:0 "Mongol patronage may cross the border; Tibet must audit its own relief granaries and finances before registering the patronage, substituting public funds, or citing a neighbor's precedent."
 ywc_society.1300.t:0 "Patronage Across the Border"
 ywc_society.1300.d:0 "The Mongol patron's offering has reached the border. Decide whether it enters the state ledger or stays on private books after a factual audit."
 ywc_society.1300.register:0 "Register the patronage in the ledger"
 ywc_society.1300.register.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1300.register.consequence_tooltip:0 "The patronage is entered in the state ledger as a record."
 ywc_society.1300.defer:0 "Hold it on private books"
 ywc_society.1300.defer.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1300.defer.consequence_tooltip:0 "The patronage is held on private books, outside the state ledger."
 ywc_society.1300.wait:0 "Wait and review again"
 ywc_society.1300.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1300.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1301.t:0 "Which Granary Opens in a Lean Year"
 ywc_society.1301.d:0 "The lean year has arrived and the charity and state granaries must be audited face to face. Patron grain is entered as patronage; public grain is paid for from the treasury. The ledger does not mix them."
 ywc_society.1301.patron_granary:0 "Ask the patron to fund the granary"
 ywc_society.1301.patron_granary.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1301.patron_granary.consequence_tooltip:0 "The granary cost shifts to patron funds; the request is recorded."
 ywc_society.1301.public_granary:0 "Substitute public funds and open the state granary"
 ywc_society.1301.public_granary.cost_tooltip:0 "Tibet pays 500 from its treasury."
 ywc_society.1301.public_granary.consequence_tooltip:0 "Public funds substitute for patronage and bear the cost; the patron request stays on record."
 ywc_society.1301.dmg_model:0 "Follow the Dongming granary precedent"
 ywc_society.1301.dmg_model.cost_tooltip:0 "Tibet pays 400 from its treasury."
 ywc_society.1301.dmg_model.consequence_tooltip:0 "Adopt the Dongming state granary precedent; the cost is entered in the ledger."
 ywc_society.1301.wait:0 "Wait and review again"
 ywc_society.1301.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1301.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1302.t:0 "Doctrine Attached to the Funds"
 ywc_society.1302.d:0 "The patron's funds come with doctrine attached. Fund in full, attach clauses, share with the Oirats, or refuse; both ledgers keep a copy."
 ywc_society.1302.fund_full:0 "Fund the request in full"
 ywc_society.1302.fund_full.cost_tooltip:0 "Mongolia pays 800; no transfer to Tibet."
 ywc_society.1302.fund_full.consequence_tooltip:0 "Fund the request in full; the record shows full patronage."
 ywc_society.1302.fund_conditional:0 "Fund with doctrine clauses attached"
 ywc_society.1302.fund_conditional.cost_tooltip:0 "Mongolia pays 400 from its treasury."
 ywc_society.1302.fund_conditional.consequence_tooltip:0 "A partial grant with doctrine clauses attached."
 ywc_society.1302.co_fund:0 "Fund jointly with the Oirats"
 ywc_society.1302.co_fund.cost_tooltip:0 "Mongolia pays 400 from its treasury."
 ywc_society.1302.co_fund.consequence_tooltip:0 "Share the grant with the Oirat co-religionists; the record shows joint patronage."
 ywc_society.1302.refuse:0 "Decline the external patronage"
 ywc_society.1302.refuse.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1302.refuse.consequence_tooltip:0 "Decline the external patronage; the record shows refusal."
 ywc_society.1302.wait:0 "Wait before responding"
 ywc_society.1302.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1302.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1303.t:0 "Local Custom Before the Court"
 ywc_society.1303.d:0 "A dispute over relief distribution reaches the court. Local custom and the patronage clauses each have their grounds; whichever prevails, the precedent is written into the ledger."
 ywc_society.1303.custom_precedent:0 "Rule by local custom"
 ywc_society.1303.custom_precedent.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1303.custom_precedent.consequence_tooltip:0 "Rule by local custom; the precedent enters the ledger."
 ywc_society.1303.doctrine_precedent:0 "Rule by the patronage clauses"
 ywc_society.1303.doctrine_precedent.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1303.doctrine_precedent.consequence_tooltip:0 "Rule by the patronage clauses; the precedent enters the ledger."
 ywc_society.1303.wait:0 "Wait and review again"
 ywc_society.1303.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1303.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1304.t:0 "Should the Charity Halls Be Inspected"
 ywc_society.1304.d:0 "The charity halls living on foreign patronage need their accounts checked. Inspectors cost public money; self-reporting is cheap but doubted. Either way the patron is notified."
 ywc_society.1304.inspect:0 "Send inspectors to audit the halls"
 ywc_society.1304.inspect.cost_tooltip:0 "Tibet pays 300 from its treasury."
 ywc_society.1304.inspect.consequence_tooltip:0 "Send inspectors; the audited accounts are reported to the patron."
 ywc_society.1304.no_inspect:0 "Let the halls report for themselves"
 ywc_society.1304.no_inspect.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1304.no_inspect.consequence_tooltip:0 "No audit; the halls report for themselves and the ledger records no inspection."
 ywc_society.1304.wait:0 "Wait and review again"
 ywc_society.1304.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1304.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1305.t:0 "The Patron Who Refuses Interference"
 ywc_society.1305.d:0 "The patron answers the audit request: share the cost and accept it, reserve its clauses, or refuse outside inspectors. One reconciliation remains after the bottom line."
 ywc_society.1305.accept_audit:0 "Accept the audit and share the cost"
 ywc_society.1305.accept_audit.cost_tooltip:0 "Mongolia pays 200 from its treasury."
 ywc_society.1305.accept_audit.consequence_tooltip:0 "Accept the audit and share the cost; the record shows acceptance."
 ywc_society.1305.accept_reserved:0 "Accept while reserving clauses"
 ywc_society.1305.accept_reserved.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1305.accept_reserved.consequence_tooltip:0 "Accept the audit while reserving its clauses; the record shows reservations."
 ywc_society.1305.refuse_inspection:0 "Refuse the outside inspection"
 ywc_society.1305.refuse_inspection.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1305.refuse_inspection.consequence_tooltip:0 "Refuse the outside inspection; the record shows refusal."
 ywc_society.1305.wait:0 "Wait before responding"
 ywc_society.1305.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1305.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1306.t:0 "The Bottom Line of Joint Relief"
 ywc_society.1306.d:0 "The two courts reconcile the bottom line of joint relief: a charter, limited terms, a charter with Oirat surety, or withdrawal. Once written, both ledgers update together."
 ywc_society.1306.charter:0 "Establish the joint relief charter"
 ywc_society.1306.charter.cost_tooltip:0 "Mongolia pays 600 from its treasury."
 ywc_society.1306.charter.consequence_tooltip:0 "Establish the joint relief charter; the ledger records a completed charter."
 ywc_society.1306.charter_witnessed:0 "Establish the charter with Oirat surety"
 ywc_society.1306.charter_witnessed.cost_tooltip:0 "Mongolia pays 600 from its treasury."
 ywc_society.1306.charter_witnessed.consequence_tooltip:0 "Establish the charter with Oirat surety; the ledger records a witnessed charter."
 ywc_society.1306.limited_terms:0 "Settle for limited terms"
 ywc_society.1306.limited_terms.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1306.limited_terms.consequence_tooltip:0 "Settle for limited terms; the ledger records limited cooperation."
 ywc_society.1306.withdraw:0 "Withdraw the external patronage"
 ywc_society.1306.withdraw.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1306.withdraw.consequence_tooltip:0 "Withdraw the external patronage; the ledger records refusal."
 ywc_society.1306.wait:0 "Wait before responding"
 ywc_society.1306.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1306.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1307.t:0 "After the Patronage Ends"
 ywc_society.1307.d:0 "When the patronage ends the ledger must be closed on the bottom-line record. If the patron is unavailable, Tibet closes alone on the accounts it holds."
 ywc_society.1307.confirm:0 "Close the ledger on the charter"
 ywc_society.1307.confirm.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1307.confirm.consequence_tooltip:0 "The charter closes the ledger; Mongolia gains 5 relations with Tibet."
 ywc_society.1307.close_limited:0 "Close the ledger as limited cooperation"
 ywc_society.1307.close_limited.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1307.close_limited.consequence_tooltip:0 "Close the ledger as limited cooperation."
 ywc_society.1307.close_refused:0 "Close the ledger as refused interference"
 ywc_society.1307.close_refused.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1307.close_refused.consequence_tooltip:0 "Close the ledger as refusal of outside interference; Mongolia loses 5 relations with Tibet."
 ywc_society.1307.alone:0 "Close locally because the patron is unavailable"
 ywc_society.1307.alone.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1307.alone.consequence_tooltip:0 "The patron is unavailable; Tibet closes on its own ledger. Expenses already paid are not refunded."
 ywc_society.1307.wait:0 "Wait before closing"
 ywc_society.1307.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1307.wait.consequence_tooltip:0 "Records this decision."
