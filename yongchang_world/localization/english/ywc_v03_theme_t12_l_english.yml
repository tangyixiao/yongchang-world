l_english:
 ywc_je_v03_t12_representation_pact:0 "Shared Burden Demands Shared Voice"
 ywc_je_v03_t12_representation_pact_reason:0 "Sea-lane escorts and border garrisons bill the court; the payers demand seats while Dongming, staking its trade lane, observes the deliberation and proposes limits. Each side independently records maintain, revise, or exit, and the treasurers bind the verdicts into a pact the next generation inherits."
 ywc_society.1550.t:0 "The Payers Demand Seats"
 ywc_society.1550.d:0 "Sea-lane escorts and border garrisons are billed across the provinces. Taxpaying prefectures and merchant guilds petition: a shared burden demands shared seats; the court first decides whether the deliberation opens to an outside observer."
 ywc_society.1550.convene:0 "Open the deliberation and ask Dongming to observe"
 ywc_society.1550.convene.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1550.convene.consequence_tooltip:0 "The deliberation opens and Dongming is asked to observe; a reply held over half a year lapses this round."
 ywc_society.1550.closed:0 "Deliberate behind closed doors"
 ywc_society.1550.closed.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1550.closed.consequence_tooltip:0 "No observer is invited; the budget review follows without an observation entry for Dongming."
 ywc_society.1550.wait:0 "Wait and review again"
 ywc_society.1550.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1550.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1551.t:0 "A Neighbor Observes the Deliberation"
 ywc_society.1551.d:0 "The invitation reaches Luzon by merchant ship. The trading houses that fund the compact ask their own court to send an observer; Dongming may pay for a seat to record the apportionment, or keep to the trade articles and send no one."
 ywc_society.1551.send_observer:0 "Pay 300 to send a seated observer"
 ywc_society.1551.send_observer.cost_tooltip:0 "Dongming pays 300 from its treasury; nothing is transferred to the court."
 ywc_society.1551.send_observer.consequence_tooltip:0 "The observer attends and records the apportionment; the court receives the answer and continues to the budget review."
 ywc_society.1551.decline_observer:0 "Send no one and keep to the trade articles"
 ywc_society.1551.decline_observer.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1551.decline_observer.consequence_tooltip:0 "Dongming stays away; the court receives the answer and continues to the budget review."
 ywc_society.1551.wait:0 "Wait before responding"
 ywc_society.1551.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1551.wait.consequence_tooltip:0 "Records this decision; a round held over half a year lapses."
 ywc_society.1551.withdraw:0 "The court has moved on; withdraw the observation"
 ywc_society.1551.withdraw.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1551.withdraw.consequence_tooltip:0 "Withdraws the observation request and clears only this round's pending record."
 ywc_society.1552.t:0 "A Public Budget for the Long Peace"
 ywc_society.1552.d:0 "With no border alarm, the treasurers still split the year's burden: expand schools, post roads and offices, or fund the sea-lane escort share and the barracks first. Either way the disposition of the soldiery follows."
 ywc_society.1552.services_first:0 "Pay 800 to fund schools, post roads and offices first"
 ywc_society.1552.services_first.cost_tooltip:0 "The court pays 800 from its treasury."
 ywc_society.1552.services_first.consequence_tooltip:0 "Public services lead; a real mobilization continues to the returning soldiers, otherwise Dongming is asked for limits."
 ywc_society.1552.defense_share:0 "Pay 800 to fund the escort share and barracks first"
 ywc_society.1552.defense_share.cost_tooltip:0 "The court pays 800 from its treasury."
 ywc_society.1552.defense_share.consequence_tooltip:0 "The defense share leads; a real mobilization continues to the returning soldiers, otherwise Dongming is asked for limits."
 ywc_society.1552.even_split:0 "Split evenly under the present quota without new levies"
 ywc_society.1552.even_split.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1552.even_split.consequence_tooltip:0 "The present quota stands; a real mobilization continues to the returning soldiers, otherwise Dongming is asked for limits."
 ywc_society.1552.wait:0 "Wait and review again"
 ywc_society.1552.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1552.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1553.t:0 "What the Returning Soldiers Ask"
 ywc_society.1553.d:0 "Demobilized soldiers and their families put arrears, pensions and land grants on the table. The payers note: if military spending stays beyond debate, the promise of seats is empty."
 ywc_society.1553.home_bounty:0 "Pay 500 for homeward grants and arrears"
 ywc_society.1553.home_bounty.cost_tooltip:0 "The court pays 500 from its treasury."
 ywc_society.1553.home_bounty.consequence_tooltip:0 "Arrears and grants are paid; Dongming is asked to propose limits on the compact."
 ywc_society.1553.record_pledge:0 "Record a pledge and clear arrears by installments"
 ywc_society.1553.record_pledge.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1553.record_pledge.consequence_tooltip:0 "Arrears are recorded as installments outside this round's ledger; Dongming is asked for limits."
 ywc_society.1553.defer_agenda:0 "Fold the demands into the compact agenda"
 ywc_society.1553.defer_agenda.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1553.defer_agenda.consequence_tooltip:0 "The soldiers' claims join the compact agenda; Dongming is asked for limits."
 ywc_society.1553.wait:0 "Wait and review again"
 ywc_society.1553.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1553.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1554.t:0 "The Lesser Ally Proposes Limits"
 ywc_society.1554.d:0 "Dongming's observer brings the apportionment ledger back to Luzon. The trading houses ask their court to propose written limits — yearly caps and an escort bound to the trade lane — or to continue under the present terms with none."
 ywc_society.1554.propose_limits:0 "Pay 200 to propose written limits"
 ywc_society.1554.propose_limits.cost_tooltip:0 "Dongming pays 200 from its treasury; nothing is transferred to the court."
 ywc_society.1554.propose_limits.consequence_tooltip:0 "The limits travel back with the ledger; the court receives the answer and continues to the emergency powers review."
 ywc_society.1554.no_limits:0 "Propose no limits and continue as before"
 ywc_society.1554.no_limits.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1554.no_limits.consequence_tooltip:0 "No limits are proposed; the court receives the answer and continues to the emergency powers review."
 ywc_society.1554.wait:0 "Wait before responding"
 ywc_society.1554.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1554.wait.consequence_tooltip:0 "Records this decision; a round held over half a year lapses."
 ywc_society.1554.withdraw:0 "The court has moved on; withdraw the proposal"
 ywc_society.1554.withdraw.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1554.withdraw.consequence_tooltip:0 "Withdraws the proposal and clears only this round's pending record."
 ywc_society.1555.t:0 "When Do the Emergency Powers End"
 ywc_society.1555.d:0 "With seating settled, the remaining dispute is when wartime requisition and martial authority return to the ordinary courts. Fix a sunset that ends on its date, or extend one term under a real mobilization; the payers threaten exit if it drags."
 ywc_society.1555.sunset_now:0 "Fix a sunset that ends on its date"
 ywc_society.1555.sunset_now.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1555.sunset_now.consequence_tooltip:0 "The emergency mandate is recorded as self-expiring; the independent two-sided verdict follows."
 ywc_society.1555.extend_once:0 "Extend one term under a real mobilization"
 ywc_society.1555.extend_once.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1555.extend_once.consequence_tooltip:0 "One extension is recorded on a real mobilization; the independent two-sided verdict follows."
 ywc_society.1555.wait:0 "Wait and review again"
 ywc_society.1555.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1555.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1556.t:0 "Maintain, Revise, or Exit the Compact"
 ywc_society.1556.d:0 "The shared-burden ledger lies before both courts. Each side records its verdict independently — maintain the present terms and seating, revise the articles, or exit the compact; the later decider receives the earlier record."
 ywc_society.1556.maintain:0 "Maintain the present terms and seating"
 ywc_society.1556.maintain.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1556.maintain.consequence_tooltip:0 "The court records maintain; if Dongming has not decided it is asked for its own verdict, otherwise the round closes."
 ywc_society.1556.revise:0 "Revise the articles and continue"
 ywc_society.1556.revise.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1556.revise.consequence_tooltip:0 "The court records revise; if Dongming has not decided it is asked for its own verdict, otherwise the round closes."
 ywc_society.1556.exit:0 "Exit the compact and keep separate ledgers"
 ywc_society.1556.exit.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1556.exit.consequence_tooltip:0 "The court records exit; if Dongming has not decided it is asked for its own verdict, otherwise the round closes."
 ywc_society.1556.wait:0 "Wait and review again"
 ywc_society.1556.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1556.wait.consequence_tooltip:0 "Records this decision."
 ywc_society.1556.keep_terms:0 "Dongming records maintain"
 ywc_society.1556.keep_terms.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1556.keep_terms.consequence_tooltip:0 "Dongming records maintain and gains 5 relations with the court; if the court has decided, the round closes."
 ywc_society.1556.revise_terms:0 "Dongming records revise"
 ywc_society.1556.revise_terms.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1556.revise_terms.consequence_tooltip:0 "Dongming records revise; if the court has decided, the round closes."
 ywc_society.1556.leave_pact:0 "Dongming records exit"
 ywc_society.1556.leave_pact.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1556.leave_pact.consequence_tooltip:0 "Dongming records exit and loses 5 relations with the court; if the court has decided, the round closes."
 ywc_society.1556.delay:0 "Wait before responding"
 ywc_society.1556.delay.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1556.delay.consequence_tooltip:0 "Records this decision; a round held over half a year lapses."
 ywc_society.1556.withdraw:0 "The round has closed; withdraw the verdict"
 ywc_society.1556.withdraw.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1556.withdraw.consequence_tooltip:0 "Withdraws the verdict and clears only this round's pending record."
 ywc_society.1557.t:0 "The Pact the Next Generation Inherits"
 ywc_society.1557.d:0 "The verdicts are in. The treasurers bind this round's apportionment, seating and limits into one record: let the next generation follow it, or file it without precedent. Dongming keeps its own copy; a side that left mid-round holds no automatic seat next time."
 ywc_society.1557.confirm:0 "Let the next round follow this record"
 ywc_society.1557.confirm.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1557.confirm.consequence_tooltip:0 "Closes by both verdicts, marks the record repeatable, and files one copy on each side."
 ywc_society.1557.discontinue:0 "File it without a precedent"
 ywc_society.1557.discontinue.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1557.discontinue.consequence_tooltip:0 "Closes by both verdicts without a precedent, filed on both sides."
 ywc_society.1557.wait:0 "Wait and review again"
 ywc_society.1557.wait.cost_tooltip:0 "No additional treasury expense."
 ywc_society.1557.wait.consequence_tooltip:0 "Records this decision."
