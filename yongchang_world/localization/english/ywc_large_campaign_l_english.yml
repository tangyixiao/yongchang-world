 ywc_nmg.113.b:0 "Rely on the suzerain: spend less but limit autonomy."
 ywc_nmg.114.t:0 "A Public Debate on New Ming's Future"
 ywc_nmg.114.d:0 "New Ming must address A Public Debate on New Ming's Future. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_nmg.114.a:0 "Secure or renegotiate autonomy where relations, finances and local support allow."
 ywc_nmg.114.b:0 "Open a risky political path toward self-rule without granting independence automatically."
 ywc_crisis.1.t:0 "Petition and Proposal: Renegotiating the Tributary Order"
 ywc_crisis.1.d:0 "Stage 1 of Renegotiating the Tributary Order. Shun and Jinghai debate a shared diplomatic style for the tributary order. Each participant decides for itself; the answers shape the settlement."
 ywc_crisis.1.a:0 "Propose reciprocal terms and share the cost of envoys and implementation."
 ywc_crisis.1.b:0 "Keep the existing hierarchy, gaining conservative support but raising the risk of rejection."
 ywc_crisis.2.t:0 "The Counterpart's Reply: Renegotiating the Tributary Order"
 ywc_crisis.2.d:0 "Stage 2 of Renegotiating the Tributary Order. The counterpart answers the proposal on tariffs and navigation rights. Each participant decides for itself; the answers shape the settlement."
 ywc_crisis.2.a:0 "Accept negotiations with conditions and demand concessions from the proposing side."
 ywc_crisis.2.b:0 "Reject the change and preserve the status quo, accepting more trade friction."
 ywc_crisis.3.t:0 "A Third-Party Response: Renegotiating the Tributary Order"
 ywc_crisis.3.d:0 "Stage 3 of Renegotiating the Tributary Order. Korea answers on its own behalf; Dongming may respond to the trade clauses. Each participant decides for itself; the answers shape the settlement."
 ywc_crisis.3.a:0 "Join on terms that preserve our sovereignty and existing obligations."
 ywc_crisis.3.b:0 "Decline or observe without a binding commitment."
 ywc_crisis.4.t:0 "Funding the Terms: Renegotiating the Tributary Order"
 ywc_crisis.4.d:0 "Stage 4 of Renegotiating the Tributary Order. The signatories review the envoy and tariff budgets. Each participant decides for itself; the answers shape the settlement."
 ywc_crisis.4.a:0 "Fund a practical agreement with market access and shared expenses. (Treasury cost: £1,200.)"
 ywc_crisis.4.b:0 "Narrow the promise to a low-cost declaration without changing trade."
 ywc_crisis.5.t:0 "The Crisis Point: Renegotiating the Tributary Order"
 ywc_crisis.5.d:0 "Stage 5 of Renegotiating the Tributary Order. The proposer handles rejection and domestic opposition. Each participant decides for itself; the answers shape the settlement."
 ywc_crisis.5.a:0 "Drop exclusive claims and preserve the practical terms to seek compromise."
 ywc_crisis.5.b:0 "Hold to the original demand and accept a higher risk of escalation."
 ywc_crisis.6.t:0 "Confirmation and Settlement: Renegotiating the Tributary Order"
 ywc_crisis.6.d:0 "Stage 6 of Renegotiating the Tributary Order. The actual signatories confirm the terms in turn. Each participant decides for itself; the answers shape the settlement."
 ywc_crisis.6.a:0 "Ratify the full agreement if consent, funding and relations make it workable. (Treasury cost: £1,200.)"
 ywc_crisis.6.b:0 "Accept a limited pact that resolves only the most practical issue. (Treasury cost: £600.)"
 ywc_crisis.6.c:0 "End negotiations and accept time-limited diplomatic and trade fallout."
