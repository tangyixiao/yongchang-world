l_english:
 ywc_shu.100.t:0 "Three Seats in Council"
 ywc_shu.100.d:0 "Shun must address Three Seats in Council. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_shu.100.a:0 "Give civil officials the right to audit: improve administration but anger military families."
 ywc_shu.100.b:0 "Keep seats for military service: gain local mobilization but make fiscal oversight harder."
 ywc_shu.101.t:0 "The Gentry's Grain Ledger"
 ywc_shu.101.d:0 "Shun must address The Gentry's Grain Ledger. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_shu.101.a:0 "Send officials to recheck the figures, paying the administrative and political cost. (Treasury cost: £5,000.)"
 ywc_shu.101.b:0 "Let local gentry self-report: save money now but weaken the court's grip on tax revenue."
 ywc_shu.102.t:0 "Arrears on the Frontier"
 ywc_shu.102.d:0 "Shun must address Arrears on the Frontier. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_shu.102.a:0 "Pay the garrisons in installments: incur debt but steady the troops. (Treasury cost: £5,000.)"
 ywc_shu.102.b:0 "Settle the arrears with local taxes: ease the treasury burden but widen local autonomy."
 ywc_shu.103.t:0 "An Audience for Sea Merchants"
 ywc_shu.103.d:0 "Shun must address An Audience for Sea Merchants. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_shu.103.a:0 "Grant a limited advisory seat: encourage trade but invite conservative opposition."
 ywc_shu.103.b:0 "Refuse the seat: preserve the old order but lose merchant support."
 ywc_shu.104.t:0 "The Yongchang Court Accord"
 ywc_shu.104.d:0 "Shun must address The Yongchang Court Accord. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_shu.104.a:0 "Publish duties and fiscal obligations; a binding accord requires real capacity to enforce it."
 ywc_shu.104.b:0 "Keep the temporary allocation: retain local support but postpone reform."
 ywc_shu.105.t:0 "The Customs Ledger"
 ywc_shu.105.d:0 "Shun must address The Customs Ledger. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_shu.105.a:0 "Create a unified audit: strengthen the center at added administrative cost."
 ywc_shu.105.b:0 "Let each port keep separate accounts: reduce costs but disperse revenue."
 ywc_shu.106.t:0 "Opium and Silver"
 ywc_shu.106.d:0 "Shun must address Opium and Silver. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_shu.106.a:0 "Enforce restrictions and find replacement revenue: accept a short-term loss."
 ywc_shu.106.b:0 "Delay restrictions: keep revenue for now and bear the social and political backlash."
 ywc_shu.107.t:0 "Jinghai's Merchant Fleet"
 ywc_shu.107.d:0 "Shun must address Jinghai's Merchant Fleet. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_shu.107.a:0 "Negotiate reciprocal tariffs: concede some customs revenue for shipping access."
 ywc_shu.107.b:0 "Raise tariffs unilaterally: increase income but intensify Jinghai's autonomy pressure."
 ywc_shu.108.t:0 "A Council of Scholars and Merchants"
 ywc_shu.108.d:0 "Shun must address A Council of Scholars and Merchants. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_shu.108.a:0 "Include merchants and local delegates: improve compliance but give up exclusive control."
 ywc_shu.108.b:0 "Keep decisions in the bureaucracy: centralize administration but provoke resistance."
 ywc_shu.109.t:0 "A Written Tariff Accord"
 ywc_shu.109.d:0 "Shun must address A Written Tariff Accord. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_shu.109.a:0 "Accept reciprocity and fiscal limits; stability depends on both sides meeting the terms."
 ywc_shu.109.b:0 "Collect high emergency tariffs: raise revenue quickly but leave trade and diplomatic debts."
 ywc_shu.110.t:0 "The Tributary Envoys"
 ywc_shu.110.d:0 "Shun must address The Tributary Envoys. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_shu.110.a:0 "Set out autonomy rights in writing: lower conflict but surrender some control."
 ywc_shu.110.b:0 "Keep the terms vague: preserve authority but accumulate doubts about compliance."
 ywc_shu.111.t:0 "Dispatches from Blackwater"
 ywc_shu.111.d:0 "Shun must address Dispatches from Blackwater. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_shu.111.a:0 "Share frontier costs: negotiate with neighbors and improve relations."
 ywc_shu.111.b:0 "Pay for the frontier alone: strengthen control but worsen the fiscal strain."
 ywc_shu.112.t:0 "The Western Courier Stations"
 ywc_shu.112.d:0 "Shun must address The Western Courier Stations. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_shu.112.a:0 "Establish paid transit and trade: cover the cost of protecting the route. (Treasury cost: £5,000.)"
 ywc_shu.112.b:0 "Rely on temporary military escorts: stay flexible but alarm neighboring states."
 ywc_shu.113.t:0 "Korea's Letter"
 ywc_shu.113.d:0 "Shun must address Korea's Letter. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_shu.113.a:0 "Use equal-trade language: ease Korean concerns but face conservative opposition."
 ywc_shu.113.b:0 "Insist on hierarchical ceremony: satisfy old factions but lose cooperation."
 ywc_shu.114.t:0 "Beyond the Realm"
 ywc_shu.114.d:0 "Shun must address Beyond the Realm. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_shu.114.a:0 "Recognize several sovereignties by treaty and bear the administrative cost."
 ywc_shu.114.b:0 "Press for integration: require real power and diplomatic support or accept a setback."
 ywc_jhg.100.t:0 "The Prince's Tribute Schedule"
 ywc_jhg.100.d:0 "Jinghai must address The Prince's Tribute Schedule. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_jhg.100.a:0 "Fix the tribute quota and seek recognition of autonomy: tighten the budget."
 ywc_jhg.100.b:0 "Keep tribute flexible: preserve fiscal room but invite suspicion from the suzerain."
 ywc_jhg.101.t:0 "The Council Audits Its Accounts"
 ywc_jhg.101.d:0 "Jinghai must address The Council Audits Its Accounts. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_jhg.101.a:0 "Open the accounts to the council: gain merchant support but limit the prince's spending."
 ywc_jhg.101.b:0 "Let the prince audit alone: act quickly but lose trust."
 ywc_jhg.102.t:0 "Naval Rotations"
 ywc_jhg.102.d:0 "Jinghai must address Naval Rotations. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_jhg.102.a:0 "Prioritize escort duty: protect shipping at the cost of maintenance and port work. (Treasury cost: £1,200.)"
 ywc_jhg.102.b:0 "Prioritize the home port: save military funds but weaken overseas credibility."
 ywc_jhg.103.t:0 "The Island Tax Accord"
 ywc_jhg.103.d:0 "Jinghai must address The Island Tax Accord. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_jhg.103.a:0 "Broaden the tax base and compensate merchants: accept short-term fiscal pressure."
 ywc_jhg.103.b:0 "Raise commercial taxes: gain revenue quickly but risk capital flight."
 ywc_jhg.104.t:0 "The Accord of Two Courts"
 ywc_jhg.104.d:0 "Jinghai must address The Accord of Two Courts. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_jhg.104.a:0 "Publish an auditable tribute and escort budget."
 ywc_jhg.104.b:0 "Keep the agreement ambiguous, exchanging future autonomy disputes for calm today."
 ywc_jhg.105.t:0 "A Letter from Lanfang"
 ywc_jhg.105.d:0 "Jinghai must address A Letter from Lanfang. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_jhg.105.a:0 "Offer escorts in return for trade rights: accept higher maintenance costs."
 ywc_jhg.105.b:0 "Sell insurance and supplies only: spend less but wield little influence."
 ywc_jhg.106.t:0 "The Closed Port of Luzon"
 ywc_jhg.106.d:0 "Jinghai must address The Closed Port of Luzon. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_jhg.106.a:0 "Escort both sides' merchant ships: protect trade but face diplomatic pressure."
 ywc_jhg.106.b:0 "Favor Dongming: gain a political ally but lose neutral shipping routes."
 ywc_jhg.107.t:0 "A Trading Post in Palau"
 ywc_jhg.107.d:0 "Jinghai must address A Trading Post in Palau. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_jhg.107.a:0 "Invest in a trading post and harbor only where real transport capacity exists. (Treasury cost: £1,200.)"
 ywc_jhg.107.b:0 "Sign a short-term anchorage lease: keep costs low but surrender control."
 ywc_jhg.108.t:0 "The Shipowners' Unpaid Bills"
 ywc_jhg.108.d:0 "Jinghai must address The Shipowners' Unpaid Bills. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_jhg.108.a:0 "Charge a uniform escort fee: protect the treasury but reduce trade."
 ywc_jhg.108.b:0 "Borrow from the prince's court: keep routes open but raise interest costs. (Treasury cost: £1,200.)"
 ywc_jhg.109.t:0 "The Maritime Accord"
 ywc_jhg.109.d:0 "Jinghai must address The Maritime Accord. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_jhg.109.a:0 "Limit duties to what the fleet can deliver and build a sustainable network."
 ywc_jhg.109.b:0 "Keep broad commitments: if capacity falls short, face a breach and backlash."
 ywc_jhg.110.t:0 "The Zheng Succession Council"
 ywc_jhg.110.d:0 "Jinghai must address The Zheng Succession Council. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_jhg.110.a:0 "Accept council oversight: gain merchant support but limit princely power."
 ywc_jhg.110.b:0 "Protect hereditary privilege: reassure old retainers but increase legitimacy pressure."
 ywc_jhg.111.t:0 "The Shun Fleet Order"
 ywc_jhg.111.d:0 "Jinghai must address The Shun Fleet Order. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_jhg.111.a:0 "Provide paid assistance and demand written guarantees."
 ywc_jhg.111.b:0 "Refuse the expedition: preserve the fleet but heighten autonomy disputes."
 ywc_jhg.112.t:0 "The Ports of the South Sea"
 ywc_jhg.112.d:0 "Jinghai must address The Ports of the South Sea. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_jhg.112.a:0 "Create an equal council: reduce direct control but build trust among partners."
 ywc_jhg.112.b:0 "Let Jinghai coordinate alone: act efficiently but risk partners leaving."
 ywc_jhg.113.t:0 "The Flag and the Mandate"
 ywc_jhg.113.d:0 "Jinghai must address The Flag and the Mandate. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_jhg.113.a:0 "Continue to recognize Shun in exchange for formal autonomy."
 ywc_jhg.113.b:0 "Seek a more independent status: bear diplomatic costs and suzerain opposition."
 ywc_jhg.114.t:0 "The Constitution of a Maritime State"
 ywc_jhg.114.d:0 "Jinghai must address The Constitution of a Maritime State. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_jhg.114.a:0 "Build a sea order supported by treaties, public finances and actual partners."
 ywc_jhg.114.b:0 "Keep limited island autonomy and withdraw protection promises that cannot be kept."
 ywc_dmg.100.t:0 "The Vigan Assembly"
 ywc_dmg.100.d:0 "Dongming must address The Vigan Assembly. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_dmg.100.a:0 "Grant local seats in the assembly: reduce the crown's unilateral power."
 ywc_dmg.100.b:0 "Offer advice without votes: preserve court efficiency but deepen discontent."
 ywc_dmg.101.t:0 "Two Tax Registers"
 ywc_dmg.101.d:0 "Dongming must address Two Tax Registers. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_dmg.101.a:0 "Unify the registers: pay for administrators and build trust."
 ywc_dmg.101.b:0 "Keep separate accounts: implement quickly but entrench privilege."
 ywc_dmg.102.t:0 "The Military Household Compact"
 ywc_dmg.102.d:0 "Dongming must address The Military Household Compact. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_dmg.102.a:0 "Open officer ranks locally: reform the army but lose old military support."
 ywc_dmg.102.b:0 "Keep hereditary military households: steady the frontier but weaken cooperation."
 ywc_dmg.103.t:0 "Church and Ancestral Hall"
 ywc_dmg.103.d:0 "Dongming must address Church and Ancestral Hall. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_dmg.103.a:0 "Allow parallel public rites: accept conservative backlash."
 ywc_dmg.103.b:0 "Set one court ritual: gain old retainers' support but reduce local identification."
 ywc_dmg.104.t:0 "A Common Citizenship"
 ywc_dmg.104.d:0 "Dongming must address A Common Citizenship. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_dmg.104.a:0 "Enact representation and tax rules if public funds and local support can sustain them."
 ywc_dmg.104.b:0 "Keep regional agreements and carry the legal dispute into the next chapter."
 ywc_dmg.105.t:0 "The Royal Seal"
 ywc_dmg.105.d:0 "Dongming must address The Royal Seal. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_dmg.105.a:0 "Share appointment authority: reduce old court retainers' power."
 ywc_dmg.105.b:0 "Keep appointments by royal decree: decide quickly but strengthen opposition."
 ywc_dmg.106.t:0 "Manila's Commercial Notes"
 ywc_dmg.106.d:0 "Dongming must address Manila's Commercial Notes. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_dmg.106.a:0 "Permit regulated investment: attract capital but increase dependence."
 ywc_dmg.106.b:0 "Restrict outside funds: preserve autonomy but go without construction capital."
 ywc_dmg.107.t:0 "The Luzon Militia"
 ywc_dmg.107.d:0 "Dongming must address The Luzon Militia. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_dmg.107.a:0 "Build local militia: improve defense but strengthen local power."
 ywc_dmg.107.b:0 "Expand the royal standing army: spend more but keep command centralized. (Treasury cost: £700.)"
 ywc_dmg.108.t:0 "Who Counts as a Local Citizen?"
 ywc_dmg.108.d:0 "Dongming must address Who Counts as a Local Citizen?. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_dmg.108.a:0 "Adopt equal qualifications: confront opposition from old groups."
 ywc_dmg.108.b:0 "Keep regional categories: preserve order but widen political divisions."
 ywc_dmg.109.t:0 "The State Assembly"
 ywc_dmg.109.d:0 "Dongming must address The State Assembly. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_dmg.109.a:0 "Choose a monarchy or republic that has legal and political support."
 ywc_dmg.109.b:0 "Delay fundamental reform: gain short-term stability but keep the dispute alive."
 ywc_dmg.110.t:0 "Villages Along the Truce Line"
 ywc_dmg.110.d:0 "Dongming must address Villages Along the Truce Line. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_dmg.110.a:0 "Negotiate a border market with Spanish consent."
 ywc_dmg.110.b:0 "Suppress smuggling: reduce diplomatic friction but harm local livelihoods."
 ywc_dmg.111.t:0 "A Spanish Note"
 ywc_dmg.111.d:0 "Dongming must address A Spanish Note. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_dmg.111.a:0 "Trade tariff concessions for access to a port."
 ywc_dmg.111.b:0 "Reject restrictions: preserve sovereignty but raise diplomatic risks."
 ywc_dmg.112.t:0 "Jinghai's Offer of Aid"
 ywc_dmg.112.d:0 "Dongming must address Jinghai's Offer of Aid. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_dmg.112.a:0 "Accept limited cooperation and bear the court's old resentment."
 ywc_dmg.112.b:0 "Keep an independent route: spend more to preserve diplomatic room."
 ywc_dmg.113.t:0 "Representatives of the Islands"
 ywc_dmg.113.d:0 "Dongming must address Representatives of the Islands. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_dmg.113.a:0 "Invite community delegates: build trust but increase administrative pressure."
 ywc_dmg.113.b:0 "Negotiate only with coastal elites: move quickly but provoke inland resistance."
 ywc_dmg.114.t:0 "The Luzon Charter"
 ywc_dmg.114.d:0 "Dongming must address The Luzon Charter. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_dmg.114.a:0 "Sign an enforceable agreement if defense and partners can support it."
 ywc_dmg.114.b:0 "Fall back to the north, keep the frontier alert and preserve the right to negotiate."
 ywc_nqg.100.t:0 "The Zhenhai Granary"
 ywc_nqg.100.d:0 "Northern Qing must address The Zhenhai Granary. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_nqg.100.a:0 "Build reserves and reduce military spending."
 ywc_nqg.100.b:0 "Keep the palace guard's rations: preserve prestige but worsen civilian hardship."
 ywc_nqg.101.t:0 "Old Manchu Retainers"
 ywc_nqg.101.d:0 "Northern Qing must address Old Manchu Retainers. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_nqg.101.a:0 "Set a ceiling on stipends: risk losing the old retainers' support."
 ywc_nqg.101.b:0 "Borrow to pay everyone: steady the court but worsen the treasury. (Treasury cost: £500.)"
 ywc_nqg.102.t:0 "The Island Hunting Grounds"
 ywc_nqg.102.d:0 "Northern Qing must address The Island Hunting Grounds. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_nqg.102.a:0 "Recognize shared management: accept lower land revenue."
 ywc_nqg.102.b:0 "Reserve land for the court: gain food in the short term but provoke resistance."
 ywc_nqg.103.t:0 "Ships from the Southern Port"
 ywc_nqg.103.d:0 "Northern Qing must address Ships from the Southern Port. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_nqg.103.a:0 "Offer low tariffs for supplies and accept dependence."
 ywc_nqg.103.b:0 "Keep high tariffs and exclusive rights: gain revenue now but limit trade."
 ywc_nqg.104.t:0 "Winter Decrees"
 ywc_nqg.104.d:0 "Northern Qing must address Winter Decrees. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_nqg.104.a:0 "Secure supply through real food stocks, public funds and market access."
 ywc_nqg.104.b:0 "Maintain an expensive exile court and accept a fragile outcome."
 ywc_nqg.105.t:0 "Charting the Strait"
 ywc_nqg.105.d:0 "Northern Qing must address Charting the Strait. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_nqg.105.a:0 "Invite a joint survey: reduce border misjudgments but admit outside involvement."
 ywc_nqg.105.b:0 "Survey alone: spend public funds to preserve autonomy."
 ywc_nqg.106.t:0 "Russian Timber Merchants"
 ywc_nqg.106.d:0 "Northern Qing must address Russian Timber Merchants. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_nqg.106.a:0 "Grant a time-limited lease for revenue and supplies."
 ywc_nqg.106.b:0 "Reject the lease: preserve the forests but lose investment."
 ywc_nqg.107.t:0 "Japanese Fishing Boats"
 ywc_nqg.107.d:0 "Northern Qing must address Japanese Fishing Boats. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_nqg.107.a:0 "Negotiate shared licenses through diplomacy."
 ywc_nqg.107.b:0 "Seize the boats: assert authority but risk conflict."
 ywc_nqg.108.t:0 "Envoys from Shun"
 ywc_nqg.108.d:0 "Northern Qing must address Envoys from Shun. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_nqg.108.a:0 "Sign a non-aggression and trade agreement, sacrificing some restoration prestige."
 ywc_nqg.108.b:0 "Refuse to accept the present reality: satisfy the court but lose room to trade."
 ywc_nqg.109.t:0 "The Strait Convention"
 ywc_nqg.109.d:0 "Northern Qing must address The Strait Convention. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_nqg.109.a:0 "Set port rules grounded in real treaties and harbor capacity."
 ywc_nqg.109.b:0 "If relations fail, withdraw to the island and accept lower trade."
 ywc_nqg.110.t:0 "The Next Generation of Banners"
 ywc_nqg.110.d:0 "Northern Qing must address The Next Generation of Banners. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_nqg.110.a:0 "Use schools and ports to train new officials, displacing hereditary posts."
 ywc_nqg.110.b:0 "Keep the old stipends: steady the court but leave a shortage of talent."
 ywc_nqg.111.t:0 "The Islanders' Assembly"
 ywc_nqg.111.d:0 "Northern Qing must address The Islanders' Assembly. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_nqg.111.a:0 "Create regional seats: build identification but lose old retainers' support."
 ywc_nqg.111.b:0 "Keep only clan councils: simplify administration but postpone assembly reform."
 ywc_nqg.112.t:0 "What Is the Dragon Banner For?"
 ywc_nqg.112.d:0 "Northern Qing must address What Is the Dragon Banner For?. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_nqg.112.a:0 "Limit dynastic memory to ceremony and reassure neighbors."
 ywc_nqg.112.b:0 "Keep mobilizing for restoration: gain prestige but harm trade and diplomacy."
 ywc_nqg.113.t:0 "Protection and Self-Determination"
 ywc_nqg.113.d:0 "Northern Qing must address Protection and Self-Determination. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_nqg.113.a:0 "Accept a time-limited guarantee and pay for investment rights."
 ywc_nqg.113.b:0 "Reject the guarantee: preserve autonomy but bear the cost of defense."
 ywc_nqg.114.t:0 "A Letter from the Island"
 ywc_nqg.114.d:0 "Northern Qing must address A Letter from the Island. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
 ywc_nqg.114.a:0 "Define a new national identity through real representation and survival capacity."
 ywc_nqg.114.b:0 "Keep the exile court and accept long-term dependence on outside aid."
 ywc_oir.100.t:0 "Winter Pasture Markers"
 ywc_oir.100.d:0 "Oirat must address Winter Pasture Markers. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_oir.100.a:0 "Let the khan's court survey the boundary: spend more on officials but reduce conflict."
 ywc_oir.100.b:0 "Let the banners negotiate: save money but make enforcement harder."
 ywc_oir.101.t:0 "The Pasture Transit Tax"
 ywc_oir.101.d:0 "Oirat must address The Pasture Transit Tax. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_oir.101.a:0 "Lower transit fees to encourage trade, accepting lower tax income."
 ywc_oir.101.b:0 "Keep high fees to raise revenue but push merchants onto detours."
 ywc_oir.102.t:0 "Cavalry of the Banners"
 ywc_oir.102.d:0 "Oirat must address Cavalry of the Banners. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_oir.102.a:0 "Set shared military contributions and improve coordination."
 ywc_oir.102.b:0 "Let each banner provide its own forces: preserve autonomy but risk imbalance."
 ywc_oir.103.t:0 "Mediation by the Monastery"
 ywc_oir.103.d:0 "Oirat must address Mediation by the Monastery. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_oir.103.a:0 "Invite religious mediation: gain peace but surrender some authority to judge."
 ywc_oir.103.b:0 "Let the khan's court decide: centralize power and invite opposition."
 ywc_oir.104.t:0 "The Banner League Charter"
 ywc_oir.104.d:0 "Oirat must address The Banner League Charter. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_oir.104.a:0 "Ratify the charter only if pasture rules and military contributions can be enforced."
 ywc_oir.104.b:0 "Keep a verbal compact and accept future succession risks."
 ywc_oir.105.t:0 "Warehouses in Ili"
 ywc_oir.105.d:0 "Oirat must address Warehouses in Ili. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_oir.105.a:0 "Build shared warehouses: spend public funds and improve market access."
 ywc_oir.105.b:0 "Grant a noble monopoly: save construction costs but weaken merchant competition."
 ywc_oir.106.t:0 "The Russian Border Market"
 ywc_oir.106.d:0 "Oirat must address The Russian Border Market. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
