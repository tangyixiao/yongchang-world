 ywc_nmg.109.t:0 "The Suzerainty Fiscal Accord"
 ywc_nmg.109.d:0 "New Ming must address The Suzerainty Fiscal Accord. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_nmg.109.a:0 "Conclude an agreement only with Mexico's consent and affordable shared costs."
