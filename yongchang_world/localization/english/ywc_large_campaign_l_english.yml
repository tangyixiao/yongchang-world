 ywc_nmg.100.t:0 "The Bilingual Petition"
 ywc_nmg.100.d:0 "New Ming must address The Bilingual Petition. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_nmg.100.a:0 "Provide bilingual government records: spend on administration and win public support."
 ywc_nmg.100.b:0 "Keep Spanish as the only official language: save money but strengthen autonomy advocates."
 ywc_nmg.101.t:0 "The Bay Land Register"
 ywc_nmg.101.d:0 "New Ming must address The Bay Land Register. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_nmg.101.a:0 "Create mixed land arbitration: improve stability but anger speculators."
 ywc_nmg.101.b:0 "Honor first-arrival contracts: protect investment but harm longtime residents."
 ywc_nmg.102.t:0 "Seats for Local Representatives"
 ywc_nmg.102.d:0 "New Ming must address Seats for Local Representatives. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_nmg.102.a:0 "Expand seats: improve cooperation but reduce old elites' control."
 ywc_nmg.102.b:0 "Keep a limited franchise: reduce resistance but leave representation weak."
 ywc_nmg.103.t:0 "Parish and Guild Schools"
 ywc_nmg.103.d:0 "New Ming must address Parish and Guild Schools. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_nmg.103.a:0 "Build shared schools with public funding and compromise. (Treasury cost: £600.)"
 ywc_nmg.103.b:0 "Let each community fund its own schools: save public money but deepen separation."
 ywc_nmg.104.t:0 "The New Ming Autonomy Statute"
 ywc_nmg.104.d:0 "New Ming must address The New Ming Autonomy Statute. The opening chapter tests whether institutions can share power without exhausting public funds or local support."
 ywc_nmg.104.a:0 "Enforce autonomy rules when law, administration and political support are real."
 ywc_nmg.104.b:0 "Run a limited pilot and keep the identity dispute open."
 ywc_nmg.105.t:0 "The Tax Bill from Mexico City"
 ywc_nmg.105.d:0 "New Ming must address The Tax Bill from Mexico City. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_nmg.105.a:0 "Negotiate a fixed share: stabilize relations but leave less local revenue."
 ywc_nmg.105.b:0 "Delay remittance to fund construction, increasing autonomy pressure."
 ywc_nmg.106.t:0 "The Coastal Battery"
 ywc_nmg.106.d:0 "New Ming must address The Coastal Battery. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_nmg.106.a:0 "Share costs with the suzerain through talks and tax revenue."
 ywc_nmg.106.b:0 "Build it alone: gain autonomy but increase debt."
 ywc_nmg.107.t:0 "Appointment of the Harbor Master"
 ywc_nmg.107.d:0 "New Ming must address Appointment of the Harbor Master. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_nmg.107.a:0 "Use joint appointments: gain stable execution but surrender authority."
 ywc_nmg.107.b:0 "Insist on local appointments: preserve autonomy but risk rejection."
 ywc_nmg.108.t:0 "Road Patrols"
 ywc_nmg.108.d:0 "New Ming must address Road Patrols. This chapter turns on fiscal and commercial capacity; the chosen arrangement must work through real markets and public funds."
 ywc_nmg.108.a:0 "Patrol together if both sides cooperate."
