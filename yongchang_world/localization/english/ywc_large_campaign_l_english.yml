 ywc_nmg.112.b:0 "Leave matters to the guilds: save money but deepen identity divisions."
 ywc_nmg.113.t:0 "A Declaration of Coastal Neutrality"
 ywc_nmg.113.d:0 "New Ming must address A Declaration of Coastal Neutrality. The final chapter tests the country's external standing; a durable settlement depends on resources, diplomacy and consent."
