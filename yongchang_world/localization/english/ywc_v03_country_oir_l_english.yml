 ywc_oir.1020.t:0 "One Caravan, Four Checkpoints"
 ywc_oir.1020.d:0 "Merchants submit ledgers of repeated tolls. The court proposes a single roll, chiefs seek a revenue share, and caravan leaders fear that separate banner tolls will keep raising the cost of passage."
 ywc_oir.1020.route_1:0 "Single customs roll"
 ywc_oir.1020.route_1.cost_tooltip:0 "Captured weekly base: annual gross income / 52, clamped to 100–1,000,000,000."
 ywc_oir.1020.route_1.consequence_tooltip:0 "Adopt a single roll; sustain offices, access and neutral relations with at least one of Shun or Russia, with landed and rural interests dividing over toll rights."
 ywc_oir.1020.route_2:0 "Shared toll revenue"
 ywc_oir.1020.route_2.cost_tooltip:0 "0.4 times the same weekly base; at low income, the fee can be below 100."
