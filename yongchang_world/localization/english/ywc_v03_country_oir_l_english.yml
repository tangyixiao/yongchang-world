 ywc_oir.1000.t:0 "Boundary Stones on the Seasonal Road"
 ywc_oir.1000.d:0 "The frontier governor presents a new tax map while herds follow old pasture roads; surveying, shared stewardship, and mediation each carry a cost."
 ywc_oir.1000.route_1:0 "Court survey"
 ywc_oir.1000.route_1.cost_tooltip:0 "1.5 times the captured weekly base: annual gross income / 52, clamped to 100–1,000,000,000."
 ywc_oir.1000.route_1.consequence_tooltip:0 "Choose the court survey; later patrols depend on offices, ranches, land law and local calm, and affect landed and rural interests."
 ywc_oir.1000.route_2:0 "Banner co-management"
 ywc_oir.1000.route_2.cost_tooltip:0 "Half of the same weekly base; at low income, the fee can be below 100."
 ywc_oir.1000.route_2.consequence_tooltip:0 "Let the banners manage boundaries; ranches and banner commitments must hold, with landed and rural interests sharing a voice."
 ywc_oir.1000.route_3:0 "Monastic mediation"
 ywc_oir.1000.route_3.cost_tooltip:0 "No treasury debit; require no default or bankruptcy, calm pasture disputes and continuing banner commitments."
 ywc_oir.1000.route_3.consequence_tooltip:0 "Use monastic mediation; calm the dispute while leaving boundaries ambiguous, favoring the devout over formal landed authority."
 ywc_oir.1000.defer:0 "Defer until the next ledger"
 ywc_oir.1000.defer.cost_tooltip:0 "No fee; the selected route is unchanged."
 ywc_oir.1000.defer.consequence_tooltip:0 "Keep the selected plan and existing expenditure; make no new commitment or final decision on the pasture compact."
 ywc_oir.1000.withdraw:0 "Withdraw from the compact"
 ywc_oir.1000.withdraw.cost_tooltip:0 "No fee; withdrawal closes the arc and releases its slot."
 ywc_oir.1000.withdraw.consequence_tooltip:0 "Withdraw the pasture compact as an unfulfilled obligation and end further review; money already spent is not refunded."
