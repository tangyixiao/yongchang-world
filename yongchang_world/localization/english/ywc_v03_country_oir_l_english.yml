 ywc_oir.1010.t:0 "How Many Horses Can Each Banner Supply?"
 ywc_oir.1010.d:0 "The quartermaster lays out the muster roll: central requisition, banner quotas, or old caps decide who pays and furnishes mounts."
 ywc_oir.1010.route_1:0 "Central requisition"
 ywc_oir.1010.route_1.cost_tooltip:0 "Captured weekly base: annual gross income / 52, clamped to 100–1,000,000,000."
 ywc_oir.1010.route_1.consequence_tooltip:0 "Fund central requisitions; sustain troops, offices, barracks, wages and the arms-market supply proxy, aiding the armed forces while alienating landlords. Army size means battalions: at least 7, excluding raised conscripts; all other fiscal and supply requirements remain."
 ywc_oir.1010.route_2:0 "Banner quotas"
 ywc_oir.1010.route_2.cost_tooltip:0 "0.6 times the same weekly base; at low income, the fee can be below 100."
 ywc_oir.1010.route_2.consequence_tooltip:0 "Divide obligations by banner; require fewer troops while retaining army-law, barracks and arms-supply checks, modestly aiding military and rural interests. Army size means battalions: at least 5, excluding raised conscripts; all other fiscal and supply requirements remain."
 ywc_oir.1010.route_3:0 "Capped old quotas"
 ywc_oir.1010.route_3.cost_tooltip:0 "No treasury debit; army-law, minimum troop and arms-market supply conditions still apply."
 ywc_oir.1010.route_3.consequence_tooltip:0 "Retain old caps without an extra grant; still require a minimum army and arms-market supply, with execution reducing wage costs and disappointing the armed forces. Army size means battalions: at least 2, excluding raised conscripts; all other fiscal and supply requirements remain."
 ywc_oir.1010.defer:0 "Defer until the next ledger"
 ywc_oir.1010.defer.cost_tooltip:0 "No fee; the selected route is unchanged."
 ywc_oir.1010.defer.consequence_tooltip:0 "Keep the selected plan and existing expenditure; make no new commitment or final decision on the common-supply compact."
