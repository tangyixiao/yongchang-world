l_english:
 ywc_nmg_request_market_autonomy: "Request control of the New Ming market"
 ywc_nmg_request_market_autonomy_desc: "Ask the actual Mexican overlord to let New Ming manage its own market. The existing fixed remittances and arrears remain due; leaving the shared market may disrupt trade and supplies. Mexico may refuse. The right ends if the pact is broken or the paid agreement ceases to qualify."
 ywc_nmg_request_market_autonomy_tooltip: "Request a Mexican response. If accepted, the right uses only the remaining original contract term; the existing remittances and arrears remain due. New Ming leaves the shared market, and either party may break the pact."
 ywc_nmg_mex_market_control: "New Ming market administration"
 ywc_nmg_mex_market_control_desc: "New Ming manages its own market while the agreed, current Mexican remittance contract and the direct subject relationship remain valid."
 ywc_nmg_mex_market_control_pact_desc: "New Ming administers its own market while its accepted fixed remittances remain current."
