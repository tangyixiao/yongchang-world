 ywc_je_v03_t05_land_development:0 "界绳之外的旧权利"
 ywc_je_v03_t05_land_development_reason:0 "卫拉特境内已有真实的矿山与农垦开发，旧用地上的牧户仍是具体的权利人，喀尔喀商人也提出了参与的价钱。勘测、补偿、水道与证人记录须逐项落纸，最后按记录定案。"
 ywc_society.1200.t:0 "勘测队的界绳"
 ywc_society.1200.d:0 "开发工地已经铺开，勘测队拉起了界绳。是否支付实地勘测费，把界绳拉在登记过旧用途的地册之上，还是只按官署图纸就地划线，现在就要决定。"
