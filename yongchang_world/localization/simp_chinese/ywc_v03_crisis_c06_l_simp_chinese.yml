l_simp_chinese:
 ywc_je_v03_c06_pass_two_orders:0 "山口上的两封命令"
 ywc_je_v03_c06_pass_two_orders_reason:0 "登记山道上确实相冲突的义务：大顺边务衙门的征役与缅京旧例的贡期各是一份命令。提案国逐项核对、向两边分别求得回书，单一合法安排时不虚构两属。"
 ywc_je_v03_c06_local_council_mandate:0 "地方议事的授权"
 ywc_je_v03_c06_local_council_mandate_reason:0 "回书到齐之后进入执行：贡茶折费、有限粮供或按村分摊，每一家承担自己的真实成本；联席会议由实际受牵连的地方国共议，谁有权代表、谁被落下，都要写进册子。"
 ywc_je_v03_c06_frontier_precedent_bounds:0 "边务旧例的新边界"
 ywc_je_v03_c06_frontier_precedent_bounds_reason:0 "执行与复议阶段检验旧例的边界：过境兵的冬粮、一枚印信能否两签、贸易与军事条款的分合，最后按各方实际落款与实付回写贡期之后的山路。"
