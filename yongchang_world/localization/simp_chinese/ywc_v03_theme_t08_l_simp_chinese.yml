 ywc_society.1357.d:0 "无论这一季结果如何，蜀地都要决定是否为下一次短缺立下章程：常平仓章程、对账衙署，或只留下拒绝的记录。外方账目缺失时，本地记录也可结案。"
 ywc_society.1357.charter_granary_rule:0 "支付 500 立常平仓章程"
 ywc_society.1357.charter_granary_rule.cost_tooltip:0 "蜀国国库支付 500。"
 ywc_society.1357.charter_granary_rule.consequence_tooltip:0 "接受结局在案；南国对蜀关系增加 5。"
 ywc_society.1357.confirm_acceptance:0 "只记录接受，不动国库"
 ywc_society.1357.confirm_acceptance.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1357.confirm_acceptance.consequence_tooltip:0 "接受结局在案，但无常平仓章程。"
 ywc_society.1357.fund_audit_office:0 "支付 300 设对账衙署"
 ywc_society.1357.fund_audit_office.cost_tooltip:0 "蜀国国库支付 300。"
 ywc_society.1357.fund_audit_office.consequence_tooltip:0 "有限结局在案，对账衙署记录在册。"
 ywc_society.1357.confirm_limited:0 "只记录有限安排"
 ywc_society.1357.confirm_limited.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1357.confirm_limited.consequence_tooltip:0 "有限结局在案，但不设对账衙署。"
