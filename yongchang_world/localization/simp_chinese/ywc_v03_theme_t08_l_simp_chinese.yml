 ywc_society.1357.record_refusal.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1357.record_refusal.consequence_tooltip:0 "拒绝结局在案；南国对蜀关系减少 5。"
 ywc_society.1357.close_local:0 "外方账目缺失，按本地记录结案"
 ywc_society.1357.close_local.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1357.close_local.consequence_tooltip:0 "已发过救济则按有限结局收束，否则按过期收束。"
 ywc_society.1357.wait:0 "暂缓，重新核对"
 ywc_society.1357.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1357.wait.consequence_tooltip:0 "记录本次决定。"
