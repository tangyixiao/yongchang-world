l_simp_chinese:
 ywc_je_v03_t08_grain_corridor:0 "危机越过市场边界"
 ywc_je_v03_t08_grain_corridor_reason:0 "粮价上涨越过市场边界：蜀地核对真实压力，向南国求购余粮，检疫、运输与账册决定救济能否公平到达，并为下一次短缺立下章程。"
 ywc_society.1350.t:0 "粮价先传来消息"
 ywc_society.1350.d:0 "蜀地市面上的粮价先于文书上涨。核对本地仓廪与市场行情之后，是否向确有余粮的邻国提出购买与运输安排，须由本地官署决定。"
 ywc_society.1350.seek_surplus:0 "向有余粮的邻国求购"
 ywc_society.1350.seek_surplus.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1350.seek_surplus.consequence_tooltip:0 "记录本次决定，等待南国核对余粮后答复。"
 ywc_society.1350.self_audit:0 "只清点本地仓廪，不求于外"
 ywc_society.1350.self_audit.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1350.self_audit.consequence_tooltip:0 "不向邻国求粮，本地记录拒绝外购的结局。"
 ywc_society.1350.wait:0 "暂缓，重新核对行情"
 ywc_society.1350.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1350.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1351.t:0 "邻国的余粮"
 ywc_society.1351.d:0 "南国核对自己的市场与仓廪，决定以何种条件放出余粮：按市价公开售予、限量配给，还是暂时不肯外运。条件会记入双方都能看到的簿册。"
 ywc_society.1351.offer_open_terms:0 "按市价公开售予余粮"
 ywc_society.1351.offer_open_terms.cost_tooltip:0 "无额外国库支出；粮价由市场决定。"
 ywc_society.1351.offer_open_terms.consequence_tooltip:0 "记录本次决定，蜀地须安排检疫或粮道。"
 ywc_society.1351.offer_limited_terms:0 "只限量放出余粮"
 ywc_society.1351.offer_limited_terms.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1351.offer_limited_terms.consequence_tooltip:0 "记录本次决定，蜀地须安排检疫或粮道。"
 ywc_society.1351.hold_back_surplus:0 "暂时不肯外运"
 ywc_society.1351.hold_back_surplus.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1351.hold_back_surplus.consequence_tooltip:0 "拒绝售粮的记录送抵蜀地，救济只能缩小规模。"
 ywc_society.1351.wait:0 "暂缓答复"
 ywc_society.1351.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1351.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1352.t:0 "码头上的检疫争议"
 ywc_society.1352.d:0 "粮道开到码头或山口，检疫与查验由谁执掌起了争议：有海路的走码头查验，内陆的走山口押运。朝鲜若以卫生规程闻名，其章程可被引用；吐蕃的山口商路亦可借道。关闭粮道同样是一种选择。"
 ywc_society.1352.charter_inspection:0 "支付 300 设码头查验"
 ywc_society.1352.charter_inspection.cost_tooltip:0 "蜀国国库支付 300。"
 ywc_society.1352.charter_inspection.consequence_tooltip:0 "记录本次决定，救济发放仍须安排。"
 ywc_society.1352.kor_standard:0 "支付 200 引用朝鲜卫生章程"
 ywc_society.1352.kor_standard.cost_tooltip:0 "蜀国国库支付 200。"
 ywc_society.1352.kor_standard.consequence_tooltip:0 "检疫章程记录在案；朝鲜的法律不会因此改变。"
 ywc_society.1352.tib_convoy:0 "支付 300 借道吐蕃山口押运"
 ywc_society.1352.tib_convoy.cost_tooltip:0 "蜀国国库支付 300。"
 ywc_society.1352.tib_convoy.consequence_tooltip:0 "记录本次决定；吐蕃的商路安排不变。"
 ywc_society.1352.inland_escort:0 "支付 300 自设山口押运"
 ywc_society.1352.inland_escort.cost_tooltip:0 "蜀国国库支付 300。"
 ywc_society.1352.inland_escort.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1352.waive_checks:0 "免检放行，先把粮运到"
 ywc_society.1352.waive_checks.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1352.waive_checks.consequence_tooltip:0 "免检记录在案，疫病风险由本地承担。"
 ywc_society.1352.close_corridor:0 "关闭粮道，停止购粮救济"
 ywc_society.1352.close_corridor.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1352.close_corridor.consequence_tooltip:0 "救济中止，码头与乡里出现不满。"
 ywc_society.1352.wait:0 "暂缓，重新核对"
 ywc_society.1352.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1352.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1353.t:0 "救济发到哪里"
 ywc_society.1353.d:0 "粮食到手只是开始。衙门决定按受灾州县精准发放、开仓平粜，还是只按户口配给。邻国若不肯外运，救济只能缩小规模，市面与乡里都会留下后果。"
 ywc_society.1353.targeted_relief:0 "支付 500 按受灾州县精准发放"
 ywc_society.1353.targeted_relief.cost_tooltip:0 "蜀国国库支付 500。"
 ywc_society.1353.targeted_relief.consequence_tooltip:0 "记录本次决定，等待南国核算运力。"
 ywc_society.1353.granary_release:0 "支付 300 开仓平粜"
 ywc_society.1353.granary_release.cost_tooltip:0 "蜀国国库支付 300。"
 ywc_society.1353.granary_release.consequence_tooltip:0 "记录本次决定，等待南国核算运力。"
 ywc_society.1353.ration_only:0 "只按户口配给"
 ywc_society.1353.ration_only.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1353.ration_only.consequence_tooltip:0 "缩减救济；若邻国拒售余粮，乡里出现不满。"
 ywc_society.1353.halt_relief:0 "停发救济"
 ywc_society.1353.halt_relief.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1353.halt_relief.consequence_tooltip:0 "救济中止，乡里出现不满。"
 ywc_society.1353.wait:0 "暂缓，重新核对"
 ywc_society.1353.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1353.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1354.t:0 "援助的运输账"
 ywc_society.1354.d:0 "南国的船帮核算运力：现银结算、记账赊运，还是拒绝承运。账目记在南国的簿册上，也抄送蜀地一份；赊运的欠账不会自动消失。"
 ywc_society.1354.settle_silver:0 "支付 600 现银结算运力"
 ywc_society.1354.settle_silver.cost_tooltip:0 "南国国库支付 600；不向蜀地转款。"
 ywc_society.1354.settle_silver.consequence_tooltip:0 "记录本次决定，等待蜀地对账。"
 ywc_society.1354.carry_on_credit:0 "记账赊运"
 ywc_society.1354.carry_on_credit.cost_tooltip:0 "无额外国库支出；欠账记入簿册。"
 ywc_society.1354.carry_on_credit.consequence_tooltip:0 "赊运记录在案，成为日后借贷条件的凭据。"
 ywc_society.1354.refuse_transport:0 "拒绝承运"
 ywc_society.1354.refuse_transport.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1354.refuse_transport.consequence_tooltip:0 "拒绝记录送抵蜀地；对账仍须进行。"
 ywc_society.1354.wait:0 "暂缓答复"
 ywc_society.1354.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1354.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1355.t:0 "受助者要求公开账册"
 ywc_society.1355.d:0 "蜀地要求南国公开运输与价格的账册：全部公开、部分公开，或放弃核对。账册公开到什么程度，决定下一季的合作条件；没有运到的援助也要对账。"
 ywc_society.1355.open_ledger:0 "要求全公开账册"
 ywc_society.1355.open_ledger.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1355.open_ledger.consequence_tooltip:0 "记录本次决定，等待南国收获之后的答复。"
 ywc_society.1355.partial_ledger:0 "只核对部分账册"
 ywc_society.1355.partial_ledger.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1355.partial_ledger.consequence_tooltip:0 "记录本次决定，等待南国收获之后的答复。"
 ywc_society.1355.refuse_ledger:0 "放弃对账"
 ywc_society.1355.refuse_ledger.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1355.refuse_ledger.consequence_tooltip:0 "放弃核对的记录在案；南国仍须答复救济是否继续。"
 ywc_society.1355.wait:0 "暂缓，重新核对"
 ywc_society.1355.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1355.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1356.t:0 "收获之后还要救济吗"
 ywc_society.1356.d:0 "新粮入库之后，南国重读双方簿册：若蜀地公开了账册且国库允许，可继续整季救济；也可以按季限量，或就此撤手。两个国家各留一份记录。"
 ywc_society.1356.continue_relief:0 "支付 400 继续整季救济"
 ywc_society.1356.continue_relief.cost_tooltip:0 "南国国库支付 400；不向蜀地转款。"
 ywc_society.1356.continue_relief.consequence_tooltip:0 "记录本次决定，等待蜀地为下一次短缺立章。"
 ywc_society.1356.seasonal_terms:0 "按季限量继续"
 ywc_society.1356.seasonal_terms.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1356.seasonal_terms.consequence_tooltip:0 "记录本次决定，等待蜀地为下一次短缺立章。"
 ywc_society.1356.wind_down:0 "就此撤手"
 ywc_society.1356.wind_down.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1356.wind_down.consequence_tooltip:0 "撤手记录送抵蜀地，两国各自保留制度与储备。"
 ywc_society.1356.wait:0 "暂缓答复"
 ywc_society.1356.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1356.wait.consequence_tooltip:0 "记录本次决定。"
