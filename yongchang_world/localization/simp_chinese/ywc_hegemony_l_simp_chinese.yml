 ywc_kor.202.b:0 "转而入贡：遣使谢罪，补行贡礼"
 ywc_lan.200.t:0 "万里奉贡"
 ywc_lan.200.d:0 "大顺诏使远航至坤甸，请兰芳入贡籍。总厅议事：万里输贡所费不赀，然荷兰窥伺在侧，大顺之名分或有其实。"
 ywc_lan.200.a:0 "岁贡金砂，请大顺商照护海路"
 ywc_lan.200.b:0 "先立商约，贡籍缓议"
 ywc_lan.200.c:0 "总厅议决：公司之政不奉朝贡旧礼"
