 ywc_nqg.200.t:0 "岛上接诏"
 ywc_nqg.200.d:0 "诏使渡海而至，请北清去帝号、入贡籍。流亡朝廷为之分裂：体面已不可复得，生计却不可不继。"
 ywc_nqg.200.a:0 "去尊号，岁贡海产，换取互市与不打之谊"
 ywc_nqg.200.b:0 "以“未奉正朔已三世”为辞，迁延不答"
 ywc_nqg.200.c:0 "朝廷决议：残明年号犹在，不奉新朔"
