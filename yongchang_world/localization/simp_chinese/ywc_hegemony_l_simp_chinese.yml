 ywc_nmg.200.t:0 "跨洋之诏"
 ywc_nmg.200.d:0 "大顺诏使跨太平洋而至，请新明入贡籍。海湾议事会两难：旧国之名分或可借力，然墨西哥必疑——两个宗主之间，无处容身。"
 ywc_nmg.200.a:0 "奉贡入籍，同时照会墨西哥以安其心"
 ywc_nmg.200.b:0 "以“须与墨西哥相商”为辞，暂搁"
 ywc_nmg.200.c:0 "议事会决：属邦之身不奉二朝"
