l_simp_chinese:
 ywc_hegemony.1.t:0 "颁行新制"
 ywc_hegemony.1.d:0 "三章既毕，大顺诏告天下：设朝贡新籍——入籍者互市通商、海路受护，贡额有度；不入籍者，不得沾天朝之利。诏书未出，各方探子已快马出京。"
 ywc_hegemony.1.a:0 "颁宽仁之诏：以利相诱，不迫人以威"
 ywc_hegemony.1.b:0 "颁威严之诏：顺者嘉之，逆者必问"
 ywc_hegemony.2.t:0 "四方震动"
 ywc_hegemony.2.d:0 "诏使四出，奏报先后入京——有欣然请籍者，有托辞观望者，亦有婉拒不奉者。天宪初行，回应之姿将定此后十年之局。"
 ywc_hegemony.2.a:0 "广施恩信：不论顺逆，使者皆厚待之"
 ywc_hegemony.2.b:0 "张威慑止：顺者嘉奖，观望者限期"
 ywc_hegemony.3.t:0 "酬顺之政"
 ywc_hegemony.3.d:0 "入籍各国使团齐集京师。酬庸之策：普施互市，则费帑而众悦；择亲厚赏，则省费而恩私。"
 ywc_hegemony.3.a:0 "互市普施：凡入籍者皆得商照与水师照应"
 ywc_hegemony.3.b:0 "择亲厚赏：贡额重者优先"
 ywc_hegemony.4.t:0 "问罪逆藩"
 ywc_hegemony.4.d:0 "拒诏之国，使书置而不答。天宪既颁，岂容轻慢——然问罪之方，利钝各异。"
 ywc_hegemony.4.a:0 "孤立锁市：禁其商路，绝其互市"
 ywc_hegemony.4.b:0 "陈兵耀武：大阅于边，示威于海"
 ywc_hegemony.5.t:0 "朝会天宪"
 ywc_hegemony.5.d:0 "观望之国使节皆至。是收权一统，定朝贡为定制；还是共治分权，以宗盟之名行其实——天命在此一举。"
 ywc_hegemony.5.a:0 "收权一统：贡籍朝籍皆出天朝，不容分享"
 ywc_hegemony.5.b:0 "共治分权：设同盟之约，共守海陆商路"
 ywc_hegemony.6.t:0 "天命所归"
 ywc_hegemony.6.d:0 "新制行世数年，顺逆之势已明。是定于一尊，还是留个未竟之局——史笔在此。"
 ywc_hegemony.6.a:0 "定于一尊：天命所归，朝贡为定制"
 ywc_hegemony.6.b:0 "接受受挫：新制有名无实，徐图再举"
 ywc_hegemony.6.c:0 "承认崩解：权威扫地，天下各行其是"
 ywc_jhg.200.t:0 "贡使再至"
 ywc_jhg.200.d:0 "大顺诏使再抵王府，新制要求靖海岁贡定额、船籍听册，换取互市与水师照应。旧约之上的新名分，王府与商议会各有盘算。"
 ywc_jhg.200.a:0 "确认岁贡，船籍入册，请互市如约"
 ywc_jhg.200.b:0 "以旧约未满为辞，先观各国动向"
 ywc_jhg.200.c:0 "商议会决：船籍册报有违自治旧约，婉拒新制"
 ywc_jhg.201.t:0 "顺者之昌"
 ywc_jhg.201.d:0 "贡籍既入，互市渐开。使团再至，问的是加贡请封，还是谨守本分——昌名之下，各有价码。"
 ywc_jhg.201.a:0 "加贡请封：岁贡倍之，请开水陆互市全权"
 ywc_jhg.201.b:0 "谨守本分：按例输贡，不别有所请"
 ywc_jhg.202.t:0 "逆者之亡"
 ywc_jhg.202.d:0 "拒诏之后，商路受阻、使节难行，市面渐见萧条。是硬抗到底，还是转圜入贡——体面与生计，只可择一。"
 ywc_jhg.202.a:0 "硬抗到底：闭境自守，不惧问罪"
 ywc_jhg.202.b:0 "转而入贡：遣使谢罪，补行贡礼"
 ywc_kor.200.t:0 "册使之来"
 ywc_kor.200.d:0 "大顺册使渡江而来，请朝鲜入新朝贡籍、用新正朔。朝堂之上，事大与自主之争再起；儒臣引经据典，各执一端。"
 ywc_kor.200.a:0 "奉表用朔，岁贡如例"
 ywc_kor.200.b:0 "以“礼当从长”为辞，先遣问安使"
 ywc_kor.200.c:0 "朝议决：自立之名分不可轻授"
