 ywc_dmg.200.t:0 "隔海之诏"
 ywc_dmg.200.d:0 "大顺诏使经南洋而至，请东明入贡籍。吕宋朝堂多有迟疑：西班牙的炮舰就在马尼拉湾，奉贡之名能否护住这片海？"
 ywc_dmg.200.a:0 "奉贡入籍，兼修武备以防不测"
 ywc_dmg.200.b:0 "以南洋航路未决为辞，暂缓答诏"
 ywc_dmg.200.c:0 "朝议决：西怒不可招，贡籍不奉"
 ywc_dmg.201.t:0 "顺者之昌"
