 ywc_mgl.200.t:0 "南使北信"
 ywc_mgl.200.d:0 "大顺诏使与俄方信使先后至库伦。入贡则南路互市大开，拒之则北路或有相保之约——草原两属之难，摆在王公与寺院面前。"
 ywc_mgl.200.a:0 "奉贡入籍，南路互市为重"
 ywc_mgl.200.b:0 "两部会议未决，先以骏马答使"
 ywc_mgl.200.c:0 "盟旗共誓：草原之主不称臣"
