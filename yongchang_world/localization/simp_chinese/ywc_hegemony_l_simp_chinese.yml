 ywc_tib.200.t:0 "高原奉诏"
 ywc_tib.200.d:0 "诏使入藏，请入贡籍、定茶马新则。僧俗两会详议：名分可奉，然茶税与驻使之权，须另立条款。"
 ywc_tib.200.a:0 "奉贡入籍，另订茶马条款"
 ywc_tib.200.b:0 "以“政教之事须共议”为辞，缓答"
 ywc_tib.200.c:0 "两会决：高原之政不由外籍"
 ywc_tib.201.t:0 "顺者之昌"
