 ywc_oir.200.t:0 "汗廷之择"
 ywc_oir.200.d:0 "大顺以天命自居，请卫拉特称臣入贡。汗廷之议：先祖未尝称臣于顺，然伊犁财路半系南路，拒诏恐失其半。"
 ywc_oir.200.a:0 "奉贡称臣，互市照旧"
 ywc_oir.200.b:0 "以“盟约未集”为辞，遣使缓颊"
 ywc_oir.200.c:0 "汗廷决：可通商，不称臣"
