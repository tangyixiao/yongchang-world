 ywc_je_eternal_yongchang:0 "永昌未竟之业"
 ywc_je_eternal_yongchang_reason:0 "大顺必须在庞大的疆域、旧有秩序与新式生产之间寻找新的平衡。"
 ywc_je_jinghai_autonomy:0 "靖海自治"
 ywc_je_jinghai_autonomy_reason:0 "靖海国拥有自己的财政、军队与海贸网络，但仍处于大顺宗藩秩序之内。"
 ywc_je_dongming_survival:0 "孤悬海外"
 ywc_je_dongming_survival_reason:0 "东明需要在西班牙的领土主张、本地社会与明裔政治传统之间求生。"
 ywc_je_blackwater_century:0 "黑水世纪"
 ywc_je_blackwater_century_reason:0 "北清必须在库页岛的多族社会、海岛交通与复国记忆之间建立新国家。"
 ywc_bootstrap.1.t:0 "大顺的未竟之业"
 ywc_bootstrap.1.d:0 "天下的旧秩序仍然稳固，但财政、军政与生产方式已经开始要求新的答案。"
 ywc_bootstrap_1.a:0 "让我们从整顿内部开始。"
 ywc_bootstrap.2.t:0 "靖海的海风"
 ywc_bootstrap.2.d:0 "海贸、宗藩与自治的边界需要在新的世纪重新谈判。"
 ywc_bootstrap_2.a:0 "守住自治，也守住航路。"
 ywc_bootstrap.3.t:0 "东明的边界"
 ywc_bootstrap.3.d:0 "西班牙的主张仍在，东明必须依靠自己的军民与港口生存。"
 ywc_bootstrap_3.a:0 "先让东明活下去。"
 ywc_bootstrap.4.t:0 "黑水新局"
 ywc_bootstrap.4.d:0 "库页岛上的族群与旧王朝记忆共同塑造着北清的道路。"
 ywc_bootstrap_4.a:0 "在寒潮中建立秩序。"
