 ywc_crisis.1000.d:0 "使团出发之前，旧约抄本与如今的关税、市场与账期对不上。提案国要逐项核对：谁仍称宗主，谁已自主任命官署，谁的市场与预算各自独立；已自主之邦不再写作必然属邦。"
