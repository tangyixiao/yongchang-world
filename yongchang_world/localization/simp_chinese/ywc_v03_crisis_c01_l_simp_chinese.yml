l_simp_chinese:
 ywc_je_v03_c01_envoy_roster_and_treaties:0 "使节名单与旧约"
 ywc_je_v03_c01_envoy_roster_and_treaties_reason:0 "核对旧约里仍然有效的当事者与条款：谁是宗主、谁已自主、市场与预算各自如何承担，再决定谁有资格签署新的安排。"
 ywc_je_v03_c01_who_pays_the_world:0 "谁来支付天下"
 ywc_je_v03_c01_who_pays_the_world_reason:0 "使团、官署与港口检查都要从当前收入开支；每一家拟签国先付账、后签约，无钱者缩减条款，不赊欠也不预支。"
 ywc_je_v03_c01_rites_into_daily:0 "名分写入日常"
 ywc_je_v03_c01_rites_into_daily_reason:0 "履约阶段的关税、额外军费与期限都要在日常账目里检验：守约者留名，失约者如实记败，名分随实付而立废。"
