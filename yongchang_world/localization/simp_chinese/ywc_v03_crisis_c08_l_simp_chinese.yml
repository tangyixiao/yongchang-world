 ywc_crisis.1708.t:0 "先审一案，再谈通则"
 ywc_crisis.1708.d:0 "到了立规矩的时候：为本案设单案仲裁，主权在手但一案一审走得慢；提出判决互认，走得快但要有现成的登记、送达与执行班子；或者只保留本地法庭，不谈通则。提案由口岸提出，外部国自行答复。"
