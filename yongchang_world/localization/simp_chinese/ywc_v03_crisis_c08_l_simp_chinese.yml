 ywc_crisis.1707.t:0 "保护要求的附带条件"
 ywc_crisis.1707.d:0 "外部国的援助送到了附带条件的关口：把援助绑定排他商权，或去掉条件照单援助，或干脆撤回照会；管辖口岸对条件另行作答——接受条件、拒绝附带条件，或暂缓。两个答复各自记账，谁也不能替对方签。"
