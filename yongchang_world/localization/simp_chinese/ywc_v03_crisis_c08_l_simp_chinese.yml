 ywc_crisis.1703.public_trial.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1703.public_trial.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1703.limited_joint_session:0 "为本案设有限会审，外部列席有限"
 ywc_crisis.1703.limited_joint_session.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1703.limited_joint_session.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1703.refuse_external:0 "拒绝外部裁判，只认本地程序"
 ywc_crisis.1703.refuse_external.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1703.refuse_external.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1703.wait:0 "暂缓，再议管辖"
 ywc_crisis.1703.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1703.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1704.t:0 "翻译、证人与路费"
 ywc_crisis.1704.d:0 "程序要花钱，钱只能来自各自预算：翻译聘本地实际可用的语言人手，证人的路费按实报销，小国库先办这一案。两边各自记账，谁也不能把程序开销摊给对方。"
