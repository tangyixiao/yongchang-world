 ywc_crisis.1706.d:0 "领事馆外聚起了人群：有递状纸的，有只求见领事一面的，也有堵门的。口岸按现行集会章程处置：接收合法申诉，或按公共秩序限缩集会，或把诉求转入正在进行的谈判；读的是实际的政治权利与运动，不是想象中的秩序。"
 ywc_crisis.1706.receive_petitions:0 "接收合法申诉，登记造册"
