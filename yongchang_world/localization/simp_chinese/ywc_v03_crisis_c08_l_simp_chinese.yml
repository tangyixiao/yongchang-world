l_simp_chinese:
 ywc_je_v03_c08_protection_eligibility:0 "谁有资格请求保护"
 ywc_je_v03_c08_protection_eligibility_reason:0 "谁在这起沿岸案件里真正有资格请求保护，要靠身份与联系来回答：管辖口岸的真实人口待遇、船籍登记与来往航路先查清，跨海的保护要求按本国预算独立作答，有真实航路、市场或外交往来的伙伴各自记录立场；民族或宗教相近从不是自动干预的许可。"
 ywc_je_v03_c08_court_consul_boundary:0 "法庭与领事的边界"
 ywc_je_v03_c08_court_consul_boundary_reason:0 "管辖与协助各归各位：法庭按公开审理、有限会审或拒绝外部裁判独立答复，双方各自用自己的预算承担翻译、证人与路费，居留待遇依现行法律办理；外部国若把援助绑定商权，管辖国另行接受或拒绝，任何一方都不得替他国默认同意。"
 ywc_je_v03_c08_protection_promise_settlement:0 "保护承诺的归宿"
 ywc_je_v03_c08_protection_promise_settlement_reason:0 "承诺最终落在纸面与实践中：单案仲裁或互认的安排由两家分别确认，居民的去留选择如实记录，判决执行与援助兑现按实际清点；拒绝、退出与履约失败同样入册，未决事项留给正常游戏继续。"
 ywc_crisis.1700.t:0 "两种身份证明"
 ywc_crisis.1700.d:0 "同一批沿岸居民，在户口册、船籍登记与航路日志上各有各的记法。管辖口岸要逐项核对：谁住在本地、哪条船挂哪一国旗、与外部的真实来往是航路、市场还是外交接触；先查清身份，再谈保护。"
 ywc_crisis.1700.full_registry_review:0 "逐项核对户口、船籍与航路"
 ywc_crisis.1700.full_registry_review.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1700.full_registry_review.consequence_tooltip:0 "审查范围入册，作为后续安置与裁判的底册。"
 ywc_crisis.1700.ship_and_crew_focus:0 "只核船籍与船员名册，陆地另议"
 ywc_crisis.1700.ship_and_crew_focus.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1700.ship_and_crew_focus.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1700.wait:0 "暂缓，重核身份册"
 ywc_crisis.1700.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1700.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1701.t:0 "保护者不止一个"
 ywc_crisis.1701.d:0 "要求保护的声音不止一种：住在口岸的居民谈的是入籍与日常差别，海外谈的是领事照会与援助，商人谈的是航线与货栈。把三种诉求分开登记，不让任何一国把整个社群写成自己的代理人。"
 ywc_crisis.1701.separate_local_claims:0 "居民诉求按本地民事登记，领事诉求单独递送"
 ywc_crisis.1701.separate_local_claims.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1701.separate_local_claims.consequence_tooltip:0 "诉求分类入册；照会送外部保护要求方独立作答。"
 ywc_crisis.1701.route_through_note:0 "一律经外部照会转交，本地诉求并入附页"
 ywc_crisis.1701.route_through_note.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1701.route_through_note.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1701.merchant_separate:0 "商人利益与保护诉求分册，互不捆绑"
 ywc_crisis.1701.merchant_separate.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1701.merchant_separate.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1701.wait:0 "暂缓，再分诉求"
 ywc_crisis.1701.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1701.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1702.t:0 "跨海递来的照会"
 ywc_crisis.1702.d:0 "跨海而来的保护照会摆上桌面。外部国按自己的预算与国内章程作答：出一笔法律援助并承担汇兑，或只派有限代表列席，或声明不介入；答与不答都记在自己名下，不替口岸代答。"
 ywc_crisis.1702.fund_legal_aid:0 "支付法律援助（200），照会正式递达"
 ywc_crisis.1702.fund_legal_aid.cost_tooltip:0 "本国国库支付 200，直接汇入管辖口岸国库。"
 ywc_crisis.1702.fund_legal_aid.consequence_tooltip:0 "援助到账记入口岸名下；双方转入各自的筹资程序。"
 ywc_crisis.1702.limited_representation:0 "只派有限代表列席，不出资金"
 ywc_crisis.1702.limited_representation.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1702.limited_representation.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1702.declare_non_intervention:0 "声明不介入，撤回保护要求"
 ywc_crisis.1702.declare_non_intervention.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1702.declare_non_intervention.consequence_tooltip:0 "外部国以主动退出结案；口岸的国内程序照常进行。"
 ywc_crisis.1702.wait:0 "暂缓答复"
 ywc_crisis.1702.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1702.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1703.t:0 "本地法庭的管辖答复"
 ywc_crisis.1703.d:0 "法庭对管辖权本身作答：按现行法公开审理，或为这一案设有限会审，或拒绝外部裁判、只认本地程序。答复是口岸自己的；外部国是否接受，由外部国另行决定，法庭不代任何一方默认同意。"
