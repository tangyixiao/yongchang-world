l_simp_chinese:
 ywc_je_v03_t03_migration_diaspora:0 "隔海家书与本地生活"
 ywc_je_v03_t03_migration_diaspora_reason:0 "东明的人手渡海南下，兰芳的会馆代收家书与回款。东明核对真实外迁的人手、他们在两地册籍上的生计与待遇，决定这条跨海通道如何立册、如何收束。"
 ywc_society.1100.t:0 "一封招工家书"
 ywc_society.1100.d:0 "一封招工家书经靖海的商栈转进东明官署：落款是新明的同乡和兰芳矿上的管工，字里行间是工钱、船期，和村中谁家又空了一张凳。东明须核对写与收的两端——实际要人的一方是否立得住册，离乡的人是否仍有原籍的册籍可依。"
 ywc_society.1100.examine:0 "核对两地人手与册籍"
 ywc_society.1100.examine.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1100.examine.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1100.refuse_recruit:0 "封存家书，拒绝招募"
 ywc_society.1100.refuse_recruit.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1100.refuse_recruit.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1100.wait:0 "暂缓，重新核对"
 ywc_society.1100.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1100.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1101.t:0 "离乡者的地契"
 ywc_society.1101.d:0 "渡海的人留下田契、屋基与未了的赋役。东明的土地册与地方土地线牵在同一本账上：是替他们收执地契、按年记册，还是任由田土归于亲邻。已收执的契券不会在复议时再收一次钱。"
 ywc_society.1101.register:0 "支付 500 收执地契并立移民册"
 ywc_society.1101.register.cost_tooltip:0 "东明国库支付 500。"
 ywc_society.1101.register.consequence_tooltip:0 "地契收执入册，登记册移交兰芳会馆答复。"
 ywc_society.1101.reuse:0 "沿用已收执的地契记录"
 ywc_society.1101.reuse.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1101.reuse.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1101.decline:0 "不收执，田土任其自便"
 ywc_society.1101.decline.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1101.decline.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1101.wait:0 "暂缓，重新核对"
 ywc_society.1101.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1101.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1102.t:0 "会馆和村社的请求"
 ywc_society.1102.d:0 "兰芳的会馆与本地村社联名呈请：侨工自设的会馆求一个立案的名分，村社求的是两造共议的规矩——不是谁并入谁，而是各守各的册、各交各的税。兰芳可以支付 800 承认立案，也可以不立案而只默许集会与共议。"
 ywc_society.1102.charter:0 "支付 800 承认会馆立案"
 ywc_society.1102.charter.cost_tooltip:0 "兰芳国库支付 800。"
 ywc_society.1102.charter.consequence_tooltip:0 "会馆立案并回复东明，两端各留记录。"
 ywc_society.1102.reuse:0 "沿用已立案的会馆"
 ywc_society.1102.reuse.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1102.reuse.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1102.tolerate:0 "不立案，仅默许集会与共议"
 ywc_society.1102.tolerate.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1102.tolerate.consequence_tooltip:0 "不立案而默许共议，回复东明。"
 ywc_society.1102.wait:0 "暂缓答复"
 ywc_society.1102.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1102.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1103.t:0 "回款要经过哪座港"
 ywc_society.1103.d:0 "回款下南洋易，回乡难：走靖海的商栈要贴水与保费，直汇的侨批快却遇风浪即断。东明与兰芳各记各的账，实际过手的是靖海的船行——已付的保费与贴水不会重复计收。"
 ywc_society.1103.port_jhg:0 "支付 400，走靖海商栈转汇"
 ywc_society.1103.port_jhg.cost_tooltip:0 "东明国库支付 400。"
 ywc_society.1103.port_jhg.consequence_tooltip:0 "回款经靖海转汇，记录移交兰芳。"
 ywc_society.1103.reuse:0 "沿用已付的转汇保费"
 ywc_society.1103.reuse.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1103.reuse.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1103.direct:0 "侨批直汇，不经中转"
 ywc_society.1103.direct.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1103.direct.consequence_tooltip:0 "按现有条件直汇，记录移交兰芳。"
 ywc_society.1103.stop:0 "止付回款，只通家书"
 ywc_society.1103.stop.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1103.stop.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1103.wait:0 "暂缓，重新核对"
 ywc_society.1103.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1103.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1104.t:0 "第二代的姓名"
 ywc_society.1104.d:0 "生在矿上的孩子到了记名的年纪。兰芳的民册、村社的名册与东明的原籍册各有一套写法：入本地民册要完一份公民的钱粮，另立附册则保住原音原名。第二代的身份由此定调，两边都要留档。"
 ywc_society.1104.register_local:0 "支付 600，第二代记入本地民册"
 ywc_society.1104.register_local.cost_tooltip:0 "兰芳国库支付 600。"
 ywc_society.1104.register_local.consequence_tooltip:0 "第二代入本地民册，两端留档。"
 ywc_society.1104.reuse:0 "沿用已记入的民册"
 ywc_society.1104.reuse.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1104.reuse.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1104.keep_names:0 "保留原籍姓名，另立附册"
 ywc_society.1104.keep_names.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1104.keep_names.consequence_tooltip:0 "原音原名入附册，两端留档。"
 ywc_society.1104.wait:0 "暂缓答复"
 ywc_society.1104.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1104.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1105.t:0 "故乡遇到难年"
 ywc_society.1105.d:0 "故里报来灾荒：田亩失收，义仓见底。东明可以支付 500 设灾册、雇船传信，请兰芳的会馆代募义捐；也可以只许私人家书求助，官府不具印。灾情是真的，求援的路径必须是通的。"
 ywc_society.1105.appeal:0 "支付 500，设灾册并正式求援"
 ywc_society.1105.appeal.cost_tooltip:0 "东明国库支付 500。"
 ywc_society.1105.appeal.consequence_tooltip:0 "灾册立档，正式求援移交兰芳会馆。"
 ywc_society.1105.limited_letter:0 "只许私信求助，官府不具印"
 ywc_society.1105.limited_letter.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1105.limited_letter.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1105.wait:0 "暂缓，重新核对"
 ywc_society.1105.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1105.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1106.t:0 "留下或归去的选择"
 ywc_society.1106.d:0 "去留的选择摆在两代人与两地官册之间。东明可以请兰芳会馆合议去留与输粟的名额；可以让人手留驻、回款与家书照通；也可以拒绝后续招募，只作家书往来。若兰芳已不可联系，东明自行结案；已付的求援费用不退。"
 ywc_society.1106.consult:0 "请兰芳会馆合议去留"
 ywc_society.1106.consult.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1106.consult.consequence_tooltip:0 "合议之名移交兰芳，两端记录去留条款。"
 ywc_society.1106.stay_local:0 "让侨工留驻，回款家书照通"
 ywc_society.1106.stay_local.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1106.stay_local.consequence_tooltip:0 "有限接受：人手留驻而通道照通，两端留档。"
 ywc_society.1106.refuse_channel:0 "拒绝后续招募，仅保家书"
 ywc_society.1106.refuse_channel.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1106.refuse_channel.consequence_tooltip:0 "拒绝后续招募，仅存音信之谊。"
 ywc_society.1106.alone:0 "对方已不可联系，东明自行结案"
 ywc_society.1106.alone.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1106.alone.consequence_tooltip:0 "已立求援通道则按有限接济结案，否则记录为中断。"
 ywc_society.1106.wait:0 "暂缓，重新核对"
 ywc_society.1106.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1106.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1107.t:0 "会馆账本移交之后"
 ywc_society.1107.d:0 "会馆的账本摊在两造面前：义捐的船期、按名造册的赈米、与村社共议的税额。兰芳可以把账本移交、支付 1000 义捐并承认侨社自立；也可以保留账本，只记条款不输分文。两条路都要写进东明的结局册。"
 ywc_society.1107.hand_over:0 "移交账本，支付 1000 义捐"
 ywc_society.1107.hand_over.cost_tooltip:0 "兰芳国库支付 1000；不向东明转款。"
 ywc_society.1107.hand_over.consequence_tooltip:0 "兰芳对东明关系增加 5，侨社自立入册。"
 ywc_society.1107.reserve:0 "保留账本，记录条款不输捐"
 ywc_society.1107.reserve.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1107.reserve.consequence_tooltip:0 "兰芳对东明关系减少 5，条款照录。"
 ywc_society.1107.wait:0 "暂缓答复"
 ywc_society.1107.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1107.wait.consequence_tooltip:0 "记录本次决定。"
