l_simp_chinese:
 ywc_je_v03_nmg_land_arbitration:0 "海湾地簿与旧村"
 ywc_je_v03_nmg_land_arbitration_reason:0 "旧村按祖界，移民按新契。设混合法庭、推统一地契或保住旧界，三条路都要真付一次开庭费，再以真在岗官署与真实土地法承接。六个月观察决定成败，受阻满十二个月提示、三十六个月给退出。"
 ywc_je_v03_nmg_land_settlement:0 "地籍册的最后一页"
 ywc_je_v03_nmg_land_settlement_reason:0 "地权已经写进册子，剩下的是税、迁入与结算。按真实税源与官署承载推进，把结果写死在国家账本上，然后让出名额。"
 ywc_nmg.1000.t:0 "海湾地簿"
 ywc_nmg.1000.d:0 "旧村按祖界耕作，移民按新契开垦，两套凭据在同一个官署里互相否定。地方议员要一个说法，华墨社群愿意出钱，朱氏仪礼房只问谁的名册算数。三条路都要真金白银。"
 ywc_nmg.1000.mixed:0 "设混合仲裁庭"
 ywc_nmg.1000.mixed.cost_tooltip:0 "选择本路时支付立案费：年总收入÷52（至少100）；同轮各方案费用相同。后续若有新费用，会在对应选择处另行说明。"
 ywc_nmg.1000.mixed.consequence_tooltip:0 "混合法庭使官署行政力下降2点，持续十年。"
 ywc_nmg.1000.unified:0 "推行统一地契"
 ywc_nmg.1000.unified.cost_tooltip:0 "选择本路时支付立案费：年总收入÷52（至少100）；同轮各方案费用相同。后续若有新费用，会在对应选择处另行说明。"
 ywc_nmg.1000.unified.consequence_tooltip:0 "长期税基最清，书吏下乡会得罪旧界持有者。"
 ywc_nmg.1000.old:0 "保障旧区、缩小试点"
 ywc_nmg.1000.old.cost_tooltip:0 "选择本路时支付立案费：年总收入÷52（至少100）；同轮各方案费用相同。后续若有新费用，会在对应选择处另行说明。"
 ywc_nmg.1000.old.consequence_tooltip:0 "旧界持有人满意，新城扩张受阻。"
 ywc_nmg.1000.wait_for_funds:0 "等待资金"
 ywc_nmg.1000.wait_for_funds.cost_tooltip:0 "不新增费用"
 ywc_nmg.1000.wait_for_funds.consequence_tooltip:0 "保留当前选择，资金充足时再重试。"
 ywc_nmg.1001.t:0 "混合法庭第一次开庭"
 ywc_nmg.1001.d:0 "三名旧村长老、两名移民代表和一名官署书吏坐定。第一件案子就卡住：移民拿出的地契盖着已经撤并的县印。判下去，两边都有人不服。"
 ywc_nmg.1001.rule_register:0 "照现行登记判"
 ywc_nmg.1001.rule_register.cost_tooltip:0 "不另收费。"
 ywc_nmg.1001.rule_register.consequence_tooltip:0 "移民得地，旧村记恨；执行需要真在岗官署。"
 ywc_nmg.1001.rule_custom:0 "照祖界旧例判"
 ywc_nmg.1001.rule_custom.cost_tooltip:0 "不另收费，但积压增加。"
 ywc_nmg.1001.rule_custom.consequence_tooltip:0 "旧村稳住，地籍册留下大量未决条目。"
 ywc_nmg.1001.defer:0 "休庭，等补录旧档"
 ywc_nmg.1001.defer.cost_tooltip:0 "不扣费。"
 ywc_nmg.1001.defer.consequence_tooltip:0 "不结案，动荡继续累积。"
 ywc_nmg.1002.t:0 "书吏下乡核验"
 ywc_nmg.1002.d:0 "书吏带着测绳、印泥和一本薄薄的名册下乡。旧村把界桩挪了半尺，移民在地契背面又添了一行。核验必须逐块完成，缺人缺钱就断在半路。"
 ywc_nmg.1002.finish_survey:0 "补足人手，一次核完"
 ywc_nmg.1002.finish_survey.cost_tooltip:0 "再付一份等额核验费。"
 ywc_nmg.1002.finish_survey.consequence_tooltip:0 "地籍册一次成型，短期财政明显吃紧。"
 ywc_nmg.1002.half_survey:0 "只核近郊"
 ywc_nmg.1002.half_survey.cost_tooltip:0 "不另收费。"
 ywc_nmg.1002.half_survey.consequence_tooltip:0 "远郊留白，日后还要再跑一趟。"
 ywc_nmg.1002.defer:0 "暂停，等官署补齐"
 ywc_nmg.1002.defer.cost_tooltip:0 "不扣费。"
 ywc_nmg.1002.defer.consequence_tooltip:0 "核验停摆，移民继续占地。"
 ywc_nmg.1003.t:0 "旧界桩与新村给排水"
 ywc_nmg.1003.d:0 "旧界桩保住了，新村规划却只能画在半张纸上。地方议员要求至少把水源和道路划进去，华墨社群愿意自筹修渠——只要官署承认他们的地。"
 ywc_nmg.1003.keep_old:0 "维持旧界，新村缓办"
 ywc_nmg.1003.keep_old.cost_tooltip:0 "不再收费。"
 ywc_nmg.1003.keep_old.consequence_tooltip:0 "旧界持有人满意，新城扩张长期受阻。"
 ywc_nmg.1003.canal_deal:0 "以修渠换承认"
 ywc_nmg.1003.canal_deal.cost_tooltip:0 "社群自筹，不占国库。"
 ywc_nmg.1003.canal_deal.consequence_tooltip:0 "教区与社群得利，旧界持有人视之为让步。"
 ywc_nmg.1003.defer:0 "搁置规划"
 ywc_nmg.1003.defer.cost_tooltip:0 "不扣费。"
 ywc_nmg.1003.defer.consequence_tooltip:0 "争议不解决，只是推迟。"
 ywc_nmg.1004.t:0 "迁入人口与地籍册"
 ywc_nmg.1004.d:0 "移民还在往海湾来，地籍册还没合上。移民法一收紧，来的人立刻变少；官署人手不足，册子就停在上一页。这里的每个数字都会被下一份税单读到。"
 ywc_nmg.1004.keep_recording:0 "继续登记，不加限制"
 ywc_nmg.1004.keep_recording.cost_tooltip:0 "不另收费。"
 ywc_nmg.1004.keep_recording.consequence_tooltip:0 "人口与条目同增，短期动荡上升。"
 ywc_nmg.1004.slow_intake:0 "暂缓放号"
 ywc_nmg.1004.slow_intake.cost_tooltip:0 "不扣费。"
 ywc_nmg.1004.slow_intake.consequence_tooltip:0 "官署压力下降，等待中的移民不满。"
 ywc_nmg.1004.defer:0 "留待下月"
 ywc_nmg.1004.defer.cost_tooltip:0 "不扣费。"
 ywc_nmg.1004.defer.consequence_tooltip:0 "册子继续积压。"
 ywc_nmg.1005.t:0 "新村给水与地税"
 ywc_nmg.1005.d:0 "渠修到一半，地税册还没定稿。议员想先按旧额征一年，社群想按新垦亩数算，教区只要维持济贫。三种算法，换算成三种税率。"
 ywc_nmg.1005.old_assessment:0 "先按旧额征"
 ywc_nmg.1005.old_assessment.cost_tooltip:0 "不另收费。"
 ywc_nmg.1005.old_assessment.consequence_tooltip:0 "征收顺利，税基改良推迟。"
 ywc_nmg.1005.new_assessment:0 "按新垦亩数征"
 ywc_nmg.1005.new_assessment.cost_tooltip:0 "不另收费，需真在岗官署执行。"
 ywc_nmg.1005.new_assessment.consequence_tooltip:0 "长期税基更清，短期阻力更大。"
 ywc_nmg.1005.defer:0 "押后再议"
 ywc_nmg.1005.defer.cost_tooltip:0 "不扣费。"
 ywc_nmg.1005.defer.consequence_tooltip:0 "税册继续悬空。"
 ywc_nmg.1006.t:0 "六个月的地籍"
 ywc_nmg.1006.d:0 "六个月过去，官署是否仍在岗、田亩是否仍有收成、移民是否仍被挡在门外，决定这条路线站不站得住。任何一项断了，前面的钱就白花。"
 ywc_nmg.1006.hold_route:0 "维持既有安排"
 ywc_nmg.1006.hold_route.cost_tooltip:0 "不另收费。"
 ywc_nmg.1006.hold_route.consequence_tooltip:0 "路线继续；真实条件跌破时由月度复核记录受阻。"
 ywc_nmg.1006.renegotiate:0 "就地重议"
 ywc_nmg.1006.renegotiate.cost_tooltip:0 "不另收费。"
 ywc_nmg.1006.renegotiate.consequence_tooltip:0 "条款放宽，回报相应缩水。"
 ywc_nmg.1006.defer:0 "再等一个季度"
 ywc_nmg.1006.defer.cost_tooltip:0 "不扣费。"
 ywc_nmg.1006.defer.consequence_tooltip:0 "观察期延长，机会成本上升。"
 ywc_nmg.1007.t:0 "海湾地权的结算"
 ywc_nmg.1007.d:0 "结算日到了。地籍册抄本一份进宫署，一份进教区档案，一份交给地方议员。旧村的界桩仍立在原处，移民的渠已经见水，账要一次算清。"
 ywc_nmg.1007.settle_full:0 "按既定条款结清"
 ywc_nmg.1007.settle_full.cost_tooltip:0 "已付费用即为结算额。"
 ywc_nmg.1007.settle_full.consequence_tooltip:0 "写入完成结果并释放名额。"
 ywc_nmg.1007.settle_partial:0 "分年摊还"
 ywc_nmg.1007.settle_partial.cost_tooltip:0 "当年只出旧额的一半。"
 ywc_nmg.1007.settle_partial.consequence_tooltip:0 "旧界保护继续保留；首次选择会开始新的六个月观察，观察成熟后再次确认才记录折中并释放名额。"
 ywc_nmg.1007.withdraw:0 "拒绝结算"
 ywc_nmg.1007.withdraw.cost_tooltip:0 "已付费用不退。"
 ywc_nmg.1007.withdraw.consequence_tooltip:0 "写入受挫结果并释放名额。"
 ywc_nmg.1007.wait_retry:0 "等待并重新核验"
 ywc_nmg.1007.wait_retry.cost_tooltip:0 "不新增费用"
 ywc_nmg.1007.wait_retry.consequence_tooltip:0 "目标失格时清除旧观察成熟度，保留合同并等待重试。"
 ywc_je_v03_nmg_bilingual_office:0 "一份公文，两种语言"
 ywc_je_v03_nmg_bilingual_office_reason:0 "双语常设、地方译员或单一官文加申诉。都要真付开办费，双语还需真识字率与在岗官署。六个月后看告示栏，识字没起色就得改路线，改不动就受挫。"
 ywc_nmg.1010.t:0 "一份公文，两种语言"
 ywc_nmg.1010.d:0 "官署贴出第一份告示，华墨社群读不懂上头的西班牙文，朱氏仪礼房读不懂下头的汉文。教区愿意腾出侧厅当读报处，但要官署承认教区的调解权。三条路，三本账。"
 ywc_nmg.1010.bilingual:0 "设双语常设官署"
 ywc_nmg.1010.bilingual.cost_tooltip:0 "选择本路时支付一次立案费：年总收入÷52（至少100）。后续全额名册或其他新增费用会在对应选择处另行说明；地方文书路的行政负担较低。"
 ywc_nmg.1010.bilingual.consequence_tooltip:0 "识字与接受度上升，官僚效率下降。"
 ywc_nmg.1010.local:0 "外包给地方译员"
 ywc_nmg.1010.local.cost_tooltip:0 "选择本路时支付一次立案费：年总收入÷52（至少100）。后续全额名册或其他新增费用会在对应选择处另行说明；地方文书路的行政负担较低。"
 ywc_nmg.1010.local.consequence_tooltip:0 "成本可控，覆盖不均；边远村镇仍读不懂。"
 ywc_nmg.1010.single:0 "单一官文，另设申诉"
 ywc_nmg.1010.single.cost_tooltip:0 "选择本路时支付一次立案费：年总收入÷52（至少100）。后续全额名册或其他新增费用会在对应选择处另行说明；地方文书路的行政负担较低。"
 ywc_nmg.1010.single.consequence_tooltip:0 "接受度下降，动荡风险上升。"
 ywc_nmg.1010.wait_for_funds:0 "等待资金"
 ywc_nmg.1010.wait_for_funds.cost_tooltip:0 "不新增费用"
 ywc_nmg.1010.wait_for_funds.consequence_tooltip:0 "保留当前选择，资金充足时再重试。"
 ywc_nmg.1011.t:0 "译员的名单"
 ywc_nmg.1011.d:0 "名单摊在桌上：三名教会学堂出身的青年、两名港市商行雇的抄写员，还有一位只会说不会写的旧村塾师。官署缺的不是意愿，是能同时写下两种文字的人。"
 ywc_nmg.1011.hire_full:0 "全数录用"
 ywc_nmg.1011.hire_full.cost_tooltip:0 "再付一份等额薪饷。"
 ywc_nmg.1011.hire_full.consequence_tooltip:0 "覆盖完整，短期财政吃紧。"
 ywc_nmg.1011.hire_thin:0 "只录前三名"
 ywc_nmg.1011.hire_thin.cost_tooltip:0 "不另收费。"
 ywc_nmg.1011.hire_thin.consequence_tooltip:0 "主城够用，乡下仍靠口传。"
 ywc_nmg.1011.defer:0 "名单押后"
 ywc_nmg.1011.defer.cost_tooltip:0 "不扣费。"
 ywc_nmg.1011.defer.consequence_tooltip:0 "告示继续只有一种语言。"
 ywc_nmg.1012.t:0 "士绅与教区的态度"
 ywc_nmg.1012.d:0 "地方议员担心双语官署让外来商行占了便宜，教区担心官署抢走调解权，朱氏仪礼房只关心名册上还写不写汉字。谁点头，谁就能让这道命令落地或者悬在半空。"
 ywc_nmg.1012.court_parish:0 "让教区参与"
 ywc_nmg.1012.court_parish.cost_tooltip:0 "不另收费。"
 ywc_nmg.1012.court_parish.consequence_tooltip:0 "合法性与接受度上升，教区影响力扩大。"
 ywc_nmg.1012.court_council:0 "让议员监督"
 ywc_nmg.1012.court_council.cost_tooltip:0 "不另收费。"
 ywc_nmg.1012.court_council.consequence_tooltip:0 "账目更清楚，官署手脚被束。"
 ywc_nmg.1012.defer:0 "两边都不表态"
 ywc_nmg.1012.defer.cost_tooltip:0 "不扣费。"
 ywc_nmg.1012.defer.consequence_tooltip:0 "命令悬空，识字进展停滞。"
 ywc_nmg.1013.t:0 "学堂与官署的衔接"
 ywc_nmg.1013.d:0 "双语官署要人，学堂要钱。教育投入不足时，官署只能不断从港市商行借人，借来的人先认商行、后认官署。这笔账会一直算到下一任主事。"
 ywc_nmg.1013.fund_schools:0 "加拨教育经费"
 ywc_nmg.1013.fund_schools.cost_tooltip:0 "常设教育投入即为此项成本。"
 ywc_nmg.1013.fund_schools.consequence_tooltip:0 "识字增长更快，官署不必再借人。"
 ywc_nmg.1013.borrow_staff:0 "继续向商行借人"
 ywc_nmg.1013.borrow_staff.cost_tooltip:0 "当期不花钱。"
 ywc_nmg.1013.borrow_staff.consequence_tooltip:0 "外来资本影响加深，官署效率受制。"
 ywc_nmg.1013.defer:0 "先维持现状"
 ywc_nmg.1013.defer.cost_tooltip:0 "不扣费。"
 ywc_nmg.1013.defer.consequence_tooltip:0 "缺口留到明年。"
 ywc_nmg.1014.t:0 "六个月后的告示栏"
 ywc_nmg.1014.d:0 "六个月过去，告示栏前读报的人多了还是少了，官署自己算得出来。若识字没有起色，这条路线就得改；若官署已经无人可派，改也改不动。"
 ywc_nmg.1014.keep_route:0 "维持现有安排"
 ywc_nmg.1014.keep_route.cost_tooltip:0 "不另收费。"
 ywc_nmg.1014.keep_route.consequence_tooltip:0 "条件跌破时由月度复核记录受阻。"
 ywc_nmg.1014.switch_local:0 "改走地方译员"
 ywc_nmg.1014.switch_local.cost_tooltip:0 "已付费用不退。"
 ywc_nmg.1014.switch_local.consequence_tooltip:0 "成本下降，覆盖率下降。"
 ywc_nmg.1014.withdraw:0 "撤回官署"
 ywc_nmg.1014.withdraw.cost_tooltip:0 "已付费用不退。"
 ywc_nmg.1014.withdraw.consequence_tooltip:0 "写入受挫结果并释放名额。"
 ywc_nmg.1015.t:0 "归档：两种文字的土地"
 ywc_nmg.1015.d:0 "最后一卷公文归档。社群的名册、教区的调解记录、议员的监督簿，都要在这里定下去留。写完这一笔，双语官署或者成为常制，或者退回一张告示。"
 ywc_nmg.1015.close_full:0 "定为常制"
 ywc_nmg.1015.close_full.cost_tooltip:0 "不另收费。"
 ywc_nmg.1015.close_full.consequence_tooltip:0 "写入完成结果并释放名额。"
 ywc_nmg.1015.close_partial:0 "降为临时"
 ywc_nmg.1015.close_partial.cost_tooltip:0 "不另收费。"
 ywc_nmg.1015.close_partial.consequence_tooltip:0 "借用单语名册继续运作；首次选择会开始新的六个月观察，观察成熟后再次确认才记录折中并释放名额。"
 ywc_nmg.1015.withdraw:0 "撤回官署"
 ywc_nmg.1015.withdraw.cost_tooltip:0 "已付费用不退。"
 ywc_nmg.1015.withdraw.consequence_tooltip:0 "写入受挫结果并释放名额。"
 ywc_nmg.1015.wait_retry:0 "等待并重新核验"
 ywc_nmg.1015.wait_retry.cost_tooltip:0 "不新增费用"
 ywc_nmg.1015.wait_retry.consequence_tooltip:0 "目标失格时清除旧观察成熟度，保留合同并等待重试。"
 ywc_je_v03_nmg_revenue_opening:0 "墨城税单与本地预算"
 ywc_je_v03_nmg_revenue_opening_reason:0 "开账：固定分担、共同项目或旧额拖欠。先真读属邦关系与宗主态度，再把税源、防务与官署底账对上。本段只开账，不谈条款。"
 ywc_je_v03_nmg_revenue_negotiation:0 "谈判：条款与回文"
 ywc_je_v03_nmg_revenue_negotiation_reason:0 "谈判：据实压价还是接受宗主底价，取决于真实两国关系与财政能力。共同项目需真建筑与真出资，拖欠则什么都写不下来。"
 ywc_je_v03_nmg_revenue_settlement:0 "结算：尾数与欠项"
 ywc_je_v03_nmg_revenue_settlement_reason:0 "结算：把当年的汇单、工料账与营房名册并成一卷。尾数认下来还是记成争议，直接改动真实外交关系。归档后让出名额。"
 ywc_nmg.1020.t:0 "墨城税单"
 ywc_nmg.1020.d:0 "新明审议税务与港防账目：固定分担须询问真实墨西哥宗主国；共同项目可明确选择墨西哥或靖海及分担比例。也可选择旧额欠账或纯本地方案。选择须支付一次立案费；已签义务不会因换方案消失。"
 ywc_nmg.1020.fixed:0 "改为固定分担"
 ywc_nmg.1020.fixed.cost_tooltip:0 "除一次立案费外，如墨西哥接受，60 个月内每月汇款一次；月额为立案费除以 30 后向下取整。未付到期款保留为欠款。"
