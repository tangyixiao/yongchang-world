l_simp_chinese:
 ywc_je_v03_t11_roads_post_information:0 "驿路尽头的邻段"
 ywc_je_v03_t11_roads_post_information_reason:0 "喀尔喀台站的过境文书屡屡迟误，通往卫拉特方向的干线各段都要真实的人手、驿马与款项才能接通。本朝先按时代与已有技艺在旧驿、铁路与电线之间择路整修，再与卫拉特核验台站、土地与商信诸务，最后商定由谁岁修这条共同线路；拒绝或有限接受也是有效的结局。"
 ywc_society.1500.t:0 "迟到的命令"
 ywc_society.1500.d:0 "一纸调令在路上走了两个月才到台站。台站缺少人手与驿马，通往卫拉特方向的干线各段都需先核账：国库、已有铁路与线路技艺决定本段先修什么。"
 ywc_society.1500.restore:0 "付 500 整修本段驿路台站"
 ywc_society.1500.restore.cost_tooltip:0 "喀尔喀国库支付 500。"
 ywc_society.1500.restore.consequence_tooltip:0 "旧驿先行，邻国接到接通本段的决定。"
 ywc_society.1500.railway:0 "付 800 接通已有铁路的一段"
 ywc_society.1500.railway.cost_tooltip:0 "喀尔喀国库支付 800；不凭空添建铁路，只接已有路段。"
 ywc_society.1500.railway.consequence_tooltip:0 "铁路段入线，邻国接到接通本段的决定。"
 ywc_society.1500.telegraph:0 "付 800 沿线架设电报线"
 ywc_society.1500.telegraph.cost_tooltip:0 "喀尔喀国库支付 800。"
 ywc_society.1500.telegraph.consequence_tooltip:0 "电文先行，邻国接到接通本段的决定。"
 ywc_society.1500.wait:0 "暂缓，重新核账"
 ywc_society.1500.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1500.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1501.t:0 "邻国愿意接通的一段"
 ywc_society.1501.d:0 "喀尔喀整修本段的消息传到卫拉特。卫拉特官署先要核对自家台站是否可堪衔接，然后决定出资修衔接段、只修到交界，还是不予接通；无论答复如何，喀尔喀的台站勘验都不会停摆。"
 ywc_society.1501.connect:0 "付 400 修本国衔接段"
 ywc_society.1501.connect.cost_tooltip:0 "卫拉特国库支付 400；不向喀尔喀转款。"
 ywc_society.1501.connect.consequence_tooltip:0 "衔接段成行，喀尔喀收到答复并续勘台站。"
 ywc_society.1501.limited:0 "本国只修到交界"
 ywc_society.1501.limited.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1501.limited.consequence_tooltip:0 "只接交界，喀尔喀收到有限答复并续勘台站。"
 ywc_society.1501.decline:0 "不予接通，各行其驿"
 ywc_society.1501.decline.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1501.decline.consequence_tooltip:0 "拒绝接通；喀尔喀收到拒绝记录，后续只在自段办理。"
 ywc_society.1501.wait:0 "暂缓答复"
 ywc_society.1501.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1501.wait.consequence_tooltip:0 "记录本次决定；悬而不决逾半年，线路将作过期收束。"
 ywc_society.1501.withdraw:0 "对方已另行办理，撤回此议"
 ywc_society.1501.withdraw.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1501.withdraw.consequence_tooltip:0 "撤回本国答复，仅清理本次挂起记录。"
 ywc_society.1502.t:0 "邮驿由谁检查"
 ywc_society.1502.d:0 "本段驿路要立定例：台站的文书、马匹与账目由谁查。本旗可以自勘，也可以请卫拉特台员会同勘验；勘验记录两边都要能翻到。"
 ywc_society.1502.own_office:0 "由本旗台站自勘"
 ywc_society.1502.own_office.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1502.own_office.consequence_tooltip:0 "自勘入档，进入线路占地一项。"
 ywc_society.1502.joint:0 "请对方台员会同勘验"
 ywc_society.1502.joint.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1502.joint.consequence_tooltip:0 "会同勘验记双份，两边档册各存一页。"
 ywc_society.1502.wait:0 "暂缓，重新核对"
 ywc_society.1502.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1502.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1503.t:0 "线路占用的土地"
 ywc_society.1503.d:0 "线路要过牧户的冬营地与田亩。给价、改线都要真金白银；若本段接的是铁路，也可征用基址但须逐段录册。若对方已不予接通，此后只在自段办理。"
 ywc_society.1503.compensate:0 "付 300 按亩给价"
 ywc_society.1503.compensate.cost_tooltip:0 "喀尔喀国库支付 300。"
 ywc_society.1503.compensate.consequence_tooltip:0 "占地给价入册，线路推进到替代路线或商信一项。"
 ywc_society.1503.reroute:0 "付 200 改线绕开田亩"
 ywc_society.1503.reroute.cost_tooltip:0 "喀尔喀国库支付 200。"
 ywc_society.1503.reroute.consequence_tooltip:0 "改线避开田亩，线路推进到替代路线或商信一项。"
 ywc_society.1503.requisition:0 "付 500 征用铁路基址并录册"
 ywc_society.1503.requisition.cost_tooltip:0 "喀尔喀国库支付 500；仅在本段已接铁路时可择。"
 ywc_society.1503.requisition.consequence_tooltip:0 "基址征用记入档册，线路推进到替代路线或商信一项。"
 ywc_society.1503.wait:0 "暂缓，重新核对"
 ywc_society.1503.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1503.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1504.t:0 "停运时的替代路线"
 ywc_society.1504.d:0 "开春大雪，线路中段停运，过境商货压在两头。相关两国各有一半责任：卫拉特可以出钱修本国便道分运，也可以停运本段、改回旧驿；答复都会记入双方档册。"
 ywc_society.1504.divert:0 "付 200 修本国便道分运"
 ywc_society.1504.divert.cost_tooltip:0 "卫拉特国库支付 200。"
 ywc_society.1504.divert.consequence_tooltip:0 "便道分运成行，喀尔喀收到答复并进入商信一项。"
 ywc_society.1504.close:0 "本段停运，改回旧驿"
 ywc_society.1504.close.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1504.close.consequence_tooltip:0 "本段停运照会对方，喀尔喀进入商信一项。"
 ywc_society.1504.wait:0 "暂缓答复"
 ywc_society.1504.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1504.wait.consequence_tooltip:0 "记录本次决定；悬而不决逾半年，线路将作过期收束。"
 ywc_society.1504.withdraw:0 "对方已另行办理，撤回此议"
 ywc_society.1504.withdraw.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1504.withdraw.consequence_tooltip:0 "撤回本国答复，仅清理本次挂起记录。"
 ywc_society.1505.t:0 "商信进入朝堂"
 ywc_society.1505.d:0 "行商呈请把商信附在官驿上走，台章旧例只许公文。朝堂要决定开不开放：开放则按封收资、商路消息也走得更快，不开放则商信自雇脚力。若对方已不予接通或已不可联系，本案径行按有限接通定案。"
 ywc_society.1505.open:0 "许商信附驿，按封收资"
 ywc_society.1505.open.cost_tooltip:0 "无额外国库支出；商信按封另计。"
 ywc_society.1505.open.consequence_tooltip:0 "商信入驿有据，线路推进到接通程度一项或径行定案。"
 ywc_society.1505.keep:0 "公文照旧，商信自雇"
 ywc_society.1505.keep.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1505.keep.consequence_tooltip:0 "商信不入驿，线路推进到接通程度一项或径行定案。"
 ywc_society.1505.wait:0 "暂缓，重新核对"
 ywc_society.1505.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1505.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1506.t:0 "接通到什么程度"
 ywc_society.1506.d:0 "线路两边都要给个准话：全线通行、两地互收常例，还是只到交界交接、不入腹地。程度定下后，共同线路如何岁修也要有说法。"
 ywc_society.1506.through:0 "全线通行，两地互收常例"
 ywc_society.1506.through.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1506.through.consequence_tooltip:0 "卫拉特对喀尔喀关系增加 5；喀尔喀收到全线通行的拟定结果。"
 ywc_society.1506.closed:0 "只到交界交接，不入腹地"
 ywc_society.1506.closed.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1506.closed.consequence_tooltip:0 "只到交界交接；喀尔喀收到有限接通的拟定结果。"
 ywc_society.1506.wait:0 "暂缓答复"
 ywc_society.1506.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1506.wait.consequence_tooltip:0 "记录本次决定；悬而不决逾半年，线路将作过期收束。"
 ywc_society.1506.withdraw:0 "对方已另行办理，撤回此议"
 ywc_society.1506.withdraw.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1506.withdraw.consequence_tooltip:0 "撤回本国答复，仅清理本次挂起记录。"
 ywc_society.1507.t:0 "共同线路的维护人"
 ywc_society.1507.d:0 "线路已成或已罢。岁修款由谁出、来例能否照此办理，都要落纸：共同出资须官署仍有人手经手；也可各修各段；若对方已不可联系，可按已付工款自行结案。两边档册各记同一份结果。"
 ywc_society.1507.confirm:0 "付 400 设共同岁修款"
 ywc_society.1507.confirm.cost_tooltip:0 "喀尔喀国库支付 400；官署须仍有人手管理这笔岁修款。"
 ywc_society.1507.confirm.consequence_tooltip:0 "共同岁修入册，来例可循，双方档册各记一份。"
 ywc_society.1507.own_only:0 "本侧自修，不设共款"
 ywc_society.1507.own_only.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1507.own_only.consequence_tooltip:0 "各修各段，不设来例，双方档册各记一份。"
 ywc_society.1507.abandon:0 "罢议，各留旧驿"
 ywc_society.1507.abandon.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1507.abandon.consequence_tooltip:0 "罢议结案；若对方仍可联系，卫拉特对喀尔喀关系减少 5。"
 ywc_society.1507.alone:0 "对方已不可联系，喀尔喀自行结案"
 ywc_society.1507.alone.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1507.alone.consequence_tooltip:0 "已付工款记为有限接通，未动工记为保留旧驿。"
 ywc_society.1507.wait:0 "暂缓，重新核对"
 ywc_society.1507.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1507.wait.consequence_tooltip:0 "记录本次决定。"
