 ywc_lan.1124.withdraw.consequence_tooltip:0 "结束项目并释放名额。"
 ywc_lan.1125.t:0 "六份月账里的一处断点"
 ywc_lan.1125.d:0 "本月的真实读数不合格：试点失业、投入短缺、财政失衡或战争都不会被忽略。观察已暂停并清零，官署只想知道你要不要明确重数。"
 ywc_lan.1125.restart_audit:0 "明确重数，重新开始六历月"
 ywc_lan.1125.restart_audit.cost_tooltip:0 "不重收已结清费用，不冲销路线或已付款。"
 ywc_lan.1125.restart_audit.consequence_tooltip:0 "从零重开连续观察，首日不计；问题若仍在，下月会再次中断。"
 ywc_lan.1125.settle_matured:0 "六历月已连续达标，进入结项"
 ywc_lan.1125.settle_matured.cost_tooltip:0 "不再收费；同一试点、路线、责任与连续六个月须已成立。"
 ywc_lan.1125.settle_matured.consequence_tooltip:0 "把已完成观察交给结局审议，迟到则等冷却后再投递。"
 ywc_lan.1125.wait_observation:0 "保留观察，等待条件恢复"
 ywc_lan.1125.wait_observation.cost_tooltip:0 "不收费，既有费用保留。"
 ywc_lan.1125.wait_observation.consequence_tooltip:0 "保留观察与已付款，下个真实月度再读。"
 ywc_lan.1125.withdraw:0 "退出本次生计项目"
 ywc_lan.1125.withdraw.cost_tooltip:0 "不新收费或退款。"
 ywc_lan.1125.withdraw.consequence_tooltip:0 "结束项目并释放名额，已完成观察与已付款保留。"
 ywc_lan.1126.t:0 "金砂之外的收束"
 ywc_lan.1126.d:0 "六历月复核已经完成，但只有当结项时的真实产业、就业、官署与财政仍成立，才能按对应结局收束。完整目标为加工、农业或专营确实落地；有限目标登记现有账面与缺口；两者都不成立时如实记录受挫。若原点试点已在政变或战争中易手，则只会收到受挫这一项：不会恢复失地、不新建试点、不退已付款，也不把失败算作成功。任何选项都不关闭日志以外的其他项目。"
 ywc_lan.1126.settle_established:0 "确认完整目标确立"
 ywc_lan.1126.settle_established.cost_tooltip:0 "无结项奖金或新收费；此前已按选项实扣的费用不再重复。"
 ywc_lan.1126.settle_established.consequence_tooltip:0 "只在真实完整产业、就业、责任与连续六个月都成立时关闭日志并释放名额。"
 ywc_lan.1126.settle_compromise:0 "确认有限目标妥协"
 ywc_lan.1126.settle_compromise.cost_tooltip:0 "不发放结局奖金。"
 ywc_lan.1126.settle_compromise.consequence_tooltip:0 "只兑现当前有限成果，不冒认完整多元化或专营。"
 ywc_lan.1126.settle_setback:0 "如实记录当前受挫"
 ywc_lan.1126.settle_setback.cost_tooltip:0 "不新收费或退款；已付费用保留。"
 ywc_lan.1126.settle_setback.consequence_tooltip:0 "仅在两项成功条件均不成立时记受挫；保留已付款与既有产业供后续读取。"
 ywc_lan.1126.late_review:0 "延后到下一轮复核再结算"
 ywc_lan.1126.late_review.cost_tooltip:0 "不新收费或退款，已付款保留。"
 ywc_lan.1126.late_review.consequence_tooltip:0 "不在此刻结算，把复核延后到下一次重核当下事实时；不提前关闭日志，也不自动成功。"
 ywc_lan.1126.withdraw:0 "退出本次生计项目"
 ywc_lan.1126.withdraw.cost_tooltip:0 "不新收费或退款。"
 ywc_lan.1126.withdraw.consequence_tooltip:0 "结束项目并释放名额，保留已完成观察与已付款。"
 ywc_lan.1127.t:0 "延后的那一份复核"
 ywc_lan.1127.d:0 "上一轮你没有当场结算，而是把复核延后：这次不另等时限，也不自动跳到成功。它会重新核对当下事实——原定试点是否仍在本国手中、路线、责任与已付款是否还在。还在就按真实条件结算，不在就如实记录受挫或退出；不会重发奖金，也不会替旧账翻案。"
 ywc_lan.1127.late_settle:0 "复核当下事实后结算"
 ywc_lan.1127.late_settle.cost_tooltip:0 "不新收费，不重发已结清费用。"
 ywc_lan.1127.late_settle.consequence_tooltip:0 "按当下真实条件分档，绝不在条件丢失后冒充成功。"
 ywc_lan.1127.late_setback:0 "当下条件已失，记录受挫"
 ywc_lan.1127.late_setback.cost_tooltip:0 "不新收费或退款。"
 ywc_lan.1127.late_setback.consequence_tooltip:0 "保留已完成观察与已付款，供后续内容读取。"
 ywc_lan.1127.late_withdraw:0 "退出本次生计项目"
 ywc_lan.1127.late_withdraw.cost_tooltip:0 "不新收费或退款。"
 ywc_lan.1127.late_withdraw.consequence_tooltip:0 "结束项目并释放名额，已付款保留。"
 ywc_je_v03_lan_defence_muster:0 " JE——港规章程"
 ywc_je_v03_lan_defence_muster_reason:0 "从公所到册目，把商馆与港主的共处变成可核查的港务。"
 ywc_je_v03_lan_defence_review:0 " JE——六个月港务回执"
 ywc_je_v03_lan_defence_review_reason:0 "六个月的观察以真实月份计，战事或赖账会使之中断。"
 ywc_lan.1110.t:0 "商馆里的另一张桌"
 ywc_lan.1110.d:0 "外来商馆的账房与本地港主的桌案同处一厅，税费与泊位各说各话。王国要定的是一张共同的桌。"
 ywc_lan.1110.unified_rules:0 "统一港规"
 ywc_lan.1110.unified_rules.cost_tooltip:0 "先立规后费项；后续实付按半周收入计。"
 ywc_lan.1110.unified_rules.consequence_tooltip:0 "商馆与港主同规同税，泊位由官署分派。"
 ywc_lan.1110.split_concessions:0 "分港特许"
 ywc_lan.1110.split_concessions.cost_tooltip:0 "同上，先立规后费项。"
 ywc_lan.1110.split_concessions.consequence_tooltip:0 "东港归商馆，西港归港主，井水河水两不相犯。"
 ywc_lan.1110.keep_farm_tax:0 "维持包税"
 ywc_lan.1110.keep_farm_tax.cost_tooltip:0 "同上，先立规后费项。"
 ywc_lan.1110.keep_farm_tax.consequence_tooltip:0 "旧商馆照旧包税，改一目少一事。"
 ywc_lan.1110.wait_at_1110:0 "暂缓一轮再议"
 ywc_lan.1110.wait_at_1110.cost_tooltip:0 "无支出。"
 ywc_lan.1110.wait_at_1110.consequence_tooltip:0 "搁置一轮，桌案各归各。"
 ywc_lan.1110.withdraw_at_1110:0 "退出本线"
 ywc_lan.1110.withdraw_at_1110.cost_tooltip:0 "无直接支出；已付部分不退还。"
