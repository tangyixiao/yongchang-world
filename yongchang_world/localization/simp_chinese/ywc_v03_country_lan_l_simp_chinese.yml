 ywc_lan.1108.t:0 "下一任不能继承空白授权"
 ywc_lan.1108.d:0 "预算已经执行，接办责任的政府仍须在现行法律和支持下签名。本次公共委托从确认之日起有效十二个月，由眼前合格的集团或官署承担。支持或条件改变时，可以等待恢复，也可以把争议写进结案。"
