 ywc_lan.1107.t:0 "连续六份公开账"
 ywc_lan.1107.d:0 "六份公账需要连续经受同样的核查：同一试点、有效条款、当下的代表或有限资格、和平与偿付能力。中断后，应明确决定是否重新观察；通过之后，才把责任交给最后的授权审议。"
