 ywc_lan.1102.t:0 "没有股份的那一排"
 ywc_lan.1102.d:0 "没有股份的居民坐在会场后排：他们交税、做工，也希望知道预算由谁决定。现行法律、政府中的集团和真实居民资格决定能确认怎样的代表安排。条件尚不齐备时，可以先公开账册并设置申诉程序。"
 ywc_lan.1102.verify_constituency:0 "按当前法律核实授权基础"
 ywc_lan.1102.verify_constituency.cost_tooltip:0 "不追加收费；须真实当前政体、税法、政府中的集团及其影响和支持、同试点人员或税源。"
 ywc_lan.1102.verify_constituency.consequence_tooltip:0 "只承认现有制度支持的授权。居民方案核至少一组实际有投票资格的非资方职业居民，不凭事件宣布所有居民都有选票。"
