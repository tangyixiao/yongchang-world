 ywc_lan.1106.d:0 "矿工和伤病家庭在旧账里留下了姓名。已经落实互助基金、支付储备并采用相应办事程序的地区，可以节省重复复核；只有账面预留、尚未承担公共支付的公司安排，仍保留自己的责任边界。"
