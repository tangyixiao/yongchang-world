 ywc_lan.1105.d:0 "税单不能只盖过去董事会的章。今天由哪些集团参与政府，谁能为本试点的税源或居民程序负责，都要重新核实。有限目标只承诺管理眼前的账目和申诉，不把尚未取得的授权写进预算。"
