 ywc_lan.1101.t:0 "矿账能否作公账"
 ywc_lan.1101.d:0 "公共矿账的旧审计若已经落实，新的登记就能省下一部分重复工作。官署仍须查清，当时是否先拨了公款、账目是否已结清，以及本试点今日是否还有承办能力。旧改革没有成功，也可以按现价重新登记。"
