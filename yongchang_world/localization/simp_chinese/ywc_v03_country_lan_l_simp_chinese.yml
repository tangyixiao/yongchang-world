 ywc_lan.1109.t:0 "董事会之外的公款"
 ywc_lan.1109.d:0 "最后一份公账问的已经不只是公司付过多少钱，而是谁现在能够承担公开的责任。试点、条款、法律、支持与委托期限都成立时，才能确认完整或有限安排；否则，应留下真实缺口或结束协议。"
 ywc_lan.1109.close_established:0 "确认有边界的公共授权成立"
 ywc_lan.1109.close_established.cost_tooltip:0 "不再收费；完整公共条件、六份有效账、真实支出、现任负责集团和未到期委托仍须成立。"
 ywc_lan.1109.close_established.consequence_tooltip:0 "记录确立并只释放一次名额，保留具体公共安排；不凭结局发法律、职位、选票或资本。"
 ywc_lan.1109.close_compromise:0 "确认股东约束或有限申诉"
 ywc_lan.1109.close_compromise.cost_tooltip:0 "不再收费；当前条件、真实支出、六份账与未到期委托仍须成立。"
 ywc_lan.1109.close_compromise.consequence_tooltip:0 "记录有边界妥协并只释放一次；股东控制不冒称普选，有限账册不冒称完整公共改革。"
 ywc_lan.1109.close_setback:0 "按当前缺口记录受挫"
 ywc_lan.1109.close_setback.cost_tooltip:0 "不新收费，既有费用不退。"
 ywc_lan.1109.close_setback.consequence_tooltip:0 "仅当两种当前成功条件均失败时记受挫；到期不自动续权，保留实际账册与前序来源供后续读取。"
 ywc_lan.1109.wait_close:0 "等待当前条件恢复"
 ywc_lan.1109.wait_close.cost_tooltip:0 "不收费，既有费用和责任保留。"
 ywc_lan.1109.wait_close.consequence_tooltip:0 "保留当前议题，待后续月度机会再议；已经支付的费用保留。"
 ywc_lan.1109.withdraw:0 "退出本次公共授权议案"
 ywc_lan.1109.withdraw.cost_tooltip:0 "不新收费，已付不退，不冲销旧矿账、河约或基金责任。"
 ywc_lan.1109.withdraw.consequence_tooltip:0 "结束本次协议，腾出一项长期事务的办理名额。已付账目和早先义务保留。"
 ywc_je_v03_lan_gold_livelihood:0 "金砂之外的生计"
 ywc_je_v03_lan_gold_livelihood_reason:0 "矿利与矿业周期让公共财政起伏不定。先以本国实有的一次准备金开启项目，在真实拥有的西婆罗洲试点里选定加工、农业或矿业专营之一，再付一笔项目复核金。全部费用按开启时一周总收入快照并从国库实扣，已付不退；不硬造矿山、粮食或外国出资。"
 ywc_je_v03_lan_gold_share_future:0 "金砂之外的公账"
 ywc_je_v03_lan_gold_share_future_reason:0 "项目复核金付清后，在同一试点连续六历月复核真实就业、产出与供给；中断即停数并须明确重数。完成六次后才在 major-event 冷却后方可投递结局；结局选项执行后才关闭本日志。"
 ywc_lan.1120.t:0 "金币之外还得有晚饭"
 ywc_lan.1120.d:0 "矿利养活的公账随矿价起落，矿工之外的人却也要吃饭、做工、缴赋。官署先把本国实有的西婆罗洲州固定为试点并支付一笔项目准备金。此前真实结案的矿账或公共授权会同时减免这次准备金的一半，还会改变后续节点：矿账让矿业专营的复核金降到四分之一，公共授权让加工复核金降到四分之三并在责任记名时更容易成立。任何先例都不替本次出现金，也不新建产业。"
 ywc_lan.1120.pay_seed:0 "选定试点并支付项目准备金"
 ywc_lan.1120.pay_seed.cost_tooltip:0 "从国库实际扣除开线时一周总收入快照，最低100；真实矿账或公共授权先例减免一半，并会改变后续复核金与责任记名。已付不退。"
 ywc_lan.1120.pay_seed.consequence_tooltip:0 "记录扣款的正实际金额与来源，随后进入战略选择；不新增矿山、粮食或外国资金。"
 ywc_lan.1120.wait_seed:0 "等待条件恢复"
 ywc_lan.1120.wait_seed.cost_tooltip:0 "不收费，既有费用与责任保留。"
 ywc_lan.1120.wait_seed.consequence_tooltip:0 "保留议题待后续月度再议；已经支付的费用保留。"
 ywc_lan.1120.withdraw:0 "退出本次生计项目"
 ywc_lan.1120.withdraw.cost_tooltip:0 "不新收费或退款；旧矿账、河约、基金与公共授权责任均保留。"
 ywc_lan.1120.withdraw.consequence_tooltip:0 "结束本次项目并释放一个长期名额，旧成果原样保留。"
 ywc_lan.1121.t:0 "金砂之后做哪一业"
 ywc_lan.1121.d:0 "准备金到位，试点的方向要由人定：加工坊把部分矿利变成日用品，稻田保住基本口粮，矿业专营则用现有矿场与官署换取可税的公款。每条路线都读真实建筑、在职人口与当前占用；没有的产业不能靠选项凭空出现。"
 ywc_lan.1121.route_processing:0 "走加工多元化路线"
 ywc_lan.1121.route_processing.cost_tooltip:0 "本步不收费；后续复核金按加工路线全额结算，读本试点真实食品工业与在职雇工。"
 ywc_lan.1121.route_processing.consequence_tooltip:0 "记录加工路线；结项要求加工坊真实存在、有薪雇工并连续六个月合格。"
 ywc_lan.1121.route_farming:0 "走农业补给路线"
 ywc_lan.1121.route_farming.cost_tooltip:0 "本步不收费；后续复核金按农业路线半价结算，读本试点真实稻田与在职农夫。"
 ywc_lan.1121.route_farming.consequence_tooltip:0 "记录农业路线；结项要求稻田真实存在、有农工并连续六个月合格。"
 ywc_lan.1121.route_monopoly:0 "走矿业专营路线"
 ywc_lan.1121.route_monopoly.cost_tooltip:0 "本步不收费；后续复核金按专营路线半价结算，读本试点真实金矿、在职矿工与有岗官署。"
 ywc_lan.1121.route_monopoly.consequence_tooltip:0 "记录专营路线；结项要求真实金矿与官署齐备并连续六个月合格，不凭空新设矿山。"
 ywc_lan.1121.wait_route:0 "暂缓，待条件恢复再议"
 ywc_lan.1121.wait_route.cost_tooltip:0 "不另收费用。"
 ywc_lan.1121.wait_route.consequence_tooltip:0 "保留议题，待后续月度再议；已付准备金保留。"
 ywc_lan.1121.withdraw:0 "退出本次生计项目"
 ywc_lan.1121.withdraw.cost_tooltip:0 "不新收费或退款。"
 ywc_lan.1121.withdraw.consequence_tooltip:0 "结束项目并释放名额，已付准备金保留。"
 ywc_lan.1122.t:0 "复核金要花在实处"
 ywc_lan.1122.d:0 "路线既定，官署要一笔复核金来清点真实产业与在职人员。通常加工全额、农业与专营半价；若此前有真实公共授权留在册的加工账目，加工可按四分之三；若有真实矿账，专营可按四分之一。现金不足时不必硬付；可以等待，或把目标缩为仅复核既有产业的有限范围。"
 ywc_lan.1122.pay_basis:0 "支付项目复核金"
 ywc_lan.1122.pay_basis.cost_tooltip:0 "从国库实扣开启时一周收入快照：加工全额（有真实公共授权时四分之三），农业与专营半价（有真实矿账时专营四分之一）；最低50，已付不退。"
 ywc_lan.1122.pay_basis.consequence_tooltip:0 "记录正实际金额后进入责任与观察；不将旧储备当作本次现金。"
 ywc_lan.1122.narrow_basis:0 "只复核既有产业，缩为有限目标"
 ywc_lan.1122.narrow_basis.cost_tooltip:0 "仍按路线实扣复核金；只承诺复核现有官署与产业，不要求新建加工坊或稻田。"
 ywc_lan.1122.narrow_basis.consequence_tooltip:0 "记录有限目标；结项至多达成妥协结局。"
 ywc_lan.1122.wait_basis:0 "等待条件恢复"
 ywc_lan.1122.wait_basis.cost_tooltip:0 "不收费，既有费用保留。"
 ywc_lan.1122.wait_basis.consequence_tooltip:0 "保留议题待后续月度再议。"
 ywc_lan.1122.withdraw:0 "退出本次生计项目"
 ywc_lan.1122.withdraw.cost_tooltip:0 "不新收费或退款。"
 ywc_lan.1122.withdraw.consequence_tooltip:0 "结束项目并释放名额，准备金与路线记录保留。"
 ywc_lan.1123.t:0 "谁来负责这笔公账"
 ywc_lan.1123.d:0 "钱花出去了，还得有人签下责任。现行本试点的官署与在职官僚若齐备，就可以按完整方案记名；若只有官署而无足额人员，只能登记当前缺口并转入有限观察。记名之后才启动连续六历月的复核，绝不提前结算。"
 ywc_lan.1123.name_full:0 "由有岗官署记名并启动复核"
 ywc_lan.1123.name_full.cost_tooltip:0 "不追加费用；须本试点真实官署加在职官僚（或真实公共授权留下的有岗公署）、行政与财政安全齐备。"
 ywc_lan.1123.name_full.consequence_tooltip:0 "记录完整责任与同一试点，随后进入六历月观察；不赠予职位或资本。"
 ywc_lan.1123.name_gap:0 "按当前缺口记名，转有限观察"
 ywc_lan.1123.name_gap.cost_tooltip:0 "不追加费用；只在官署存在但官僚不足时可选，目标同步缩为有限。"
 ywc_lan.1123.name_gap.consequence_tooltip:0 "记录有限责任，结项至多妥协，不冒认完整方案。"
 ywc_lan.1123.wait_responsible:0 "等待条件恢复"
 ywc_lan.1123.wait_responsible.cost_tooltip:0 "不收费，既有费用保留。"
 ywc_lan.1123.wait_responsible.consequence_tooltip:0 "保留议题待后续月度再议。"
 ywc_lan.1123.withdraw:0 "退出本次生计项目"
 ywc_lan.1123.withdraw.cost_tooltip:0 "不新收费或退款。"
 ywc_lan.1123.withdraw.consequence_tooltip:0 "结束项目并释放名额，已付费用保留。"
 ywc_lan.1124.t:0 "开始那六个月"
 ywc_lan.1124.d:0 "官署已记名，复核从本月起算，同日不能重计。此后每一个真实月度都读同一试点的就业、产出、供给与财政；任何一月不合格都会暂停并清零，必须在你亲自确认后重数。"
 ywc_lan.1124.start_audit:0 "确认记名并开始连续复核"
 ywc_lan.1124.start_audit.cost_tooltip:0 "不再收费；六历月观察由本线 helper 逐月推进。"
 ywc_lan.1124.start_audit.consequence_tooltip:0 "首日设一日门闩不计月；中断须明确重数。"
 ywc_lan.1124.wait_audit:0 "等待条件恢复"
