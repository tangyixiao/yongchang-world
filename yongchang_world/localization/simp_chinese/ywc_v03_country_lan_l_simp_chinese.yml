 ywc_je_v03_lan_public_mandate:0 "董事会之外的兰芳"
 ywc_je_v03_lan_public_mandate_reason:0 "为当前本国所有的西婆罗洲试点约定公司、居民与股东的公共授权。现行法律、政府支持、人员与税源决定完整资格；条件尚不足时，可以明确选择公开账册与申诉的有限目标。登记和复核均需实际支付。"
 ywc_je_v03_lan_public_budget:0 "公共义务的预算"
 ywc_je_v03_lan_public_budget_reason:0 "把申诉、当前税制和政府责任、实际复核费用落实，再核六份连续月账。共管与互助先例只免重复工作，不伪造现金。战争、失州、违约或资格丢失中断观察，明确延期后从零重数。"
 ywc_je_v03_lan_public_succession:0 "交接不能继承空白"
 ywc_je_v03_lan_public_succession_reason:0 "六次公账核查通过后，由当前合格政府确认十二个月的公共委托。结案时再次核对同一试点、负责者、法律、支持与期限；条件丢失或委托到期时，留下明确的受挫或退出记录。"
 ywc_lan.1100.t:0 "出资者的印章"
 ywc_lan.1100.d:0 "矿场能缴来公款，董事会的印章却不能永远代替居民发言。西婆罗洲的公司、官署与居民需要先约定，谁有权签预算，谁承担承诺。现有公司共和、居民代表与受约束股东制各有一条道路。"
