l_simp_chinese:
 ywc_je_v03_c07_contract_annex:0 "开发契约的附页"
 ywc_je_v03_c07_contract_annex_reason:0 "登记真实产业、土地与投资关系：矿是否在册、土地属谁、资金来自哪一国。所在国核对争点并开列担保问题，资金方自行决定限额、缩项或不再投入；条款记具体签字国，不代任何一方作答。"
 ywc_je_v03_c07_interest_public_duty:0 "利息与公共责任"
 ywc_je_v03_c07_interest_public_duty_reason:0 "展期、撤资、缩减与公共开支各归各账：道路次序按建设能力定，展期由资金方以实付利息完成，矿难责任按册查，税权之争各自作答。执行段结束才写入完成标记，任何一方都不替另一方签字。"
 ywc_je_v03_c07_who_stays_after:0 "开发之后谁留下"
 ywc_je_v03_c07_who_stays_after_reason:0 "检查项目结局与复议：拆期与否、退出之后的账、两份不同的胜利，最后按各自实际落款与实付写下余波。完整协议、有限项目、保留现状、主动退出、履约失败与无从谈判都是正结局，正常游戏继续。"
 ywc_crisis.1600.t:0 "合同外的一块地"
 ywc_crisis.1600.d:0 "勘探队报来的矿脉落在契约之外：所在国须先核对真实产业、土地与投资关系——矿业是否真的在册，土地属于谁，资金来自哪一国。没有实际的对方，就不虚构一笔跨国债务。"
