 ywc_je_v03_mgl_roads_register:0 "茶砖与北市货单：商路登记"
 ywc_je_v03_mgl_roads_register_reason:0 "南北商路都要护路经费，地方关卡却争夺税收。王公、商人和牧户必须承担真实成本，并厘清两套文书的权限分歧。"
 ywc_je_v03_mgl_roads_review:0 "沿线复核"
 ywc_je_v03_mgl_roads_review_reason:0 "路线仍须经得起连续六个月的市场接入和外交关系观察；条件失效就从零开始。"
 ywc_mng.1000.t:0 "南北商路：货单抵达"
 ywc_mng.1000.d:0 "商队要求南北两路同时护送，关卡官争论税款归属。"
 ywc_mng.1000.dual:0 "双路护送：双倍启动费"
 ywc_mng.1000.dual.cost_tooltip:0 "一次性启动费：开线时快照年总收入÷52并限制在100至1,000,000,000，按双倍系数扣付。已付不退；后续确认条款不再收费。"
 ywc_mng.1000.dual.consequence_tooltip:0 "入场须采用重商主义法、市场接入≥0.75、茶叶出口>50，且大顺与俄罗斯存在并均至少中立。付款当时给予地主支持+1，730日从首次付费选路起算；后续确认不续期。六个月观察只在条款确认且符合条件后累计。"
 ywc_mng.1000.single:0 "单线协作：一份启动费"
 ywc_mng.1000.single.cost_tooltip:0 "一次性启动费：开线时快照年总收入÷52并限制在100至1,000,000,000，按一份系数扣付。已付不退；后续确认条款不再收费。"
 ywc_mng.1000.single.consequence_tooltip:0 "入场须至少一项现存邻国关系不低于中立、市场接入≥0.50、茶叶出口>0。付款当时地主支持-1、虔信者支持+1，各730日从首次付费选路起算；后续确认不续期。六个月观察只在条款确认且符合条件后累计。"
 ywc_mng.1000.local:0 "边市互市：半份启动费"
 ywc_mng.1000.local.cost_tooltip:0 "一次性启动费：开线时快照年总收入÷52并限制在100至1,000,000,000，按半份系数扣付。已付不退；后续确认条款不再收费。"
 ywc_mng.1000.local.consequence_tooltip:0 "入场须市场接入≥0.35、粮食进口≥1。付款当时给予乡村民众支持+1，730日从首次付费选路起算；后续确认不续期。六个月观察只在条款确认且符合条件后累计；不承诺远途护送或邻国合作。"
