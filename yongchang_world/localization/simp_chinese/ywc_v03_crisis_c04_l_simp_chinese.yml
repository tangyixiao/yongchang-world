l_simp_chinese:
 ywc_je_v03_c04_verifiable_ship_license:0 "一张可核验的船照"
 ywc_je_v03_c04_verifiable_ship_license_reason:0 "南洋航路上同一艘船挂着三个名字：船籍、货单与泊位各说各话。先把实际国籍、货物与港口身份逐项核清，再让受护的商港与岛屿当事国各自作答；谈不成也保留现状与主动退出之路。"
 ywc_je_v03_c04_escort_cost_bearer:0 "护航费由谁承担"
 ywc_je_v03_c04_escort_cost_bearer_reason:0 "护航账摊开在案上：海军部想公费巡航，商行想按航段分摊，小港口只能查自己查得动的船。账目落到当前舰队、港口与国库实况上；矿砂船被扣、旗号一换，履约冲突各自记账，不以刀兵收场。"
 ywc_je_v03_c04_port_rules_reach_islands:0 "港规到达小岛以后"
 ywc_je_v03_c04_port_rules_reach_islands_reason:0 "港规与航路公约落到小岛的码头与船单上：护航段缩到哪一里、船照由谁核验、本地司法是否保留，都要在复议与结算里逐条对账。兑现的入册留名，未兑的如实记败，落款不同的各方各留各的问题。"
 ywc_crisis.1300.t:0 "同一艘船的三个名字"
 ywc_crisis.1300.d:0 "码头案卷里同一艘船挂着三个名字：船籍册、货单与泊位税各执一词。提案国逐项核对实际国籍、货物与港口身份，把已废的名目与仍在的担保留清；岛屿船旗如实记注，不再写作必然属籍。"
 ywc_crisis.1300.verify_registers:0 "逐项核对船籍、货单与泊位身份"
 ywc_crisis.1300.verify_registers.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1300.verify_registers.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1300.record_flags:0 "如实记注岛屿旗籍，不注属籍"
 ywc_crisis.1300.record_flags.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1300.record_flags.consequence_tooltip:0 "岛屿当事国各得 +2 关系，名册不再注为属邦。"
 ywc_crisis.1300.wait:0 "暂缓，重新核对"
 ywc_crisis.1300.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1300.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1301.t:0 "保费到了码头"
 ywc_crisis.1301.d:0 "失航的船单与欠缴的保费一起堆到码头：港务按所在国章程查失航、关费与真实护航能力，不假定海军永远可用。开护航账邀各方分别作答，或按本地旧例自收保费，或因当事各方俱失而无从谈判。"
 ywc_crisis.1301.open_escort_account:0 "开护航账，邀各方分别作答"
 ywc_crisis.1301.open_escort_account.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1301.open_escort_account.consequence_tooltip:0 "护航账连同航段与船照条款一并送出，各方分别作答。"
 ywc_crisis.1301.local_fees_only:0 "各港各例，自收保费"
 ywc_crisis.1301.local_fees_only.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1301.local_fees_only.consequence_tooltip:0 "以保留现状结案，容量名额就地释放。"
 ywc_crisis.1301.no_counterparty:0 "当事各方俱失，无从谈判"
 ywc_crisis.1301.no_counterparty.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1301.no_counterparty.consequence_tooltip:0 "本案以无从谈判结案，容量名额就地释放。"
 ywc_crisis.1301.wait:0 "暂缓，重新核账"
 ywc_crisis.1301.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1301.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1302.t:0 "受护者的还价"
 ywc_crisis.1302.d:0 "受护的商港各自作答：按航段付费、只互认船照，或干脆不入此约。答应与否由各港自决，提案国不能代签；不入约者先入复议窗口，主体关系维持当前状态。"
 ywc_crisis.1302.pay_per_segment:0 "按航段付费（300），入护航账"
 ywc_crisis.1302.pay_per_segment.cost_tooltip:0 "本国国库支付 300。"
 ywc_crisis.1302.pay_per_segment.consequence_tooltip:0 "航段费入账，等待护航段执行与结算。"
 ywc_crisis.1302.license_only:0 "只互认船照，不担护航费"
 ywc_crisis.1302.license_only.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1302.license_only.consequence_tooltip:0 "仅互认船照，护航条款不入册；等待复议与结算。"
 ywc_crisis.1302.refuse:0 "不入此约，各守旧例"
 ywc_crisis.1302.refuse.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1302.refuse.consequence_tooltip:0 "先入复议窗口，可在复议中改约或退出。"
 ywc_crisis.1302.wait:0 "暂缓答复"
 ywc_crisis.1302.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1302.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1303.t:0 "群岛的停泊条件"
 ywc_crisis.1303.d:0 "岛屿当事国各自定夺停泊条件：准许护航船队补水，或限定驻留船只与天数，或退出此轮。对方因此取得的是泊位与补给，不是土地所有权；退出者以主动退出结案。"
 ywc_crisis.1303.allow_resupply:0 "准许护航船队补水停泊"
 ywc_crisis.1303.allow_resupply.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1303.allow_resupply.consequence_tooltip:0 "泊位与补水开放，土地所有权不为对方所得；转入本港检查配置。"
 ywc_crisis.1303.restrict_stay:0 "限定驻留船只与天数"
