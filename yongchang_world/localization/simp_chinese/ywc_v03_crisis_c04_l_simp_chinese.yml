 ywc_crisis.1303.withdraw_islands:0 "退出此轮，各守港湾旧章"
 ywc_crisis.1303.withdraw_islands.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1303.withdraw_islands.consequence_tooltip:0 "以主动退出结案，港湾治权不受本约改动。"
 ywc_crisis.1303.wait:0 "暂缓答复"
 ywc_crisis.1303.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1303.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1304.t:0 "海军部与商行的账"
 ywc_crisis.1304.d:0 "护航账摊开在案上：海军部要公费巡航，商行要按航段分摊，而账目只认当前的舰队、港口与国库实况。公费出巡、商行分摊或主动缩减覆盖，各自记入册子；矿砂船被扣的风险随账目而至。"
 ywc_crisis.1304.public_patrol:0 "公费出巡（600），全程记账"
 ywc_crisis.1304.public_patrol.cost_tooltip:0 "本国国库支付 600。"
 ywc_crisis.1304.public_patrol.consequence_tooltip:0 "公费巡航入册；扣船冲突按实际当事者 mount。"
 ywc_crisis.1304.merchant_shares:0 "商行按航段分摊，公账只记份额"
