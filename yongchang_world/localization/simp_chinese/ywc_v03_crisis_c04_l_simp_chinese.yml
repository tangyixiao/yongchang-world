 ywc_crisis.1308.d:0 "护航国摊牌：不再承诺全程，只保常走的这一段海；不能提供的航段退费或限期结束。受护各方分别作答，接受缩段入约，或谢绝而各守旧例。条款按实际能提供的写，不按愿望写。"
