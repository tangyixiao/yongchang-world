 ywc_crisis.1304.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1305.t:0 "小港口的检查员"
 ywc_crisis.1305.d:0 "小港口只有一名检查员和一条舢板：只查自己查得动的船，或把承诺缩到可负担的份上，或保留本地裁判权。过量承诺主动缩减，检查权始终留在本港手里。"
