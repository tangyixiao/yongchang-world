 ywc_crisis.1307.d:0 "宗主换了，港口易手，海路上的旗号也换了。旧担保不随旗自动继承：要么就此重议条款，要么记明旧担保失效再重议，要么各守现状。旗号不认旧情，册子只认新签。"
