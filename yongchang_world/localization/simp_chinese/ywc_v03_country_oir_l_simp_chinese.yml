 ywc_oir.1010.d:0 "军需官摊开军册：统一征调、按旗分摊、沿用旧额，决定谁付军饷、谁来交马。"
 ywc_oir.1010.route_1:0 "统一军需"
 ywc_oir.1010.route_1.cost_tooltip:0 "收入周基数；基数=年总收入快照/52，限制于100至1,000,000,000。"
 ywc_oir.1010.route_1.consequence_tooltip:0 "拨款统一征调；后续须维持足够军额、官署、营房、军饷与武器市场供给，军方受益而地主不满。 军额按常备营计，至少 7 营，不包含当前动员的征召营；其他财政和供给要求仍须满足。"
 ywc_oir.1010.route_2:0 "按份旗兵"
 ywc_oir.1010.route_2.cost_tooltip:0 "同一周基数的0.6倍，低收入时实付可低于100。"
 ywc_oir.1010.route_2.consequence_tooltip:0 "按旗分摊；后续军额要求较低，但仍核对军制、营房与武器供给，军方与乡村代表略获支持。 军额按常备营计，至少 5 营，不包含当前动员的征召营；其他财政和供给要求仍须满足。"
 ywc_oir.1010.route_3:0 "限额旧制"
 ywc_oir.1010.route_3.cost_tooltip:0 "不扣国库款；仍须符合军制、最低军额及武器市场供给门槛。"
 ywc_oir.1010.route_3.consequence_tooltip:0 "保持旧额上限；不作额外拨款，仍须有最低军额与武器市场供给，旧额执行会压低军饷支出并令军方失望。 军额按常备营计，至少 2 营，不包含当前动员的征召营；其他财政和供给要求仍须满足。"
