 ywc_oir.1000.d:0 "边地总管递来新税界图，牧群却沿旧水草路转场；测界、共管与寺院调停各有代价。"
 ywc_oir.1000.route_1:0 "汗廷测界"
 ywc_oir.1000.route_1.cost_tooltip:0 "收入周基数的1.5倍；基数=年总收入快照/52，限制于100至1,000,000,000。"
 ywc_oir.1000.route_1.consequence_tooltip:0 "确认汗廷丈量方案；后续巡界取决于官署、牧场、土地法与地方安定，也会触动地主与牧户态度。"
 ywc_oir.1000.route_2:0 "各旗共管"
 ywc_oir.1000.route_2.cost_tooltip:0 "同一周基数的0.5倍，低收入时实付可低于100。"
 ywc_oir.1000.route_2.consequence_tooltip:0 "由旗盟共管界址；后续要维持牧场与旗盟承诺，地主和牧户都有议价空间。"
 ywc_oir.1000.route_3:0 "寺院调停"
 ywc_oir.1000.route_3.cost_tooltip:0 "不扣国库款；须无违约或破产，牧地争端缓和且旗盟仍能维持承诺。"
 ywc_oir.1000.route_3.consequence_tooltip:0 "沿用寺院调停；缓和争端但保留界权含混，后续有利教士并损及正式地主权威。"
