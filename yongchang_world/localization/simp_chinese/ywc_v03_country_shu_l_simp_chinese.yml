 ywc_shu.1015.reopen_reduced_supply.cost_tooltip:0 "不付款；保留已付、免收与既有债务。"
 ywc_shu.1015.reopen_reduced_supply.consequence_tooltip:0 "旧版降标标记不足以判定停在哪一环，明确回到供给检查。"
 ywc_shu.1016.t:0 "军镇请求重议上限"
 ywc_shu.1016.d:0 "账目已受阻十二或三十六个月，或一项现实条件刚刚失效。重议只影响后续义务，已签约和已经支付的债务仍在。"
 ywc_shu.1016.resume_service_contract:0 "回到契约议事"
 ywc_shu.1016.resume_service_contract.cost_tooltip:0 "不新增费用。"
 ywc_shu.1016.resume_service_contract.consequence_tooltip:0 "恢复普通议事队列，不改变已记录的账目。"
 ywc_shu.1016.resume_service_appointments:0 "回到任用与供给复核"
 ywc_shu.1016.resume_service_appointments.cost_tooltip:0 "不新增费用。"
 ywc_shu.1016.resume_service_appointments.consequence_tooltip:0 "恢复当前阶段的普通复核队列。"
 ywc_shu.1016.retry_after_repair:0 "保留原路，修复后重新计时"
 ywc_shu.1016.retry_after_repair.cost_tooltip:0 "不收费。"
 ywc_shu.1016.retry_after_repair.consequence_tooltip:0 "保留原承诺；所有连续观察从恢复条件满足后重新开始。"
 ywc_shu.1016.accept_cap:0 "将新义务缩为有限旧军"
