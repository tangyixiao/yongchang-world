 ywc_shu.1012.d:0 "将领递上荐任名单，铨部要求每一缺额都有可追溯的交接。军方保荐、文武会核与仅承认现任各有不同权责。"
 ywc_shu.1012.professional_list:0 "军职按资格逐名核验"
 ywc_shu.1012.professional_list.cost_tooltip:0 "不收费。"
 ywc_shu.1012.professional_list.consequence_tooltip:0 "专业整编须有职业军制或在役兵营实际达到较高就业；军方失去单独保荐权。"
 ywc_shu.1012.joint_list:0 "铨部与军镇共同签名"
 ywc_shu.1012.joint_list.cost_tooltip:0 "不收费。"
