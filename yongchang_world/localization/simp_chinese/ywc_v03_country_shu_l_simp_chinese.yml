 ywc_shu.1013.t:0 "按营交验还是按镇包供"
 ywc_shu.1013.d:0 "三种军制各有一份不同账目。专业整编要求职业军制或真实营额与高就业；军镇共约依现行法令并承担地方核验；封顶旧军降低目标且保留既有指挥。"
 ywc_shu.1013.professional:0 "签专业整编：逐营交验"
 ywc_shu.1013.professional.cost_tooltip:0 "一次性费用按年总收入÷52计，现行职业军制或已达目标的兵营可减半；需有现款。"
 ywc_shu.1013.professional.consequence_tooltip:0 "逐营检查至少80%就业、无商品短缺，铨部也须有真实官署岗位。"
