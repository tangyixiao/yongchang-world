 ywc_shu.1019.t:0 "内地账房来查海关"
 ywc_shu.1019.d:0 "内地核账官要求对照港税、官署支出和前期税册结果。中央清查成功可降低统一路线门槛；地方分账或旧额封顶则保留相应责任。"
