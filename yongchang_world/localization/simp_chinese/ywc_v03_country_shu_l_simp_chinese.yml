 ywc_shu.1009.reconcile_legacy_military_budget.consequence_tooltip:0 "仅用于旧版未记录承担者的税册：明确由预算排队，满足其他条件后按地方分担结案。"
 ywc_shu.1009.keep_capped_quotas:0 "有限旧额结算"
 ywc_shu.1009.keep_capped_quotas.cost_tooltip:0 "不退前款，不声称全国税册完成。"
 ywc_shu.1009.keep_capped_quotas.consequence_tooltip:0 "保守守成列为有限结果，未来可从海关或分省改革续接。"
 ywc_shu.1009.retry_after_interruption:0 "条件中断，重新开始六个月审查"
