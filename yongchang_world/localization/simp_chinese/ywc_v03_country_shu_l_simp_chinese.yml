 ywc_shu.1014.dismiss_stale_supply.cost_tooltip:0 "不付款；旧版未标记的供给议案可安全重送。"
 ywc_shu.1014.dismiss_stale_supply.consequence_tooltip:0 "保留当前阶段和已签责任。"
