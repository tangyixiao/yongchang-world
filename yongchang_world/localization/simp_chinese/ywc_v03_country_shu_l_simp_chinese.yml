 ywc_shu.1009.keep_capped_quotas.consequence_tooltip:0 "保守守成列为有限结果，未来可从海关或分省改革续接。"
 ywc_shu.1009.retry_after_interruption:0 "条件中断，重新开始六个月审查"
 ywc_shu.1009.retry_after_interruption.cost_tooltip:0 "本选择不产生新费用；恢复后重新连续审查六个月。"
 ywc_shu.1009.retry_after_interruption.consequence_tooltip:0 "保留承诺并回到中断处理，可在恢复条件后重新计时。"
 ywc_shu.1009.withdraw_as_breach:0 "撤回并承担失信后果"
 ywc_shu.1009.withdraw_as_breach.cost_tooltip:0 "停止未发生的新费用，已付款保留。"
 ywc_shu.1009.withdraw_as_breach.consequence_tooltip:0 "记录撤回失信，不抹除旧债与地方不满。"
 ywc_je_v03_shu_service_contract:0 "军镇供饷契约"
 ywc_je_v03_shu_service_contract_reason:0 "选择并支付一份有限契约，说明军饷、任用名单由谁核验。"
 ywc_je_v03_shu_service_appointments:0 "铨部任用与军镇供给"
 ywc_je_v03_shu_service_appointments_reason:0 "按所选军制检查真实兵营与官署岗位、供给和军费责任；达不到目标时可修复或降格。"
 ywc_je_v03_shu_service_successor:0 "继任仍按契约"
 ywc_je_v03_shu_service_successor_reason:0 "六个月连续核验和平时期的供给、任命和财政；中断后从零重新观察，也可延期或撤回。"
 ywc_shu.1010.t:0 "两枚印信的一份调令"
 ywc_shu.1010.d:0 "户部带来朝廷印，军镇也拿出旧有供军文书。先定由谁核对下一份名册；这只确定谈判桌，不替任何一方授官。"
 ywc_shu.1010.court_seal:0 "先由朝廷与铨部联署"
 ywc_shu.1010.court_seal.cost_tooltip:0 "不收费。"
 ywc_shu.1010.court_seal.consequence_tooltip:0 "中央掌握复核权，后续专业整编的费用较低，军镇需提交完整名册。"
 ywc_shu.1010.garrison_seal:0 "军镇也须盖上供饷印"
 ywc_shu.1010.garrison_seal.cost_tooltip:0 "不收费。"
 ywc_shu.1010.garrison_seal.consequence_tooltip:0 "军镇取得书面复核权；后续地方共约可减免一次费用，但中央核验门槛更高。"
 ywc_shu.1010.delay_order:0 "先封存调令，暂不签约"
 ywc_shu.1010.delay_order.cost_tooltip:0 "不收费。"
 ywc_shu.1010.delay_order.consequence_tooltip:0 "不产生新费用；进入可恢复的受阻议价，仍可重试或撤回。"
 ywc_shu.1011.t:0 "军户欠饷与文官空缺"
 ywc_shu.1011.d:0 "两本名册都不完整：军户称旧欠未清，铨部称候补官缺无人交接。玩家可以先核实一笔有限账目，也可把责任压回地方或承认旧额上限。"
 ywc_shu.1011.verify_payroll:0 "先核一笔军饷与官缺账"
 ywc_shu.1011.verify_payroll.cost_tooltip:0 "按年总收入÷52（最低100）收取一次核验费；必须财政安全且有现款。"
 ywc_shu.1011.verify_payroll.consequence_tooltip:0 "只有扣款成功才可进入保荐名单；既有欠款仍按账承担。"
 ywc_shu.1011.local_ledger:0 "由各道先报实额"
 ywc_shu.1011.local_ledger.cost_tooltip:0 "无新增中央费用；须承担地方报告权，并在后续至少核验实际官署就业。"
 ywc_shu.1011.local_ledger.consequence_tooltip:0 "走地方共约时地方拥有账目复核权，中央不能同时按全额统一军额结案。"
