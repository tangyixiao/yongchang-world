 ywc_shu.1016.resume_service_appointments:0 "回到任用与供给复核"
 ywc_shu.1016.resume_service_appointments.cost_tooltip:0 "不新增费用。"
 ywc_shu.1016.resume_service_appointments.consequence_tooltip:0 "恢复当前阶段的普通复核队列。"
 ywc_shu.1016.retry_after_repair:0 "保留原路，修复后重新计时"
 ywc_shu.1016.retry_after_repair.cost_tooltip:0 "不收费。"
