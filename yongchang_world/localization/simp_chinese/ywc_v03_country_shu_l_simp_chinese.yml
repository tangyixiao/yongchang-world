 ywc_shu.1014.wait_for_supply.cost_tooltip:0 "不立即扣款，保留既有费用与责任。"
 ywc_shu.1014.wait_for_supply.consequence_tooltip:0 "稍后重新检查真实部队、岗位和供给。"
 ywc_shu.1014.reopen_reduced_supply:0 "重查限额供给，再继续任用"
 ywc_shu.1014.reopen_reduced_supply.cost_tooltip:0 "不付款；保留已付、免收与既有债务。"
 ywc_shu.1014.reopen_reduced_supply.consequence_tooltip:0 "旧版降标标记不足以判定停在哪一环，明确回到供给检查。"
 ywc_shu.1015.t:0 "铨部退回的任命"
 ywc_shu.1015.d:0 "被退回的任命不是抽象的文武不和：岗位可能空缺、名册不全，或荐任规则和所选军制不合。逐项补证或缩小承诺。"
