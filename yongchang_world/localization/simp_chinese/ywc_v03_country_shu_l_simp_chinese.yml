 ywc_shu.1009.withdraw_as_breach.consequence_tooltip:0 "记录撤回失信，不抹除旧债与地方不满。"
 ywc_je_v03_shu_service_contract:0 "军镇供饷契约"
 ywc_je_v03_shu_service_contract_reason:0 "选择并支付一份有限契约，说明军饷、任用名单由谁核验。"
 ywc_je_v03_shu_service_appointments:0 "铨部任用与军镇供给"
 ywc_je_v03_shu_service_appointments_reason:0 "按所选军制检查真实部队、自有兵营和官署：专业、共约与旧军分别要求兵营就业至少 80%、60%、25%，且兵营无投入品短缺；不足可等待、修复或降格。"
 ywc_je_v03_shu_service_successor:0 "继任仍按契约"
 ywc_je_v03_shu_service_successor_reason:0 "六个月连续核验和平时期的供给、任命和财政。专业路线的已到期军费若未付或账本损坏会中断审查；修复后从零观察，也可降格或撤回。"
 ywc_shu.1010.t:0 "两枚印信的一份调令"
 ywc_shu.1010.d:0 "户部带来朝廷印，军镇也拿出旧有供军文书。先定由谁核对下一份名册；这只确定谈判桌，不替任何一方授官。"
 ywc_shu.1010.court_seal:0 "先由朝廷与铨部联署"
 ywc_shu.1010.court_seal.cost_tooltip:0 "不收费。"
 ywc_shu.1010.court_seal.consequence_tooltip:0 "中央掌握复核权，后续专业整编的费用较低，军镇需提交完整名册。"
