 ywc_shu.1014.d:0 "没有战事，不代表军费不必按时入账。兵营和官署的实际岗位、供给短缺、当前法律及财政安全共同决定能否兑现。"
 ywc_shu.1014.check_supply:0 "按现有营额交验供给"
 ywc_shu.1014.check_supply.cost_tooltip:0 "不收费。"
