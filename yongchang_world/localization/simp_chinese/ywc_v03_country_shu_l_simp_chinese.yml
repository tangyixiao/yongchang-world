 ywc_shu.1101.d:0 "学堂与公共工程的钱该由谁列支？这是第一个读取真实条件并选择路线的节点。中央国库列支要现款，且不假装学校已经建成；地方列支只记一份待协商的留用意向；维持旧官署则承认没有新法和新学校也能有有限的官署工程。"
 ywc_shu.1101.central_funding:0 "中央国库列支学校与官署工程"
 ywc_shu.1101.central_funding.cost_tooltip:0 "中央实际支付一周收入，最低100；同一仍归本国的前期中央财政试点成果可减半。执行时重核现金和来源。"
 ywc_shu.1101.central_funding.consequence_tooltip:0 "为现有学校或官署工程列账，不生成建筑或法律。之后仍要明确救济责任。"
 ywc_shu.1101.provincial_funding:0 "地方按留用额列支（先记协商意向）"
 ywc_shu.1101.provincial_funding.cost_tooltip:0 "无国库扣款；不转移州税。"
 ywc_shu.1101.provincial_funding.consequence_tooltip:0 "这里不授予 share_terms；留用权必须到 1104 真成文。"
 ywc_shu.1101.keep_old_office:0 "维持旧官署，只做有限工程"
 ywc_shu.1101.keep_old_office.cost_tooltip:0 "不收费。"
 ywc_shu.1101.keep_old_office.consequence_tooltip:0 "无学校、无新法也可走；需 1105 的真实和平财政确认，最终为有限妥协。"
 ywc_shu.1101.wait_for_office:0 "暂缓，先补官署"
 ywc_shu.1101.wait_for_office.cost_tooltip:0 "不扣费；不记支出。"
 ywc_shu.1101.wait_for_office.consequence_tooltip:0 "保留 stage 1101；以真实官署 25% 就业为目标，不生成建筑。"
 ywc_shu.1101.withdraw_school_line:0 "撤回省账，退出本线"
 ywc_shu.1101.withdraw_school_line.cost_tooltip:0 "不产生新费用。"
 ywc_shu.1101.withdraw_school_line.consequence_tooltip:0 "释放本线；不赠学校或法律。"
 ywc_shu.1102.t:0 "巡抚不肯再垫"
 ywc_shu.1102.d:0 "同一矛盾有两副面孔：本州动荡时，巡抚已拒绝再垫救灾与公共支出；平静时，问题变成“预备责任”该不该先立——各州须先为救灾、公共卫生和学校配比出预算，才谈得上留用。无论当下是哪一种，三条出路都在这里；进入本节点不要求发生动荡。"
 ywc_shu.1102.pay_relief_once:0 "中央实付一次救济或预备金"
 ywc_shu.1102.pay_relief_once.cost_tooltip:0 "实扣一次本线自有的周收入估算；现款不足不扣不记不推进。"
 ywc_shu.1102.pay_relief_once.consequence_tooltip:0 "记录真实支付；支付本身不改变学校或法律。成功才进入 1103；不得直接跳 1106。"
 ywc_shu.1102.provincial_self_raise:0 "地方自筹（记待协商责任）"
 ywc_shu.1102.provincial_self_raise.cost_tooltip:0 "无国库扣款；不转移州税。"
 ywc_shu.1102.provincial_self_raise.consequence_tooltip:0 "只记待协商的地方责任，不授成文权、不视为已付现金；进入 1104。"
 ywc_shu.1102.push_old_quota:0 "压回旧额，留给旧额路线复核"
 ywc_shu.1102.push_old_quota.cost_tooltip:0 "不扣费；不新增救济。"
 ywc_shu.1102.push_old_quota.consequence_tooltip:0 "留下真实风险，旧额确认须在 1105 再核；进入 1105。"
 ywc_shu.1102.withdraw_relief_line:0 "撤回省账，退出本线"
 ywc_shu.1102.withdraw_relief_line.cost_tooltip:0 "不产生新费用。"
 ywc_shu.1102.withdraw_relief_line.consequence_tooltip:0 "释放本线。"
 ywc_shu.1103.t:0 "中央的账房，地方的仓"
 ywc_shu.1103.d:0 "中央派员接管路线要真能记账：本线试点州官署达八成且无短缺、现行税法、全国行政结余不为负。条件不足时可降为 25% 官署共议，或改旧协商；失败保留已付记录，不再收费。"
 ywc_shu.1103.establish_central:0 "达标，确立中央统筹"
 ywc_shu.1103.establish_central.cost_tooltip:0 "不额外收费；真实官署、税法与结余是唯一依据。"
 ywc_shu.1103.establish_central.consequence_tooltip:0 "记录 mode=1 并进入 JE2 六月核账；不赠法律或建筑。"
 ywc_shu.1103.downgrade_shared:0 "降为 25% 官署共议"
 ywc_shu.1103.downgrade_shared.cost_tooltip:0 "不扣款；不补发已付。"
 ywc_shu.1103.downgrade_shared.consequence_tooltip:0 "改走地方共议并进入 1104；仍可能失败。"
 ywc_shu.1103.downgrade_legacy:0 "承认拒付，改旧协商"
 ywc_shu.1103.downgrade_legacy.cost_tooltip:0 "不扣款。"
 ywc_shu.1103.downgrade_legacy.consequence_tooltip:0 "保留拒付记录并进入 1105；不保证成功。"
 ywc_shu.1103.wait_central:0 "暂缓，先补官署或结余"
 ywc_shu.1103.wait_central.cost_tooltip:0 "不扣费。"
 ywc_shu.1103.wait_central.consequence_tooltip:0 "保留 stage 1103；条件改善后由月度队列重发。"
 ywc_shu.1103.withdraw_after_central_fail:0 "撤回本线"
 ywc_shu.1103.withdraw_after_central_fail.cost_tooltip:0 "不新增费用；已付不退。"
 ywc_shu.1103.withdraw_after_central_fail.consequence_tooltip:0 "释放本线。"
 ywc_shu.1104.t:0 "共议桌上少了一把椅子"
 ywc_shu.1104.d:0 "地方共议要两样都真：一份仍有效的协商权，以及原试点州仍归本国。本线自己的省账可以产生这份权利；也可经仍 owned 的前序真权利接续。若只有旧记录而试点已失，只能算空椅子，须按 25% 官署重立并付一次真实会务费，或退回旧协商。"
 ywc_shu.1104.write_share_terms:0 "落实可核对的地方分担条款"
 ywc_shu.1104.write_share_terms.cost_tooltip:0 "同一仍归本国的原试点若有真实联核权，免费接续；否则国库支付半周收入、最低50的会务费。没有地方税款转移。"
 ywc_shu.1104.write_share_terms.consequence_tooltip:0 "登记本线分担条款及其试点来源，再观察六个历月。条款不表示地方现金已经到账。"
 ywc_shu.1104.meeting_without_terms:0 "开一次会，不落条款（受挫）"
 ywc_shu.1104.meeting_without_terms.cost_tooltip:0 "不扣费。"
 ywc_shu.1104.meeting_without_terms.consequence_tooltip:0 "记录受挫但不关闭；保留 stage 1104，须重立条件后才能成文。"
 ywc_shu.1104.fallback_legacy:0 "退回旧协商"
 ywc_shu.1104.fallback_legacy.cost_tooltip:0 "不扣费。"
 ywc_shu.1104.fallback_legacy.consequence_tooltip:0 "进入 1105；不继承共议权利。"
 ywc_shu.1104.wait_for_share_right:0 "暂缓，先补官署或现款"
 ywc_shu.1104.wait_for_share_right.cost_tooltip:0 "不扣费。"
 ywc_shu.1104.wait_for_share_right.consequence_tooltip:0 "保留 stage 1104；由月度队列在条件满足后重发，前序未参与不会永久卡死。"
 ywc_shu.1104.withdraw_after_share_fail:0 "撤回本线"
 ywc_shu.1104.withdraw_after_share_fail.cost_tooltip:0 "不新增费用。"
 ywc_shu.1104.withdraw_after_share_fail.consequence_tooltip:0 "释放本线。"
 ywc_shu.1105.t:0 "旧额还能不能再顶一年"
 ywc_shu.1105.d:0 "维持旧协商几乎是长期和平或尚未工业化时的默认选择：无新法、无新学校也能进入，条件只是真实财政安全且不在战争。但和平与旧额要真站得住：有本线未付地方责任或学校欠款时，只能如实记为受挫或重议，不能假装旧额自动清偿一切。"
 ywc_shu.1105.confirm_old_quota:0 "和平财政站得住，确立有限旧额"
 ywc_shu.1105.confirm_old_quota.cost_tooltip:0 "无新费用；不赠法律或建筑。"
 ywc_shu.1105.confirm_old_quota.consequence_tooltip:0 "以当前在岗官署、和平和财政安全确认有限旧额，再观察六月；不把此前地方责任记为已付现金，也不扩大中央覆盖。"
 ywc_shu.1105.renegotiate_next_year:0 "重议下一年：暂缓不免费通过"
 ywc_shu.1105.renegotiate_next_year.cost_tooltip:0 "不扣费。"
 ywc_shu.1105.renegotiate_next_year.consequence_tooltip:0 "保留 stage 1105；条件改善后重发，暂缓不等于免费通过。"
 ywc_shu.1105.withdraw_legacy_line:0 "撤回本线"
 ywc_shu.1105.withdraw_legacy_line.cost_tooltip:0 "不新增费用。"
 ywc_shu.1105.withdraw_legacy_line.consequence_tooltip:0 "释放本线。"
 ywc_shu.1106.t:0 "账本上的裂缝"
 ywc_shu.1106.d:0 "六历月核账成熟或被打断时，账本会出现裂缝。成熟且条件仍在时可按所选路线进入结算；战争、违约、破产或失州只转为延期或退出，不得把未成熟的核账写成完成，也不重复收取启动费。延期必须等恢复后从零重数六个月。"
 ywc_shu.1106.settle_on_time:0 "按期结算，进入收束"
 ywc_shu.1106.settle_on_time.cost_tooltip:0 "不重复收费。"
 ywc_shu.1106.settle_on_time.consequence_tooltip:0 "只把 stage 推到 1107；真正结局与释放留到 1107 当下重核。"
 ywc_shu.1106.defer_no_fee:0 "延期：恢复后从零重数六个月"
 ywc_shu.1106.defer_no_fee.cost_tooltip:0 "无新扣款。"
 ywc_shu.1106.defer_no_fee.consequence_tooltip:0 "清零 streak 并保留 stage 1106；恢复后要再走满六个真实月，绝不免费通过。"
 ywc_shu.1106.withdraw_ledger:0 "主动退出，进信用修复"
 ywc_shu.1106.withdraw_ledger.cost_tooltip:0 "不退已付款，不再新增。"
 ywc_shu.1106.withdraw_ledger.consequence_tooltip:0 "记退出并释放本线。"
 ywc_shu.1107.t:0 "下一任巡抚接不接这本账"
 ywc_shu.1107.d:0 "收尾只确认当下真实达到的那一档：确立、妥协、受挫可修复，或正式退出。这里不再扣费，不赠法律、学校或主权；之前记录的候选不等于当前完整资格，条件若已丢失，只能受挫、延期或退出。继任巡抚读同一变量接手。"
 ywc_shu.1107.close_established:0 "确认中央统筹的完整账约"
 ywc_shu.1107.close_established.cost_tooltip:0 "不扣费。"
 ywc_shu.1107.close_established.consequence_tooltip:0 "中央完整=1，地方/旧额/中央部分=2；按当下重核后释放本线一次。"
 ywc_shu.1107.close_compromise:0 "确认有边界的共议或旧额"
 ywc_shu.1107.close_compromise.cost_tooltip:0 "不扣费。"
 ywc_shu.1107.close_compromise.consequence_tooltip:0 "记录有限妥协，不把旧额或共议冒认为中央全额责任；释放本线一次容量。"
 ywc_shu.1107.close_setback:0 "确认受挫，保留可修复目标"
 ywc_shu.1107.close_setback.cost_tooltip:0 "不扣费。"
 ywc_shu.1107.close_setback.consequence_tooltip:0 "写受挫并保留修复目标；不冒充成功。"
 ywc_shu.1107.close_exit:0 "正式退出"
 ywc_shu.1107.close_exit.cost_tooltip:0 "不退已付款。"
 ywc_shu.1107.close_exit.consequence_tooltip:0 "写退出并释放本线；终结点永远有可执行选项。"
 ywc_je_v03_shu_deliberation_eligibility:0 "谁有资格站上朝堂"
 ywc_je_v03_shu_deliberation_eligibility_reason:0 "在真实财政旧约、现行法律、集团与原州岗位下，确定预算发言与申诉的责任：选择完整朝议咨询、财产代表或密议路线并核账见证，最终把真实预算责任签给户部。条件中断时如实记录，不把未发生的签字写成完成。"
 ywc_je_v03_shu_deliberation_appeal_execution:0 "六个月里谁在答复"
 ywc_je_v03_shu_deliberation_appeal_execution_reason:0 "申诉受理后进入本线独有的六历月真实观察：每个真实月度 pulse 计一次，同日重复回调由一天过期门防止双计；战争、失州、破产或当前责任丢失会清零并记中断，恢复后须明确重启。满六次成熟才按完整或有限路线收束，也不把未成熟的观察写成答复。"
 ywc_shu.1120.t:0 "先问谁能说话"
 ywc_shu.1120.d:0 "朝堂收到四份请愿：士人求当庭咨询，有产的实业家与农本户求代表席，缙绅与军镇求一扇密议的门，而户部只想知道有限申诉到底交给谁。本线试点已在实际拥有的四川、重庆、云南或贵州中定下；现行mode条件不足时，完整路线不许选。"
 ywc_shu.1120.court_consultation:0 "走朝议咨询：士人当庭发言"
 ywc_shu.1120.court_consultation.cost_tooltip:0 "本节点不交费；完整路线的登记费在1121按当时条件实付。"
 ywc_shu.1120.court_consultation.consequence_tooltip:0 "要求君主制、任命官僚、三项言论法之一、行政结余与正当性25、清议派在政府且clout≥0.10、原州公务≥0.8。"
 ywc_shu.1120.property_representation:0 "走财产代表：有产者入席"
 ywc_shu.1120.property_representation.cost_tooltip:0 "本节点不交费；有真实旧地方核账权时登记费为B，否则1.5B，在1121实付。"
 ywc_shu.1120.property_representation.consequence_tooltip:0 "要求财产/普查/普选选举法之一、集会或受保护言论、固定净收入非负、正当性25、实业家与农本户同在政府且clout≥0.10、原州公务≥0.5。"
 ywc_shu.1120.sealed_appeal:0 "走密议：缙绅与军镇递封奏"
 ywc_shu.1120.sealed_appeal.cost_tooltip:0 "本节点不交费；完整密议路线登记费为.5B，在1121实付。"
 ywc_shu.1120.sealed_appeal.consequence_tooltip:0 "要求专制或寡头、禁止异见或审查、威权50、正当性25、缙绅与军方同在政府且clout≥0.10、原州公务≥0.5。"
 ywc_shu.1120.limited_appeal:0 "明确有限申诉：只设target2受理"
 ywc_shu.1120.limited_appeal.cost_tooltip:0 "本节点不交费；有限受理登记费固定.5B，完整特惠不能覆盖有限价格。"
 ywc_shu.1120.limited_appeal.consequence_tooltip:0 "适用于任一政体或法律：只需原州公务≥0.25、行政结余非负、正当性20、和平与财务安全。mode3在此只作为显式有限选择，不依赖mode3完整法律。"
 ywc_shu.1120.defer_mode_choice:0 "暂缓：条件不足，等现行事实恢复"
 ywc_shu.1120.defer_mode_choice.cost_tooltip:0 "不扣费，不推进阶段。"
 ywc_shu.1120.defer_mode_choice.consequence_tooltip:0 "保留stage 1120；现行法律、集团或公务恢复后由月度队列重发。允许以后再议。"
 ywc_shu.1120.withdraw_at_1120:0 "撤回发言资格议程"
 ywc_shu.1120.withdraw_at_1120.cost_tooltip:0 "不产生新费用；已付款不退。"
 ywc_shu.1120.withdraw_at_1120.consequence_tooltip:0 "释放本线一次，记为主动退出；不改旧账、不清旧债。"
 ywc_shu.1121.t:0 "一份能被查问的预算"
 ywc_shu.1121.d:0 "户部把登记簿推过来：想把预算发言权立起来，先交登记费。完整朝议B、有真实旧地方核账权的财产代表B、无该权的财产代表1.5B、密议与有限受理各.5B。海商的旧钱不是新费，旧借入的钱不拿来支付本线。"
 ywc_shu.1121.pay_register:0 "实付登记费，立预算册"
 ywc_shu.1121.pay_register.cost_tooltip:0 "B在开线时捕获（年总收入÷52，最低100，不随弹窗重算）。mode1完整B；mode2完整有真实旧地方核账权B、无则1.5B；mode3完整.5B；target2有限.5B。先扣后记正额，不透支，不退不补。"
 ywc_shu.1121.pay_register.consequence_tooltip:0 "菜单与执行核同一当前价格、现金与破产状态；分支互斥，完整特惠不覆盖有限价格。"
 ywc_shu.1121.wait_register_funds:0 "暂缓缴费：先筹现款"
 ywc_shu.1121.wait_register_funds.cost_tooltip:0 "不扣费，不记已付。"
 ywc_shu.1121.wait_register_funds.consequence_tooltip:0 "保留stage 1121；现款恢复后由月度队列重发，价格按届时条件重核。"
 ywc_shu.1121.defer_register_stage:0 "再议：登记费暂不定"
 ywc_shu.1121.defer_register_stage.cost_tooltip:0 "不扣费。"
 ywc_shu.1121.defer_register_stage.consequence_tooltip:0 "wait允许以后再议；本节点不改业务、钱或队列。"
 ywc_shu.1121.withdraw_at_1121:0 "撤回预算登记"
 ywc_shu.1121.withdraw_at_1121.cost_tooltip:0 "不产生新费用；已付款不退。"
 ywc_shu.1121.withdraw_at_1121.consequence_tooltip:0 "释放本线一次并记退出。"
 ywc_shu.1122.t:0 "核账人的座次"
 ywc_shu.1122.d:0 "预算册立了，还要一位核账人。沿用真实旧地方核账或省共议证明且当前本州公务≥0.5，是免费的真实沿袭；没有该权的新见证须公务≥0.8；target2专有的local_witness只需0.25。见证来源写进案卷，此后持续复核。"
 ywc_shu.1122.reuse_local_witness:0 "沿用真实旧地方核账/省共议证明"
 ywc_shu.1122.reuse_local_witness.cost_tooltip:0 "不收费；真实旧权利即真实见证。"
