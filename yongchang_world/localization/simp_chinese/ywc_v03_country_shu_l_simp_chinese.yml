l_simp_chinese:
 ywc_je_v03_shu_register_pilot:0 "把田粮写进同一本册"
 ywc_je_v03_shu_register_pilot_reason:0 "在实际拥有的试点州核查田粮、官署就业与投入品短缺。可走中央清查、地方联核或有限旧额；中央路线要求现行土地/人头/比例税法基础，两次核账至少间隔三个月。条件不足时可补就业或改善供给后等待。"
 ywc_je_v03_shu_fiscal_settlement:0 "新税册要付旧承诺"
 ywc_je_v03_shu_fiscal_settlement_reason:0 "将前期账务决定用于军饷、地方供役或港口商人预垫。预垫本金一年后由月度财政回调自动偿还；国库不足会持续记录逾期压力。六个月连续审查只在和平、未违约、三月债务负担比未连续恶化、试点未失且官署可用时才成熟。"
 ywc_shu.1000.t:0 "一县交来两份册"
 ywc_shu.1000.d:0 "从实际拥有的四川、重庆、云南或贵州中选一州，让县吏、军镇和户部对同一册。失州后可重选，已经支出的差役银不退。"
 ywc_shu.1000.pilot_state_sichuan:0 "选定四川为试点州"
 ywc_shu.1000.pilot_state_sichuan.cost_tooltip:0 "不交费；只能选择实际拥有的四川、重庆、云南或贵州。"
 ywc_shu.1000.pilot_state_sichuan.consequence_tooltip:0 "之后核查只读这一州官署；失去后可重选，已付款不退。"
 ywc_shu.1000.pilot_state_chongqing:0 "选定重庆为试点州"
 ywc_shu.1000.pilot_state_chongqing.cost_tooltip:0 "不交费；只能选择实际拥有的四川、重庆、云南或贵州。"
 ywc_shu.1000.pilot_state_chongqing.consequence_tooltip:0 "之后核查只读这一州官署；失去后可重选，已付款不退。"
 ywc_shu.1000.pilot_state_yunnan:0 "选定云南为试点州"
 ywc_shu.1000.pilot_state_yunnan.cost_tooltip:0 "不交费；只能选择实际拥有的四川、重庆、云南或贵州。"
 ywc_shu.1000.pilot_state_yunnan.consequence_tooltip:0 "之后核查只读这一州官署；失去后可重选，已付款不退。"
 ywc_shu.1000.pilot_state_guizhou:0 "选定贵州为试点州"
 ywc_shu.1000.pilot_state_guizhou.cost_tooltip:0 "不交费；只能选择实际拥有的四川、重庆、云南或贵州。"
 ywc_shu.1000.pilot_state_guizhou.consequence_tooltip:0 "之后核查只读这一州官署；失去后可重选，已付款不退。"
 ywc_shu.1000.withdraw_before_pilot:0 "未选成试点，撤回本线"
 ywc_shu.1000.withdraw_before_pilot.cost_tooltip:0 "不产生新费用；既有已付款项不退。"
 ywc_shu.1000.withdraw_before_pilot.consequence_tooltip:0 "释放本线占用，记录撤回失信；候选州全部失去也可执行。"
 ywc_shu.1001.t:0 "量田的人住在哪里"
 ywc_shu.1001.d:0 "清查官须在指定试点州使用官署；该建筑就业达到八成且没有建筑投入品短缺，才可按真实行政结余记账。已满足条件者直接承认，不要求为了剧情回退法律。"
 ywc_shu.1001.central_register:0 "户部清查：按现行税法立账"
 ywc_shu.1001.central_register.cost_tooltip:0 "预算容许时，实扣开启时年总收入÷52（最低100）的一半；开启快照不随后收入改变重算。"
 ywc_shu.1001.central_register.consequence_tooltip:0 "需现行税法、试点州官署就业和投入品准备。"
 ywc_shu.1001.local_register:0 "地方联核：以查册权换取呈报"
 ywc_shu.1001.local_register.cost_tooltip:0 "无启动款；地方赚取复核权，赔偿另行审议。"
 ywc_shu.1001.local_register.consequence_tooltip:0 "不虚构官员或建筑，而是立即记下地方查册权。"
 ywc_shu.1001.cap_old_quota:0 "封顶旧额：只核对本地约定"
 ywc_shu.1001.cap_old_quota.cost_tooltip:0 "无启动款；不承诺全国清丘。"
 ywc_shu.1001.cap_old_quota.consequence_tooltip:0 "保留缙绅与军镇的旧服务义务。"
 ywc_shu.1001.wait_for_office:0 "暂缓：先补官署与供给"
 ywc_shu.1001.wait_for_office.cost_tooltip:0 "不扣费，也不记核账。"
 ywc_shu.1001.wait_for_office.consequence_tooltip:0 "可先补就业或投入品，再由月度队列重新发送。"
 ywc_shu.1001.reselect_state_sichuan:0 "失去试点后改选四川"
 ywc_shu.1001.reselect_state_sichuan.cost_tooltip:0 "重选不退回已付费用。"
 ywc_shu.1001.reselect_state_sichuan.consequence_tooltip:0 "核账只使用新选州；试点序列从失州前的下一个节点继续。"
 ywc_shu.1001.reselect_state_chongqing:0 "失去试点后改选重庆"
 ywc_shu.1001.reselect_state_chongqing.cost_tooltip:0 "重选不退回已付费用。"
 ywc_shu.1001.reselect_state_chongqing.consequence_tooltip:0 "核账只使用新选州；试点序列从失州前的下一个节点继续。"
 ywc_shu.1001.reselect_state_yunnan:0 "失去试点后改选云南"
 ywc_shu.1001.reselect_state_yunnan.cost_tooltip:0 "重选不退回已付费用。"
 ywc_shu.1001.reselect_state_yunnan.consequence_tooltip:0 "核账只使用新选州；试点序列从失州前的下一个节点继续。"
 ywc_shu.1001.reselect_state_guizhou:0 "失去试点后改选贵州"
 ywc_shu.1001.reselect_state_guizhou.cost_tooltip:0 "重选不退回已付费用。"
 ywc_shu.1001.reselect_state_guizhou.consequence_tooltip:0 "核账只使用新选州；试点序列从失州前的下一个节点继续。"
 ywc_shu.1001.withdraw_after_state_loss:0 "无可用试点：撤回核账承诺"
 ywc_shu.1001.withdraw_after_state_loss.cost_tooltip:0 "不退已支出费用或已发放的预垫。"
 ywc_shu.1001.withdraw_after_state_loss.consequence_tooltip:0 "以撤回失信结束，不假装其他州可用。"
 ywc_shu.1002.t:0 "免额也有一段来历"
 ywc_shu.1002.d:0 "地主递上祖传免额，附有修桥、供役的旧账。军镇说若重估税额就先补军饷；县吏提醒，重征不能把同一户的徭役抹成不存在。"
 ywc_shu.1002.time_limited_exemption:0 "成文有限免额，地方承担供役"
 ywc_shu.1002.time_limited_exemption.cost_tooltip:0 "无即时扣款；标记地方复核权与 12 个月分担。"
 ywc_shu.1002.time_limited_exemption.consequence_tooltip:0 "中央放弃部分覆盖换取地方供役和可复核期限。；地主支持提高 1 点，持续 12 个月。"
 ywc_shu.1002.collect_with_compensation:0 "照册征收，补偿地主损失"
 ywc_shu.1002.collect_with_compensation.cost_tooltip:0 "实扣 一周收入估算基数的两倍；若行政财政不允许，不付款、不记补偿。"
 ywc_shu.1002.collect_with_compensation.consequence_tooltip:0 "地主失去旧免额，获得一次补偿；反对标记留给后续核账。；实际付清后地主支持提高 2 点，持续 12 个月。"
 ywc_shu.1002.retain_exemption:0 "维持旧例，只核对边界"
 ywc_shu.1002.retain_exemption.cost_tooltip:0 "无即时扣款；放弃全国税基覆盖的表述。"
 ywc_shu.1002.retain_exemption.consequence_tooltip:0 "承认受挫妥协，以有限旧额继续，仍可进入后期重议。；地主支持提高 3 点，持续 12 个月。"
 ywc_shu.1003.t:0 "军镇先领的那一份"
 ywc_shu.1003.d:0 "武勋军镇把守边账与欠饷单并排放在案头。无战事也有轮值和驻防开销；地方官主张自己的税款不能被中央一笔带走。"
 ywc_shu.1003.pay_partial_advance:0 "先付一笔核对过的军饷预付款"
 ywc_shu.1003.pay_partial_advance.cost_tooltip:0 "最多扣成本基数的四分之一；财政门槛不满足时不付款。"
 ywc_shu.1003.pay_partial_advance.consequence_tooltip:0 "记录军方由中央预付，但不宣称欠饷已全部结清。"
 ywc_shu.1003.budget_queue:0 "列入预算次序，不承诺额外军心"
 ywc_shu.1003.budget_queue.cost_tooltip:0 "不立即扣款；未来预算压力由真实国库承担。"
 ywc_shu.1003.budget_queue.consequence_tooltip:0 "军镇仍须等预算，不能凭选择获得免费支持。"
 ywc_shu.1003.provincial_pay:0 "由地方抵饷，承认对应税权"
 ywc_shu.1003.provincial_pay.cost_tooltip:0 "无即时扣款；用地方留用份额换取军镇账务。"
 ywc_shu.1003.provincial_pay.consequence_tooltip:0 "省朝分工线和本线结局都将读取谁承担供军责任。"
 ywc_shu.1004.t:0 "被写了两次的丁口"
 ywc_shu.1004.d:0 "一户民户的田粮记在县册，修堤和运粮又被军镇算作另一项差役。户部不能凭一桩呈状改写全国人口，但可以决定谁受理这本旧册的申诉。"
 ywc_shu.1004.central_appeal:0 "交官署复核，承担持续行政工作"
 ywc_shu.1004.central_appeal.cost_tooltip:0 "无即时扣款；由真实行政结余与岗位供给承担持续工作。"
 ywc_shu.1004.central_appeal.consequence_tooltip:0 "中央形成复核程序，但若官署空缺，个案不会被写成已解决。"
 ywc_shu.1004.local_mediation:0 "交地方联核，保留地方裁判"
 ywc_shu.1004.local_mediation.cost_tooltip:0 "不即时扣款；换取地方裁判与查册权。"
 ywc_shu.1004.local_mediation.consequence_tooltip:0 "保护地方旧例，降低中央覆盖，并在结局保留申诉权限。"
 ywc_shu.1004.leave_old_roll:0 "不改旧册，缩小本轮覆盖"
 ywc_shu.1004.leave_old_roll.cost_tooltip:0 "无即时扣款。"
 ywc_shu.1004.leave_old_roll.consequence_tooltip:0 "缙绅暂获稳定，重复供役问题继续留在案卷。"
 ywc_shu.1005.t:0 "海商愿意垫银"
 ywc_shu.1005.d:0 "港口海商可先垫一周收入估算本金；无港时也可请本地粮户预付税银。本金保留为未偿债务，国库不足时持续等待并承担逾期政治代价。"
 ywc_shu.1005.accept_port_advance:0 "有港口时接纳商人预垫"
 ywc_shu.1005.accept_port_advance.cost_tooltip:0 "港口海商或本地粮户先垫一周收入估算本金，一年后自动偿还同额本金。"
 ywc_shu.1005.accept_port_advance.consequence_tooltip:0 "港口不可用时，本地粮户可先垫同额本金；一年后开始按月偿还，国库不足则逾期效果保留。"
 ywc_shu.1005.refuse_private_advance:0 "拒绝预垫，不抵押后续港税"
 ywc_shu.1005.refuse_private_advance.cost_tooltip:0 "无即时转账和新债务。"
 ywc_shu.1005.refuse_private_advance.consequence_tooltip:0 "中央保留未来税则空间，但失去短期商人周转银。"
 ywc_shu.1005.narrow_pilot:0 "缩小清查，不借外银"
 ywc_shu.1005.narrow_pilot.cost_tooltip:0 "不追加审计扣款。"
 ywc_shu.1005.narrow_pilot.consequence_tooltip:0 "海商线不假设大顺工业化，有限旧额仍可正常结算。"
 ywc_shu.1006.t:0 "第二次核账，或承认久阻"
 ywc_shu.1006.d:0 "两次正式核账至少相隔三个月。若三十六个月仍卡在官署、投入品或财政条件，可以承认试点受挫、转为有限旧额，不把未发生的第二次核账写成完成。"
 ywc_shu.1006.publish_central_difference:0 "公布中央核出的差额"
 ywc_shu.1006.publish_central_difference.cost_tooltip:0 "第二笔审计估算额为 一周收入估算基数的一半；财政不允许时保留待办，不记已付。"
 ywc_shu.1006.publish_central_difference.consequence_tooltip:0 "必须满足本地官署、行政结余、纸张与两次核账；点击本身不创造税收。"
 ywc_shu.1006.settle_as_provincial:0 "承认地方分担，按较低覆盖结算"
 ywc_shu.1006.settle_as_provincial.cost_tooltip:0 "按审计基数比例支付；地方分担不生成额外银两。"
 ywc_shu.1006.settle_as_provincial.consequence_tooltip:0 "前提是已有地方联核/分税责任，结局须承认较低中央覆盖。"
 ywc_shu.1006.pause_as_legacy:0 "暂停清查，保留有限旧额"
 ywc_shu.1006.pause_as_legacy.cost_tooltip:0 "不退前款，不产生第二笔扣款。"
 ywc_shu.1006.pause_as_legacy.consequence_tooltip:0 "仅在试点仍归本国、财政安全且官署就业至少四分之一时转入限额旧额审查；仍需完成连续六个月履约。"
 ywc_shu.1006.withdraw_after_failed_audit:0 "撤回并保留已付款"
 ywc_shu.1006.withdraw_after_failed_audit.cost_tooltip:0 "不再新增费用；已付款不退。"
 ywc_shu.1006.withdraw_after_failed_audit.consequence_tooltip:0 "记录撤回失信并结束本线。"
 ywc_shu.1007.t:0 "省里留用的那一份"
 ywc_shu.1007.d:0 "户部要把新册上的收入用在军饷、地方供役还是海关垫款上。中央查核、地方分担、旧额封顶互相排斥，不能同时取三份好处。"
 ywc_shu.1007.central_public_duties:0 "中央负责军饷与公共项目"
 ywc_shu.1007.central_public_duties.cost_tooltip:0 "六个月观察期内须保持净固定收入非负；不追加免征法令。"
 ywc_shu.1007.central_public_duties.consequence_tooltip:0 "中央查核路线继续；真实军饷与官署支出仍由预算承担。"
 ywc_shu.1007.provincial_retention:0 "地方留用一份，换共同供役"
 ywc_shu.1007.provincial_retention.cost_tooltip:0 "六个月观察地方履约；中央覆盖率较低。"
 ywc_shu.1007.provincial_retention.consequence_tooltip:0 "地方查册权与军镇分担进入结局；海商预垫不能抵销它。"
 ywc_shu.1007.cap_old_dues:0 "封顶旧额，承认中央只管试点"
 ywc_shu.1007.cap_old_dues.cost_tooltip:0 "不退已付费用，也不延伸全国征收。"
 ywc_shu.1007.cap_old_dues.consequence_tooltip:0 "允许保守秩序继续，但不领取中央查核成果。"
 ywc_shu.1007.defer_until_ready:0 "暂缓裁定：待试点与旧额核对条件恢复"
 ywc_shu.1007.defer_until_ready.cost_tooltip:0 "不新增费用、不开始观察期；已经支出的款项不退。"
 ywc_shu.1007.defer_until_ready.consequence_tooltip:0 "按共用大事件冷却重新排入本事件；条件未恢复前不会启动180天观察或产生结算。"
 ywc_shu.1007.withdraw_before_execution:0 "撤回未能执行的旧额约定"
 ywc_shu.1007.withdraw_before_execution.cost_tooltip:0 "不新增费用；此前已支出的费用或预垫仍保留，不予退回。"
 ywc_shu.1007.withdraw_before_execution.consequence_tooltip:0 "以撤回失信结束并释放本线名额，不记作旧额结算成功。"
 ywc_shu.1008.t:0 "账册写不进战报"
 ywc_shu.1008.d:0 "六个月巩固期到来。平时审查净固定收入与官署投入品；真实战争、破产、预算转负或试点失地时不装作和平，改作战时限缩或信用修复。"
 ywc_shu.1008.review_in_peace:0 "和平审查：保留能支付的安排"
 ywc_shu.1008.review_in_peace.cost_tooltip:0 "不另扣款；按真实预算检查。"
 ywc_shu.1008.review_in_peace.consequence_tooltip:0 "条件达标才可确立，否则后续选项只能妥协或封顶。"
 ywc_shu.1008.limit_for_war:0 "战时/财政受挫：保留试点，暂停并重启六个月审查"
 ywc_shu.1008.limit_for_war.cost_tooltip:0 "保留已付款项，不追加预算；延后责任仍记录。"
 ywc_shu.1008.limit_for_war.consequence_tooltip:0 "不强迫停战；中断会清零，和平恢复且试点仍在后，重新开启完整六个月审查。"
 ywc_shu.1008.withdraw_repair_credit:0 "撤回承诺，进入信用修复"
 ywc_shu.1008.withdraw_repair_credit.cost_tooltip:0 "不退已付款，也不再新增承诺。"
 ywc_shu.1008.withdraw_repair_credit.consequence_tooltip:0 "主动退出被记为失信；后续海关与省朝线仍可重谈。"
 ywc_shu.1008.reselect_state_sichuan:0 "重选四川为核账试点"
 ywc_shu.1008.reselect_state_sichuan.cost_tooltip:0 "重选不退旧账，不收新的标准试点费。"
 ywc_shu.1008.reselect_state_sichuan.consequence_tooltip:0 "新试点需重新连续观察180天，只有四川、重庆、云南、贵州中实际拥有的州有效。"
 ywc_shu.1008.reselect_state_chongqing:0 "重选重庆为核账试点"
 ywc_shu.1008.reselect_state_chongqing.cost_tooltip:0 "重选不退旧账，不收新的标准试点费。"
 ywc_shu.1008.reselect_state_chongqing.consequence_tooltip:0 "新试点需重新连续观察180天，只有四川、重庆、云南、贵州中实际拥有的州有效。"
 ywc_shu.1008.reselect_state_yunnan:0 "重选云南为核账试点"
 ywc_shu.1008.reselect_state_yunnan.cost_tooltip:0 "重选不退旧账，不收新的标准试点费。"
 ywc_shu.1008.reselect_state_yunnan.consequence_tooltip:0 "新试点需重新连续观察180天，只有四川、重庆、云南、贵州中实际拥有的州有效。"
 ywc_shu.1008.reselect_state_guizhou:0 "重选贵州为核账试点"
 ywc_shu.1008.reselect_state_guizhou.cost_tooltip:0 "重选不退旧账，不收新的标准试点费。"
 ywc_shu.1008.reselect_state_guizhou.consequence_tooltip:0 "新试点需重新连续观察180天，只有四川、重庆、云南、贵州中实际拥有的州有效。"
 ywc_shu.1009.t:0 "留下来的那本税册"
 ywc_shu.1009.d:0 "结算不是一条免费加税法令。朝廷逐项确认谁核账、谁供役、海商是否垫银，和净固定收入能否支撑官署；未达到的只能按局部妥协、旧额或失信退出。"
