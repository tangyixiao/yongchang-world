 ywc_shu.1015.dismiss_stale_appointment:0 "关闭过时的任用通知"
 ywc_shu.1015.dismiss_stale_appointment.cost_tooltip:0 "不付款；可确认已处理供给时重送任用，否则回到供给核验。"
 ywc_shu.1015.dismiss_stale_appointment.consequence_tooltip:0 "保留当前阶段和已签责任。"
 ywc_shu.1015.wait_for_appointments:0 "等待岗位和供给，再核任用"
 ywc_shu.1015.wait_for_appointments.cost_tooltip:0 "不立即扣款，已签义务继续有效。"
 ywc_shu.1015.wait_for_appointments.consequence_tooltip:0 "条件恢复后可继续原军制路线。"
