 ywc_jhg.1012.t:0 "分摊护航的那个人"
 ywc_jhg.1012.d:0 "有人愿意分摊护航，条件是两国船队按同一旗号巡弋。这不只是军事问题，也是外交问题：那份同盟条约还在不在。"
 ywc_jhg.1012.shared_escort:0 "按同盟条件分摊"
 ywc_jhg.1012.shared_escort.cost_tooltip:0 "一次性登记费＝开启时年财政总收入÷52 的快照，实际从国库扣款；须未违约且未破产。 另需同盟与友好关系。"
 ywc_jhg.1012.shared_escort.consequence_tooltip:0 "覆盖面扩大，但依赖伙伴履约。"
 ywc_jhg.1012.defer:0 "暂缓并待条件恢复"
