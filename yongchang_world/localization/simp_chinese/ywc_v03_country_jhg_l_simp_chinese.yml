 ywc_jhg.1014.t:0 "保险行的条件"
 ywc_jhg.1014.d:0 "保险行愿意承保，但要海口出具航路风险评估，并承认保费由商人自付。这要求税关真的能评估，而不是盖个章。"
 ywc_jhg.1014.insurance:0 "接受保险方案"
 ywc_jhg.1014.insurance.cost_tooltip:0 "一次性登记费＝开启时年财政总收入÷52 的快照，实际从国库扣款；须未违约且未破产。 另需官僚能力不低于 20。"
 ywc_jhg.1014.insurance.consequence_tooltip:0 "水师减负，商人承担保费。"
 ywc_jhg.1014.defer:0 "暂缓并待条件恢复"
