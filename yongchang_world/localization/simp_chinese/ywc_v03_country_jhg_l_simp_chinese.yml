l_simp_chinese:
 ywc_je_v03_jhg_court_assembly:0 "王府账房与商议会"
 ywc_je_v03_jhg_court_assembly_reason:0 "账册、王府担保与商界提案各有代价。办理时由本国国库缴一次登记费；后续能否结案，按在岗行政人员及现有路线资格核验，不会凭此提高合法性。"
 ywc_je_v03_jhg_court_settlement:0 "账房结算"
 ywc_je_v03_jhg_court_settlement_reason:0 "账房把六个月的簿册摊开，逐季核对税关记录，也查看在岗人手。若眼下的条件撑得住，商议会可按原条款结案；否则，王府仍可改以妥协收束。"
 ywc_jhg.1000.t:0 "王府账房与商议会"
 ywc_jhg.1000.d:0 "海口税关的账册摊在王府长案上，船主代表坐在下首。摆上桌的不是现成银款，而是三种本国办法：公开账目争取信用、以王府名义担保，或由商界提出优先报关的条件。每条路都先缴本国登记费。"
 ywc_jhg.1000.audit_contract:0 "登记审账契约提案"
 ywc_jhg.1000.audit_contract.cost_tooltip:0 "一次性登记费＝开启时年财政总收入÷52 的快照，实际从国库扣款；须未违约且未破产。 另需官僚机构在岗率达标。"
 ywc_jhg.1000.audit_contract.consequence_tooltip:0 "登记本国审账安排；不额外增加行政负担或合法性。"
 ywc_jhg.1000.prince_guarantee:0 "登记王府担保提案"
 ywc_jhg.1000.prince_guarantee.cost_tooltip:0 "一次性登记费＝开启时年财政总收入÷52 的快照，实际从国库扣款；须未违约且未破产。 另需财产代表制度。"
 ywc_jhg.1000.prince_guarantee.consequence_tooltip:0 "登记本国担保安排；不额外改变权威、地主支持或透明度。"
 ywc_jhg.1000.merchant_pool:0 "提出商界优先报关方案"
 ywc_jhg.1000.merchant_pool.cost_tooltip:0 "一次性登记费＝开启时年财政总收入÷52 的快照，实际从国库扣款；须未违约且未破产。 另需实业家势力崛起。"
 ywc_jhg.1000.merchant_pool.consequence_tooltip:0 "本国登记商界优先报关安排；不改变税基、合法性或利益集团实力。"
 ywc_jhg.1000.defer:0 "暂缓并待条件恢复"
 ywc_jhg.1000.defer.cost_tooltip:0 "不扣费。"
 ywc_jhg.1000.defer.consequence_tooltip:0 "登记仍开放，条件恢复后可重试。"
 ywc_jhg.1000.withdraw:0 "撤回登记"
 ywc_jhg.1000.withdraw.cost_tooltip:0 "保留已付费用，不退还。"
 ywc_jhg.1000.withdraw.consequence_tooltip:0 "记录受挫并幂等释放本线名额。"
 ywc_jhg.1001.t:0 "审账契约的细则"
 ywc_jhg.1001.d:0 "商议会要求每季公开税关账册，并派两名船主列席。王府账房担心的是：公开之后，谁来核。"
 ywc_jhg.1001.audit_contract:0 "记下季度公开条款"
 ywc_jhg.1001.audit_contract.cost_tooltip:0 "一次性登记费＝开启时年财政总收入÷52 的快照，实际从国库扣款；须未违约且未破产。 另需行政机构在岗。"
 ywc_jhg.1001.audit_contract.consequence_tooltip:0 "按既有行政与在岗条件继续审账资格核验，不产生新的行政负担或合法性。"
 ywc_jhg.1001.defer:0 "暂缓并待条件恢复"
 ywc_jhg.1001.defer.cost_tooltip:0 "不扣费。"
 ywc_jhg.1001.defer.consequence_tooltip:0 "登记仍开放，条件恢复后可重试。"
 ywc_jhg.1001.withdraw:0 "撤回登记"
 ywc_jhg.1001.withdraw.cost_tooltip:0 "保留已付费用，不退还。"
 ywc_jhg.1001.withdraw.consequence_tooltip:0 "记录受挫并幂等释放本线名额。"
 ywc_jhg.1002.t:0 "王府担保的代价"
 ywc_jhg.1002.d:0 "王府名义的担保提案摆上桌面。能否继续登记，取决于现有合法性门槛；此选择并不意味着银号已经放款。"
 ywc_jhg.1002.prince_guarantee:0 "登记王府担保提案"
 ywc_jhg.1002.prince_guarantee.cost_tooltip:0 "一次性登记费＝开启时年财政总收入÷52 的快照，实际从国库扣款；须未违约且未破产。 另需合法性不低于 30。"
 ywc_jhg.1002.prince_guarantee.consequence_tooltip:0 "依现有合法性门槛核验本国担保方案；不另行提高权威。"
 ywc_jhg.1002.defer:0 "暂缓并待条件恢复"
 ywc_jhg.1002.defer.cost_tooltip:0 "不扣费。"
 ywc_jhg.1002.defer.consequence_tooltip:0 "登记仍开放，条件恢复后可重试。"
 ywc_jhg.1002.withdraw:0 "撤回登记"
 ywc_jhg.1002.withdraw.cost_tooltip:0 "保留已付费用，不退还。"
 ywc_jhg.1002.withdraw.consequence_tooltip:0 "记录受挫并幂等释放本线名额。"
 ywc_jhg.1003.t:0 "商人包筹的账"
 ywc_jhg.1003.d:0 "商人提出以三年优先报关换取一份本国登记安排。账房逐项核对的是既有条件：工业派须有足够影响力，国库须能承担一次申报费；账面上没有商人向国库垫款。"
 ywc_jhg.1003.merchant_pool:0 "登记优先报关提案"
 ywc_jhg.1003.merchant_pool.cost_tooltip:0 "一次性登记费＝开启时年财政总收入÷52 的快照，实际从国库扣款；须未违约且未破产。 另需实业家势力且不处于违约。"
 ywc_jhg.1003.merchant_pool.consequence_tooltip:0 "登记本国优先报关安排；不转入商人垫款，也不改变税基、合法性或工业派实力。"
 ywc_jhg.1003.defer:0 "暂缓并待条件恢复"
 ywc_jhg.1003.defer.cost_tooltip:0 "不扣费。"
 ywc_jhg.1003.defer.consequence_tooltip:0 "登记仍开放，条件恢复后可重试。"
 ywc_jhg.1003.withdraw:0 "撤回登记"
 ywc_jhg.1003.withdraw.cost_tooltip:0 "保留已付费用，不退还。"
 ywc_jhg.1003.withdraw.consequence_tooltip:0 "记录受挫并幂等释放本线名额。"
 ywc_jhg.1004.t:0 "在岗的账房先生"
 ywc_jhg.1004.d:0 "审账契约要求每季核账，可税关的账房有一半位置空着。空缺不是纸面问题：它决定这份契约能不能兑现。"
 ywc_jhg.1004.audit_contract:0 "核验现有账房人员"
 ywc_jhg.1004.audit_contract.cost_tooltip:0 "一次性登记费＝开启时年财政总收入÷52 的快照，实际从国库扣款；须未违约且未破产。 另需行政机构在岗率不低于 80%。"
 ywc_jhg.1004.audit_contract.consequence_tooltip:0 "本国缴清一次性登记费，并须维持既有行政在岗门槛；不会另收持续性行政费用。"
 ywc_jhg.1004.defer:0 "暂缓并待条件恢复"
 ywc_jhg.1004.defer.cost_tooltip:0 "不扣费。"
 ywc_jhg.1004.defer.consequence_tooltip:0 "登记仍开放，条件恢复后可重试。"
 ywc_jhg.1004.withdraw:0 "撤回登记"
 ywc_jhg.1004.withdraw.cost_tooltip:0 "保留已付费用，不退还。"
 ywc_jhg.1004.withdraw.consequence_tooltip:0 "记录受挫并幂等释放本线名额。"
 ywc_jhg.1005.t:0 "谁代表财产"
 ywc_jhg.1005.d:0 "商议会说它代表纳税的船主，王府说它代表不了岛内的地主。谁坐在桌边，取决于这个国家怎么定义财产代表。"
 ywc_jhg.1005.prince_guarantee:0 "按现行制度确认代表资格"
 ywc_jhg.1005.prince_guarantee.cost_tooltip:0 "一次性登记费＝开启时年财政总收入÷52 的快照，实际从国库扣款；须未违约且未破产。 另需财产代表法律或地主势力。"
 ywc_jhg.1005.prince_guarantee.consequence_tooltip:0 "按现有代表制度或地主实力核验列席资格；不另行改变合法性。"
 ywc_jhg.1005.defer:0 "暂缓并待条件恢复"
 ywc_jhg.1005.defer.cost_tooltip:0 "不扣费。"
 ywc_jhg.1005.defer.consequence_tooltip:0 "登记仍开放，条件恢复后可重试。"
 ywc_jhg.1005.withdraw:0 "撤回登记"
 ywc_jhg.1005.withdraw.cost_tooltip:0 "保留已付费用，不退还。"
 ywc_jhg.1005.withdraw.consequence_tooltip:0 "记录受挫并幂等释放本线名额。"
 ywc_jhg.1006.t:0 "六个月的观察"
 ywc_jhg.1006.d:0 "登记费已经由国库一次缴清。接下来的六个月，账房会核看行政人员是否在岗、既有条件是否仍满足；这段观察不会另行提高合法性。"
 ywc_jhg.1006.hold_course:0 "继续观察现行安排"
 ywc_jhg.1006.hold_course.cost_tooltip:0 "不额外收费。"
 ywc_jhg.1006.hold_course.consequence_tooltip:0 "观察期继续，六个月后才结算。"
 ywc_jhg.1006.defer:0 "暂缓并待条件恢复"
 ywc_jhg.1006.defer.cost_tooltip:0 "不扣费。"
 ywc_jhg.1006.defer.consequence_tooltip:0 "登记仍开放，条件恢复后可重试。"
 ywc_jhg.1006.withdraw:0 "撤回登记"
 ywc_jhg.1006.withdraw.cost_tooltip:0 "保留已付费用，不退还。"
 ywc_jhg.1006.withdraw.consequence_tooltip:0 "记录受挫并幂等释放本线名额。"
 ywc_jhg.1007.t:0 "账房结算"
 ywc_jhg.1007.d:0 "六个月期满，按在岗人员和现有资格核验结果结案。选择完整结案或妥协结案，只决定本国记录的结果；它不会另行改变合法性、权威、税基或利益集团实力。"
 ywc_jhg.1007.settle_full:0 "记录完整结案结果"
 ywc_jhg.1007.settle_full.cost_tooltip:0 "不额外收费。"
 ywc_jhg.1007.settle_full.consequence_tooltip:0 "写入本线结果并释放名额。"
 ywc_jhg.1007.settle_partial:0 "记录妥协结案结果"
 ywc_jhg.1007.settle_partial.cost_tooltip:0 "不额外收费。"
 ywc_jhg.1007.settle_partial.consequence_tooltip:0 "写入折中结果并释放名额。"
 ywc_jhg.1007.defer:0 "暂缓并待条件恢复"
 ywc_jhg.1007.defer.cost_tooltip:0 "不扣费。"
 ywc_jhg.1007.defer.consequence_tooltip:0 "登记仍开放，条件恢复后可重试。"
 ywc_jhg.1007.withdraw:0 "撤回登记"
 ywc_jhg.1007.withdraw.cost_tooltip:0 "保留已付费用，不退还。"
 ywc_jhg.1007.withdraw.consequence_tooltip:0 "记录受挫并幂等释放本线名额。"
 ywc_jhg.1007.acknowledge_12_notice:0 "确认十二个月提醒，继续原排程"
 ywc_jhg.1007.acknowledge_12_notice.cost_tooltip:0 "此选项不收费。"
 ywc_jhg.1007.acknowledge_12_notice.consequence_tooltip:0 "保留普通事件队列，提醒不会覆盖正在等待的事项。"
 ywc_jhg.1007.limited_36_settlement:0 "选择较低目标并重新观察180天"
 ywc_jhg.1007.limited_36_settlement.cost_tooltip:0 "此选项不收费。"
 ywc_jhg.1007.limited_36_settlement.consequence_tooltip:0 "将当前路线切换为该路线的较低资格目标；所有相关条件连续满足180天后，才可选择有限和解。"
 ywc_je_v03_jhg_convoy_capacity:0 "护航不是一句话"
 ywc_je_v03_jhg_convoy_capacity_reason:0 "七条航路、三支船队，全境护航并不可行。本国可登记有限主航线、向实际伙伴询请分摊，或采用商业保险提案。"
 ywc_je_v03_jhg_convoy_partner_watch:0 "分摊护航的伙伴"
 ywc_je_v03_jhg_convoy_partner_watch_reason:0 "提督核对已发出的询请、伙伴的实际答复和双方约定的费用与期限。伙伴失去履约能力时，合伙暂停；可以重议本国方案。这些账目不会自动派出联合舰队。"
 ywc_je_v03_jhg_convoy_settlement:0 "航路结算"
 ywc_je_v03_jhg_convoy_settlement_reason:0 "按所选方案核查本国条件；共护还须核查已签伙伴及其中断后的恢复期。已完成的本国观察保留，转向国内方案须重新观察。"
 ywc_jhg.1010.t:0 "护航不是一句话"
 ywc_jhg.1010.d:0 "海口商会列出需要护航的商路。靖海的舰队和财政不足以免费覆盖全部海域：王府可以集中主航线、邀请兰芳或东明按具体条款分摊，或登记本国商业保险。外方自行决定是否接受。"
 ywc_jhg.1010.main_lane:0 "登记主航线方案"
 ywc_jhg.1010.main_lane.cost_tooltip:0 "一次性登记费＝开启时年财政总收入÷52 的快照，实际从国库扣款；须未违约且未破产。 另需水师规模与港口在岗。"
 ywc_jhg.1010.main_lane.consequence_tooltip:0 "登记仅针对主航线的本国安排；没有实际舰队部署或全航路护航。"
 ywc_jhg.1010.shared_escort:0 "邀请兰芳分摊护航"
 ywc_jhg.1010.shared_escort.cost_tooltip:0 "立案费按入场时年财政总收入 ÷ 52 计算，最低 100、最高 1,000,000,000；已付立案费不重复收取。若对方同意且靖海支付得起，另将立案费的一半转给该伙伴。"
 ywc_jhg.1010.shared_escort.consequence_tooltip:0 "只向兰芳发出询请；对方独立决定是否按所报费用和期限分担护航。拒绝或过期后可改用主航线或本国保险。"
 ywc_jhg.1010.shared_escort_dmg:0 "邀请东明分摊护航"
 ywc_jhg.1010.shared_escort_dmg.cost_tooltip:0 "立案费按入场时年财政总收入 ÷ 52 计算，最低 100、最高 1,000,000,000；已付立案费不重复收取。若对方同意且靖海支付得起，另将立案费的一半转给该伙伴。"
 ywc_jhg.1010.shared_escort_dmg.consequence_tooltip:0 "只向东明发出询请；对方独立决定是否按所报费用和期限分担护航。拒绝或过期后可改用主航线或本国保险。"
 ywc_jhg.1010.insurance:0 "登记本国商业保险提案"
 ywc_jhg.1010.insurance.cost_tooltip:0 "一次性登记费＝开启时年财政总收入÷52 的快照，实际从国库扣款；须未违约且未破产。 另需官僚能力且不处于违约。"
 ywc_jhg.1010.insurance.consequence_tooltip:0 "登记本国商业保险安排；不会因此减轻海军压力或替商人缴纳保费。"
 ywc_jhg.1010.defer:0 "暂缓并待条件恢复"
 ywc_jhg.1010.defer.cost_tooltip:0 "不扣费。"
 ywc_jhg.1010.defer.consequence_tooltip:0 "登记仍开放，条件恢复后可重试。"
 ywc_jhg.1010.withdraw:0 "撤回登记"
 ywc_jhg.1010.withdraw.cost_tooltip:0 "保留已付费用，不退还。"
 ywc_jhg.1010.withdraw.consequence_tooltip:0 "记录受挫并幂等释放本线名额。"
 ywc_jhg.1011.t:0 "船旗与船坞"
 ywc_jhg.1011.d:0 "船旗与船坞都要有人维护。主航线方案要核验靖海现有港口；若伙伴已经签约，也可以按合伙继续，或改用本国保险。纸面约定不会自动派出船只。"
 ywc_jhg.1011.main_lane:0 "核验主航线港口现有人员"
 ywc_jhg.1011.main_lane.cost_tooltip:0 "一次性登记费＝开启时年财政总收入÷52 的快照，实际从国库扣款；须未违约且未破产。 另需港口在岗率不低于 80%。"
 ywc_jhg.1011.main_lane.consequence_tooltip:0 "记下仅覆盖主航线的本国方案；其余航路尚未列入安排。"
 ywc_jhg.1011.shared_escort:0 "依照已签合伙安排船旗"
 ywc_jhg.1011.shared_escort.cost_tooltip:0 "分摊费用已在合伙签署时支付，此步不再扣款。"
 ywc_jhg.1011.shared_escort.consequence_tooltip:0 "读取仍有效的伙伴合伙，不要求靖海自身港口已满员；不会自动部署舰队。"
 ywc_jhg.1011.insurance:0 "改用本国保险方案"
 ywc_jhg.1011.insurance.cost_tooltip:0 "保留已付登记费；本步不重复收费。"
 ywc_jhg.1011.insurance.consequence_tooltip:0 "撤回未签询请，改走本国保险路线；已签且已付的合伙费用保留。"
 ywc_jhg.1011.defer:0 "暂缓并待条件恢复"
 ywc_jhg.1011.defer.cost_tooltip:0 "不扣费。"
 ywc_jhg.1011.defer.consequence_tooltip:0 "登记仍开放，条件恢复后可重试。"
 ywc_jhg.1011.withdraw:0 "撤回登记"
 ywc_jhg.1011.withdraw.cost_tooltip:0 "保留已付费用，不退还。"
 ywc_jhg.1011.withdraw.consequence_tooltip:0 "记录受挫并幂等释放本线名额。"
 ywc_jhg.1012.t:0 "分摊护航的那个人"
 ywc_jhg.1012.d:0 "海军部把护航账册送到王府。实际回函、已签条款与伙伴现有能力决定能否继续共护；等待、重新询请或转向主航线与保险也有各自的代价。"
 ywc_jhg.1012.shared_escort:0 "按已签护航合伙继续"
 ywc_jhg.1012.shared_escort.cost_tooltip:0 "已签合伙的分摊费用已支付，本步不再扣款。"
 ywc_jhg.1012.shared_escort.consequence_tooltip:0 "只读取仍有效的实际合伙；伙伴失效时可改用主航线或本国保险。"
 ywc_jhg.1012.main_lane:0 "登记主航线方案"
 ywc_jhg.1012.main_lane.cost_tooltip:0 "一次性登记费＝开启时年财政总收入÷52 的快照，实际从国库扣款；须未违约且未破产。 另需水师规模与港口在岗。"
