 ywc_jhg.1014.withdraw.consequence_tooltip:0 "记录受挫并幂等释放本线名额。"
 ywc_jhg.1015.t:0 "第七片海"
 ywc_jhg.1015.d:0 "商会又一次把「全境护航」摆上桌。提督把海图推开：要护全七条航路，得有一支常设护航基金，而这份基金从来没有人肯出。"
 ywc_jhg.1015.explain_limits:0 "说明能力边界"
 ywc_jhg.1015.explain_limits.cost_tooltip:0 "不额外收费。"
 ywc_jhg.1015.explain_limits.consequence_tooltip:0 "全境护航始终不可达，只能维持有限覆盖。"
 ywc_jhg.1015.defer:0 "暂缓并待条件恢复"
