 ywc_jhg.1012.withdraw.consequence_tooltip:0 "记录受挫并幂等释放本线名额。"
 ywc_jhg.1013.t:0 "军费的账"
 ywc_jhg.1013.d:0 "水师要扩编，军费要加。账房提醒：护航的钱不是从海里捞的，是从税里出的。"
 ywc_jhg.1013.main_lane:0 "只加主航线编制"
 ywc_jhg.1013.main_lane.cost_tooltip:0 "一次性登记费＝开启时年财政总收入÷52 的快照，实际从国库扣款；须未违约且未破产。 另需水师规模达标。"
