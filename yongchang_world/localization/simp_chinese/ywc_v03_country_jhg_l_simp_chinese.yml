 ywc_jhg.1011.withdraw.consequence_tooltip:0 "记录受挫并幂等释放本线名额。"
 ywc_jhg.1012.t:0 "分摊护航的那个人"
 ywc_jhg.1012.d:0 "海军部把有限护航草案送到王府：若现存盟约仍牢、两国关系友好，且盟友军力足以让这项安排站得住，本国便可把方案列入议程。它仍是一份待商议的本国提案。"
 ywc_jhg.1012.shared_escort:0 "提出盟约下分担护航方案"
 ywc_jhg.1012.shared_escort.cost_tooltip:0 "一次性登记费＝开启时年财政总收入÷52 的快照，实际从国库扣款；须未违约且未破产。 另需同盟与友好关系。"
