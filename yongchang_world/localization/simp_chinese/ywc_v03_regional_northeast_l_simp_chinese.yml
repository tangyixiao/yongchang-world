l_simp_chinese:
 ywc_je_v03_chi_a:0 "残廷的粮册"
 ywc_je_v03_chi_a_reason:0 "外贝加尔的小朝廷还捧着两本册子：一本记旗丁的月粮，一本记垦户的税粮。册子越旧，欠得越多；先把粮册理清，才谈得上别的。"
 ywc_je_v03_chi_b:0 "名号之外的国民"
 ywc_je_v03_chi_b_reason:0 "朝廷的名号之下，还住着布里亚特牧户、哥萨克垦户与海岛上的通信人。谁能算朝廷的属民、谁只算客籍，以及往来书信该用谁的名号，将决定留下的究竟是朝廷还是别的什么。"
 ywc_regional.1000.t:0 "八旗仍要吃粮"
 ywc_regional.1000.d:0 "户部的旧册还按月记着旗丁的米粮，可陆上的地租连俸库都填不满。管票的章京把两本册子摊在案上：旗饷一日不改，垦户的税就一日收不齐。"
 ywc_regional.1000.full_stipend:0 "旗饷照旧：清偿积欠，国库按月全支"
 ywc_regional.1000.full_stipend.cost_tooltip:0 "清偿积欠旗饷：开启时两周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1000.full_stipend.consequence_tooltip:0 "旗籍旧支持得以稳固，但旗饷照旧占用税源；两本册子的账仍要另议。"
 ywc_regional.1000.halve_stipend:0 "旗饷减半：余丁编入垦册"
 ywc_regional.1000.halve_stipend.cost_tooltip:0 "编丁授田的开局工本：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1000.halve_stipend.consequence_tooltip:0 "省下的月粮转作垦务本钱；让出旗饷是政治让步，旧旗营的怨言会记入复核。"
 ywc_regional.1000.defer_stipend:0 "暂缓裁议：先挂账再算"
 ywc_regional.1000.defer_stipend.cost_tooltip:0 "无直接支出。"
 ywc_regional.1000.defer_stipend.consequence_tooltip:0 "决定押后，积欠与争执继续滚大。"
 ywc_regional.1000.withdraw_at_1000:0 "此线不办：旗饷照旧例自筹"
 ywc_regional.1000.withdraw_at_1000.cost_tooltip:0 "无直接支出。"
 ywc_regional.1000.withdraw_at_1000.consequence_tooltip:0 "粮册线就此收回，名号线不再提起；旧例自负盈亏。"
 ywc_regional.1001.t:0 "外贝加尔的两份账"
 ywc_regional.1001.d:0 "旗册记人，垦册记地，两本账在外贝加尔对不上：同一条河谷，旗册说是牧场，垦册说是新田。理账的书办提议并册，旗营的长官只肯附册。"
 ywc_regional.1001.dual_ledger:0 "两册并录：旗册垦册同缴一处"
 ywc_regional.1001.dual_ledger.cost_tooltip:0 "并册誊录工本：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1001.dual_ledger.consequence_tooltip:0 "同册并录自此生效；一年后旧官署按执行结果呈复核。"
 ywc_regional.1001.banner_ledger_first:0 "旗册优先：垦户附册候记"
 ywc_regional.1001.banner_ledger_first.cost_tooltip:0 "无直接支出。"
 ywc_regional.1001.banner_ledger_first.consequence_tooltip:0 "旗营满意，垦户的名字只入附册；复核时旧官署会照实呈报这笔欠账。"
 ywc_regional.1001.defer_ledger:0 "两册先各管各，暂不合并"
 ywc_regional.1001.defer_ledger.cost_tooltip:0 "无直接支出。"
 ywc_regional.1001.defer_ledger.consequence_tooltip:0 "决定押后，同地异名的争议继续存在。"
 ywc_regional.1002.t:0 "旧官署的新税源"
 ywc_regional.1002.d:0 "一年期满，旧官署把复核的册子抬上来：并册的地方税粮能齐，附册的地方仍是两本账。税源找着了新着落，可这笔账怎么认，还要朝廷一句话。"
 ywc_regional.1002.ratify_registers:0 "照册施行：垦册入正税"
 ywc_regional.1002.ratify_registers.cost_tooltip:0 "无一次性支出；新税源自此入正项预算。"
 ywc_regional.1002.ratify_registers.consequence_tooltip:0 "旗饷让步与并册俱全则为整理达标，否则按有限结果结算；名号线随后提起。"
 ywc_regional.1002.earmark_subsidy:0 "另立专款：旗垦各半分担"
 ywc_regional.1002.earmark_subsidy.cost_tooltip:0 "专款开办银：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1002.earmark_subsidy.consequence_tooltip:0 "财政靠专款维持，账目按有限结果结算；分担之例写入往后的预算争议。"
 ywc_regional.1002.defer_review:0 "复核再挂一年：等下一轮呈报"
 ywc_regional.1002.defer_review.cost_tooltip:0 "无直接支出。"
 ywc_regional.1002.defer_review.consequence_tooltip:0 "结算押后一年，预算缺口照旧挂着。"
 ywc_regional.1003.t:0 "库页来信的称谓"
 ywc_regional.1003.d:0 "海岛与北边的来信都到了驿房：具衔写的是大清朝廷，落款却是外贝加尔官署。回信该用谁的名号，与北边各国的往来要不要分开记账，驿房等一个章程。"
 ywc_regional.1003.dynastic_style:0 "仍用大清名号：来信以朝廷名义具衔"
 ywc_regional.1003.dynastic_style.cost_tooltip:0 "无直接支出。"
 ywc_regional.1003.dynastic_style.consequence_tooltip:0 "对北边的行文照旧以朝廷名义往来；各国仍是各自的国家，贸易与书信不并。"
 ywc_regional.1003.dual_style:0 "两套名号：对外用朝廷，对内用官署"
 ywc_regional.1003.dual_style.cost_tooltip:0 "无直接支出。"
 ywc_regional.1003.dual_style.consequence_tooltip:0 "名号分开记账，来文按来处分拣；两国的边界与账目都各自照旧。"
 ywc_regional.1003.office_style:0 "改用官署名义：只署外贝加尔官廷"
 ywc_regional.1003.office_style.cost_tooltip:0 "换衔改印工本：开启时半月财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1003.office_style.consequence_tooltip:0 "对外名号改为官署，北边的朝廷名分让与别家；往来仍按两国各办。"
 ywc_regional.1003.defer_style:0 "来信暂不复：驿房先存档"
 ywc_regional.1003.defer_style.cost_tooltip:0 "无直接支出。"
 ywc_regional.1003.defer_style.consequence_tooltip:0 "称谓押后不决，往来的回文继续积压。"
 ywc_regional.1004.t:0 "祖制不认得的新居民"
 ywc_regional.1004.d:0 "布里亚特的牧户、流放的工匠和越冬的商人一年比一年多，祖制里没有他们的名目。理藩院的旧例对不上新户口，管册的书办问：这些人算朝廷的属民，还是只算客籍？"
 ywc_regional.1004.banner_register_only:0 "新居民不入祖册：另立客册"
 ywc_regional.1004.banner_register_only.cost_tooltip:0 "无直接支出。"
 ywc_regional.1004.banner_register_only.consequence_tooltip:0 "祖册照旧，客册另记；两本名籍的分立会写进最后一站的议事。"
 ywc_regional.1004.shared_obligation:0 "新居民与旗丁同担差徭"
 ywc_regional.1004.shared_obligation.cost_tooltip:0 "编入差徭的工本：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1004.shared_obligation.consequence_tooltip:0 "差徭同担、名籍同册；旧旗营与客户之间为谁多担一段，争议会留到最后。"
 ywc_regional.1004.custom_exam:0 "以祖制考取：通清语者入册"
 ywc_regional.1004.custom_exam.cost_tooltip:0 "无直接支出。"
 ywc_regional.1004.custom_exam.consequence_tooltip:0 "入册以通语为凭；未通语的住户名籍仍悬着，留待章程一站。"
 ywc_regional.1004.defer_residents:0 "新居民名籍暂缓：祖例再议"
 ywc_regional.1004.defer_residents.cost_tooltip:0 "无直接支出。"
 ywc_regional.1004.defer_residents.consequence_tooltip:0 "名籍押后，客民的不安与旧例的争议原样带入末站。"
 ywc_regional.1005.t:0 "留下的是朝廷还是国家"
 ywc_regional.1005.d:0 "粮册、名号、名籍的账都摊开了：留下的这份家业，按旗册算是一朝的残局，按垦册算是一方的国度。要把它写成什么，是这一代人要落笔的最后一行。"
 ywc_regional.1005.charter_common_standing:0 "章程写明：国民不分会旗客籍"
 ywc_regional.1005.charter_common_standing.cost_tooltip:0 "无一次性支出；共同名籍自此入章程。"
 ywc_regional.1005.charter_common_standing.consequence_tooltip:0 "制度巩固的结局；粮册与名籍的记录留给危机与主题线读取。"
 ywc_regional.1005.quota_compromise:0 "限额妥协：客籍名额入册有定"
 ywc_regional.1005.quota_compromise.cost_tooltip:0 "无一次性支出。"
 ywc_regional.1005.quota_compromise.consequence_tooltip:0 "限额妥协的结局；名额之争成为往后预算议事的常例。"
 ywc_regional.1005.old_covenant_kept:0 "保留旧约：名籍仍按祖制"
 ywc_regional.1005.old_covenant_kept.cost_tooltip:0 "无一次性支出。"
 ywc_regional.1005.old_covenant_kept.consequence_tooltip:0 "旧约延续的结局；客籍与旗籍的分立照单全收，留待下一代重新提起。"
 ywc_regional.1005.withdraw_at_1005:0 "此线收回：名籍各从其旧"
 ywc_regional.1005.withdraw_at_1005.cost_tooltip:0 "无直接支出。"
 ywc_regional.1005.withdraw_at_1005.consequence_tooltip:0 "撤回的结局；已付的工本不退，共同名籍的议题由后续线自行提起。"
