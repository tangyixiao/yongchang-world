l_simp_chinese:
 ywc_je_v03_chi_a:0 "残廷的粮册"
 ywc_je_v03_chi_a_reason:0 "外贝加尔的小朝廷还捧着两本册子：一本记旗丁的月粮，一本记垦户的税粮。册子越旧，欠得越多；先把粮册理清，才谈得上别的。"
 ywc_je_v03_chi_b:0 "名号之外的国民"
 ywc_je_v03_chi_b_reason:0 "朝廷的名号之下，还住着布里亚特牧户、哥萨克垦户与海岛上的通信人。谁能算朝廷的属民、谁只算客籍，以及往来书信该用谁的名号，将决定留下的究竟是朝廷还是别的什么。"
 ywc_regional.1000.t:0 "八旗仍要吃粮"
 ywc_regional.1000.d:0 "户部的旧册还按月记着旗丁的米粮，可陆上的地租连俸库都填不满。管票的章京把两本册子摊在案上：旗饷一日不改，垦户的税就一日收不齐。"
 ywc_regional.1000.full_stipend:0 "旗饷照旧：清偿积欠，国库按月全支"
 ywc_regional.1000.full_stipend.cost_tooltip:0 "清偿积欠旗饷：开启时两周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1000.full_stipend.consequence_tooltip:0 "旗籍旧支持得以稳固，但旗饷照旧占用税源；两本册子的账仍要另议。"
 ywc_regional.1000.halve_stipend:0 "旗饷减半：余丁编入垦册"
 ywc_regional.1000.halve_stipend.cost_tooltip:0 "编丁授田的开局工本：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1000.halve_stipend.consequence_tooltip:0 "省下的月粮转作垦务本钱；让出旗饷是政治让步，旧旗营的怨言会记入复核。"
 ywc_regional.1000.defer_stipend:0 "暂缓裁议：先挂账再算"
 ywc_regional.1000.defer_stipend.cost_tooltip:0 "无直接支出。"
 ywc_regional.1000.defer_stipend.consequence_tooltip:0 "决定押后，积欠与争执继续滚大。"
 ywc_regional.1000.withdraw_at_1000:0 "此线不办：旗饷照旧例自筹"
 ywc_regional.1000.withdraw_at_1000.cost_tooltip:0 "无直接支出。"
 ywc_regional.1000.withdraw_at_1000.consequence_tooltip:0 "粮册线就此收回，名号线不再提起；旧例自负盈亏。"
 ywc_regional.1001.t:0 "外贝加尔的两份账"
 ywc_regional.1001.d:0 "旗册记人，垦册记地，两本账在外贝加尔对不上：同一条河谷，旗册说是牧场，垦册说是新田。理账的书办提议并册，旗营的长官只肯附册。"
 ywc_regional.1001.dual_ledger:0 "两册并录：旗册垦册同缴一处"
 ywc_regional.1001.dual_ledger.cost_tooltip:0 "并册誊录工本：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1001.dual_ledger.consequence_tooltip:0 "同册并录自此生效；一年后旧官署按执行结果呈复核。"
 ywc_regional.1001.banner_ledger_first:0 "旗册优先：垦户附册候记"
 ywc_regional.1001.banner_ledger_first.cost_tooltip:0 "无直接支出。"
 ywc_regional.1001.banner_ledger_first.consequence_tooltip:0 "旗营满意，垦户的名字只入附册；复核时旧官署会照实呈报这笔欠账。"
 ywc_regional.1001.defer_ledger:0 "两册先各管各，暂不合并"
 ywc_regional.1001.defer_ledger.cost_tooltip:0 "无直接支出。"
 ywc_regional.1001.defer_ledger.consequence_tooltip:0 "决定押后，同地异名的争议继续存在。"
 ywc_regional.1002.t:0 "旧官署的新税源"
 ywc_regional.1002.d:0 "一年期满，旧官署把复核的册子抬上来：并册的地方税粮能齐，附册的地方仍是两本账。税源找着了新着落，可这笔账怎么认，还要朝廷一句话。"
 ywc_regional.1002.ratify_registers:0 "照册施行：垦册入正税"
 ywc_regional.1002.ratify_registers.cost_tooltip:0 "无一次性支出；新税源自此入正项预算。"
 ywc_regional.1002.ratify_registers.consequence_tooltip:0 "旗饷让步与并册俱全则为整理达标，否则按有限结果结算；名号线随后提起。"
 ywc_regional.1002.earmark_subsidy:0 "另立专款：旗垦各半分担"
 ywc_regional.1002.earmark_subsidy.cost_tooltip:0 "专款开办银：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1002.earmark_subsidy.consequence_tooltip:0 "财政靠专款维持，账目按有限结果结算；分担之例写入往后的预算争议。"
 ywc_regional.1002.defer_review:0 "复核再挂一年：等下一轮呈报"
 ywc_regional.1002.defer_review.cost_tooltip:0 "无直接支出。"
 ywc_regional.1002.defer_review.consequence_tooltip:0 "结算押后一年，预算缺口照旧挂着。"
 ywc_regional.1003.t:0 "库页来信的称谓"
 ywc_regional.1003.d:0 "海岛与北边的来信都到了驿房：具衔写的是大清朝廷，落款却是外贝加尔官署。回信该用谁的名号，与北边各国的往来要不要分开记账，驿房等一个章程。"
 ywc_regional.1003.dynastic_style:0 "仍用大清名号：来信以朝廷名义具衔"
 ywc_regional.1003.dynastic_style.cost_tooltip:0 "无直接支出。"
 ywc_regional.1003.dynastic_style.consequence_tooltip:0 "对北边的行文照旧以朝廷名义往来；各国仍是各自的国家，贸易与书信不并。"
 ywc_regional.1003.dual_style:0 "两套名号：对外用朝廷，对内用官署"
 ywc_regional.1003.dual_style.cost_tooltip:0 "无直接支出。"
 ywc_regional.1003.dual_style.consequence_tooltip:0 "名号分开记账，来文按来处分拣；两国的边界与账目都各自照旧。"
 ywc_regional.1003.office_style:0 "改用官署名义：只署外贝加尔官廷"
 ywc_regional.1003.office_style.cost_tooltip:0 "换衔改印工本：开启时半月财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1003.office_style.consequence_tooltip:0 "对外名号改为官署，北边的朝廷名分让与别家；往来仍按两国各办。"
 ywc_regional.1003.defer_style:0 "来信暂不复：驿房先存档"
 ywc_regional.1003.defer_style.cost_tooltip:0 "无直接支出。"
 ywc_regional.1003.defer_style.consequence_tooltip:0 "称谓押后不决，往来的回文继续积压。"
 ywc_regional.1004.t:0 "祖制不认得的新居民"
 ywc_regional.1004.d:0 "布里亚特的牧户、流放的工匠和越冬的商人一年比一年多，祖制里没有他们的名目。理藩院的旧例对不上新户口，管册的书办问：这些人算朝廷的属民，还是只算客籍？"
 ywc_regional.1004.banner_register_only:0 "新居民不入祖册：另立客册"
 ywc_regional.1004.banner_register_only.cost_tooltip:0 "无直接支出。"
 ywc_regional.1004.banner_register_only.consequence_tooltip:0 "祖册照旧，客册另记；两本名籍的分立会写进最后一站的议事。"
 ywc_regional.1004.shared_obligation:0 "新居民与旗丁同担差徭"
 ywc_regional.1004.shared_obligation.cost_tooltip:0 "编入差徭的工本：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1004.shared_obligation.consequence_tooltip:0 "差徭同担、名籍同册；旧旗营与客户之间为谁多担一段，争议会留到最后。"
 ywc_regional.1004.custom_exam:0 "以祖制考取：通清语者入册"
 ywc_regional.1004.custom_exam.cost_tooltip:0 "无直接支出。"
 ywc_regional.1004.custom_exam.consequence_tooltip:0 "入册以通语为凭；未通语的住户名籍仍悬着，留待章程一站。"
 ywc_regional.1004.defer_residents:0 "新居民名籍暂缓：祖例再议"
 ywc_regional.1004.defer_residents.cost_tooltip:0 "无直接支出。"
 ywc_regional.1004.defer_residents.consequence_tooltip:0 "名籍押后，客民的不安与旧例的争议原样带入末站。"
 ywc_regional.1005.t:0 "留下的是朝廷还是国家"
 ywc_regional.1005.d:0 "粮册、名号、名籍的账都摊开了：留下的这份家业，按旗册算是一朝的残局，按垦册算是一方的国度。要把它写成什么，是这一代人要落笔的最后一行。"
 ywc_regional.1005.charter_common_standing:0 "章程写明：国民不分会旗客籍"
 ywc_regional.1005.charter_common_standing.cost_tooltip:0 "无一次性支出；共同名籍自此入章程。"
 ywc_regional.1005.charter_common_standing.consequence_tooltip:0 "制度巩固的结局；粮册与名籍的记录留给危机与主题线读取。"
 ywc_regional.1005.quota_compromise:0 "限额妥协：客籍名额入册有定"
 ywc_regional.1005.quota_compromise.cost_tooltip:0 "无一次性支出。"
 ywc_regional.1005.quota_compromise.consequence_tooltip:0 "限额妥协的结局；名额之争成为往后预算议事的常例。"
 ywc_regional.1005.old_covenant_kept:0 "保留旧约：名籍仍按祖制"
 ywc_regional.1005.old_covenant_kept.cost_tooltip:0 "无一次性支出。"
 ywc_regional.1005.old_covenant_kept.consequence_tooltip:0 "旧约延续的结局；客籍与旗籍的分立照单全收，留待下一代重新提起。"
 ywc_regional.1005.withdraw_at_1005:0 "此线收回：名籍各从其旧"
 ywc_regional.1005.withdraw_at_1005.cost_tooltip:0 "无直接支出。"
 ywc_regional.1005.withdraw_at_1005.consequence_tooltip:0 "撤回的结局；已付的工本不退，共同名籍的议题由后续线自行提起。"
 ywc_je_v03_khq_a:0 "旗地与犁沟"
 ywc_je_v03_khq_a_reason:0 "科尔沁的旗册认牧道，新垦的田契认犁沟，两本册子在同一个旗署里对不上账。盟旗的兵额、租谷的税源、牧道的存废，都要先从这两册并一册说起。"
 ywc_je_v03_khq_b:0 "盟约中的席位"
 ywc_je_v03_khq_b_reason:0 "旗地与犁沟的账既已结算，科尔沁要面对外面的盟约与里面的新一代：互保之约有没有作实，租地人的下一代记在哪一册，续签盟书时谁的名字可以落笔。"
 ywc_regional.1100.t:0 "牧场边的新田契"
 ywc_regional.1100.d:0 "同一条牧场边界上，新垦的田块头一次有人拿来了书面田契：签契的是迁来的耕户，放牧的仍是旧日的旗丁。旗署的旧册只认牧道，新契只认犁沟，谁也说不清这块地该记在哪一册。"
 ywc_regional.1100.dual_register:0 "两册并录：犁沟与牧道同册登记"
 ywc_regional.1100.dual_register.cost_tooltip:0 "造册勘丈费：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1100.dual_register.consequence_tooltip:0 "犁沟户与旗丁牧道同册并录，争议由旗署受理；下一站议盟旗出兵。"
 ywc_regional.1100.pasture_first:0 "旧牧册为准：新田暂作寄耕"
 ywc_regional.1100.pasture_first.cost_tooltip:0 "无直接支出。"
 ywc_regional.1100.pasture_first.consequence_tooltip:0 "省下造册费，旗丁满意，但垦户的田契无处受理；不满将累积到税额一节。"
 ywc_regional.1100.wait_at_1100:0 "两册先各管各，暂不合并"
 ywc_regional.1100.wait_at_1100.cost_tooltip:0 "无直接支出。"
 ywc_regional.1100.wait_at_1100.consequence_tooltip:0 "决定押后，田契与牧册相争的日子照旧过下去。"
 ywc_regional.1100.withdraw_at_1100:0 "此线不办，仍循旧牧例"
 ywc_regional.1100.withdraw_at_1100.cost_tooltip:0 "无直接支出。"
 ywc_regional.1100.withdraw_at_1100.consequence_tooltip:0 "本线结束，旧牧例继续；盟约席位一线不再开启。"
 ywc_regional.1101.t:0 "盟旗愿出多少骑兵"
 ywc_regional.1101.d:0 "造册未干，会盟的信已经到了：邻境有事，盟旗要科尔沁按册出兵。旧例是各旗自定人数，如今册上既有旗丁也有垦户，出多少、谁出、拿什么出，头一次要写成定数。"
 ywc_regional.1101.fixed_contingent:0 "定额盟兵：按册出固定人数，饷银公出"
 ywc_regional.1101.fixed_contingent.cost_tooltip:0 "集结饷银：开启时两周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1101.fixed_contingent.consequence_tooltip:0 "有限军役写成定数，十二个月后按执行情况复核本线；执行无失则垦牧两册之约作准。"
 ywc_regional.1101.cash_commutation:0 "缺额折银：人数不足以牲畜折抵"
 ywc_regional.1101.cash_commutation.cost_tooltip:0 "无直接支出；折抵的牲畜当年不入旗库。"
 ywc_regional.1101.cash_commutation.consequence_tooltip:0 "盟约收下了，兵额却打了折扣；复核将按有限结果结算本线。"
 ywc_regional.1101.withdraw_at_1101:0 "此线收回，出兵仍循各旗旧例"
 ywc_regional.1101.withdraw_at_1101.cost_tooltip:0 "无直接支出。"
 ywc_regional.1101.withdraw_at_1101.consequence_tooltip:0 "本线结束，兵额仍由各旗自定；盟约席位一线不再开启。"
 ywc_regional.1102.t:0 "固定税额的提案"
 ywc_regional.1102.d:0 "垦户的田契既已入册，税吏便带来了提案：把新田的租谷折成固定税额，岁岁可征。旗署算得出进项，也算得出代价——租谷一行写进册子，牧道就得让出春秋两季的草场；保住牧道，财政上的许诺就得缩回去。"
 ywc_regional.1102.lease_fixed:0 "租谷定税：新田岁纳固定税额"
 ywc_regional.1102.lease_fixed.cost_tooltip:0 "无直接支出；税源自下一年起可按年预计。"
 ywc_regional.1102.lease_fixed.consequence_tooltip:0 "租谷一行入册，旗丁与垦户争草场的案子会多起来；记录留给黑水边疆与田土各线读取。"
 ywc_regional.1102.buy_back_corridors:0 "保牧道：出钱赎回已许的租约"
 ywc_regional.1102.buy_back_corridors.cost_tooltip:0 "赎约金：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1102.buy_back_corridors.consequence_tooltip:0 "春秋草场保全，财政许诺缩到可以兑现；垦户的租约另寻议处。"
 ywc_regional.1102.defer_at_1102:0 "提案留中：今年先照旧例收租"
 ywc_regional.1102.defer_at_1102.cost_tooltip:0 "无直接支出。"
 ywc_regional.1102.defer_at_1102.consequence_tooltip:0 "定额与牧道的取舍押后一年，争议原样带到下一站。"
 ywc_regional.1103.t:0 "邻国分别送来的礼物"
 ywc_regional.1103.d:0 "开春的礼单摆了一案：南边与垦务有来往的官署送了茶砖，草原上会盟的邻旗送了鞍马。两家都提到同一句话——沿边牧道与田界，愿立互保之约。只是礼是分别送来的，条款也各写各的，约期定多久，得科尔沁自己拿主意。"
 ywc_regional.1103.two_year_pledge:0 "两年互保：备礼回聘，约期两年"
 ywc_regional.1103.two_year_pledge.cost_tooltip:0 "回聘礼金：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1103.two_year_pledge.consequence_tooltip:0 "互保之约写明两年为期；是否作实由对方按边地实况独立确认或回绝，不由本旗自定。"
 ywc_regional.1103.short_pledge:0 "一年试约：只应一年，来年再议"
 ywc_regional.1103.short_pledge.cost_tooltip:0 "无直接支出。"
 ywc_regional.1103.short_pledge.consequence_tooltip:0 "试约一年，互保的实惠与义务都减半；对方仍须独立作实。"
 ywc_regional.1103.decline_gifts:0 "礼照收，约不立"
 ywc_regional.1103.decline_gifts.cost_tooltip:0 "无直接支出。"
 ywc_regional.1103.decline_gifts.consequence_tooltip:0 "两份礼都入旗库，互保之议就此作罢；沿边田界牧道仍由本旗自理。"
 ywc_regional.1104.t:0 "租地人的下一代"
 ywc_regional.1104.d:0 "头一批立契垦户的子弟长大了：他们生在这片田上，话是双语，名却还挂在父辈的租契底下。旗署的旧册认的是立契的那一代，新一代要自己的行辈，牧道上的人也要个说法。"
 ywc_regional.1104.second_generation_roll:0 "新代入册：另立行辈，各认其役"
 ywc_regional.1104.second_generation_roll.cost_tooltip:0 "造新册费：开启时半月财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1104.second_generation_roll.consequence_tooltip:0 "新一代自此有自己的册行，役与税各认各的；旧牧册与新田册并立为两卷。"
 ywc_regional.1104.old_register:0 "旧册不改：新一代附于父契之下"
 ywc_regional.1104.old_register.cost_tooltip:0 "无直接支出。"
 ywc_regional.1104.old_register.consequence_tooltip:0 "省下造册费，册子还是那一册；新一代的不满会写进最后一站的记录。"
 ywc_regional.1104.defer_at_1104:0 "行辈之议留中"
 ywc_regional.1104.defer_at_1104.cost_tooltip:0 "无直接支出。"
 ywc_regional.1104.defer_at_1104.consequence_tooltip:0 "行辈之议押后，租契底下的名字继续攒着。"
 ywc_regional.1105.t:0 "谁有权再签盟书"
 ywc_regional.1105.d:0 "旧约的期限到了：垦牧两册并行的年头里，当年签字的王公有的故去，有的不再管事。新一代的册行、租地的长老、牧道上的旗丁，都问着同一句话——续写盟书的时候，谁的名字可以落在纸上。"
 ywc_regional.1105.broad_renewal:0 "广续盟书：王公与册户同列签约"
 ywc_regional.1105.broad_renewal.cost_tooltip:0 "会盟仪费：开启时半月财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1105.broad_renewal.consequence_tooltip:0 "制度自此巩固：两册之人同具盟书，续约之权写成年例；垦牧并册与互保确认的记录一并入盟书正文。"
 ywc_regional.1105.quota_compromise:0 "限额妥协：册户入盟以定额为限"
 ywc_regional.1105.quota_compromise.cost_tooltip:0 "无直接支出。"
 ywc_regional.1105.quota_compromise.consequence_tooltip:0 "盟书续了，席位有限额；超额的册户候补，争议留待下一代再提。"
 ywc_regional.1105.retain_old_compact:0 "旧约仍用：续约之权归各旗王公"
 ywc_regional.1105.retain_old_compact.cost_tooltip:0 "无直接支出。"
 ywc_regional.1105.retain_old_compact.consequence_tooltip:0 "旧约原样保留，盟书仍由王公续签；册行与租地的诉求记录在案，不改旧制。"
 ywc_regional.1105.withdraw_at_1105:0 "此线收回，续约留待来年"
 ywc_regional.1105.withdraw_at_1105.cost_tooltip:0 "无直接支出。"
 ywc_regional.1105.withdraw_at_1105.consequence_tooltip:0 "已付的各项费用不退；续约之问由后续线自行提起。"
 ywc_je_v03_hul_a:0 "冬营共议"
 ywc_je_v03_hul_a_reason:0 "呼伦的冬天从来不是私事：栅栏、边市与过冬的骑队，每一件都要各部围着同一堆火分摊。谁出草料、谁让道、谁受保护，账算得清，春天才守得住。"
 ywc_je_v03_hul_b:0 "互市不能换成驻留"
 ywc_je_v03_hul_b_reason:0 "冬营的许诺签得再多，也换不回草原的规矩：外军可借道过冬，不可长驻；边市可扩大，不可拿主权抵账。呼伦联盟要把这句话写进盟约，还要让新入盟的城镇也认得它。"
 ywc_regional.1200.t:0 "冬营里多了一道栅栏"
 ywc_regional.1200.d:0 "去年冬天，一场夜风雪冲开了阿巴该部的牛栏，牲口混进了邻部的冬营地。各部长老聚到呼伦湖边：栅栏修在哪、谁来看、钱从哪出——再没有一本共同的册子，明年还得照旧吵一遍。"
 ywc_regional.1200.shared_watch_fence:0 "共修一道栅栏：轮值看护，费用共摊"
 ywc_regional.1200.shared_watch_fence.cost_tooltip:0 "栅栏工料与轮值口粮：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1200.shared_watch_fence.consequence_tooltip:0 "各部按份出丁轮流看守，走失牲口由当值一部先赔；下一站议边市开放的天数。"
 ywc_regional.1200.small_self_fence:0 "自修小栅：只护本部冬营"
 ywc_regional.1200.small_self_fence.cost_tooltip:0 "无直接国库支出；工料由本部自筹。"
 ywc_regional.1200.small_self_fence.consequence_tooltip:0 "省钱且不担轮值之责，但邻部牲口仍会踩进营地；越界的积怨记入冬营册。"
 ywc_regional.1200.wait_at_1200:0 "先各修各的，账后再算"
 ywc_regional.1200.wait_at_1200.cost_tooltip:0 "无直接支出。"
 ywc_regional.1200.wait_at_1200.consequence_tooltip:0 "决定押后；走失与越界的争执照旧。"
 ywc_regional.1200.withdraw_at_1200:0 "此议作罢，凭旧例自理"
 ywc_regional.1200.withdraw_at_1200.cost_tooltip:0 "无直接支出。"
 ywc_regional.1200.withdraw_at_1200.consequence_tooltip:0 "本线结束，各部循旧例自理；护边与互市诸议不再合账。"
 ywc_regional.1201.t:0 "边市开放的天数"
 ywc_regional.1201.d:0 "边市上的货堆比去年厚了一倍，可开放的天数还是旧例那几天：迟来的商队把货原样驮回去，宿营的柴火钱倒花了不少。开放几天、仓储谁出，长老们要一个说得出口的数。"
 ywc_regional.1201.long_market_storage:0 "开足整季：建可负担的仓储"
 ywc_regional.1201.long_market_storage.cost_tooltip:0 "仓储棚圈与市吏工食：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1201.long_market_storage.consequence_tooltip:0 "迟到商队有处卸货，过冬部众换得盐茶铁器；仓储账入预算，执事复核按此结算。"
 ywc_regional.1201.short_market_no_storage:0 "照旧几天：仓储各部自便"
 ywc_regional.1201.short_market_no_storage.cost_tooltip:0 "无直接支出。"
 ywc_regional.1201.short_market_no_storage.consequence_tooltip:0 "账面最省；迟来的货照旧原路驮回，怨言记入冬营册。"
 ywc_regional.1201.keep_old_days:0 "只添记档，天数不动"
 ywc_regional.1201.keep_old_days.cost_tooltip:0 "无直接支出。"
 ywc_regional.1201.keep_old_days.consequence_tooltip:0 "旧例照行，天数的争议留到执事复核时再算。"
 ywc_regional.1202.t:0 "护边者要求过冬"
 ywc_regional.1202.d:0 "一支外来的护边骑队在大雪前赶到盟边，领队递上人情与刀：只求借冬营地过一冬，开春就走。老人们认得这种“就走”——留住的就是驻留。给不给、给多久、给什么权，得一次说清。"
 ywc_regional.1202.winter_with_terms:0 "受其过冬：明写权限与期限"
 ywc_regional.1202.winter_with_terms.cost_tooltip:0 "冬营地盘与柴料折价：开启时半月财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1202.winter_with_terms.consequence_tooltip:0 "骑队限于指定营地、两年为期、不得置地，期满即撤；执事一年内复核此约的执行。"
 ywc_regional.1202.winter_no_arms:0 "只许空手过冬：不带军械不设哨"
 ywc_regional.1202.winter_no_arms.cost_tooltip:0 "无直接支出。"
 ywc_regional.1202.winter_no_arms.consequence_tooltip:0 "人情给了，兵刃没给；骑队若嫌苛刻自会早走，盟内诸部安心。"
 ywc_regional.1202.refuse_winter:0 "不借冬营：自募小队守边"
 ywc_regional.1202.refuse_winter.cost_tooltip:0 "无直接国库支出；守边丁口由各部自摊。"
 ywc_regional.1202.refuse_winter.consequence_tooltip:0 "骑队另寻去路，边界本冬自担较少规模的守备；执事复核时按自守之实结算。"
 ywc_regional.1203.t:0 "商路的第二个出口"
 ywc_regional.1203.d:0 "边市南边的商路历来只出一道口，过口就进了邻邦的税卡，今年税卡又加了价。商人们问：能不能在东边再开一道出口，绕开别人的秤？可那一道口，也要借人家的道。"
 ywc_regional.1203.partner_outlet_split:0 "借道东出：与守道者分利"
 ywc_regional.1203.partner_outlet_split.cost_tooltip:0 "开道与分利首期：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1203.partner_outlet_split.consequence_tooltip:0 "第二道口开了，但借道之利年年与人分享；此约写进对外记录，邻线可读。"
 ywc_regional.1203.own_outlet_small:0 "自开小口：量少但不欠人情"
 ywc_regional.1203.own_outlet_small.cost_tooltip:0 "无直接国库支出；小口由商队自修自护。"
 ywc_regional.1203.own_outlet_small.consequence_tooltip:0 "出口握在自己手里，货量有限；南边税卡的加价只能咽下大半。"
 ywc_regional.1203.keep_single_outlet:0 "仍走南口：议价照旧"
 ywc_regional.1203.keep_single_outlet.cost_tooltip:0 "无直接支出。"
 ywc_regional.1203.keep_single_outlet.consequence_tooltip:0 "单口的依赖原样保留；税卡再涨时，联盟只能照付或压市。"
 ywc_regional.1204.t:0 "新城镇怎样参加议事"
 ywc_regional.1204.d:0 "边市与东口养出了两座新镇，镇上的人纳税、守栅、赶集样样不缺，唯独议事的老帐篷进不去——席位跟着老氏族走。新镇递了话：要么给席位，要么给说法。"
 ywc_regional.1204.town_seats_paid:0 "予席：新镇按份纳费入议"
 ywc_regional.1204.town_seats_paid.cost_tooltip:0 "议事帐扩建与书记工食：开启时半月财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1204.town_seats_paid.consequence_tooltip:0 "新镇席位按纳费份额定，预算自此多一笔常项；老氏族的不满留在册上。"
 ywc_regional.1204.town_observers:0 "予观察席：可听政不可署押"
 ywc_regional.1204.town_observers.cost_tooltip:0 "无直接支出。"
 ywc_regional.1204.town_observers.consequence_tooltip:0 "新镇能听能言，不能落押；市面上的章程仍由老氏族定。"
 ywc_regional.1204.old_clans_first:0 "旧制照行：镇务归镇，盟务归部"
 ywc_regional.1204.old_clans_first.cost_tooltip:0 "无直接支出。"
 ywc_regional.1204.old_clans_first.consequence_tooltip:0 "新镇自设镇议，盟议照旧；两本章程的出入留给最后一站。"
 ywc_regional.1205.t:0 "没有常驻外军的盟约"
 ywc_regional.1205.d:0 "冬营的约、边市的日子、东口的账、新镇的席，样样摊在毡案上。长老们要落笔的是最后一行：这份盟约里永远不写“外军长驻”——互市换不来驻留，谁都不能拿这一条讨价还价。"
 ywc_regional.1205.charter_no_garrison:0 "章程定笔：互市不换驻留"
 ywc_regional.1205.charter_no_garrison.cost_tooltip:0 "无一次性支出；盟约自此以册传代。"
 ywc_regional.1205.charter_no_garrison.consequence_tooltip:0 "制度巩固：过冬借营必须明写权限与期限、不得置地；MGL/NQG、危机 C02/C03 与主题 T10/T12 各线读取此记录。"
 ywc_regional.1205.quota_compromise:0 "限额妥协：借营名额逐年核减"
 ywc_regional.1205.quota_compromise.cost_tooltip:0 "无一次性支出。"
 ywc_regional.1205.quota_compromise.consequence_tooltip:0 "外军借营设逐年递减的限额：既守规矩又留了口子，写入对外记录。"
 ywc_regional.1205.withdraw_compact:0 "收回此议：盟约暂缺末行"
 ywc_regional.1205.withdraw_compact.cost_tooltip:0 "无直接支出。"
 ywc_regional.1205.withdraw_compact.consequence_tooltip:0 "本线撤回：末行空着，诸部照旧例自理；此记录供邻线自行提起。"
 ywc_regional.1205.keep_old_compact:0 "保留旧约：只添册不换契"
 ywc_regional.1205.keep_old_compact.cost_tooltip:0 "无一次性支出。"
 ywc_regional.1205.keep_old_compact.consequence_tooltip:0 "旧契照用，新册只记今冬诸议；代际争议留给下一代重开。"
 ywc_je_v03_sol_a:0 "沿江轮役簿"
 ywc_je_v03_sol_a_reason:0 "索伦各屯守渡、巡河、传驿的班次都记在一本轮役簿上，可班次越排越空：有人折费代役，有人托亲顶名，有人干脆不上簿。江上的差事一日无人守，皮货与军粮就一日到不了岸。"
 ywc_je_v03_sol_b:0 "村社之间的官署"
 ywc_je_v03_sol_b_reason:0 "官署的印记落进了村社之间：渡口添了官册与领薪的书吏，村约仍是旧例，城里的年轻人开始候补。轮役簿的账怎么结，决定这本官文书往后由谁来写。"
 ywc_regional.1300.t:0 "这一季该谁守渡"
 ywc_regional.1300.d:0 "开春的轮役簿摊在案上，渡口的班次还缺三屯。老把头说人手是各屯的命，收银代役是坏规矩；管渡的书办说皮张折役记账清楚，各屯也愿意。这一季该谁守渡，总得有个写进簿子的章程。"
 ywc_regional.1300.keep_rota:0 "轮役照旧：各屯自出人守渡"
 ywc_regional.1300.keep_rota.cost_tooltip:0 "无直接支出；轮役照旧占用各屯人力。"
 ywc_regional.1300.keep_rota.consequence_tooltip:0 "渡口仍由各屯轮守，簿册不添银钱账；人力之耗记入复核。"
 ywc_regional.1300.fee_conversion:0 "折费代役：出银雇人，皮张折抵"
 ywc_regional.1300.fee_conversion.cost_tooltip:0 "雇募守渡工食：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1300.fee_conversion.consequence_tooltip:0 "守渡有了雇工，各屯少出一人；折费之例自此入簿，争议留到复核。"
 ywc_regional.1300.defer_rota:0 "簿册先挂起：今年仍由各屯临时摊派"
 ywc_regional.1300.defer_rota.cost_tooltip:0 "无直接支出。"
 ywc_regional.1300.defer_rota.consequence_tooltip:0 "决定押后，缺班与顶名的争执继续。"
 ywc_regional.1300.withdraw_at_1300:0 "此簿不用：渡务各屯各管"
 ywc_regional.1300.withdraw_at_1300.cost_tooltip:0 "无直接支出。"
 ywc_regional.1300.withdraw_at_1300.consequence_tooltip:0 "轮役簿线就此收回，官署线不再提起；渡务纠纷仍由各村约自理。"
 ywc_regional.1301.t:0 "皮货先付了军粮"
 ywc_regional.1301.d:0 "秋汛一过，江道又浅了。军粮要皮货抵缴，河工疏浚也要皮张换料；皮行愿意包修渡口，条件是独收三年渡钱。粮册与河册摆在一张案上，先付哪头，簿子上得落笔。"
 ywc_regional.1301.grain_first_self_works:0 "军粮优先：皮货抵粮，河工只修本段"
 ywc_regional.1301.grain_first_self_works.cost_tooltip:0 "本段河工物料：开启时半月财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1301.grain_first_self_works.consequence_tooltip:0 "皮货先抵军粮，官渡本段当年可通；一年后按执行结果复核。"
 ywc_regional.1301.works_by_fur_contract:0 "河工承包：皮行包修渡口，独收三年渡钱"
 ywc_regional.1301.works_by_fur_contract.cost_tooltip:0 "无直接支出；三年渡钱归皮行。"
 ywc_regional.1301.works_by_fur_contract.consequence_tooltip:0 "渡口同样得修，但渡钱让与皮行写进对外记录；复核按有限结果呈报。"
 ywc_regional.1301.joint_nqg_defense:0 "江防协修：请库页河防分段同浚"
 ywc_regional.1301.joint_nqg_defense.cost_tooltip:0 "协修分段工款：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1301.joint_nqg_defense.consequence_tooltip:0 "与库页河防分段同浚江道，巡船班次两册互抄；分段界碑记入复核。"
 ywc_regional.1301.defer_grain_works:0 "皮粮各记各账，河工押后"
 ywc_regional.1301.defer_grain_works.cost_tooltip:0 "无直接支出。"
 ywc_regional.1301.defer_grain_works.consequence_tooltip:0 "决定押后，江道淤浅与粮饷缺口照旧。"
 ywc_regional.1302.t:0 "巡河开始有了薪饷"
 ywc_regional.1302.d:0 "一年期满，复核的册子抬上来：领薪的巡河班守得住江面，折费雇来的渡工也上了簿；仍轮役的屯子少了壮丁，河工的物料账也各有长短。薪饷要不要入常例预算，是这次复核要定的话。"
 ywc_regional.1302.ratify_wage_roll:0 "照册给饷：巡河薪饷入常例预算"
 ywc_regional.1302.ratify_wage_roll.cost_tooltip:0 "首季常例薪饷：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1302.ratify_wage_roll.consequence_tooltip:0 "轮役改薪饷入常例；河工自营或协修俱全则为整理达标，承包让利则按有限结果结算；官署线随后提起。"
 ywc_regional.1302.restore_rota_labor:0 "轮役回补：薪饷止于河工，渡口还轮"
 ywc_regional.1302.restore_rota_labor.cost_tooltip:0 "无直接支出；各屯人力重归渡口。"
 ywc_regional.1302.restore_rota_labor.consequence_tooltip:0 "有限结果结算：薪饷只留河工一份，轮役班次回簿，折费之例停用。"
 ywc_regional.1302.neighbor_joint_review:0 "会邻共查：请邻邦书吏同核簿册"
 ywc_regional.1302.neighbor_joint_review.cost_tooltip:0 "无直接支出。"
 ywc_regional.1302.neighbor_joint_review.consequence_tooltip:0 "有限结果结算；邻邦书吏的核册记录成为对外凭据，留待跨界河务引用。"
 ywc_regional.1302.defer_review_1302:0 "复核再挂一年：等下一轮呈报"
 ywc_regional.1302.defer_review_1302.cost_tooltip:0 "无直接支出。"
 ywc_regional.1302.defer_review_1302.consequence_tooltip:0 "结算押后一年，薪饷与轮役并行的双轨照旧。"
 ywc_regional.1303.t:0 "码头官不懂村约"
 ywc_regional.1303.d:0 "码头官按官册罚了一个屯子的皮张，屯长老把村约抬到案上：渡口归这屯守了三代，罚金没有名目。官册写得明白，村约也是真凭据，两头都不肯让。这一案怎么断，往后两岸都照着办。"
 ywc_regional.1303.covenant_joint_bench:0 "村约入审：渡册添会审一页"
 ywc_regional.1303.covenant_joint_bench.cost_tooltip:0 "会审常年纸笔工食：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1303.covenant_joint_bench.consequence_tooltip:0 "官册与村约的案件自此同堂会审；码头官的独断到此为止。"
 ywc_regional.1303.office_rule_appeal:0 "官册为准：村约只作申诉凭据"
 ywc_regional.1303.office_rule_appeal.cost_tooltip:0 "无直接支出。"
 ywc_regional.1303.office_rule_appeal.consequence_tooltip:0 "裁判权归官册，村约退为申诉凭据；若薪饷常例已立，此例与饷册并轨。"
 ywc_regional.1303.two_covenants_parallel:0 "两本规矩并行：渡册与村约各管各段"
 ywc_regional.1303.two_covenants_parallel.cost_tooltip:0 "无直接支出。"
 ywc_regional.1303.two_covenants_parallel.consequence_tooltip:0 "同案不同判将继续，并写进黑水江畔（Crisis C02）的争议记录。"
 ywc_regional.1303.defer_case_1303:0 "此案押后：留待秋后再审"
 ywc_regional.1303.defer_case_1303.cost_tooltip:0 "无直接支出。"
 ywc_regional.1303.defer_case_1303.consequence_tooltip:0 "裁判押后，码头与两岸的争执原样带入下一站。"
 ywc_regional.1304.t:0 "年轻人选择留在城里"
 ywc_regional.1304.d:0 "领过薪饷的年轻人不回屯了：城里有力工、有书吏的缺、有按月发的饷。屯里轮役的班次却要摊到人，名籍上留着名字，人常在码头。让不让他们考渡口的书吏，簿子得添新页。"
 ywc_regional.1304.town_exam_office:0 "城里考取：渡口书吏向年轻人开考"
 ywc_regional.1304.town_exam_office.cost_tooltip:0 "考场设试工本：开启时半月财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1304.town_exam_office.consequence_tooltip:0 "年轻人可凭考绩任渡口书吏，本地任官自此有例；此记录留给民智一线（T02）读取。"
 ywc_regional.1304.absent_rota_kept:0 "名录照旧：城里做工者仍记轮役名"
 ywc_regional.1304.absent_rota_kept.cost_tooltip:0 "无直接支出；各屯轮役班次仍要摊到人。"
 ywc_regional.1304.absent_rota_kept.consequence_tooltip:0 "名籍不动，人却常在城里；代班与折费的争执留给末站。"
 ywc_regional.1304.hired_substitutes:0 "缺额外雇：以薪饷雇人补班"
 ywc_regional.1304.hired_substitutes.cost_tooltip:0 "外雇补班工食：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1304.hired_substitutes.consequence_tooltip:0 "缺额以饷银补齐，轮役簿的班次靠雇工续上。"
 ywc_regional.1304.defer_succession:0 "名录再议：新旧名并录候定"
 ywc_regional.1304.defer_succession.cost_tooltip:0 "无直接支出。"
 ywc_regional.1304.defer_succession.consequence_tooltip:0 "承继押后，屯与城的两边不满原样带入末站。"
 ywc_regional.1305.t:0 "轮役簿最后的一页"
 ywc_regional.1305.d:0 "轮役簿写到了最后一页：薪饷的账、村约的案、城里候补的名字都在上面。这一页写完，簿子要么入官册，要么还各屯，要么封存。没有新式工业，也没有大众政党，要紧的只是这本旧簿往后由谁续写。"
 ywc_regional.1305.charter_rota_office:0 "章程写明：轮役入官册，缺由公费补"
 ywc_regional.1305.charter_rota_office.cost_tooltip:0 "无一次性支出；轮役薪饷自此入常例预算。"
 ywc_regional.1305.charter_rota_office.consequence_tooltip:0 "制度巩固的结局：薪饷、会审与书吏之例一并入章程；记录留给黑水江危机（C02）与民智、驿传两线（T02/T11）读取。"
 ywc_regional.1305.rota_quota_compromise:0 "限额妥协：轮役簿留空页，各屯轮值有定"
 ywc_regional.1305.rota_quota_compromise.cost_tooltip:0 "无一次性支出。"
 ywc_regional.1305.rota_quota_compromise.consequence_tooltip:0 "限额妥协的结局：各屯轮值名额写定，余者折费，争议成为往后预算议事的常例。"
 ywc_regional.1305.old_covenant_kept:0 "保留旧约：官册附于村约之后"
 ywc_regional.1305.old_covenant_kept.cost_tooltip:0 "无一次性支出。"
 ywc_regional.1305.old_covenant_kept.consequence_tooltip:0 "保留旧约的结局：官册只作村约附录，渡务仍按旧例，留待下一代重新提起。"
 ywc_regional.1305.withdraw_at_1305:0 "此簿封存：渡务各屯各管"
 ywc_regional.1305.withdraw_at_1305.cost_tooltip:0 "无直接支出。"
 ywc_regional.1305.withdraw_at_1305.consequence_tooltip:0 "撤回的结局：已付的工食不退，共同班次的议题由后续线自行提起。"
 ywc_je_v03_amr_a:0 "江岸共同渔场"
 ywc_je_v03_amr_a_reason:0 "江湾的渔猎地、靠船的木台与下江的木税，如今记在三本册子上：盟册记村社的旧例，买主的契纸记码头与木排，新来的渔户哪一本都不在。黑水盟要先对齐这三本账，才谈得上河口的长久之计。"
 ywc_je_v03_amr_b:0 "河口有了长住者"
 ywc_je_v03_amr_b_reason:0 "江岸的账既已结算，河口要面对外面的政策与里面的新一代：南来的章程认不认盟约，不再随季节离开的家庭记在哪一册，续写江岸之约时谁的名字可以落笔。这些账都要按江岸的旧例一件件落定。"
 ywc_regional.1400.t:0 "先到江湾的网"
 ywc_regional.1400.d:0 "江湾一年两汛，汛前各家下网的次序向来按盟册的旧例：哪一村先立栅、哪一家先下网，都写在旧约的附页里。可这两年在同一片水里下网的不再只有盟内的村社——新迁来的垦户与南边木排上的伙夫也下了网，旧册上却寻不到他们的名字。管册的长老把盟册摊开：这片渔猎地，按谁的名分算？"
 ywc_regional.1400.joint_grounds_register:0 "两册并录：盟册与村社、新户的网册同缴一处"
 ywc_regional.1400.joint_grounds_register.cost_tooltip:0 "勘汛造册工本：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1400.joint_grounds_register.consequence_tooltip:0 "村社旧例与新户的网册并录一处，汛期次序自此有册可依；下一站议靠船的木台。"
 ywc_regional.1400.league_roll_first:0 "旧盟册为准：新户附册候记"
 ywc_regional.1400.league_roll_first.cost_tooltip:0 "无直接支出。"
 ywc_regional.1400.league_roll_first.consequence_tooltip:0 "省下造册工本，村社满意，但新户的网无所凭据；不满将累积到河口一节。"
 ywc_regional.1400.wait_at_1400:0 "两册先各管各，汛期次序照旧例"
 ywc_regional.1400.wait_at_1400.cost_tooltip:0 "无直接支出。"
 ywc_regional.1400.wait_at_1400.consequence_tooltip:0 "决定押后，重复下网的争执继续存在。"
 ywc_regional.1400.withdraw_at_1400:0 "此线不办，渔猎地仍循旧例"
 ywc_regional.1400.withdraw_at_1400.cost_tooltip:0 "无直接支出。"
 ywc_regional.1400.withdraw_at_1400.consequence_tooltip:0 "本线结束，旧例继续；河口长住一线不再开启。"
 ywc_regional.1401.t:0 "谁来修靠船的木台"
 ywc_regional.1401.d:0 "江湾的木台是汛季靠船卸货的地方，如今桩木朽了大半。盟会公议要修，账上却没有现钱；下江的木材买主愿意出全份工料，条件是把码头三成泊位折成他们的专位；村社的长老只肯各修各段，说盟里的台子盟里修。台子等不起，这笔账要现在算。"
 ywc_regional.1401.league_public_works:0 "盟库公修：全段木台照旧例翻修"
 ywc_regional.1401.league_public_works.cost_tooltip:0 "翻修工料款：开启时两周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1401.league_public_works.consequence_tooltip:0 "码头泊位照旧例各归各，村社买主都无话可说；十二个月后按执行结果复核本线。"
 ywc_regional.1401.timber_contract:0 "买主承修：工料折三年专位，村社泊段让出"
 ywc_regional.1401.timber_contract.cost_tooltip:0 "无直接支出；码头三成泊位折给买主专用三年。"
 ywc_regional.1401.timber_contract.consequence_tooltip:0 "木台照样翻修，村社的泊段却被让出；让权记录留到复核一并结算。"
 ywc_regional.1401.narrow_self_repair:0 "限段自修：只修盟用泊位，村社埠头照旧"
 ywc_regional.1401.narrow_self_repair.cost_tooltip:0 "半段工料款：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1401.narrow_self_repair.consequence_tooltip:0 "村社埠头与买主泊位照旧朽着，汛季的怨言会留到复核；本线按有限结果结算。"
 ywc_regional.1402.t:0 "木材买主的新条件"
 ywc_regional.1402.d:0 "一年期满，木台与渔册的账摆上了盟会的案子，木材买主也带来了新条件：与其岁岁议租，不如立一纸出口特许，把下江的木税包销三年，盟里一次收清，村社的渔道与薪林却要让出一段。共管港务能保住裁断——买主、村社与盟会同署理事——却要盟里按年出文书钱。"
 ywc_regional.1402.joint_port_authority:0 "共管港务：买主、村社与盟会同署裁断"
 ywc_regional.1402.joint_port_authority.cost_tooltip:0 "无一次性支出；文书费用自此按年入常例预算。"
 ywc_regional.1402.joint_port_authority.consequence_tooltip:0 "裁断权仍归盟会，村社使用权保住；渔册与木台俱齐则为整理达标，否则按有限结果结算；河口线随后提起。"
 ywc_regional.1402.franchise_export:0 "出口特许：木税包销三年，渔道薪林让出一段"
 ywc_regional.1402.franchise_export.cost_tooltip:0 "无直接支出；包销款按契约季度入账。"
 ywc_regional.1402.franchise_export.consequence_tooltip:0 "财政靠包销款周转，村社使用权被压缩；本线按有限结果结算，河口线随后提起。"
 ywc_regional.1402.defer_review:0 "复核再挂一年：等下一轮呈报"
 ywc_regional.1402.defer_review.cost_tooltip:0 "无直接支出。"
 ywc_regional.1402.defer_review.consequence_tooltip:0 "结算押后一年，木台与渔册的账照旧挂着。"
 ywc_regional.1403.t:0 "河口的两种规矩"
 ywc_regional.1403.d:0 "南边的政策文书到了河口：官署愿把河口的通商登记收进他们的东北册子，木税按他们的则例抽收，口岸的断案也请照他们的章程。盟册与南册对同一张契各写各的批语。河口从此有两种规矩——认哪一种为主、两种怎么并用，要盟会现在定。"
 ywc_regional.1403.league_compact_primary:0 "以盟约为主：南来政策备册通报，不入境设署"
 ywc_regional.1403.league_compact_primary.cost_tooltip:0 "无直接支出。"
 ywc_regional.1403.league_compact_primary.consequence_tooltip:0 "通商登记仍在盟册，南册留档备查；对外的名分照两国各办。"
 ywc_regional.1403.joint_policy_registry:0 "与南边合册：通商登记两册并录，抽税各归各"
 ywc_regional.1403.joint_policy_registry.cost_tooltip:0 "合册誊录工本：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1403.joint_policy_registry.consequence_tooltip:0 "河口的契券两册并录，抽税各归各；争执由两会合断。"
 ywc_regional.1403.southern_policy_first:0 "让南方章程先行：港务文书照南册办理，盟约只管村社"
 ywc_regional.1403.southern_policy_first.cost_tooltip:0 "无直接支出。"
 ywc_regional.1403.southern_policy_first.consequence_tooltip:0 "省下誊录工本，村社事务不出盟册，但口岸断案从此引南方则例；让权记录留到收束一站。"
 ywc_regional.1403.defer_at_1403:0 "两册并行不决，文书暂由驿房分存"
 ywc_regional.1403.defer_at_1403.cost_tooltip:0 "无直接支出。"
 ywc_regional.1403.defer_at_1403.consequence_tooltip:0 "决定押后，同一张契两种批语的日子照旧过下去。"
 ywc_regional.1404.t:0 "不再随季节离开的家庭"
 ywc_regional.1404.d:0 "先前冬来春去的渔户，这几年干脆留在了河口：屋基扎下了，孩子生在江岸，网具也换成了过冬的粗纲。盟册只认随季节来去的用例，长住之家在册上没有名目。村社问他们的渔道该让几分，买主问他们的工该雇谁，长老们只问一句：这些人算盟里的人，还是算客？"
 ywc_regional.1404.resident_roll_opened:0 "长住之家入册：渔道、薪林、泊位照册均分"
 ywc_regional.1404.resident_roll_opened.cost_tooltip:0 "造册与划界工本：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1404.resident_roll_opened.consequence_tooltip:0 "长住之家自盟册有名目，使用权照册均分；村社与旧户为谁让多让少的争议会留到最后。"
 ywc_regional.1404.winter_guest_custom:0 "冬客照旧：盟册不改，长住之家按客例纳用"
 ywc_regional.1404.winter_guest_custom.cost_tooltip:0 "无直接支出。"
 ywc_regional.1404.winter_guest_custom.consequence_tooltip:0 "省下造册工本，长住之家纳用却不入册；不满将写进最后一站的记录。"
 ywc_regional.1404.custom_enrollment:0 "以约入册：承约认役者入盟册，余者候记"
 ywc_regional.1404.custom_enrollment.cost_tooltip:0 "无直接支出。"
 ywc_regional.1404.custom_enrollment.consequence_tooltip:0 "入册以承约为凭；未承约的住户名目仍悬着，留待收束一站。"
 ywc_regional.1404.defer_at_1404:0 "长住之家名目暂缓：旧例再议"
 ywc_regional.1404.defer_at_1404.cost_tooltip:0 "无直接支出。"
 ywc_regional.1404.defer_at_1404.consequence_tooltip:0 "名目押后，江岸的不安与旧例的争议原样带入末站。"
 ywc_regional.1405.t:0 "江岸之约由谁继承"
 ywc_regional.1405.d:0 "当年按手立约的长老，有的故去，有的下不了江滩。盟册、木契、南册与长住之家的名目都摊在案上：续写江岸之约的时候，河口长住者、盟内村社与下江买主，谁的名字可以落在纸上？这一代盟人要落的，是最后一笔。"
 ywc_regional.1405.compact_renewed_broadly:0 "广续盟约：村社、长住者与买主同列约册，继序写成年例"
 ywc_regional.1405.compact_renewed_broadly.cost_tooltip:0 "续约仪费：开启时半月财政收入（存钱不足则此案暂缓）。"
 ywc_regional.1405.compact_renewed_broadly.consequence_tooltip:0 "制度自此巩固：三册之人同具盟约，继序写成年例；渔场、木台与河口名目的记录一并入约正文。"
 ywc_regional.1405.quota_compromise:0 "限额妥协：河口席位以定额为限，超额候补"
 ywc_regional.1405.quota_compromise.cost_tooltip:0 "无直接支出。"
 ywc_regional.1405.quota_compromise.consequence_tooltip:0 "盟约续了，席位有限额；超额的河口人家候补，争议留待下一代再提。"
 ywc_regional.1405.old_compact_retained:0 "旧约仍用：盟册不改，长住者附册候记"
 ywc_regional.1405.old_compact_retained.cost_tooltip:0 "无直接支出。"
 ywc_regional.1405.old_compact_retained.consequence_tooltip:0 "旧约原样保留，续约之权归盟内长老；河口与买主的诉求记录在案，不改旧制。"
 ywc_regional.1405.withdraw_at_1405:0 "此线收回，各册各管"
 ywc_regional.1405.withdraw_at_1405.cost_tooltip:0 "无直接支出。"
 ywc_regional.1405.withdraw_at_1405.consequence_tooltip:0 "已付的各项费用不退；江岸之约的续问由后续线自行提起。"
