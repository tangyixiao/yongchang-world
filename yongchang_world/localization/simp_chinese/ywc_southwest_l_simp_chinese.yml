l_simp_chinese:
 ywc_ljg.1.t:0 "引盐之议"
 ywc_ljg.1.d:0 "大顺欲以盐引抽分改写茶马旧例，引权出自木氏数百年。奉命则引权旁落，力陈则忤逆宗主。"
 ywc_ljg.1.a:0 "奉行政令，交引权与大顺税吏"
 ywc_ljg.1.b:0 "力陈旧例，请以贡茶代税"
 ywc_ljg.2.t:0 "藏商入城"
 ywc_ljg.2.d:0 "德格僧商携金直入丽江，绕开大顺税卡。开城则商路大兴而税卡旁落，设卡则一体课征而商旅却步。"
 ywc_ljg.2.a:0 "开城互市，藏商照单全收"
 ywc_ljg.2.b:0 "设卡抽税，一体课征"
 ywc_ljg.3.t:0 "木氏继嗣"
 ywc_ljg.3.d:0 "老土司病笃，嗣子年幼，族中欲立弟。大顺流官议请诰命——受诰则名分稳固，自立则族内相安。"
 ywc_ljg.3.a:0 "请诰于大顺，立幼子以世职"
 ywc_ljg.3.b:0 "族中自立，不受诰命"
 ywc_sip.1.t:0 "茶山之约"
 ywc_sip.1.d:0 "汉商求承包六大茶山，岁纳租银。议事庭争执：得银速而茶山渐非我有，自营则费而自主。"
 ywc_sip.1.a:0 "承包给汉商，岁纳租银"
 ywc_sip.1.b:0 "归官茶山，自设茶局"
 ywc_sip.2.t:0 "缅使西来"
 ywc_sip.2.d:0 "缅甸使者携礼而至，请车里照旧入贡缅京。两属之礼再难兼得——报大顺则拒缅，虚与委蛇则两贡并输。"
 ywc_sip.2.a:0 "报大顺边署，拒缅使"
 ywc_sip.2.b:0 "虚与委蛇，两贡并存"
 ywc_sip.3.t:0 "十二版纳分担"
 ywc_sip.3.d:0 "朝贡与防务之费浩繁，议事庭请十二版纳均摊，召片领欲以王命独断。"
 ywc_sip.3.a:0 "依例十二版纳均摊"
 ywc_sip.3.b:0 "召片领独任，以王命压之"
 ywc_der.1.t:0 "印经院的债"
 ywc_der.1.d:0 "印经院议扩刻大藏经，银钱不济。借商银则经成而债立，缓刻则省钱而寺院失望。"
 ywc_der.1.a:0 "借商银续刻，分年偿还"
 ywc_der.1.b:0 "缓刻三年，先清旧账"
 ywc_der.2.t:0 "护商之约"
 ywc_der.2.d:0 "商道劫掠频发，商队请德格护送。出兵则费而收名，请大顺边军则省而权分。"
 ywc_der.2.a:0 "出兵护商，收护路之名"
 ywc_der.2.b:0 "请大顺边军护路"
 ywc_der.3.t:0 "僧俗之争"
 ywc_der.3.d:0 "印经院管理之权，土司与寺院相持不下。俗官掌印则政令归一，依旧并立则旧 Ruhe。"
 ywc_der.3.a:0 "俗官掌印，寺院领经资"
 ywc_der.3.b:0 "依旧并立，各守其旧"
 ywc_gyl.1.t:0 "屯田与牧场"
 ywc_gyl.1.d:0 "联盟屯田渐侵牧场，牧部赴会陈情。限屯则边备虚，扩屯则内部怨。"
 ywc_gyl.1.a:0 "限屯还牧，牧部得直"
 ywc_gyl.1.b:0 "扩屯固边，牧部自迁"
 ywc_gyl.2.t:0 "练军之请"
 ywc_gyl.2.d:0 "大顺请嘉绒遣兵受训，为西南屏藩。受训则得新法而听调，辞谢则全旧俗而失援。"
 ywc_gyl.2.a:0 "遣三百兵受训，请给饷械"
 ywc_gyl.2.b:0 "辞以旧例，边事自任"
 ywc_gyl.3.t:0 "盟主之争"
 ywc_gyl.3.d:0 "老盟主病故，七部争立。推强部则号令归一而诸部侧目，轮值则均势而事权不一。"
 ywc_gyl.3.a:0 "推强部为盟主，号令归一"
 ywc_gyl.3.b:0 "轮值盟主，诸部均势"
 ywc_shd.1.t:0 "三十七土司"
 ywc_shd.1.d:0 "联席会议议贡额与驿路：均摊则众服而迟缓，强部代缴则速而怨聚。"
 ywc_shd.1.a:0 "三十七土司均摊"
 ywc_shd.1.b:0 "强部代缴，贡期无误"
 ywc_shd.2.t:0 "设官之请"
 ywc_shd.2.d:0 "大顺请于缅宁设流官，理商路诉讼。受官则名分归顺而土司权削，拒官则旧制完而边务自理。"
 ywc_shd.2.a:0 "受官，请以土司会同听讼"
 ywc_shd.2.b:0 "拒官，边务土司自理"
 ywc_shd.3.t:0 "茶叶与罂粟"
 ywc_shd.3.d:0 "山地获利两途：禁罂粟、广植茶则久利而近利顿减；放任罂粟则白银立至而烟毒蔓延。"
 ywc_shd.3.a:0 "禁罂粟、广植茶，请大顺商路相助"
 ywc_shd.3.b:0 "放任罂粟，坐收其银"
 ywc_ara.1.t:0 "驻扎官的账单"
 ywc_ara.1.d:0 "英国驻扎官摊派防务费，限日出结。缴纳则库竭而相安，拖欠则生嫌隙。"
 ywc_ara.1.a:0 "如数缴纳，不生枝节"
 ywc_ara.1.b:0 "拖欠分期，以灾年为辞"
 ywc_ara.2.t:0 "缅甸流亡者"
 ywc_ara.2.d:0 "缅甸王族数人渡界而至，若开僧俗收留之。庇护则得人心而触怒缅局，引渡则安邻而寒故旧。"
 ywc_ara.2.a:0 "庇护之，请英国体谅"
 ywc_ara.2.b:0 "引渡以安缅局"
 ywc_ara.3.t:0 "稻米专约"
 ywc_ara.3.d:0 "英国求稻米出口专约，价定多年。签则收入稳而农受压价，限则价自主而英情不悦。"
 ywc_ara.3.a:0 "签专约，岁供定额"
 ywc_ara.3.b:0 "限额外销，余米自售"
