l_simp_chinese:
 ywc_je_v03_t09_capital_terms:0 "资本到达之前的条件"
 ywc_je_v03_t09_capital_terms_reason:0 "朝鲜要为产业与道路筹资，东明的放款人可以接洽。但在资本到达之前，账目、担保与偿付次序必须先谈定；谈不成，本国仍可自筹小规模方案。"
 ywc_society.1400.t:0 "可投资的账目"
 ywc_society.1400.d:0 "东明的放款人要求先看账。朝鲜可以提交已经结算的旧账作为信用，也可以只交本年度账目；无论提交哪一种，账目都必须经得起核对。"
 ywc_society.1400.present_settled:0 "提交已结算的旧账"
 ywc_society.1400.present_settled.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1400.present_settled.consequence_tooltip:0 "已结算的军账与学账记录呈交东明，等待放款人审查。"
 ywc_society.1400.present_current:0 "提交本年度账目"
 ywc_society.1400.present_current.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1400.present_current.consequence_tooltip:0 "本年度账目呈交东明，没有旧账为凭，审查将更严格。"
 ywc_society.1400.self_fund:0 "不借贷，自筹小规模方案"
 ywc_society.1400.self_fund.cost_tooltip:0 "无额外国库支出；规模以现有经费为限。"
 ywc_society.1400.self_fund.consequence_tooltip:0 "不向东明借贷，改以现有经费自筹小规模方案，直接进入项目定夺。"
 ywc_society.1400.wait:0 "暂缓，重新核对"
 ywc_society.1400.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1400.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1401.t:0 "放款人的审查"
 ywc_society.1401.d:0 "东明的账房核对朝鲜送来的簿册。自家预算在册、对方账目又有旧账为凭，可以不取担保直接放款；否则须以税权作保，也可以拒绝。"
 ywc_society.1401.approve_terms:0 "认账放款，须以税权作保"
 ywc_society.1401.approve_terms.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1401.approve_terms.consequence_tooltip:0 "审查通过但要求以税权作保，条款送交朝鲜定夺。"
 ywc_society.1401.approve_plain:0 "认账放款，不取担保"
 ywc_society.1401.approve_plain.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1401.approve_plain.consequence_tooltip:0 "自家预算在册且对方旧账可信，按无担保条款放款。"
 ywc_society.1401.refuse_review:0 "审查不通过，婉拒放款"
 ywc_society.1401.refuse_review.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1401.refuse_review.consequence_tooltip:0 "账目不足以支持放款，东明婉拒；朝鲜按账自行结算。"
 ywc_society.1401.wait:0 "暂缓答复"
 ywc_society.1401.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1401.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1402.t:0 "税权作为担保"
 ywc_society.1402.d:0 "东明的条款送到了：以税权作保，或只以港口关税为限，或按无担保条款接受。押上多少，将来不能偿付时失去的就有多少；不押则回到自筹。"
 ywc_society.1402.pledge_tax:0 "押上税权作保"
 ywc_society.1402.pledge_tax.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1402.pledge_tax.consequence_tooltip:0 "税权押作担保，等待第一期拨款；违约时按押失去税权。"
 ywc_society.1402.pledge_limited:0 "只押港口关税"
 ywc_society.1402.pledge_limited.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1402.pledge_limited.consequence_tooltip:0 "只以港口关税为限作保，担保成色较低，拨款或被减半。"
 ywc_society.1402.accept_unsecured:0 "按无担保条款接受"
 ywc_society.1402.accept_unsecured.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1402.accept_unsecured.consequence_tooltip:0 "按无担保条款接受，凭旧账信用等待拨款。"
 ywc_society.1402.refuse_terms:0 "不接受条款，改自筹"
 ywc_society.1402.refuse_terms.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1402.refuse_terms.consequence_tooltip:0 "拒绝外部担保条款，保留税权，改以现有经费自筹小规模方案。"
 ywc_society.1402.wait:0 "暂缓，重新核对"
 ywc_society.1402.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1402.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1403.t:0 "第一期拨款"
 ywc_society.1403.d:0 "东明的账房按担保成色拨付第一期：押了税权可足额，未押或只押关税则减半。库中无钱或另有顾虑，也可以暂不拨款。"
 ywc_society.1403.disburse_full:0 "足额拨付第一期"
 ywc_society.1403.disburse_full.cost_tooltip:0 "东明国库支付 800；朝鲜国库入账 800。"
 ywc_society.1403.disburse_full.consequence_tooltip:0 "第一期资本到达朝鲜，账目两边各记一份，等待偿付之期。"
 ywc_society.1403.disburse_partial:0 "减半拨付第一期"
 ywc_society.1403.disburse_partial.cost_tooltip:0 "东明国库支付 400；朝鲜国库入账 400。"
 ywc_society.1403.disburse_partial.consequence_tooltip:0 "减半拨款到达朝鲜，项目规模须相应缩减。"
 ywc_society.1403.withhold_disburse:0 "暂不拨款，维持条款"
 ywc_society.1403.withhold_disburse.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1403.withhold_disburse.consequence_tooltip:0 "担保成色不足，东明暂不拨款，朝鲜按账自行结算。"
 ywc_society.1403.wait:0 "暂缓答复"
 ywc_society.1403.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1403.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1404.t:0 "账期与歉收相遇"
 ywc_society.1404.d:0 "还款之期恰逢歉收，市面紧缩。可以求东明展期，可以咬牙按期付本息，也可以据实记入欠账、准备缩减项目。"
 ywc_society.1404.request_extension:0 "请求东明展期"
 ywc_society.1404.request_extension.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1404.request_extension.consequence_tooltip:0 "展期之请连同欠账记录送交东明，等待债权人预算定夺。"
 ywc_society.1404.pay_anyway:0 "咬牙按期支付本息"
 ywc_society.1404.pay_anyway.cost_tooltip:0 "朝鲜国库支付 500；东明国库入账 500。"
 ywc_society.1404.pay_anyway.consequence_tooltip:0 "本息按期付清，账目两边各记一份，进入项目定夺。"
 ywc_society.1404.record_arrears:0 "据实记入欠账"
 ywc_society.1404.record_arrears.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1404.record_arrears.consequence_tooltip:0 "欠账据实入册，项目准备缩减，不再向东明转款。"
 ywc_society.1404.wait:0 "暂缓，重新核对"
 ywc_society.1404.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1404.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1405.t:0 "债权人也有预算"
 ywc_society.1405.d:0 "东明自己的预算也有盈缺。库中有余可以自担展期成本；无余则记账收取展期息费；再不济按原条款索偿。"
 ywc_society.1405.extend_absorb:0 "自担成本准予展期"
 ywc_society.1405.extend_absorb.cost_tooltip:0 "东明国库支付 200；不向朝鲜转款。"
 ywc_society.1405.extend_absorb.consequence_tooltip:0 "展期获准，成本由债权人预算自担，账目两边各记一份。"
 ywc_society.1405.extend_fee:0 "展期但记账收取息费"
 ywc_society.1405.extend_fee.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1405.extend_fee.consequence_tooltip:0 "展期获准但息费记账在册，随账目一并结算。"
 ywc_society.1405.refuse_extension:0 "拒绝展期，按原条款索偿"
 ywc_society.1405.refuse_extension.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1405.refuse_extension.consequence_tooltip:0 "展期被拒，原条款仍然有效，朝鲜须自行定夺项目。"
 ywc_society.1405.wait:0 "暂缓答复"
 ywc_society.1405.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1405.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1406.t:0 "展期或缩减项目"
 ywc_society.1406.d:0 "朝鲜按自己的账目定夺：东明准了展期即可续办；无论对方如何答复，都可以把项目缩到现有经费能承担的规模，或者就此终止合作。两边账册各自独立记下这次决定。"
 ywc_society.1406.extend_project:0 "依展期条款续办项目"
 ywc_society.1406.extend_project.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1406.extend_project.consequence_tooltip:0 "依获准的展期条款续办项目，等待结案。"
 ywc_society.1406.shrink_project:0 "项目缩减至自筹规模"
 ywc_society.1406.shrink_project.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1406.shrink_project.consequence_tooltip:0 "项目缩到现有经费能承担的规模，欠账记录保留在册。"
 ywc_society.1406.terminate_terms:0 "终止合作，按账结算"
 ywc_society.1406.terminate_terms.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1406.terminate_terms.consequence_tooltip:0 "终止与东明的借贷合作，已付费用不退。"
 ywc_society.1406.wait:0 "暂缓，重新核对"
 ywc_society.1406.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1406.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1407.t:0 "偿付之外的制度"
 ywc_society.1407.d:0 "账目终须结清。按双方记录结案：足额履行、有限收束或记为拒贷；东明已不可联系时，朝鲜按已有账目自行收束。偿付之外的制度——担保的边界与对账的规矩——由这次记录留存。"
 ywc_society.1407.close_accepted:0 "记为足额履行结案"
 ywc_society.1407.close_accepted.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1407.close_accepted.consequence_tooltip:0 "足额履行入册结案，东明对朝鲜关系增加 5。"
 ywc_society.1407.close_limited:0 "记为有限收束结案"
 ywc_society.1407.close_limited.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1407.close_limited.consequence_tooltip:0 "有限收束入册结案：自筹方案或未竟的贷款按实结算。"
 ywc_society.1407.close_refused:0 "记为拒贷结案"
 ywc_society.1407.close_refused.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1407.close_refused.consequence_tooltip:0 "拒贷入册结案，东明对朝鲜关系减少 5。"
 ywc_society.1407.close_alone:0 "东明已不可联系，按账自行收束"
 ywc_society.1407.close_alone.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1407.close_alone.consequence_tooltip:0 "对方已不可联系，朝鲜按已有账目自行收束；已支付的费用不退。"
 ywc_society.1407.wait:0 "暂缓结案"
 ywc_society.1407.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1407.wait.consequence_tooltip:0 "记录本次决定。"
