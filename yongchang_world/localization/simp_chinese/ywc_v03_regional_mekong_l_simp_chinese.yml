l_simp_chinese:
 ywc_je_v03_mhg_land_waterway:0 "沿河地权与共同水道"
 ywc_je_v03_mhg_land_waterway_reason:0 "河湾地契上写着的姓名与实际耕作者并不总是一致，河道疏浚的钱也没有固定的承担者。华人国要站稳，先把地权与水道的账目理清。"
 ywc_je_v03_mhg_common_resident:0 "会馆之外的共同国民"
 ywc_je_v03_mhg_common_resident_reason:0 "会馆的册子记不下所有沿河居民。新来者、本地村社与下一代各有诉求，华人国必须决定谁能共享裁判、学校与席位。"
 ywc_regional.7200.t:0 "河湾地契上的两种姓名"
 ywc_regional.7200.d:0 "同一块河湾田，会馆的旧册写着出资垦殖的乡人，官府的新册写着实际纳粮的耕户。两本册子都对了一半，也各错了一半。"
 ywc_regional.7200.mixed_registry:0 "两册并行：垦殖与纳粮并录"
 ywc_regional.7200.mixed_registry.cost_tooltip:0 "清查登记费：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.7200.mixed_registry.consequence_tooltip:0 "垦殖出资人与纳粮耕户同册并录，争议由官府受理；下一站议水道。"
 ywc_regional.7200.guild_ledger:0 "旧册优先：会馆出资簿为准"
 ywc_regional.7200.guild_ledger.cost_tooltip:0 "无直接国库支出。"
 ywc_regional.7200.guild_ledger.consequence_tooltip:0 "省钱且会馆满意，但耕户失去申诉凭据；不满将累积到村社一节。"
 ywc_regional.7200.wait_at_7200:0 "两册先各管各，暂不合并"
 ywc_regional.7200.wait_at_7200.cost_tooltip:0 "无直接支出。"
 ywc_regional.7200.wait_at_7200.consequence_tooltip:0 "决定押后，重复地契问题继续存在。"
 ywc_regional.7200.withdraw_at_7200:0 "此线不办，交由旧例"
 ywc_regional.7200.withdraw_at_7200.cost_tooltip:0 "无直接支出。"
 ywc_regional.7200.withdraw_at_7200.consequence_tooltip:0 "本线结束，旧例继续；后续会馆线仍会提起同一笔旧账。"
 ywc_regional.7201.t:0 "水道不能只由商行疏浚"
 ywc_regional.7201.d:0 "雨季一过，河口沙洲又抬高了。商行愿意包办疏浚，条件是独收三年过闸钱；官府自办则要真金白银。地权册子刚定，水道的账又来了。"
 ywc_regional.7201.public_dredge:0 "官府自办：公费疏浚全段"
 ywc_regional.7201.public_dredge.cost_tooltip:0 "疏浚工程款：开启时两周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.7201.public_dredge.consequence_tooltip:0 "航路畅通无附带权利；十二个月后按执行结果结算本线。"
 ywc_regional.7201.guild_contract:0 "商行承包：换钱但让出闸税"
 ywc_regional.7201.guild_contract.cost_tooltip:0 "无直接支出；三年过闸税归商行。"
 ywc_regional.7201.guild_contract.consequence_tooltip:0 "河道同样疏通，但商行独收闸税将写进对外记录；本线按有限结果结算。"
 ywc_regional.7201.narrow_self:0 "限段自修：只浚官船水道"
 ywc_regional.7201.narrow_self.cost_tooltip:0 "半段工程款：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.7201.narrow_self.consequence_tooltip:0 "商船水道依旧淤浅，贸易怨言会留到下一条线；本线按有限结果结算。"
 ywc_regional.7202.t:0 "新来者请求会馆保护"
 ywc_regional.7202.d:0 "又一批顺水下来的同乡到了码头，没有地、没有铺、只有会馆门口的一封引荐信。收不收册，收册之后算谁的人，会馆第一次答不上来。"
 ywc_regional.7202.guild_register:0 "会馆收册：出资认保"
 ywc_regional.7202.guild_register.cost_tooltip:0 "认保钱粮：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.7202.guild_register.consequence_tooltip:0 "新来者入会馆册，会馆动员力增强，但本地村社视其为外来人。"
 ywc_regional.7202.public_register:0 "官署登记：入公册才算居民"
 ywc_regional.7202.public_register.cost_tooltip:0 "官署书办的开销走日常行政，无额外一次性支出。"
 ywc_regional.7202.public_register.consequence_tooltip:0 "公册生效后，村社与商行都开始引用同一份居民记录。"
 ywc_regional.7202.refuse_register:0 "暂不收册：请他们另寻生计"
 ywc_regional.7202.refuse_register.cost_tooltip:0 "无直接支出。"
 ywc_regional.7202.refuse_register.consequence_tooltip:0 "省下钱粮，但码头不安与流言都在累积。"
 ywc_regional.7203.t:0 "本地村社要求共同裁判"
 ywc_regional.7203.d:0 "村社的长老抬来了一份按满手印的单子：凡涉两姓的案子，不能只由会馆的理事说了算。他们要的不是一个胜诉，而是一个能讲理的地方。"
 ywc_regional.7203.joint_bench:0 "设共同法庭：两造各出一席"
 ywc_regional.7203.joint_bench.cost_tooltip:0 "法庭常设费用：开启时一周财政收入（存钱不足则此案暂缓）。"
 ywc_regional.7203.joint_bench.consequence_tooltip:0 "两姓案件自此有共同讲理之所；会馆的独家裁断到此为止。"
 ywc_regional.7203.guild_with_appeal:0 "会馆照旧裁断，村社可申诉"
 ywc_regional.7203.guild_with_appeal.cost_tooltip:0 "无直接支出。"
 ywc_regional.7203.guild_with_appeal.consequence_tooltip:0 "裁断权未动，申诉多走一道；村社接受与否要看后面几站。"
 ywc_regional.7203.separate_ways:0 "各管各案：两套规矩并行"
 ywc_regional.7203.separate_ways.cost_tooltip:0 "无直接支出。"
 ywc_regional.7203.separate_ways.consequence_tooltip:0 "同案不同判将继续发生，并写进对外商约的争议记录。"
 ywc_regional.7204.t:0 "双语学校的第一批官员"
 ywc_regional.7204.d:0 "学堂的头一批学生结业了：同乡子弟与本地子弟同堂念书，如今一起候缺。名册摆上案头，任官的规矩却还是旧的。"
 ywc_regional.7204.open_exams_both:0 "开两语并试：通其一即可任用"
 ywc_regional.7204.open_exams_both.cost_tooltip:0 "两语考试场务：开启时半月财政收入（存钱不足则此案暂缓）。"
 ywc_regional.7204.open_exams_both.consequence_tooltip:0 "官缺自此向两语学生同开；文牍译员与讼费此后按新规走。"
 ywc_regional.7204.guild_school_first:0 "会馆学堂优先，本地子弟候补"
 ywc_regional.7204.guild_school_first.cost_tooltip:0 "无直接支出。"
 ywc_regional.7204.guild_school_first.consequence_tooltip:0 "任官顺序照旧；候补的不满将写进最后一站的议事记录。"
 ywc_regional.7204.defer_office:0 "暂不定规，先留名册"
 ywc_regional.7204.defer_office.cost_tooltip:0 "无直接支出。"
 ywc_regional.7204.defer_office.consequence_tooltip:0 "名册留中不发，任官争议原样带到最后一站。"
 ywc_regional.7205.t:0 "华人国如何代表所有沿河居民"
 ywc_regional.7205.d:0 "地册、法庭、学堂的账都已摊开：华人国撑的不再只是会馆的伞。要不要把这份撑起来的责任写进章程，是这一代人要答的话。"
 ywc_regional.7205.charter_common_resident:0 "章程写明：居民不分会馆内外"
 ywc_regional.7205.charter_common_resident.cost_tooltip:0 "无一次性支出；公共责任自此入预算。"
 ywc_regional.7205.charter_common_resident.consequence_tooltip:0 "共同居民章程生效五年；后续危机与侨线读取此记录。"
 ywc_regional.7205.guild_ledged_accountability:0 "会馆当家，账册公开受查"
 ywc_regional.7205.guild_ledged_accountability.cost_tooltip:0 "无一次性支出。"
 ywc_regional.7205.guild_ledged_accountability.consequence_tooltip:0 "权责仍系于会馆，但查账成了常例；对外身份仍按会馆名义登记。"
 ywc_regional.7205.old_order_continues:0 "旧制延续：章程暂不添笔"
 ywc_regional.7205.old_order_continues.cost_tooltip:0 "无一次性支出。"
 ywc_regional.7205.old_order_continues.consequence_tooltip:0 "既有的裁定与不满照单全收，留待下一代重新提起。"
 ywc_regional.7205.withdraw_at_7205:0 "此线收回，各册各管"
 ywc_regional.7205.withdraw_at_7205.cost_tooltip:0 "无直接支出。"
 ywc_regional.7205.withdraw_at_7205.consequence_tooltip:0 "已付的各项费用不退；共同资格议题由后续线自行提起。"
