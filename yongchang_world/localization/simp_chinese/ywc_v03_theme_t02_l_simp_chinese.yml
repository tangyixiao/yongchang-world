 ywc_society.1051.d:0 "靖海的官署、营伍与学塾都报了人手不足。发出邀请与译写聘书要真金支出；若改用本地人手，交换就此作罢。已支付的邀请不会在复议时再收一次。"
 ywc_society.1051.invite:0 "支付 500，发出邀请与译写聘书"
 ywc_society.1051.invite.cost_tooltip:0 "靖海国库支付 500。"
 ywc_society.1051.invite.consequence_tooltip:0 "邀请与译写聘书立档；资历审查随后进行。"
