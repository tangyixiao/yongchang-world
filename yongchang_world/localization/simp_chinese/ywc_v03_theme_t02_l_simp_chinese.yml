l_simp_chinese:
 ywc_je_v03_t02_talent_crossing:0 "人才来到边界"
 ywc_je_v03_t02_talent_crossing_reason:0 "大韩学署已有愿意出行的人才，靖海须先核对本地官署、学塾与营伍的真实空缺，再决定是否发出邀请与译写聘书。"
 ywc_society.1050.t:0 "愿意出走的教师"
 ywc_society.1050.d:0 "大韩学署里有一位授医术、账法与译学的教习愿意前往靖海。放行要立行程与译名记录；挽留则把这次出走的念头留档在派系争执里。"
 ywc_society.1050.release:0 "放行教习，立行程与译名记录"
 ywc_society.1050.release.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1050.release.consequence_tooltip:0 "大韩留下放行记录；靖海将自行核对空缺。"
 ywc_society.1050.withhold:0 "挽留教习，不发出行准许"
 ywc_society.1050.withhold.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1050.withhold.consequence_tooltip:0 "交换记录以拒绝收束；靖海的空缺仍须自行填补。"
 ywc_society.1050.wait:0 "暂缓答复"
 ywc_society.1050.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1050.wait.consequence_tooltip:0 "记录本次决定。"
