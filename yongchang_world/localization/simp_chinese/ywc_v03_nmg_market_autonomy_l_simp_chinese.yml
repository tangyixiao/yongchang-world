l_simp_chinese:
 ywc_nmg_request_market_autonomy: "请求经办新明自己的市场"
 ywc_nmg_request_market_autonomy_desc: "向实际墨西哥宗主国询请市场管理权。既有固定汇款和欠款仍须支付；离开共同市场可能影响贸易与供给。墨西哥可以拒绝；条约解除或履约条件不再满足时，此权利结束。"
 ywc_nmg_request_market_autonomy_tooltip: "询问墨西哥；若同意，市场权只覆盖原协议的剩余期限，既有汇款和欠款仍须支付。新明将离开共同市场，双方都可以解除条约。"
 ywc_nmg_mex_market_control: "新明市场经办权"
 ywc_nmg_mex_market_control_desc: "在墨西哥固定汇款协议按约履行且直属关系有效时，新明经办自己的市场。"
 ywc_nmg_mex_market_control_pact_desc: "已获同意的固定汇款按约履行期间，新明经办自己的市场。"
