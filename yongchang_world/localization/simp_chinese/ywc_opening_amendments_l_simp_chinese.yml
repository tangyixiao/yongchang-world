l_simp_chinese:
 amendment_ywc_shu_exam_bureaucracy:0 "科举铨选"
 amendment_ywc_shu_exam_bureaucracy_desc:0 "以科举传统铨选官员，为中央官僚体系增加行政能力。这是对架空大顺文官制度的游戏化概括，并非对现实王朝的史实断言。"
 amendment_ywc_jhg_maritime_council:0 "海商水师商议"
 amendment_ywc_jhg_maritime_council_desc:0 "海商与水师议事有助于造船并降低海军补给成本，表现架空靖海政权既有的海上力量。"
 amendment_ywc_dmg_luzon_military_households:0 "吕宋军户守制"
 amendment_ywc_dmg_luzon_military_households_desc:0 "架空东明的军户体系巩固君主地位，并提升国家权威。"
 amendment_ywc_nmg_baja_autonomy_charter:0 "下加州自治议章"
 amendment_ywc_nmg_baja_autonomy_charter_desc:0 "架空新明的自治议事扩大政府合法性的社会基础，同时降低中央权威。"
 amendment_ywc_nqg_exile_court_edicts:0 "流亡旗廷谕禁"
 amendment_ywc_nqg_exile_court_edicts_desc:0 "架空北清朝廷以审查制度强化国家权威，而流亡处境削弱其合法性。"
 amendment_ywc_oir_yili_post_trade_accounts:0 "伊犁驿贸账制"
 amendment_ywc_oir_yili_post_trade_accounts_desc:0 "架空卫拉特政权沿驿路与商路建账，提升官僚行政能力。"
 amendment_ywc_mgl_banner_league_seats:0 "札萨克盟旗议席"
 amendment_ywc_mgl_banner_league_seats_desc:0 "架空独立喀尔喀汗国提高贵族在寡头议事中的投票权重。这是世界线设定，不是对清代盟旗制度的描述。"
 amendment_ywc_tib_ganden_phodrang_regency_council:0 "噶厦摄政会议"
 amendment_ywc_tib_ganden_phodrang_regency_council_desc:0 "摄政会议在摄政时期支持西藏政府的合法性与权威。"
 amendment_ywc_kor_three_tax_burdens:0 "三政加派"
 amendment_ywc_kor_three_tax_burdens_desc:0 "各档税率均采用小幅固定土地税修正，用于表现朝鲜后期三政相关的财政压力；同时加派削弱国家权威。这是游戏化近似，不代表精确历史税率。"
 amendment_ywc_lan_mining_district_council:0 "矿区客长公议"
 amendment_ywc_lan_mining_district_council_desc:0 "店主与矿区议席在兰芳的人口普查选举政府中获得更大影响力。这是对矿业公司联合体的近似，不等同现代代议共和国。"
