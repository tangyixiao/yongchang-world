 ywc_frontier.6.d:0 "开局约章已经说明谁能代表阿洪国发言，却还没有决定对外承诺的边界。最后一次议事要在区域互保与有限自立之间作出选择。"
 ywc_frontier.6.a:0 "争取彼此承担义务的区域保障。"
 ywc_frontier.6.b:0 "把约定收窄到本国承担得起的范围。"
 ywc_je_frontier_ahm:0 "阿洪国的地方约章"
 ywc_je_frontier_ahm_reason:0 "沿海和群岛社群靠航路、港埠与彼此的互信谋生。谁能征收港税、调停岛间争端、保护渔场，决定了商人是否愿意继续停靠。未来取决于地方认可、交通通畅与财政承诺之间能否维持平衡。"
 ywc_frontier.7.t:0 "阿克苏伯克国：地方約章"
 ywc_frontier.7.d:0 "商队要求统一关卡和通行文书。城中商人愿意垫付整顿费用，但希望税额和执法边界写入公开约章。 阿克苏伯克国眼下要决定：由共同账册统一规制，还是继续把裁量留给地方中介。"
 ywc_frontier.7.a:0 "把义务与边界写入公册。"
 ywc_frontier.7.b:0 "让地方继续自行维持约定。"
