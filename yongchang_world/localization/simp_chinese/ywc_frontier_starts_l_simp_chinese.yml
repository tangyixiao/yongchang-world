 ywc_frontier.10.d:0 "一次关于牧地、山口和供役的争执被送到议事桌上。寺院或首领愿意协助登记，但要求地方界线得到承认。 安多寺院联盟眼下要决定：由共同账册统一规制，还是继续把裁量留给地方中介。"
