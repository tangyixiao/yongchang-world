 ywc_frontier.31.b:0 "让地方继续自行维持约定。"
 ywc_frontier.32.t:0 "大理：道路与税额"
 ywc_frontier.32.d:0 "海路收益取决于港口协作，同时受到殖民者和更强海军的挤压。代表们要求决定由国库出资整顿通道，还是保留地方关税与供役安排。"
