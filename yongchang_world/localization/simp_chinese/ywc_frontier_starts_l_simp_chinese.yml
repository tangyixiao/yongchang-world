 ywc_je_frontier_waa:0 "佤山联盟的地方约章"
 ywc_je_frontier_waa_reason:0 "沿海和群岛社群靠航路、港埠与彼此的互信谋生。谁能征收港税、调停岛间争端、保护渔场，决定了商人是否愿意继续停靠。未来取决于地方认可、交通通畅与财政承诺之间能否维持平衡。"
 ywc_frontier.154.t:0 "西婆罗洲矿业联盟：地方約章"
 ywc_frontier.154.d:0 "数个港口提出联合巡护与统一停泊费的建议。协议有助于吸引商船，也意味着各港要接受共同核验和分担成本。 西婆罗洲矿业联盟眼下要决定：由共同账册统一规制，还是继续把裁量留给地方中介。"
 ywc_frontier.154.a:0 "把义务与边界写入公册。"
 ywc_frontier.154.b:0 "让地方继续自行维持约定。"
