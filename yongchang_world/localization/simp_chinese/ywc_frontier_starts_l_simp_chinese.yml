l_simp_chinese:
 ywc_frontier.1.t:0 "阿勒班部盟：地方約章"
 ywc_frontier.1.d:0 "诸部代表要求重议季节牧地与共同防务。盟主可以建立常设议约，也可以把裁决权留给各部首领。 阿勒班部盟眼下要决定：由共同账册统一规制，还是继续把裁量留给地方中介。"
 ywc_frontier.1.a:0 "把义务与边界写入公册。"
 ywc_frontier.1.b:0 "让地方继续自行维持约定。"
 ywc_frontier.2.t:0 "阿勒班部盟：道路与税额"
 ywc_frontier.2.d:0 "各部需要共享牧地与军役，也警惕邻国把互市变成控制。代表们要求决定由国库出资整顿通道，还是保留地方关税与供役安排。"
 ywc_frontier.2.a:0 "出资修路并设置共同核验点。"
 ywc_frontier.2.b:0 "保留现有税额与地方供役。"
 ywc_frontier.3.t:0 "阿勒班部盟：邻国之间"
 ywc_frontier.3.d:0 "开局约章已经说明谁能代表阿勒班部盟发言，却还没有决定对外承诺的边界。最后一次议事要在区域互保与有限自立之间作出选择。"
 ywc_frontier.3.a:0 "争取彼此承担义务的区域保障。"
 ywc_frontier.3.b:0 "把约定收窄到本国承担得起的范围。"
 ywc_je_frontier_abn:0 "阿勒班部盟的地方约章"
 ywc_je_frontier_abn_reason:0 "草原诸部以牧地、盟誓和共同防务维系联盟。可汗或盟主若要求过多固定军役，会失去部众；若无法协调冬营和边市，联盟又会被更有组织的邻国逐步挤压。未来取决于地方认可、交通通畅与财政承诺之间能否维持平衡。"
 ywc_frontier.4.t:0 "阿洪国：地方約章"
 ywc_frontier.4.d:0 "数个港口提出联合巡护与统一停泊费的建议。协议有助于吸引商船，也意味着各港要接受共同核验和分担成本。 阿洪国眼下要决定：由共同账册统一规制，还是继续把裁量留给地方中介。"
 ywc_frontier.4.a:0 "把义务与边界写入公册。"
 ywc_frontier.4.b:0 "让地方继续自行维持约定。"
 ywc_frontier.5.t:0 "阿洪国：道路与税额"
 ywc_frontier.5.d:0 "海路收益取决于港口协作，同时受到殖民者和更强海军的挤压。代表们要求决定由国库出资整顿通道，还是保留地方关税与供役安排。"
 ywc_frontier.5.a:0 "出资修路并设置共同核验点。"
 ywc_frontier.5.b:0 "保留现有税额与地方供役。"
