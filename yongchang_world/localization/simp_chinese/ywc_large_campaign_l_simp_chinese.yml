 ywc_nmg.108.d:0 "边境贸易需要安全。本章的关键在于财政与商业能力，所选安排必须通过真实市场与公共资金运转。"
 ywc_nmg.108.a:0 "共同巡逻，须双方配合"
 ywc_nmg.108.b:0 "本地民兵护路，增支出且易生外交争端（国库支出 £600）"
 ywc_nmg.109.t:0 "宗主财政协定"
 ywc_nmg.109.d:0 "关系结算。本章的关键在于财政与商业能力，所选安排必须通过真实市场与公共资金运转。"
 ywc_nmg.109.a:0 "墨方同意且分担可支付才能形成协议"
 ywc_nmg.109.b:0 "否则依法缩小承诺并让分歧进入太平洋危机"
 ywc_nmg.110.t:0 "北方商人的投标"
 ywc_nmg.110.d:0 "美国资本要求港口经营。本章检验国家的对外地位；持久安排取决于资源、外交与内部共识。"
 ywc_nmg.110.a:0 "给有限期限租约，获资金而受影响"
 ywc_nmg.110.b:0 "限制投资，保自主却难扩港"
 ywc_nmg.111.t:0 "墨西哥的宪制消息"
 ywc_nmg.111.d:0 "宗主内部改制。本章检验国家的对外地位；持久安排取决于资源、外交与内部共识。"
 ywc_nmg.111.a:0 "提出新自治条款，需关系和谈判"
 ywc_nmg.111.b:0 "暂守旧约，低风险但可能错过窗口"
 ywc_nmg.112.t:0 "海湾迁居者"
 ywc_nmg.112.d:0 "移民带来土地与选举争端。本章检验国家的对外地位；持久安排取决于资源、外交与内部共识。"
 ywc_nmg.112.a:0 "规范入籍和土地，增行政成本"
 ywc_nmg.112.b:0 "放任公会处理，省钱却激化身份分裂"
 ywc_nmg.113.t:0 "海岸中立声明"
 ywc_nmg.113.d:0 "两大邻国冲突可能外溢。本章检验国家的对外地位；持久安排取决于资源、外交与内部共识。"
 ywc_nmg.113.a:0 "寻多边中立保证，需让利与防务能力（国库支出 £600）"
 ywc_nmg.113.b:0 "依赖宗主保护，省支出而自主受限"
 ywc_nmg.114.t:0 "新明前途公议"
 ywc_nmg.114.d:0 "自治结算。本章检验国家的对外地位；持久安排取决于资源、外交与内部共识。"
 ywc_nmg.114.a:0 "宗主关系、财政和当地支持允许时稳固或重议自治"
 ywc_nmg.114.b:0 "若选择自立，仅开启可被抵抗的外交政治路径"
 ywc_crisis.1.t:0 "天下名分与宗藩再议·请愿"
 ywc_crisis.1.d:0 "请愿：SHU/JHG 提出共同外交称谓"
 ywc_crisis.1.a:0 "提议平等贸易、各自承担使团费"
 ywc_crisis.1.b:0 "主张等级礼制，得到保守派支持却抬高他国拒绝概率"
 ywc_crisis.2.t:0 "天下名分与宗藩再议·回应"
 ywc_crisis.2.d:0 "主对手：JHG/SHU 回应"
 ywc_crisis.2.a:0 "接受谈判但要求关税与航行权，需主张方让利"
 ywc_crisis.2.b:0 "拒绝称谓变更，保现状却增加海贸摩擦。对手灭亡则改成本国商会对既有条约的回应"
 ywc_crisis.3.t:0 "天下名分与宗藩再议·第三方"
 ywc_crisis.3.d:0 "第三方：KOR 自行回应，DMG 有条件回应"
 ywc_crisis.3.a:0 "朝鲜可接受对等使节、坚持传统礼仪但独立外交、或拒绝加入"
 ywc_crisis.3.b:0 "东明可争取贸易席位或观望。回应不得改变朝鲜独立地位或东明现有宗主关系"
 ywc_crisis.4.t:0 "天下名分与宗藩再议·筹资"
 ywc_crisis.4.d:0 "财政：各签约方审议使团与关税预算"
 ywc_crisis.4.a:0 "共筹互市和使团，花费与市场接入挂钩（国库支出 £1,200）"
 ywc_crisis.4.b:0 "缩成礼仪宣言，低成本但不改善实际贸易。无资金的国家默认缩小承诺"
 ywc_crisis.5.t:0 "天下名分与宗藩再议·临界点"
 ywc_crisis.5.d:0 "临界点：SHU/JHG 处理拒绝或反对运动"
 ywc_crisis.5.a:0 "删除排他称谓、保留经贸条款以争取妥协"
 ywc_crisis.5.b:0 "坚持原案，激化关系并使国内保守派动员。战争中仅可先搁置军事相关条款"
 ywc_crisis.6.t:0 "天下名分与宗藩再议·结算"
 ywc_crisis.6.d:0 "结算：实际签字国各自确认"
 ywc_crisis.6.a:0 "多方平等协议需至少两国明确同意、预算与关系可行（国库支出 £1,200）"
 ywc_crisis.6.b:0 "有限妥协只处理使节或关税（国库支出 £600）"
 ywc_crisis.6.c:0 "破裂留下有时限的外交与贸易余波"
 ywc_crisis.7.t:0 "黑水边疆·请愿"
 ywc_crisis.7.d:0 "边民陈情：NQG/SHU 提出护路与测界"
 ywc_crisis.7.a:0 "设共同测界委员会，需官吏和对方同意"
 ywc_crisis.7.b:0 "单边加强哨所，增军费并提高警戒"
 ywc_crisis.8.t:0 "黑水边疆·回应"
 ywc_crisis.8.d:0 "主邻国：SHU 或接壤者回应"
 ywc_crisis.8.a:0 "接受边市与巡逻议案，取得通商利益并承担护路费"
 ywc_crisis.8.b:0 "拒绝，保战略自由但关系恶化。无相邻国则改为贸易对象回应"
 ywc_crisis.9.t:0 "黑水边疆·第三方"
 ywc_crisis.9.d:0 "外部势力：俄国、日本、MGL 中合格者回应"
 ywc_crisis.9.a:0 "可提供限期商路保证、要求优惠准入，或不介入"
 ywc_crisis.9.b:0 "MGL 保有独立判断。未接触该区域者不凭空进入谈判"
 ywc_crisis.10.t:0 "黑水边疆·筹资"
 ywc_crisis.10.d:0 "动员：NQG 与参与国核算边防"
 ywc_crisis.10.a:0 "分摊哨所与道路费用，减少摩擦但占预算（国库支出 £700）"
 ywc_crisis.10.b:0 "优先军备，增威慑也压缩民生与贸易"
 ywc_crisis.11.t:0 "黑水边疆·临界点"
 ywc_crisis.11.d:0 "边市冲突：各方处理越界扣货"
 ywc_crisis.11.a:0 "赔偿并开放仲裁，财政受损而利于协议（国库支出 £700）"
 ywc_crisis.11.b:0 "扣留货物坚持主张，短期得利却增加升级风险"
 ywc_crisis.12.t:0 "黑水边疆·结算"
 ywc_crisis.12.d:0 "结算：参与国确认边防安排"
 ywc_crisis.12.a:0 "测界互市要求领土现状可确认且双方同意（国库支出 £700）"
 ywc_crisis.12.b:0 "有限妥协只开放边市（国库支出 £350）"
 ywc_crisis.12.c:0 "破裂留下边防警戒，不自动重画边界或宣战"
 ywc_crisis.13.t:0 "草原与高原商路·请愿"
 ywc_crisis.13.d:0 "商队联名：持有人提出过境路线"
 ywc_crisis.13.a:0 "公示低税路线，降低短期关税"
 ywc_crisis.13.b:0 "保地方关卡，保收入却扩大绕道"
 ywc_crisis.14.t:0 "草原与高原商路·回应"
 ywc_crisis.14.d:0 "相邻国：主要过境方回应"
 ywc_crisis.14.a:0 "提供通行照会并分担护路，需预算与关系"
 ywc_crisis.14.b:0 "要求独家通道，获市场优势却遭其他国家抵制"
 ywc_crisis.15.t:0 "草原与高原商路·第三方"
 ywc_crisis.15.d:0 "本地集团：旗主、寺院与商人表态"
 ywc_crisis.15.a:0 "给地方有限管理席位，减反对而使规则复杂"
 ywc_crisis.15.b:0 "中央统一征收，执行更整齐但激化抵制"
 ywc_crisis.16.t:0 "草原与高原商路·筹资"
 ywc_crisis.16.d:0 "筹资：各签约国计算驿站、边警开支"
 ywc_crisis.16.a:0 "按实际使用量分摊，需稳定财政（国库支出 £600）"
 ywc_crisis.16.b:0 "由商团承包，国库轻而可能垄断"
 ywc_crisis.17.t:0 "草原与高原商路·临界点"
 ywc_crisis.17.d:0 "断路：山口、牧场或边市纠纷"
 ywc_crisis.17.a:0 "设仲裁并临时开放替代道，花行政资源"
 ywc_crisis.17.b:0 "强推本国税则，增加外交风险与地方反抗"
 ywc_crisis.18.t:0 "草原与高原商路·结算"
 ywc_crisis.18.d:0 "结算：签约方确认通行权"
 ywc_crisis.18.a:0 "多边商路须至少两国有真实接壤或市场接入且出资（国库支出 £600）"
 ywc_crisis.18.b:0 "否则达成局部互市或无协议，不赠送铁路与所有权（国库支出 £300）"
 ywc_crisis.18.c:0 "无协议收束，并承受有时限的外交与贸易余波"
 ywc_crisis.19.t:0 "南洋航路·请愿"
 ywc_crisis.19.d:0 "商船申诉：持有人提出护航与港规"
 ywc_crisis.19.a:0 "公开统一港规，花行政费并约束本国商行"
 ywc_crisis.19.b:0 "保个别特许，维护既得收益但刺激走私"
 ywc_crisis.20.t:0 "南洋航路·回应"
 ywc_crisis.20.d:0 "主对手：JHG/DMG/LAN 中相关国回应"
 ywc_crisis.20.a:0 "签互认船照，需让出部分关税"
 ywc_crisis.20.b:0 "拒绝并自费护航，保控制而增成本"
 ywc_crisis.21.t:0 "南洋航路·第三方"
 ywc_crisis.21.d:0 "外部海权：西班牙或荷兰有条件回应"
 ywc_crisis.21.a:0 "接受互市准入、要求优先权或退出谈判"
 ywc_crisis.21.b:0 "兰芳可拒绝荷兰单方面保护而寻其他保障，不自动脱离实际宗主关系"
 ywc_crisis.22.t:0 "南洋航路·筹资"
 ywc_crisis.22.d:0 "船队与港库：各国核算投入"
 ywc_crisis.22.a:0 "分摊巡航与港务费，海路更稳但挤压预算（国库支出 £1,200）"
 ywc_crisis.22.b:0 "商行自备，国库轻而保障不均"
 ywc_crisis.23.t:0 "南洋航路·临界点"
 ywc_crisis.23.d:0 "扣船与保费争议：各方处理升级"
 ywc_crisis.23.a:0 "仲裁并退还争议费，损短期收入"
 ywc_crisis.23.b:0 "扣船施压，可能提高收益但恶化关系与海贸"
 ywc_crisis.24.t:0 "南洋航路·结算"
 ywc_crisis.24.d:0 "结算：实际签约方确认航路公约"
 ywc_crisis.24.a:0 "多边公约须至少两国承诺港规与可支付护航（国库支出 £1,200）"
 ywc_crisis.24.b:0 "否则局部船照互认或无协议，不给予免费舰队（国库支出 £600）"
 ywc_crisis.24.c:0 "无协议收束，并承受有时限的外交与贸易余波"
 ywc_crisis.25.t:0 "太平洋自治争议·请愿"
 ywc_crisis.25.d:0 "自治请愿：NMG 向墨西哥递交条款"
 ywc_crisis.25.a:0 "要求限额税权与地方任命，需保证汇缴"
 ywc_crisis.25.b:0 "提出更广自治，获本地支持却提高墨方拒绝概率"
 ywc_crisis.26.t:0 "太平洋自治争议·回应"
 ywc_crisis.26.d:0 "宗主回应：墨西哥独立作答"
 ywc_crisis.26.a:0 "接受有限财政与防务分担，换稳定税源"
 ywc_crisis.26.b:0 "拒绝并维持现行关系，保中央权力而提高自治压力"
 ywc_crisis.27.t:0 "太平洋自治争议·第三方"
 ywc_crisis.27.d:0 "第三方：美国与有实际联系的东亚国家回应"
 ywc_crisis.27.a:0 "可给予公开商业支持、谨慎观望或要求投资优先"
 ywc_crisis.27.b:0 "所有第三方只影响谈判筹码，不能替新明决定独立"
 ywc_crisis.28.t:0 "太平洋自治争议·筹资"
 ywc_crisis.28.d:0 "防务账本：NMG 与墨西哥核算海岸安全"
 ywc_crisis.28.a:0 "按约共同支付，增强防务但减少本地财政（国库支出 £700）"
 ywc_crisis.28.b:0 "各自防务，保自由却增加边界摩擦"
 ywc_crisis.29.t:0 "太平洋自治争议·临界点"
 ywc_crisis.29.d:0 "土地与迁居争议：本地议会回应"
 ywc_crisis.29.a:0 "建混合仲裁，花行政费且安抚居民"
 ywc_crisis.29.b:0 "让投资者先行，获资本却扩大身份与土地冲突"
 ywc_crisis.30.t:0 "太平洋自治争议·结算"
 ywc_crisis.30.d:0 "结算：NMG 与墨西哥分别确认"
 ywc_crisis.30.a:0 "双方同意且财政可行则稳固自治（国库支出 £700）"
 ywc_crisis.30.b:0 "只同意税或防务则限期妥协（国库支出 £350）"
 ywc_crisis.30.c:0 "破裂形成政治与外交行动窗口，不自动独立或割地"
