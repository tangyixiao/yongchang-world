 ywc_nqg.1028.d:0 "北清询请类型为 [SCOPE.GetValue('ywc_nqg_port_treaty_request_kind')|0v]（1：租约；2：护航；3：续约），涉及 [SCOPE.sState('ywc_nqg_port_treaty_request_port').GetName]。名义泊位份额 [SCOPE.GetValue('ywc_nqg_port_treaty_request_berth')|2v]，税则代码 [SCOPE.GetValue('ywc_nqg_port_treaty_request_duty')|0v]，期限 [SCOPE.GetValue('ywc_nqg_port_treaty_request_term')|0v] 个月，费用 @money![SCOPE.GetValue('ywc_nqg_port_treaty_request_cost')|0v]。护航期限为零时保留原租期。有效租约在捕获港州提供贸易容量加成（标准 +20%、修订 +30%）并将进口关税上限降低 10 个百分点；这影响全州贸易中心，不强制分配名义泊位，也不自动创建航线。状态按月核验，只有实际接收国可以答复。"
