 ywc_nqg.1030.t:0 "粮援的回函"
 ywc_nqg.1030.d:0 "北清请求粮援，捕获的偿还总额为 @money![SCOPE.GetValue('ywc_nqg_aid_request_total')|0v]，在三个月内按实际粮食流向分期计付。接受询请不会自动运送粮食；签约前仍须确认粮食确实从受邀方运入北清。只有实际受邀方可以答复。"
 ywc_nqg.1030.accept:0 "按捕获条款出粮"
 ywc_nqg.1030.accept.cost_tooltip:0 "出粮方在本项不收款；接受后由北清按捕获总额分三次月付。"
 ywc_nqg.1030.accept.consequence_tooltip:0 "答复固定本次代际与总额；北清仍须先有真实粮食流向才能签约。"
 ywc_nqg.1030.refuse:0 "拒绝粮援"
 ywc_nqg.1030.refuse.cost_tooltip:0 "双方国库都不扣款。"
 ywc_nqg.1030.refuse.consequence_tooltip:0 "北清收到拒绝，可改走国内限额供养路线；已付立案费不退。"
 ywc_nqg.1030.stale_dismiss:0 "搁置失效询请"
