 ywc_dmg.1122.d:0 "课表已经写好，教席却还要一一核对。大学任职的学者或教士能否承担教材工作，学校制度能否支撑课程，宗教政策又容许怎样的安排？如果条件尚不齐备，可以先把目标限于识字辅导和官署答疑。"
