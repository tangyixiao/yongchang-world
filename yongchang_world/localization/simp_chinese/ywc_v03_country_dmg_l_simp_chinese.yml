 ywc_dmg.1005.third:0 "宫廷单一仪式，逐份解释税令"
 ywc_dmg.1005.third.cost_tooltip:0 "保留旧身份行政成本，不重复收费。"
 ywc_dmg.1005.third.consequence_tooltip:0 "旧资格清楚列明，新人待遇留待申诉。"
 ywc_dmg.1006.t:0 "第一份共同任命书"
 ywc_dmg.1006.d:0 "至少六个月的连续路线条件已经满足。共同资格要求完全接纳（第5档），并在同一人口范围确认非主流群体实际受雇为官僚或军人，工作地点是有足够就业且无短缺的行政机构或军营。地方路线另要求次要文化人口实际在有足够就业、无短缺的行政机构工作。事件排队只等待90日门控后的投递窗口，不算改革受阻。十二个月提示只针对真实路线缺口；三十六月提供有限结算或撤回。"
 ywc_dmg.1006.common_qualification:0 "依法确认已落实资格"
 ywc_dmg.1006.common_qualification.cost_tooltip:0 "持续薪俸按实际预算结算。"
 ywc_dmg.1006.common_qualification.consequence_tooltip:0 "需 acceptance、在岗和行政余额分别达标，否则为有限资格。"
 ywc_dmg.1006.territorial_compact:0 "确认地方联署与申诉"
 ywc_dmg.1006.territorial_compact.cost_tooltip:0 "地方持续承担联署和复核。"
 ywc_dmg.1006.territorial_compact.consequence_tooltip:0 "没有全域平等声明；须有实际地方执行和申诉。"
 ywc_dmg.1006.status_orders:0 "确认旧身份分治并明列限制"
