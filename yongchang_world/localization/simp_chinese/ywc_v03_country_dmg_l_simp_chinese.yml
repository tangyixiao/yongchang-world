 ywc_dmg.1124.t:0 "下学期的账单"
 ywc_dmg.1124.d:0 "人员、条款、经费和治安已经接受逐月核查。连续六次合格，才轮到下学期的账单；战争、失州、违约或供给中断都需要重新观察。曾经落实中央任命与预算章程的政府，还可以申请减轻本次统筹费用。"
