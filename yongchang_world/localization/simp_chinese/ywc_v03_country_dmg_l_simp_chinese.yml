l_simp_chinese:
 ywc_je_v03_dmg_public_qualification:0 "同一国书上的资格"
 ywc_je_v03_dmg_public_qualification_reason:0 "六个月是资格、实际岗位与地方执行均连续满足后才可通过的最低观察期；若未达标，等待并补足条件，不把共享投递排队当作失败。十二个月只在选定路线确有条件缺口时提示；三十六月出现有限结算或撤回选择。十个主线事件受共享90日冷却，首个事件之后完整顺序最短约27个月。"
 ywc_je_v03_dmg_compact_review:0 "共同义务是否兑现"
 ywc_je_v03_dmg_compact_review_reason:0 "首轮承诺后进行连续九个月审查：资格是否仍合现行法律、职位是否实际在岗、地区申诉是否可用，以及财政和疆域是否变化。选举制度按现行职业投票权和身份投票许可核查；王权无选举时只核查实际公职和共同任命章程，不虚构议席。"
 ywc_dmg.1000.t:0 "一张军饷名册上的三种称呼"
 ywc_dmg.1000.d:0 "军饷册里有明裔军户、华商家庭与本地守军。共同纳税服役不自动等于同一任官、从军或申诉资格。无现役军队时改核官署名册；身份群体缺席时改看实际迁入者。"
 ywc_dmg.1000.common_qualification:0 "共同资格"
 ywc_dmg.1000.common_qualification.cost_tooltip:0 "年总收入÷52，最低100；登记与申诉所的一周费用。"
 ywc_dmg.1000.common_qualification.consequence_tooltip:0 "不改法律、主流文化或政体；任职另核真实岗位。"
 ywc_dmg.1000.territorial_compact:0 "地区契约"
 ywc_dmg.1000.territorial_compact.cost_tooltip:0 "年总收入÷52，最低100；另负担持续地方核验。"
 ywc_dmg.1000.territorial_compact.consequence_tooltip:0 "跨区任官和迁居仍需重谈。"
 ywc_dmg.1000.status_orders:0 "旧身份"
 ywc_dmg.1000.status_orders.cost_tooltip:0 "登记费外另付一周收入估算，维持分治行政。"
 ywc_dmg.1000.status_orders.consequence_tooltip:0 "旧盟友保有地位，新人须单独申诉。"
 ywc_dmg.1000.defer:0 "暂缓，待财政允许后再决定"
 ywc_dmg.1000.defer.cost_tooltip:0 "暂不支付登记费；稍后可重新选择。"
 ywc_dmg.1000.defer.consequence_tooltip:0 "议程保留，尚未承诺路线。"
 ywc_dmg.1000.withdraw:0 "退出本次议程"
 ywc_dmg.1000.withdraw.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1000.withdraw.consequence_tooltip:0 "以违约退出并释放议程名额，已付款项保留。"
 ywc_dmg.1001.t:0 "有税票，没有官印"
 ywc_dmg.1001.d:0 "纳税和服役记录不是已获任命。现行公民法律、非主流人口的实际 acceptance、官署或营房就业分别检查；分开的检查不证明同一群体进入了岗位。"
