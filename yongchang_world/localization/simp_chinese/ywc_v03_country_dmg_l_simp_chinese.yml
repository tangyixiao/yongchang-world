 ywc_dmg.1020.t:0 "没有选举时如何共议"
 ywc_dmg.1020.d:0 "有选举制度时按本国真实投票资格与在职代表核对；没有选举时用共署的官署章程、州预算与申诉记录。第二种做法写下的共署条款，是共同任命路线后续成立的要件。两种做法都不虚构任何议席。"
