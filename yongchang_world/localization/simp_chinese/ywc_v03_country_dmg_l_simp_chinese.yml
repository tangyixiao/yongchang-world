 ywc_je_v03_dmg_luzon_market_terms:0 "边界市集的本国条款"
 ywc_je_v03_dmg_luzon_market_terms_reason:0 "先选择本国当前持有的北吕宋试点，再支付登记费，核查既有市场通道、实际岗位与村社听证。受控互市、多边港口和严守边界分别承担不同费用与供给责任。没有港口、没有合用的通道或仍维持保守法律时，可以明确缩为本国生计与申诉账册，等待或退出。这里只管理既存资格，不代表外国作出新承诺。"
 ywc_je_v03_dmg_luzon_market_review:0 "六个月的港务与边界账"
 ywc_je_v03_dmg_luzon_market_review_reason:0 "章程签定后重新核查六个连续月的实际供给、财政、法律与既存市场资格。任何缺口都会中断这一观察，恢复后须明确从头重数。账单按当次开议收入计算，既有已付费用不重收。后续事实变化需要重新审查，失去北吕宋时仍可等待收复或主动退出。"
 ywc_dmg.1100.t:0 "边界另一侧的米袋"
 ywc_dmg.1100.d:0 "北吕宋村社的粮食、港口的货票和边界守军的命令并不总走同一条路。马尼拉一侧的归属和市场主也可能变化。官署需要先选择自己实际持有的试点，再决定本国承担何种查核责任。这里没有新的外国承诺。"
 ywc_dmg.1100.controlled_market:0 "受控互市：先管好现有边界通道"
 ywc_dmg.1100.controlled_market.cost_tooltip:0 "下一步登记费为开议时一周收入估算，最低100；已有可用共同资格名册可减半。"
 ywc_dmg.1100.controlled_market.consequence_tooltip:0 "选择当前本国持有的北吕宋试点；这里只确定本国意向，既有通道还要另行查核。"
 ywc_dmg.1100.multilateral_ports:0 "多边港口：分别核对靖海与兰芳旧通道"
