 ywc_dmg.1023.confirm_royal.consequence_tooltip:0 "仅在连续九个月复核成立、文书费与预算份额都已实付、官署真在任时确认；结案后 36 个月内行政压力上升、正当性受限。"
 ywc_dmg.1023.confirm_joint:0 "确认共同任命国书"
 ywc_dmg.1023.confirm_joint.cost_tooltip:0 "无需新增付款；已付款不退。"
 ywc_dmg.1023.confirm_joint.consequence_tooltip:0 "仅有选举时按真实选举资格、无选举时按共署章程都成立，且九个月复核连续时才确认；结案后 36 个月内正当性提高、行政压力上升。"
 ywc_dmg.1023.confirm_local:0 "确认地方联合国书"
 ywc_dmg.1023.confirm_local.cost_tooltip:0 "无需新增付款；已付款不退。"
 ywc_dmg.1023.confirm_local.consequence_tooltip:0 "以真实在任的次级官署与地方预算份额为基础，九个月复核连续时确认；结案后 36 个月内行政压力减轻、中央权威略降。"
 ywc_dmg.1023.limited_settlement:0 "承认有限结案（三十六个月未备齐）"
