 ywc_dmg.1103.t:0 "村社签名与官署收条"
 ywc_dmg.1103.d:0 "市集的争议最终要落到收条和申诉上。旧混合地契只有真正完成赔付与村社联署，并仍有本地人员办理时，才可沿用。没有这些前例也可以另写听证条款，实际官署和经办人必须承担工作。"
