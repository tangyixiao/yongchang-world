 ywc_dmg.1009.t:0 "共同臣民，也有共同的账"
 ywc_dmg.1009.d:0 "九个月审查到期；十二个月提示延误，三十六个月必须收束。按实际接受度、法律、就业、地方执行和预算分别确认；失地不抹除已付款项。"
 ywc_dmg.1009.common_qualification:0 "确立共同资格（条件不足则记有限）"
