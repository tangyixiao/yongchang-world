 ywc_dmg.1125.d:0 "新的登记册已经留出了下一届学生的名字。现在要决定，眼前的人员、课程和账目是否足以维持承诺：确认完整协议，接受地方共办或有限目标，承认尚未解决的缺口，或结束本次试点。"
