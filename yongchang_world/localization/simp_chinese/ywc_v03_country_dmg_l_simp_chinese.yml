 ywc_dmg.1120.local_joint.cost_tooltip:0 "本步不收费；教材登记费通常为半周收入（按开办时收入计算）。"
 ywc_dmg.1120.local_joint.consequence_tooltip:0 "选定当前本国所有的北吕宋试点及课程方向；下一步安排教材登记。"
 ywc_dmg.1120.central_curriculum:0 "中央课程：由现任政府统一教材"
 ywc_dmg.1120.central_curriculum.cost_tooltip:0 "本步不收费；教材登记费通常为一周收入（按开办时收入计算）。"
 ywc_dmg.1120.central_curriculum.consequence_tooltip:0 "选定当前本国所有的北吕宋试点及课程方向；下一步安排教材登记。"
