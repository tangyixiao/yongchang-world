 ywc_dmg.1022.pay_to_amend.cost_tooltip:0 "实扣一周估算年总收入（年总收入÷52），最低100；已付过地方份饷者不可重复扣款，本项仅在未付时可用。旧权划界结果下重新登记需一周半的现银（×1.5）。"
 ywc_dmg.1022.pay_to_amend.consequence_tooltip:0 "实扣成功才把继任者的修改条陈写进册子并进入承认程序；府库不足则留回本节点，容后再议。"
