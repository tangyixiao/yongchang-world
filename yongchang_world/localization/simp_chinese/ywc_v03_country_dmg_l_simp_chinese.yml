 ywc_dmg.1120.withdraw.consequence_tooltip:0 "结束本次协议，腾出一项长期事务的办理名额。"
 ywc_dmg.1121.t:0 "译本由谁付"
 ywc_dmg.1121.d:0 "抄写、译本与学籍登记都要有人承办。已经落实共同资格和公共翻译职责的官署，可以沿用旧章程，但仍须由本试点在职人员接手。此前没有达成改革的地区，也可以筹款重新起步。"
