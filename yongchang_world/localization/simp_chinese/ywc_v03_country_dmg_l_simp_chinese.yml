 ywc_dmg.1022.t:0 "新任官要不要重签"
 ywc_dmg.1022.d:0 "现任官或继任者接手，同时读取地契线的仲裁结果与已付、未付的赔付债务。可以确认既有条陈、付费修改条款、或让官署停摆留缺。前任离职不构成债务免除；旧权划界结果下重新登记需要更多现银。"
