 ywc_dmg.1105.t:0 "六个月后的第一份账"
 ywc_dmg.1105.d:0 "复核不是等一张日历翻过：六个连续月都须具备章程要求的实际供给与资格。缺口出现后，恢复也须明确从头重数。官署旧预算只有在实际任命和当前岗位仍可用时，才降低多边港口的这笔账；已经付款的账单不会再次收取。"
 ywc_dmg.1105.pay_review_bill:0 "按当前资格支付复核账；已付则核对收据"
