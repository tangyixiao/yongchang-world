l_simp_chinese:
 ywc_je_v03_dmg_public_qualification:0 "同一国书上的资格"
 ywc_je_v03_dmg_public_qualification_reason:0 "六个月是资格、实际岗位与地方执行均连续满足后才可通过的最低观察期；若未达标，等待并补足条件，不把共享投递排队当作失败。十二个月只在选定路线确有条件缺口时提示；三十六月出现有限结算或撤回选择。十个主线事件受共享90日冷却，首个事件之后完整顺序最短约27个月。"
 ywc_je_v03_dmg_compact_review:0 "共同义务是否兑现"
 ywc_je_v03_dmg_compact_review_reason:0 "首轮承诺后进行连续九个月审查：资格是否仍合现行法律、职位是否实际在岗、地区申诉是否可用，以及财政和疆域是否变化。选举制度按现行职业投票权和身份投票许可核查；王权无选举时只核查实际公职和共同任命章程，不虚构议席。"
 ywc_dmg.1000.t:0 "一张军饷名册上的三种称呼"
 ywc_dmg.1000.d:0 "军饷册里有明裔军户、华商家庭与本地守军。共同纳税服役不自动等于同一任官、从军或申诉资格。无现役军队时改核官署名册；身份群体缺席时改看实际迁入者。"
 ywc_dmg.1000.common_qualification:0 "共同资格"
 ywc_dmg.1000.common_qualification.cost_tooltip:0 "年总收入÷52，最低100；登记与申诉所的一周费用。"
 ywc_dmg.1000.common_qualification.consequence_tooltip:0 "不改法律、主流文化或政体；任职另核真实岗位。"
 ywc_dmg.1000.territorial_compact:0 "地区契约"
 ywc_dmg.1000.territorial_compact.cost_tooltip:0 "年总收入÷52，最低100；另负担持续地方核验。"
 ywc_dmg.1000.territorial_compact.consequence_tooltip:0 "跨区任官和迁居仍需重谈。"
 ywc_dmg.1000.status_orders:0 "旧身份"
 ywc_dmg.1000.status_orders.cost_tooltip:0 "登记费外另付一周收入估算，维持分治行政。"
 ywc_dmg.1000.status_orders.consequence_tooltip:0 "旧盟友保有地位，新人须单独申诉。"
 ywc_dmg.1000.defer:0 "暂缓，待财政允许后再决定"
 ywc_dmg.1000.defer.cost_tooltip:0 "暂不支付登记费；稍后可重新选择。"
 ywc_dmg.1000.defer.consequence_tooltip:0 "议程保留，尚未承诺路线。"
 ywc_dmg.1000.withdraw:0 "退出本次议程"
 ywc_dmg.1000.withdraw.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1000.withdraw.consequence_tooltip:0 "以违约退出并释放议程名额，已付款项保留。"
 ywc_dmg.1001.t:0 "有税票，没有官印"
 ywc_dmg.1001.d:0 "纳税和服役记录不是已获任命。现行公民法律、非主流人口的实际 acceptance、官署或营房就业分别检查；分开的检查不证明同一群体进入了岗位。"
 ywc_dmg.1001.first:0 "依现行法正常立法，不免费通过"
 ywc_dmg.1001.first.cost_tooltip:0 "费用不因重复事件重复收取。"
 ywc_dmg.1001.first.consequence_tooltip:0 "只结算该项承诺，不自动改变法律或人口。"
 ywc_dmg.1001.second:0 "设地区代理官，保留旧法可谈空间"
 ywc_dmg.1001.second.cost_tooltip:0 "保留已支付费用，继续承担地方核验。"
 ywc_dmg.1001.second.consequence_tooltip:0 "跨区例外和下一代争议继续存在。"
 ywc_dmg.1001.third:0 "保留旧资格并开放复核"
 ywc_dmg.1001.third.cost_tooltip:0 "保留旧身份行政成本，不重复收费。"
 ywc_dmg.1001.third.consequence_tooltip:0 "旧资格清楚列明，新人待遇留待申诉。"
 ywc_dmg.1002.t:0 "旧军户交来的请愿"
 ywc_dmg.1002.d:0 "旧军役承诺与新居民竞任诉求并存。补偿、开放竞任或保留部分旧职互斥；补偿按开线估算一周收入且仅能支付一次。"
 ywc_dmg.1002.pay_training:0 "支付一次转制补偿，开放竞任"
 ywc_dmg.1002.pay_training.cost_tooltip:0 "一周开线估算收入，最低100；一次支付。"
 ywc_dmg.1002.pay_training.consequence_tooltip:0 "缓冲转制，不直接填军队。"
 ywc_dmg.1002.open_competition:0 "按实际法律开放竞任"
 ywc_dmg.1002.open_competition.cost_tooltip:0 "没有额外拨款；训练、军饷仍受预算约束。"
 ywc_dmg.1002.open_competition.consequence_tooltip:0 "需另查当前法、acceptance和空缺。"
 ywc_dmg.1002.reserved_posts:0 "保留部分旧职，承认新人限制"
 ywc_dmg.1002.reserved_posts.cost_tooltip:0 "不付转制补偿，旧职仍有行政成本。"
 ywc_dmg.1002.reserved_posts.consequence_tooltip:0 "不能称共同资格已兑现。"
 ywc_dmg.1003.t:0 "村社不是一个人的签名"
 ywc_dmg.1003.d:0 "地方契约须说明谁能代表村社。混合听证、贵族担保或王命直下各自改变地方执行和申诉；无选举法时只能写听证或公职联署。"
 ywc_dmg.1003.joint_hearing:0 "付费混合听证与申诉簿"
 ywc_dmg.1003.joint_hearing.cost_tooltip:0 "另扣一周估算年总收入（年总收入÷52），最低100。"
 ywc_dmg.1003.joint_hearing.consequence_tooltip:0 "共同听审每两年增加文书负担，换取少量正当性。"
 ywc_dmg.1003.noble_guarantee:0 "贵族担保，保地方权但范围窄"
 ywc_dmg.1003.noble_guarantee.cost_tooltip:0 "另扣一周估算年总收入（年总收入÷52），最低100。"
 ywc_dmg.1003.noble_guarantee.consequence_tooltip:0 "贵族担保每两年占用权威，并提高正当性。"
 ywc_dmg.1003.royal_order:0 "王命直下，承担地方对立"
 ywc_dmg.1003.royal_order.cost_tooltip:0 "另扣一周估算年总收入（年总收入÷52），最低100。"
 ywc_dmg.1003.royal_order.consequence_tooltip:0 "王命每两年降低正当性，保留行政能力。"
 ywc_dmg.1003.defer:0 "暂缓落实，等待资金"
 ywc_dmg.1003.defer.cost_tooltip:0 "不付款，稍后可重选。"
 ywc_dmg.1003.defer.consequence_tooltip:0 "本地安排尚未落实。"
 ywc_dmg.1003.withdraw:0 "退出本次议程"
 ywc_dmg.1003.withdraw.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1003.withdraw.consequence_tooltip:0 "以违约退出并释放议程名额，已付款项保留。"
 ywc_dmg.1004.t:0 "同名的两个继承人"
 ywc_dmg.1004.d:0 "一个继承个案不能代表所有家庭。统一任官解释、地区分别认定或保留旧例并复核；不自动改写全部财产权。无相应群体时转为迁入者跨地区复议。"
 ywc_dmg.1004.first:0 "统一任官解释，财产权另案"
 ywc_dmg.1004.first.cost_tooltip:0 "费用不因重复事件重复收取。"
 ywc_dmg.1004.first.consequence_tooltip:0 "只结算该项承诺，不自动改变法律或人口。"
 ywc_dmg.1004.second:0 "各地分别认定并保留跨区复核"
 ywc_dmg.1004.second.cost_tooltip:0 "保留已支付费用，继续承担地方核验。"
 ywc_dmg.1004.second.consequence_tooltip:0 "跨区例外和下一代争议继续存在。"
