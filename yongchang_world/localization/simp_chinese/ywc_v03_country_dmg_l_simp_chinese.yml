 ywc_dmg.1002.reserved_posts:0 "保留部分旧职，承认新人限制"
 ywc_dmg.1002.reserved_posts.cost_tooltip:0 "不付转制补偿，旧职仍有行政成本。"
 ywc_dmg.1002.reserved_posts.consequence_tooltip:0 "不能称共同资格已兑现。"
 ywc_dmg.1003.t:0 "村社不是一个人的签名"
