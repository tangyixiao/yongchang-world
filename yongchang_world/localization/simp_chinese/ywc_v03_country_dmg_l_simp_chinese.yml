 ywc_dmg.1107.t:0 "本国承诺的边界"
 ywc_dmg.1107.d:0 "结算时必须再看一次眼前的世界。真实通道、官署和供给仍在，才能记作完整履约；明确约定的国内有限目标只按自身范围结算。若既定条件已经失去，就承认受挫、明确重数或退出。任何章程都不能替另一国作出承诺。"
