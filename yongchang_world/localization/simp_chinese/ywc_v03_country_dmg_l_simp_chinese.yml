 ywc_dmg.1023.withdraw_court:0 "停止诸邑线（依法撤回）"
 ywc_dmg.1023.withdraw_court.cost_tooltip:0 "无需新增付款；已付款不退。"
 ywc_dmg.1023.withdraw_court.consequence_tooltip:0 "以撤回结案；已付文书费、预算份额、在任岗位与未付债务全部保留。"
 ywc_je_v03_dmg_school_languages:0 "学堂的两种声音"
 ywc_je_v03_dmg_school_languages_reason:0 "北吕宋的课程、地方文字与教学经费需要一份能跨越任期的协议。选择双语公学、地方共办或中央课程，在本国试点核实学校制度、大学人员与官署供给，支付教材登记和下学期账单。连续六次月度核查后结案；学校尚不齐备时，也可先约定有限辅导与申诉安排。"
 ywc_dmg.1120.t:0 "同一间讲堂"
 ywc_dmg.1120.d:0 "北吕宋官署收到几份不同的课表：有人要求共用教材，有人坚持保留地方文字，教士和村社则希望参与办学。政府必须先确定本次试点的课程方向，再逐项核实人员与经费。无论王廷还是共和政府，都得回答同一个问题：谁来教，又由谁付款？"
 ywc_dmg.1120.bilingual_public:0 "双语公学：共同课程与地方文字并行"
 ywc_dmg.1120.bilingual_public.cost_tooltip:0 "本步不收费；教材登记费通常为一周收入（按开办时收入计算）。"
 ywc_dmg.1120.bilingual_public.consequence_tooltip:0 "选定当前本国所有的北吕宋试点及课程方向；下一步安排教材登记。"
