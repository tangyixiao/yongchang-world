 ywc_dmg.1023.t:0 "诸邑承认哪一种国书"
 ywc_dmg.1023.d:0 "连续九个月的真实在任、预算与法定代表条件，才能确认王廷统筹、共同任命或地方联合中的一种。依法部分履行的可以折中，受阻的可以限额结案；失去州、开战、财政恶化或政治团体离开，各自给出重议、限额或退出的分支。本事件绝不自动给予独立或改动政体。"
