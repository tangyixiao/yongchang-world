 ywc_dmg.1009.withdraw_breach:0 "撤回承诺并承担失信"
 ywc_dmg.1009.withdraw_breach.cost_tooltip:0 "不再追加费用；先前付款不退。"
 ywc_dmg.1009.withdraw_breach.consequence_tooltip:0 "直接落失信结局，保留已支付标志，不可被后续选项改写。"
 ywc_je_v03_dmg_land_titles_review:0 "丈量、赔付与登记复核"
 ywc_je_v03_dmg_land_titles_review_reason:0 "在真实领有的一个州里做登记试点：先付一周估算年总收入（年总收入÷52，最低100）的登记费，再从三条路线中选一条，才进入丈量与赔付。执行条件是真实的农业就业与在任官署，加上可承受的财政；六个月连续成立才成熟，任何中断都清零重看。第十二个月只提出限额或重新议定，第三十六个月结算或退出。已付款与已签赔付债务永不消除，和平状态正常也可完成。"
 ywc_dmg.1010.t:0 "军户与村社各执一契"
 ywc_dmg.1010.d:0 "同一片田上，军户拿出旧役契，村社拿出世代耕作的惯例记录。王廷要决定用哪一种凭据开册：混合仲裁让村社派人并案申诉，统一契约按现行土地法核验书面契据并由官署承接，旧权划界则保留旧界只登记无争议地段。三条路的登记费与证据要求不同，府库不足时可以先不推进。"
 ywc_dmg.1010.mixed_arbitration:0 "混合仲裁（县级并案与村社申诉）"
 ywc_dmg.1010.mixed_arbitration.cost_tooltip:0 "另扣一周估算年总收入（年总收入÷52），最低100；实扣成功才锁定路线。"
 ywc_dmg.1010.mixed_arbitration.consequence_tooltip:0 "军户旧役契与村社耕作惯例并案听审，村社可派代表申诉；登记费实扣后才进入丈量安排。"
 ywc_dmg.1010.unified_contract:0 "统一契约（书面核验由官署承接）"
 ywc_dmg.1010.unified_contract.cost_tooltip:0 "另扣一周估算年总收入（年总收入÷52），最低100；实扣成功才锁定路线。"
 ywc_dmg.1010.unified_contract.consequence_tooltip:0 "按本国现行土地法允许的书面契约统一登记，由在任官署承接核验；承接受耕作者与持契人同列一册。"
 ywc_dmg.1010.old_boundary:0 "旧权划界（保留旧界、缩小试点）"
 ywc_dmg.1010.old_boundary.cost_tooltip:0 "另扣一周估算年总收入（年总收入÷52），最低100；实扣成功才锁定路线。"
 ywc_dmg.1010.old_boundary.consequence_tooltip:0 "保留旧界与旧册，只登记无争议地段；重复丈量与旧册核对的开支仍由王廷承担。"
 ywc_dmg.1010.defer:0 "暂缓登记（府库不足时不推进）"
 ywc_dmg.1010.defer.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1010.defer.consequence_tooltip:0 "路线保持未定，本事件可在后续月份重新提出；不产生新的登记事实。"
 ywc_dmg.1010.withdraw_titles:0 "停止地契线（依法撤回）"
 ywc_dmg.1010.withdraw_titles.cost_tooltip:0 "无需新增付款；已付款不退。"
 ywc_dmg.1010.withdraw_titles.consequence_tooltip:0 "本线以撤回结案；已签赔付债务、已付登记费与实际登记事实全部保留。"
 ywc_dmg.1011.t:0 "丈量员从哪条田埂走"
 ywc_dmg.1011.d:0 "丈量要有人跟着走。共同资格代表随行、持契商人书面作保、或只按旧册旧界核对，三条路决定谁能签字、以及在任官署与农业就业的门槛要多高。此前的共同臣民安排在认可与岗位上越完整，可随行的代表越多；条件不够时可以缩小范围或另择一路。"
 ywc_dmg.1011.joint_survey:0 "共同丈量（共同资格代表随行）"
 ywc_dmg.1011.joint_survey.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1011.joint_survey.consequence_tooltip:0 "签字权扩及实际耕作者；此前的共同臣民安排在认可与岗位上都成立时，可随行的代表更多，丈量结果更难被单方否认。"
 ywc_dmg.1011.contract_holders:0 "持契担保（商契持有人书面作保）"
 ywc_dmg.1011.contract_holders.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1011.contract_holders.consequence_tooltip:0 "丈量界线由持契商人与承接受耕作者书面作保；官署只核验书面，不逐户到田。"
 ywc_dmg.1011.old_register:0 "旧册重丈（按旧界原册核对）"
 ywc_dmg.1011.old_register.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1011.old_register.consequence_tooltip:0 "丈量只核对旧册与旧界，界外与争议地段不登记；开支重复发生而试点范围最小。"
 ywc_dmg.1011.defer:0 "等代表到位再丈量"
 ywc_dmg.1011.defer.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1011.defer.consequence_tooltip:0 "本节点保留，待在任官署或代表条件真实具备后再议。"
 ywc_dmg.1011.withdraw_titles:0 "停止地契线（依法撤回）"
 ywc_dmg.1011.withdraw_titles.cost_tooltip:0 "无需新增付款；已付款不退。"
 ywc_dmg.1011.withdraw_titles.consequence_tooltip:0 "本线以撤回结案；已付款与已签债务保留。"
 ywc_dmg.1012.t:0 "商人的抵押契"
 ywc_dmg.1012.d:0 "持契商人要求把抵押写进册子并取得优先受偿顺序。王廷可以登记这一顺序、交给地方联保人承担核验，或者干脆拒绝抵押并把试点缩小到无争议地段。契据顺序一旦登记，下一节点先付给谁、要付多少就跟着变。"
 ywc_dmg.1012.priority_recorded:0 "登记商契优先受偿顺序"
 ywc_dmg.1012.priority_recorded.cost_tooltip:0 "本节点不新增扣款；核验结果并入赔付顺序，使 1013 所需现银提高到一周半年总收入（×1.5）。"
 ywc_dmg.1012.priority_recorded.consequence_tooltip:0 "核验费不从本节点扣除，而是在 1013 的赔付中按契据顺序优先列支；未备足提高后的现银则无法付款。"
 ywc_dmg.1012.local_joint_guarantee:0 "地方联保（核验责任交联保人）"
 ywc_dmg.1012.local_joint_guarantee.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1012.local_joint_guarantee.consequence_tooltip:0 "核验责任由地方联保人承担，抵押不取得优先顺序；1013 的受偿顺序仍按当事人身份确定。"
 ywc_dmg.1012.refuse_mortgage:0 "拒绝抵押并把试点缩小"
 ywc_dmg.1012.refuse_mortgage.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1012.refuse_mortgage.consequence_tooltip:0 "试点只保留无争议地段，商人诉求不进入本册；赔付范围与实际登记范围同步缩小。"
 ywc_dmg.1012.defer:0 "先核验后付款"
 ywc_dmg.1012.defer.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1012.defer.consequence_tooltip:0 "契据顺序暂不登记，本事件可在后续月份重新提出。"
 ywc_dmg.1012.withdraw_titles:0 "停止地契线（依法撤回）"
 ywc_dmg.1012.withdraw_titles.cost_tooltip:0 "无需新增付款；已付款不退。"
 ywc_dmg.1012.withdraw_titles.consequence_tooltip:0 "本线以撤回结案；已付款与商契事实保留。"
 ywc_dmg.1013.t:0 "赔偿先付给谁"
 ywc_dmg.1013.d:0 "赔付只能付一次：军户本家、实际耕作者、或契据在册的债权人。一次性付清要真实扣款并同时检查府库与破产，只有真的扣下来才写下已付并推进；府库不足就留在本节点重试，或者改走地方分期与旧界限额，或依法撤回。"
 ywc_dmg.1013.pay_documented_creditor:0 "先付契据在册的债权人"
 ywc_dmg.1013.pay_documented_creditor.cost_tooltip:0 "实扣一周估算年总收入（年总收入÷52），最低100；已扣过则不重复扣款。"
 ywc_dmg.1013.pay_documented_creditor.consequence_tooltip:0 "只有实际扣款才写下已付并推进；现银不足或已破产则留在本节点重试，或依法撤回。"
 ywc_dmg.1013.pay_actual_cultivator:0 "先付实际耕作者"
 ywc_dmg.1013.pay_actual_cultivator.cost_tooltip:0 "实扣一周估算年总收入（年总收入÷52），最低100；已扣过则不重复扣款。"
 ywc_dmg.1013.pay_actual_cultivator.consequence_tooltip:0 "赔付直接给在田耕作者，旧役契持有人转为普通债权；实扣成功才推进。"
 ywc_dmg.1013.pay_service_household:0 "先付军户本家"
 ywc_dmg.1013.pay_service_household.cost_tooltip:0 "实扣一周估算年总收入（年总收入÷52），最低100；已扣过则不重复扣款。"
 ywc_dmg.1013.pay_service_household.consequence_tooltip:0 "赔付按旧役契给本家，村社与迁居者随后另议；实扣成功才推进。"
 ywc_dmg.1013.local_instalments:0 "改为地方分期赔付（不一次付清）"
 ywc_dmg.1013.local_instalments.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1013.local_instalments.consequence_tooltip:0 "本节点不扣款，赔付改由地方分期承担；未付清的赔付债务保留在册，路线不能按已付结案。"
 ywc_dmg.1013.old_boundary_limit:0 "只按旧界赔付并缩小范围"
 ywc_dmg.1013.old_boundary_limit.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1013.old_boundary_limit.consequence_tooltip:0 "旧界之外与争议地段不赔付、不登记；已付款不退，未付债务仍留在册。"
 ywc_dmg.1013.withdraw_titles:0 "停止地契线（依法撤回）"
 ywc_dmg.1013.withdraw_titles.cost_tooltip:0 "无需新增付款；已付款不退。"
 ywc_dmg.1013.withdraw_titles.consequence_tooltip:0 "本线以撤回结案；已付款、赔偿债务与登记事实全部保留。"
 ywc_dmg.1014.t:0 "迁居者来补登"
 ywc_dmg.1014.d:0 "迁居者要求把耕作与抵押关系补登记进册子。可以逐户受理个别申诉、由村社联署、或只在旧册范围内补记。三条路要求真实的在任官署、已有的代表或联保机制，以及旧册本身；本事件不生成任何移民人口，扣款失败也不推进。"
 ywc_dmg.1014.individual_appeal:0 "迁居者个别申诉（逐户核验）"
 ywc_dmg.1014.individual_appeal.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1014.individual_appeal.consequence_tooltip:0 "申诉逐户处理，需要真实在任的次级官署承接；共同臣民安排在认可与岗位上越完整，可受理的申诉越多。"
 ywc_dmg.1014.village_cosignature:0 "村社联署登记（须有代表机制）"
 ywc_dmg.1014.village_cosignature.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1014.village_cosignature.consequence_tooltip:0 "迁居者须由村社联署；此机制只有在丈量阶段真的建立了代表或联保时才可用。"
 ywc_dmg.1014.old_roll_entry:0 "旧册补登（按旧界原册补记）"
 ywc_dmg.1014.old_roll_entry.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1014.old_roll_entry.consequence_tooltip:0 "只补记旧册范围内的地段，登记范围不扩大；重复核对开支照旧发生。"
 ywc_dmg.1014.defer:0 "等下轮丈量再补登"
 ywc_dmg.1014.defer.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1014.defer.consequence_tooltip:0 "补登暂不受理，本事件可在后续月份重新提出；不产生移民人口或新地块。"
 ywc_dmg.1014.withdraw_titles:0 "停止地契线（依法撤回）"
 ywc_dmg.1014.withdraw_titles.cost_tooltip:0 "无需新增付款；已付款不退。"
 ywc_dmg.1014.withdraw_titles.consequence_tooltip:0 "本线以撤回结案；已登记与已付款事实保留。"
 ywc_dmg.1015.t:0 "土地没有随纸张移动"
 ywc_dmg.1015.d:0 "复核实际登记、农业就业、官署供给、府库与地方动荡。只有在这条路线上连续观察成立的人才能确认结果；依法部分履行的可以折中结案。失去州、开战或破产时，仍可限额、重议或撤回，债务一律保留。"
 ywc_dmg.1015.confirm_mixed:0 "确认混合仲裁结果（连续复核成立）"
 ywc_dmg.1015.confirm_mixed.cost_tooltip:0 "无需新增付款；已付款不退。"
 ywc_dmg.1015.confirm_mixed.consequence_tooltip:0 "仅在连续六个月复核成立、登记费与赔付都已实付时确认；结案后 36 个月内行政负担上升、正当性提高。"
 ywc_dmg.1015.confirm_contract:0 "确认统一契约结果（书面核验成立）"
 ywc_dmg.1015.confirm_contract.cost_tooltip:0 "无需新增付款；已付款不退。"
 ywc_dmg.1015.confirm_contract.consequence_tooltip:0 "仅在现行土地法允许、书面核验与登记费都成立时确认；结案后行政负担下降、旧claimant认可减少。"
 ywc_dmg.1015.confirm_legacy:0 "确认旧权划界结果（旧界旧册为准）"
 ywc_dmg.1015.confirm_legacy.cost_tooltip:0 "无需新增付款；已付款不退。"
 ywc_dmg.1015.confirm_legacy.consequence_tooltip:0 "旧界与旧册继续有效，试点范围最小；结案后登记开支长期偏高、正当性受限。"
 ywc_dmg.1015.limited_settlement:0 "承认有限结案（三十六个月未备齐）"
 ywc_dmg.1015.limited_settlement.cost_tooltip:0 "无需新增付款；已付款不退。"
 ywc_dmg.1015.limited_settlement.consequence_tooltip:0 "第三十六个月后，只有低目标已实际选定、登记费已付、地方联合路线已就绪并通过新一轮连续六个月复核，才以有限结果结案；否则不会结案。"
 ywc_dmg.1015.renegotiate:0 "安全等待或重新议定"
 ywc_dmg.1015.renegotiate.cost_tooltip:0 "无需新增付款；已付款不退。"
 ywc_dmg.1015.renegotiate.consequence_tooltip:0 "可为土地路线提出或保留较窄目标；官署、登记与财政条件恢复后，必须重新连续观察六个月才可确认或有限结案。等待会保留原路线、已付款与债务。"
 ywc_dmg.1015.withdraw_titles:0 "停止地契线（依法撤回）"
 ywc_dmg.1015.withdraw_titles.cost_tooltip:0 "无需新增付款；已付款不退。"
 ywc_dmg.1015.withdraw_titles.consequence_tooltip:0 "以撤回结案；已付登记费、赔偿债务与登记事实全部保留。"
 ywc_je_v03_dmg_court_appointment:0 "任命权议定"
 ywc_je_v03_dmg_court_appointment_reason:0 "王廷的印与地方的印要落在同一封信上。三条真实安排互斥：王廷统筹以中央预算与在任官署承担任命，共同任命以本国真实的选举资格或共署章程为据，地方联合以地方预算份额与共同申诉为条件。选择任意一条都要另付一周估算年总收入（年总收入÷52，最低100）的文书与踏勘费，实扣成功才锁定路线。文字上选定不等于任命已经完成；失去州或政治团体变动仍可重议、限额或撤回。"
 ywc_je_v03_dmg_court_budget:0 "实职与地方预算履行"
 ywc_je_v03_dmg_court_budget_reason:0 "任命书送到官署之后要有人真的在任，预算份额要真的付得出来。本线核对实际的政府官署与员额、所选预算份额与财政承受能力；在任岗位不由事件生成，缺员只能由玩家在基础游戏中补员或兴建。两张地契的仲裁结果在这里继续生效：旧权划界沿用旧官署名册，混合仲裁承认共同申诉，统一契约要求官署书面核验。第十二与第三十六个月给出修复或退出的窗口，已付款、真实岗位与债务都保留。"
 ywc_je_v03_dmg_court_charter_review:0 "代表与共任章程连续九个月复核"
 ywc_je_v03_dmg_court_charter_review_reason:0 "哪一种国书能被诸邑承认，要看连续九个月的真实条件：有选举制度时按本国真实选举资格与在职代表核对，无选举时看共署的官署章程、州预算与申诉记录。任何中断都从零重看，不虚构任何议席。失去州、开战、财政恶化或政治团体变动都会给出重议、限额或退出的分支；和平时期照常推行预算联署与轮值审计。"
 ywc_dmg.1016.t:0 "王印与地方印在同一封信"
 ywc_dmg.1016.d:0 "王廷催促任命，城镇却要求先谈预算责任。王廷统筹、共同任命、地方联合三条安排通向不同的日志目标、不同的文书费与不同的真实岗位门槛。文书与踏勘费要真实扣除才锁定路线，府库不足时可以先不推进。"
 ywc_dmg.1016.royal_administration:0 "王廷统筹（中央预算与在任官署）"
 ywc_dmg.1016.royal_administration.cost_tooltip:0 "另扣一周估算年总收入（年总收入÷52）作任命文书与踏勘费，最低100；实扣成功才锁定统筹路线。"
 ywc_dmg.1016.royal_administration.consequence_tooltip:0 "文书费实扣后才推进；王廷要以真实在任官署与中央预算承担任命，经费与员额都不由事件凭空产生。"
 ywc_dmg.1016.joint_appointment:0 "共同任命（真实代表或共署章程）"
 ywc_dmg.1016.joint_appointment.cost_tooltip:0 "同样另扣一周估算年总收入，最低100；须已有真实代表或可承接任命的次级官署。"
 ywc_dmg.1016.joint_appointment.consequence_tooltip:0 "有选举时按本国真实选举资格与在职代表核对，无选举时须共署官署章程与预算；声称并不等于任命完成。"
 ywc_dmg.1016.local_compact:0 "地方联合（地方预算份额与共同申诉）"
 ywc_dmg.1016.local_compact.cost_tooltip:0 "同样另扣一周估算年总收入，最低100；须有真实在任的次级官署。"
 ywc_dmg.1016.local_compact.consequence_tooltip:0 "地方承担预算份额并取得共同申诉渠道；官署员额仍须真实在任，事件不生成任何岗位。"
 ywc_dmg.1016.defer:0 "暂缓议定（待官署与府库就绪）"
 ywc_dmg.1016.defer.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1016.defer.consequence_tooltip:0 "王印与地方印都仍悬置，本事件可在后续月份重新提出；不产生任命事实。"
 ywc_dmg.1016.withdraw_court:0 "停止诸邑线（依法撤回）"
 ywc_dmg.1016.withdraw_court.cost_tooltip:0 "无需新增付款；已付款不退。"
 ywc_dmg.1016.withdraw_court.consequence_tooltip:0 "本线以撤回结案；已付文书费、在任岗位与既有债务全部保留。"
 ywc_dmg.1017.t:0 "地方愿出多少饷"
 ywc_dmg.1017.d:0 "份饷有三种出法：中央出钱并接受中央审计、地方从真实财政里出一份并因此取得联署、或者把旧预算定成上限并把任务缩小。地契线的仲裁结果在这里决定谁有资格联署、地方申诉要花多少成本；本事件不产生任何凭空收入。"
 ywc_dmg.1017.central_audit_pays:0 "中央付款、中央审计"
 ywc_dmg.1017.central_audit_pays.cost_tooltip:0 "实扣一周估算年总收入（年总收入÷52），最低100；已付过预算份额则不重复扣款，未扣款不推进。"
 ywc_dmg.1017.central_audit_pays.consequence_tooltip:0 "预算份额由中央实际支出并接受中央审计；实扣成功才推进，未扣款留在本节点重试。"
 ywc_dmg.1017.local_share_countersign:0 "地方出份、取得联署"
 ywc_dmg.1017.local_share_countersign.cost_tooltip:0 "实扣一周估算年总收入（年总收入÷52），最低100；已付过预算份额则不重复扣款，未扣款不推进。"
 ywc_dmg.1017.local_share_countersign.consequence_tooltip:0 "可联署对象按两张地契的仲裁结果确定：混合仲裁认代表、统一契约须官署核验、旧权划界沿用旧官署名册；无地契结果时以在任官署为据。实扣成功才取得联署。"
 ywc_dmg.1017.limited_old_budget:0 "旧预算限额、任务缩小"
 ywc_dmg.1017.limited_old_budget.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1017.limited_old_budget.consequence_tooltip:0 "本节点不扣款，也不虚增收入；任务范围缩到旧预算能承担的部分，后续要求按缩小后的目标核对。"
 ywc_dmg.1017.defer:0 "等下月再议份饷"
 ywc_dmg.1017.defer.cost_tooltip:0 "无需新增付款。"
 ywc_dmg.1017.defer.consequence_tooltip:0 "份饷未定，本事件可在后续月份重新提出。"
 ywc_dmg.1017.withdraw_court:0 "停止诸邑线（依法撤回）"
 ywc_dmg.1017.withdraw_court.cost_tooltip:0 "无需新增付款；已付款不退。"
 ywc_dmg.1017.withdraw_court.consequence_tooltip:0 "以撤回结案；已付款与在任岗位保留。"
 ywc_dmg.1018.t:0 "任命书送到空官署"
