 ywc_dmg.1121.wait_cash.cost_tooltip:0 "本次不收费，已付费用保留。"
 ywc_dmg.1121.wait_cash.consequence_tooltip:0 "保留当前议题，待后续月度机会再议。"
 ywc_dmg.1121.withdraw:0 "终止本次学堂协议"
 ywc_dmg.1121.withdraw.cost_tooltip:0 "不追加费用；已付不退，早先土地与王廷账目保留。"
