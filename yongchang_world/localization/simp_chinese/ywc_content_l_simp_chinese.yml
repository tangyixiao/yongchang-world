 ywc_nqg.1.a:0 "重申天命。"
 ywc_nqg.1.b:0 "哀恸漂零。"
 ywc_nqg.2.t:0 "罗刹之请"
 ywc_nqg.2.d:0 "来自黑龙江口的俄国代理人许诺武器、粮食与商站——以旗帜与港湾话语权为价。"
 ywc_nqg.2.a:0 "执罗刹之手。"
 ywc_nqg.2.b:0 "不以外邦易节。"
 ywc_nqg.3.t:0 "一岛多旗"
 ywc_nqg.3.d:0 "吉里雅克与鄂罗克村寨、满洲旗营与汉人流民共居一岸，四法难容。头人们请求一部人人能读的公约。"
 ywc_nqg.3.a:0 "共立一约。"
 ywc_nqg.3.b:0 "各族依俗自守。"
 ywc_nqg.4.t:0 "自北光复"
 ywc_nqg.4.d:0 "强硬派提出光复方略：栅垒诸港、联结大陆部族，以库页为再造之基。"
 ywc_nqg.4.a:0 "举国赴之。"
 ywc_nqg.4.b:0 "方略落空。"
 ywc_nqg.4.c:0 "守岛而止。"
 ywc_nqg.5.t:0 "多族之邦"
