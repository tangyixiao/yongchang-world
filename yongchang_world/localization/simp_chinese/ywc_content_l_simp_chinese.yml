 ywc_shu.1.a:0 "授绅商之籍。"
 ywc_shu.1.b:0 "重申农本。"
 ywc_shu.2.t:0 "黑水边镇"
 ywc_shu.2.d:0 "东北边镇将领请示：是设镇固守黑水诸要地，还是开关与诸部互市。"
 ywc_shu.2.a:0 "设镇戍边。"
 ywc_shu.2.b:0 "弛边备、兴互市。"
 ywc_shu.3.t:0 "鸦片之问"
 ywc_shu.3.d:0 "烟馆沿海蔓延，朝廷在严禁与征税弛禁之间争执不下。"
 ywc_shu.3.a:0 "申严禁令。"
 ywc_shu.3.b:0 "征税弛禁。"
 ywc_shu.4.t:0 "士绅之问"
 ywc_shu.4.d:0 "改革派提议将士绅纳入改造后的官僚体系，而非专走科举旧途。"
 ywc_shu.4.a:0 "整合入仕。"
 ywc_shu.4.b:0 "旧党作梗。"
 ywc_shu.4.c:0 "从长计议。"
 ywc_shu.5.t:0 "海关之设"
 ywc_shu.5.d:0 "统一海关衙门可规范商政、在开放口岸征税。"
 ywc_shu.5.a:0 "设关改制。"
 ywc_shu.5.b:0 "旧关作梗。"
 ywc_shu.5.c:0 "暂缓设关。"
 ywc_shu.6.t:0 "永昌世纪"
 ywc_shu.6.d:0 "新朝初立而承旧帝国之重。永昌朝廷必须为本世纪定下基调：以文法与律令立国，还是沿旧日旗民与士绅的平衡而行。"
 ywc_shu.6.a:0 "以革新定基调。"
 ywc_shu.6.b:0 "沿旧局因循。"
 ywc_shu.6.c:0 "巩固改革成果。"
