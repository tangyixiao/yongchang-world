 ywc_kor.1.t:0 "从周与自立之辩"
 ywc_kor.1.d:0 "故明行朝已经倾覆，朝鲜士林仍在争论：当继续奉其正朔与朝贡之礼，还是自居一脉。"
 ywc_kor.1.a:0 "仍行旧朔。"
 ywc_kor.1.b:0 "任辩论成党争。"
 ywc_kor.2.t:0 "三司之革"
 ywc_kor.2.d:0 "改革派要求整饬边镇与三司，并归于一处可问责的议政府。"
 ywc_kor.2.a:0 "整顿三司。"
 ywc_kor.2.b:0 "党争搁置。"
 ywc_kor.3.t:0 "鸭绿之问"
 ywc_kor.3.d:0 "流民渡江垦殖于江北，边将要求封禁令要么动真格、要么明废。"
 ywc_kor.3.a:0 "定界安民。"
 ywc_kor.3.b:0 "封禁形同虚设。"
 ywc_kor.4.t:0 "南海之书"
 ywc_kor.4.d:0 "归国译官带回西洋仪器与南洋商册，司译院请求设厅译书。"
 ywc_kor.4.a:0 "设厅译书。"
 ywc_kor.4.b:0 "斥为奇技淫巧。"
 ywc_kor.5.t:0 "小中华之志"
 ywc_kor.5.d:0 "一派主张朝鲜当承文明礼乐之正统——东海之滨的小中华。"
 ywc_kor.5.a:0 "倡小中华。"
 ywc_kor.5.b:0 "清议分裂。"
 ywc_kor.5.c:0 "其议缓行。"
 ywc_kor.6.t:0 "建国之基"
 ywc_kor.6.d:0 "另一条路干脆走出事大旧序：以新法、新币与新军自立为国。"
 ywc_kor.6.a:0 "颁布新制。"
 ywc_kor.6.b:0 "旧制复辟。"
 ywc_kor.6.c:0 "徐徐图之。"
