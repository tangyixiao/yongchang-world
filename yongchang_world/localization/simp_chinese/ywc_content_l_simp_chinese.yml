 ywc_mng.1.t:0 "大漠南北"
 ywc_mng.1.d:0 "漠南诸部与大顺互市衣冠相效，漠北诸王仍与俄国使节互通馈问，汗庭必须权衡轻重。"
 ywc_mng.1.a:0 "以南为重。"
 ywc_mng.1.b:0 "以北为重。"
 ywc_mng.2.t:0 "茶马之市"
 ywc_mng.2.d:0 "边市开闭系于大顺边臣之手，诸部请求定一岁市定额。"
 ywc_mng.2.a:0 "定约岁市。"
 ywc_mng.2.b:0 "任市道中衰。"
 ywc_mng.3.t:0 "庇护者之影"
 ywc_mng.3.d:0 "俄国边臣邀诸部会盟于恰克图，许以庇护而索贸易之权。"
 ywc_mng.3.a:0 "虚与委蛇。"
 ywc_mng.3.b:0 "逐其使者。"
 ywc_mng.4.t:0 "泛蒙之会"
 ywc_mng.4.d:0 "有倡议召开泛蒙大会，为草原诸务共推一名发言人。"
 ywc_mng.4.a:0 "与会共商。"
 ywc_mng.4.b:0 "拒不与盟。"
 ywc_mng.5.t:0 "南向商路"
 ywc_mng.5.d:0 "南扩商路可获毛皮之利——也加深对大顺边市的依赖。"
 ywc_mng.5.a:0 "扩市南向。"
 ywc_mng.5.b:0 "商路受阻。"
 ywc_mng.5.c:0 "守成足矣。"
 ywc_mng.6.t:0 "帝俄之翼"
 ywc_mng.6.d:0 "与俄国正式订立保护条约可为北疆诸部置械——也须听命于远方之廷。"
 ywc_mng.6.a:0 "受庇于俄。"
 ywc_mng.6.b:0 "盟约生变。"
 ywc_mng.6.c:0 "且观其变。"
