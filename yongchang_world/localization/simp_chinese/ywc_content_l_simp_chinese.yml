 ywc_tib.1.t:0 "无主高地"
 ywc_tib.1.d:0 "达赖的法座、郡王的堡寨与故清朝廷的余影都在争夺高原，拉萨必须决定权威归于何处。"
 ywc_tib.1.a:0 "定继承之序。"
 ywc_tib.1.b:0 "任诸说相持不下。"
 ywc_tib.2.t:0 "寺院庄园"
 ywc_tib.2.d:0 "寺院庄园占有最肥的土地与服劳役的农奴，清丈官员请求丈量造册。"
 ywc_tib.2.a:0 "清丈庄园。"
 ywc_tib.2.b:0 "不动旧契。"
 ywc_tib.3.t:0 "康区之问"
 ywc_tib.3.d:0 "康区土司提议高原与边地之间缔结互助盟誓。"
 ywc_tib.3.a:0 "缔康区之盟。"
 ywc_tib.3.b:0 "坐视仇杀不休。"
 ywc_tib.4.t:0 "商队之门"
 ywc_tib.4.d:0 "茶商与驮队请求开设固定关市、定额税课，并保高原商路平安。"
 ywc_tib.4.a:0 "开放商队之门。"
 ywc_tib.4.b:0 "闭山自守。"
 ywc_tib.5.t:0 "庄园之革"
 ywc_tib.5.d:0 "将寺院庄园改为俸给供养可解放劳役——也会惊动高原上每一位堪布。"
 ywc_tib.5.a:0 "推行俸给之制。"
 ywc_tib.5.b:0 "僧界哗然。"
 ywc_tib.5.c:0 "暂缓其议。"
 ywc_tib.6.t:0 "康区同盟"
 ywc_tib.6.d:0 "与康区土司缔结长期同盟，可不动一兵而系边地于拉萨。"
 ywc_tib.6.a:0 "缔结同盟。"
 ywc_tib.6.b:0 "同盟破裂。"
 ywc_tib.6.c:0 "使节久候。"
