 ywc_oir.1.t:0 "准噶尔遗业"
 ywc_oir.1.d:0 "汗国倾覆已近半世纪，长老们仍在争论卫拉特该承下什么：兵马、法度，还是只有国殇。"
 ywc_oir.1.a:0 "革政自强。"
 ywc_oir.1.b:0 "沉溺旧汗国之梦。"
 ywc_oir.2.t:0 "隘口外的哥萨克"
 ywc_oir.2.d:0 "俄国哨所一步步逼近伊犁诸隘口，要求通商特权与放牧之权。"
 ywc_oir.2.a:0 "以互市缓其锋。"
 ywc_oir.2.b:0 "闭关绝市。"
 ywc_oir.3.t:0 "伊犁商路"
 ywc_oir.3.d:0 "回疆商队与俄国商贾争夺伊犁集市的税源。"
 ywc_oir.3.a:0 "官定税则。"
 ywc_oir.3.b:0 "纵商相争。"
 ywc_oir.4.t:0 "虚位之鞍"
 ywc_oir.4.d:0 "老汗病重，诸部各怀属意人选。"
 ywc_oir.4.a:0 "推举共主。"
 ywc_oir.4.b:0 "任诸部分裂。"
 ywc_oir.5.t:0 "文法之汗国"
 ywc_oir.5.d:0 "改革派主张仿大顺与俄国，以成文法度与设官治民取代马力之治。"
