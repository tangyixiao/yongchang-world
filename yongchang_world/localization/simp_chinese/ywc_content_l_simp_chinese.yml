 ywc_je_who_inherits_china:0 "谁承中华？"
 ywc_je_who_inherits_china_reason:0 "十种政治传统争夺礼仪正统、海洋秩序与地方多元，但不会因此自动获得领土。"
 ywc_shared.1.t:0 "谁承中华？"
 ywc_shared.1.d:0 "新的世纪要求各方回答：正统将由礼仪、海洋，还是地方多元来承载？"
 ywc_shared.1.a:0 "选择礼仪正统。"
 ywc_shared.1.b:0 "选择海洋秩序。"
 ywc_shared.1.c:0 "选择地方多元。"
 ywc_shared.2.t:0 "海洋边疆"
 ywc_shared.2.d:0 "新的船只、新的港湾与码头上陌生面孔，都在追问同一件事：这些国家要不要望向海洋。"
 ywc_shared.2.a:0 "望向海洋。"
 ywc_shared.2.b:0 "固守内陆。"
 ywc_je_yongchang_century:0 "永昌世纪"
 ywc_je_yongchang_century_reason:0 "永昌朝廷要在文法、旗籍与士绅之间，为新世纪建立一套能征税也能守边的秩序。"
 ywc_je_shu_scholar_merchants:0 "大顺士商"
 ywc_je_shu_scholar_merchants_reason:0 "士绅与海商要求进入国家秩序，大顺必须决定市场财富是否能换来政治资格。"
 ywc_je_shu_blackwater_frontier:0 "黑水边疆"
 ywc_je_shu_blackwater_frontier_reason:0 "黑水边疆同时需要军屯、商路和本地盟约，任何一种安排都会改变朝廷的控制成本。"
 ywc_je_shu_opium_question:0 "鸦片之问"
 ywc_je_shu_opium_question_reason:0 "沿海禁烟既是财政问题也是主权问题，大顺要在税收、走私和外来压力间取舍。"
 ywc_route_shu_bureaucratic_integration:0 "官僚整合"
 ywc_route_shu_bureaucratic_integration_reason:0 "把士绅纳入官僚体系能提高行政力，却会触动旧有地方中介和军功集团。"
 ywc_route_shu_customs_reform:0 "海关革新"
 ywc_route_shu_customs_reform_reason:0 "统一海关能把港口商政变成朝廷收入，也会让旧关卡和地方商帮失去议价权。"
 ywc_shu.1.t:0 "绅与账册之间"
 ywc_shu.1.d:0 "江南绅商联名请求在官僚与市场之间获得正式的位置。"
 ywc_shu.1.a:0 "授绅商之籍。"
 ywc_shu.1.b:0 "重申农本。"
 ywc_shu.2.t:0 "黑水边镇"
 ywc_shu.2.d:0 "东北边镇将领请示：是设镇固守黑水诸要地，还是开关与诸部互市。"
 ywc_shu.2.a:0 "设镇戍边。"
 ywc_shu.2.b:0 "弛边备、兴互市。"
 ywc_shu.3.t:0 "鸦片之问"
 ywc_shu.3.d:0 "烟馆沿海蔓延，朝廷在严禁与征税弛禁之间争执不下。"
 ywc_shu.3.a:0 "申严禁令。"
 ywc_shu.3.b:0 "征税弛禁。"
 ywc_shu.4.t:0 "士绅之问"
 ywc_shu.4.d:0 "改革派提议将士绅纳入改造后的官僚体系，而非专走科举旧途。"
 ywc_shu.4.a:0 "整合入仕。"
 ywc_shu.4.b:0 "旧党作梗。"
 ywc_shu.4.c:0 "从长计议。"
 ywc_shu.5.t:0 "海关之设"
 ywc_shu.5.d:0 "统一海关衙门可规范商政、在开放口岸征税。"
 ywc_shu.5.a:0 "设关改制。"
 ywc_shu.5.b:0 "旧关作梗。"
 ywc_shu.5.c:0 "暂缓设关。"
 ywc_shu.6.t:0 "永昌世纪"
 ywc_shu.6.d:0 "新朝初立而承旧帝国之重。永昌朝廷必须为本世纪定下基调：以文法与律令立国，还是沿旧日旗民与士绅的平衡而行。"
 ywc_shu.6.a:0 "以革新定基调。"
 ywc_shu.6.b:0 "沿旧局因循。"
 ywc_shu.6.c:0 "巩固改革成果。"
 ywc_je_jinghai_maritime_network:0 "靖海海上网络"
 ywc_je_jinghai_maritime_network_reason:0 "靖海的班期、泊位和护航网络决定它是藩屏还是南洋商港。"
 ywc_je_jinghai_succession:0 "靖海继承之议"
 ywc_je_jinghai_succession_reason:0 "郑氏王府的继承不仅关乎印信，也关乎舰队、商行和大顺对藩国的信任。"
 ywc_je_jinghai_council:0 "靖海议事会"
 ywc_je_jinghai_council_reason:0 "南洋议事会要把港税、仲裁与仓储放进同一套规则，王府必须决定让出多少裁量权。"
 ywc_route_jhg_naval_tributary_state:0 "海上朝贡之国"
 ywc_route_jhg_naval_tributary_state_reason:0 "以水师履行藩屏义务能换来海权，却会同时增加船坞开支、债务和大顺猜忌。"
 ywc_route_jhg_south_sea_council:0 "南洋议事会"
 ywc_route_jhg_south_sea_council_reason:0 "南洋商议会能共享航路与仲裁，但共同规则也会限制靖海单独征税和用兵。"
 ywc_jhg.1.t:0 "护航一令"
 ywc_jhg.1.d:0 "各行商请求自福州至长崎统一护航班期与泊位规约。"
 ywc_jhg.1.a:0 "统一护贩。"
 ywc_jhg.1.b:0 "各行其是。"
 ywc_jhg.2.t:0 "继承之诏"
 ywc_jhg.2.d:0 "老亲王病笃，印信尚未许给任何一位继承人。"
 ywc_jhg.2.a:0 "立嫡定序。"
 ywc_jhg.2.b:0 "阋墙之争。"
 ywc_jhg.3.t:0 "行商议事会"
 ywc_jhg.3.d:0 "各大商行请求设常设议事会，共议港税与引水事务。"
 ywc_jhg.3.a:0 "开议事会。"
 ywc_jhg.3.b:0 "议会虚设。"
 ywc_jhg.4.t:0 "藩屏水师"
 ywc_jhg.4.d:0 "扩建水师可抬高靖海地位——也必然加重大顺的猜忌与船坞开支。"
 ywc_jhg.4.a:0 "大建水师。"
 ywc_jhg.4.b:0 "大顺施压。"
 ywc_jhg.4.c:0 "暂缓扩建。"
 ywc_jhg.5.t:0 "南洋商会"
 ywc_jhg.5.d:0 "南洋诸港商团提议共设商会，共享航路、仲裁与仓储。"
 ywc_jhg.5.a:0 "缔盟设会。"
 ywc_jhg.5.b:0 "商团分裂。"
 ywc_jhg.5.c:0 "从长计议。"
 ywc_je_dongming_who_inherits_china:0 "谁承中华？（东明）"
 ywc_je_dongming_who_inherits_china_reason:0 "东明要在永历法统、吕宋本地社群和西班牙炮台之间证明自己为何存在。"
 ywc_je_dongming_spanish_frontier:0 "西班牙边患"
 ywc_je_dongming_spanish_frontier_reason:0 "维持北吕宋边界需要堡垒、停战和军费，东明不能同时把每一笔钱投向城市与战线。"
 ywc_je_dongming_local_compact:0 "本地契约"
 ywc_je_dongming_local_compact_reason:0 "华人移民与伊洛卡诺、本地士绅的权利若无成文契约，东明的王冠就没有社会根基。"
 ywc_route_dmg_huafei_monarchy:0 "华菲王朝"
 ywc_route_dmg_huafei_monarchy_reason:0 "华菲王权可以集中防务和行政，但必须让群岛社群接受一枚跨文化的王印。"
 ywc_route_dmg_local_republic:0 "本地共和"
 ywc_route_dmg_local_republic_reason:0 "地方共和把税赋和防务交给民会，代价是王府的正统性和快速决策能力变弱。"
 ywc_dmg.1.t:0 "南明法统"
 ywc_dmg.1.d:0 "涧内流亡士人仍在争论：东明当奉永历法统，还是自外于倾覆的王朝。"
 ywc_dmg.1.a:0 "奉明正朔。"
 ywc_dmg.1.b:0 "任由争执发酵。"
 ywc_dmg.2.t:0 "河对岸的火枪"
 ywc_dmg.2.d:0 "西班牙卫戍军在东明城墙对面操练。使者提议筑垒议和，少壮派则主张先发袭扰。"
 ywc_dmg.2.a:0 "筑垒议和。"
 ywc_dmg.2.b:0 "先发制人。"
 ywc_dmg.3.t:0 "涧内之约"
 ywc_dmg.3.d:0 "华人与本地士绅联名请愿，要求以成文契约规范彼此的权利义务，而非临时裁决。"
 ywc_dmg.3.a:0 "缔结契约。"
 ywc_dmg.3.b:0 "沿用旧制。"
 ywc_dmg.4.t:0 "群岛之冠"
 ywc_dmg.4.d:0 "议事会提案拥立华菲君主，以王冠束缚群岛豪族——这是跨海称王的冒险一步。"
 ywc_dmg.4.a:0 "受冕称王。"
 ywc_dmg.4.b:0 "任其流产。"
 ywc_dmg.4.c:0 "搁置议题。"
 ywc_dmg.5.t:0 "市政厅中的声音"
 ywc_dmg.5.d:0 "商贾耆老请求比照西式市政设立民选议会，共治城务。"
 ywc_dmg.5.a:0 "召开民会。"
 ywc_dmg.5.b:0 "拒绝革新。"
 ywc_dmg.5.c:0 "暂缓试行。"
 ywc_je_northern_qing_exile:0 "北清流亡"
 ywc_je_northern_qing_exile_reason:0 "北清的流亡朝廷带着旧旗来到库页岛，却必须先取得渔村、部族和港口的承认。"
 ywc_je_northern_qing_russian_choice:0 "亲俄之择"
 ywc_je_northern_qing_russian_choice_reason:0 "俄国能提供粮械和贸易据点，也会要求北清把港口和外交承诺交出一部分。"
 ywc_je_northern_qing_island_society:0 "岛屿社会"
 ywc_je_northern_qing_island_society_reason:0 "库页岛的未来取决于满洲流亡者、北方部族和岛民能否共享粮仓、渔场与法律。"
 ywc_route_nqg_sakhalin_restoration:0 "库页光复"
 ywc_route_nqg_sakhalin_restoration_reason:0 "复国远征能提高旧王朝声望，却会把北清有限的人口、船只和粮秣押上黑水之外。"
 ywc_route_nqg_multicultural_island:0 "诸族之岛"
 ywc_route_nqg_multicultural_island_reason:0 "多族岛屿国家不追逐旧疆，而是用港口、储备和共同法换取小国的长期生存。"
 ywc_nqg.1.t:0 "无都之廷"
 ywc_nqg.1.d:0 "抵达库页的旗营人数远超接收他们的渔村，朝廷必须决定自己还以什么自居。"
 ywc_nqg.1.a:0 "重申天命。"
 ywc_nqg.1.b:0 "哀恸漂零。"
 ywc_nqg.2.t:0 "罗刹之请"
 ywc_nqg.2.d:0 "来自黑龙江口的俄国代理人许诺武器、粮食与商站——以旗帜与港湾话语权为价。"
 ywc_nqg.2.a:0 "执罗刹之手。"
 ywc_nqg.2.b:0 "不以外邦易节。"
 ywc_nqg.3.t:0 "一岛多旗"
 ywc_nqg.3.d:0 "吉里雅克与鄂罗克村寨、满洲旗营与汉人流民共居一岸，四法难容。头人们请求一部人人能读的公约。"
 ywc_nqg.3.a:0 "共立一约。"
 ywc_nqg.3.b:0 "各族依俗自守。"
 ywc_nqg.4.t:0 "自北光复"
 ywc_nqg.4.d:0 "强硬派提出光复方略：栅垒诸港、联结大陆部族，以库页为再造之基。"
 ywc_nqg.4.a:0 "举国赴之。"
 ywc_nqg.4.b:0 "方略落空。"
 ywc_nqg.4.c:0 "守岛而止。"
 ywc_nqg.5.t:0 "多族之邦"
 ywc_nqg.5.d:0 "另一条路不再言光复：原住部族、旗营与流民共分港湾、渔汛与法度，缔约立邦。"
 ywc_nqg.5.a:0 "缔约立邦。"
 ywc_nqg.5.b:0 "旧忠取胜。"
 ywc_nqg.5.c:0 "从长计议。"
 ywc_je_oir_dzungar_legacy:0 "准噶尔遗业"
 ywc_je_oir_dzungar_legacy_reason:0 "卫拉特继承的不是一块空白草原，而是准噶尔军法、伊犁商路和未解的旗盟裂痕。"
 ywc_je_oir_russian_pressure:0 "俄国之压"
 ywc_je_oir_russian_pressure_reason:0 "俄国哨所要求通行权和牧地，卫拉特必须用贸易、闭关或军备回答北方压力。"
 ywc_je_oir_ili_trade:0 "伊犁贸易"
 ywc_je_oir_ili_trade_reason:0 "伊犁商路连接塔里木与俄国，税契如何分配会决定商人支持汗国还是绕开汗国。"
 ywc_je_oir_succession:0 "卫拉特继承"
 ywc_je_oir_succession_reason:0 "可汗继承人各有旗帜和牧地，继承危机将迫使卫拉特选择成文法或旗盟协商。"
 ywc_route_oir_bureaucratic_khanate:0 "官僚化汗国"
 ywc_route_oir_bureaucratic_khanate_reason:0 "官僚汗国以成文法和任命官署稳住伊犁，但需要压缩诺颜对牧地和军役的裁量。"
 ywc_route_oir_pastoral_federation:0 "牧业联邦"
 ywc_route_oir_pastoral_federation_reason:0 "牧地联邦让诸旗共同防务、共享牲畜，却牺牲了中央快速征税和发号施令的能力。"
 ywc_oir.1.t:0 "准噶尔遗业"
 ywc_oir.1.d:0 "汗国倾覆已近半世纪，长老们仍在争论卫拉特该承下什么：兵马、法度，还是只有国殇。"
 ywc_oir.1.a:0 "革政自强。"
 ywc_oir.1.b:0 "沉溺旧汗国之梦。"
 ywc_oir.2.t:0 "隘口外的哥萨克"
 ywc_oir.2.d:0 "俄国哨所一步步逼近伊犁诸隘口，要求通商特权与放牧之权。"
 ywc_oir.2.a:0 "以互市缓其锋。"
 ywc_oir.2.b:0 "闭关绝市。"
 ywc_oir.3.t:0 "伊犁商路"
 ywc_oir.3.d:0 "回疆商队与俄国商贾争夺伊犁集市的税源。"
 ywc_oir.3.a:0 "官定税则。"
 ywc_oir.3.b:0 "纵商相争。"
 ywc_oir.4.t:0 "虚位之鞍"
 ywc_oir.4.d:0 "老汗病重，诸部各怀属意人选。"
 ywc_oir.4.a:0 "推举共主。"
 ywc_oir.4.b:0 "任诸部分裂。"
 ywc_oir.5.t:0 "文法之汗国"
 ywc_oir.5.d:0 "改革派主张仿大顺与俄国，以成文法度与设官治民取代马力之治。"
 ywc_oir.5.a:0 "行文法。"
 ywc_oir.5.b:0 "诺颜们抵制。"
 ywc_oir.5.c:0 "缓行新法。"
 ywc_oir.6.t:0 "牧地之盟"
 ywc_oir.6.d:0 "诸部提议缔结牧地之盟：共牧、共防，而无一汗凌驾其上。"
 ywc_oir.6.a:0 "缔结盟约。"
 ywc_oir.6.b:0 "盟约破裂。"
 ywc_oir.6.c:0 "搁置盟议。"
 ywc_je_mongol_south_north:0 "漠南漠北"
 ywc_je_mongol_south_north_reason:0 "喀尔喀夹在大顺茶马边市与俄国北路之间，每一封盟约都会改变汗国的余地。"
 ywc_je_mng_shun_trade:0 "与顺互市"
 ywc_je_mng_shun_trade_reason:0 "固定茶马额能给诸旗带来稳定市场，却也让喀尔喀更依赖大顺边官。"
 ywc_je_mng_russian_protection:0 "俄国庇护"
 ywc_je_mng_russian_protection_reason:0 "俄国保护可以补足北方军械，但保护条款会把喀尔喀的外交选择锁在北路。"
 ywc_je_mng_pan_mongol_council:0 "泛蒙议事会"
