 ywc_nmg.1.a:0 "建边疆城镇。"
 ywc_nmg.1.b:0 "止步海湾。"
 ywc_nmg.2.t:0 "花茂教群"
 ywc_nmg.2.d:0 "在教会受洗的花茂族人联名请愿：建一座自己的圣堂，派一位说乡音的神父。"
 ywc_nmg.2.a:0 "允建圣堂。"
 ywc_nmg.2.b:0 "禁设教区。"
 ywc_nmg.3.t:0 "一国两都"
 ywc_nmg.3.d:0 "墨西哥城的联邦派愿意给新明在各州联合中留席位——条件是半岛接受联邦法。"
 ywc_nmg.3.a:0 "加入联邦之约。"
 ywc_nmg.3.b:0 "联邦之约受挫。"
 ywc_nmg.4.t:0 "自治教会"
 ywc_nmg.4.d:0 "设立自己的教区，新明的教士便归新明主教节制，而非远方的教廷。"
 ywc_nmg.4.a:0 "设自治教区。"
 ywc_nmg.4.b:0 "教廷驳回。"
