 ywc_lan.1.a:0 "宣读并重申章程。"
 ywc_lan.1.b:0 "任章程虚悬。"
 ywc_lan.2.t:0 "股东之议"
 ywc_lan.2.d:0 "矿工股东要求在秋收前公开本年账目、发放应得红利。"
 ywc_lan.2.a:0 "开账分红。"
 ywc_lan.2.b:0 "账目讳匿。"
 ywc_lan.3.t:0 "矿工边疆"
 ywc_lan.3.d:0 "新矿坑步步逼近土著村落与长屋林野，头人们请求在雨季前划定地界。"
 ywc_lan.3.a:0 "划定矿界。"
 ywc_lan.3.b:0 "纵队抢掘。"
 ywc_lan.4.t:0 "荷兰最后通牒"
 ywc_lan.4.d:0 "东印度公司要求兰芳接受其宗主权，并在港口悬挂其旗帜。"
 ywc_lan.4.a:0 "婉拒周旋。"
 ywc_lan.4.b:0 "屈从签约。"
 ywc_lan.5.t:0 "矿工之共和"
 ywc_lan.5.d:0 "改革派提议成文共和：总制民选、任期限定，设矿坑与仓行共组之议会。"
 ywc_lan.5.a:0 "颁共和章程。"
 ywc_lan.5.b:0 "总制集权。"
 ywc_lan.5.c:0 "起草待议。"
 ywc_lan.6.t:0 "矿业立国"
