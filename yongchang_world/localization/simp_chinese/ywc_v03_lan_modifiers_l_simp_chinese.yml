l_simp_chinese:
 ywc_lan_guard_backlash:0 "私卫执行的反噬"
 ywc_lan_relief_gap:0 "救济缺口"
 ywc_lan_relief_gap_desc:0 "私人救济覆盖窄，未获赔付者的生活预期与不满由地方自行消化。"
 ywc_lan_guard_backlash_desc:0 "以私卫代行公权，合法性受损，政治运动更易产生激进派；外交协调受挤压，反噬期间影响力产出降低10%。"
 ywc_lan_gold_processing_settled:0 "加工多元化落地"
 ywc_lan_gold_processing_settled_desc:0 "矿利的一部分转入加工，雇工与日用品供给更稳；行政略增，合法性略损，工商与小市民更满意。"
 ywc_lan_gold_farming_settled:0 "农业补给落地"
 ywc_lan_gold_farming_settled_desc:0 "稻田稳住基本口粮，下层生活预期改善、激进派略减；农民满意，地主不满，合法性略增。"
 ywc_lan_gold_monopoly_settled:0 "矿业专营落地"
 ywc_lan_gold_monopoly_settled_desc:0 "矿场与官署合力抽取可税公款，行政与工商更强；合法性受损，乡村不满，激进派略增。"
 ywc_lan_gold_compromise_hold:0 "有限公账维持"
 ywc_lan_gold_compromise_hold_desc:0 "只维持现有账册与缺口，未获完整成果；合法性略损，下层生活预期略增。"
 ywc_lan_gold_processing_country:0 "加工公账"
 ywc_lan_gold_processing_country_desc:0 "加工安排改变行政负担以及工商团体的支持。"
 ywc_lan_gold_processing_state:0 "地方加工扶持"
 ywc_lan_gold_processing_state_desc:0 "试点州的加工安排改善下层生活水平。"
 ywc_lan_gold_farming_country:0 "农业供给公账"
 ywc_lan_gold_farming_country_desc:0 "供给安排改变合法性以及乡村利益与地主的支持。"
 ywc_lan_gold_farming_state:0 "地方粮食供给"
 ywc_lan_gold_farming_state_desc:0 "试点州的供给安排改善下层生活水平，并缓解政治运动产生的激进化。"
 ywc_lan_gold_monopoly_country:0 "矿业专营公账"
 ywc_lan_gold_monopoly_country_desc:0 "专营加强行政与工商支持，同时损及合法性与乡村支持。"
 ywc_lan_gold_monopoly_state:0 "地方专营摩擦"
 ywc_lan_gold_monopoly_state_desc:0 "试点州的专营增加政治运动产生的激进化。"
 ywc_lan_gold_compromise_country:0 "有限公共账册"
 ywc_lan_gold_compromise_country_desc:0 "有限安排略微损及合法性。"
 ywc_lan_gold_compromise_state:0 "地方预期缺口"
 ywc_lan_gold_compromise_state_desc:0 "有限安排使试点州下层的生活预期提高。"
