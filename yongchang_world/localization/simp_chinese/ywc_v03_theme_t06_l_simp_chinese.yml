l_simp_chinese:
 ywc_je_v03_t06_one_textbook_many_readers:0 "一份教材的多种读者"
 ywc_je_v03_t06_one_textbook_many_readers_reason:0 "甘丹颇章的印经坊有可借的版片与译例；大顺须先核对本地识字、官署与学校机构，再决定是否借版、译写并自编下一册。"
 ywc_society.1250.t:0 "谁来读第一册"
 ywc_society.1250.d:0 "大顺要为学塾印第一册课本。识字不足的百姓与官署的空缺已经核对在册；是否向甘丹颇章借版，须按学校机构与语言安排自行定夺。"
 ywc_society.1250.borrow:0 "向甘丹颇章请求借版"
 ywc_society.1250.borrow.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1250.borrow.consequence_tooltip:0 "借版请求立档；甘丹颇章将决定借出整版、只借拓片还是拒绝。"
 ywc_society.1250.selfprint:0 "自刻印版，不假外借"
 ywc_society.1250.selfprint.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1250.selfprint.consequence_tooltip:0 "课本以本地刻版收束；借版记录以拒绝结案。"
 ywc_society.1250.wait:0 "暂缓，重新核对"
 ywc_society.1250.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1250.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1251.t:0 "借来的印版"
 ywc_society.1251.d:0 "大顺的借版请求送到甘丹颇章。印经坊可以整版借出，可以只交拓片留版在寺，也可以拒绝外来印务；寺内僧侣与官员对此各有立场。"
 ywc_society.1251.lend:0 "整版借出，立借版记录"
 ywc_society.1251.lend.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1251.lend.consequence_tooltip:0 "版片借出立档；寺内印经僧侣增加拥戴；大顺将自行核对名册。"
 ywc_society.1251.rubbings:0 "只交拓片，版片留寺"
 ywc_society.1251.rubbings.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1251.rubbings.consequence_tooltip:0 "拓片交付立档；掌管版片的官员增加拥戴；大顺只能按拓片重刻。"
 ywc_society.1251.refuse:0 "拒绝外来印务"
 ywc_society.1251.refuse.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1251.refuse.consequence_tooltip:0 "借版记录以拒绝收束；大顺的课本须自筹版源。"
