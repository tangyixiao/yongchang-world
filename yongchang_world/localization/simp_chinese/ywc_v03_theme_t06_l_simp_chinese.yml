 ywc_society.1254.d:0 "用过印本的第一班已经毕业。官署有空缺可以任用，学塾缺教习也可以留校；任用安排决定这册课本是行政工具还是架上旧物。"
 ywc_society.1254.office:0 "任用毕业生填补官署空缺"
 ywc_society.1254.office.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1254.office.consequence_tooltip:0 "任用记录立档；印本流入市集后，甘丹颇章将对禁令自行定夺。"
 ywc_society.1254.school:0 "留毕业生在学塾任教"
 ywc_society.1254.school.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1254.school.consequence_tooltip:0 "留任记录立档；印本流入市集后，甘丹颇章将对禁令自行定夺。"
 ywc_society.1254.stop:0 "不加任用，课本归档"
