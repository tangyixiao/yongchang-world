 ywc_society.1255.t:0 "禁书令跨过边界"
 ywc_society.1255.d:0 "大顺的印本流入甘丹颇章的市集，寺中议定禁书。禁令是通行全境还是只及边界查验，由甘丹颇章自行定夺；大顺的下一册将面对这条禁令。"
 ywc_society.1255.enforce:0 "禁令通行全境"
 ywc_society.1255.enforce.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1255.enforce.consequence_tooltip:0 "全境禁令立档；市集商户增加激愤；大顺将决定是否自编下一册。"
 ywc_society.1255.border:0 "禁令只及边界查验"
 ywc_society.1255.border.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1255.border.consequence_tooltip:0 "边界禁令立档；主张全禁的僧侣增加激愤；大顺将决定是否自编下一册。"
 ywc_society.1255.wait:0 "暂缓定夺"
 ywc_society.1255.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1255.wait.consequence_tooltip:0 "记录本次决定。"
