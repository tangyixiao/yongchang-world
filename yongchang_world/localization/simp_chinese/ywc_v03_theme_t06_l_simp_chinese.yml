 ywc_society.1251.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1251.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1252.t:0 "学校门前的名册"
 ywc_society.1252.d:0 "版片或拓片已经到位。名册上哪些班次先用印本、印多少册，按学校机构与学塾容量决定；全量印制要真金支出，已付的印费不会在复议时再收一次。"
 ywc_society.1252.print:0 "支付 500，全量印行"
 ywc_society.1252.print.cost_tooltip:0 "大顺国库支付 500。"
