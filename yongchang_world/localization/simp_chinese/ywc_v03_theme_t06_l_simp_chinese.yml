 ywc_society.1256.d:0 "无论禁令如何写，大顺都要决定是否自编下一册：付账雇人编纂立新账，还是沿用借版旧例。对方已不可联系时，大顺可按已有记录自行结案；已支付的费用不退。"
 ywc_society.1256.compile:0 "支付 1000，自编下一册"
 ywc_society.1256.compile.cost_tooltip:0 "大顺国库支付 1000。"
 ywc_society.1256.compile.consequence_tooltip:0 "自编记录立档；余波报告将送回甘丹颇章。"
 ywc_society.1256.reuse:0 "沿用已付编纂记录"
 ywc_society.1256.reuse.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1256.reuse.consequence_tooltip:0 "自编记录立档；余波报告将送回甘丹颇章。"
 ywc_society.1256.reconsider:0 "重新审阅译写安排"
 ywc_society.1256.reconsider.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1256.reconsider.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1256.alone:0 "对方已不可联系，大顺自行结案"
 ywc_society.1256.alone.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1256.alone.consequence_tooltip:0 "按已有记录结案；已支付的费用不退。"
