 ywc_society.1257.t:0 "新一代怎样记账"
 ywc_society.1257.d:0 "大顺自编的下一册已经印行，新一代用它记算学与政务。甘丹颇章可以认可这册本地课本并留下往来记录，也可以留档异议；无论哪一种，两边各自保留自己的印坊与学塾。"
 ywc_society.1257.welcome:0 "认可本地课本，留档往来"
 ywc_society.1257.welcome.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1257.welcome.consequence_tooltip:0 "甘丹颇章对大顺关系增加 5；印经僧侣增加拥戴。"
 ywc_society.1257.reserve:0 "留档异议并记录差异"
 ywc_society.1257.reserve.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1257.reserve.consequence_tooltip:0 "甘丹颇章对大顺关系减少 5；寺中僧侣增加激愤。"
 ywc_society.1257.wait:0 "暂缓答复"
 ywc_society.1257.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1257.wait.consequence_tooltip:0 "记录本次决定。"
