 ywc_society.1154.settle_deliver.consequence_tooltip:0 "工价补足留档；澜沧将迎来检查员。"
 ywc_society.1154.ship_as_is:0 "照常交货，不补工价"
 ywc_society.1154.ship_as_is.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1154.ship_as_is.consequence_tooltip:0 "交货记录留档；澜沧将迎来检查员。"
