l_simp_chinese:
 ywc_je_v03_t04_order_wage_dispute:0 "同一订单的不同工价"
 ywc_je_v03_t04_order_wage_dispute_reason:0 "澜沧的矿场与作坊接下一份可核验的外销订单，本地工价、雇工与现行法律互相矛盾；靖海的买方在另一端等待交期与工价的答复。"
 ywc_society.1150.t:0 "订单压到工棚"
 ywc_society.1150.d:0 "靖海订单附着自己的交期与验货章程。矿场和作坊要么摊派加产赶工，要么按现有工力分批接下；工价与雇工现状须先由澜沧自行核对。"
 ywc_society.1150.accept_scale:0 "接单摊派加产，按期赶工"
 ywc_society.1150.accept_scale.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1150.accept_scale.consequence_tooltip:0 "记录本次决定，交期交由买方提出。"
 ywc_society.1150.accept_phased:0 "接单但按现有工力分批"
 ywc_society.1150.accept_phased.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1150.accept_phased.consequence_tooltip:0 "记录本次决定，交期交由买方提出。"
 ywc_society.1150.local_only:0 "撤下外港订单，只做本地现货"
 ywc_society.1150.local_only.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1150.local_only.consequence_tooltip:0 "订单撤下，本条线以拒绝结局收束。"
 ywc_society.1150.wait:0 "暂缓，重新核对工价与雇工"
 ywc_society.1150.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1150.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1151.t:0 "买方要求的期限"
 ywc_society.1151.d:0 "靖海账房按订单规模提出交期：限期加验，或宽限并预付定金。订单也可以就此撤回。已付的定金不会在复议时再收一次。"
 ywc_society.1151.strict:0 "限期加验，逾期罚减"
 ywc_society.1151.strict.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1151.strict.consequence_tooltip:0 "交期与验货章程留档；澜沧将面对工价争议。"
 ywc_society.1151.relax_advance:0 "宽限交期并支付 500 定金"
 ywc_society.1151.relax_advance.cost_tooltip:0 "靖海国库支付 500。"
 ywc_society.1151.relax_advance.consequence_tooltip:0 "定金留档，不向澜沧转款；澜沧将面对工价争议。"
 ywc_society.1151.withdraw:0 "撤回订单，另作他议"
 ywc_society.1151.withdraw.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1151.withdraw.consequence_tooltip:0 "订单撤回，澜沧以拒绝结局结案。"
 ywc_society.1151.wait:0 "暂缓答复"
 ywc_society.1151.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1151.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1152.t:0 "同业第一次联名"
 ywc_society.1152.d:0 "矿场与作坊的雇工第一次联名呈递工价争议。结社权利越弱，联名越容易散去，也有人提议改行地方供役顶替外港订单。"
 ywc_society.1152.hear:0 "听禀并许诺核对工价"
 ywc_society.1152.hear.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1152.hear.consequence_tooltip:0 "联名记录留档；买方将听到外港工价的传闻。"
