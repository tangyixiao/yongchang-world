 ywc_society.1153.d:0 "外港行情传到靖海：别处矿场与作坊给出的工价更高。买方要么承认工价加价采购，要么压价照旧，也可以另派估价人实地核定。"
 ywc_society.1153.match_pay:0 "支付 1000，承认外港工价"
 ywc_society.1153.match_pay.cost_tooltip:0 "靖海国库支付 1000。"
 ywc_society.1153.match_pay.consequence_tooltip:0 "工价记录留档；澜沧迎来交货日。"
 ywc_society.1153.hold_price:0 "压价照旧，按原单执行"
 ywc_society.1153.hold_price.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1153.hold_price.consequence_tooltip:0 "工价记录留档；澜沧迎来交货日。"
 ywc_society.1153.assess:0 "另派估价人实地核定"
