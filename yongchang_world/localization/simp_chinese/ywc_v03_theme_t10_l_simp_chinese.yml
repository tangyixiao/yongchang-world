l_simp_chinese:
 ywc_je_v03_t10_trade_jurisdiction:0 "一份通商照会的边界"
 ywc_je_v03_t10_trade_jurisdiction_reason:0 "靖海国的商埠收到东明商船带来的管辖主张。本朝须核对本港航路、税则与官署缺口，决定以透明规则、有限仲裁还是保留裁判回应，并承担相应的行政支出、关系与来例资格。"
 ywc_society.1450.t:0 "陌生的船照"
 ywc_society.1450.d:0 "东明商船进港，随船照会声称其船员纠纷应由该国领事依约审理。靖海国的港务官署先要决定：这份照会是入档受理，还是扣照待查，或径行拒收。"
 ywc_society.1450.register:0 "受理登记，照会入档"
 ywc_society.1450.register.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1450.register.consequence_tooltip:0 "照会入档，东明收到交涉请求；等待期自本月起算。"
 ywc_society.1450.custody:0 "扣照待查，先按本地章程看管"
 ywc_society.1450.custody.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1450.custody.consequence_tooltip:0 "照会被扣查验，仍通知东明；等待期自本月起算。"
 ywc_society.1450.decline:0 "拒收照会，按旧例自行裁断"
 ywc_society.1450.decline.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1450.decline.consequence_tooltip:0 "本案直接进入裁决：是否承认优先权由本朝自定。"
 ywc_society.1450.wait:0 "暂缓，重新核对"
 ywc_society.1450.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1450.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1451.t:0 "商人请求本国交涉"
 ywc_society.1451.d:0 "照会入档的消息传回东明。本地商会请求本国出人交涉；东明的官署可以出资遣领事属员，也可以让商人自理，但本案不会因此停摆。"
 ywc_society.1451.negotiate:0 "付 500 遣领事属员交涉"
 ywc_society.1451.negotiate.cost_tooltip:0 "东明国库支付 500；不向靖海国转款。"
 ywc_society.1451.negotiate.consequence_tooltip:0 "领事属员成行，靖海国收到答复并续审。"
 ywc_society.1451.refuse:0 "不垫付，商人自理"
 ywc_society.1451.refuse.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1451.refuse.consequence_tooltip:0 "东明不出人，靖海国收到答复并续审。"
 ywc_society.1451.wait:0 "暂缓答复"
 ywc_society.1451.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1451.wait.consequence_tooltip:0 "记录本次决定；悬而不决逾半年，照会将作过期收束。"
 ywc_society.1451.withdraw:0 "对方已结案，撤回请求"
 ywc_society.1451.withdraw.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1451.withdraw.consequence_tooltip:0 "撤回本国请求，仅清理本案挂起记录。"
 ywc_society.1452.t:0 "本地关税的依据"
 ywc_society.1452.d:0 "审理之前，税则与讼费先要有个说法。靖海国可以付资颁布透明税则，也可以只设一庭有限仲裁，或干脆不出依据、保留旧例。"
 ywc_society.1452.publish:0 "付 500 颁布透明税则"
 ywc_society.1452.publish.cost_tooltip:0 "靖海国国库支付 500。"
 ywc_society.1452.publish.consequence_tooltip:0 "税则颁行，本案按透明规则续审。"
 ywc_society.1452.arbitrate:0 "付 200 设有限仲裁庭"
 ywc_society.1452.arbitrate.cost_tooltip:0 "靖海国国库支付 200。"
 ywc_society.1452.arbitrate.consequence_tooltip:0 "只设一庭有限仲裁，不颁布一般税则。"
 ywc_society.1452.decline:0 "不出依据，保留旧例"
 ywc_society.1452.decline.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1452.decline.consequence_tooltip:0 "本案跳过席次一节，直接进入裁决。"
 ywc_society.1452.wait:0 "暂缓，重新核对"
 ywc_society.1452.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1452.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1453.t:0 "法官与领事的席次"
 ywc_society.1453.d:0 "开庭在即。东明若已遣属员，可以准其列席并同席记档；若未遣人，或本朝不愿，则由法官独席审理，席次照旧例。"
 ywc_society.1453.seat_consul:0 "准领事属员列席记档"
 ywc_society.1453.seat_consul.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1453.seat_consul.consequence_tooltip:0 "席次同记，东明收到放货请求。"
 ywc_society.1453.bench_only:0 "法官独席，席次照旧"
 ywc_society.1453.bench_only.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1453.bench_only.consequence_tooltip:0 "席次照旧，东明收到放货请求。"
 ywc_society.1453.decline:0 "暂停审理程序"
 ywc_society.1453.decline.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1453.decline.consequence_tooltip:0 "审理暂停，直接进入裁决。"
 ywc_society.1453.wait:0 "暂缓，重新核对"
 ywc_society.1453.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1453.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1454.t:0 "货物等不起审理"
 ywc_society.1454.d:0 "舱货在泊位上日日生费。东明商人请求具结先行放货，或由货随案押、听候审理完结；两边都得承认，货物等不起一场漫长的审理。"
 ywc_society.1454.bail:0 "付 200 保证金，先行放货"
 ywc_society.1454.bail.cost_tooltip:0 "东明国库支付 200 保证金。"
 ywc_society.1454.bail.consequence_tooltip:0 "货物先放，靖海国收到答复并进入裁决。"
 ywc_society.1454.hold:0 "货随案押，候审完结"
 ywc_society.1454.hold.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1454.hold.consequence_tooltip:0 "货物随案，靖海国收到答复并进入裁决。"
 ywc_society.1454.wait:0 "暂缓答复"
 ywc_society.1454.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1454.wait.consequence_tooltip:0 "记录本次决定；悬而不决逾半年，照会将作过期收束。"
 ywc_society.1454.withdraw:0 "对方已结案，撤回请求"
 ywc_society.1454.withdraw.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1454.withdraw.consequence_tooltip:0 "撤回放货请求，仅清理本案挂起记录。"
 ywc_society.1455.t:0 "拒绝优先权的代价"
 ywc_society.1455.d:0 "到了裁决的时候：承认本案优先，送交对方签订仅限本案的约定；或拒绝优先权，按本地法一律办理，承担商路改道的代价。若对方已不可联系，也可自行结案。"
 ywc_society.1455.accept:0 "承认本案优先，送交签订"
 ywc_society.1455.accept.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1455.accept.consequence_tooltip:0 "拟定结果送东明签订；已颁税则记为全案接受，否则记为有限接受。"
 ywc_society.1455.refuse:0 "拒绝优先权，承担改道代价"
 ywc_society.1455.refuse.cost_tooltip:0 "靖海国国库承担 300 过境税损失。"
 ywc_society.1455.refuse.consequence_tooltip:0 "拒绝优先权结案，东明对靖海关系减少 5。"
 ywc_society.1455.alone:0 "对方已不可联系，自行结案"
 ywc_society.1455.alone.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1455.alone.consequence_tooltip:0 "已付过税则或仲裁费用的记为有限接受，否则记为保留裁判。"
 ywc_society.1455.wait:0 "暂缓，重新核对"
 ywc_society.1455.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1455.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1456.t:0 "仅限本案的约定"
 ywc_society.1456.d:0 "约定文本送到东明：税则、席次与放货安排只适用于本案。东明可以签订，也可以坚持把安排写成通例——那就要重新掂量这条航路。"
 ywc_society.1456.sign:0 "签订仅限本案的约定"
 ywc_society.1456.sign.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1456.sign.consequence_tooltip:0 "东明对靖海关系增加 5；靖海国收到签署回执。"
 ywc_society.1456.insist:0 "坚持写成通例"
 ywc_society.1456.insist.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1456.insist.consequence_tooltip:0 "东明对靖海关系减少 5；靖海国收到分歧回执。"
 ywc_society.1456.wait:0 "暂缓答复"
 ywc_society.1456.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1456.wait.consequence_tooltip:0 "记录本次决定；悬而不决逾半年，照会将作过期收束。"
 ywc_society.1456.withdraw:0 "对方已结案，撤回签署"
 ywc_society.1456.withdraw.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1456.withdraw.consequence_tooltip:0 "撤回签署，仅清理本案挂起记录。"
 ywc_society.1457.t:0 "下一次能否照此办理"
 ywc_society.1457.d:0 "本案已了。靖海国的官署把结果记入档册：来例是否照此办理，由本朝自定；东明那边也记下同一份结果。"
 ywc_society.1457.confirm:0 "照此办理，记为来例"
 ywc_society.1457.confirm.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1457.confirm.consequence_tooltip:0 "按拟定结果结案，来例可循，双方档册各记一份。"
 ywc_society.1457.discontinue:0 "不设来例，就此存档"
 ywc_society.1457.discontinue.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1457.discontinue.consequence_tooltip:0 "按拟定结果结案，但不设来例，双方档册各记一份。"
 ywc_society.1457.wait:0 "暂缓，重新核对"
 ywc_society.1457.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1457.wait.consequence_tooltip:0 "记录本次决定。"
