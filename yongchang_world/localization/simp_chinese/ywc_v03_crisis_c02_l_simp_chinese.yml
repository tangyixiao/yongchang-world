l_simp_chinese:
 ywc_je_v03_c02_blackwater_testimonies:0 "黑水两岸的证词"
 ywc_je_v03_c02_blackwater_testimonies_reason:0 "扣货点、渔场与边防争议各自指向不同的当事者。先查明实际所有者，再让对岸与担保人分别作答；每一份证词记在自己名下，谁也不能代签。"
 ywc_je_v03_c02_river_defense_ledger:0 "河防与边市的账"
 ywc_je_v03_c02_river_defense_ledger_reason:0 "河巡、仓储、征用与登记都要从当年账目里出：能付则全担，付不起则缩减，征粮必补或限缩，记账不赊欠。小国不必造远洋舰队，边民作证各有册可循。"
 ywc_je_v03_c02_spring_flood_agreement:0 "春汛之后的约定"
 ywc_je_v03_c02_spring_flood_agreement_reason:0 "履约的冲突要经复议再定：新官认哪些旧票、弱小一方留什么退路、先开哪一处边市，都写进同一份河道通告；开河时逐船核账，守约留名，失约记败。"
 ywc_crisis.1100.t:0 "一船货物，两张关票"
 ywc_crisis.1100.d:0 "同一条船上扣下的货，河岸两边各亮出一张关票。提案国逐项核对：扣货点归哪个口岸、哪张票仍有资格生效、货主究竟是谁；答案入册，不先罚没。"
 ywc_crisis.1100.identify_owner:0 "查明扣货点实际所有者"
 ywc_crisis.1100.identify_owner.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1100.identify_owner.consequence_tooltip:0 "扣货归属与有效关票入册，进入渔场与边防调查。"
 ywc_crisis.1100.record_both:0 "两票并记，归属留待对岸答复"
 ywc_crisis.1100.record_both.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1100.record_both.consequence_tooltip:0 "两张关票并行入册，货主认定推迟到复议。"
 ywc_crisis.1100.wait:0 "暂缓核对，重新查票"
 ywc_crisis.1100.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1100.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1101.t:0 "渔场不在军图上"
 ywc_crisis.1101.d:0 "军图上没有的渔场，却是两岸几代人的口粮。保渔场习惯权则补给让步、地方认可上升；优先军需则哨所得手、渔课受损。定案后对岸与担保人分别作答。"
 ywc_crisis.1101.fishery_custom:0 "保渔场习惯权，补给另行筹措"
 ywc_crisis.1101.fishery_custom.cost_tooltip:0 "无额外国库支出；军需补给另行承担。"
 ywc_crisis.1101.fishery_custom.consequence_tooltip:0 "渔场习惯权入册，地方认可上升；对岸与担保人分别作答，各方自决。"
 ywc_crisis.1101.military_first:0 "优先军需，渔课让于哨所"
 ywc_crisis.1101.military_first.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1101.military_first.consequence_tooltip:0 "军需优先入册，补给得手而渔课受损；对岸与担保人分别作答。"
 ywc_crisis.1101.wait:0 "暂缓定案"
 ywc_crisis.1101.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1101.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1102.t:0 "对岸的界碑"
 ywc_crisis.1102.d:0 "对岸国家自行答复：同意测界并共议边市，或只认边市不测界，或仍以旧界为准。界碑照旧立在原地，测不测、认不认，都记在对岸自己的册子上。"
 ywc_crisis.1102.agree_survey:0 "同意测界，边市同议"
 ywc_crisis.1102.agree_survey.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1102.agree_survey.consequence_tooltip:0 "测界与边市条款入册，随后承担河防预算；界碑不迁移。"
 ywc_crisis.1102.market_only:0 "只同意边市，界线仍循旧册"
 ywc_crisis.1102.market_only.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1102.market_only.consequence_tooltip:0 "只入边市条款，旧界照旧；河防预算随后自理。"
 ywc_crisis.1102.refuse:0 "测界边市俱不行，旧界为准"
 ywc_crisis.1102.refuse.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1102.refuse.consequence_tooltip:0 "不入此案，转入复议窗口；提案国不得代签，旧界照旧。"
 ywc_crisis.1102.wait:0 "暂缓答复"
 ywc_crisis.1102.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1102.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1103.t:0 "远方的担保人"
 ywc_crisis.1103.d:0 "有真实商路往来的远方之邦可以作答：以有限担保换市场条款，或无偿观望，或径行拒绝。担保只落在商路与关系上，不写不属于它的兵权。"
 ywc_crisis.1103.limited_guarantee:0 "以有限担保换市场条款"
 ywc_crisis.1103.limited_guarantee.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1103.limited_guarantee.consequence_tooltip:0 "担保条款入册：市场条件与关系改善，不涉兵权；随后承担河防预算份额。"
 ywc_crisis.1103.observe_free:0 "无偿观望，不入条款"
 ywc_crisis.1103.observe_free.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1103.observe_free.consequence_tooltip:0 "观望入册，不入任何条款；复议窗口开启时另作决定。"
 ywc_crisis.1103.refuse_guarantee:0 "拒绝担保，各守旧路"
 ywc_crisis.1103.refuse_guarantee.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1103.refuse_guarantee.consequence_tooltip:0 "拒绝入册，转入复议窗口；商路照旧通行。"
 ywc_crisis.1103.wait:0 "暂缓答复"
 ywc_crisis.1103.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1103.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1104.t:0 "巡船与粮仓"
 ywc_crisis.1104.d:0 "河巡、仓储与哨所守备都从当年收入开支。付得起则三项全担；付不起就缩减为边市仓廪一项。不要求小国造远洋舰队，也不许先享后付。"
 ywc_crisis.1104.pay_full:0 "三项全担，支付 600"
 ywc_crisis.1104.pay_full.cost_tooltip:0 "本国国库支付 600。"
 ywc_crisis.1104.pay_full.consequence_tooltip:0 "河巡、仓储与哨所如册设立；冬粮征用条款随后受验。"
 ywc_crisis.1104.pay_limited:0 "缩减为边市仓廪一项，支付 200"
 ywc_crisis.1104.pay_limited.cost_tooltip:0 "本国国库支付 200。"
 ywc_crisis.1104.pay_limited.consequence_tooltip:0 "只设边市仓廪，河巡与哨所缺额记入结算，只能确认局部协议。"
 ywc_crisis.1104.wait:0 "暂缓，重新核账"
 ywc_crisis.1104.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1104.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1105.t:0 "谁替边民作证"
 ywc_crisis.1105.d:0 "征役、渔课与关卡过货都须边民作证。社群共同登记则税收兑现顺利、争议减少；官署单独裁决则征役快而怨望多。册子立在边民手里，不在军图上。"
 ywc_crisis.1105.joint_register:0 "社群共同登记"
 ywc_crisis.1105.joint_register.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1105.joint_register.consequence_tooltip:0 "共同登记入册：税收兑现顺利，征役争议减少；结算时可确认本方条款。"
 ywc_crisis.1105.office_adjudication:0 "官署单独裁决"
 ywc_crisis.1105.office_adjudication.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1105.office_adjudication.consequence_tooltip:0 "官署裁决入册：征役较快而怨望记档，税收兑现打折。"
 ywc_crisis.1105.wait:0 "暂缓定册"
 ywc_crisis.1105.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1105.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1106.t:0 "被征走的冬粮"
 ywc_crisis.1106.d:0 "军需紧迫，冬粮要被征走。全额补偿则边民与邻邦关系得保；限缩征调则省下银钱而征役受损。账目照实承担，不转嫁不拖欠。"
 ywc_crisis.1106.compensate_grain:0 "补偿冬粮，支付 400"
 ywc_crisis.1106.compensate_grain.cost_tooltip:0 "本国国库支付 400。"
 ywc_crisis.1106.compensate_grain.consequence_tooltip:0 "军需照得，补偿入账；地方与对岸关系改善，旧票仍有效力。"
 ywc_crisis.1106.narrow_requisition:0 "限缩征调，只取营中所需"
 ywc_crisis.1106.narrow_requisition.cost_tooltip:0 "无额外国库支出；补给受损记入册。"
 ywc_crisis.1106.narrow_requisition.consequence_tooltip:0 "征调缩而银钱省，地方认可受损；复议时须直面履约缺口。"
 ywc_crisis.1106.wait:0 "暂缓征调"
 ywc_crisis.1106.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1106.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1107.t:0 "新官不认旧票"
 ywc_crisis.1107.d:0 "口岸换防、官署易人，旧票还认不认？新控制者与原当事者各自确认：条款继续有效，或缩为边市一条，或径行退出。谁也不能把旧主复活，地图不重画。"
 ywc_crisis.1107.reaffirm_clauses:0 "确认旧票仍有效，条款照行"
 ywc_crisis.1107.reaffirm_clauses.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1107.reaffirm_clauses.consequence_tooltip:0 "条款确认照行，进入边市确认或结算；不重画地图。"
 ywc_crisis.1107.market_only_clauses:0 "旧票缩为边市一条"
 ywc_crisis.1107.market_only_clauses.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1107.market_only_clauses.consequence_tooltip:0 "其余条款停用，仅边市照行；结算只能确认局部协议。"
 ywc_crisis.1107.withdraw_case:0 "退出此案，旧例自理"
 ywc_crisis.1107.withdraw_case.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1107.withdraw_case.consequence_tooltip:0 "以主动退出结案，容量名额释放；旧例照行，不结兵怨。"
 ywc_crisis.1107.wait:0 "暂缓确认"
 ywc_crisis.1107.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1107.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1108.t:0 "先开一处边市"
 ywc_crisis.1108.d:0 "全线安排无人担得起，两岸各自确认先开一处真实可用的边市：地点、税则与开市日期入册。对面确认则河道通告可以开印，对面迟迟不认则自定出口。"
 ywc_crisis.1108.confirm_market:0 "确认先开一处边市"
 ywc_crisis.1108.confirm_market.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1108.confirm_market.consequence_tooltip:0 "边市确认入册；对面已认则河道通告开印，未认则候其确认。"
 ywc_crisis.1108.insist_full_line:0 "坚持全线安排，不开单市"
 ywc_crisis.1108.insist_full_line.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1108.insist_full_line.consequence_tooltip:0 "全线主张入册而单市不开；限期不至则按自定出口结算。"
 ywc_crisis.1108.wait:0 "暂缓确认"
 ywc_crisis.1108.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1108.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1109.t:0 "哨所之外的退路"
 ywc_crisis.1109.d:0 "弱小一方自择退路：以节制名义入约，或另择伙伴退出此案，或暂停再议。拒约不致灭国，退出不留兵怨；条款示于人前，路留在自己脚下。"
 ywc_crisis.1109.restrained_join:0 "单边节制，以局部名义入约"
 ywc_crisis.1109.restrained_join.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1109.restrained_join.consequence_tooltip:0 "以局部名义入册：地方国先理登记，他方候结算；负担自选自担。"
 ywc_crisis.1109.alternative_partner:0 "另择伙伴，退出此案"
 ywc_crisis.1109.alternative_partner.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1109.alternative_partner.consequence_tooltip:0 "以主动退出结案，容量名额释放；另择伙伴只记册，不结兵怨。"
 ywc_crisis.1109.wait:0 "暂停答复，再议退路"
 ywc_crisis.1109.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1109.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1110.t:0 "河道共同通告"
 ywc_crisis.1110.d:0 "对账之日到了：实付与登记俱在者确认完整河道安排；有一项不齐者确认局部互市；两项皆虚者保留现状。通告印在纸上，不印在刀兵上。"
 ywc_crisis.1110.confirm_full:0 "确认完整河道安排"
 ywc_crisis.1110.confirm_full.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1110.confirm_full.consequence_tooltip:0 "完整河道安排入册，等待开河核验；各船各票照册通行。"
 ywc_crisis.1110.confirm_limited:0 "确认局部互市条款"
 ywc_crisis.1110.confirm_limited.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1110.confirm_limited.consequence_tooltip:0 "局部互市入册：边市照开，缺项记入余波。"
 ywc_crisis.1110.keep_status_quo:0 "保留现状，旧账旧例"
 ywc_crisis.1110.keep_status_quo.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1110.keep_status_quo.consequence_tooltip:0 "以保留现状结案，容量名额释放；旧账旧例照行。"
 ywc_crisis.1110.wait:0 "暂缓对账"
 ywc_crisis.1110.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1110.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_crisis.1111.t:0 "开河时的第一批船"
 ywc_crisis.1111.d:0 "开河的日子到了，第一批船过市。通告上的承诺逐条受验：巡船在、仓廪实、边市开，则守约留名；有一项落空，就如实记败。核账回写各方国别册。"
 ywc_crisis.1111.audit_kept:0 "核验承诺落实，守约留名"
 ywc_crisis.1111.audit_kept.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1111.audit_kept.consequence_tooltip:0 "守约记录回写各方国别册，容量名额释放；河道与边市照册通行。"
 ywc_crisis.1111.admit_broken:0 "承认承诺落空，如实记败"
 ywc_crisis.1111.admit_broken.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1111.admit_broken.consequence_tooltip:0 "失约如实记录，已付各款留档；不追为兵端，余地照留。"
 ywc_crisis.1111.wait:0 "暂缓核验"
 ywc_crisis.1111.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_crisis.1111.wait.consequence_tooltip:0 "记录本次决定。"
