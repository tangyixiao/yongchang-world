 ywc_kor.1009.withdraw:0 "兑现失败时撤回未付承诺"
 ywc_kor.1009.withdraw.cost_tooltip:0 "停止未付部分，已付和已签义务保留。"
 ywc_kor.1009.withdraw.consequence_tooltip:0 "失败改道仍接地方财政、官学、工匠和退役后续，不抹去军队。"
 ywc_kor.1030.t:0 "外聘教官的回函"
 ywc_kor.1030.d:0 "对方王廷收到朝鲜的定额询请。只有实际受邀国家可接受或拒绝；陈旧回函不改变任何账目。"
