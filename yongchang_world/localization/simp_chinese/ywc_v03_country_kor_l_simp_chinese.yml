 ywc_kor.1030.stale_dismiss:0 "搁置失效回函"
 ywc_kor.1030.stale_dismiss.cost_tooltip:0 "没有付款。"
 ywc_kor.1030.stale_dismiss.consequence_tooltip:0 "失效回函不改写新请求。"
 ywc_kor.1031.t:0 "教官合作的本地续议"
 ywc_kor.1031.d:0 "回函、超期和当期服务状态由朝鲜自行处理。已签余额不会因改走本地路线或退出军门而消失。"
 ywc_kor.1031.continue_status:0 "记下本次状态"
 ywc_kor.1031.continue_status.cost_tooltip:0 "此项不收费。"
 ywc_kor.1031.continue_status.consequence_tooltip:0 "保留现有负债和到期日。"
 ywc_kor.1031.fund_local:0 "资助本地译学"
 ywc_kor.1031.fund_local.cost_tooltip:0 "仅成功签本地合约后按原有12期付费。"
 ywc_kor.1031.fund_local.consequence_tooltip:0 "此项不核销任何外聘欠款，译学与老兵费用独立。"
