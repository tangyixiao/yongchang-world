 ywc_je_v03_kor_provincial_revenue_settlement_reason:0 "在朝鲜当前自有的一个试点州约定成文分税、中央统收或项目拨款，或明确选择保守有限目标。每一模式都有不同的现行税法、政府集团、在职公务与动荡条件。本步只登记政策与试点，真正立契与复核另需两次实付。"
