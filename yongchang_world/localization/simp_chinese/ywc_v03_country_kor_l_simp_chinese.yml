 ywc_kor.1030.accept.consequence_tooltip:0 "首个实际月度点验才启动12个月约期；每期实付给本国。"
 ywc_kor.1030.refuse:0 "拒绝出任教官"
 ywc_kor.1030.refuse.cost_tooltip:0 "不扣双方款项。"
