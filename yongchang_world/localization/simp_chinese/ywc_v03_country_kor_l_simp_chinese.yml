l_simp_chinese:
 ywc_je_v03_kor_military_audit:0 "点清军额与军粮"
 ywc_je_v03_kor_military_audit_reason:0 "选择王廷常备、各道分担或限额旧军。通过逐月真实状态检查连续观察六个月；坏月立刻清除计时。持续受阻12个月提示，36个月提供退出。无军队可用有岗官署继续有限边警。"
 ywc_je_v03_kor_service_settlement:0 "谁来维持新的军门"
 ywc_je_v03_kor_service_settlement_reason:0 "首轮通过后连续复核九个月；每个好月实际付款，任何坏月清除九个月计时。和平看训练、轮值与采购，战时先保供并可缩限；内政不因属邦化中断。"
 ywc_kor.1000.t:0 "名册上没有的守军"
 ywc_kor.1000.d:0 "军门有兵额，却没有列明军粮、军械和轮值由谁持续负担。若没有现役军队，本线改核官署边警与旧军额，不要求扩军。"
 ywc_kor.1000.court_supply:0 "王廷常备：统一调度"
 ywc_kor.1000.court_supply.cost_tooltip:0 "一次核额费为开启时年总收入÷52，最低100；军队日常费用由游戏军费预算承担。"
 ywc_kor.1000.court_supply.consequence_tooltip:0 "换得中央点验权；须维持职业军制、中档以上军饷与合格军营。固定开支最高。"
 ywc_kor.1000.provincial_share:0 "各道分担：保留报额权"
 ywc_kor.1000.provincial_share.cost_tooltip:0 "一次核额费为开启时年总收入÷52，最低100；军队日常费用由游戏军费预算承担。"
 ywc_kor.1000.provincial_share.consequence_tooltip:0 "中央月额较低，换取各道持续报账与核销权；军营和军饷条件仍真实核验。"
 ywc_kor.1000.limited_legacy:0 "限额旧军：降低目标"
 ywc_kor.1000.limited_legacy.cost_tooltip:0 "一次核额费为开启时年总收入÷52，最低100；不另设月度军粮税。"
 ywc_kor.1000.limited_legacy.consequence_tooltip:0 "不强迫扩军或改法；有军队时核验军营，无军队时走有岗且无短缺的官署边警通路。"
 ywc_kor.1000.defer_or_withdraw:0 "暂缓核额或结束本次登记"
 ywc_kor.1000.defer_or_withdraw.cost_tooltip:0 "暂缓不再扣费；结束时保留已付审计费。"
 ywc_kor.1000.defer_or_withdraw.consequence_tooltip:0 "资金恢复后可重试；结束会记录受挫并释放本国活动名额。"
 ywc_kor.1001.t:0 "粮饷走到哪一站"
 ywc_kor.1001.d:0 "核定州的军营必须实际有岗、军用品无短缺，国家预算也需能维持现有军费。这里不额外扣一笔虚构的月度军粮费。"
 ywc_kor.1001.pay_month:0 "维持核定月额并逐月实付"
 ywc_kor.1001.pay_month.cost_tooltip:0 "无额外月扣；军饷和供给支出按游戏真实军费/市场系统结算。"
 ywc_kor.1001.pay_month.consequence_tooltip:0 "只有真实预算、法律、军饷、就业与商品条件连续合格的月份才计入观察。"
 ywc_kor.1001.narrow:0 "缩小驻防与轮值范围"
 ywc_kor.1001.narrow.cost_tooltip:0 "无新一次性费；已付军费不返还。"
 ywc_kor.1001.narrow.consequence_tooltip:0 "后续按较小目标核验，不能把缩限当成满编或供给达标。"
 ywc_kor.1002.t:0 "各道交来的军额"
 ywc_kor.1002.d:0 "王廷常备要求统一报表；各道分担以核销权换取较低中央月额；旧军限额不扩张，也不承诺统一新编制。"
 ywc_kor.1002.court_roll:0 "王廷统一编册和点验"
 ywc_kor.1002.court_roll.cost_tooltip:0 "检查常备军实际预算。"
 ywc_kor.1002.court_roll.consequence_tooltip:0 "地方核销空间缩小；职业军法和军营供给仍由真实状态决定。"
 ywc_kor.1002.province_roll:0 "各道定额报送并保留核销"
 ywc_kor.1002.province_roll.cost_tooltip:0 "由各道方案读取实际预算能力。"
 ywc_kor.1002.province_roll.consequence_tooltip:0 "换得地方核销权；报表或供给断裂会阻止后续确立。"
 ywc_kor.1002.legacy_roll:0 "旧额封顶，不开新军额"
 ywc_kor.1002.legacy_roll.cost_tooltip:0 "保留最低月额，既有欠款照付。"
 ywc_kor.1002.legacy_roll.consequence_tooltip:0 "减少各道扩军负担，后续目标同步降低。"
 ywc_kor.1003.t:0 "书院先生的预算批注"
 ywc_kor.1003.d:0 "士林指出军费挤压官学和地方赈务。公开账目增加监督，密议保留调度却损害信任；缩减轮值可缓解预算但降低训练目标。"
 ywc_kor.1003.publish:0 "公开各道月账"
 ywc_kor.1003.publish.cost_tooltip:0 "不另收费；公开不退已付款。"
 ywc_kor.1003.publish.consequence_tooltip:0 "士林取得查账凭据，军门需解释月额；公开不会改善军营就业或消除短缺。"
 ywc_kor.1003.private:0 "由王廷密议，不公开明细"
 ywc_kor.1003.private.cost_tooltip:0 "不新增款项；仅记录密议信任欠账，不直接改变政治支持。"
 ywc_kor.1003.private.consequence_tooltip:0 "王廷保留机动，士林不获账簿；信任欠账只作为本线记录，不施加独立政治修正。"
 ywc_kor.1003.reduce_rotations:0 "缩减训练与轮值目标"
 ywc_kor.1003.reduce_rotations.cost_tooltip:0 "无新费用；缩限标记会改用实际在岗、无短缺的边警官署核验。"
 ywc_kor.1003.reduce_rotations.consequence_tooltip:0 "不再强求职业军法或合格军营；仍须连续观察官署运作，且只可按限额旧军收束。"
 ywc_kor.1004.t:0 "军械库门口的译学生"
 ywc_kor.1004.d:0 "本地译学可核对合同；大顺或靖海教官须由实际国家逐一同意。外聘不赠科技、兵员或物资。"
 ywc_kor.1004.fund_local:0 "资助本地译学与工匠清册"
 ywc_kor.1004.fund_local.cost_tooltip:0 "仅选后才签约；最多12期，合计不超过开启时一周收入；成功或退出后仍按月支付已签余期。"
 ywc_kor.1004.fund_local.consequence_tooltip:0 "每期真实扣款；资金不足月份暂停，成功或退出不抹余欠，累计已付不清零，到12期后停止。"
 ywc_kor.1004.offer_shu:0 "向大顺询请外聘教官"
 ywc_kor.1004.offer_shu.cost_tooltip:0 "询价与签约均不扣款；签约后总负债固定为开启时一周收入，分12期。"
 ywc_kor.1004.offer_shu.consequence_tooltip:0 "仅实际对方同意、双方官学与军营有岗且无短缺时签约；欠款仍保留，训练须当期已付且约期未满。"
 ywc_kor.1004.offer_jhg:0 "向靖海询请外聘教官"
 ywc_kor.1004.offer_jhg.cost_tooltip:0 "询价与签约均不扣款；签约后总负债固定为开启时一周收入，分12期。"
 ywc_kor.1004.offer_jhg.consequence_tooltip:0 "仅实际对方同意、双方官学与军营有岗且无短缺时签约；欠款仍保留，训练须当期已付且约期未满。"
 ywc_kor.1004.narrow_orders:0 "沿用旧作坊并缩小装备目标"
 ywc_kor.1004.narrow_orders.cost_tooltip:0 "不增加一次性费用，接受较低装备目标。"
 ywc_kor.1004.narrow_orders.consequence_tooltip:0 "不假设有进口伙伴或军工厂；真实商品短缺仍阻止供给核验。"
 ywc_kor.1005.t:0 "旧军户想要一份新差事"
 ywc_kor.1005.d:0 "军制变化影响实际服务家庭时，可支付限期转职名册与补助，也可保留有限边警轮值。无法确认相关人口时只核对退役名册，不虚构就业转移。"
 ywc_kor.1005.fund_transition:0 "支付转职名册与期限补助"
 ywc_kor.1005.fund_transition.cost_tooltip:0 "自愿转职补助最多12期，合计一周收入；签约后的余期即使成功或退出仍按月到期。"
 ywc_kor.1005.fund_transition.consequence_tooltip:0 "已付累计不会因恢复或重审清零；成功或退出不抹已签余欠，资金不足时暂停到有款再付。"
 ywc_kor.1005.retain_border:0 "保留旧军户的部分边警轮值"
 ywc_kor.1005.retain_border.cost_tooltip:0 "减少补助支出，仍需支付较小月额。"
 ywc_kor.1005.retain_border.consequence_tooltip:0 "保留传统服务关系并降低目标；若军法或军营条件失格，可凭有岗无短缺的边警官署连续核验；不改法律、军队或领土。"
 ywc_kor.1005.refuse_stipend:0 "暂不新增补助义务"
 ywc_kor.1005.refuse_stipend.cost_tooltip:0 "不增加费用，旧账照付。"
 ywc_kor.1005.refuse_stipend.consequence_tooltip:0 "退役家庭没有本线补助，但后续仍可重谈；不会抹去实际退役。"
 ywc_kor.1006.t:0 "第一轮点验之后"
 ywc_kor.1006.d:0 "只有连续六个月保持真实执行条件后，才可进入九个月续审。任何坏月立即清除计时。12个月持续受阻时提示，36个月提供退出；常规军费仍按游戏本体结算。"
 ywc_kor.1006.begin_renewal:0 "确认连续六个月点验，进入九个月续审"
 ywc_kor.1006.begin_renewal.cost_tooltip:0 "不收第二次核额费；正常军费按游戏本体结算。"
 ywc_kor.1006.begin_renewal.consequence_tooltip:0 "只有六个月计时完成且当前条件仍好才开启续审；提前改法不替代六个月。"
 ywc_kor.1006.narrow_or_wait:0 "缩限或等待条件恢复"
 ywc_kor.1006.narrow_or_wait.cost_tooltip:0 "已付账不退；未通过真实条件的月份不收费也不计时。"
 ywc_kor.1006.narrow_or_wait.consequence_tooltip:0 "保留现有军队与法律；坏月清零后按缩限月额，重新连续观察六个月。"
 ywc_kor.1006.withdraw:0 "撤回未付新承诺"
 ywc_kor.1006.withdraw.cost_tooltip:0 "停止未付部分；保留已付款项和已登记补助。"
 ywc_kor.1006.withdraw.consequence_tooltip:0 "受挫改道，不解散军队、不改法律，仍可接续地方财政与退役后续。"
 ywc_kor.1007.t:0 "釜山货单上的军用品"
 ywc_kor.1007.d:0 "续审期检查港市工匠或内地作坊的真实报价。此处不会造库存、建工厂或开贸易路线；外部伙伴缺席时内部审计继续。"
 ywc_kor.1007.fund_invoice_review:0 "支付货单核价并维持月额"
 ywc_kor.1007.fund_invoice_review.cost_tooltip:0 "只有选择真实核价服务才一次性支付一周收入；不生成军用品。"
 ywc_kor.1007.fund_invoice_review.consequence_tooltip:0 "登记已付款核价，不会授予装备；商品短缺仍阻止通过。"
 ywc_kor.1007.current_workshops:0 "按现有作坊能力缩小采购"
 ywc_kor.1007.current_workshops.cost_tooltip:0 "不增一次性费用，目标降低。"
 ywc_kor.1007.current_workshops.consequence_tooltip:0 "真实市场和建筑决定产能；供给不够时仍须缩限或退出。"
 ywc_kor.1007.quote_shu:0 "向大顺询购军用品"
 ywc_kor.1007.quote_shu.cost_tooltip:0 "询价免费；不建立贸易路线，也不生成任何军用品。"
 ywc_kor.1007.quote_shu.consequence_tooltip:0 "大顺书面报价后，朝鲜另行决定是否按实际到货与固定总价签约。"
 ywc_kor.1007.quote_jhg:0 "向靖海询购军用品"
 ywc_kor.1007.quote_jhg.cost_tooltip:0 "询价免费；不建立贸易路线，也不生成任何军用品。"
 ywc_kor.1007.quote_jhg.consequence_tooltip:0 "靖海书面报价后，朝鲜另行决定是否按实际到货与固定总价签约。"
 ywc_kor.1008.t:0 "没有打仗的那一年"
 ywc_kor.1008.d:0 "和平时复核训练、轮值与采购；真实战争时转为战时报账，优先供给并允许缩限。战争不自动失败；属邦变化不打断内部日志。"
 ywc_kor.1008.peace_ledger:0 "按和平账册复核训练和轮值"
 ywc_kor.1008.peace_ledger.cost_tooltip:0 "不新增军队、训练或免费收入。"
 ywc_kor.1008.peace_ledger.consequence_tooltip:0 "九个月连续合格后才标记通过；和平本身不是通过条件。"
 ywc_kor.1008.wartime_ration:0 "战时保供并暂停非必要轮训"
 ywc_kor.1008.wartime_ration.cost_tooltip:0 "无额外月扣；战时暂停部分仍由真实军费系统处理。"
 ywc_kor.1008.wartime_ration.consequence_tooltip:0 "战时继续读短缺与预算；恢复后九个月计时重新开始。"
 ywc_kor.1008.restore_review:0 "缩限承诺并重新开始连续续审"
 ywc_kor.1008.restore_review.cost_tooltip:0 "已付款不返还；缩限后按较低真实月额重新观察九个月。"
 ywc_kor.1008.restore_review.consequence_tooltip:0 "保留军队、法律和旧合同；恢复计时须连续满足预算、工资、就业与供给条件。"
 ywc_kor.1008.recognize_default:0 "承认账款无法维持并退出"
 ywc_kor.1008.recognize_default.cost_tooltip:0 "停止未付款项，已付款和服务义务保留。"
 ywc_kor.1008.recognize_default.consequence_tooltip:0 "不强制解散军队，保留限额旧军与地方重谈入口。"
 ywc_kor.1009.t:0 "军门以后的国家账"
 ywc_kor.1009.d:0 "结算读取当前军法、军营就业、商品短缺、军饷、财政、地方报表和九个月连续审查。常备固定成本最高；各道方案以报账权换中央支出；限额旧军保留较小边警目标。"
 ywc_kor.1009.establish_court:0 "确立王廷常备供给"
 ywc_kor.1009.establish_court.cost_tooltip:0 "无结局奖金；固定费用仍由实际财政承担。"
 ywc_kor.1009.establish_court.consequence_tooltip:0 "不点击改法或增军；确认既有职业军法、合格军营和持续供给。"
 ywc_kor.1009.establish_provincial:0 "确立各道分担"
 ywc_kor.1009.establish_provincial.cost_tooltip:0 "无结局奖金；地方月账与报送义务保留。"
 ywc_kor.1009.establish_provincial.consequence_tooltip:0 "失去地方报账权或真实供给失格时不能确立。"
 ywc_kor.1009.establish_limited:0 "以限额旧军和边警收束"
