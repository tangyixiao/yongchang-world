l_simp_chinese:
 ywc_je_v03_t12_representation_pact:0 "共同负担要求共同发言"
 ywc_je_v03_t12_representation_pact_reason:0 "海路护航与边镇驻防的账目摊到本国头上，出钱者要求席位，东明以商路为凭观察议事并提出限制。双方各自独立记下维持、修订或退出，账房据此写成下一辈承接的约定。"
 ywc_society.1550.t:0 "出钱者要求席位"
 ywc_society.1550.d:0 "海路护航与边镇驻防的账目摊到了各省头上。纳税州府与商会联名陈情：既摊共同负担，就须共议席位；是否开放议事给邻国观审，须先定夺。"
 ywc_society.1550.convene:0 "公开议事，请东明派员观察"
 ywc_society.1550.convene.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1550.convene.consequence_tooltip:0 "大顺向东明发出请帖。若两国仍有往来，到第六次按月议事时还没有回信，这轮商议便告结束。"
 ywc_society.1550.closed:0 "闭门核算，不延外客"
 ywc_society.1550.closed.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1550.closed.consequence_tooltip:0 "不请观审，径入公共预算一节；东明记录上无观察一栏。"
 ywc_society.1550.wait:0 "暂缓，重新核对"
 ywc_society.1550.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1550.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1551.t:0 "给东明留的一把椅子"
 ywc_society.1551.d:0 "商船带回一封大顺的请帖。下回商议护航开支，请东明派人到场旁听。几家出过钱的商行一齐来见官，其中一家带来了上回的摊单。掌柜把纸翻了个面，背面空空的。“每家该出多少，正面都有。大人若问这数是怎么议出来的，叫我到哪一面去找？”"
 ywc_society.1551.send_observer:0 "派人去，把分摊的缘由听明白。"
 ywc_society.1551.send_observer.cost_tooltip:0 "东明国库支出 300，供使者成行。"
 ywc_society.1551.send_observer.consequence_tooltip:0 "东明派员旁听，大顺收到回信后审议预算。"
 ywc_society.1551.decline_observer:0 "照旧约通商，这次不派人。"
 ywc_society.1551.decline_observer.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1551.decline_observer.consequence_tooltip:0 "东明谢绝邀请，大顺收到回信后自行审议预算。"
 ywc_society.1551.wait:0 "回信先缓一缓。"
 ywc_society.1551.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1551.wait.consequence_tooltip:0 "大顺继续等候。若两国仍有往来，发帖后第六次按月议事时还没有回信，这轮商议便告结束。"
 ywc_society.1551.withdraw:0 "大顺已不等回信，收起请帖吧。"
 ywc_society.1551.withdraw.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1551.withdraw.consequence_tooltip:0 "东明不再答复这封请帖。"
 ywc_society.1552.t:0 "驿路与护航的拨款"
 ywc_society.1552.d:0 "驿丞呈上京畿道路的修补清单。掌海运的官员翻出一条旧例，护航船若在本国港口装货，朝廷也能从这笔银子里拨给码头添办人手物料。两处照旧领款的话，这笔钱就留在库里。"
 ywc_society.1552.services_first:0 "拨款修整京畿驿路"
 ywc_society.1552.services_first.cost_tooltip:0 "大顺国库一次支付 @money!800。"
 ywc_society.1552.services_first.consequence_tooltip:0 "首都所在州的基础设施提高 1，持续 180 天。"
 ywc_society.1552.defense_share:0 "拨款补给护航船队"
 ywc_society.1552.defense_share.cost_tooltip:0 "大顺国库一次支付 @money!800。"
 ywc_society.1552.defense_share.consequence_tooltip:0 "在大顺港口用工达到三成的州中，拨款时 GDP 最高的一个州获得港口吞吐量 +5%，持续 180 天。"
 ywc_society.1552.even_split:0 "按现行定额平摊，不加征"
 ywc_society.1552.even_split.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1552.even_split.consequence_tooltip:0 "驿路和港口维持原有经费，本期不另行动工。"
 ywc_society.1552.wait:0 "暂缓，重新核对"
 ywc_society.1552.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1552.wait.consequence_tooltip:0 "两笔拨款都先搁置，等下次议事再选。"
 ywc_society.1553.t:0 "军户来问归乡钱"
 ywc_society.1553.d:0 "军户推举一人到衙门递状。信上写着兵名和家里垫过的路费，最后问了一句：等人回来，这钱是营里出，还是家里出？"
 ywc_society.1553.home_bounty:0 "付 500 发归乡安置与欠饷"
 ywc_society.1553.home_bounty.cost_tooltip:0 "本国国库支付 500。"
 ywc_society.1553.home_bounty.consequence_tooltip:0 "欠饷与安置照发；请东明就共同协作提出限制。"
 ywc_society.1553.record_pledge:0 "记入来例，欠饷分期清偿"
 ywc_society.1553.record_pledge.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1553.record_pledge.consequence_tooltip:0 "欠饷记为分期，不入本期账；请东明提出限制。"
 ywc_society.1553.defer_agenda:0 "移入共同协作议程一并议"
 ywc_society.1553.defer_agenda.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1553.defer_agenda.consequence_tooltip:0 "兵员诉求并入协作议程；请东明提出限制。"
 ywc_society.1553.wait:0 "暂缓，重新核对"
 ywc_society.1553.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1553.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1554.t:0 "小盟友提出限制"
 ywc_society.1554.d:0 "东明的观察员把摊款账目带回吕宋。商行请求本国提出书面限制：摊款按年核定、护航以商路为界；也可以不设限制，照现行账目继续。"
 ywc_society.1554.propose_limits:0 "付 200 提出书面限制"
 ywc_society.1554.propose_limits.cost_tooltip:0 "东明国库支付 200；不向本国转款。"
 ywc_society.1554.propose_limits.consequence_tooltip:0 "限制文本随账目送回；本国收到答复并续审紧急权力一节。"
 ywc_society.1554.no_limits:0 "不设限制，照现行账目继续"
 ywc_society.1554.no_limits.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1554.no_limits.consequence_tooltip:0 "不设限制；本国收到答复并续审紧急权力一节。"
 ywc_society.1554.wait:0 "暂缓答复"
 ywc_society.1554.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1554.wait.consequence_tooltip:0 "记录本次决定；悬而不决逾半年，本轮作过期收束。"
 ywc_society.1554.withdraw:0 "对方已改程，撤回限制案"
 ywc_society.1554.withdraw.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1554.withdraw.consequence_tooltip:0 "撤回限制案，仅清理本轮挂起记录。"
 ywc_society.1555.t:0 "紧急权力何时结束"
 ywc_society.1555.d:0 "先前借去运粮的车马，到了日子该拿什么文书来领？出钱的人要把征发权的期限写进约里。营里请留一道余地，若仍在交战，或仍有陆军在动员，准再延一期。"
 ywc_society.1555.sunset_now:0 "定期限，到期即止"
 ywc_society.1555.sunset_now.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1555.sunset_now.consequence_tooltip:0 "紧急授权记为到期即止；进入双方独立裁决。"
 ywc_society.1555.extend_once:0 "战事或陆军动员未了，准延一期"
 ywc_society.1555.extend_once.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1555.extend_once.consequence_tooltip:0 "战事尚在或有陆军处于动员状态时，可把征发权延长一期。随后两国各自表决。"
 ywc_society.1555.wait:0 "暂缓，重新核对"
 ywc_society.1555.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1555.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1556.t:0 "维持、修订或退出协作"
 ywc_society.1556.d:0 "共同负担的账目摆在两家案头。本国与东明各自独立记下裁决：维持现行摊款与席次、修订条款，或退出协作；后裁定的一方收到先裁定一方的记录。"
 ywc_society.1556.maintain:0 "维持现行摊款与席次"
 ywc_society.1556.maintain.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1556.maintain.consequence_tooltip:0 "本国记为维持；东明未裁则候其独立裁决，已裁则一并结案。"
 ywc_society.1556.revise:0 "修订条款再续协作"
 ywc_society.1556.revise.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1556.revise.consequence_tooltip:0 "本国记为修订；东明未裁则候其独立裁决，已裁则一并结案。"
 ywc_society.1556.exit:0 "退出协作，各自记账"
 ywc_society.1556.exit.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1556.exit.consequence_tooltip:0 "本国记为退出；东明未裁则候其独立裁决，已裁则一并结案。"
 ywc_society.1556.wait:0 "暂缓，重新核对"
 ywc_society.1556.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1556.wait.consequence_tooltip:0 "记录本次决定。"
 ywc_society.1556.keep_terms:0 "东明记为维持"
 ywc_society.1556.keep_terms.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1556.keep_terms.consequence_tooltip:0 "东明记为维持，对本国关系增加 5；本国已裁则一并结案。"
 ywc_society.1556.revise_terms:0 "东明记为修订"
 ywc_society.1556.revise_terms.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1556.revise_terms.consequence_tooltip:0 "东明记为修订；本国已裁则一并结案。"
 ywc_society.1556.leave_pact:0 "东明记为退出"
 ywc_society.1556.leave_pact.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1556.leave_pact.consequence_tooltip:0 "东明记为退出，对本国关系减少 5；本国已裁则一并结案。"
 ywc_society.1556.delay:0 "暂缓答复"
 ywc_society.1556.delay.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1556.delay.consequence_tooltip:0 "记录本次决定；悬而不决逾半年，本轮作过期收束。"
 ywc_society.1556.withdraw:0 "对方已结案，撤回裁决"
 ywc_society.1556.withdraw.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1556.withdraw.consequence_tooltip:0 "撤回裁决，仅清理本轮挂起记录。"
 ywc_society.1557.t:0 "下一代继承的约定"
 ywc_society.1557.d:0 "裁决已齐。账房把本轮摊款、席次与限制写成一册：交由下一代照此办理，或只存档不设来例。东明自留一份记录；中途退出一方，下一轮不再当然有席。"
 ywc_society.1557.confirm:0 "照此办理，记为来例"
 ywc_society.1557.confirm.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1557.confirm.consequence_tooltip:0 "按双方裁决结案并记为来例，双方档册各记一份。"
 ywc_society.1557.discontinue:0 "不设来例，就此存档"
 ywc_society.1557.discontinue.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1557.discontinue.consequence_tooltip:0 "按双方裁决结案但不设来例，双方档册各记一份。"
 ywc_society.1557.wait:0 "暂缓，重新核对"
 ywc_society.1557.wait.cost_tooltip:0 "无额外国库支出。"
 ywc_society.1557.wait.consequence_tooltip:0 "记录本次决定。"
